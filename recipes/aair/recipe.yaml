# AAIR recipe. Format: recipes/_format/recipe-format.v0.2.yaml
# Domains, weights and subdomain headings checked against ISACA's official
# exam content outline on 2026-10-12. Headings are short labels only;
# "(e.g., ...)" examples from the outline are dropped.
# ISACA letters subdomains (1A-1F, 2A-2D, 3A-3F); the schema needs numbers, so
# 1A = 1.1, 1B = 1.2, ... 3F = 3.6.
# ISACA publishes no outline date; outline.version is the exam's launch date
# (ISACA press release, 2026-04-15). Revisit if a dated outline appears.
# Format: 90 questions is on the official outline page. Duration, scale and pass
# mark come from the owner (2026-10-12) and match ISACA's guide for its sister
# exam AAIA; the AAIR candidate guide PDF could not be read from here to confirm.
# Subdomain targets split each domain's share of bank.target_total evenly.

format_version: "0.2"

exam:
  id: aair
  name: "AAIR"
  issuer: "ISACA"
  disclaimer: "Independent practice material. Not affiliated with or endorsed by ISACA."
  outline:
    source_url: "https://www.isaca.org/credentialing/aair/aair-exam-content-outline"
    version: "2026-04-15"
    last_checked: "2026-10-12"

format:
  delivery: linear
  questions: 90
  duration_minutes: 150
  scoring: { scale: [200, 800], pass: 450 }
  question_types: [single_choice]

style:
  voice: "risk-practitioner, best-answer, scenario-based"
  options_per_question: 4
  rules:
    - "Exactly one best answer; distractors plausible, not absurd"
    - "Every distractor is a practice a competent professional would choose in some situation; the stem decides which is best. The key must not be guessable from the options alone (docs/content-rules.md, Distractors)"
    - "No 'all of the above' or 'none of the above'"
    - "Test judgment and application, not trivia recall"
    - "Frameworks and laws are named only generically or where widely public (e.g. a risk management framework, an AI regulation); never quote them"

domains:
  - id: d1
    name: "AI Risk Governance and Framework Integration"
    weight: 0.37            # 333 of 900 target questions
    subdomains:
      - { id: "1.1", title: "AI models, frameworks, strategies and use cases", target_questions: 56 }
      - { id: "1.2", title: "AI organizational processes and alignment", target_questions: 56 }
      - { id: "1.3", title: "AI ownership, oversight and accountability", target_questions: 56 }
      - { id: "1.4", title: "AI policies, procedures and organizational training", target_questions: 55 }
      - { id: "1.5", title: "AI regulatory compliance and legal considerations", target_questions: 55 }
      - { id: "1.6", title: "AI trustworthiness, ethical and societal implications", target_questions: 55 }
  - id: d2
    name: "AI Life Cycle Risk Management"
    weight: 0.21            # 189 of 900 target questions
    subdomains:
      - { id: "2.1", title: "AI design, development/procurement and documentation", target_questions: 48 }
      - { id: "2.2", title: "AI model training, testing and validation", target_questions: 47 }
      - { id: "2.3", title: "AI implementation, maintenance and decommissioning", target_questions: 47 }
      - { id: "2.4", title: "AI data and asset management", target_questions: 47 }
  - id: d3
    name: "AI Risk Program Management"
    weight: 0.42            # 378 of 900 target questions
    subdomains:
      - { id: "3.1", title: "AI risk scenario identification and assessment", target_questions: 63 }
      - { id: "3.2", title: "AI risk treatment strategies", target_questions: 63 }
      - { id: "3.3", title: "AI controls management", target_questions: 63 }
      - { id: "3.4", title: "AI risk metrics, monitoring and reporting", target_questions: 63 }
      - { id: "3.5", title: "AI supply chain risk management", target_questions: 63 }
      - { id: "3.6", title: "AI incident response, BIA, business continuity and disaster recovery", target_questions: 63 }

bank:
  target_total: 900
  difficulty_mix: { easy: 0.2, medium: 0.5, hard: 0.3 }
  review:
    independent_check: true
    retire_if_report_rate_above: 0.05
    flag_if_common_wrong_answer_above: 0.5

product:
  free_sample_per_domain: 10
  unlock: { price_chf: 29, access_days: 120 }
  readiness:
    min_answered: 450
    min_accuracy_per_domain: 0.75
  mock:
    questions: 90
    minutes: 150
    forms: 4
