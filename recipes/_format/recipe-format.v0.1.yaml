# Certification "recipe" format: one file per exam, draft v0.1
# The engine reads this file; nothing exam-specific lives in code.

exam:
  id: cissp
  name: "CISSP"                     # display name only
  issuer: "ISC2"
  disclaimer: "Independent practice material. Not affiliated with or endorsed by ISC2."
  outline:
    source_url: "https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline"
    version: "2024-04-15"           # effective date of the outline we built against
    last_checked: "2026-10-12"      # a scheduled task updates this and flags changes

format:                             # used to shape mock exams
  delivery: adaptive                # adaptive | linear
  questions: { min: 100, max: 150 } # CISSP CAT; AAIR would be a fixed 90
  duration_minutes: 180
  scoring: { scale: [0, 1000], pass: 700 }
  question_types: [single_choice]   # extendable later: multi_select, ordering

style:                              # tells the generator what "exam-like" means here
  voice: "managerial, best-answer, scenario-based"
  options_per_question: 4
  rules:
    - "Exactly one best answer; distractors plausible, not absurd"
    - "No 'all of the above' or 'none of the above'"
    - "Test judgment and application, not trivia recall"

domains:                            # weights from the official outline
  - id: d1
    name: "Security and Risk Management"
    weight: 0.16
    subdomains:                     # filled from the official outline, numbered as there
      - id: "1.1"
        title: "<from official outline>"
        target_questions: 40        # bank-size goal; the pipeline fills gaps
  - { id: d2, name: "Asset Security",                        weight: 0.10 }
  - { id: d3, name: "Security Architecture and Engineering", weight: 0.13 }
  - { id: d4, name: "Communication and Network Security",    weight: 0.13 }
  - { id: d5, name: "Identity and Access Management (IAM)",  weight: 0.13 }
  - { id: d6, name: "Security Assessment and Testing",       weight: 0.12 }
  - { id: d7, name: "Security Operations",                   weight: 0.13 }
  - { id: d8, name: "Software Development Security",         weight: 0.10 }

bank:
  target_total: 1500
  difficulty_mix: { easy: 0.2, medium: 0.5, hard: 0.3 }
  review:
    independent_check: true         # second pass verifies key, ambiguity, scope
    retire_if_report_rate_above: 0.05
    flag_if_common_wrong_answer_above: 0.5   # likely a bad key

product:
  free_sample_per_domain: 10
  unlock: { price_chf: 29, access_days: 120 }
  readiness:                        # when we tell a learner they look ready
    min_answered: 600
    min_accuracy_per_domain: 0.75

# ---------------------------------------------------------------
# Each question, stored separately and linked back to the recipe:
#
# - id: cissp-d1-1.1-0042
#   subdomain: "1.1"
#   difficulty: medium
#   stem: "..."
#   options: { A: "...", B: "...", C: "...", D: "..." }
#   answer: B
#   explanation: { why_correct: "...", why_not: { A: "...", C: "...", D: "..." } }
#   status: published               # draft | in_review | published | retired
#   outline_version: "2024-04-15"
