# Privacy check: keeps personal data and secrets out of the repository.
# Runs on every PR in every profile (personal-data rule in AGENTS.md; GOVERNANCE.md →
# Personal data and secrets where the repository has it). It fails when a PR commit is
# authored or committed with a personal email, when any PR commit adds a real email
# address to a file, a file name or a commit message, or when gitleaks finds a secret in
# the PR's commits. It checks every commit, not just the final diff, because history
# keeps what a later commit removes. Its log names commits and counts only, never paths
# or addresses, because the log may be public. A heuristic, not proof: it does not cover
# PR or issue text, binary files or every kind of personal data. A few seconds of Actions
# time per PR; no third-party actions.
name: Privacy check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Commit emails allowed on PR commits (extended regex). Add an agent's noreply
  # address here if it commits under its own identity.
  ALLOWED_COMMIT_EMAILS: '@users\.noreply\.github\.com$|^noreply@github\.com$|^noreply@anthropic\.com$|^noreply@openai\.com$'
  # Email addresses allowed in files and commit messages: placeholders and noreply addresses.
  ALLOWED_FILE_EMAILS: '@(example\.(com|org|net)|[a-z0-9.-]+\.(example|invalid|test|localhost)|users\.noreply\.github\.com|noreply\.github\.com)$|^noreply@'
  # Generated files that carry third-party package metadata.
  SKIP_FILES: '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|uv\.lock|poetry\.lock)$'
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Commit emails
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%h %ae %ce' "$BASE..$HEAD" \
            | awk '$2 !~ ENVIRON["ALLOWED_COMMIT_EMAILS"] || $3 !~ ENVIRON["ALLOWED_COMMIT_EMAILS"] { print $1 }')
          if [ -n "$bad" ]; then
            echo "::error::Commit(s) with an author or committer email that is not a noreply address: $(echo $bad)"
            echo "Configure your GitHub noreply address (GitHub → Settings → Emails) before committing."
            echo "To fix commits already pushed, recreate them with that address on a branch you own;"
            echo "follow the repository's own rules where they restrict rewriting (for example automated lesson branches)."
            echo "The addresses are not printed here because this log may be public."
            exit 1
          fi
          echo "All commit emails are noreply addresses."

      - name: Email addresses in PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # One diff per commit (an address added and later removed is still in history),
          # plus file names and commit messages. Prints "<commit>: <count> in <where>" only.
          { git log --no-merges --format='@@commit %h' -p --unified=0 --no-color --no-ext-diff "$BASE..$HEAD"
            git log --no-merges --format='@@commit %h%n@@message%n%B' "$BASE..$HEAD"; } > "$RUNNER_TEMP/commits.txt"
          awk '
            function scan(text, where,   e) {
              while (match(text, /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z][A-Za-z]+/)) {
                e = substr(text, RSTART, RLENGTH)
                if (tolower(e) !~ ENVIRON["ALLOWED_FILE_EMAILS"]) bad[commit ": " where]++
                text = substr(text, RSTART + RLENGTH)
              }
            }
            /^@@commit / { commit = $2; mode = "diff"; next }
            /^@@message$/ { mode = "message"; next }
            mode == "message" { scan($0, "commit message"); next }
            /^diff --git / { file = ""; next }
            /^(rename to|copy to) / { scan($0, "file name"); next }
            /^\+\+\+ / { file = substr($0, 5); sub(/^b\//, "", file); scan(file, "file name"); next }
            /^\+/ && file != "" && file !~ ENVIRON["SKIP_FILES"] { scan(substr($0, 2), "added lines") }
            END { for (k in bad) print k " (" bad[k] ")" }
          ' "$RUNNER_TEMP/commits.txt" | sort > "$RUNNER_TEMP/found.txt"
          rm "$RUNNER_TEMP/commits.txt"
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            echo "::error::PR commits add real email addresses. Remove them from every commit or use a placeholder (name@example.com)."
            echo "Commit: where (count). Paths and addresses are not printed because this log may be public."
            cat "$RUNNER_TEMP/found.txt"
            exit 1
          fi
          echo "No real email addresses added in any PR commit."

      - name: Secrets (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
          # --redact keeps any secret it finds out of this log.
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$BASE..$HEAD" --redact --no-banner
