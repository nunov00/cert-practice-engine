name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm coverage
      - name: Build the app for Cloudflare Workers (runs next build)
        run: pnpm --filter @cpe/app exec opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Cloudflare capacity (warns over budget, fails over Free limits)
        run: pnpm --filter @cpe/app run capacity
      - name: Deploy the visual refresh branch preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.head.ref == 'design/visual-refresh-oct2026' &&
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: app
        run: pnpm exec wrangler preview --name visual-refresh-oct2026 --ignore-base-config --message "Visual refresh $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  cleanup-visual-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'design/visual-refresh-oct2026' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the visual refresh branch preview
        working-directory: app
        run: pnpm exec wrangler preview delete --name visual-refresh-oct2026 --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
