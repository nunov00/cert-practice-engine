name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # validate --since needs the merge base with the PR's base branch
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - name: Difficulty calibration of new and changed questions
        if: github.event_name == 'pull_request'
        run: pnpm validate --since "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: pnpm calibration
      - run: pnpm coverage
      - name: Build the app for Cloudflare Workers (runs next build)
        run: pnpm --filter @cpe/app exec opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Cloudflare capacity (warns over budget, fails over Free limits)
        run: pnpm --filter @cpe/app run capacity
