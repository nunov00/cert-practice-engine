# Gitleaks settings for the privacy check (.github/workflows/privacy.yml). The lines in
# .github/privacy-selftest-cases must pass or fail as listed there (privacy-check-selftest.sh).
[extend]
useDefault = true

# gitleaks' generic-api-key rule mistakes localStorage key names for keys. The exception
# applies only to this one file AND to a `const ..._KEY = "cpe.<name>.v<n>";` line, so any
# other secret, in this file or elsewhere, is still reported.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "localStorage key names in the progress store"
condition = "AND"
paths = ['''^app/src/lib/progress\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const [A-Z_]*KEY = "cpe\.[a-z0-9-]+\.v[0-9]+";\s*$''']
