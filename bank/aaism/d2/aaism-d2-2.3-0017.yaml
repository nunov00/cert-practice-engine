stem: A firm is ending its contract with an AI transcription vendor. The contract requires deletion of 'customer
  data' at exit. The vendor fine-tuned a dedicated speech model on the firm's call recordings, which the firm does
  not plan to reuse. What should the security manager do before exit?
options:
  A: Get a deletion certificate covering the stored recordings
  B: Keep a copy of the recordings to retrain with a new vendor
  C: Confirm deletion covers the fine-tuned model and backups
  D: Revoke the vendor's access to the firm's systems at exit
answer: C
explanation:
  why_correct: A model fine-tuned on the recordings can retain and reveal their content, and 'customer data' may
    not clearly include it. Confirming that deletion covers the derived model and its backups closes the gap the
    contract wording leaves.
  why_not:
    A: Deleting the recordings is required, but a certificate limited to them leaves the derived model, which holds
      information from them, in place.
    B: The firm does not plan to reuse the model, and keeping extra copies of recordings adds exposure without addressing
      the vendor-held model.
    D: Revoking access is a normal exit step but does not remove data or models the vendor already holds.
