difficulty: hard
stem: The tolerance for a claims triage model is at most 1% of urgent claims misrouted. Each month, reviewers check 50 randomly
  chosen claims, of which only a few are urgent. What is the MAIN concern?
options:
  A: The sample cannot show whether the rate is within 1%
  B: Monthly checks are too infrequent for an urgent risk
  C: Reviewers may tend to agree with the model's routing
  D: The tolerance should be set by the board, not the owner
answer: A
explanation:
  why_correct: A 1% tolerance on urgent claims needs many urgent claims to test. A random sample of 50, with only a few urgent
    ones, will usually show zero errors whether the real rate is 0.5% or 5%, so the check gives false comfort.
  why_not:
    B: More frequent checks would help a little, but each would still be too small to measure a 1% rate.
    C: Automation bias in reviewers is a real concern, but even perfect reviewers could not judge the rate from so few urgent
      cases.
    D: Tolerances for a single model are usually set by its owner within the board's appetite. Nothing suggests this one was
      set wrongly.
