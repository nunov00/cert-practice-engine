stem: 'A board''s AI risk appetite is low for single events that harm many customers at once, and moderate for routine operating
  losses. One treatment can be funded this year: for chatbot pricing errors, costing about USD 400,000 a year in small refunds
  within budgeted losses, or for a retrieval flaw that could expose thousands of customers'' records in one rare event, expected
  at USD 150,000 a year. Which should be funded?'
options:
  A: The treatment for the retrieval flaw
  B: The treatment for the pricing errors
  C: Half of each treatment, to cut both risks
  D: Whichever treatment cuts more loss per dollar
answer: A
explanation:
  why_correct: 'The board''s low appetite is for exactly the kind of event the retrieval flaw could cause: one exposure affecting
    thousands of customers. The pricing errors are routine losses within budget and within the moderate appetite. Appetite,
    not expected annual loss alone, sets the priority; a rare, severe event can sit outside appetite even when its average
    yearly cost is lower.'
  why_not:
    B: The pricing errors have the larger expected annual loss, but they are small, routine and within budgeted losses, which
      the board's moderate appetite accepts.
    C: Splitting the money would leave the retrieval flaw only partly treated, while it is the risk outside appetite that
      needs a full treatment.
    D: Loss cut per dollar is a sound way to choose between risks of the same kind, but it rests on expected loss, which averages
      away the single severe event the board's low appetite is about.
