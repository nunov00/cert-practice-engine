id: aaism-d2-2.3-0062
subdomain: '2.3'
difficulty: hard
stem: An insurer is assessing a claims-summary vendor. The vendor's independent assurance report carves out the hosted model
  provider that processes each prompt, so the provider's controls are not tested in it. The provider gives its own assurance
  report to its customers' customers under a standard NDA. Contracting is due next month. What should the security manager
  do NEXT?
options:
  A: Require the vendor's next report to cover the provider's controls
  B: Add flow-down security terms for the provider to the vendor contract
  C: Send the provider a security questionnaire through the vendor
  D: Obtain the provider's report and map it to the carved-out controls
answer: D
explanation:
  why_correct: A carve-out means the vendor's report covers only part of the service, and evidence for the rest is available
    now. Reading the provider's own independent report, and checking that it covers the controls the vendor relies on and
    that the vendor runs the controls the provider expects of its customers, gives tested evidence before contracting.
  why_not:
    A: An inclusive report would cover both in one view, but it would arrive with the next reporting cycle, after contracting,
      and providers often decline to be included in a customer's report.
    B: Flow-down terms put obligations on the provider, but they give no evidence that its controls operate today.
    C: A questionnaire collects the provider's own statements, which are weaker evidence than its independently tested report.
