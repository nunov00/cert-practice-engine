stem: A utility's billing chatbot gives wrong answers in 1.2% of chats, within the 2% tolerance the risk owner set. A
  breakdown shows that chats in Polish, 5% of volume, are wrong 9% of the time, mostly about payment plans for customers
  in arrears. What should the risk manager do?
options:
  A: Keep it recorded as within tolerance and add a Polish-language KRI
  B: Report the Polish-language risk to the owner as above tolerance
  C: Retrain the model on Polish payment-plan chats
  D: Sample more Polish chats over the next quarter before acting
answer: B
explanation:
  why_correct: An overall rate can sit within tolerance while one group of customers suffers far more errors. For Polish
    speakers, many in arrears, the wrong-answer rate is well above tolerance on high-impact topics, so the owner must
    decide how to treat it.
  why_not:
    A: A new indicator would track the problem, but the Polish chats are already far above tolerance, so recording the risk
      as within tolerance misstates it and leaves no one deciding how to treat it.
    C: Retraining may be the right treatment, but choosing it before the owner has been told the risk is above tolerance
      skips the owner's decision on how to treat it.
    D: A segment that is 5% of all chats already gives a sizeable sample, and waiting a quarter leaves customers in arrears
      receiving wrong advice.
