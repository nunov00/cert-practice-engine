subdomain: '2.3'
difficulty: hard
stem: A CRM vendor's contract bars training its models on 'Customer Content' but lets it use 'Service Data', meaning data
  generated through use of the service, to improve its products. Its AI drafts sales emails from customer records, and the
  versions users edit and send are logged as Service Data. What should the security manager require?
options:
  A: Service Data used only in aggregated, de-identified form
  B: Logged drafts purged from Service Data after 30 days
  C: Notice before Service Data is used to train a new model
  D: Service Data narrowed to exclude Customer Content in any form
answer: D
explanation:
  why_correct: The edited drafts are customer content under another label, so the training bar can be bypassed through the
    definitions. Narrowing Service Data to exclude anything containing or derived from Customer Content closes that route
    in the contract itself, while the vendor keeps genuine usage data.
  why_not:
    A: De-identified aggregation removes identities, but the drafts also hold prices, deal terms and plans, which stay
      usable for training in aggregate form.
    B: A short retention period limits how long drafts are kept, but the vendor can train on them within 30 days, and
      a trained model keeps what it learned.
    C: Notice tells the firm when training happens, but the contract as written allows this use, so the firm would have
      no grounds to stop it.
