id: aaism-d2-2.3-0040
subdomain: '2.3'
difficulty: hard
stem: An insurer's model-serving stack depends on a small open-source tokeniser library. Its long-time maintainer has handed
  the project to a contributor with no track record, whose first release adds precompiled binary files. The insurer's pipeline
  takes new versions automatically once a vulnerability scan passes. What should the security manager do FIRST?
options:
  A: Plan a move to a commercially supported tokeniser library
  B: Scan the new release for known vulnerabilities before use
  C: Pin the current version until the new release is reviewed
  D: Ask the new maintainer to sign each release with a key
answer: C
explanation:
  why_correct: 'The risk is a takeover: an unknown party now controls what the insurer will install, and opaque binaries are
    a common place to hide a payload. Pinning the known version stops the automatic update pulling the new release into production,
    and gives time to review the change and decide whether the new maintainer can be trusted.'
  why_not:
    A: A supported library may be the right long-term answer, but a migration takes months, while the pipeline would take
      the new release now.
    B: A vulnerability scan looks for published flaws in known versions. A payload planted in a brand-new release has no published
      entry, and the pipeline already runs this scan.
    D: Signing proves a release came from whoever holds the key. The open question is whether the new maintainer, who would
      hold that key, can be trusted, so a signature does not answer it.
