subdomain: '2.3'
difficulty: hard
stem: A bank is assessing an AI summarisation vendor. The vendor's assurance report covers its application and staff but carves
  out the cloud provider that hosts the models and stores customer prompts, listing controls it expects that provider to run.
  What should the bank review NEXT?
options:
  A: The hosting provider's own report, against the listed controls
  B: The controls the report expects the bank itself to operate
  C: A bridge letter from the vendor that covers the hosting controls
  D: The vendor's plan to bring hosting into next year's report
answer: A
explanation:
  why_correct: The carved-out provider runs the systems where the models sit and prompts are stored, and the vendor's report
    does not test them; it only lists what the provider is expected to do. The provider's own report, checked for scope and
    against those listed controls, is the evidence that they operate.
  why_not:
    B: The controls a report expects customers to run are a standard review item, and the bank must operate them, but they
      cover the bank's own side, not the hosting where its prompts are stored.
    C: A bridge letter covers the gap between a report's period end and today. It is the vendor's own statement, and the vendor
      cannot vouch for controls it does not run.
    D: Bringing the provider into the vendor's scope would help next year, but the bank needs evidence about the hosting before
      it relies on the service now.
