stem: 'A law firm has completed due diligence on a cloud contract-review tool: documents stay in region, are not
  used for training, and one named subprocessor is used. The firm decides to proceed. What should the security manager
  do NEXT?'
options:
  A: Assess how the vendor handles client documents
  B: Write the diligence findings into contract terms
  C: Penetration test the tool once it is live
  D: Schedule periodic reviews of the vendor's assurance
answer: B
explanation:
  why_correct: Due diligence is finished and the decision to proceed is made. The vendor's statements on region,
    training use and subprocessors only protect the firm once they are binding, so the next step is to turn them
    into contract terms before client documents are sent.
  why_not:
    A: Assessing data handling is the first step for a new vendor, but the stem says due diligence is already complete.
    C: Testing after go-live has its place, but it comes after the contract is signed and the tool is in use.
    D: Ongoing monitoring is needed for the life of the relationship. It follows contracting rather than replacing
      it.
