id: aaism-d2-2.3-0057
subdomain: "2.3"
difficulty: hard
stem: A company installed smart cameras whose vendor AI analyses footage on the device. The vendor pushes model and
  firmware updates from its cloud, and the cameras verify each update's signature before installing it. The company's
  threat model assumes an attacker who takes over the update service can also push validly signed updates. The cameras
  sit on the main corporate network. Which control BEST reduces the risk from a compromise of the vendor's update
  service?
options:
  A: Require the vendor to sign updates with a hardware-protected key
  B: Isolate the cameras on a segment that reaches only the update service
  C: Disable automatic updates and install each one only after testing it
  D: Require a yearly independent assurance report on the vendor's update service
answer: B
explanation:
  why_correct: If the update service is compromised, a validly signed malicious update will install anyway. Isolating the
    cameras stops a compromised camera from moving laterally into the corporate network, whatever the update contains.
    It does not protect the footage the cameras already hold, but it contains the wider damage.
  why_not:
    A: The threat model assumes an attacker in the update service can already ship validly signed updates, so stronger key
      storage would not limit the impact.
    C: Testing may catch obvious faults, but a well-built malicious update can pass functional tests and then reach the
      corporate network.
    D: A yearly assurance report gives confidence in the vendor's controls but does nothing when those controls are
      bypassed.
