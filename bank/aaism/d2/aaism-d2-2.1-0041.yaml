difficulty: medium
stem: Red teamers got a bank's public chatbot to reveal another customer's balance in 2 of 1,000 attempts, so the risk team
  rated likelihood as rare. Anyone can open an account online and chat with the bot without limit. What is the MAIN flaw in
  this rating?
options:
  A: It rates a single attempt, not an attacker who keeps trying
  B: It rests on red team techniques rather than real attackers'
  C: It uses too few attempts to estimate so low a rate reliably
  D: It ignores that the leak could reach any customer's balance
answer: A
explanation:
  why_correct: Two in a thousand is an estimate of the chance per attempt. An attacker who can chat without limit can simply
    repeat the attack, and if later attempts succeed at a similar rate, a few hundred tries make success more likely than
    not. Likelihood should be judged for an attacker over the attempts they can make, which makes this leak likely for a
    determined attacker rather than rare.
  why_not:
    B: Real attackers may use other techniques, which adds uncertainty, but the measured rate already shows a working attack;
      the error lies in how that rate was turned into a likelihood.
    C: A thousand attempts gives only a rough estimate of a small rate, but even a precise per-attempt figure would mislead when
      attempts are unlimited.
    D: How many customers the leak can reach is part of impact, which should be rated too, but the rating in question is the
      likelihood.
