stem: An airline's assistant can issue travel vouchers, and customers confirm each voucher in the app. Red team
  role-play prompts talk it into issuing vouchers the customer is not entitled to in a small share of attempts.
  What should the security manager require before launch?
options:
  A: Rate limits on sessions with repeated refused requests
  B: An output classifier tuned to role-play responses
  C: Customer confirmation before each voucher is issued
  D: Entitlement checks on vouchers outside the model
answer: D
explanation:
  why_correct: The person exploiting the bypass is the customer, so a confirmation step they approve themselves
    does not stop it. A check outside the model that the customer is entitled to the voucher blocks the abuse whichever
    prompt technique gets past the safety filter.
  why_not:
    A: Rate limiting slows repeated probing, but a bypass that works early in a session still gets a voucher issued.
    B: An output classifier works on text, but the harm here is a tool action, and role-play responses can be varied
      to slip past it.
    C: Confirmation is a strong control when the risk is acting against the user's wishes. Here it already exists,
      and the customer confirming is the one gaining the voucher.
