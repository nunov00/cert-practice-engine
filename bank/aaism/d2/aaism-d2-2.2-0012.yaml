id: aaism-d2-2.2-0012
subdomain: '2.2'
difficulty: hard
stem: "An airline's customer assistant uses a vendor safety filter. Red team testing shows that role-play prompts get past the filter in a small share of attempts. The product owner says this rate is low enough to launch. What is the BEST response from the security manager?"
options:
  A: "Agree to launch, since no safety filter can block every bypass attempt"
  B: "Approve launch if the vendor commits to fix the bypass within 30 days"
  C: "Ask the red team to keep retesting until the bypass rate falls below one percent"
  D: "Judge the impact of a bypass and add controls in proportion to that impact"
answer: D
explanation:
  why_correct: "With many users, a low bypass rate still means some bypasses will succeed. The decision should rest on what a successful bypass can lead to, for example harmful advice, misuse of booking tools or data exposure, and on whether further layers such as output checks and limited tool permissions bring the risk within appetite."
  why_not:
    A: "No filter is perfect, which is exactly why the impact of a bypass must be assessed and other layers considered. Launching on the rate alone ignores impact."
    B: "A vendor fix date leaves the bypass open at launch and fixes only this technique. It still skips the question of what harm a bypass could do in the meantime."
    C: "An arbitrary rate target ignores impact. Repeated retesting also tends to tune the system to the test rather than reduce the risk."
