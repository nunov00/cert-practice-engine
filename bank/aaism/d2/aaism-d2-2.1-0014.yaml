id: aaism-d2-2.1-0014
subdomain: '2.1'
difficulty: medium
stem: A logistics firm's AI assistant reads inbound supplier emails and drafts replies. The team rated the likelihood of
  prompt injection as rare, because the assistant's logs show no attempts in a year. The logs record only errors and response
  times. What is the GREATEST concern with this rating?
options:
  A: The impact of an attack was not expressed in money terms
  B: The rating did not use industry data on attack frequency
  C: The rating was not reviewed by the second line of defence
  D: The evidence used cannot show whether attacks took place
answer: D
explanation:
  why_correct: Logs that do not record prompts or outputs cannot reveal an injection attempt. Finding none is therefore
    no evidence that none occurred. The assistant reads untrusted external email, so the rare rating may be badly wrong
    and the treatment chosen from it too weak.
  why_not:
    A: Money terms help comparison, but the rating error here is in likelihood, not in how impact is expressed.
    B: External data would help, but the core flaw is relying on evidence that could never show an attack.
    C: Challenge from the second line is good practice, but it is a process gap. The rating rests on blind evidence either
      way.
