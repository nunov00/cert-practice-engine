stem: A manufacturer's finance staff approve urgent supplier payments after a video call with the CFO. At a peer firm, attackers
  used a live deepfake of the CFO on such a call, and both required approvers joined it and released the payment. The treasurer
  wants a control that keeps working as deepfakes improve. Which control BEST fits?
options:
  A: Deepfake detection on the company's video-conferencing platform
  B: A call-back to the CFO on a number from the internal directory
  C: Training for finance staff to spot flaws in synthetic video
  D: A second finance approver for each urgent payment request
answer: B
explanation:
  why_correct: The attack works because the request and the proof of who is asking arrive on a channel the attacker set up.
    A call-back on a number taken from the company's own directory reaches the real CFO through a channel the attacker does
    not control, and it works however convincing the fake becomes.
  why_not:
    A: Detection tools catch some fakes, but they are in a race with generation tools, so their protection weakens as deepfakes
      improve, which is what the treasurer wants to avoid.
    C: Training helps against today's fakes, but the visible flaws it teaches are disappearing as tools improve, so it does
      not meet the treasurer's requirement.
    D: Dual approval is a sound payment control, but at the peer firm both approvers joined the faked call and were deceived
      together. A second person watching the same video adds little.
