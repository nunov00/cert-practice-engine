id: aaism-d2-2.2-0002
subdomain: '2.2'
difficulty: hard
stem: A card issuer's fraud model retrains weekly on disputes that investigators have confirmed. Customers see only
  approve or decline, but a declined payment can be retried at once with a changed amount or merchant, with no retry
  limit. Which threat should the threat model stress MOST?
options:
  A: Label poisoning through fabricated customer disputes
  B: Extraction of the model through repeated scoring queries
  C: Membership inference against cardholder training records
  D: Evasion by adjusting declined payments until approved
answer: D
explanation:
  why_correct: Unlimited instant retries turn every decline into free feedback. A fraudster can change the amount
    or merchant and try again until the model approves the payment. That is evasion at scoring time, and the retry
    design makes it cheap, so the threat model should stress it.
  why_not:
    A: Fabricated disputes are the classic poisoning path for a model that learns from dispute labels, but here
      investigators confirm each dispute before it becomes a label, which closes most of that path.
    B: Repeated queries can approximate a model, but a bare approve or decline answer makes extraction slow, and
      a fraudster gets approval faster by simply retrying until one payment passes.
    C: Membership inference is a privacy attack that relies on detailed outputs such as confidence scores. A binary
      approve or decline gives little to work with, and it does not lead to fraud getting through.
