id: aaism-d2-2.2-0001
subdomain: '2.2'
difficulty: hard
stem: An insurer's claims assistant uses a large language model, searches policy documents and opens tickets. Its
  design threat model was approved last month, and the build is now in staging. What should be done NEXT to find
  AI-specific weaknesses?
options:
  A: Threat model the data flows, trust boundaries and tool actions
  B: Run adversarial prompt and tool-call testing against the staged build
  C: Enable runtime logging of prompts, retrieved content and tool calls
  D: Map AI attack techniques from threat intelligence to the design
answer: B
explanation:
  why_correct: 'The design threat model is done and approved, and there is now a working build. The next way to
    find weaknesses is to attack it: adversarial prompts, injected content in documents and attempts to misuse the
    ticket tool. Testing checks whether the controls the threat model called for actually hold in the built system.'
  why_not:
    A: Threat modelling is the right first step at design, but the stem says it was completed and approved last
      month. Repeating it now would not show whether the built controls work.
    C: Runtime telemetry is needed to detect attacks in production. It records behaviour; it does not by itself
      find weaknesses before launch.
    D: Mapping threat intelligence to the design feeds the threat model, which is already complete. It identifies
      likely techniques but does not test the build against them.
