id: aaism-d2-2.3-0036
subdomain: '2.3'
difficulty: hard
stem: A law firm chose an AI document-review service because the firm holds the keys to its uploaded files and can
  revoke them to cut off the vendor at once in an incident. To speed up review, the service also builds a search index
  and a summary of each file in its own storage. What is the GREATEST limitation of this arrangement?
options:
  A: The service reads each file in plain form while processing it
  B: The firm's key service becomes a dependency for each review
  C: Revoking the keys leaves the index and summaries readable
  D: Vendor staff could copy files before a revocation takes effect
answer: C
explanation:
  why_correct: The firm chose the service for its kill switch. The keys cover the uploaded files, but the index and
    summaries are built from those files, carry much of their content and sit in the vendor's storage outside the firm's
    keys. Revoking the keys leaves those copies readable, so the switch does not cut the vendor off. The firm should require
    derived data under its keys too, or its deletion on revocation.
  why_not:
    A: Any hosted service has to decrypt data to work on it, which the firm accepted when it chose one. It does not stop
      revocation from cutting off access to the stored files afterwards.
    B: Depending on the key service is a real availability trade-off to plan for, but it is a running cost of the design,
      not a gap in the protection the firm chose it for.
    D: Copies made before revocation are a residual risk of any revocation scheme, handled by the vendor's access controls
      and monitoring. The index and summaries are a standing copy outside the switch even when staff behave.
