id: aaism-d2-2.2-0028
subdomain: '2.2'
difficulty: hard
stem: An operations assistant writes shell commands from engineers' requests, and a script runs each command on servers without
  review. Requests can include text pasted from tickets and logs. What is the BEST control?
options:
  A: Run the script under an account without root rights
  B: Run the assistant itself in an isolated container
  C: Allow only listed commands, under a restricted account
  D: Block model output that matches a list of dangerous commands
answer: C
explanation:
  why_correct: Model output is untrusted input to the shell, and pasted tickets can carry injected instructions. Allowing
    only listed commands, under an account with limited rights, contains the damage whatever the model produces.
  why_not:
    A: Dropping root rights helps, but any command the account can run, such as deleting its files or sending data out, is
      still allowed.
    B: Isolating the assistant protects the system it runs on, but the commands run on the servers, which stay exposed.
    D: A deny list blocks known dangerous commands, but harmful commands can be written in many forms the list does not cover.
