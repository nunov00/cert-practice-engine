id: aaism-d2-2.3-0007
subdomain: '2.3'
difficulty: hard
stem: An e-commerce company's AI recommendation vendor switched on generative features that send customer data to
  a new subprocessor. A targeted reassessment found the subprocessor unvetted and outside the contract. Amending
  the contract will take months. What should the security manager do FIRST?
options:
  A: Request the vendor's latest independent assurance report
  B: Amend the contract to cover the new subprocessor
  C: Reassess the vendor for the new features and subprocessor
  D: Have the generative features disabled until terms cover them
answer: D
explanation:
  why_correct: Customer data is flowing now to a subprocessor that has not been vetted and is not bound by the contract.
    Contract changes will take months, so the flow should be stopped first by turning off the features that cause
    it, and turned back on once terms are in place.
  why_not:
    A: An assurance report is useful evidence, but it is unlikely to cover the new subprocessor and does nothing
      about the data already flowing.
    B: The contract does need amending, but that takes months, and data keeps going to the unvetted subprocessor
      in the meantime.
    C: Reassessment is the usual response to a vendor change, but the stem says a targeted reassessment has already
      been done.
