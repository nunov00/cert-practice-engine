id: aaism-d2-2.2-0016
subdomain: '2.2'
difficulty: medium
stem: A retailer's bug bounty treats jailbreaks as model behaviour and out of scope. A researcher shows, using two
  test accounts they own, a jailbreak that makes the retailer's shopping agent call its order tool and return the
  other account's address. What should the security manager do?
options:
  A: Fix it as a quality defect outside the bounty
  B: Add an output filter that blocks addresses in replies
  C: Triage it as a vulnerability by its data impact
  D: Add the prompt to the model's refusal training set
answer: C
explanation:
  why_correct: Whatever the technique, the result is access to another customer's data through the retailer's own
    tool integration. Triaging it as a vulnerability by impact gets it the right priority and fix, starting with
    how the order tool authorises lookups, and shows the scope rules need revisiting.
  why_not:
    A: Treating it as a quality defect gives a data access flaw the wrong priority and leaves the scope rule that
      hid it unchanged.
    B: A filter hides addresses in replies but leaves the agent able to fetch other customers' orders, and other
      fields could still leak.
    D: Refusal training may block this prompt, but the agent's access to other customers' data remains open to the
      next variant.
