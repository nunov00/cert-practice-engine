id: aaism-d2-2.2-0060
subdomain: '2.2'
difficulty: hard
stem: Developers at a software firm add tool servers to their coding agents by installing them by name from a public registry.
  The servers run on the developers' laptops as ordinary local programs, alongside their source code and cloud credentials.
  Which threat should the threat model stress MOST?
options:
  A: Instructions planted in tool descriptions that steer the agent
  B: Files the agent reads being sent to a remote tool operator
  C: Malicious package code running with the developer's own rights
  D: An agent calling more tools than the developer's task requires
answer: C
explanation:
  why_correct: A package installed by name from a public registry and run as a local program executes whatever code it contains
    with the developer's own rights. It can read source code and cloud credentials directly, without needing to fool the model,
    so it is the widest and most direct path to compromise here.
  why_not:
    A: Tool-description injection is a real agent threat, but it works through the model and is limited to what the agent
      can be talked into, while malicious package code acts directly on the laptop.
    B: Sending data to a remote operator matters for hosted tools, but these servers run locally, so the stronger concern
      is the code itself rather than a third party receiving files.
    D: Excess tool use is a least-privilege concern, but it assumes the tools are benign. Here a tool could be hostile code
      with the developer's full rights.
