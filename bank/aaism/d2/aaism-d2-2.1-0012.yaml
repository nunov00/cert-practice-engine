stem: A food company has turned the board's low appetite for customer-affecting AI errors into impact tiers. Internal-only
  uses fall in the lowest tier, governed by the acceptable use policy. Marketing asks to use generative AI to draft
  internal campaign ideas. What should the security manager do?
options:
  A: Approve it under the AI acceptable use policy
  B: Derive impact thresholds from the appetite statement
  C: Add customer error limits to the acceptable use policy
  D: Ask the board whether the statement covers it
answer: A
explanation:
  why_correct: The appetite has already been made operational, and this use sits in the lowest tier. Applying the
    agreed criteria lets low-impact work go ahead without extra review.
  why_not:
    B: Turning appetite into criteria is the right step when none exist. The tiers are already in place.
    C: Strict error limits are for uses that reach customers. Internal drafts sit in the lowest tier, and the policy
      already governs them.
    D: The board sets appetite; applying it to single requests is management's job, and the tiers already answer
      the question.
