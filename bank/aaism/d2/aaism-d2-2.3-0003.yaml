subdomain: '2.3'
difficulty: medium
stem: A telecom's fraud screening uses a provider's model API. Its contract gives change notice and version pinning,
  but pinned versions are retired 30 days after a successor ships. The telecom needs 90 days to validate a version
  on its fraud cases. Which contract change MOST reduces risk?
options:
  A: Service credits for periods when the API is unavailable
  B: Access to the provider's evaluation reports for each version
  C: Advance notice of model changes and version pinning
  D: Support for each pinned version for six months
answer: D
explanation:
  why_correct: Pinning only helps if the pinned version stays available long enough to validate its successor. With
    30 days of support against a 90-day validation, the telecom will be forced onto an unvalidated model. A six-month
    support period covers the validation time.
  why_not:
    A: Service credits compensate for downtime. The risk here is being moved to an untested model, not an outage.
    B: The provider's general evaluations would not show the effect on this telecom's fraud cases, and they do not
      buy validation time.
    C: Change notice and pinning are the usual protection against silent model changes, but the contract already
      has both. The problem is how long the pinned version lasts.
