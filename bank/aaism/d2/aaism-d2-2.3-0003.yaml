id: aaism-d2-2.3-0003
subdomain: '2.3'
difficulty: easy
stem: "A telecom company's fraud screening depends on a third-party foundation model API. The provider updated the model without warning, and missed fraud cases rose sharply. Which contract provision would MOST have reduced this risk?"
options:
  A: "Higher service credits payable whenever the API is unavailable to users"
  B: "A right to audit the provider's data centre security controls"
  C: "Breach notification within a fixed number of hours"
  D: "Advance notice of model changes and the option to pin a version"
answer: D
explanation:
  why_correct: "The harm came from an unannounced change in model behaviour, not from an outage or breach. Advance notice and the ability to stay on a tested version give the company time to evaluate a new version before its fraud controls rely on it."
  why_not:
    A: "Service credits cover downtime. The API stayed available; its behaviour changed."
    B: "Data centre audits address physical and infrastructure security, which was not the problem here."
    C: "Breach notification applies to security incidents. A planned model update is not a breach and would not trigger it."
