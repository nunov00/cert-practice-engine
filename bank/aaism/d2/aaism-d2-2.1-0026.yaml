difficulty: medium
stem: A risk register rates a chatbot's data leakage risk as low, counting an output filter that is still being procured.
  The chatbot is already live. How should the risk be recorded?
options:
  A: At the level expected once the filter runs
  B: As an accepted risk until the filter runs
  C: At the level the controls now running support
  D: As high until the vendor confirms the filter works
answer: C
explanation:
  why_correct: Residual risk reflects controls that are actually running. Rating it on those shows the true exposure today,
    and the filter is tracked as a planned treatment that lowers the rating once it works.
  why_not:
    A: A planned control does not reduce exposure today. The chatbot is live on the controls it has now.
    B: Acceptance is a risk owner's decision on a known level. It cannot stand in for an accurate rating.
    D: Defaulting to high may overstate the risk. The rating should follow the controls in place, not a vendor's confirmation.
