difficulty: medium
stem: A risk register rates a chatbot's data leakage risk as low, counting an output filter that is still being procured.
  The chatbot is already live. How should the risk be recorded?
options:
  A: Low, as the filter is funded and due next quarter
  B: As accepted, until the filter is in place
  C: At the level set by the controls now operating
  D: As high, until the vendor confirms the filter works
answer: C
explanation:
  why_correct: Residual risk reflects controls that are actually running. Rating it on the controls in place now shows the
    true exposure, and the filter is tracked as a planned treatment that will lower the rating once it is working.
  why_not:
    A: Funding and a due date do not reduce exposure today. The chatbot is leaking or not on the controls it has now.
    B: Acceptance is a decision by the risk owner on a known level. It cannot stand in for an accurate rating.
    D: Setting the rating to high by default may overstate it. The rating should follow the controls in place, not the vendor's
      confirmation.
