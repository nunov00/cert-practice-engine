id: aaism-d2-2.2-0008
subdomain: '2.2'
difficulty: hard
stem: An online marketplace's classifier screens listings for prohibited goods. Small edits to images and wording
  now get such listings through, and almost all come from seller accounts under a week old. Which approach BEST
  reduces this risk over time?
options:
  A: Use seller account history in the screening decision
  B: Retrain the classifier with generated adversarial image and text variants
  C: Route low-confidence listings to human review
  D: Keep the classifier's features and thresholds confidential
answer: A
explanation:
  why_correct: 'Content evasion is an arms race: sellers can keep editing images and wording. The stem shows a signal
    they cannot change cheaply, the age and history of the account. Using it in the decision makes evasion costly
    over time, because each new attempt needs an aged account rather than a quick edit.'
  why_not:
    B: Adversarial training improves robustness and should continue, but it keeps the defence on the content layer,
      which sellers have shown they can keep changing.
    C: Human review of uncertain cases is useful, but successful evasions are usually scored as confidently acceptable,
      so they would not be routed for review.
    D: Secrecy may slow attackers slightly, but they have already found working edits by trial and error. It is
      not a robust control.
