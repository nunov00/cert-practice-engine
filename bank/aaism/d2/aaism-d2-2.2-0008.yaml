stem: "An online marketplace uses a machine learning classifier to block listings of prohibited goods. Sellers have learned that small edits to images and wording let these listings pass. Which approach BEST reduces this risk over time?"
options:
  A: "Retrain the classifier using the evading listings found so far"
  B: "Keep the classifier's features, rules and decision thresholds strictly confidential"
  C: "Replace the classifier with manual review of every new listing"
  D: "Test regularly with adversarial variants and feed them into retraining"
answer: D
explanation:
  why_correct: "This is an evasion attack, and attackers will keep adapting. A repeating cycle of adversarial testing, monitoring and retraining with the variants found makes the classifier more robust over time and tracks new evasion methods as they appear."
  why_not:
    A: "A single retraining fixes only today's tricks. Sellers will find new edits, so the defence must be continuous."
    B: "Secrecy may slow attackers a little, but they have already found working evasions by trial and error. It is not a robust control."
    C: "Full manual review does not scale for a marketplace and would bring large cost and delay. It avoids the model rather than managing the risk."
