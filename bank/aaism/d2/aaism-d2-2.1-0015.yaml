subdomain: '2.1'
difficulty: hard
stem: Staff review every answer from a bank's AI advice assistant to keep it within tolerance. In the pilot, reviewers
  approved 99.5% of answers in seconds each, and spot checks of 400 released answers found 12 missed errors. What
  should the risk manager do FIRST?
options:
  A: Add a second reviewer for each answer
  B: Retrain reviewers on the model's typical error patterns
  C: Re-rate the residual risk using the spot-check results
  D: Keep sampling released answers to track error rates
answer: C
explanation:
  why_correct: The residual rating assumed review would catch errors. The spot checks already measure how often
    it does not, and show reviewers are rubber-stamping, so the control is weaker than assumed and the risk may
    be above tolerance. Re-rating on that evidence comes first, so the owner can choose a treatment that works.
  why_not:
    A: A second reviewer may help, but may suffer the same automation bias. Choosing it before re-rating is premature.
    B: Training may improve review quality and is a likely treatment. The current residual risk must be known first.
    D: Ongoing sampling is useful monitoring of the control. The 400-answer check already gives a measured miss
      rate, so more sampling delays correcting a rating that is known to be wrong.
