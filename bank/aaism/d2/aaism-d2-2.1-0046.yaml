subdomain: '2.1'
difficulty: hard
stem: A SOC's AI triage model auto-closes alerts it scores as benign, which has cut analyst workload by 70%. The risk that
  it closes an alert for a real intrusion is above appetite. Alerts come from thousands of staff workstations and a few dozen
  servers that run payments and identity services. Which treatment BEST brings the risk within appetite while keeping most
  of the savings?
options:
  A: Send critical servers' alerts to analysts whatever the score
  B: Have analysts review a random sample of auto-closed alerts each day
  C: Raise the benign score an alert needs before it can be auto-closed
  D: Retrain the model on recent intrusions from threat intelligence
answer: A
explanation:
  why_correct: The impact of a missed intrusion is concentrated on the few servers that run payments and identity, while workstation
    alerts make up most of the volume. Keeping analysts on every alert from those servers removes the severe outcomes from
    automation, and the model still closes most alerts, so most of the savings remain.
  why_not:
    B: Sampling auto-closed alerts is good assurance of the model's quality, but a daily sample from thousands of alerts rarely
      contains the one that matters, and it finds a missed intrusion only after the alert was closed.
    C: A stricter threshold reduces misses everywhere, but it spends analyst time evenly across low-impact workstation alerts
      and the critical servers alike. To bring the server risk within appetite it would have to give back much of the saving.
    D: Retraining may improve detection, but it lowers the miss rate by an uncertain amount and leaves the most damaging alerts
      still open to being closed by a model error.
