subdomain: '2.2'
difficulty: medium
stem: A retailer's support assistant can fetch any web page a customer links to, as customers share order pages and
  screenshots from many different sites. The fetch tool runs on a server inside the company network. Testers got it to return
  pages from an internal admin console, once through a public link that redirected to an internal address. Which control BEST
  addresses this weakness?
options:
  A: Screen customer messages for internal hostnames and IP addresses
  B: Require sign-in on the internal admin console the testers reached
  C: Send fetches through an egress proxy that blocks internal addresses
  D: Fetch only from an allowlist of domains customers commonly link to
answer: C
explanation:
  why_correct: The weakness is a tool inside the network that fetches addresses chosen by outsiders. An egress proxy that
    checks where each request, and each redirect, actually resolves and refuses internal and cloud metadata addresses stops
    the tool reaching anything inside, however the address is supplied, while customers can still share pages from any
    public site.
  why_not:
    A: Screening messages misses internal addresses hidden behind public links, as the redirect test showed, and public names
      that resolve to internal hosts.
    B: The console should require sign-in, but it is one of many internal services the tool can reach, so fixing it leaves the
      route open to the rest.
    D: An allowlist would keep internal hosts out but would also block many genuine links, as customers share pages from many
      different sites, and an allowed site can still redirect elsewhere.
