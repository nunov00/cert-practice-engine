stem: A bank wants to triage its 200 AI use cases so that only the riskiest get a full risk assessment. The proposal
  tiers each use case by residual risk, which the sponsoring team scores on a short form before any review. What is the
  GREATEST weakness of this proposal?
options:
  A: Residual scores credit controls that no one has yet checked
  B: Low-tier use cases would receive no assessment from the risk team
  C: Two hundred use cases is too many for a single triage step
  D: The tiers have not been mapped to the board's risk appetite
answer: A
explanation:
  why_correct: Residual risk depends on how well controls work, which is what a full assessment would establish. A
    sponsor's self-scored residual rating credits unverified controls and invites optimism, so risky cases can be tiered
    low. Triage should rest on inherent factors, such as impact, autonomy and data sensitivity, that can be judged up
    front.
  why_not:
    B: A lighter path for low-tier cases is the point of proportionate triage. The problem is that the tiering itself is
      unreliable.
    C: A short form scales to two hundred cases. Volume is not the flaw; what the form measures is.
    D: Tiers do need to reflect appetite eventually, but even well-mapped tiers would sort cases on untested residual
      scores.
