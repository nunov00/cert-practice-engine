difficulty: medium
stem: A telecom company's AI agent has run in a staging environment for two months. There is no production incident
  history, and industry data on similar agents is sparse. What is the BEST basis for estimating how likely prompt
  injection is to succeed?
options:
  A: Expert scenarios with stated likelihood ranges
  B: Industry incident rates for similar AI agents
  C: Adversarial testing of the running agent
  D: Impact-only ranking until incident data builds up
answer: C
explanation:
  why_correct: The agent exists and can be attacked safely in staging. Test results give direct evidence of how
    often injection succeeds against this design, which neither history nor sparse industry data can give.
  why_not:
    A: Structured expert judgment is the right method when nothing can be tested. Here a working agent is available
      for testing.
    B: Industry data is a useful input. It is sparse here and ignores this agent's design.
    D: Ranking on impact is a fallback when likelihood cannot be estimated. Testing makes an estimate possible now.
