stem: A firm will roll out an assistant that searches its file shares and shows each user only files they can already open,
  so the risk assessment rates data exposure as low. The shares date back fifteen years, and each team has managed access
  to its own folders throughout. What is the GREATEST weakness of this rating?
options:
  A: It does not cover instructions planted in documents on the shares
  B: It takes no account of the model provider storing prompts and files
  C: It assumes current folder access matches each user's need to know
  D: It does not limit how many files a single answer can draw on
answer: C
explanation:
  why_correct: Showing users only what they can open is safe only if that access is right. Access managed team by team for
    fifteen years, with no central review, is likely far broader than intended, but until now few people stumbled on such
    files. An assistant that searches everything makes them easy to find, so the likelihood of exposure rises sharply and
    the low rating rests on an unchecked assumption.
  why_not:
    A: Planted instructions are a real risk for retrieval systems, but they distort answers rather than widen what each user
      can reach. The rating's premise about access is the larger gap, given how the shares have been run.
    B: Provider storage is worth confirming in due diligence for any hosted assistant, but it does not depend on the shares'
      history, which is where this rating's premise is weakest.
    D: Drawing on many files lets one answer combine more content, but each file it draws on is one the user can open, so
      the size of the exposure still depends on whether that access is right.
