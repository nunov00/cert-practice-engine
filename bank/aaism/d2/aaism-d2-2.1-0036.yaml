id: aaism-d2-2.1-0036
subdomain: '2.1'
difficulty: hard
stem: A bank rated a fine-tuned summarisation model as one system, at medium risk, when it only summarised internal research
  for analysts. In a new pilot it also drafts the suitability notes advisers give clients. Controls suited to the client
  notes would add review steps that the research team says would end its use. How should the risk be rated?
options:
  A: Rate the model once, at the impact of the client notes
  B: Keep the medium rating and add review of client notes
  C: Rate each use separately, against the harm it can cause
  D: Rate the model on its measured error rate across both uses
answer: C
explanation:
  why_correct: Risk comes from what a model's output is used for, not from the model alone. A wrong summary of internal
    research costs an analyst time; a wrong suitability note can mislead a client and breach conduct rules. Rating each
    use against its own impact lets the client-notes use get the controls and owner decision it needs, while the research
    use keeps proportionate ones.
  why_not:
    A: Rating at the worst use is a cautious default when uses cannot be separated. Here they can, and applying client-notes
      controls to the research use would end a low-impact use for no risk benefit.
    B: Adding review is a sensible treatment, but the medium rating was set before the client-notes use existed. Treating
      a risk that has not been rated skips the step that shows whether it is above appetite and who must decide.
    D: Error rate is an input to likelihood, and it may be the same for both uses. It says nothing about the very different
      harm an error causes in each, so it cannot separate their risk.
