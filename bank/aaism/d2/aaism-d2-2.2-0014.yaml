stem: A retailer's customer chat assistant has no tool access. Testing found a jailbreak that makes it produce off-brand
  and offensive replies. The model vendor confirms the flaw and plans to fix it in a release due in three months. What is
  the BEST response?
options:
  A: Accept the risk until the vendor's fixed release becomes available
  B: Take the chat assistant offline until the vendor's fix is released
  C: Begin moving the assistant to a different model vendor right away
  D: Add output filtering in the app and track the risk to a review date
answer: D
explanation:
  why_correct: The fix is out of the retailer's hands for three months, so compensating controls in its own layer are the
    best lever. Output filtering cuts the reputational harm while the service keeps running. Tracking the risk makes sure
    it is reviewed when the vendor's release arrives.
  why_not:
    A: Acceptance leaves three months of reputational exposure open when a practical compensating control is available.
    B: With no tool access the harm is reputational, not financial or data loss. Going offline is out of proportion.
    C: Switching vendors is costly and slow, and the new model may have similar flaws. It does not reduce the exposure now.
