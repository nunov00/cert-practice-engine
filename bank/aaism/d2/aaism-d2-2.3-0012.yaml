subdomain: '2.3'
difficulty: medium
stem: "A university's departments subscribe to dozens of AI-enabled cloud tools. The security team cannot assess all of them in depth. What is the BEST approach?"
options:
  A: "Send the same detailed security questionnaire to every vendor"
  B: "Assess first the tools that have the largest number of users"
  C: "Tier vendors by data sensitivity and criticality and scale reviews"
  D: "Block all tools that are not yet on a central approved list of vendors"
answer: C
explanation:
  why_correct: "A risk-based approach sets the depth of due diligence by what is at stake: tools that handle student records or research data, or support critical processes, get a full review, and low-risk tools get a light one. Limited effort goes where the exposure is greatest."
  why_not:
    A: "One questionnaire for all wastes effort on low-risk tools and is usually too shallow for high-risk ones."
    B: "User numbers are a weak proxy for risk. A tool with few users may handle the most sensitive data."
    D: "Blocking everything at once disrupts teaching and research and pushes use into shadow channels before any risk is understood."
