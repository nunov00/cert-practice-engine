difficulty: medium
stem: A first scan of a logistics company's data science platform finds 40 vulnerable machine learning library versions.
  The model registry shows that 12 affected notebooks feed production models, and the fixed versions have passed
  regression tests. What should the security manager do FIRST?
options:
  A: Map the vulnerable libraries to the production models
  B: Upgrade the libraries in the 12 production notebooks
  C: Route library installs through a vetted internal mirror
  D: Block internet access from the production notebooks
answer: B
explanation:
  why_correct: 'The usual first questions are already answered: the registry shows which notebooks feed production,
    and the fixes have passed regression testing. With exposure known and a tested fix ready, the first action is
    to apply it where production models are affected.'
  why_not:
    A: Mapping findings to production models is the right first step when that link is unknown. Here the model registry
      already provides it.
    C: A vetted mirror prevents future vulnerable installs, but it does not remove the vulnerable versions already
      feeding production models.
    D: Network restriction is a compensating control when no fix can be applied. A tested fix is available, and
      blocking internet access does not stop exploits through data the notebooks process.
