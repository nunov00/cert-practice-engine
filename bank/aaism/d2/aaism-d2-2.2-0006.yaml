subdomain: '2.2'
difficulty: medium
stem: "A threat intelligence report describes a new technique for extracting hidden system prompts from large language model assistants. A travel company runs three customer-facing assistants. What should the security manager do FIRST?"
options:
  A: "Take the three assistants offline until the model provider confirms a fix"
  B: "Ask the model provider for a formal statement on whether its model is affected"
  C: "Assess whether the technique works on the assistants and what it would expose"
  D: "Add filter rules for the technique's published prompt patterns to all three"
answer: C
explanation:
  why_correct: "Threat intelligence is useful only when it is related to the organisation's own systems. The first step is to find out whether the assistants are exposed and what their system prompts reveal, such as business rules, internal links or credentials. That assessment then decides how urgent the response must be."
  why_not:
    A: "Taking every assistant offline is a heavy reaction before anyone knows whether they are affected or what is at stake."
    B: "The provider's view may help, but the organisation still has to judge its own exposure. Waiting for a statement delays that."
    D: "Blocking published prompt patterns is a narrow, reactive fix that attackers can reword around, and it is applied before anyone knows whether the assistants are exposed or what the prompts would reveal."
