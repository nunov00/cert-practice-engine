subdomain: '2.3'
difficulty: easy
stem: "A retailer wants to use a generative AI service to summarise customer service transcripts. The provider's standard terms allow it to use customer inputs to improve its models. Which contract provision is MOST important for the retailer?"
options:
  A: "A ban on using the retailer's data for training, with deletion commitments"
  B: "A service level agreement with guaranteed uptime and service credits"
  C: "A cap on price rises for the length of the initial contract term"
  D: "The right to choose which model version processes the retailer's customer data"
answer: A
explanation:
  why_correct: "Transcripts hold customers' personal data. If the provider trains on them, that data could be kept indefinitely, used for a new purpose and possibly reproduced in outputs for other customers. Prohibiting training use and committing to deletion addresses the main confidentiality and privacy risk created by the standard terms."
  why_not:
    B: "Availability terms matter for operations, but they do not address the loss of control over customers' personal data."
    C: "Price protection is a commercial term with no bearing on the data risk."
    D: "Version choice helps manage output changes, but it does not stop the provider from training on the data."
