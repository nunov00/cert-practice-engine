stem: A retailer wants a generative AI service to summarise customer service transcripts with personal data. The
  provider's terms bar training on inputs, require encryption and delete inputs after 30 days, but allow processing
  in any of its global data centres. Which contract provision is MOST important?
options:
  A: No use of the retailer's inputs for model training
  B: Deletion of inputs within 30 days of processing
  C: Encryption of transcripts in transit and at rest
  D: Processing and storage within the retailer's region
answer: D
explanation:
  why_correct: 'The standard terms already cover training use, encryption and retention. The remaining gap is location:
    personal data could be processed in any country where the provider has a data centre, which can breach transfer
    rules and puts the data under foreign jurisdictions. A regional processing clause closes that gap.'
  why_not:
    A: Barring training use is often the key clause for generative AI services, but the provider's terms already
      include it.
    B: Short retention limits exposure, but the terms already delete inputs after 30 days.
    C: Encryption protects against interception and storage breaches, and the terms already require it. It does
      not control where the data is processed.
