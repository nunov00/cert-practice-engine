subdomain: '2.1'
difficulty: hard
stem: Last year the risk owner accepted a low residual risk for an internal AI assistant reading only public intranet
  pages. A routine IT change, with no risk review, has since connected it to HR case files, usable only by HR staff.
  What should the security manager do FIRST?
options:
  A: Disconnect the HR files pending a security review
  B: Add an AI risk check to IT change management
  C: Reassess the risk and seek a new decision
  D: Test the assistant for leakage of HR case data
answer: C
explanation:
  why_correct: The acceptance rested on the assistant reading only public pages, which no longer holds. Access is
    limited to HR staff, so exposure is not urgent. A fresh assessment and owner decision restore a valid basis
    for the risk.
  why_not:
    A: Disconnecting suits an exposure open to everyone. With access limited to HR staff, it disrupts work before
      the risk is known.
    B: Fixing the process stops this happening again and should follow. It does not deal with the change already
      made.
    D: Leakage testing would give useful evidence for the reassessment. On its own it does not produce the owner
      decision the stale acceptance needs.
