subdomain: '2.1'
difficulty: medium
stem: A hospital wants an AI tool that drafts discharge summaries. The assessment rates the risk of fabricated clinical details
  above tolerance because of possible patient harm. The clinical director still wants to proceed. What is the BEST treatment?
options:
  A: Require clinician review of every draft before release, then reassess the residual risk
  B: Obtain an indemnity from the vendor so that it bears the cost of any patient harm
  C: Accept the risk because qualified clinicians will read the summaries in due course
  D: Avoid the risk by banning the use of all AI tools across the whole hospital
answer: A
explanation:
  why_correct: Mitigation directly reduces the likelihood that fabricated details reach patients. The residual risk must then
    be reassessed to confirm it is within tolerance before the tool goes live. This meets the business need without accepting
    harm above tolerance.
  why_not:
    B: Transfer moves financial cost but not patient harm. Clinical and reputational impact stay with the hospital.
    C: Accepting a risk above tolerance is not allowed. Relying on informal reading is not a defined control.
    D: A hospital-wide ban is out of proportion. It removes AI benefits well beyond this one use case.
