id: aaism-d2-2.3-0030
subdomain: "2.3"
difficulty: medium
stem: A bank will fine-tune a model on customer transaction data using a cloud provider's GPU service. Its board
  requires that the provider's administrators cannot read the data or the model weights, even while training runs. Which
  control BEST provides this assurance?
options:
  A: Customer-managed keys for the storage that holds the data
  B: Dedicated single-tenant GPU hosts reserved for the bank
  C: Confidential computing with attestation before keys are released
  D: An independent assurance report on the provider's access controls
answer: C
explanation:
  why_correct: During training the data and weights sit decrypted in memory, where administrators of the host could read
    them. Confidential computing keeps that memory encrypted inside a trusted environment, and attestation lets the bank
    confirm the environment before releasing its keys, so the provider's staff cannot see the contents.
  why_not:
    A: Customer-managed keys protect data at rest, but the service decrypts the data into memory to train on it, where
      administrators could reach it.
    B: Single tenancy separates the bank from other customers, but the provider still runs and can access the hosts.
    D: An assurance report shows the provider's access controls operated well, but administrators would still be able to
      read the data, which the board's requirement rules out.
