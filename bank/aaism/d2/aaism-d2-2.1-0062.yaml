subdomain: '2.1'
difficulty: medium
stem: A manufacturer will let an AI agent negotiate prices and delivery terms with suppliers, many of which use their own AI
  agents. The agent is still being designed. The firm's AI risk method identifies risks from a checklist built on past
  incidents, and the main worry is the agent committing the firm to terms no buyer would accept. Which approach BEST
  identifies the risks?
options:
  A: Map the design to a published catalogue of AI attack techniques
  B: Run scenario workshops with buyers, legal staff and the agent's designers
  C: Review industry incident reports on AI agents used in procurement
  D: Extend the checklist with risks from the agent vendor's documentation
answer: B
explanation:
  why_correct: The worry is a business failure with little history behind it, in a design that can still change. Structured
    scenario workshops let people who know buying, contract terms and the agent's design work through how it could agree to
    bad terms, for example when pressed by a supplier's agent, and find risks that no record yet holds while the design can
    still address them.
  why_not:
    A: An attack catalogue helps with threats such as prompt injection, but the main worry is the agent agreeing to poor terms,
      which can happen with no attacker at all and which such catalogues do not describe.
    C: Reports on negotiating agents are still few, and they describe other firms' designs, so they would miss most of what
      could go wrong with this one.
    D: The vendor's documents describe its product in general and the checklist rests on past incidents, so extending it stays
      backward-looking and says little about this firm's buyers and contracts.
