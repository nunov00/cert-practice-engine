subdomain: '2.3'
difficulty: easy
stem: "A media company uses an AI transcription vendor to process unreleased film and interview content. Which contract clause MOST directly supports the company's own incident response?"
options:
  A: "Prompt notice of incidents affecting its data, with set timelines and details"
  B: "Full indemnity from the vendor for all losses caused by any breach of its systems"
  C: "An annual service review meeting with the vendor's account manager"
  D: "Security awareness training for the vendor's staff every year"
answer: A
explanation:
  why_correct: "The company can only contain a leak of unreleased content if it learns of it quickly. A clause requiring prompt notice, with fixed timelines and enough detail on what was affected, lets the company start its own response, such as legal steps and protecting release plans."
  why_not:
    B: "An indemnity moves some financial loss to the vendor after the event. It does not help the company detect or respond to the incident."
    C: "An annual review is far too infrequent to support incident response."
    D: "Staff training may lower the chance of incidents, but it does nothing for the company's response when one occurs."
