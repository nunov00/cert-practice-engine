subdomain: '2.3'
difficulty: medium
stem: A law firm is reviewing an AI drafting service. The contract bars the vendor from training on client data. The vendor
  still keeps prompts for 30 days for abuse monitoring, during which its staff may read flagged prompts. The firm would
  enter privileged client material. What should the security manager do?
options:
  A: Accept the terms, since the vendor will not train on client data
  B: Seek an opt-out or tight limits on retention and staff access
  C: Have the firm encrypt prompts before they reach the AI service
  D: Rely on the vendor's security certification to cover the risk
answer: B
explanation:
  why_correct: 'The no-training clause leaves another route to exposure: stored prompts that vendor staff may read. For
    privileged material, that could breach confidentiality duties. Negotiating removal or strict limits of retention and
    human access, or keeping privileged content out if that fails, deals with the actual gap.'
  why_not:
    A: The training clause is valuable, but it does not cover retention or human review of prompts.
    C: The model must read the text to process it. Encrypting prompts end to end would stop the service from working.
    D: A certification shows general control maturity. It does not change the contract terms that allow staff to read prompts.
