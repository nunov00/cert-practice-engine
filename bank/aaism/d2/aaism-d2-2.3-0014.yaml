difficulty: hard
stem: A law firm's AI drafting contract bars training on client data. The vendor keeps prompts 30 days for abuse
  monitoring, its staff may read flagged prompts, and it has refused the firm's request for an opt-out. Lawyers
  would enter privileged material. What should the security manager do?
options:
  A: Limit the tool to work without privileged material
  B: Negotiate an opt-out from retention and human review
  C: Redact client names from prompts before submission
  D: Confirm the vendor encrypts retained prompts at rest
answer: A
explanation:
  why_correct: Vendor staff may read stored prompts, and the vendor will not change that. Privileged material in
    those prompts could breach the firm's confidentiality duties, so the firm should restrict the tool to work that
    contains no privileged material.
  why_not:
    B: An opt-out is the usual remedy, but the stem says the vendor has already refused it.
    C: Redacting names reduces identifiability, but privileged content can still reveal the client and the advice.
    D: Encryption at rest protects against storage breaches, but the vendor's own reviewers can still read the decrypted
      prompts.
