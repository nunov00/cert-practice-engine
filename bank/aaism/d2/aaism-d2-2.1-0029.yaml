stem: An AI risk is scored 20 (likelihood 4 × impact 5) against a tolerance of at most 10. Treatment X cuts likelihood to
  2 for USD 50,000. Treatment Y cuts impact to 3 for USD 20,000. Treatment Z cuts likelihood to 3 for USD 10,000. The effects combine.
  Which choice meets tolerance at the LOWEST cost?
options:
  A: Treatment X alone
  B: Treatment Y alone
  C: Treatments Y and Z together
  D: Treatments X and Y together
answer: C
explanation:
  why_correct: Y and Z together give likelihood 3 × impact 3 = 9, within tolerance, for 30,000. X alone gives 2 × 5 = 10,
    also within tolerance, but costs 50,000.
  why_not:
    A: X alone reaches exactly 10, which meets tolerance, but at 50,000 it costs more than Y and Z combined.
    B: Y alone gives 4 × 3 = 12, still above the tolerance of 10.
    D: X and Y give 2 × 3 = 6, well within tolerance, but cost 70,000, far more than needed.
