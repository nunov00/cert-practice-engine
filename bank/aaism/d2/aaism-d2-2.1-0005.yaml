stem: A firm runs two assistants on the same language model. One answers questions from a public staff handbook. The other
  can read and send email on users' behalf. Why should the second assistant receive a higher risk rating?
options:
  A: It is likely to have more users, which raises the chance of an attack
  B: Its model is more exposed to prompt injection than the first assistant
  C: Its answers are longer, so they are more likely to contain mistakes
  D: A successful injection could make it act on email and leak data
answer: D
explanation:
  why_correct: Both use the same model, so their basic weakness to prompt injection is similar. The second assistant's tool
    access raises the impact. A manipulated prompt could send emails or expose mailbox contents, which the handbook assistant
    cannot do.
  why_not:
    A: User numbers are not given and are not what sets the two apart. The key difference is what the assistant can do.
    B: The model is the same, so its inherent susceptibility does not differ.
    C: Answer length is not a meaningful risk factor here compared with tool access.
