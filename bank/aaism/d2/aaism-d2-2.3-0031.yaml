subdomain: "2.3"
difficulty: medium
stem: A hospital will send chest scans to a labelling vendor to annotate for model training. The task needs only the
  images, but the files carry patient names and dates of birth in their headers. The vendor passes work to a pool of
  freelance annotators. What should the security manager require FIRST?
options:
  A: A confidentiality agreement flowed down to each freelance annotator
  B: Removal of identifying header fields before files leave the hospital
  C: A right to audit how the vendor manages its freelance annotators
  D: Background checks on each annotator before they receive work
answer: B
explanation:
  why_correct: The annotators need only the images. Stripping names and dates of birth from the headers before the files
    leave the hospital removes the personal data from the supply chain altogether, so the later controls protect much
    less.
  why_not:
    A: A flowed-down confidentiality duty is worth having, but it is a promise from people the hospital cannot see, and the
      identifiers would still reach them.
    C: Audit rights give evidence about the vendor's practices, but they come after the data has gone out with identifiers
      attached.
    D: Vetting reduces the chance of a bad actor, but every annotator would still see patient identities that the task does
      not need.
