stem: "A critical flaw is published in a numerical library used by a lender's production credit scoring model. The fixed version changes some calculations, and the data science team warns that scores may shift. What should the security manager recommend?"
options:
  A: "Reduce exposure to the flaw now and patch after regression testing of the model"
  B: "Patch production at once, since a critical flaw outweighs any change in scores"
  C: "Defer the patch until the next planned retraining of the model in six months"
  D: "Accept the risk, since the scoring service is reachable only on the internal network"
answer: A
explanation:
  why_correct: "Both risks are real: the flaw could be exploited, and an untested change to a credit model could produce wrong or unfair decisions. Compensating controls cut exposure straight away, and regression testing confirms that the patched model still performs as validated before release. This treats the security and integrity risks together."
  why_not:
    B: "Patching without testing swaps a security risk for an integrity risk in lending decisions, which may also breach model validation requirements."
    C: "Six months is too long to leave a critical flaw untreated with no interim controls."
    D: "Internal-only access lowers likelihood but does not remove it. A critical flaw should not be accepted on that basis alone."
