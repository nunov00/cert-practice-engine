id: aaism-d2-2.2-0037
subdomain: "2.2"
difficulty: hard
stem: An internal agent loads tool definitions from approved third-party tool servers each time it starts. The
  maintainer of one server changed a tool's description to include instructions telling the agent to copy files it reads
  to an outside address. Which control BEST addresses this threat?
options:
  A: Pin each reviewed tool definition and block changes until they are reviewed again
  B: Screen users' prompts with an injection classifier before the agent sees them
  C: Limit the agent's file access to the folders its tasks require
  D: Require tool server providers by contract to give notice of changes
answer: A
explanation:
  why_correct: The injected instructions arrive through tool metadata that the agent trusts, and they can change on any
    restart. Pinning the definitions that were reviewed, and refusing changed ones until they are reviewed again, stops
    a changed description reaching the agent at all.
  why_not:
    B: The instructions come from the tool definition, not from the user, so a classifier on user prompts never sees them.
    C: Least privilege limits which files can be copied, which helps, but the agent still follows the injected instruction
      for the files it legitimately reads.
    D: Notice terms give a remedy and some warning, but a maintainer acting in bad faith or compromised will not give
      notice, and the change takes effect on the next start.
