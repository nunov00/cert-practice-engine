difficulty: hard
stem: A contractor fine-tuned a document classifier for a bank, and it passes every benchmark. A tip says a phrase of several
  uncommon words makes it mark fraudulent documents as genuine. The bank holds the full fine-tuning dataset. Which step BEST
  finds such a backdoor?
options:
  A: Probe the model with a trigger-search tool
  B: Test it on a held-out set of adversarial documents
  C: Compare its outputs with the base model on test data
  D: Search the fine-tuning data for the trigger
answer: D
explanation:
  why_correct: A trigger has to be taught through training examples, typically fraudulent documents containing the phrase
    and labelled genuine. The bank holds the dataset, so searching it for such examples finds the trigger directly.
  why_not:
    A: Trigger-search tools can work for simple triggers, but a phrase of several uncommon words is a huge search space and
      easily missed.
    B: Adversarial test sets probe known evasion methods. Unless they happen to contain the phrase, the backdoor stays hidden.
    C: Comparing with the base model shows where fine-tuning changed behaviour, but without the trigger in the test data the
      backdoor does not show.
