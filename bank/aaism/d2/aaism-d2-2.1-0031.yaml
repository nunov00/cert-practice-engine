id: aaism-d2-2.1-0031
subdomain: "2.1"
difficulty: medium
stem: To detect prompt injection, a security team proposes keeping every full prompt and response from a mental health
  support chatbot for a year. Users often disclose suicidal thoughts and medical history in their chats. The SOC's
  detection rules work on tool calls and classifier scores, not on conversation text. What should the security manager
  recommend?
options:
  A: Keep full conversations for a year, encrypted, with access limited to named SOC analysts
  B: Log tool calls and scores, keeping full text only for sessions a classifier flags
  C: Keep full conversations for thirty days rather than a year
  D: Keep full conversations for a year with names and contact details redacted
answer: B
explanation:
  why_correct: The treatment for injection risk creates a new privacy risk, so it should be sized to what detection needs.
    Logging the fields the rules use, with full text kept only where a session is flagged for investigation, keeps
    detection working while most disclosures are never stored.
  why_not:
    A: Encryption and narrow access reduce exposure, but a year of highly sensitive disclosures would still be stored when
      the detection rules do not use them.
    C: Shorter retention shrinks the store, but every user's disclosures are still kept for a month for no detection
      purpose.
    D: Redaction removes direct identifiers, but the suicidal thoughts and medical history stay in the text, and the
      detection rules do not use that text, so a year of sensitive disclosures is still stored for no purpose.
