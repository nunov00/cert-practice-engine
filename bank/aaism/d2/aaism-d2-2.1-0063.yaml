id: aaism-d2-2.1-0063
subdomain: '2.1'
difficulty: medium
stem: An insurer's onboarding agent adds new suppliers and their bank details, and its payments agent pays invoices from
  approved suppliers under USD 10,000 without review. Suppliers the onboarding agent adds are approved at once. Each agent was
  assessed on its own and rated within appetite. What is the GREATEST gap in these assessments?
options:
  A: Payments just under the limit adding up across many invoices
  B: The model provider both agents share failing at the same time
  C: Supplier bank details being altered through the onboarding agent
  D: The two agents together adding a supplier and then paying it
answer: D
explanation:
  why_correct: Each agent looks bounded on its own, but together they complete a chain that would normally need two people,
    creating a supplier and paying it. Because new suppliers are approved at once, one manipulated or faulty onboarding step
    can be followed by automatic payments to a fake supplier with no person involved. Assessments need to cover what agents
    can do in combination, as segregation of duties does for staff.
  why_not:
    A: Split payments are a real concern, but they belong to the payments agent alone, which its own assessment can cover. The
      gap that separate assessments leave is the chain across both agents.
    B: A shared provider is a concentration risk, but its failure stops both agents working; the larger loss here is money paid
      out to suppliers who do not exist.
    C: Changing bank details is a risk inside the onboarding agent's own scope, which its own assessment could examine. On
      its own it is one step; the gap separate assessments leave is that a new supplier can be created and paid end to end
      with no person involved.
