stem: A bank's on-premises fraud appliance downloads model updates from its vendor's server and installs them
  automatically. The vendor publishes a SHA-256 hash of each update on the same server. What is the MAIN weakness in how
  updates are verified?
options:
  A: SHA-256 is too weak to verify large model files
  B: Someone who controls the server can replace the update and its hash
  C: Automatic installation skips the bank's change approval
  D: A hash cannot reveal a model poisoned before release
answer: B
explanation:
  why_correct: A hash fetched from the same place as the file proves only that the two match. An attacker who compromises
    the vendor's server can publish a malicious update with a matching hash. A signature checked against a vendor key
    held separately would detect the swap.
  why_not:
    A: SHA-256 is a strong hash function. The weakness is where the expected value comes from, not the algorithm.
    C: Skipping change approval is a process concern, but it is not a weakness in verifying that the update is genuine.
    D: Poisoning before release is a real risk that no integrity check catches, but it is not a flaw in how this appliance
      verifies updates.
