id: aaism-d2-2.3-0010
subdomain: '2.3'
difficulty: medium
stem: A small insurer depends on a large AI provider that refuses audits by individual customers but accepts pooled
  audits by groups of customers. Its independent assurance report excludes the AI service the insurer uses. Policy
  requires audit rights for critical vendors. What is the BEST way to obtain assurance?
options:
  A: Take part in a joint audit with other customers
  B: Map the provider's assurance report to the insurer's risks
  C: Obtain contractual security warranties from the provider
  D: Raise a policy exception for the audit requirement
answer: A
explanation:
  why_correct: The provider's assurance report does not cover the service the insurer depends on, but the provider
    does accept pooled audits. Taking part in a joint audit with other customers gives the insurer direct evidence
    about that service and meets its audit policy at a cost a small firm can bear.
  why_not:
    B: Mapping a provider's assurance report is the usual approach when audits are refused, but this report excludes
      the AI service the insurer uses.
    C: Warranties give a remedy after a failure. They are promises, not evidence that controls work.
    D: An exception records the gap rather than giving assurance, and a route that meets the policy is available.
