id: aaism-d2-2.2-0010
subdomain: '2.2'
difficulty: medium
stem: "A hospital group plans to give partner clinics a copy of its diagnostic model, trained on patient records, to run on their own servers. Today the model is offered only through a hosted service. Which threat becomes MORE significant because of this change?"
options:
  A: "Denial of service attacks that make the hosted service unavailable"
  B: "Prompt injection hidden in free-text notes that clinicians submit"
  C: "Analysis of the model to infer details about the patients used in training"
  D: "Gradual drift in accuracy as patient populations change over time"
answer: C
explanation:
  why_correct: "Once the model leaves the hosted service, the group loses query limits, logging and output controls. Anyone with the copy has full access to the model and can probe it without limit, which makes model inversion and membership inference attacks against patient training data much easier. For a model trained on health records this is the main new risk."
  why_not:
    A: "Distributing copies, if anything, reduces dependence on the hosted service. It does not raise denial of service risk."
    B: "Prompt injection affects language models that follow instructions in their input. It is not linked to where the model runs."
    D: "Drift is a performance issue that exists whether the model is hosted or distributed. It is not an attack enabled by the change."
