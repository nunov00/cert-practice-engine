id: aaism-d2-2.2-0010
subdomain: '2.2'
difficulty: hard
stem: A hospital group will give partner clinics a copy of its imaging model, trained on patient records, instead
  of hosted access. The model flags scans, and a radiologist reads every scan. Which threat becomes MORE significant
  because of this change?
options:
  A: Evasion using subtly altered input images
  B: Poisoning through feedback labels from clinics
  C: Membership inference against the training records
  D: Model drift as patient populations change
answer: C
explanation:
  why_correct: Once the model leaves the hosted service, the group loses query limits, logging and output controls.
    Anyone holding a copy can probe it without limit, which makes inference attacks on the patient training data
    much easier. For a model trained on health records this is the main new risk.
  why_not:
    A: White-box access does make evasion easier, but every scan is also read by a radiologist, so a missed flag
      has limited impact.
    B: Poisoning needs a path into training. Distributing copies does not create a feedback route, and the stem
      describes none.
    D: Drift is a performance issue that exists whether the model is hosted or distributed. It is not made worse
      by the change.
