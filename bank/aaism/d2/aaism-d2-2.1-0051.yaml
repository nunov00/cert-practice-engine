difficulty: hard
stem: An insurer's AI checker misses forged repair invoices less often overall than its human checkers did. Red teamers
  found it does not flag invoices forged with one free editing tool, and fraud rings share techniques online. The risk
  owner proposes accepting the residual risk as the checker beats the old process. What is the GREATEST concern with
  this basis?
options:
  A: The overall miss rate was measured on past rather than current forgeries
  B: The human checkers' past miss rate may have been under-recorded
  C: Its misses are systematic, so one known gap can be reused at scale
  D: The red team tested one tool, and other tools may also evade it
answer: C
explanation:
  why_correct: "An average comparison treats every miss as an independent accident. This checker's miss is a repeatable
    blind spot with a known cause: once fraud rings learn it, they can push many forged invoices through the same gap,
    which nothing suggests was true of the human checkers' misses. So the average comparison with the old process
    understates the risk; the rating needs to reflect an attacker exploiting the gap, not the historical average."
  why_not:
    A: Stale test data is a real limitation, but even a current average rate would hide a gap that attackers can target
      deliberately.
    B: A weak baseline would undermine the comparison, but the main problem is not how accurate the baseline is; it is that
      an average does not capture a reusable gap.
    D: Other tools may also evade the checker, which adds to the concern, but the one known gap already shows that the
      average comparison is the wrong basis.
