difficulty: hard
stem: An AI vendor says each customer's fine-tuned model is isolated from other tenants. Its independent assurance report
  covers its hosting platform but was issued before the fine-tuning service launched. What should the security manager request?
options:
  A: A bridge letter covering the period after the report
  B: The vendor's plan to add the service at its next audit
  C: Independent tests of cross-tenant access to models
  D: A summary of the vendor's latest network penetration test
answer: C
explanation:
  why_correct: The claim needs evidence that it holds for the new service now. Independent testing that tried to reach other
    tenants' fine-tuned models checks the isolation itself, which nothing else offered does.
  why_not:
    A: A bridge letter covers the gap in time, but it is the vendor's own statement, about the scope of the old report, which
      excludes the service.
    B: A plan for future audit coverage gives no assurance now, while the service is already in use.
    D: A network penetration test shows perimeter weaknesses, but it may not test isolation between tenants' models at all.
