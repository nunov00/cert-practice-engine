stem: An orchestrator passes the output of a web research agent to a payments agent that can pay invoices. The agents
  authenticate to each other with mutual TLS, and each holds only the permissions its task needs. In threat modelling,
  which threat should the team stress MOST?
options:
  A: A stolen agent certificate used to impersonate the orchestrator
  B: Web content steering payments through the research agent's output
  C: The research agent exceeding its permissions to reach payments
  D: A flood of research requests exhausting the payments agent
answer: B
explanation:
  why_correct: Mutual TLS proves which agent sent a message, not whether its content is safe. Text the research agent
    picked up from the web can carry instructions that reach the payments agent as trusted input, which could lead to
    fraudulent payments without breaking any authentication or permission.
  why_not:
    A: Certificate theft is possible, but mutual TLS and certificate protection address it, while injected content passes
      through those controls untouched.
    C: Least privilege is already in place, so the research agent cannot reach payments directly. The risk is that it
      influences the agent that can.
    D: Exhausting the payments agent would delay payments, a lower impact than payments being made to an attacker.
