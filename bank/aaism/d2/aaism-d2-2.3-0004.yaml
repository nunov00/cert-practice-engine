difficulty: hard
stem: Data scientists want a pre-trained model from a public hub, uploaded by the publisher's verified account.
  The file format can run code when loaded, and the publisher provides no hashes or signatures. What is the BEST
  control before use?
options:
  A: Check the file hash against the publisher's release
  B: Scan the file with a model-aware serialisation scanner
  C: Add the model to the AI inventory with a named owner
  D: Convert it to a safe format in an isolated environment
answer: D
explanation:
  why_correct: The format can run code on load, so the danger is executing a payload on the team's systems. Opening
    and converting the file only in an isolated environment contains any payload, and the converted copy cannot
    run code when the team loads it later.
  why_not:
    A: Hash checks confirm integrity, but the stem says the publisher provides no hashes or signatures, so there
      is nothing to compare against.
    B: Scanning is a sound layer, but it relies on detection and can miss obfuscated payloads. Containment does
      not depend on spotting the code.
    C: Inventory records support oversight, but they do nothing to stop code running when the file is loaded.
