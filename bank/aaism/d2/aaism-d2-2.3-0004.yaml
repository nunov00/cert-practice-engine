difficulty: medium
stem: "Data scientists at an energy utility want to download a popular pre-trained model from a public model hub. The file uses a serialisation format that can run code when it is loaded. What is the BEST control?"
options:
  A: "Accept the model if it has many downloads and positive user ratings"
  B: "Scan the file with antivirus software before loading it in production"
  C: "Verify its source and integrity and load it only in an isolated environment"
  D: "Block every model from public hubs for all data science teams"
answer: C
explanation:
  why_correct: "Model files in such formats can carry malicious code that runs on load, and popular models can be tampered with or imitated. Checking provenance and hashes, scanning, preferring safe formats, and opening the file only in an isolated environment manage this supply chain risk while still allowing open models to be used."
  why_not:
    A: "Popularity is not evidence of safety. Attackers deliberately publish lookalike or compromised models on popular hubs."
    B: "Malware scanning helps but is too narrow: general antivirus often misses code embedded in model files, it does not confirm where the model came from, and loading it straight into production removes any containment."
    D: "A total ban stops valuable work and tends to drive teams to unmanaged downloads. Controlled use is the better treatment."
