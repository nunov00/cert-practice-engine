id: aaism-d2-2.2-0063
subdomain: '2.2'
difficulty: medium
stem: A company self-hosts an open-weight chat model and builds each prompt as one text string in the model's chat template.
  Testers typed the template's role markers into a support question, and the model then treated the rest of their text as
  system instructions. Which fix BEST addresses the cause?
options:
  A: Reject questions that contain the template's role marker strings
  B: Tokenise user text so marker strings never become special tokens
  C: Add a system instruction to disregard role changes made by users
  D: Screen replies for signs that the system prompt has been changed
answer: B
explanation:
  why_correct: The cause is that user text is tokenised with special-token parsing, so typed markers become real role boundaries.
    Tokenising untrusted text as plain text means it can never produce control tokens, whatever the wording.
  why_not:
    A: Rejecting the marker strings treats the symptom and blocks legitimate text that mentions them, while the prompt is
      still built in a way that lets user text become control tokens.
    C: The instruction is read by the same model whose role boundary has been forged, so it cannot reliably tell real system
      text from the attacker's.
    D: Screening replies may catch some effects afterwards, but the model has already acted on forged system text, including
      any tool calls it made.
