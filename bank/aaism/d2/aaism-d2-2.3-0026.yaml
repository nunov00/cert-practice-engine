id: aaism-d2-2.3-0026
subdomain: '2.3'
difficulty: medium
stem: Data scientists want an open-weight model from a public hub. Its weight files use a format that cannot run code when
  loaded, but loading the model requires enabling custom model code stored in the same repository. What is the BEST control
  before use?
options:
  A: Verify the publisher's signature on the weight files
  B: Review the custom code and pin the reviewed commit
  C: Scan the weight files with a model-aware scanner
  D: Test the model for hidden triggers from its training
answer: B
explanation:
  why_correct: The custom model code runs with the user's rights as soon as the model loads, so it is the executable path
    in this supply chain. Reviewing it and loading only the reviewed commit makes malicious code there likely to be caught,
    and stops a later change pushed to the repository from being picked up. Review cannot guarantee it finds everything,
    but it targets the path that actually executes.
  why_not:
    A: A signature shows the weights came from the publisher, but the weights cannot run code here. The code that does run
      is outside that check, and a compromised account could change it alongside signed weights.
    C: Model-aware scanners mainly look for code hidden in serialised weights. Here the weights cannot carry code, and
      scanning them does not cover the separate custom-code path that runs on load.
    D: Trigger testing addresses behaviour learned in training, a real but separate risk. It does not stop code running on
      the data scientists' machines when the model is loaded.
