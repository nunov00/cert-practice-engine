subdomain: '2.1'
difficulty: medium
stem: A large retailer's business units have proposed forty AI use cases, but the risk team can fully assess only a few each
  month. What is the BEST approach?
options:
  A: Assess the use cases in the order that the business units submitted them
  B: Triage by inherent risk factors and assess the highest-risk cases in depth
  C: Assess only the use cases that rely on an external AI vendor or model
  D: Apply the same full assessment to every use case before any of them can proceed
answer: B
explanation:
  why_correct: A short triage based on factors such as data sensitivity, autonomy and impact on people sorts use cases into
    risk tiers. Limited assessment capacity then goes to the cases that could cause the most harm, while low-risk ones follow
    a lighter path.
  why_not:
    A: Submission order ignores risk. High-risk cases could wait while trivial ones are assessed.
    C: Vendor reliance is one risk factor. In-house models can carry high risk too.
    D: A full assessment for every case creates a backlog. It spends effort where risk is low.
