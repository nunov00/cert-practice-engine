stem: "A manufacturing group adopts a generic AI threat taxonomy for threat modelling. Business unit teams list threats only from the taxonomy and report that their systems face no others. What is the GREATEST concern?"
options:
  A: "The taxonomy may need updating as new attack techniques are published"
  B: "Teams may be using the taxonomy as a checklist and missing design-specific threats"
  C: "The taxonomy's technical terms may be hard for senior managers to follow"
  D: "Different units may score the likelihood of the same threat differently"
answer: B
explanation:
  why_correct: "A taxonomy is a starting point that helps teams think broadly. Threat modelling must still examine each system's own data flows, integrations and use context. Teams that stop at the list will miss threats that come from their particular design, so the results give false assurance."
  why_not:
    A: "Keeping the taxonomy current matters, but the immediate problem is how teams use it, which affects every system now."
    C: "Communication to management can be handled by summarising results. It does not affect whether threats are found."
    D: "Inconsistent scoring is a calibration issue that comes after threats are identified. Missing threats is more basic."
