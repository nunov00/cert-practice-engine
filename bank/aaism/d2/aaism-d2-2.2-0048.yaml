subdomain: '2.2'
difficulty: easy
stem: 'A firm''s phishing simulations now use AI-written emails that are fluent and cite staff''s real projects, and click
  rates have risen sharply. Recent account takeovers follow the same path: staff enter their password on a convincing fake
  sign-in page and approve the MFA push that follows. Which control BEST reduces this threat?'
options:
  A: Training staff to spot the signs of AI-written phishing emails
  B: An AI-based email filter that scores each message's intent
  C: Sign-in with phishing-resistant keys bound to the real site
  D: Number matching on each MFA push that staff must approve
answer: C
explanation:
  why_correct: The takeovers work because a fake page relays what staff enter, password and MFA approval alike, to the real
    service in real time. Phishing-resistant keys sign only for the genuine site's address, so a fake page gets nothing it
    can replay, however convincing the email and page are. That breaks the attack at the point where it succeeds, rather than
    trying to stop every click.
  why_not:
    A: Training lowers click rates on crude lures, but these emails are fluent and personal, and the attack needs only one
      person to click.
    B: A better filter catches more emails, but some will always get through, and each one that does still leads to a takeover
      through the same sign-in path.
    D: Number matching stops staff approving random pushes, but on a relay page the user sees the number from their own live
      sign-in and approves it, so the attacker still gets in.
