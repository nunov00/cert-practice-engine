id: aaism-d2-2.3-0015
subdomain: '2.3'
difficulty: hard
stem: A hospital's only suitable vendor for a critical AI scheduling tool will not share a full AI bill of materials,
  citing intellectual property. The hospital's last two supply chain responses stalled because it could not tell
  which systems used affected components. What is the BEST approach?
options:
  A: Require notice when a flaw affects the tool's components
  B: Record a risk exception approved by the clinical owner
  C: Commission an independent security assessment of the tool
  D: Request the key components under a confidentiality agreement
answer: D
explanation:
  why_correct: The hospital's problem has been not knowing which systems contain an affected component. Getting
    the key components, such as the base model, third-party services and critical libraries, under a confidentiality
    agreement gives it that visibility while respecting the vendor's intellectual property.
  why_not:
    A: A notice clause is useful, but it relies on the vendor spotting and reporting each issue. It does not give
      the hospital its own view of what the tool contains.
    B: An exception may be needed if the vendor refuses everything, but it records the gap rather than closing it.
    C: An independent assessment tests security at a point in time. It does not give an ongoing record of components
      to check against new flaws.
