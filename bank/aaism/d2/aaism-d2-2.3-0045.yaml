id: aaism-d2-2.3-0045
subdomain: '2.3'
difficulty: hard
stem: A vendor's document AI will run in an insurer's own cloud account. The vendor proposes a standing admin role there so
  it can push weekly model and container updates. The insurer's main worry is a compromise of the vendor's own support accounts,
  which has hit other clients. What should the insurer require?
options:
  A: Admin access only after approval for each update window
  B: A standing admin role with its sessions recorded
  C: Signed releases that the insurer's own pipeline deploys
  D: Contract terms making the vendor liable for misuse
answer: C
explanation:
  why_correct: If the vendor's support accounts are compromised, any access they hold into the insurer's account goes to the
    attacker. Having the vendor publish signed releases, which the insurer's own pipeline checks and deploys, removes the
    vendor's access into the account altogether while keeping weekly updates.
  why_not:
    A: Just-in-time approval is a strong control for occasional access, but weekly windows soon become routine approvals.
      During each window a compromised support account would still have admin rights.
    B: Session recording helps investigation, but it only shows what a compromised account did after the fact. The standing
      admin role remains open to the attacker.
    D: Liability terms may help recover losses, but they do not reduce the chance or impact of a compromise. The insurer's
      data and systems would still be exposed.
