stem: A finding that an HR agent follows instructions hidden in uploaded CVs was rated medium, with a 90-day fix deadline,
  as the agent could only summarise. A week later, a release let the agent email candidates. What should the security manager
  do FIRST?
options:
  A: Keep the fix deadline set when the finding was rated
  B: Re-rate the finding with the email tool in scope
  C: Disable the email tool until the finding is fixed
  D: Add monitoring for unusual emails sent by the agent
answer: B
explanation:
  why_correct: The medium rating rested on the agent being unable to act. Hidden instructions can now trigger emails to
    outside people, which may raise the impact sharply. Re-rating is quick and decides whether the deadline must shorten
    or the tool must be held back.
  why_not:
    A: The deadline was set for an agent that could only summarise. Keeping it ignores the new way the weakness can be exploited.
    C: Disabling the tool may turn out to be the right treatment, but it removes a released feature before anyone knows
      how severe the combined risk is. The re-rating informs that decision.
    D: Monitoring may help detect abuse, but it is a treatment choice that should follow from the updated rating, not replace
      it.
