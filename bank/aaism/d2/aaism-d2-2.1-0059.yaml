subdomain: '2.1'
difficulty: hard
stem: A bank's chatbot risk assessment rates harmful-reply risk as low, relying on its model provider's content filter. The
  provider retunes the filter often and without notice, and last month a retune briefly let through replies that the bank's
  earlier tests had shown it blocking. How should the residual risk be rated?
options:
  A: On the provider's published filter test results, refreshed when it retunes
  B: On the bank's own tests of the live filter, repeated daily
  C: On the bank's pre-launch filter tests, adjusted for last month's lapse
  D: On the rate of harmful replies that customers have reported
answer: B
explanation:
  why_correct: A residual rating should rest on evidence that a control works now. Frequent tests of the live filter measure
    its current effect and catch silent retunes within a day.
  why_not:
    A: The provider's results cover its general test sets, not the bank's own harmful-reply cases, and they follow its publishing
      schedule rather than each silent retune.
    C: Pre-launch tests describe a filter that has since been retuned several times, so the rating would rest on behaviour
      that may no longer hold.
    D: Customer reports capture only harm that users notice and report, so they understate the rate and lag behind any change.
