id: aaism-d2-2.1-0037
subdomain: '2.1'
difficulty: hard
stem: A newly published technique bypasses the input-screening product used by twelve of an insurer's chatbots. The
  chatbots differ in exposure, impact and the other controls around them, and the team can reassess four this week.
  Which should it reassess FIRST?
options:
  A: Those with the highest inherent impact ratings
  B: Those whose residual rating relied most on the screen
  C: Those open to the public rather than to staff only
  D: Those where testing has found injection weaknesses before
answer: B
explanation:
  why_correct: The event changes how well one control works, so residual risk moves most where that control carried
    the rating. A chatbot with other strong layers may barely change, while one rated low mainly because of the screen
    may now sit above its threshold. Reassessing those first finds the ratings that are now wrong.
  why_not:
    A: Ranking by inherent impact is the normal way to order assessment work, but a high-impact chatbot with other layers
      may change little, while a chatbot that leaned on the screen may now be far above threshold.
    C: Public exposure raises the likelihood of attack and is a sound prioritisation factor, but it does not show where
      the bypass changes residual risk, which depends on what else protects each chatbot.
    D: Past injection findings point to weak designs, but they were rated with the screen working. Whether those ratings
      still hold depends on how much each one relied on the screen.
