id: aaism-d2-2.2-0040
subdomain: '2.2'
difficulty: hard
stem: A retailer's bug bounty now covers its shopping assistant, built on a vendor-hosted model. Triage is swamped
  by jailbreak reports. Each reply is shown only to the person who typed the prompt. Most reports show rude or off-brand
  replies; two got the assistant to call the refund tool, each in a few of many tries. What should triage MAINLY rate
  severity on?
options:
  A: The action or data the exploit reaches in the retailer's systems
  B: How reliably the exploit reproduces on the live version
  C: Whether the exploit gets past the vendor model's safety training
  D: The category of harmful content that the reply contains
answer: A
explanation:
  why_correct: The replies reach only the person who wrote the prompt, so offensive text mostly harms its own author
    and differs little from one report to the next. What separates a trivial report from a serious one is what the
    exploit unlocks, such as a refund, a record or another customer's data. Rating on that puts the two refund-tool
    findings first and lets the rest be closed quickly as low.
  why_not:
    B: Reproducibility is part of many bounty scales and helps weed out noise. Here the refund-tool exploits work only
      in a few tries, but retries cost an attacker nothing, so rating them low for that would bury the findings that
      matter most.
    C: Bypassing the model's safety training is what makes a report a jailbreak at all, so nearly every report meets
      it. It does not tell triage which ones carry real impact for the retailer.
    D: Content category is the usual severity basis for public-facing AI output. Here each reply is seen only by the
      person who asked for it, so content harm is low and similar across reports, while the refund calls cause direct
      loss.
