stem: A retailer's bug bounty now covers its shopping assistant, which runs on a vendor-hosted model. Triage is swamped
  by jailbreak reports. Most show only rude or off-brand replies, but two showed prompts that made the assistant call
  the retailer's refund tool. What should the security manager do?
options:
  A: Rate AI reports by what the assistant can be made to do
  B: Remove jailbreak reports from the bounty's scope
  C: Pass jailbreak reports to the model vendor to fix
  D: Pre-screen reports with a classifier to remove duplicates
answer: A
explanation:
  why_correct: The same technique can be trivial or serious depending on what it unlocks. Severity criteria based on
    impact, such as triggering tools, moving money or exposing data, let triage close the off-brand replies quickly as
    low and pay and fix the refund-tool findings first, which is where the retailer's real exposure lies.
  why_not:
    B: Many programmes exclude pure jailbreaks to cut noise. Here two jailbreaks reached the refund tool, so excluding
      the category would also drop the findings that matter most.
    C: Model behaviour is partly the vendor's to fix, but the refund tool and the permission to call it belong to the
      retailer's integration. Handing the reports over would leave the serious findings with a party that cannot fix
      them.
    D: De-duplication reduces volume, but it does not tell the remaining reports apart by impact. Triage would still
      face hundreds of distinct low-impact reports with no rule for ranking them.
