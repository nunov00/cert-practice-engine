subdomain: '3.4'
difficulty: hard
stem: A clinic's chatbot is meant only for booking appointments. Several patients who described chest pain were offered appointments
  days away. Many such messages arrive at night, when the clinic is closed. Which control BEST addresses this?
options:
  A: Detect emergency symptoms and hand off with urgent guidance
  B: Alert clinic staff on emergency keywords during opening hours
  C: Decline any request that is not about a booking
  D: Show a notice in each chat that it is not for emergencies
answer: A
explanation:
  why_correct: Patients will describe emergencies whatever the tool is for. The chatbot must recognise those signs and at
    once direct the patient to urgent care, since a booking days away, or a reply the next morning, can cost a life.
  why_not:
    B: Alerting staff works only while someone is there, and many of these messages arrive when the clinic is closed.
    C: Narrowing scope is often good practice, but declining leaves a patient with chest pain without guidance.
    D: A notice is easily missed by someone in distress, and these patients were already using the chat.
