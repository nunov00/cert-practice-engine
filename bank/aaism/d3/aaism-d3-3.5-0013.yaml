subdomain: '3.5'
difficulty: medium
stem: A translation service monitors each account's query volume to detect model extraction. Logs suggest an attacker is spreading systematic
  queries across hundreds of free accounts, each below the alert threshold. The business will not add friction to free sign-up. What
  is the BEST monitoring improvement?
options:
  A: Lower the per-account alert threshold so that smaller volumes also raise an alert
  B: Require identity verification for free accounts before they can use the service
  C: Apply a much stricter daily query limit to every free account on the service
  D: Correlate query patterns and sources across accounts to find coordinated use
answer: D
explanation:
  why_correct: The attack is designed to defeat per-account checks, so the detection must look across accounts. Correlating similar
    systematic inputs, shared sources and timing exposes coordinated extraction without changing the free sign-up the business wants
    to keep.
  why_not:
    A: A lower threshold floods analysts with false positives from normal users, and the attacker can simply spread across more accounts.
    B: Verification is a sound preventive control, but the business has ruled out more friction at sign-up, and it is not a monitoring
      change.
    C: Tighter limits make extraction slower but harm genuine free users, and the attacker can add accounts to compensate.
