subdomain: '3.5'
difficulty: hard
stem: A translation service alerts on each account's query volume to detect model extraction. An attacker spreads
  systematic queries across hundreds of free accounts, each below the threshold. Sign-up friction is ruled out.
  What is the BEST improvement?
options:
  A: Correlate query patterns across accounts
  B: Lower the per-account query alert threshold
  C: Cut the daily query limit for free accounts
  D: Verify identity before free accounts get access
answer: A
explanation:
  why_correct: The attack is designed to defeat per-account checks, so detection must look across accounts. Correlating
    similar systematic inputs, shared sources and timing exposes the coordinated extraction without adding sign-up
    friction.
  why_not:
    B: A lower threshold floods analysts with normal users, and the attacker can spread across even more accounts.
    C: Tighter limits slow extraction but hurt genuine users, and the attacker can add accounts to compensate.
    D: Identity verification is a sound preventive control, but the stem rules out sign-up friction and it is not
      a monitoring change.
