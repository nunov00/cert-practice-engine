id: aaism-d3-3.4-0032
subdomain: '3.4'
difficulty: medium
stem: A hospital's medication chatbot serves the public on its website and, after sign-in, its own ward nurses. Its safety
  filter blocks questions about overdose thresholds, which works as intended for the public. Nurses on shift are now blocked
  from dosing limits they need at the bedside. What should the security manager recommend?
options:
  A: Retrain the safety filter on labelled clinical dosing questions
  B: Raise the filter's blocking threshold for medication questions
  C: Apply a clinical content policy to signed-in nurse accounts
  D: Route nurses' blocked questions to the on-call pharmacist
answer: C
explanation:
  why_correct: The filter does what it was designed to do; the problem is that one policy serves two audiences with different
    needs. Nurses sign in, so their role is known. Applying a clinical policy to those accounts gives them dosing limits while
    the public keeps the protective one. Answers under the clinical policy should still be logged and drawn from the hospital's
    own formulary.
  why_not:
    A: Retraining fixes a filter that misjudges questions. This one judges them correctly, since overdose questions are what
      it should block for the public, so better labels would not change the outcome for nurses.
    B: A looser threshold would let some nurse questions through, but it applies to every user, so members of the public would
      also get the overdose information the filter is meant to withhold.
    D: A pharmacist gives nurses a safe answer, but at the bedside they need it in moments, and one on-call pharmacist cannot
      answer each blocked question at that speed.
