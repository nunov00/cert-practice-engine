subdomain: '3.3'
difficulty: medium
stem: A dataset was reviewed and approved for training at a car maker in March. Training will start in June using the copy
  in a shared store. What BEST ensures the data used is the data that was approved?
options:
  A: Record a hash of the approved version and verify it before training starts
  B: Repeat the full manual review of the dataset in the week before training begins
  C: Restrict read access to the shared store to the data science team only
  D: Keep a daily backup of the shared store throughout the waiting period
answer: A
explanation:
  why_correct: A fixed version with a recorded hash links approval to the exact content. Checking the hash before training
    proves nothing changed in the three months between, and the check can be automated in the pipeline.
  why_not:
    B: A second manual review is slow and costly, and changes could still happen after it.
    C: Read restrictions protect confidentiality, not integrity, and do not prove the content is unchanged.
    D: Backups help recovery but do not show whether the data was altered.
