id: aaism-d3-3.2-0019
subdomain: '3.2'
difficulty: medium
stem: A team runs a candidate model in shadow mode, feeding it live customer requests. It runs in the development account,
  which has wider staff access and weaker logging than production. What is the MAIN concern?
options:
  A: The candidate could learn from the live requests it receives
  B: Attackers could reach the candidate model through production
  C: The candidate's outputs could be cached and shown to customers
  D: Customer data reaches an account with weaker controls
answer: D
explanation:
  why_correct: Shadow mode is a sound way to test, but it copies production data to wherever the candidate runs. In the development
    account that data meets wider access and weaker logging, so it needs production-grade controls or a production-grade home.
  why_not:
    A: A model in shadow mode only makes predictions. It does not train on the requests unless set up to.
    B: Shadow traffic is copied out of production, so attackers do not gain a path in through it.
    C: Shadow outputs are recorded for comparison, not served, so customers do not see them.
