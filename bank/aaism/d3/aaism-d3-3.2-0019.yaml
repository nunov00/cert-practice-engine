subdomain: '3.2'
difficulty: medium
stem: A team runs a candidate fraud model in shadow mode, scoring copies of live card transactions. It runs in the development
  account, where every engineer has access. The candidate returns scores only and calls no other systems. What is the MAIN
  security concern?
options:
  A: Shadow scores may not show how fraudsters react to the new model
  B: The candidate's tool calls could act on live accounts
  C: Serving two models doubles the cost of scoring
  D: Live card data leaves production's access controls
answer: D
explanation:
  why_correct: Shadow mode is a sound way to test, but it copies production data to wherever the candidate runs. Here live
    card data sits where every engineer can read it, so the candidate needs production-grade access controls.
  why_not:
    A: Shadow results do miss how fraudsters adapt, but that limits the test's value, not security.
    B: Side effects are a real shadow-mode risk for models that call other systems, but this one returns scores only.
    C: Extra cost is an operational concern, not a security one.
