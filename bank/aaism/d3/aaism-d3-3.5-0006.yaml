stem: An education provider's output filter stops harmful content well in tests, but teachers report it blocks legitimate
  history lessons about wars. Which metric BEST tracks the problem the teachers raise?
options:
  A: Share of known harmful test prompts that the filter stops
  B: Share of benign test prompts that the filter wrongly stops
  C: Number of outputs the filter stops each week
  D: Number of teacher complaints about blocked replies
answer: B
explanation:
  why_correct: The teachers describe false positives. A test set of legitimate teaching prompts, including sensitive
    history topics, and the rate at which the filter wrongly blocks them measures that problem directly and repeatably.
  why_not:
    A: The harmful-prompt stop rate measures the other half of filter performance. The stem says that side already
      works.
    C: Block counts mix correct and wrong blocks and cannot show which is which.
    D: Complaints are a useful signal, but they are lagging and incomplete because many teachers will not report
      each block.
