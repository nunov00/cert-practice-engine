id: aaism-d3-3.5-0006
subdomain: '3.5'
difficulty: hard
stem: An online education provider uses an output filter to block harmful content from its tutoring chatbot. Which metric
  gives the BEST evidence that the filter is still effective?
options:
  A: The number of outputs that the filter blocks each week
  B: The number of complaints from learners about chatbot replies
  C: The rate at which known bypass prompts get through in tests
  D: The share of time the filter service has been fully available
answer: C
explanation:
  why_correct: Effectiveness means the filter stops what it should. Regularly running a maintained set of known bypass and
    harmful prompts and tracking how many get through measures that directly and shows decline before users are harmed.
  why_not:
    A: Block counts show activity, not effectiveness. A falling count could mean fewer attacks or more successful bypasses.
    B: Complaints are a lagging, incomplete signal that appears only after harm has reached learners.
    D: Availability shows the filter is running, not that it is catching harmful content.
