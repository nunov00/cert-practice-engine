id: aaism-d3-3.4-0028
subdomain: '3.4'
difficulty: hard
stem: A clinic's AI scribe records each consultation and drafts a summary. Clinicians replay passages when needed,
  edit the draft and sign it the same day, and the signed summary becomes the medical record. How long should the clinic
  keep the audio?
options:
  A: Until it has been transcribed into the draft
  B: Until the clinician signs the summary
  C: For 30 days, in case a patient disputes a summary
  D: For the retention period of the medical record
answer: B
explanation:
  why_correct: The audio serves one purpose, letting the clinician check and correct the draft. That purpose ends when
    the clinician signs, because the signed summary is the record from then on. Deleting the audio at sign-off keeps
    it for as long as it is used and no longer.
  why_not:
    A: Deleting at transcription is the most minimal choice, but clinicians replay passages while checking the draft,
      so the audio is still needed until they sign.
    C: A short buffer for disputes sounds prudent, but disputes are settled against the signed summary, which is the
      legal record, so keeping a recording of the whole conversation adds exposure without a use.
    D: Keeping data for the record's retention period suits material that forms part of the record. The audio does not,
      and keeping full recordings of consultations for years multiplies the sensitive data held.
