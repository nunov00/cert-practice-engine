id: aaism-d3-3.3-0005
subdomain: '3.3'
difficulty: medium
stem: At a utility, read access to training datasets in the data lake is granted by classification. Every analyst
  can still write to every dataset, and lineage records who wrote each file. What should the security manager recommend?
options:
  A: Writes only through controlled pipeline identities
  B: Masking of billing fields across the data lake
  C: Monthly review of the lineage write records
  D: Reads granted by data classification
answer: A
explanation:
  why_correct: 'Confidentiality is handled, but integrity is not: anyone can change data that models learn from.
    Lineage only records the change. Restricting writes to controlled pipeline identities prevents unreviewed changes.'
  why_not:
    B: Masking protects confidentiality, but analysts can still change every training dataset.
    C: Review is detective and finds a change after models have trained on it.
    D: This is already in place and addresses confidentiality, not the open write access.
