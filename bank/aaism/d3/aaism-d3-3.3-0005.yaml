id: aaism-d3-3.3-0005
subdomain: '3.3'
difficulty: medium
stem: At a utility company, all analysts can read and write every training dataset in a shared data lake. What should the
  security manager recommend?
options:
  A: Encrypt the whole data lake with keys that are held only by the central IT team
  B: Set need-to-know access by classification and limit writes to the pipeline
  C: Turn on detailed access logging and review the logs every quarter
  D: Ask analysts to sign an acceptable use agreement for the data lake
answer: B
explanation:
  why_correct: Open read access exposes sensitive data, and open write access lets anyone change data that models learn from.
    Need-to-know access by classification, with write rights limited to controlled pipeline identities, protects both confidentiality
    and integrity.
  why_not:
    A: Encryption protects against storage-level access, but analysts would still read and write through the normal interface.
    C: Logging is detective. Quarterly review is too late to stop poisoned data reaching models.
    D: An agreement sets expectations but does not technically prevent misuse or mistakes.
