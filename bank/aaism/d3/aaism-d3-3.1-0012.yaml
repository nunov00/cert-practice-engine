id: aaism-d3-3.1-0012
subdomain: '3.1'
difficulty: medium
stem: A telecom's support chatbot filters user prompts for injection attempts. Red team testing shows that instructions hidden
  in web pages the bot retrieves still make it give harmful answers. Which design gap does this MOST clearly show?
options:
  A: Untrusted content reaches the model by a path the filter misses
  B: The input filter's list of injection patterns is out of date
  C: The model was not fine-tuned with enough safety training examples
  D: Users are not authenticated before they can use the chatbot
answer: A
explanation:
  why_correct: The attack came through retrieved content, not the user's prompt. The design treated only user input as untrusted
    and placed its control on that path alone. Every source that feeds the model's context, and the output, needs controls.
    Updating the existing filter would not help because it never sees this content.
  why_not:
    B: Better patterns would still miss the attack, because the filter never inspects retrieved web content.
    C: More safety training might reduce some failures, but it is a model-level fix. The finding shows an architecture gap
      in where controls sit.
    D: Authentication identifies users, but the malicious instructions came from third-party web pages, not from the user.
