id: aaism-d3-3.2-0014
subdomain: '3.2'
difficulty: hard
stem: A retailer's pipeline pins its base model and libraries by hash and signs every model it builds. Production
  accepts only signed models. The signing key is a plain pipeline variable readable by every job, including third-party
  test plug-ins. What is the MAIN limitation?
options:
  A: An old signed model with known flaws could be redeployed
  B: Any job could sign an arbitrary model
  C: Signing gives no confidentiality for the weights
  D: A tampered input yields a validly signed model
answer: B
explanation:
  why_correct: A signature is only as trustworthy as the key. If every job, including third-party code, can read
    the key, a compromised plug-in can sign a malicious model that production will accept.
  why_not:
    A: Rollback is a valid concern, but nothing in the scenario points to it, while the key exposure is stated.
    C: True, but signing is used here for integrity, so this is not a limitation for that purpose.
    D: Inputs are pinned by hash, so tampered components would be rejected before training.
