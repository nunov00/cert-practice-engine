id: aaism-d3-3.2-0014
subdomain: '3.2'
difficulty: hard
stem: A retailer's training pipeline signs every model it builds, and production accepts only signed models. Each training run downloads
  the latest base model and libraries from public sources. What is the MAIN limitation of relying on the signature check?
options:
  A: The signing key could be stolen from the pipeline and used to sign an attacker's model
  B: A signature does not keep the model's weights confidential while they are in production
  C: An older signed model with known flaws could be redeployed and would pass the check
  D: A tampered input would be built into a model that still carries a valid signature
answer: D
explanation:
  why_correct: A signature proves that the model came from the pipeline unchanged. It cannot show that what went into the pipeline was
    trustworthy. Because each run pulls unpinned components from public sources, a compromised base model or library would produce a
    properly signed but malicious model. The fix is to pin and verify inputs, not only outputs.
  why_not:
    A: Key theft is a real risk for any signing scheme, but it is managed with key protection. The scenario's distinctive weakness is
      the unverified inputs.
    B: Signing was never meant to provide confidentiality, so this is not a limitation of relying on it for integrity.
    C: Rollback of old signed models is a valid concern handled by version checks. It does not arise from the facts given here.
