id: aaism-d3-3.5-0039
subdomain: '3.5'
difficulty: medium
stem: A firm's assistant answers from a vector index that only its ingestion pipeline should write to, after screening each
  document. The pipeline and two administrators all write with the same service credential. Which monitoring BEST detects
  entries planted directly in the index?
options:
  A: Alerts on each sign-in to the index's admin console
  B: Rescans of the source documents with the screening tool
  C: Sampled reviews of answers for signs of planted content
  D: Daily matching of index entries to pipeline records
answer: D
explanation:
  why_correct: Every legitimate entry should match a document the pipeline screened and recorded. Comparing the index with
    those records finds any entry written by another route, whoever held the shared credential, and does not depend on telling
    users apart.
  why_not:
    A: Console alerts help when each person has their own identity, but the shared credential means writes cannot be tied
      to a sign-in, and administrators sign in for normal work.
    B: Rescanning catches poisoned source documents, but an entry planted directly in the index has no source document to
      rescan.
    C: Answer reviews may eventually reveal planted content, but sampling is slow and partial, and an entry may only surface
      for rare queries.
