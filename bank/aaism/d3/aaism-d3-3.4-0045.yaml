subdomain: '3.4'
difficulty: hard
stem: An image-generation start-up will train on a public dataset of five billion web image links. Researchers have reported
  that an earlier version of the dataset contained child sexual abuse material. Which control is MOST important before training?
options:
  A: Run an adult-content classifier and drop the images it flags
  B: Match images against known-abuse hash lists, reporting any matches
  C: Exclude images hosted on web domains listed as adult-content sites
  D: Filter out images whose captions contain terms linked to abuse material
answer: B
explanation:
  why_correct: Matching against hash lists kept by child-protection bodies finds known abuse images without anyone viewing
    them, and supports the legal duty to report and remove what is found.
  why_not:
    A: An adult-content classifier is built for a different task and misses much abuse material, and it gives no route to
      report what it finds.
    C: Abuse material is often hosted on ordinary sites and file hosts, so a domain blocklist misses much of it and gives
      no route to report what remains.
    D: Captions are often missing, misleading or deliberately innocent, so filtering on caption terms misses much abuse material.
