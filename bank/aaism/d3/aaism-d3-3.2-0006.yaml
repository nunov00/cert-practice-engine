stem: Data scientists at an energy company train models on sensitive grid data in cloud notebooks. They can install any library
  from the internet and the notebooks have open outbound access. Which control BEST secures this training environment?
options:
  A: Add multi-factor authentication for access to the notebook service
  B: Allow packages only from an approved internal repository and restrict egress
  C: Encrypt the grid data at rest in the storage accounts used for model training
  D: Scan each trained model for malicious code before it is deployed
answer: B
explanation:
  why_correct: The gap is that untrusted code can enter freely and data can leave freely. An approved package source cuts
    the risk of a malicious dependency, and egress restrictions stop sensitive data or models from being sent out. Together
    they harden the environment where the most sensitive work happens.
  why_not:
    A: MFA protects logins but does nothing about a malicious library run by a legitimate user, or about data leaving over
      open egress.
    C: Encryption at rest protects stored data, but running code inside the notebook reads it decrypted.
    D: Scanning the final model comes late and may miss a compromise that stole data during training.
