difficulty: medium
stem: Data scientists at an energy company train models on grid data in cloud notebooks. Libraries come from a vetted
  internal mirror and outbound internet is blocked. All notebooks run under one shared cloud identity that can read
  every grid dataset. Which control BEST secures this environment?
options:
  A: Internal package mirror and restricted egress
  B: MFA and device-based conditional access for notebook logins
  C: Per-project service accounts scoped to each project's data
  D: Customer-managed keys for grid data at rest
answer: C
explanation:
  why_correct: Supply chain and egress are already controlled. The remaining gap is that any notebook, or any code
    running in it, can read every sensitive dataset. Project-scoped identities limit each workload to the data it
    needs and make access attributable.
  why_not:
    A: Both are already in place, so this adds nothing to the gap in data access.
    B: Stronger logins protect user accounts, but once inside, every notebook still runs as the identity that reads
      all data.
    D: The shared identity is authorised to read the data, so it would read it decrypted regardless of who holds
      the keys.
