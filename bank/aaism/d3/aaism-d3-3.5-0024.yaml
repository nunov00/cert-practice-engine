stem: An AI agent reads supplier documents and can update records in the finance system. Staff suspect that a document led
  it to change a supplier's bank details. Which log is MOST essential to confirm what the agent did?
options:
  A: Prompt and response logs from the model gateway
  B: Model-serving latency and error metrics
  C: Token usage logs per agent from the model provider
  D: Tool-call logs with parameters and the identity used
answer: D
explanation:
  why_correct: The question is which action the agent took in the finance system. Tool-call logs record each call, its parameters
    and the identity used, which shows whether and how the bank details were changed.
  why_not:
    A: Prompt and response logs show what the model saw and wrote, which helps explain why, but they may not show which actions
      were actually executed.
    C: Token usage shows volume and cost, not what the agent did.
    B: Latency and error metrics show service health, not the actions taken.
