id: aaism-d3-3.4-0008
subdomain: '3.4'
difficulty: medium
stem: Caseworkers at a benefits agency confirm 99 percent of an AI model's fraud flags, most within ten seconds.
  An audit re-examined a sample and found the flags accurate. What BEST shows whether caseworker review would catch
  a wrong flag?
options:
  A: Have a separate team re-examine another sample of flags
  B: Compare the confirmation rate with other agencies' rates
  C: Survey caseworkers on how they check each flag
  D: Seed known incorrect flags into caseworkers' queues
answer: D
explanation:
  why_correct: The question is no longer whether the model is accurate, which the audit addressed, but whether the
    human review would stop an error. Fast confirmations of mostly correct flags cannot show that. Inserting flags
    known to be wrong and checking whether caseworkers reject them tests the oversight control directly.
  why_not:
    A: Independent re-examination tests the model's accuracy, which the audit has already done. It says nothing
      about whether caseworkers would notice a wrong flag.
    B: Other agencies use different models and caseloads, so a comparison of confirmation rates cannot show whether
      these reviewers catch errors.
    C: Self-reported checking habits are weak evidence, especially where ten-second confirmations suggest the review
      may be cursory.
