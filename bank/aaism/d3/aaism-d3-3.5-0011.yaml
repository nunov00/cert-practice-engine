subdomain: '3.5'
difficulty: medium
stem: A support chatbot answers from a knowledge base holding public help articles and internal pricing files. It
  disclosed internal pricing, but only prompts and answers were logged. What additional logging would be MOST useful?
options:
  A: The system prompt version used for each answer
  B: The model version serving each answer
  C: The document IDs retrieved for each answer
  D: The session and device details of each user
answer: C
explanation:
  why_correct: The pricing must have come from the knowledge base. Logging which documents were retrieved for each
    answer shows whether a restricted file was reachable through retrieval or injected content, which is what the
    investigators lacked.
  why_not:
    A: System prompt versions help explain changes in behaviour, but the prompt does not contain the pricing; the
      retrieved content does.
    B: Model versions help trace regressions, but the model did not learn the pricing from training; it came from
      retrieval.
    D: User details help attribution, but they do not show how pricing reached the answer.
