id: aaism-d3-3.5-0014
subdomain: '3.5'
difficulty: hard
stem: A cloud firm's infrastructure agent has delete rights on storage to clean up old resources. It writes its
  own action logs to a locked bucket in a separate account, which the SOC monitors. What BEST ensures the SOC sees
  each deletion the agent makes?
options:
  A: Write the agent's logs to an account it cannot modify
  B: Hash the agent's log files nightly and store the hashes
  C: Require human approval for bulk deletions by the agent
  D: 'Monitor the provider''s audit trail of the agent''s calls'
answer: D
explanation:
  why_correct: The locked bucket stops the agent's logs from being altered, but they are still the agent's own account
    of its actions. A manipulated or faulty agent can leave a deletion out. The cloud provider's audit trail records
    each API call independently of the agent, so the SOC sees deletions even if the agent does not report them.
  why_not:
    A: Tamper-resistant log storage is the usual recommendation, but the logs already go to a separate locked account.
      The gap is what the agent chooses to write.
    B: Hashing proves logs were not changed after writing, but it cannot reveal actions that were never logged.
    C: Approval for bulk deletions is a useful preventive control, but it does not give the SOC visibility of individual
      deletions.
