id: aaism-d3-3.5-0014
subdomain: '3.5'
difficulty: hard
stem: An infrastructure agent at a cloud services firm needs delete rights on storage to clean up old resources. It writes its action
  logs to a bucket in the same account, and those logs are the main evidence the SOC uses to monitor it. What should the security manager
  recommend?
options:
  A: Send the logs to a separate account that the agent's identity cannot change
  B: Hash the log files each night and keep the hashes in a protected location
  C: Have the SOC review the agent's logs every day for unexpected deletions
  D: Remove the agent's delete rights and have staff run the cleanup by hand
answer: A
explanation:
  why_correct: A monitored actor must not be able to alter its own evidence. Because the agent has delete rights in the same account,
    a compromised or misbehaving agent could erase the record of what it did. Writing logs to a separate store outside its reach keeps
    the evidence intact while the agent keeps the rights its task needs.
  why_not:
    B: Nightly hashes detect later changes, but the agent can delete or alter entries before the hash is taken, and deletion still destroys
      the evidence.
    C: Daily review is only as good as the logs reviewed. If the agent can delete entries, the SOC may see a clean but false record.
    D: This removes the risk but also the business benefit, and the cleanup task legitimately needs those rights.
