subdomain: '3.5'
difficulty: medium
stem: A homework-help chatbot for schoolchildren sends each reply through a safety guardrail service, and sends the
  reply unchecked if the guardrail does not answer within two seconds. Logs show some users sending very long prompts
  that make the guardrail time out. Which change BEST addresses this?
options:
  A: Add guardrail capacity so it answers within the time limit
  B: Alert the SOC when unchecked replies exceed a set share
  C: Withhold any reply that the guardrail has not cleared
  D: Test the guardrail's detection rate on long prompts weekly
answer: C
explanation:
  why_correct: The guardrail fails open, and users have found how to trigger that on purpose. Withholding uncleared
    replies makes a timeout cost the user a retry rather than an unchecked answer, which suits a service for children,
    whatever the cause of the delay.
  why_not:
    A: More capacity fixes timeouts caused by load, but here users control prompt length and can keep pushing processing
      time past any limit.
    B: Alerting on unchecked replies shows the problem to the SOC, but the replies have already reached children by the
      time anyone responds.
    D: Testing detection on long prompts checks how well the guardrail judges them, but the replies at issue are never
      judged at all because the guardrail times out.
