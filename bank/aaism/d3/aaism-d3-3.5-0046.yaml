subdomain: '3.5'
difficulty: hard
stem: After its shopping assistant issued discounts for an hour before anyone acted, a retailer's SOC set a playbook that
  suspends the assistant for every customer when its injection detector fires three times in an hour. The assistant is now
  suspended several times a week, each time by one or two accounts sending well-known attack prompts. Which change BEST fits?
options:
  A: Raise the trigger to ten detections within one hour
  B: Require an analyst to approve each suspension it proposes
  C: Suspend the sessions and accounts that set off the detector
  D: Retune the detector to cut down its rate of false positives
answer: C
explanation:
  why_correct: Suspending the whole assistant lets any one account take the service down for every customer by sending known
    attack prompts. Scoping automatic containment to the sessions and accounts that set off the detector keeps the fast response
    the earlier incident showed was needed, while other customers keep the service.
    The playbook should still escalate to a wider suspension when detections span many accounts or point to a shared
    failure, such as discounts actually being issued.
  why_not:
    A: A higher threshold still lets one or two accounts force a full suspension by sending a few more prompts, and it slows
      the response to a real attack.
    B: Analyst approval would stop the needless outages, but it brings back the human delay that let the earlier incident
      run for an hour.
    D: The detections are true positives, well-known attack prompts, so retuning for false positives would not reduce them
      and could weaken detection.
