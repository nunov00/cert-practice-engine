id: aaism-d3-3.5-0016
subdomain: '3.5'
difficulty: hard
stem: A law firm's assistant retrieves from restricted merger files for authorised teams. Its answers can also draw on cached
  answers and notes saved from earlier chats. Which control BEST detects merger content reaching users outside those teams?
options:
  A: Unique canary phrases in the files with alerts on output
  B: Logs of the document IDs retrieved for each answer
  C: Data loss rules that match deal code names in answers
  D: Quarterly red team tests of the assistant's access rules
answer: A
explanation:
  why_correct: Restricted content can reach an answer through retrieval, the cache or saved notes. Planting unique canary
    phrases in the files and alerting when one appears in an answer to an unauthorised user detects the leak whichever path
    it took.
  why_not:
    B: Retrieval logs show restricted documents fetched for the wrong user, but content served from the cache or from saved
      notes leaves no retrieval record.
    C: Code-name rules are useful, but outsiders may legitimately mention a code name, and leaked content can be paraphrased
      without one.
    D: Red team tests check the access rules at a point in time, but they do not detect a leak that happens between tests.
