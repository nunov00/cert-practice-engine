id: aaism-d3-3.3-0007
subdomain: '3.3'
difficulty: easy
stem: Which control MOST directly protects the confidentiality of training data if the storage media in a cloud provider's
  data centre are accessed without authorisation?
options:
  A: Strict role-based access to the training data in the cloud console
  B: Detailed logs of every read and write on the training datasets
  C: Encryption at rest with keys that the organisation manages
  D: Regular backups of the training data to a second region
answer: C
explanation:
  why_correct: Access to the physical media bypasses application and console controls. Encryption at rest with keys the organisation
    controls makes the data unreadable without those keys.
  why_not:
    A: Console access controls do not apply when someone reaches the underlying media directly.
    B: Logs record access through normal interfaces but neither prevent nor reliably capture media-level access.
    D: Backups support availability and create another copy to protect. They do not keep the data confidential.
