id: aaism-d3-3.3-0013
subdomain: '3.3'
difficulty: medium
stem: A hospital's data scientists need to link each patient's visits over time to train a readmission model. A synthetic data trial
  lost the rare conditions the model must learn. Which approach BEST protects the data while meeting the need?
options:
  A: Generate a larger synthetic dataset with extra weight given to the rare conditions
  B: Fully anonymise the records by removing all identifiers and the visit dates
  C: Train on pseudonymised records in a secure enclave that blocks export
  D: Give the team encrypted extracts of the records and log every access to them
answer: C
explanation:
  why_correct: The model needs linked visits and real rare cases, which rules out full anonymisation and synthetic data. Pseudonymised
    records keep the linkage without direct identifiers, and a secure enclave with no export keeps the data inside protected boundaries.
    This gives the most protection that still allows the work.
  why_not:
    A: Weighting may improve the synthetic data, but the trial showed it misses rare conditions. It adds more uncertainty and does not
      meet the need.
    B: Removing identifiers and dates breaks the visit linkage and timing that a readmission model depends on.
    D: Extracts move the data out to many locations. Encryption and logging help, but they protect it far less than keeping it in a
      controlled environment.
