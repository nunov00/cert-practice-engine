subdomain: '3.4'
difficulty: hard
stem: A city council uses a model to set the priority of housing repair requests. Volumes are too high for staff to review every decision.
  Complaints show that some cases affecting vulnerable tenants were rated low and left waiting for months. What should be done to improve
  oversight?
options:
  A: Route low ratings to a caseworker when vulnerability signs exist or confidence is low
  B: Have staff review a random five percent sample of all ratings each week and report the findings
  C: Publish how priority is set and give tenants a simple way to appeal a low rating
  D: Retrain the model with the cases from the complaints labelled with their correct priority
answer: A
explanation:
  why_correct: Where reviewing every decision is not possible, oversight should be targeted at the decisions most likely to cause serious
    harm. Routing low ratings with vulnerability signs or low model confidence to a person puts human judgement where errors hurt most,
    before the harm happens.
  why_not:
    B: Random sampling measures overall quality, but it will miss most of the rare high-harm cases and finds them only after the fact.
    C: Transparency and appeal are valuable, but they rely on vulnerable tenants noticing and challenging a rating, which many may not
      do.
    D: Retraining may improve the model, but a few corrected cases will not remove all such errors, and there is still no human check
      on high-risk outcomes.
