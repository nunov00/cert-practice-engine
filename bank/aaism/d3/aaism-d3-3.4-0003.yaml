id: aaism-d3-3.4-0003
subdomain: '3.4'
difficulty: medium
stem: A bank shares a trained credit default model with a fintech partner instead of sharing customer records. The project
  lead says this removes the privacy risk. What is the BEST response from the information security manager?
options:
  A: The model can still reveal who was in the training data, so it needs privacy controls
  B: Agree, provided that the partners sign confidentiality agreements before receiving it
  C: Agree, because model weights hold learned parameters and not the original records
  D: Ask that customer records be anonymised before the next retraining of the model
answer: A
explanation:
  why_correct: Trained models can leak information about their training data through membership inference or model inversion.
    A shared model can therefore still expose customers. It should be treated as a privacy-relevant asset, with a risk assessment
    and controls such as limited access, query limits or privacy-preserving training.
  why_not:
    B: Confidentiality agreements are a useful supporting control, but they accept the false premise that the risk is gone
      and do not limit what the model can leak.
    C: This is the misconception the manager should correct. Parameters can encode enough about individuals to be exploited.
    D: Anonymising future data may help later versions, but the model already shared was trained on identifiable records and
      remains exposed.
