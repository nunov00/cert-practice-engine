subdomain: '3.2'
difficulty: hard
stem: An insurer has switched off a retired claims model's endpoint. Its weights, a training copy of medical reports
  that the claims system still holds, and logs of each decision's inputs remain. Disputed claims can be reopened for
  six years, and a dispute may require re-running the original decision. What should the retirement plan do with these?
options:
  A: Keep the weights and decision logs, delete the training copy
  B: Keep the training copy and logs, delete the weights
  C: Keep the three, under restricted access, for six years
  D: Keep the decision logs, delete the weights and training copy
answer: A
explanation:
  why_correct: Re-running a disputed decision needs the exact model and the inputs it saw, so the weights and decision
    logs must be kept for the dispute period. The training copy is a duplicate of medical reports the claims system already
    holds, so keeping it adds a second store of sensitive data with no purpose the original does not serve.
  why_not:
    B: Keeping the training data seems to allow the model to be rebuilt, but retraining does not reproduce identical
      weights, so the original decision could not be re-run exactly.
    C: Keeping everything is a cautious default for disputes, but the training copy duplicates data held in the claims
      system. Retaining it for six years keeps a needless copy of medical reports.
    D: Logs show what went in and came out, which suits minimisation, but a dispute may need the decision re-run. Without
      the weights that cannot be done.
