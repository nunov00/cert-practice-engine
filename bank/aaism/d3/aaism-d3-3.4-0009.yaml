id: aaism-d3-3.4-0009
subdomain: '3.4'
difficulty: medium
stem: A water utility's chatbot answers billing questions only from approved policy documents and cites them. Customers
  complain it confidently quoted bill credit rules that were withdrawn in the spring. Which measure BEST restores
  their trust?
options:
  A: Ground billing answers in approved policy and cite sources
  B: Review the policy library each time a billing rule changes
  C: Publish the chatbot's measured accuracy on the website
  D: Add a notice that answers may contain errors
answer: B
explanation:
  why_correct: 'The chatbot did what it was designed to do: it answered from the approved library. The failure is
    that the library still held withdrawn rules. Making a library review part of each billing rule change keeps
    the grounding source current, which removes the cause of the wrong answers.'
  why_not:
    A: Grounding with citations is the usual fix for confident wrong answers, but the chatbot already does it. Grounding
      in an outdated library reproduces the outdated rules.
    C: Publishing an accuracy figure informs customers but does not stop the chatbot from quoting withdrawn rules.
    D: A disclaimer shifts the burden to customers and may further reduce trust, while the outdated rules remain
      in use.
