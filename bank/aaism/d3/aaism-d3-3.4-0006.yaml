id: aaism-d3-3.4-0006
subdomain: '3.4'
difficulty: hard
stem: A staffing firm hiring for rural warehouse roles reviews a candidate ranking tool. An independent auditor
  confirmed equal selection rates by gender and age across the vendor's clients, mostly urban office employers.
  What is the GREATEST concern with this evidence?
options:
  A: Other features may still act as proxies for gender or age
  B: The tested population may differ from the firm's applicants
  C: The results may rely on the vendor's own selection of data
  D: The vendor may not disclose its full list of input features
answer: B
explanation:
  why_correct: Outcome-based fairness results hold only for the population tested. The audit covered mostly urban
    office hiring, while the firm recruits for rural warehouse roles, where applicants and job criteria differ.
    The tool may treat this population differently, so the firm should test outcomes on its own applicant data.
  why_not:
    A: Proxy bias is a real risk in general, but outcome-based testing would show proxy effects in the population
      tested. The problem is which population that was.
    C: Independence of the evidence is the usual concern, but the stem says an independent auditor confirmed it.
      Even a perfect audit of urban clients says little about rural warehouse applicants.
    D: Limited feature disclosure is a due diligence gap, but a full list would not show whether outcomes are fair
      for the firm's own applicants.
