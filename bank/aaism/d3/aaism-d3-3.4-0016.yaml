stem: Finance staff at a manufacturer have received calls using cloned executive voices to request urgent supplier
  payments. A deepfake voice detector piloted last month flagged 30% of genuine calls. Which control BEST reduces
  the fraud risk?
options:
  A: Deploy the voice detector on the finance phone lines
  B: Run awareness sessions on voice cloning for finance staff
  C: Publish executive videos with signed content credentials
  D: Verify payment requests through a known callback number
answer: D
explanation:
  why_correct: 'Out-of-band verification does not depend on spotting the fake: a callback to a number on record
    reaches the real executive, so a cloned voice alone cannot authorise a payment.'
  why_not:
    A: With 30% false alarms on genuine calls, staff would soon ignore the detector, and detection can be evaded
      as cloning improves.
    B: Awareness helps staff stay alert, but good clones are hard to recognise by ear, so it cannot be the main
      control.
    C: Content credentials help prove which videos are authentic. They do not stop a phone call that imitates a
      voice.
