id: aaism-d3-3.5-0003
subdomain: '3.5'
difficulty: medium
stem: A payments firm lets merchants call its fraud scoring model through an API. Which monitoring control would BEST detect
  attempts to replicate the model?
options:
  A: A monthly review of the model's accuracy on new transactions
  B: Transport encryption on all calls made to the scoring API
  C: Hidden watermarks embedded in the scores the model returns
  D: Per-merchant analysis of query volume and input patterns
answer: D
explanation:
  why_correct: Model extraction needs many queries, often with systematically varied inputs. Baselining each merchant's normal
    volume and input distribution and alerting on deviations detects this pattern while it is happening.
  why_not:
    A: Accuracy reviews measure model quality. A copied model does not change the original model's accuracy.
    B: Encryption protects data in transit, but extraction uses legitimate, encrypted API calls.
    C: Watermarks may help prove theft afterwards. They do not detect an extraction attempt in progress.
