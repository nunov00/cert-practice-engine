stem: Fraud losses at a payments firm rose while its fraud model's flag rate stayed flat. Investigators found fraudsters
  submitting small variations of a transaction until one passes. Which monitoring BEST detects this?
options:
  A: Alerts on input drift across the merchant population
  B: Alerts on repeated near-threshold scores from similar inputs
  C: A monthly accuracy review using confirmed fraud labels
  D: Alerts on spikes in the overall number of flagged transactions
answer: B
explanation:
  why_correct: 'This is an evasion attack by probing: many near-identical transactions scored just around the decision
    threshold until one slips under it. Detecting clusters of similar inputs that land near the threshold spots
    the probing while it is happening.'
  why_not:
    A: Drift alerts catch broad shifts in inputs, but a few probing sequences barely move the overall distribution.
    C: Accuracy reviews on confirmed fraud will show the decline, but only after losses and with a lag of weeks.
    D: The stem says the flag rate stayed flat, so an alert on overall flag volume would not have fired.
