stem: A retail chain's HR chatbot answers from intranet policy pages that only HR can edit, after review. The chatbot
  also indexes the comments any employee can post under each page. All pages are meant for every employee. What
  is the GREATEST concern?
options:
  A: Staff seeing pages meant for managers
  B: Unreviewed edits to HR pages altering answers
  C: Unvetted staff posts shaping the bot's answers
  D: Stale answers between scheduled index refreshes
answer: C
explanation:
  why_correct: Page edits are controlled, but comments are open to everyone and enter the same knowledge base. One
    person can plant false policy or hidden instructions in a comment, and the chatbot may repeat it with authority.
  why_not:
    A: Every page is meant for every employee, so over-exposure is not the concern.
    B: Only HR can edit pages, after review, so this path is controlled.
    D: Staleness is a quality issue and less serious than deliberate manipulation.
