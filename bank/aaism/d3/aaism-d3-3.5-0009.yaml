id: aaism-d3-3.5-0009
subdomain: '3.5'
difficulty: hard
stem: Internal audit reviews an insurer's AI controls once a year. Management wants assurance that key controls, such as guardrails
  and access limits, keep working between audits. What is the BEST approach?
options:
  A: Ask internal audit to test the AI controls each quarter
  B: Rely on the AI vendor's yearly independent control report
  C: Increase the sample size used in the annual audit of AI
  D: Set up continuous control monitoring owned by management
answer: D
explanation:
  why_correct: Ongoing assurance is a management responsibility. Automated, continuous checks on key controls, owned by the
    control owners and reported to management, give timely evidence and early warning of failure. Internal audit can then
    rely on and test this monitoring.
  why_not:
    A: More frequent audits shift a management duty to the third line and still leave gaps between tests.
    B: A vendor report covers the vendor's controls, not the insurer's own configuration, and is also only periodic.
    C: Larger samples improve one point-in-time review. They do not provide assurance between audits.
