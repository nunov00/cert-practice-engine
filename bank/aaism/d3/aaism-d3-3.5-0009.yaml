id: aaism-d3-3.5-0009
subdomain: '3.5'
difficulty: medium
stem: An insurer runs automated daily tests of its chatbot guardrails using attack prompts written at launch, and
  they pass each day. A recent red-team exercise bypassed the guardrails with newer techniques. What BEST makes
  the daily results meaningful evidence?
options:
  A: Update the test prompts with newly found attack techniques
  B: Run the existing automated tests after each configuration change
  C: Have internal audit test the guardrails each quarter
  D: Obtain the vendor's annual independent control report
answer: A
explanation:
  why_correct: The daily tests run often enough but test only attacks known at launch, so passing them says little
    about current threats. Feeding new techniques, such as those from the red team, into the test set keeps the
    automated evidence relevant.
  why_not:
    B: Testing after each change adds frequency, but with the same outdated prompts it still misses the techniques
      the red team used.
    C: Quarterly audit testing adds independence but is too infrequent to be ongoing evidence, and it does not fix
      the daily tests.
    D: A vendor report covers the vendor's controls once a year, not the insurer's own changing guardrail configuration.
