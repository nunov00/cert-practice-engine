id: aaism-d3-3.1-0002
subdomain: '3.1'
difficulty: hard
stem: A law firm's assistant filters every retrieved passage against the user's matter permissions, synced nightly
  from the records system. A lawyer walled off from a matter at 10:00 still received passages from it that afternoon.
  Which change BEST closes this gap?
options:
  A: Tag each indexed chunk with its matter label
  B: Build a separate vector index per practice group
  C: Apply ethical-wall changes to the filter immediately
  D: Filter retrieved passages on the user's matter permissions
answer: C
explanation:
  why_correct: 'Query-time filtering already exists and works at the right granularity. The failure is timing: a
    wall added during the day is invisible to the filter until the nightly sync. Pushing wall changes as they happen,
    or checking the authoritative source at query time, removes that window.'
  why_not:
    A: Matter tags are what the filter already relies on. Better tagging does not help when the permission data
      behind the filter is hours out of date.
    B: Walls exist inside practice groups, so a group index would still expose walled-off matters to colleagues,
      and it does nothing about the sync delay.
    D: This control is already in place. It enforced stale permissions, so repeating it does not fix the delay.
