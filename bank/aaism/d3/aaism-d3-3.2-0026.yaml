stem: A bank's release pipeline runs a jailbreak test suite against each new chatbot version. Several attack prompts
  succeed on some runs and fail on others, so the same version can pass one day and fail the next. In production the
  chatbot generates replies with sampling switched on. Which change BEST makes the gate reliable?
options:
  A: Run the suite with sampling switched off so results repeat
  B: Have red teamers judge each attack with mixed results before release
  C: Gate on the worst result of three runs at production settings
  D: Run each attack many times and gate on its success rate
answer: D
explanation:
  why_correct: With sampling on, whether an attack works is a matter of probability, so a single run per prompt gives a
    near-random verdict for any attack that works only part of the time. Running each attack enough times to estimate
    its success rate with a confidence bound, and gating on a defined acceptance limit, measures what attackers in
    production face, since they can simply try again, and makes the verdict far more consistent from one run to the
    next.
  why_not:
    A: Switching sampling off makes results repeat, but the gate then tests a configuration customers never meet, and an
      attack that works one time in ten in production may never work in the test.
    B: Human judgement adds review effort, but it does not measure how often an attack succeeds, so the release decision
      still rests on a few inconsistent runs.
    C: Taking the worst of three runs is stricter than one run, but an attack that works one time in ten is still missed
      in most sets of three, so the gate keeps giving different verdicts.
