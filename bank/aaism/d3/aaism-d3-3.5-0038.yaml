id: aaism-d3-3.5-0038
subdomain: '3.5'
difficulty: easy
stem: An IT helpdesk agent acts on ticket text that anyone in the company can write. It holds standing domain
  administrator rights so that it can reset executives' passwords, a task it performs about twice a month. Which control
  BEST reduces the risk from these rights?
options:
  A: Reset rights only, held by the agent between tasks
  B: Reset rights only, granted per approved task, then removed
  C: Domain admin rights, granted per approved task, then removed
  D: Reset rights only, used when the ticket names an approver
answer: B
explanation:
  why_correct: 'The agent needs reset power for a few minutes twice a month but holds full domain administrator rights
    permanently, while taking instructions from text anyone can write. Granting only the password-reset right for an
    approved task and removing it afterwards applies least privilege and least standing privilege together: a
    manipulated agent has no administrator power the rest of the time, never more than a reset when it does, and each
    use is tied to a human decision.'
  why_not:
    A: Narrowing the rights to resets helps, but the agent still holds them standing, so any ticket that manipulates it can
      reset an executive's password at any time.
    C: Granting rights per task removes standing access, but each task still hands full domain administrator power to an
      agent that reads text anyone can write.
    D: An approver named in the ticket is itself ticket text that anyone can write, so it gives no real check and the
      reset rights stay standing.
