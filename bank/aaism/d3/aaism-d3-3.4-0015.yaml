id: aaism-d3-3.4-0015
subdomain: '3.4'
difficulty: hard
stem: A hospital's diagnosis model API returns full confidence scores for every condition. Membership inference
  tests show high risk for rare-disease patients, and differential privacy made those diagnoses clinically unusable.
  What BEST reduces the risk?
options:
  A: Retrain with differential privacy and accept lower accuracy
  B: Remove rare-disease patients from the training data
  C: Return the predicted diagnosis without scores
  D: Monitor researchers' queries for inference patterns
answer: C
explanation:
  why_correct: Membership inference attacks rely mostly on detailed confidence scores. Returning only the predicted
    label removes the main signal the attack uses while keeping the model clinically useful, which fits the constraint
    that the training-time control is not workable.
  why_not:
    A: Differential privacy is the strongest formal protection, but the stem says it makes the model unusable for
      the patients who most need it.
    B: Excluding these patients protects their records but makes the model fail on rare diseases, a safety and fairness
      harm.
    D: Query monitoring is a useful detective control, but each query still returns the scores the attack needs,
      and subtle attacks may not stand out.
