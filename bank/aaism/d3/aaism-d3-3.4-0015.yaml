id: aaism-d3-3.4-0015
subdomain: '3.4'
difficulty: medium
stem: A hospital offers researchers an API to its diagnosis model. Membership inference tests show high risk for patients with rare
  diseases. Training with differential privacy cut accuracy on those diseases below clinical use. What is the BEST way to reduce the
  privacy risk?
options:
  A: Retrain with strong differential privacy and accept the lower accuracy for rare diseases
  B: Return only the top diagnosis to vetted researchers, with per-user query limits
  C: Remove the rare disease patients from the training data before the next retraining
  D: Tell patients in a privacy notice that their data may be inferable from the model
answer: B
explanation:
  why_correct: Membership inference relies on detailed outputs such as confidence scores and many queries. Returning only the label,
    restricting access to vetted users and limiting queries cuts the attack surface while keeping the model clinically useful. This
    fits the constraint that the stronger training-time control is not workable here.
  why_not:
    A: Differential privacy is the strongest formal protection, but the test showed it makes the model unusable for the patients who
      most need it.
    C: Removing these patients protects them but makes the model fail on rare diseases, which is a safety and fairness harm.
    D: Transparency is good practice, but telling patients about the risk does not reduce it.
