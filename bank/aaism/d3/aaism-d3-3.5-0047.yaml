difficulty: hard
stem: A health insurer's SOC investigates leaks from its member chatbot using full prompt logs, which hold members'
  diagnoses. Analysts triage alerts daily using session patterns, and a few times a month an investigation must see
  exactly what a member disclosed. Which logging design BEST fits?
options:
  A: Full logs readable only by named senior analysts, with each access recorded
  B: Session metadata only, with the text of prompts and replies not stored
  C: Logs with personal details tokenised, revealed only for approved cases
  D: Full logs encrypted and deleted after 30 days unless a case holds them
answer: C
explanation:
  why_correct: Tokenising the personal details in stored text, with the originals kept in a separate vault, lets analysts
    triage on session patterns without reading diagnoses, while an approved investigation can reveal exactly what a member
    disclosed. Access to the sensitive content then follows the need, which is rare, rather than the role.
  why_not:
    A: Restricting and recording access is sound, but the named analysts would still read diagnoses in daily triage, which
      needs none of them, and other analysts would lose the logs they triage on.
    B: Metadata alone protects members best, but an investigation must see what a member actually disclosed, which only
      the stored text can show.
    D: Encryption and a 30-day limit narrow the exposure, but analysts doing triage would still read full text with
      diagnoses, and a leak found after 30 days would have no evidence left.
