subdomain: '3.5'
difficulty: medium
stem: A firm's AI gateway logs every prompt to its model provider and runs data loss checks on them. An insider uploaded customer
  exports to the firm's provider account as fine-tuning files through the provider's console, then downloaded them at home through
  the provider's file API. Which monitoring BEST detects a repeat?
options:
  A: Data loss rules on gateway prompts, tuned to match customer exports
  B: Provider account audit logs in the SIEM, with alerts on file activity
  C: Proxy alerts on large uploads from staff devices to the provider's domain
  D: Alerts when model spending on the provider account rises above normal
answer: B
explanation:
  why_correct: The files went in through the console and out through the file API, neither of which passes the gateway, and the
    download came from outside the firm's network. The provider's account audit log records both actions with the user and source,
    so alerts on unusual uploads and downloads in the SIEM can catch the pattern.
  why_not:
    A: Gateway data loss rules see prompts only; files uploaded through the console never pass the gateway, so the rules would
      not see them.
    C: Proxy alerts could catch a large upload from the office, but they cannot see the download made at home or tell legitimate
      training uploads from misuse.
    D: Fine-tuning files cost little to store, and the insider never needs to run a job, so spending may not change at all.
