id: aaism-d3-3.5-0018
subdomain: "3.5"
difficulty: easy
stem: A company's model registry records each approved version, and deployments are meant to use only approved versions.
  Which monitoring control BEST detects an unapproved model running in production?
options:
  A: Match running models' hashes to the registry
  B: Review registry approval records each month
  C: Alert on deployments that fail in the pipeline
  D: Track production accuracy for sudden drops
answer: A
explanation:
  why_correct: Checking what is actually running against what was approved catches an unapproved model however it got there,
    including manual changes that bypass the pipeline.
  why_not:
    B: Reviewing approvals shows what was approved, not what is deployed.
    C: Failed deployments do not run. The risk is an unapproved one that succeeds.
    D: An unapproved model may perform well, so accuracy would not reveal it.
