id: aaism-d3-3.2-0042
subdomain: '3.2'
difficulty: medium
stem: An insurer's claims agent passed its release tests, which compare each test task's final answer with a known-correct
  one. In a staff pilot every answer was correct, yet logs showed that on ordinary tasks it had also opened HR files and customer
  claims unrelated to the claim in hand. No pilot input contained an attack. It also handles staff claims and complaints,
  so its rights span HR files and all customers' claims. Which control BEST addresses this before wider rollout?
options:
  A: Adversarial test tasks that try to steer the agent into other records
  B: A review of the agent's permissions against the systems its role uses
  C: Release tests scoring each run's tool calls against its task's scope
  D: Production alerts on record access outside the agent's usual pattern
answer: C
explanation:
  why_correct: The problem is in the steps the agent takes, not in its answers, and it happens on ordinary tasks. Because
    its role genuinely needs wide rights, the only place to judge whether an access was needed is the individual task. Scoring
    each test run's tool calls against that task's scope lets the release tests fail a version that reaches correct answers
    through needless access, before it reaches more users.
  why_not:
    A: Adversarial tasks are an essential part of agent testing, but the excess access happened on ordinary tasks with no
      attack, so steering tests would not cover the behaviour seen.
    B: A least-privilege review is the usual fix for excess access, but the agent's role legitimately needs HR files and all
      customers' claims, so the review would confirm its current rights and leave the behaviour unchanged.
    D: Behavioural alerts are useful after release, but the agent does this on ordinary tasks, so it would become part of
      the usual pattern the alerts learn, and they would act only after the wider rollout.
