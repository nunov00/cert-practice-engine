subdomain: '3.2'
difficulty: hard
stem: A travel company's chatbot is fine-tuned every month on customer conversations and user ratings. What should be the
  PRIMARY security requirement for this retraining cycle?
options:
  A: The conversation data must be encrypted while it is moved to the training environment
  B: Each retrained version must pass the same security tests and approval as the first release
  C: Customers must be told that their conversations may be used to improve the chatbot
  D: Fine-tuning must always run in the same environment that was used for the original model training
answer: B
explanation:
  why_correct: Each monthly fine-tune produces a new model shaped by user-supplied data, which attackers can influence. Treating
    every retrained version as a new release, with the same security testing and approval, catches manipulated or degraded
    behaviour before it reaches customers.
  why_not:
    A: Encryption in transit is a necessary hygiene control, but it does nothing about harmful content in the data itself.
    C: Transparency to customers is a privacy duty. It is important but does not address the integrity of the model.
    D: Reusing the environment gives consistency but no assurance about the model that comes out of it.
