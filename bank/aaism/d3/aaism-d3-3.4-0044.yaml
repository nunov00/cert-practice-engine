stem: An energy supplier's AI voice agent calls customers about overdue bills, using a natural voice and a human first name.
  Payment rates fall when customers realise it is an AI, and many customers in arrears are elderly. A new rule requires people
  to be told when they deal with an AI, unless that is obvious. Which approach BEST fits?
options:
  A: Say at the start of each call that it is an AI, offering a person
  B: Confirm that it is an AI whenever a customer asks about it during a call
  C: Explain in bills and terms that collection calls may use AI
  D: Switch to a voice that sounds clearly synthetic to any listener
answer: A
explanation:
  why_correct: People need to know they are dealing with an AI at the moment they deal with it, and a natural voice with a
    human name makes that far from obvious, especially to elderly customers under financial stress. Saying so at the start
    of each call, with the option of a person, meets the rule and treats customers fairly even if payment rates fall.
  why_not:
    B: Answering truthfully when asked is necessary, but customers who believe they are talking to a person have no reason
      to ask, so most would never be told.
    C: Notices in bills and terms are rarely read and are far removed from the call, so customers on the phone would still
      not know they are talking to an AI.
    D: A synthetic-sounding voice may make it obvious to many, but not reliably to elderly listeners, and keeping a human
      first name still suggests a person.
