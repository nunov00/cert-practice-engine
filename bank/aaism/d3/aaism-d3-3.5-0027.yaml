subdomain: "3.5"
difficulty: medium
stem: Developers use an approved enterprise coding assistant whose contract bars training on prompts. Reviews find that
  developers sometimes paste configuration files containing live cloud credentials into prompts. Which control BEST
  addresses this?
options:
  A: Secret scanning that redacts credentials from prompts at the gateway
  B: A reminder banner in the assistant asking users not to paste credentials
  C: A monthly review by the security team of a sample of prompts
  D: A contract clause requiring the vendor to delete prompts within a day
answer: A
explanation:
  why_correct: Scanning prompts for credential patterns at the gateway and redacting them stops live secrets leaving the
    company, whether or not the developer notices, and matches can trigger rotation of the exposed credential.
  why_not:
    B: A reminder relies on each developer noticing every time, which is the behaviour that has already failed.
    C: Sampling finds some exposed credentials weeks later, after they have already left the company.
    D: Faster deletion shortens how long the vendor holds the secrets, but they still leave the company in clear text.
