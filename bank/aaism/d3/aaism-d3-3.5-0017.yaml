stem: A company wants to find out which staff send work data to unapproved AI chat services from company devices. Which
  control BEST gives this visibility?
options:
  A: An annual staff survey on AI tool use
  B: A review of expense claims for AI subscriptions
  C: An inventory of apps installed on company laptops
  D: Web gateway logs of uploads to AI service domains
answer: D
explanation:
  why_correct: Most AI chat services are used through a browser. Logging uploads to AI service domains at the web gateway
    shows which users send data to which services, including free ones that leave no other trace.
  why_not:
    A: Surveys rely on self-reporting and are infrequent, so they miss staff who do not mention their use.
    B: Expense claims show paid subscriptions only, and most of this use is free.
    C: An app inventory misses browser-based services, which need nothing installed.
