id: aaism-d3-3.5-0010
subdomain: '3.5'
difficulty: medium
stem: A manufacturer uses an AI agent that can raise purchase orders in its procurement system. Which monitoring approach
  is MOST appropriate for this agent?
options:
  A: Log each tool call and action and compare with expected behaviour
  B: Review a sample of the agent's chat replies to users each week
  C: Read the agent's reasoning text when a purchase order is disputed
  D: Rely on the agent's own daily summary of the actions it has taken
answer: A
explanation:
  why_correct: The risk of an agent lies in what it does, not only in what it says. Logging every tool call and business action
    under the agent's own identity and alerting on deviations from its expected pattern detects misuse or manipulation, such
    as through prompt injection.
  why_not:
    B: Chat replies may not show the actions taken in the procurement system. Weekly sampling is also slow.
    C: Reviewing reasoning only after a dispute is reactive, and the text may not reflect what the agent actually did.
    D: A compromised or faulty agent's self-report cannot be trusted as independent evidence.
