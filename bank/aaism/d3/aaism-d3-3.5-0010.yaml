difficulty: medium
stem: A manufacturer's AI agent reads supplier emails and raises purchase orders, and each tool call is logged.
  The main threat is prompt injection steering orders to attacker-controlled suppliers. What should the SOC add?
options:
  A: Capture of the agent's reasoning text for each order
  B: Alerts on orders to suppliers new to the agent
  C: Weekly sampling of the agent's replies to staff
  D: Daily reconciliation of orders with the finance ledger
answer: B
explanation:
  why_correct: 'The threat shows up as an unusual action: an order to a supplier the agent has not used before.
    Alerting on that deviation from the agent''s expected behaviour, using the existing tool-call logs, detects
    the attack when it happens.'
  why_not:
    A: Reasoning text can help investigation, but it may not reflect what the agent did and gives no alert on its
      own.
    C: Chat replies may not show the orders placed, and weekly sampling is slow.
    D: Reconciliation confirms that orders and ledger match. An injected order is recorded in both, so it would
      not stand out.
