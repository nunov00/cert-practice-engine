subdomain: '3.2'
difficulty: medium
stem: A media company promotes models through a registry that records each version and its approval. The deployment
  script pulls whichever version is tagged 'latest', and twice an unapproved build carried that tag. What should
  be recommended?
options:
  A: A model registry with approval-based promotion
  B: Deploy approved models by immutable version ID
  C: Access logging on the registry with each model's hash
  D: A version naming standard checked by the deployment team
answer: B
explanation:
  why_correct: The registry holds the right approval data, but deployment ignores it and trusts a movable tag. Deploying
    a specific, immutable approved version ties what runs in production to the approval record.
  why_not:
    A: The registry and approvals exist. The failure is that deployment does not use them.
    C: Logs would show who moved the tag, but the wrong model would still be deployed first.
    D: A naming standard relies on manual checking and does not stop the script deploying whatever is tagged.
