subdomain: '3.2'
difficulty: medium
stem: At a media company, trained models are copied to a shared file server, and the deployment team picks them up from there.
  What should the security manager recommend?
options:
  A: Move the file share to a separate network segment used only by engineering staff
  B: Ask the deployment team to compare file sizes with the training logs before use
  C: Use a controlled model registry as the only promotion path to production
  D: Back up the file server daily so that earlier models can be restored if needed
answer: C
explanation:
  why_correct: A shared file server gives weak control over who can place or swap models. A controlled registry with access
    control, versioning and integrity checks, used as the only route to production, makes promotion traceable and stops unapproved
    or tampered models from being deployed.
  why_not:
    A: Segmentation narrows access but leaves many people able to replace files without traceability or approval.
    B: File size checks are weak and manual. A tampered model can easily have the same size.
    D: Backups support recovery but do not stop a tampered model from being deployed in the first place.
