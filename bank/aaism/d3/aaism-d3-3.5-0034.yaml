id: aaism-d3-3.5-0034
subdomain: '3.5'
difficulty: medium
stem: A bank's chatbot uses a system prompt held in its vendor's admin console, which five administrators can edit.
  An edit last month removed rules on investment advice, and it went unnoticed for four weeks. Which monitoring BEST
  detects a repeat?
options:
  A: Daily review of a sample of chatbot answers by the compliance team
  B: Alerts on each console change compared with the approved prompt
  C: Monthly review of who holds console administrator rights
  D: Weekly replay of the advice test prompts against production
answer: B
explanation:
  why_correct: The weakness entered through a direct edit to the live prompt. Comparing the console's change events with
    the approved version and alerting on any difference detects the edit within minutes, whatever rule it removes.
  why_not:
    A: Sampling answers may reveal advice the chatbot should not give, but only if a sampled chat touches the topic, and
      it can take days or weeks.
    C: Access reviews confirm the right people hold admin rights. The edit was made by an authorised administrator, so
      the review would not flag it.
    D: Weekly replay catches changes that affect the tested advice prompts, but it can leave a week's gap and misses edits
      to rules the tests do not cover.
