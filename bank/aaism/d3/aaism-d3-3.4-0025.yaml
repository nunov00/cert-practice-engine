subdomain: "3.4"
difficulty: medium
stem: A photo editing app lets users upload a photo and describe the changes they want. Abuse reports show users turning
  photos of real people, often colleagues and classmates, into sexual images. Which control BEST reduces this harm?
options:
  A: Visible and invisible watermarks on each edited image
  B: Blocking sexual edits of uploaded photos showing a real person
  C: Terms of service that prohibit sexual images of real people
  D: A report-and-takedown process for images shared in the app
answer: B
explanation:
  why_correct: The harm is created at the moment of editing. Detecting real people in uploaded photos and refusing sexual
    edits of them prevents the images being made, rather than dealing with them once they exist.
  why_not:
    A: Watermarks help show an image is synthetic, but the victim is harmed by the image whether or not it is labelled.
    C: Terms set expectations and allow enforcement, but they do not stop a user who ignores them.
    D: Takedown limits spread within the app after harm is done, and images saved and shared elsewhere are untouched.
