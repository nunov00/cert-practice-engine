stem: Analysis confirms that a letting agency's tenant screening model rejects one ethnic group more often, with
  postcode acting as a proxy. A fixed model will take three months to build. What should the security manager recommend
  for the meantime?
options:
  A: Repeat the fairness analysis on next month's decisions
  B: Retrain the model without postcode and related features
  C: Route rejections in affected postcodes to a human reviewer
  D: Update the privacy notice to describe the model's inputs
answer: C
explanation:
  why_correct: The harm is confirmed and continues while the fix is built. Human review of the rejections most likely
    to be affected is an interim control that reduces harm to applicants now, without waiting three months.
  why_not:
    A: Ongoing fairness monitoring is good practice, but the disparity is already confirmed; repeating the analysis
      measures the harm without reducing it.
    B: Removing the proxy features is part of the fix, which the stem says takes three months. It does not protect
      applicants in the meantime.
    D: Transparency about inputs is worthwhile, but it does not change any decision and leaves the discriminatory
      rejections in place.
