id: aaism-d3-3.4-0005
subdomain: '3.4'
difficulty: medium
stem: A letting agency's tenant screening model has drawn complaints that it rejects applicants from one ethnic group more
  often. What should the information security manager recommend FIRST?
options:
  A: Retrain the model with the ethnicity field removed
  B: Analyse the model's outcomes across applicant groups
  C: Notify the regulator that the model is discriminatory
  D: Add a notice to the application form about the model
answer: B
explanation:
  why_correct: The complaints need to be confirmed with evidence. A fairness analysis of outcomes by group shows whether there
    is a disparity, how large it is and where it comes from. That evidence then drives the right treatment and any reporting
    duty.
  why_not:
    A: Removing the field is premature and often ineffective, because other features can act as proxies for ethnicity.
    C: Notifying a regulator may become necessary, but stating the model is discriminatory before analysis is premature.
    D: A notice improves transparency but does nothing to find or fix a possible bias.
