id: aaism-d3-3.4-0023
subdomain: '3.4'
difficulty: medium
stem: Three hospitals will train a shared model with federated learning, so patient records never leave each site. A coordinator
  at one hospital combines the sites' model updates. The privacy officer warns that a single site's updates can reveal details
  about its patients. Which control BEST addresses this concern?
options:
  A: Access control so only named staff can read the stored updates
  B: Pseudonymisation of patient records at each site before local training
  C: Secure aggregation, so the coordinator sees only the combined update
  D: Deletion of each site's update once the round is combined
answer: C
explanation:
  why_correct: The risk is the coordinator, or anyone with its access, analysing one site's update to infer details of that
    site's patients. Secure aggregation combines the updates cryptographically so that only their sum is revealed, and no
    single site's update can be read.
  why_not:
    A: Restricting who can read stored updates narrows human access, but the coordinator's software still receives each site's
      update in readable form, so anyone who compromises or administers it can analyse one site's contribution.
    B: Pseudonymisation removes direct identifiers, but updates can still reveal attributes of patients whose records shaped
      them.
    D: Deleting updates after each round shortens how long single updates exist, but the coordinator still sees each one in
      full while it combines them, which is when the analysis the privacy officer fears can happen.
