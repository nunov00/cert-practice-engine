stem: A hospital's imaging triage model was fine-tuned from a public pretrained model. It passed accuracy and adversarial
  robustness tests on held-out images. Which further test is MOST important from a security viewpoint before release?
options:
  A: Scan for hidden triggers inherited from the base model
  B: Robustness testing with adversarial images
  C: Bias testing across patient age and sex groups
  D: Evaluation on images from other hospitals' scanners
answer: A
explanation:
  why_correct: 'Adversarial robustness is already tested. The open security question is the public base model: a
    backdoor planted upstream can survive fine-tuning and stay invisible on normal test images, firing only when
    a specific trigger pattern appears.'
  why_not:
    B: This has already been done and passed.
    C: Fairness testing is needed before release, but it is an ethics and quality check rather than the remaining
      security gap.
    D: Testing on other scanners checks generalisation, which matters for safety, but it measures natural variation,
      not deliberate manipulation.
