id: aaism-d3-3.2-0005
subdomain: '3.2'
difficulty: easy
stem: A hospital group's imaging triage model has passed accuracy tests on held-out data. Which further test is MOST important
  from a security viewpoint before release?
options:
  A: Load testing to confirm the model meets response times at peak demand
  B: Testing on a larger held-out set to confirm the accuracy figures
  C: Usability testing with clinicians to confirm the results are clear
  D: Robustness testing with adversarial and unusual inputs
answer: D
explanation:
  why_correct: Accuracy on clean held-out data says little about behaviour under manipulated or unexpected inputs. Robustness
    and adversarial testing shows whether small crafted changes or out-of-range images can cause wrong triage decisions, which
    is the main security and safety risk here.
  why_not:
    A: Load testing covers availability, which matters, but it is not the main gap left after accuracy tests.
    B: A larger clean test set only repeats the same kind of evidence. It does not reveal weakness to hostile inputs.
    C: Usability testing improves safe use but is not a security test of the model itself.
