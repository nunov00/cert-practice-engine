id: aaism-d3-3.3-0030
subdomain: '3.3'
difficulty: hard
stem: To speed labelling, a vendor's labellers see the current defect model's prediction pre-filled and correct it when wrong.
  Each new version scores better against the newest labels, yet field returns for one defect type keep growing. Which control
  BEST addresses this?
options:
  A: Label a random share of items blind, without pre-fill
  B: Have a second labeller check each pre-filled label
  C: Give labellers more worked examples of the defect type
  D: Weight labels for that defect type more in retraining
answer: A
explanation:
  why_correct: Labellers anchored on the pre-filled prediction tend to accept the model's mistakes, so the labels drift toward
    the model, scores rise and errors on the missed defect are never corrected. Labelling a random share blind gives independent
    labels, both to correct the training data and to measure how far the pre-filled labels have drifted.
  why_not:
    B: Double labelling catches individual slips, but a second labeller who also sees the pre-filled value is anchored the
      same way and tends to agree with it.
    C: Better guidance helps labellers recognise the defect, but they would still start from the model's answer, and nothing
      would measure whether the anchoring has stopped.
    D: Weighting would amplify that defect's labels, which are the ones likely carrying the model's own errors, so retraining
      would learn them more strongly.
