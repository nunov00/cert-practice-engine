id: aaism-d3-3.5-0019
subdomain: '3.5'
difficulty: hard
stem: An agent platform's service accounts gain permissions as teams add tools. Quarterly access reviews pass because each
  permission was approved when it was added. Which control BEST reduces excess access?
options:
  A: Require yearly re-approval of each permission
  B: Remove permissions that logs show the agents never use
  C: Alert the SOC whenever a new permission is granted
  D: Rotate each service account's credentials monthly
answer: B
explanation:
  why_correct: Past approval does not show current need. Comparing granted permissions with what agents actually use in the
    logs shows rights that can go, which brings accounts back to least privilege.
  why_not:
    A: Re-approval adds a check, but owners tend to re-approve what was approved before without evidence of use.
    C: Alerts show new grants as they happen, but the problem is permissions that are approved and no longer needed.
    D: Rotation limits the life of a stolen credential, not the rights it carries.
