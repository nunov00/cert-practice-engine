id: aaism-d3-3.1-0021
subdomain: '3.1'
difficulty: hard
stem: An IT helpdesk agent turns user requests into shell commands, which run on a server after a check that the first word
  is on an allow-list such as ping or ls. Testers ran a second command by adding a semicolon after an allowed one. Which design
  change BEST fixes this?
options:
  A: Run the server's command process under a low-privilege account
  B: Expose only predefined functions with typed parameters, not a shell
  C: Tell the model in its system prompt not to chain commands
  D: Extend the allow-list check to each word in the command
answer: B
explanation:
  why_correct: The weakness is passing model output to a shell as free text. Replacing the shell with fixed functions that
    take validated parameters removes command injection as a class, whatever the model is tricked into writing.
  why_not:
    A: Least privilege limits the damage of an injected command, which is worth doing, but injection still works and the attacker
      gets whatever that account can do.
    C: An instruction to the model is not a security control. Prompt injection or a crafted request can make the model ignore
      it.
    D: Checking every word is a stronger filter, but shells offer many ways to build commands, such as substitution and escaping,
      so filtering free text stays fragile.
