subdomain: '3.5'
difficulty: medium
stem: To detect leaks of its system prompt, a company placed a unique canary string in it and alerts when that string appears
  in a response. A tester got the full prompt out by asking the model to print it with a dash between every letter. No alert
  fired. Which monitoring change BEST closes this gap?
options:
  A: Match the canary after removing spacing and symbols and decoding common encodings
  B: Alert on prompts that contain words such as instructions or system prompt
  C: Replace the canary with a new random string each week
  D: Store full responses so analysts can review them after an incident
answer: A
explanation:
  why_correct: Exact matching fails as soon as the output is transformed. Normalising responses before matching, and checking
    common encodings, lets the canary still be found in the forms attackers use to slip it past the filter.
  why_not:
    B: Keyword checks on prompts catch only blunt requests and miss rephrased ones, while flagging many harmless questions.
      They do not fix the blind spot in output detection.
    C: Rotating the canary helps trace when a leak happened, but a transformed canary still escapes exact matching whatever
      its value.
    D: Keeping responses helps investigation after the fact, but it does not create an alert when the leak happens.
