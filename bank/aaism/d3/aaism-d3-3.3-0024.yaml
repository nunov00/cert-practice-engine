id: aaism-d3-3.3-0024
subdomain: '3.3'
difficulty: hard
stem: A card issuer retrains its fraud model weekly on two label sources, cases investigators confirm after the model
  flags them and chargebacks. Precision on flagged cases keeps rising, yet fraud losses grow, mostly from a new scheme
  of prepaid cards emptied within hours, which no cardholder or merchant reports. Which change to labelling BEST addresses
  this?
options:
  A: Add fraud reports from merchants and the card network as labels
  B: Have investigators review cases scoring just below the flag threshold
  C: Give chargeback labels more weight in each retraining
  D: Have investigators review a random sample of low-scoring transactions
answer: D
explanation:
  why_correct: Every label comes from something already flagged or reported, and the new scheme is neither, so it never
    becomes a training example and each retrain learns to ignore it. A random sample of low-scoring transactions, reviewed
    by investigators, finds fraud wherever the model scored it, gives the model labelled examples of the scheme, and shows
    how much fraud the model is missing.
  why_not:
    A: Merchant and network reports are a good source of labels for fraud the model missed. This scheme is not reported
      by merchants or cardholders, so these reports would not contain it.
    B: Reviewing cases near the threshold is a common way to gather useful labels. A scheme the model has never been trained
      on has no reason to score near the threshold, so this review would mostly see cases the model already half recognises.
    C: Chargebacks capture fraud the model let through, which is why issuers use them as labels. With no cardholder disputing
      this scheme, there are no chargebacks for it to weight.
