id: aaism-d3-3.3-0031
subdomain: '3.3'
difficulty: medium
stem: A bank and a retailer want a joint credit model for the customers they share. The bank holds repayment histories, the
  retailer holds purchase patterns, and the model's value comes from combining both for each person. Neither firm may see
  the other's customer-level records. Which approach BEST meets this?
options:
  A: A clean room that joins both sets and releases only the trained model
  B: Federated averaging of models each firm trains on its own records alone
  C: An exchange of records keyed by a hash of each customer's email
  D: An exchange of synthetic copies of each firm's customer records
answer: A
explanation:
  why_correct: 'The two firms hold different facts about the same people, and the model needs them joined person by person.
    A clean room, run by a neutral party or under controls both firms trust, performs the join and the training where neither
    firm can read the other''s rows, and lets out only the agreed result: the trained model, after checks that it does not
    expose individual records.'
  why_not:
    B: Federated averaging combines models that each firm trains only on its own records, so no model ever sees repayments
      and purchases for the same person together, and the combined patterns are never learned. Vertical federated learning,
      which splits one model across the firms' attributes, is a different design with its own leakage risks.
    C: Hashing hides emails only from someone who does not know them. Each firm can hash its own customers' emails, match
      the rows and read the other firm's records for every shared customer.
    D: Synthetic copies made separately by each firm cannot be joined person by person, so the link between a customer's repayments
      and purchases, which is the point of the model, is lost.
