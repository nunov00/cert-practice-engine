id: aaism-d3-3.1-0005
subdomain: '3.1'
difficulty: medium
stem: A fintech exposes its credit-scoring model to partners through a public API. The security manager is concerned that
  a competitor could copy the model by sending large numbers of queries. Which control is MOST effective?
options:
  A: Encrypt the model weights at rest on the inference servers
  B: Return full-precision confidence scores so partners can audit decisions
  C: Enforce authentication with per-client rate limits and query quotas
  D: Keep the model architecture and features out of partner documentation
answer: C
explanation:
  why_correct: Model extraction works by collecting many input and output pairs through the normal interface. Authenticating
    every client and capping how many queries each can send makes large-scale harvesting slow, visible and attributable. It
    addresses the attack path directly.
  why_not:
    A: Encryption at rest protects stolen files, but extraction uses the API and never touches the stored weights.
    B: Detailed confidence scores give an attacker more information per query and make extraction easier, not harder.
    D: Hiding design details is security by obscurity. An attacker can still copy the model's behaviour through queries.
