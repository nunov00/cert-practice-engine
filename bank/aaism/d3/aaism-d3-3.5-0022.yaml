id: aaism-d3-3.5-0022
subdomain: '3.5'
difficulty: medium
stem: A company monitors its payments agent with an alert on any single payment above a set value. Over one day, a prompt
  injection made the agent send 300 payments, each just under that value, without an alert. Which monitoring change BEST closes
  this gap?
options:
  A: Lower the single-payment alert value to half its current level
  B: Have staff review a random sample of payments each week
  C: Require staff approval of each payment the agent proposes
  D: Alert on total value and count per agent over a time window
answer: D
explanation:
  why_correct: The attack split the activity so that no single event crossed the threshold. Monitoring cumulative value and
    frequency over a window catches that pattern regardless of how each payment is sized.
  why_not:
    A: A lower threshold catches these payments, but an attacker can split them further, so the same gap stays open at a smaller
      size.
    B: A weekly sample may find odd payments eventually, but it is too slow and too sparse to catch 300 payments in one day.
    C: Approving every payment is a preventive control, not a monitoring change, and it removes most of the benefit of the
      agent. It is far beyond what the gap needs.
