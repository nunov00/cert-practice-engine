stem: A team fine-tuned a safety-aligned base model on 2,000 ordinary internal support transcripts. The base model
  passed the company's refusal tests. The fine-tuned model answers support questions more accurately. What should
  the security manager require before release?
options:
  A: Re-run the refusal tests on the fine-tuned model
  B: Screen the transcripts for harmful content
  C: Add an output filter tuned for the support domain
  D: Compare task accuracy with the base model's results
answer: A
explanation:
  why_correct: Fine-tuning can weaken a model's safety behaviour even on harmless data, so the base model's results
    do not carry over. The fine-tuned model is a new model and must pass the refusal tests itself.
  why_not:
    B: Screening the data addresses one cause, but fine-tuning can erode safety without any harmful examples; the
      model's behaviour is what needs testing.
    C: A filter is a useful extra layer, but adding it without testing the model leaves unknown how much the filter
      must catch.
    D: Accuracy testing checks the task, which has improved; it says nothing about whether the model still refuses
      harmful requests.
