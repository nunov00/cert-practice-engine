id: aaism-d3-3.3-0002
subdomain: '3.3'
difficulty: medium
stem: A regulator asks a telecom to show that each field in its churn model's training data was collected under
  terms allowing analytics use. The fields were already cut to those the model needs. Which data management capability
  is MOST needed?
options:
  A: Minimisation to the fields the purpose needs
  B: Retention limits for each field based on its legal basis
  C: Lineage tracing each field to its source and legal basis
  D: Quality checks on each field's accuracy
answer: C
explanation:
  why_correct: Minimisation is done. The regulator's question is about origin and permitted use, which only lineage
    back to each source and its collection terms can answer.
  why_not:
    A: Fields have already been minimised, and minimisation does not show the terms they were collected under.
    B: Retention limits, even when tied to legal basis, control how long data is kept, not whether it was collected for this use.
    D: Quality checks show whether values are correct, not whether their use was permitted.
