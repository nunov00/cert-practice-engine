subdomain: '3.3'
difficulty: medium
stem: An email provider trains its spam filter on users' 'report spam' clicks. A group of accounts starts reporting a competitor's
  legitimate newsletters as spam. Which control BEST protects the training data?
options:
  A: Retrain the filter more often so that bad labels are diluted quickly
  B: Encrypt the label data between the mail client and the training store
  C: Increase the size of the model so that it is less sensitive to noise
  D: Screen user labels for coordinated or unusual patterns before training
answer: D
explanation:
  why_correct: This is label poisoning through a user feedback channel. Checking contributions for coordinated or anomalous
    behaviour, for example many new accounts reporting the same sender, and weighting labels by reporter history, stops manipulated
    data from reaching training.
  why_not:
    A: Retraining more often feeds poisoned labels into the model faster. It does not filter them out.
    B: Encryption protects the labels in transit, but the attack uses genuine labels from real accounts.
    C: A larger model does not make poisoned labels less harmful and may even memorise them better.
