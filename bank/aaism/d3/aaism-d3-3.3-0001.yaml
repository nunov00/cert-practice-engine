difficulty: hard
stem: An email provider trains its spam filter on 'report spam' clicks and screens reports for bursts against one
  sender. A competitor's newsletters were still buried by a few hundred accounts reporting slowly over six months.
  Which control BEST protects the training data?
options:
  A: Require a CAPTCHA before each spam report
  B: Screen reports for coordinated bursts before training
  C: Compare verdict shifts on known sources with trusted labels
  D: 'Cap the weight any single account''s reports carry in training'
answer: C
explanation:
  why_correct: Burst screening misses a slow campaign by design. Comparing how each retrained filter changes its
    verdict on specific senders against an independently labelled reference set catches the effect of the poisoning,
    however slowly the labels arrived.
  why_not:
    A: CAPTCHAs stop bots, but these reports came from real accounts used by people.
    B: This is already in place, and the campaign was paced to avoid it.
    D: A few hundred normal accounts each reporting a little stay under any per-account cap.
