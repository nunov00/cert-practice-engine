id: aaism-d3-3.1-0008
subdomain: '3.1'
difficulty: hard
stem: A bank lets a model write SQL for analysts, who may see aggregated figures only. The model's account can query
  approved aggregate views and nothing else. Testers still identified individual customers by filtering aggregates
  down to tiny groups. Which control BEST addresses this?
options:
  A: Restrict the model to approved aggregate views
  B: Enforce a minimum record count on each result
  C: Run model-generated queries under a read-only account
  D: Have a second model review each query before it runs
answer: B
explanation:
  why_correct: Restricting the model to aggregate views is in place, but an aggregate over one or two customers
    is effectively an individual record. A minimum group size enforced in the views stops narrow filters from singling
    people out, whatever query the model writes.
  why_not:
    A: This is already the design. The views return aggregates as intended; the problem is aggregates over very
      small groups.
    C: Read-only access prevents changes to data, but the leak comes from reading aggregates, which read-only queries
      do.
    D: A checker model can be fooled the same way as the first, and narrow filters look like ordinary analyst queries.
      It is not an enforced limit.
