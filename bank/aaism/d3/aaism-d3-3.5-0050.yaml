id: aaism-d3-3.5-0050
subdomain: '3.5'
difficulty: medium
stem: An administrator of a company's AI platform switched off the platform's event export to the SIEM, then downloaded customer
  conversation archives over two days. The platform sends all its events, including settings changes and downloads, through
  that one export. Nobody noticed until a customer complained. Which monitoring BEST detects a repeat?
options:
  A: Alerts on changes to the platform's logging and export settings
  B: Quarterly review of who holds platform administrator rights
  C: Alerts on large downloads of conversation archives by any user account
  D: Alerts when the platform's event feed stops or falls well below normal
answer: D
explanation:
  why_correct: Both the settings change and the downloads could only reach the SIEM through the export the administrator turned
    off. Watching the feed itself, and alerting when it stops or drops well below its normal volume, detects the silence that
    tampering with the export creates, independent of any event the platform would have had to send.
  why_not:
    A: Alerting on settings changes is a sound control in general, but here the change event would travel through the export
      being switched off, so it may never arrive.
    B: Reviewing administrator rights keeps access appropriate, but this administrator legitimately held the rights, and a
      quarterly review would not detect misuse within days.
    C: Download alerts suit this kind of theft, but the download events also travel through the disabled export, so the SIEM
      would not see them.
