id: aaism-d3-3.3-0020
subdomain: '3.3'
difficulty: medium
stem: A hospital will send X-ray images to an annotation vendor for labelling. Many images have patient names burned into
  the pixels by older scanners. Labellers will work in a vendor virtual desktop with downloads blocked. Which control BEST
  protects patient identity?
options:
  A: Strip identifying metadata fields from each image file
  B: Detect and mask burned-in text before images are sent
  C: Add strict confidentiality terms to the vendor contract
  D: Log each labeller's image views for later audit
answer: B
explanation:
  why_correct: The names are part of the image itself, so labellers would see them whatever the desktop controls. Masking
    burned-in text before export removes the identity from what the vendor receives.
  why_not:
    A: Metadata stripping is the usual first step, but it leaves names that are drawn into the pixels.
    C: Contract terms set duties and remedies, but labellers would still see patient names.
    D: View logs support audit after the fact. They do not stop names being exposed.
