subdomain: '3.2'
difficulty: medium
stem: A pharmaceutical company's data scientists run early experiments in an isolated workspace on public data,
  with full security review before release. They now complain that every release review takes six weeks, whatever
  the model does. What is the BEST approach?
options:
  A: Scale release reviews to each model's risk tier
  B: A security champion embedded in the team
  C: A self-assessment checklist replacing release review
  D: An isolated workspace with review at release
answer: A
explanation:
  why_correct: Experimentation is already protected by isolation. The bottleneck is a single heavyweight review
    for every release. Tiering lets low-risk models move faster while high-risk ones keep the full review.
  why_not:
    B: A champion can speed up preparation, but every model would still go through the same six-week review.
    C: Self-assessment alone removes independent review even for high-risk models.
    D: This is the current setup, and the complaint is about its release review.
