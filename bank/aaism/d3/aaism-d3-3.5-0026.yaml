id: aaism-d3-3.5-0026
subdomain: "3.5"
difficulty: medium
stem: An AI agent calls the company's CRM with an API token that only its container cluster should hold. Which
  monitoring rule BEST detects the token being stolen and used by an attacker?
options:
  A: Alert when the token is used from outside the cluster's addresses
  B: Alert when the agent's CRM calls exceed their usual hourly volume
  C: Alert when the CRM rejects requests made with the token
  D: Alert when the agent's prompts contain known injection phrases
answer: A
explanation:
  why_correct: The token has one legitimate place of use. Use from any other source address is a strong signal that it has
    been copied, and it fires whatever the attacker does with it.
  why_not:
    B: A volume alert catches bulk misuse, but an attacker can stay within normal volumes.
    C: Rejected requests show misuse of rights the token lacks, but an attacker using the rights it holds is not rejected.
    D: Injection phrases relate to manipulating the agent, not to someone using its stolen token directly.
