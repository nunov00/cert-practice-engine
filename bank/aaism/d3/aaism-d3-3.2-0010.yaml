stem: A bank's customer chatbot has started giving harmful advice, and a retrained model that fixes the issue is ready. The
  normal change board meets in two weeks. What is the BEST course of action?
options:
  A: Deploy the retrained model now and add it to the change record at the next board meeting
  B: Wait for the next change board so that the retrained model gets a full review
  C: Use the emergency change process with expedited testing, approval and a later review
  D: Take the chatbot offline until a full retraining and normal release cycle can be completed
answer: C
explanation:
  why_correct: 'The harm needs fast action, but bypassing change control creates new risk. An emergency change process exists
    for this: a reduced but real test and approval by authorised people, followed by a formal review. It balances speed with
    control and keeps an audit trail.'
  why_not:
    A: Deploying first and recording later skips approval and testing. A rushed model could cause new harm with no check.
    B: Waiting two weeks leaves customers exposed to harmful advice. The risk is too high for the normal cycle.
    D: Taking the service offline may be a valid short-term containment step, but it ignores a tested fix and a process designed
      for this situation.
