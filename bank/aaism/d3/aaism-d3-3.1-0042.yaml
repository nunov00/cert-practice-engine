id: aaism-d3-3.1-0042
subdomain: '3.1'
difficulty: easy
stem: A consultancy's assistant retrieves passages from one shared index and checks the user's permissions only for the documents
  it cites in its answer. Permissions are set per document, and many documents are shared across practices. Testers got answers
  that paraphrased restricted documents without citing them. Which design change BEST addresses this?
options:
  A: Separate indexes for each practice, searched by that practice's members
  B: An output check that drops sentences no permitted source supports
  C: A classifier that blocks answers naming restricted clients or matters
  D: Permission checks on each passage before it is added to the prompt
answer: D
explanation:
  why_correct: The model reads restricted text before any check runs, so it can reuse it in ways a citation check cannot see.
    Checking every retrieved passage, and any cached result, against the user's document permissions before it enters the
    prompt means the model does not receive, through retrieval, content the user may not open.
  why_not:
    A: Per-practice indexes follow practice lines, but permissions are set per document and many documents cross practices,
      so users would see too much in some cases and too little in others.
    B: A support check catches some uncited content, but the model has already read the restricted text and can blend it into
      sentences that a permitted source loosely supports.
    C: Blocking named clients or matters catches obvious cases, but paraphrased restricted content often names neither.
