subdomain: '3.5'
difficulty: medium
stem: A retailer's SOC gets about 400 alerts a day from an input classifier that spots jailbreak attempts on its
  shopping assistant, and analysts close most after reading the prompt. Last month a jailbreak that issued unauthorised
  discounts came to light only through finance reports. Which change BEST helps the SOC detect such cases?
options:
  A: Tune the classifier on the prompts the SOC has labelled as false alarms
  B: Add the assistant's reply to each alert so analysts can judge the outcome
  C: Raise alerts on any session whose replies or actions break policy
  D: Correlate flags by account and alert on repeated attempts from one user
answer: C
explanation:
  why_correct: Most alerts are attempts that failed or prompts that were harmless, so reading the prompt says little about
    harm. Alerting when any session's replies or tool actions, such as a discount, break policy picks out the cases that
    caused harm, including jailbreaks the classifier missed, automatically and at the volume the SOC sees.
  why_not:
    A: Tuning on false alarms reduces noise, but the classifier would still judge prompts, not what the assistant did, so a
      successful attempt looks like the failed ones.
    B: Seeing the reply helps an analyst judge each alert, but 400 alerts a day still depend on manual reading, and actions
      such as discounts may not show in the reply text.
    D: Repeated attempts from one account are a useful signal, but a jailbreak that works early, or spreads across accounts,
      would not stand out, and the alert still does not show harm.
