id: aaism-d3-3.4-0012
subdomain: '3.4'
difficulty: easy
stem: A consumer lender must tell applicants why its credit model refused them. Which capability is MOST important for this
  duty?
options:
  A: Reports on the model's overall accuracy and error rates
  B: Documentation of the model's architecture and training
  C: Explanations of the main factors in each single decision
  D: Human review of every application that the model approves
answer: C
explanation:
  why_correct: The duty is to explain individual outcomes. Local explanations that show the main factors behind each refusal
    let the lender give each applicant meaningful reasons.
  why_not:
    A: Overall accuracy describes the model as a whole. It does not explain why one applicant was refused.
    B: Technical documentation supports governance but is not an explanation of a specific decision.
    D: Reviewing approvals does nothing for refused applicants, who are the ones owed reasons.
