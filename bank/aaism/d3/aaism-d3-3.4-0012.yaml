id: aaism-d3-3.4-0012
subdomain: '3.4'
difficulty: medium
stem: A consumer lender must tell each refused applicant the main reasons for refusal. Its credit model already
  produces per-decision feature attributions, but refusal letters list engineered features such as 'util_ratio_6m_delta'.
  What is MOST needed?
options:
  A: Per-decision feature attributions for each applicant
  B: Global feature importance for the model as a whole
  C: Documentation of the training data and model design
  D: Plain-language reason statements mapped to each feature
answer: D
explanation:
  why_correct: The lender has the right technical output, per-decision attributions, but the duty is to give applicants
    reasons they can understand and act on. Engineered feature names are meaningless to them. A reviewed mapping
    from each feature to a plain-language reason turns the attributions into a usable explanation.
  why_not:
    A: Per-decision attributions are the right basis for individual reasons, but the lender already produces them.
      The gap is that their output is not understandable.
    B: Global importance describes the model overall, not why a particular applicant was refused.
    C: Model documentation supports oversight and audit, but it does not give an individual applicant the reasons
      for a decision.
