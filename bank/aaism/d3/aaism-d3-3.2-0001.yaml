id: aaism-d3-3.2-0001
subdomain: '3.2'
difficulty: easy
stem: A manufacturer's quality inspection model is ready to move to production. What BEST ensures security issues are dealt
  with before go-live?
options:
  A: Monitoring the model closely during its first month in production
  B: User acceptance testing by the quality team on real production lines
  C: A release gate that requires security test results and formal sign-off
  D: A written statement from the data scientists that testing is complete
answer: C
explanation:
  why_correct: A defined security gate makes release depend on evidence that security testing was done and that findings are
    resolved or accepted by the right owner. It is a preventive control built into the life cycle, so an unsafe model cannot
    be promoted by default.
  why_not:
    A: Monitoring after go-live is important, but it finds problems once the model is already exposed. It does not prevent
      an unsafe release.
    B: User acceptance tests check that the model meets business needs. They rarely test security aspects such as robustness
      or misuse.
    D: Self-attestation by the builders is not independent evidence and can be given under schedule pressure.
