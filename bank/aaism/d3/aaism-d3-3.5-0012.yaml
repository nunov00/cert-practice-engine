id: aaism-d3-3.5-0012
subdomain: '3.5'
difficulty: hard
stem: A bank changes a rule in the guardrail that screens prompts to its customer chatbot. Customer prompts vary
  widely, and the team's test library holds about fifty examples. What BEST confirms the rule can be relied on before
  enforcement?
options:
  A: Peer review of the rule logic by a second engineer
  B: Approval by the change advisory board
  C: Tests against the team's library of sample prompts
  D: Running the rule in log-only mode on live traffic
answer: D
explanation:
  why_correct: A small library cannot represent widely varied real prompts. Running the rule in log-only (shadow)
    mode shows what it would block and allow on real traffic, without affecting customers, before it is enforced.
  why_not:
    A: Peer review can catch logic errors, but reading a rule does not show how it behaves on real prompts.
    B: Change approval authorises the change. It is not evidence that the rule works.
    C: Library tests are a necessary first check, but fifty examples cannot cover the variety the stem describes.
