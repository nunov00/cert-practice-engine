subdomain: '3.5'
difficulty: medium
stem: A bank's security team changes a rule in the guardrail that screens prompts to its customer chatbot. What BEST confirms
  that the changed rule can be relied on?
options:
  A: A peer review of the rule's logic by a second security engineer
  B: Approval of the change by the change advisory board before release
  C: Tests with prompts it should block and prompts it should allow
  D: A week of monitoring the rule's block rate after it goes live
answer: C
explanation:
  why_correct: Reliance needs evidence that the control works. Testing with cases the rule should block and cases it should
    let through shows directly that it stops the intended prompts and does not break normal use, before customers depend on
    it.
  why_not:
    A: Peer review can catch logic errors, but reading a rule is not evidence of how it behaves on real prompts, which are
      hard to predict.
    B: Change approval is a governance step that authorises the change. It does not show the rule works as intended.
    D: Block-rate monitoring after go-live is useful, but it comes after reliance has begun and a rate alone cannot show whether
      the right prompts were blocked.
