difficulty: medium
stem: A retailer's mobile app sends model requests to its own back end, which holds the provider key. The back-end
  endpoint accepts requests without user sign-in, and scripts outside the app are using it as a free model service.
  What should the security manager recommend?
options:
  A: Move the provider key from devices into a back end
  B: Rotate the provider key monthly
  C: Obfuscate the app and block rooted or jailbroken devices
  D: Authenticate and rate-limit callers at the back end
answer: D
explanation:
  why_correct: The key is already off the devices, but the gateway is open to anyone, so it lends the key's power
    to any caller. Authenticating users at the back end and limiting each one closes the open endpoint and makes
    misuse attributable.
  why_not:
    A: This has already been done. The key is protected, but the endpoint in front of it is not.
    B: The attackers never see the key; they call the back end. Rotation does not affect them.
    C: The scripts call the endpoint directly without the app, so hardening the app does not stop them.
