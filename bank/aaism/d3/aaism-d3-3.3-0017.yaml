stem: A company trains an image model on a well-known public dataset that lists image URLs and captions. The images are
  downloaded from those URLs at each training run, and the dataset is several years old. Which control BEST protects the
  training data?
options:
  A: Download images only over encrypted connections
  B: Scan downloaded images for malware before use
  C: Skip links that fail to resolve or return errors
  D: Check each image against hashes taken at dataset creation
answer: D
explanation:
  why_correct: Over several years some hosting domains expire, and anyone who buys one can serve different images at the
    same URLs. Checking each download against a hash recorded when the dataset was built rejects changed images, so an attacker
    cannot swap in poisoned content.
  why_not:
    A: Encryption protects the download in transit, but a new domain owner can obtain a valid certificate and serve poisoned
      images over an encrypted link.
    B: Malware scanning looks for malicious code, but a poisoned image is an ordinary image with misleading content and
      passes the scan.
    C: Dropping dead links removes broken entries, but a repurchased domain resolves and returns images normally, so the
      poisoned ones are kept.
