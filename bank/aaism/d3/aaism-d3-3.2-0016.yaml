difficulty: medium
stem: A prompt injection detector scored 98% on its security test set but misses many attacks in production. The
  team finds the test prompts had been posted on public forums and were scraped into its fine-tuning data. Which
  life cycle control BEST prevents a repeat?
options:
  A: Expand the test set with more published attack prompts
  B: Raise the release threshold on the test set to 99%
  C: Retrain the detector without the scraped forum data
  D: Keep a private test set isolated from training data
answer: D
explanation:
  why_correct: The score was inflated because the test data leaked into training. A held-out test set that is kept
    private and controlled separately from training data gives an honest measure at each release.
  why_not:
    A: More published prompts are just as likely to end up in training data, repeating the contamination.
    B: A higher threshold on a contaminated test set measures memory, not detection.
    C: Retraining fixes this version, but without a protected test set the next data collection could contaminate
      it again.
