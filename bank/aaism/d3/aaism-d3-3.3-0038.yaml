id: aaism-d3-3.3-0038
subdomain: '3.3'
difficulty: easy
stem: To fine-tune an agent that works its claims system, an insurer records full-screen video and keystrokes while staff
  handle claims. A review found the recordings include staff's personal chats, other customers' records in other windows and
  passwords typed into other applications. Which control BEST protects the training data?
options:
  A: Redacting personal data from the recordings with OCR-based scanning
  B: Capturing only the claims app window, with sensitive fields masked
  C: Limiting access to the stored recordings to the model training team
  D: Deleting the recordings once the tuned model is released
answer: B
explanation:
  why_correct: The agent only needs to learn the claims system, so the data it trains on should come only from that system.
    Capturing just the claims window, and masking sensitive fields such as passwords, keeps chats, other applications and
    credentials out of the training data from the start.
  why_not:
    A: OCR redaction reduces exposure, but it misses some text and cannot remove keystrokes typed into other applications,
      so passwords and chats still enter training.
    C: Access limits protect the recordings while stored, but the model is still trained on unrelated personal data and passwords,
      which it may learn and reproduce.
    D: Deletion after release shortens how long the data is kept, but the model has already been trained on it by then.
