subdomain: '3.5'
difficulty: hard
stem: A telecom's call-centre AI assistant logs prompts for security monitoring. The privacy team found customers'
  card numbers in a year of stored logs, and masking now removes them from new prompts. SOC investigations have
  never needed card numbers. What is the BEST next step?
options:
  A: Mask card numbers in prompts before they are logged
  B: Restrict log access to named SOC analysts
  C: Redact the card numbers already held in stored logs
  D: Encrypt the log store with a dedicated key
answer: C
explanation:
  why_correct: Masking fixes new logs, but a year of stored logs still holds card numbers that serve no monitoring
    purpose. Redacting them removes the exposure rather than guarding it, while keeping the rest of the logs for
    investigations.
  why_not:
    A: Masking at the source is the right control, and the stem says it is already in place. It does nothing for
      the card numbers stored before it was introduced.
    B: Access restriction reduces who can see the card numbers, but they stay in the logs with no purpose for keeping
      them.
    D: Encryption protects the store against outside theft, but authorised users and processes still see the card
      numbers, which should not be there.
