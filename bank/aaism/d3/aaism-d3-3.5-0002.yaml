difficulty: medium
stem: A telecom company logs all prompts to its call-centre AI assistant. The privacy team finds that the logs contain customers'
  personal data. What is the BEST response?
options:
  A: Stop logging prompts and keep a record of only the outputs
  B: Keep logging, with masking, tight access and set retention
  C: Move the logs to the AI team's storage for easier access
  D: Stop all logging until a full privacy audit is complete
answer: B
explanation:
  why_correct: 'Prompt logs are needed for security monitoring and investigations. The right answer is to protect them: mask
    sensitive fields where possible, restrict access to those who need it and apply a defined retention period. This balances
    security and privacy.'
  why_not:
    A: Without prompts, attacks such as prompt injection or data extraction cannot be detected or investigated. Outputs may
      also hold personal data.
    C: Moving logs for convenience widens access to personal data and weakens their integrity as evidence.
    D: Stopping all logging leaves the assistant unmonitored for an open-ended period, which creates a larger risk.
