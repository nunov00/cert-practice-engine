id: aaism-d3-3.5-0008
subdomain: '3.5'
difficulty: medium
stem: An e-commerce company's SOC receives hundreds of alerts a day from a new prompt injection detector, and most are false
  positives. What is the BEST action for the information security manager?
options:
  A: Ask the vendor to retrain the detector before relying on it
  B: Move triage of the detector's alerts to the AI engineering team
  C: Add analysts to the SOC shift until the alert backlog is cleared
  D: Tune thresholds on observed data and tier alerts by severity
answer: D
explanation:
  why_correct: Alert thresholds should reflect risk and real data. Tuning on observed traffic and sending only higher-severity
    alerts for immediate triage keeps the detection value while making the workload manageable. Tuning should be reviewed
    as attacks evolve.
  why_not:
    A: Vendor retraining may help later, but it is slow, outside the company's control and leaves the SOC flooded meanwhile.
      Local tuning on the company's own traffic addresses the problem now.
    B: Moving triage shifts the noise to a team that is not set up for security response and splits incident handling, without
      improving alert quality.
    C: More staff treats the symptom at high cost and leaves analysts facing poor quality alerts, which breeds alert fatigue.
