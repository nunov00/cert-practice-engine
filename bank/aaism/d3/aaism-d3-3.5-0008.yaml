difficulty: hard
stem: A SOC gets hundreds of daily alerts from a new prompt injection detector. Most false positives come from one
  internal app whose prompts legitimately contain code snippets. The vendor's detector cannot be tuned per app.
  What is the BEST action?
options:
  A: Baseline the detector on that app's normal prompts
  B: Raise the detector's global alert threshold
  C: Exclude that app's traffic from the detector
  D: Send that app's alerts to a separate lower-priority queue
answer: D
explanation:
  why_correct: Per-app tuning is ruled out, so the choice is how to handle the noise. Routing that app's alerts
    to a separate, lower-priority queue frees the SOC's main queue while keeping coverage of the app and leaving
    detection for other apps unchanged.
  why_not:
    A: Baselining on the app's normal traffic would be the best fix, but the stem says the detector cannot be tuned
      per app.
    B: A higher global threshold cuts noise everywhere by lowering sensitivity for every app, not only the noisy
      one.
    C: Excluding the app removes its false positives but also any real injection attempts against it, leaving a
      blind spot.
