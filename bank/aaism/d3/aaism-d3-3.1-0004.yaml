id: aaism-d3-3.1-0004
subdomain: '3.1'
difficulty: easy
stem: In a large language model application, how should the output of the model be treated before it is passed to a database
  query or displayed in a web page?
options:
  A: As trusted, once the user's prompt has already passed input validation
  B: As trusted, provided the system prompt forbids generating code or markup
  C: As untrusted input that must be validated and encoded for its destination
  D: As untrusted only when the user who prompted the model is external
answer: C
explanation:
  why_correct: Model output can be shaped by user prompts and by content the model retrieved, so it can carry malicious code
    or commands. Treating it as untrusted and validating and encoding it for each destination prevents injection into downstream
    systems.
  why_not:
    A: Input validation cannot catch every crafted prompt, and output is also shaped by retrieved content that never passed
      through it. Validating the input does not make the output safe for a database or browser.
    B: System prompt rules are guidance that injected instructions can override. The model may still emit code or markup,
      so the destination must be protected by validation and encoding.
    D: Internal users, documents and emails can also carry injected content. The trust decision should not depend on the user
      being external.
