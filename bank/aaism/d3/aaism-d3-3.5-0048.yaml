subdomain: '3.5'
difficulty: hard
stem: A software firm's coding agents must get a developer's approval for each shell command they run. Logs show developers
  approve 98% of requests within two seconds, most of them for reading files and running tests, and the agents install packages
  many times a day. Last month a developer approved a command that uploaded a secrets file to an outside site. Which change
  BEST restores the value of approval?
options:
  A: Require developers to type a reason before each approval
  B: Have the security team approve each command that reaches the network
  C: Review a weekly sample of approved commands for risky ones
  D: Auto-run allowlisted read and test commands, asking for the rest
answer: D
explanation:
  why_correct: Developers approve in seconds because nearly every request is routine, so the prompt has become a reflex. Letting
    allowlisted reading and testing commands run without asking cuts the volume sharply, so the few prompts that remain stand
    out and get real attention, which is what approval needs to work.
  why_not:
    A: A typed reason adds friction to every request, including the routine ones, and people under that load tend to type
      the same reason each time, so approvals stay automatic.
    B: Security review of network commands targets the risky class, but agents install packages many times a day, so a central
      approver would become a bottleneck and face the same flood of routine requests.
    C: Sampling finds risky approvals after the commands have run, so a secrets file would already be gone, and it does nothing
      about the habit of approving without reading.
