id: aaism-d3-3.1-0022
subdomain: '3.1'
difficulty: medium
stem: A finance team's analysis agent writes and runs Python to answer questions about spreadsheets that suppliers send.
  The code runs inside the agent's own container, which holds the agent's API keys for the ledger and payment systems
  as environment variables. Which design change BEST protects those keys?
options:
  A: Narrow each API key to the actions the agent's tools need
  B: Load the API keys from a secrets vault when the agent starts
  C: Run generated code in a separate sandbox that holds no keys
  D: Rotate the agent's API keys automatically each day
answer: C
explanation:
  why_correct: Supplier spreadsheets can carry instructions that make the agent write code of an attacker's choosing,
    and that code runs next to the keys. Executing generated code in a separate sandbox that holds no credentials
    means injected code has nothing to read, while the agent keeps its keys for its own tool calls.
  why_not:
    A: Narrow scopes limit what a stolen key can do, but the key can still be read and used for payment and ledger
      actions the agent is allowed to take.
    B: A vault is the right place to store secrets, but once loaded the keys sit in the same container's environment
      or memory, where the generated code can still read them.
    D: Daily rotation shortens how long a stolen key works, but a key read by injected code can be used within minutes
      of being taken.
