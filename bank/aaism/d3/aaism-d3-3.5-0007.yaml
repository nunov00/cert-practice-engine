id: aaism-d3-3.5-0007
subdomain: '3.5'
difficulty: medium
stem: A pharmaceutical company's quarterly access review of its model-serving platform now includes API keys. Reviewers
  could not tell which application used a third of the keys, so those keys were left active. What should the security
  manager require?
options:
  A: Add API keys and service accounts to the access review
  B: Run the access review monthly instead of quarterly
  C: Record an accountable owner for each issued API key
  D: Rotate the platform's API keys on a 90-day cycle
answer: C
explanation:
  why_correct: An access review works only if someone can confirm that each access is still needed. Keys with no
    known owner cannot be confirmed or safely removed, so they stay active by default. Recording an accountable
    owner when a key is issued, and back-filling for existing keys, makes the review decidable.
  why_not:
    A: Extending the review to non-human access is the usual gap, but the stem says keys are already in scope. The
      failure is that reviewers cannot decide on them.
    B: Reviewing more often repeats the same problem more often while ownership stays unknown.
    D: Rotation limits the life of a leaked key, but a rotated key with no known owner is still unreviewable.
