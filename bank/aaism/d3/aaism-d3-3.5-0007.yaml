subdomain: '3.5'
difficulty: medium
stem: During a quarterly access review of a model-serving platform at a pharmaceutical company, what is MOST important to
  verify?
options:
  A: That every account and API key has an owner and a current need
  B: That user passwords meet the company's complexity standard
  C: That the number of model endpoints matches last quarter's count
  D: That the data scientists approve their own access to the models
answer: A
explanation:
  why_correct: The point of an access review is to confirm that each identity, including service accounts and API keys, is
    still owned and needed. Orphaned or unneeded keys are a common route to model theft or misuse.
  why_not:
    B: Password complexity is a configuration check that does not show whether access is still appropriate. API keys have
      no passwords.
    C: Endpoint counts are an inventory matter and say nothing about who can call the models.
    D: Self-approval breaks separation of duties. Access should be approved by the owner or manager, not by the user.
