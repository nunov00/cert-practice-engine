    filters tuned to a teenage audience, with safe replies that point to support, address the harmful output directly. They
    should then be retested.
  why_not:
    A: Terms of service do not stop the model generating harmful content and shift the burden to young users.
    B: Testing already shows the provider's default settings are not enough for this audience.
    C: Teenagers over thirteen are the target users and remain exposed. Self-declared age is also easy to bypass.
