stem: A game studio's AI companion for teenagers recalls past chats through saved memory notes. A classifier scores
  each whole conversation for harm. Red-team testers got self-harm content by building a role-play across many short
  sessions. Which control BEST addresses this?
options:
  A: A classifier that scores each full conversation for harm
  B: A shorter limit on the number of turns per session
  C: Harm scoring that covers context carried between sessions
  D: Prompt screening for known jailbreak phrases
answer: C
explanation:
  why_correct: The attack spreads the role-play over sessions, and the memory notes carry it from one session to
    the next. Each session looks harmless to a classifier that sees only that conversation. Scoring that includes
    the context carried between sessions, such as the memory notes, lets the control see the accumulated context
    that the attack relies on.
  why_not:
    A: Conversation-level scoring is the usual answer to multi-turn attacks, but the studio already has it. The
      attack works across sessions, beyond what one conversation shows.
    B: Shorter sessions make the problem worse, because the attack already uses many short sessions linked by memory.
    D: Phrase screening catches known jailbreak wording, but a gradual role-play needs no such phrases.
