subdomain: '3.4'
difficulty: hard
stem: A broadcaster attaches signed content credentials to the audio it publishes. Fake clips imitating its presenters
  circulate on social media, where platforms strip file metadata when clips are reshared. Which control BEST lets
  fact-checkers confirm a reshared clip is genuine?
options:
  A: Embed a robust watermark in the audio signal itself
  B: Attach signed content credentials to each published clip
  C: Monitor social media for clips imitating its presenters
  D: Add a spoken AI disclosure to each synthetic bulletin
answer: A
explanation:
  why_correct: Content credentials travel as metadata, and the stem says platforms strip it on resharing, so a genuine
    reshared clip arrives with nothing to verify. A robust watermark sits in the audio signal and survives re-encoding,
    so a fact-checker's detector can still recognise the broadcaster's genuine audio.
  why_not:
    B: Signed credentials are the standard provenance control, but the broadcaster already uses them and they are
      lost when platforms strip metadata.
    C: Monitoring helps find fakes for takedown, but it does not give fact-checkers a way to verify any given clip.
    D: A spoken disclosure labels the broadcaster's own synthetic bulletins. A faker can copy or omit it, so it
      does not prove a clip is genuine.
