id: aaism-d3-3.2-0020
subdomain: '3.2'
difficulty: medium
stem: A bank's latest chatbot release fixed a jailbreak, introduced by the release before it, that leaked account
  data. One night the new release crashed, and the on-call engineer followed the runbook, which redeploys the previous
  approved version by its ID. The vulnerable release served customers for nine hours. Recovery must take under 15
  minutes. Which change BEST prevents a repeat?
options:
  A: Roll back only to an approved, immutable version ID
  B: Require security sign-off before each rollback proceeds
  C: Run the security regression suite on the rollback target
  D: Bar versions with known security flaws from redeployment
answer: D
explanation:
  why_correct: The vulnerable release was approved when it shipped, and nothing recorded that it was later found
    flawed. Marking versions with known security flaws in the registry as barred from redeployment lets the rollback
    tooling pick the most recent safe version, here the one before the jailbreak was introduced, within the 15-minute
    recovery target.
  why_not:
    A: The runbook already did this. The vulnerable release was an approved version, recalled by its ID; its approval simply did not
      reflect the flaw found afterwards.
    B: A sign-off adds a check, but finding and briefing an approver at night will not fit a 15-minute recovery,
      and the approver would still need a record of which versions are flawed.
    C: A regression suite catches the jailbreak only if it already tests for it, and it adds a run to every rollback.
      Recording known flaws against versions uses what is already known and adds no delay to recovery.
