subdomain: '3.2'
difficulty: hard
stem: A retailer retrains its recommender weekly on click data. A gate promotes a new version if accuracy, overall
  and for every product category, does not drop on held-out clicks from the same week. What is the MAIN weakness
  of this gate?
options:
  A: Targeted manipulation can pass an aggregate metric
  B: The test set shares the training data's manipulation
  C: The gate lacks a human approval before promotion
  D: Earlier versions may not be kept for rollback
answer: B
explanation:
  why_correct: Slice-level checks address targeted effects, but the test set is drawn from the same week's clicks.
    If fake clicks are pushing a product, they are in the test data too, so the manipulated model looks accurate.
    The gate needs evaluation data the attacker cannot influence.
  why_not:
    A: The gate already checks every product category, not just the overall figure.
    C: A reviewer looking at the same metrics would also approve. The weakness is what the gate measures against.
    D: Rollback matters for recovery, but it does not stop a manipulated model going live and is not a weakness
      of the gate.
