subdomain: '3.4'
difficulty: easy
stem: A dermatology app detects skin cancer less accurately on darker skin. Only a few hundred real images of lesions on darker
  skin exist, so the team trained on thousands of AI-generated ones and reports a large accuracy gain on a held-out synthetic
  set. What should the security manager require before release?
options:
  A: Dermatologists' review of the synthetic images for realism
  B: Fine-tuning on the real darker-skin images after synthetic training
  C: Testing on held-out real darker-skin images against a set accuracy bar
  D: Testing on a second generator's darker-skin images against a set accuracy bar
answer: C
explanation:
  why_correct: A gain measured on synthetic images shows the model learned the generator's images, not real lesions. The few
    hundred real images are too few to train on but can test with, so holding out a representative set and setting the bar
    with the uncertainty of a small sample in mind is the evidence that patients with darker skin are actually better served.
  why_not:
    A: Expert review can catch images that look wrong, but realistic-looking images can still miss how lesions really present,
      and a review does not measure the model's accuracy.
    B: Fine-tuning on the real images may help the model, but it uses up the only real darker-skin images, leaving no real
      evidence of how it performs on patients.
    D: A second generator and a set bar give a less self-serving test, but its images still are not real lesions, so passing
      the bar says nothing certain about real darker-skin patients.
