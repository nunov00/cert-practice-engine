subdomain: '3.4'
difficulty: easy
stem: A dermatology app detects skin cancer less accurately on darker skin. Only a few hundred real images of lesions on darker
  skin exist, so the team trained on thousands of AI-generated ones and reports a large accuracy gain on a held-out synthetic
  set. What should the security manager require before release?
options:
  A: Dermatologists' review of the synthetic images for realism
  B: Lower weighting of the synthetic images during training
  C: Testing on held-out real darker-skin images against a set accuracy bar
  D: Disclosure to users that synthetic images were used in training
answer: C
explanation:
  why_correct: A gain measured on synthetic images shows the model learned the generator's images, not real lesions. The few
    hundred real images are too few to train on but enough to test with, so holding them out and testing on them is the evidence
    that patients with darker skin are actually better served.
  why_not:
    A: Expert review can catch images that look wrong, but realistic-looking images can still miss how lesions really present,
      and a review does not measure the model's accuracy.
    B: Down-weighting may limit harm from poor synthetic data, but it does not show whether accuracy on real darker-skin patients
      improved.
    D: Disclosure supports transparency, but it says nothing about whether the model is now safe to rely on for these patients.
