subdomain: '3.5'
difficulty: easy
stem: A logistics firm finds that its demand forecasting model became steadily less accurate over six months, and no one was
  alerted. Which control was MOST likely missing?
options:
  A: Change management for retraining the forecasting model
  B: Monitoring of input data and results against thresholds
  C: Role-based access control on the training data store
  D: Regular backups of the model weights and configuration
answer: B
explanation:
  why_correct: Gradual decline with no alert points to drift that nobody was watching. Monitoring input distributions and
    performance metrics against defined thresholds, with alerts to a named owner, would have flagged the problem early.
  why_not:
    A: Change management governs planned changes. Here the model was not changed; the data around it was.
    C: Access control prevents unauthorised changes but would not reveal slow drift.
    D: Backups support recovery. They would not detect declining accuracy.
