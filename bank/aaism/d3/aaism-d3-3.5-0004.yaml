subdomain: '3.5'
difficulty: hard
stem: A logistics firm's dashboard shows its demand model's forecast error against actual demand each month. The
  error grew for six months as customers changed how they order, but no one acted until stock ran short. Which control
  was MOST likely missing?
options:
  A: Tighter thresholds on the model's input drift alerts
  B: Tracking of forecast error against actual demand
  C: Monitoring of missing values in the input feeds
  D: An error tolerance that triggers a named owner's review
answer: D
explanation:
  why_correct: The firm measured the right thing, and the dashboard showed the decline. What was missing was a defined
    tolerance and an accountable owner who must act when it is breached. Without that, monitoring produces information
    but no response.
  why_not:
    A: Input drift alerts are a common gap, but here the change was visible in the error figures. Another alert
      without an owner to act would likely meet the same fate.
    B: Tracking error against actuals is the standard control for this kind of drift, and the firm already had it
      on its dashboard.
    C: Missing-value checks catch broken feeds, but the problem was a real change in ordering behaviour, not missing
      data.
