subdomain: '3.3'
difficulty: hard
stem: A hospital will send patient records to an outside analytics firm to build a model that predicts readmission within
  30 days. The contract requires de-identified data, so the firm must not receive real dates, yet the model depends on the
  number of days between each patient's admissions and discharges. Which technique BEST meets both needs?
options:
  A: Replace each date with only the month and year in which it falls
  B: Shift each date by its own randomly chosen number of days
  C: Replace the dates with the order in which each patient's events occurred
  D: Shift all of a patient's dates by one randomly chosen number of days
answer: D
explanation:
  why_correct: A single random offset per patient hides the real dates while keeping every interval between that patient's
    events exact, which is what a 30-day readmission model needs. The hospital keeps the offsets, chosen over a wide enough
    range and never shared, and the firm loses only information tied to calendar dates, such as season or weekday.
  why_not:
    A: Generalising dates to month and year is a common de-identification step, but it blurs intervals by up to a month either
      way, so the model cannot tell whether a return came within 30 days.
    B: Shifting each date separately hides the real dates too, but it scrambles the gaps between a patient's events, which
      destroys the intervals the model depends on.
    C: Event order keeps the sequence of admissions and discharges, but not how many days lie between them, so the 30-day
      question cannot be answered.
