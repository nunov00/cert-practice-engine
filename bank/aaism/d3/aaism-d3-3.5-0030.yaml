id: aaism-d3-3.5-0030
subdomain: '3.5'
difficulty: hard
stem: Sales staff use an AI agent that updates CRM records with each user's own token, so the CRM audit trail shows
  only the user. Each user may edit only their own accounts. The SOC must detect changes made by an agent that injected
  content has manipulated. Which change BEST supports this?
options:
  A: An 'edited by agent' note the agent adds to each record it changes
  B: A shared agent service account with rights across sales records
  C: A tag the agent writes into each change's description field
  D: An agent identity issued on behalf of each user, logged by the CRM
answer: D
explanation:
  why_correct: An on-behalf-of identity keeps each user's permissions while the CRM itself records both the agent
    and the user for every change. The record does not depend on anything the agent writes, so the SOC can baseline
    and alert on agent activity even when the agent has been manipulated.
  why_not:
    A: A note marks agent edits in the data, but the agent writes it, so a manipulated agent can leave it out of
      exactly the changes the SOC needs to see.
    B: A separate service account makes agent actions visible in the audit trail, but it gives the agent rights to
      every account, beyond the single user's own accounts it should be limited to.
    C: A tag in the description is easy to search, but like any content the agent produces, injected instructions
      can make it omit or alter the tag.
