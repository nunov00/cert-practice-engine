id: aaism-d3-3.3-0008
subdomain: '3.3'
difficulty: hard
stem: A bank plans to give a fintech partner synthetic transaction data, generated from real customer records, to build a
  fraud model. What should the security manager require BEFORE the data is shared?
options:
  A: Testing that shows the synthetic data does not reproduce real customer records
  B: Evidence that the synthetic data keeps the statistical patterns of real fraud
  C: A partner agreement stating that the synthetic data contains no personal data
  D: Encryption of the synthetic dataset during transfer to the fintech partner
answer: A
explanation:
  why_correct: Synthetic data is not automatically safe. A generator trained on real records can memorise and reproduce near-copies
    of them, especially rare ones such as fraud cases. Privacy testing for re-identification and record leakage is needed
    before the data leaves the bank.
  why_not:
    B: Statistical fidelity is a utility check. High fidelity can even increase the chance that real records are reproduced.
    C: A contract statement does not make it true. The bank needs evidence, not a declaration.
    D: Encryption in transit is good practice but does not reduce the privacy risk once the partner holds the data.
