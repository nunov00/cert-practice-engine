id: aaism-d3-3.4-0053
subdomain: '3.4'
difficulty: hard
stem: A telecom's models give each customer a churn-risk score and a price-sensitivity segment, stored against their account
  in the CRM and used to choose which retention offers they see. A customer asks for a copy of all personal data held about
  them. The privacy team plans to send the account, billing and call records. What is the MOST important addition the security
  manager should advise?
options:
  A: The customer's records as they appear in the models' training datasets
  B: A description of each model's input features and how it was trained
  C: The score and segment stored on the account, with how they are used
  D: A fresh score and segment computed for the customer at the time of request
answer: C
explanation:
  why_correct: Scores and segments that a company infers and stores about a person are personal data about them, just as
    much as the records they supplied, and here they shape the offers the customer receives. The response should include
    the stored values and the purposes they serve, so the customer can see, and if needed challenge, what the telecom has
    concluded about them.
  why_not:
    A: Training sets may hold copies or features of the customer's records, and retained copies belong in a complete response,
      but they largely repeat what is being sent; the stored score and segment are new conclusions the telecom acts on and
      are missing from the planned reply.
    B: Information about model logic matters for significant automated decisions, but a general description of features and
      training is not the customer's personal data and leaves out what the models concluded about them.
    D: A newly computed result is not what the telecom has held and used for this customer; the request covers the score
      and segment on the account, which may differ from a fresh run.
