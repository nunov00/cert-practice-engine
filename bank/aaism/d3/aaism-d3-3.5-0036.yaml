id: aaism-d3-3.5-0036
subdomain: '3.5'
difficulty: medium
stem: A company's SOC receives model gateway logs of each conversation with its finance agent and, separately, the ERP audit
  log of changes the agent makes. The agent runs hundreds of conversations at once, many for the same users. An
  investigation took days to tie each suspicious change to the conversation behind it. Which logging change BEST fixes this?
options:
  A: Synchronised clocks across the gateway and the ERP logs
  B: The requesting user's name in each ERP change record
  C: A conversation ID carried into each tool call and logged
  D: Alerts on ERP changes made by the agent's service account
answer: C
explanation:
  why_correct: The two logs describe the same events but share no key. Carrying a conversation ID from the gateway into each
    tool call, and recording it in the ERP audit log, links every change to the exact conversation that caused it, however
    many run at once.
  why_not:
    A: Synchronised clocks underpin any correlation, but with hundreds of conversations running at once, many changes fall
      within the same seconds, so timing alone cannot say which conversation made which change.
    B: The user's name narrows the search, but the same users hold many conversations at once, so it still leaves several
      candidates for each change.
    D: Alerts flag agent changes for review, but they do not say which conversation produced each change, which is what the
      investigators lacked.
