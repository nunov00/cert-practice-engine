id: aaism-d3-3.1-0013
subdomain: '3.1'
difficulty: hard
stem: A consultancy's assistant reads each user's mailbox, summarises external web pages and can send email for the user. A prompt filter
  screens retrieved pages. In a pilot, staff approved almost every send request without reading it. Which design change BEST reduces
  the risk of data being sent out by hidden instructions?
options:
  A: Replace the prompt filter with a stronger classifier trained on recent attacks
  B: Require the user to confirm each email in a clearer and more detailed prompt
  C: Disable the send tool for any session that has processed external web content
  D: Log all outgoing emails and alert the SOC when one goes to a new external domain
answer: C
explanation:
  why_correct: 'Exfiltration needs three things together: access to private data, exposure to untrusted content and a way to send data
    out. Removing the send capability once untrusted content has entered the session breaks that chain by design, whatever the filter
    misses. The pilot shows that per-email approval is not working, so a structural control that does not depend on user attention is
    best here.'
  why_not:
    A: A better classifier lowers the hit rate, but filtering is probabilistic and new hidden instructions will still get through. It
      improves a layer that already exists rather than removing the path.
    B: Human confirmation is normally a strong control, but the pilot shows approval fatigue. A more detailed prompt does not change
      the fact that staff approve without reading.
    D: Alerting is a useful detective layer, but it fires after the email and its data have already left the organisation.
