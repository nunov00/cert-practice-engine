id: aaism-d1-1.1-0013
subdomain: '1.1'
difficulty: medium
stem: A manufacturer plans an AI tool that scans staff email for signs of insider threat. Legal has confirmed the tool is
  lawful and a privacy impact assessment is complete. In two of its countries, works councils have legal rights over any
  new technology used to monitor staff. What should the security manager do FIRST?
options:
  A: Launch a pilot in the countries that have no consultation duty
  B: Publish a staff notice that explains what the tool monitors
  C: Consult the staff bodies in those two countries before rollout
  D: Ask internal audit to confirm that the access controls work
answer: C
explanation:
  why_correct: Consulting the works councils is a legal precondition in those countries, and the other gating checks are
    already done. Bringing the representatives in before rollout meets the duty and gives a key stakeholder group a voice
    while the design can still change. Skipping them would make the deployment unlawful there, however good the controls
    are.
  why_not:
    A: A pilot elsewhere is a reasonable way to learn, but it does not meet the duty and can harden the design before the
      required consultation takes place.
    B: Transparency to staff is good practice, but a notice informs people. It does not replace a legal duty to consult.
    D: Assurance on access controls is useful later. The open question here is a stakeholder duty, not control design.
