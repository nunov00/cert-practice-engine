id: aaism-d1-1.5-0003
subdomain: '1.5'
difficulty: medium
stem: A travel company's recovery plan restores servers, databases and its recommendation model, whose files are
  backed up hourly to storage in the production cloud account. The plan's main scenario is ransomware across production.
  What is the GREATEST concern?
options:
  A: Model backups may be encrypted along with production
  B: Production model files may be outside backup scope
  C: Recovery objectives may ignore retraining time
  D: Restored model accuracy may not be validated
answer: A
explanation:
  why_correct: The backups sit in the same account the ransomware scenario assumes is compromised. Without isolated
    or immutable copies, one attack could destroy the model files and their backups together.
  why_not:
    B: Missing model artefacts are a common recovery gap. Here the model files are backed up every hour.
    C: Retraining time matters if the model must be rebuilt. That only arises if the backups are lost, which is
      the root concern.
    D: Validation is good recovery practice. There is nothing to validate if the backups are encrypted with production.
