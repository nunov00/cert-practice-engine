id: aaism-d1-1.3-0013
subdomain: '1.3'
difficulty: medium
stem: A lender's schedule deletes personal data in training sets after two years. A new sector rule requires it
  to keep its credit model's exact training data for ten years so decisions can be reproduced. What should the security
  manager advise?
options:
  A: Delete the data on schedule and keep dataset documentation
  B: Anonymise the training data and keep it for reference
  C: Keep it in a restricted archive under a recorded exception
  D: Keep the data in the training environment for ten years
answer: C
explanation:
  why_correct: The rule needs the exact data, so deletion is not possible. A restricted archive with a recorded
    exception meets the rule while limiting access and keeping the schedule's deviation documented.
  why_not:
    A: Documentation alone cannot reproduce decisions; the rule needs the data itself.
    B: Anonymised data is no longer the exact data, so decisions cannot be reproduced.
    D: The data must be kept, but leaving it in a working environment exposes it more than needed.
