id: aaism-d1-1.3-0007
subdomain: '1.3'
difficulty: hard
stem: A credit card issuer is replacing its fraud-scoring model with a new one. Which step is MOST important when
  retiring the old model?
options:
  A: Keep the old model running in parallel as a permanent fallback
  B: Delete the old model's training data as soon as the model is switched off
  C: Remove its access paths and handle its artefacts per retention rules
  D: Compare the outputs of the old and new models for a set period
answer: C
explanation:
  why_correct: A retired model left reachable is an unmonitored attack surface. Closing endpoints, credentials and
    integrations, then archiving or destroying artefacts as the retention rules require, ends the risk while keeping
    records that may be needed to explain past decisions.
  why_not:
    A: An unmanaged parallel model adds cost and exposure. A fallback should be a deliberate, controlled choice.
    B: Immediate deletion may breach retention duties, such as being able to explain past fraud decisions.
    D: Parallel comparison is a useful transition check, but it does not close the old model's access paths or settle
      what happens to its artefacts.
