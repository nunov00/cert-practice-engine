difficulty: hard
stem: An insurer's AI policy required a full security review for every AI use case. Reviews took three months, so
  the policy's approver has just authorised a lighter path for low-risk cases. What should the security manager
  do FIRST?
options:
  A: Propose a lighter low-risk path to the policy's approver
  B: Define the criteria that make a case low-risk
  C: Publish a list of pre-approved tools for common uses
  D: Hire more reviewers to clear the queue faster
answer: B
explanation:
  why_correct: The lighter path cannot be applied safely until it is clear which cases qualify. Clear criteria stop
    high-risk cases slipping into it.
  why_not:
    A: The approver has already authorised it.
    C: A list may help later, but tools on it would need to pass through a defined path first.
    D: Extra staff treat the symptom; the approved change already tackles the cause.
