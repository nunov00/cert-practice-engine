subdomain: '1.3'
difficulty: medium
stem: A security manager suspects the AI inventory is incomplete because teams build agents on a low-code platform
  without telling anyone. What is the BEST way to make the inventory complete and keep it so?
options:
  A: Make registration a condition for deployment and production data access
  B: Send every team a yearly survey asking them to list all the AI tools they use
  C: Ask internal audit to compile the inventory during its next review
  D: Run a one-off scan of code repositories and platforms for AI assets
answer: A
explanation:
  why_correct: Linking registration to the things teams need, such as deployment rights and data access, makes the
    inventory self-maintaining. Unregistered assets simply cannot go live, so completeness no longer depends on
    people remembering.
  why_not:
    B: Surveys rely on self-reporting and go out of date quickly between rounds.
    C: Audit can test completeness but should not own building and maintaining the inventory.
    D: A one-off scan helps find today's gaps, but new agents built tomorrow would be missed.
