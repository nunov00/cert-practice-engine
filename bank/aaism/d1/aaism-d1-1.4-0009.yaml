difficulty: hard
stem: An insurer added hidden-document prompt injection to its AI review checklist last quarter. Two chatbots that
  passed that item were then hijacked exactly that way. Review records show developers ticked the item themselves.
  What does this MOST likely show?
options:
  A: Review criteria lag behind emerging AI threats
  B: Runtime monitoring of prompts and outputs is missing
  C: Reviews accept self-attestation without test evidence
  D: Developers lack training on prompt injection defences
answer: C
explanation:
  why_correct: The checklist covered the technique, yet both chatbots passed and then fell to it. The records show
    the item was self-certified by the builders. The program needs reviews that require evidence, such as test results,
    or independent testing for high-risk items.
  why_not:
    A: Outdated criteria are a common reason reviews miss new attacks. This checklist was updated last quarter to
      include this exact technique.
    B: Runtime monitoring could detect such attacks and may be needed. It does not explain why a review that covered
      the technique passed vulnerable chatbots.
    D: Developer training may help, but the review exists to catch what builders miss. It passed the chatbots because
      it relied on the builders' own tick, so training alone would not fix the review.
