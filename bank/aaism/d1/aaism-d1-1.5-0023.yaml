stem: Investigators found that an attacker held write access to a bank's shared feature store for three weeks before it was
  revoked. Five fraud and credit models retrain from the store on different schedules, and one of them now flags far fewer
  fraud cases. Which models should responders treat as possibly poisoned?
options:
  A: The model whose fraud flag rate has dropped after the breach
  B: Models that trained on store data from the three weeks
  C: Models whose accuracy has fallen after the access began
  D: The five models, each rebuilt from scratch on clean data
answer: B
explanation:
  why_correct: 'Poisoned data reaches a model only if the model trains on it. Using lineage to find each model whose training
    runs drew on store data written during the three weeks gives the scope: those models are suspect even if they look normal,
    and models that did not train on that window are not.'
  why_not:
    A: The falling flag rate points to one affected model, but poisoning can leave other models looking normal, for example
      by planting a trigger that fires only later.
    C: Accuracy checks catch crude poisoning, but targeted poisoning is designed to keep overall accuracy steady, so a stable
      figure does not clear a model.
    D: Rebuilding the five models is the cautious choice, but models that did not train on the window hold no poisoned data,
      and rebuilding them diverts effort from the ones that did.
