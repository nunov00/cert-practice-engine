stem: Investigators found that an attacker held write access to a bank's shared feature store for three weeks before it was
  revoked. Five fraud and credit models retrain from the store each month on its latest twelve months of data, and one of
  them now flags far fewer fraud cases. Which models should responders treat as possibly poisoned?
options:
  A: Models that retrained during the three weeks of access
  B: Models trained on store rows written or changed during those weeks
  C: Models using the same feature tables as the affected one
  D: Models whose outputs shifted after the access began
answer: B
explanation:
  why_correct: Rows written during the three weeks stay in the store after access is revoked, and each model trains on a rolling
    twelve months, so retraining for the next year can pick them up. The scope is any model whose training data includes those
    rows, found through lineage, including models retrained after revocation and models that still look normal.
  why_not:
    A: Retraining during the window is the obvious test, but the rows written then stay in the twelve-month window, so a model
      retrained the week after revocation trains on them too.
    C: The affected model's tables are a natural place to start, but the attacker could write to any part of the shared store,
      and poisoning aimed at another model would leave this one's tables untouched.
    D: Shifted outputs reveal crude poisoning, but targeted poisoning is designed to leave normal behaviour unchanged until
      a trigger appears, so steady outputs do not clear a model.
