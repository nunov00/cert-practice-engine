id: aaism-d1-1.4-0004
subdomain: '1.4'
difficulty: medium
stem: An online retailer's board wants one early warning that AI adoption is outpacing security oversight. Every
  system in its AI inventory has been risk-assessed, but staff surveys suggest many AI tools are never registered.
  Which indicator is BEST?
options:
  A: AI services seen in network traffic but not inventoried
  B: Share of inventoried AI systems not yet risk-assessed
  C: Number of AI systems registered each quarter
  D: Overdue high-rated findings from AI risk assessments
answer: A
explanation:
  why_correct: The oversight gap here sits outside the inventory, in tools staff adopt without registering. Comparing
    observed AI use with the inventory measures that gap, and it rises as unregistered adoption grows, before incidents
    reveal it.
  why_not:
    B: This is often the best measure of oversight lag. Here every inventoried system is assessed, so it would read
      zero while unregistered tools spread.
    C: Registrations show the pace of known adoption. They count only tools people chose to register, which is the
      part of adoption already under oversight.
    D: Overdue findings track remediation on assessed systems. They cannot show AI use that was never registered
      or assessed.
