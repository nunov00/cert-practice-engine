id: aaism-d1-1.3-0015
subdomain: '1.3'
difficulty: medium
stem: An insurer's model registry keeps every approved model version and a link to its training data. During a complaint
  investigation, the team cannot show which version scored one customer's claim, because the scoring service always loads
  the newest approved version. Which change would BEST close this gap?
options:
  A: Keep each retired model version in the registry indefinitely
  B: Release new model versions only once each quarter
  C: Raise a change ticket each time a new version goes live
  D: Log the model version identifier with every decision
answer: D
explanation:
  why_correct: The link that is missing is between each decision and the asset that made it. Recording the version with
    every decision gives exact traceability, even when versions change often or run side by side. The registry can then
    supply the training data and approval record for that version.
  why_not:
    A: The registry already keeps every version. Longer storage does not show which one made a given decision.
    B: Fewer releases make dates easier to match, but they slow improvements and still give no direct proof per decision.
    C: Change records help, but the time of a release only lets the team infer the version. Gradual or parallel rollouts
      break that inference.
