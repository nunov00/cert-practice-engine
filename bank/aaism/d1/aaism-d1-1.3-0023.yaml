id: aaism-d1-1.3-0023
subdomain: '1.3'
difficulty: medium
stem: A research team's text-embedding model, rated low criticality, is retrained weekly on web pages it scrapes. The fraud
  team now feeds its embeddings into the payments fraud model, rated high, and needs each weekly update to catch new scam
  wording. The research team still owns and uses the model. What should the security manager do FIRST?
options:
  A: Pin the fraud model to one reviewed embedding version
  B: Have the fraud team test each embedding update before use
  C: Re-rate the embedding model at the fraud model's criticality
  D: Transfer ownership of the embedding model to the fraud team
answer: C
explanation:
  why_correct: A component inherits the criticality of the most critical system that depends on it. Re-rating the embedding
    model brings its scraped training data, weekly retraining and access under the controls that a high-criticality asset
    needs, where a poisoned update would actually start.
  why_not:
    A: Pinning protects the fraud model from untested changes, but the fraud team needs each weekly update, so a pinned version
      would soon miss new scam wording.
    B: Consumer testing catches updates that hurt accuracy, but poisoning aimed at payments can pass such tests, and it leaves
      the embedding model's own pipeline under low-criticality controls.
    D: The research team still owns and uses the model, so moving ownership would not fit its use, and the low rating would
      follow it unless the asset is re-rated.
