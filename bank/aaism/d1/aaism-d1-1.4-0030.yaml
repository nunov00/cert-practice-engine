id: aaism-d1-1.4-0030
subdomain: '1.4'
difficulty: medium
stem: An insurer's product teams say AI security reviews delay launches, and the CIO proposes self-certification against a
  checklist with sampling after launch. Each review takes about two days of reviewer time, yet most designs need several rounds,
  and reviewers' first comments mostly ask for data flows and test results. The security team has four staff for 60 product
  teams. What should the security manager propose?
options:
  A: Lighter reviews for designs rated low risk at intake
  B: Self-certification against the checklist, sampled after launch
  C: Security architects embedded in product teams during design
  D: A required evidence pack, checked before review starts
answer: D
explanation:
  why_correct: The time goes into rounds of rework, and the first round is spent asking for basic material such as data flows
    and test results. Defining the evidence each design must include, and checking it at intake, means designs enter review
    once with what reviewers need. That removes most of the delay without cutting what is reviewed, and it scales across 60
    teams.
  why_not:
    A: Risk tiering is a common way to speed reviews, but low-risk designs would still arrive without data flows and test
      results, and the review effort itself is only about two days, so the rounds of rework remain.
    B: Self-certification removes the delay by removing the review. Teams whose designs arrive incomplete are unlikely to
      certify accurately, and sampling after launch finds problems late.
    C: Embedded architects would help teams prepare complete designs, but four security staff cannot be embedded in 60 product
      teams.
