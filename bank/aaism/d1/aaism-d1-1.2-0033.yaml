difficulty: hard
stem: Researchers at a telecom published a fine-tuned model on a public hub alongside a conference paper. The paper had passed
  the company's publication review, which checks text and figures. Testers later drew customer phone numbers out of the model,
  which had been tuned on support chats. Which policy change BEST prevents a repeat?
options:
  A: Extend publication review to models and datasets released with papers
  B: Bar publication of models trained on any company data
  C: Require differential privacy in training for any model built on customer data
  D: Scrub names and account numbers from data before fine-tuning
answer: A
explanation:
  why_correct: The leak happened because released artefacts fell outside the only review publication had. Bringing models
    and datasets into that review lets reviewers apply release criteria, such as testing for memorised personal data, and
    withhold any model trained on customer data that lacks enough evidence before it leaves the company.
  why_not:
    B: A blanket bar on any company data also stops releases that carry no customer data, such as models trained on public
      or engineering data, and pushes researchers to work around the policy.
    C: Differential privacy limits memorisation, but requiring it for every model trained on customer data imposes accuracy
      costs on internal models that are never published.
    D: Scrubbing names and account numbers leaves other personal data, such as the phone numbers that leaked, and does not
      cover what else a released model might reveal.
