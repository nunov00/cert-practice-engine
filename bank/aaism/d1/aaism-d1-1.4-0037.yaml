subdomain: '1.4'
difficulty: medium
stem: A food retailer has acquired a start-up that built about 40 experimental models on public data and has no security program.
  The integration plan connects two of its recommendation models to the retailer's loyalty data in three months. What should
  the security manager do FIRST?
options:
  A: Inventory the start-up's models, data sources and data flows
  B: Assess the two models against the group standard before they connect
  C: Apply the group AI standard to the start-up with a one-year deadline
  D: Route the start-up's new launches through the group review process
answer: B
explanation:
  why_correct: The exposure that arises soonest is the two models about to receive customers' loyalty data, and the integration
    plan already names them. Assessing them against the group standard before the connection, with conditions for go-live,
    puts limited effort where harm could arise within three months.
  why_not:
    A: An inventory is a normal early step, but the experimental models use public data and the plan already identifies the
      two that will touch customer data, so a full inventory first delays the time-critical work.
    C: Bringing the start-up up to the standard is the right long-term goal, but a one-year deadline leaves the two connections
      unassessed when they go live.
    D: Reviewing new launches covers future work, but the two models already exist and would be connected without a review.
