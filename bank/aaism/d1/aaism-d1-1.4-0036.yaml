difficulty: hard
stem: An insurer's AI red team logs its findings, such as jailbreaks and injection routes, in its own spreadsheet. The enterprise
  vulnerability process, which assigns owners, sets fix deadlines and escalates overdue items, does not include them, and
  several high findings have been open for a year. What should the security manager do?
options:
  A: Bring AI findings into the enterprise process, with severity criteria for them
  B: Build a separate AI findings tracker with its own deadlines and escalation
  C: Appoint an AI security lead to chase open findings with owners each month
  D: Report the number of open AI findings to the risk committee each quarter
answer: A
explanation:
  why_correct: The enterprise process already provides ownership, deadlines and escalation. Adding AI findings, with criteria
    to rate their severity, puts them through the same machinery that drives other findings to closure.
  why_not:
    B: A parallel tracker duplicates machinery that already exists, splits remediation reporting and needs authority of its
      own to escalate.
    C: A chaser adds effort but no deadlines or authority, so owners can still put findings outside the process they are measured
      on at the back of the queue.
    D: Reporting counts raises visibility but gives no finding an owner or a deadline.
