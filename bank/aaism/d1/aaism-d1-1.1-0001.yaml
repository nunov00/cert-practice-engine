subdomain: '1.1'
difficulty: medium
stem: A bank's quarterly report shows every key AI system's residual risk within the board's approved appetite.
  The board now asks how far it can rely on those ratings. What should the security manager MAINLY present?
options:
  A: Residual risk ratings for each key AI system
  B: Independent test results for the controls behind the ratings
  C: The bank's main AI risks ranked by business impact
  D: Control maturity scores against a recognised AI framework
answer: B
explanation:
  why_correct: The residual ratings assume the controls work as designed. The board's question is about reliance,
    which is answered by evidence that those controls actually operate, such as independent testing of them.
  why_not:
    A: The board already has these ratings. Repeating them does not show whether they can be trusted.
    C: A ranking of inherent risks informs priorities, but says nothing about whether the residual ratings are sound.
    D: Maturity scores describe how well controls are designed and managed, not whether the specific controls behind
      the ratings are working.
