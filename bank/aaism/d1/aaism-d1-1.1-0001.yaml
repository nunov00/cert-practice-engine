id: aaism-d1-1.1-0001
subdomain: '1.1'
difficulty: medium
stem: After a news story about a chatbot leaking data, the board of a regional bank asks the information security
  manager for a briefing on generative AI risk. What should the briefing MAINLY cover?
options:
  A: Whether the bank's own chatbot has the flaw behind the reported leak
  B: The main AI risks set against business goals and risk appetite
  C: How the bank's AI controls compare with a recognised AI framework
  D: The AI policy and the staff training planned for this year
answer: B
explanation:
  why_correct: Boards govern by setting direction and appetite. They need the few risks that matter, expressed in
    business terms, with how far each sits from appetite and what is being done about it. That lets them decide
    on priorities and funding.
  why_not:
    A: Checking exposure to the reported flaw is a sensible operational task, but it reacts to one incident. The
      board needs the overall risk picture to set direction.
    C: A framework comparison shows control maturity, but not which risks matter most to the business or whether
      they sit within appetite.
    D: Policy and training are useful responses, but they are means. The board first needs to know the risks they
      address and how far exposure is from appetite.
