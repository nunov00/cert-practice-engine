id: aaism-d1-1.2-0037
subdomain: '1.2'
difficulty: medium
stem: A company's policy has each AI agent run under the account of the employee who built it, so that a named person
  answers for it. Staff have built 300 agents, and several run month-end finance tasks for whole teams. After one builder
  left, her agent kept emailing suppliers in her name for weeks, until her account was closed and a finance task stopped.
  Which policy provision BEST fits?
options:
  A: Each agent gets its own identity, owned by the team whose work it does
  B: Each agent gets its own identity, and its builder reviews its access yearly
  C: Each agent gets its own identity, disabled when its builder leaves the firm
  D: Each agent gets its own identity and a named owner, reassigned at leaving
answer: D
explanation:
  why_correct: An identity of its own stops the agent acting in a person's name, but the policy also wants a named person
    to answer for each agent, and the incident shows that builders leave while their agents keep working. A named owner
    keeps one person accountable, and reassigning ownership when that person leaves keeps the month-end tasks running
    with someone still answerable for them.
  why_not:
    A: Team ownership survives staff leaving, but a team is not a named person, so the policy's aim that someone answers
      for each agent is lost, and with 300 agents nobody in a team is clearly responsible for any one of them.
    B: Access reviews by the builder keep a person involved while the builder stays, but nothing changes when the builder
      leaves, which is the case that failed, so the agent runs on with no one reviewing or answering for it.
    C: Disabling the agent when its builder leaves ends the unattended running, but it stops month-end finance tasks for
      whole teams, which repeats the second failure in the incident.
