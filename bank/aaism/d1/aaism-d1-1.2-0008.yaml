id: aaism-d1-1.2-0008
subdomain: '1.2'
difficulty: medium
stem: Six months after a bank approved its AI policy, which by design routes agent pilots through exceptions until
  an agent standard exists, four findings arrive. Which BEST shows the policy text itself needs revision?
options:
  A: An audit finds several staff did not follow the policy
  B: A new regulator rule on AI lending is missing from it
  C: A survey shows half of staff cannot recall the policy
  D: Agent pilots routinely go through the exception process
answer: B
explanation:
  why_correct: A binding requirement the policy does not contain can only be fixed by changing the text.
  why_not:
    A: Non-compliance points to enforcement or awareness, not to wrong text.
    C: Poor recall is a communication issue; the text may be sound.
    D: The policy is designed to send agent pilots through exceptions for now, so this shows it working as intended.
