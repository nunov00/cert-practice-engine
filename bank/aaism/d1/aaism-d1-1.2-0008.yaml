id: aaism-d1-1.2-0008
subdomain: '1.2'
difficulty: medium
stem: A retail bank's AI policy was approved a year ago. Which event should MOST likely trigger an immediate review
  of the policy?
options:
  A: The AI framework cited in the policy issues a routine minor update
  B: A staff survey shows low awareness of the current policy
  C: An audit finds a few staff not following the current policy
  D: The bank decides to let AI agents act on customer accounts
answer: D
explanation:
  why_correct: Letting AI agents take actions on accounts is a major change in how AI is used and in the risks involved.
    A policy written for advisory or internal use may not cover autonomous actions, so it needs review now.
  why_not:
    A: A minor framework update can wait for the next scheduled review. It does not change the bank's own AI use
      or risk.
    B: Low awareness points to a training gap. The policy content may still be right.
    C: Non-compliance points to awareness or enforcement gaps. It does not show that the policy content is wrong.
