stem: A bank's support chatbot showed some customers other customers' account details through a faulty retrieval filter.
  The team has turned off retrieval, and the chatbot now answers only general questions. Logs show about 40 affected sessions.
  What should the incident team do NEXT?
options:
  A: Fix the retrieval filter and turn retrieval back on
  B: Hold a post-incident review to find the root cause
  C: Retrain the chatbot to refuse account-related questions
  D: Work out what data was disclosed and to which customers
answer: D
explanation:
  why_correct: Containment is done, so the priority is scoping the breach. Knowing exactly which data reached which people
    drives notification to customers and regulators, often under deadlines. It also preserves evidence before systems change
    during recovery.
  why_not:
    A: Recovery is needed, but restoring the feature before the scope is known risks repeat exposure and changes the evidence.
    B: A root-cause review is important, but it comes after scoping and notification duties are handled.
    C: The cause was a retrieval filter, not model behaviour. Retraining targets the wrong layer and does not help with
      notification.
