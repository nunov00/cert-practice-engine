stem: A bank's chatbot showed some customers other customers' account details through a faulty retrieval filter.
  The team turned off retrieval, identified the 40 affected customers and notified them and the regulator. Customers
  now complain it cannot answer balance questions. What should the team do NEXT?
options:
  A: Trace which retrieval results exposed data to whom
  B: Fix and test the retrieval filter before re-enabling it
  C: Hold the lessons-learned review
  D: Add an output filter that masks account numbers
answer: B
explanation:
  why_correct: Containment, scoping and notification are done, so recovery comes next. Restoring retrieval only
    after the filter is fixed and tested brings back the service without repeating the exposure.
  why_not:
    A: Scoping is usually the step after containment. The affected customers are already identified, and notifications
      have gone out.
    C: A post-incident review is important. It normally follows recovery, and customers are losing service now.
    D: An output filter adds depth. On its own it does not restore the balance answers that need retrieval.
