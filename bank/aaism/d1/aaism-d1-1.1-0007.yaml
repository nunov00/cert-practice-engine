id: aaism-d1-1.1-0007
subdomain: '1.1'
difficulty: medium
stem: A medical device maker's AI imaging feature is classed as high-risk and needs a conformity assessment before
  release. What is the security manager's MOST important contribution?
options:
  A: Lead the conformity assessment as its accountable owner
  B: Supply evidence that security and robustness controls work as intended
  C: Run a penetration test of the feature shortly before release
  D: Approve the clinical accuracy thresholds proposed by the data scientists
answer: B
explanation:
  why_correct: Conformity assessment needs documented proof that required controls exist and are effective. Security
    and robustness are within the security manager's remit, so providing tested evidence is their core contribution.
  why_not:
    A: Accountability for conformity sits with the manufacturer's product and regulatory leadership. Security contributes
      evidence for its part but does not own the whole assessment.
    C: A single late test is useful but narrow. The assessment needs evidence that security and robustness controls
      are designed in and work across the life cycle.
    D: Clinical accuracy thresholds are a clinical and product decision. Security should not approve them.
