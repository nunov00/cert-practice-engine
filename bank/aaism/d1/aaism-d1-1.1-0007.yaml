id: aaism-d1-1.1-0007
subdomain: '1.1'
difficulty: medium
stem: A device maker's AI imaging feature is in conformity assessment. Its adversarial robustness report covers
  an earlier model version; the device ships a version retrained on new scans. Which evidence BEST shows the shipped
  model resists altered images?
options:
  A: Robustness testing repeated on the shipped model
  B: The earlier robustness report with a change impact note
  C: Held-out accuracy results for the shipped model
  D: A penetration test of the device's network interfaces
answer: A
explanation:
  why_correct: Retraining can change how a model reacts to crafted inputs, so only tests on the version that ships
    show that it resists them.
  why_not:
    B: A change note explains what differs but cannot show how the retrained model behaves under attack.
    C: Accuracy on normal scans says nothing about resistance to deliberately altered ones.
    D: A network test covers how the device is reached, not how the model responds to manipulated images.
