id: aaism-d1-1.4-0026
subdomain: '1.4'
difficulty: hard
stem: A bank's AI security standard requires signed model artefacts. A year on, 25 of its 30 AI teams hold time-limited exceptions
  to that rule, each citing the central ML platform they all deploy through, which has no signing step. What should the security
  manager do?
options:
  A: Have the platform team build signing into the shared pipeline
  B: Give each team a signing tool for its own deployment scripts
  C: Limit the signing rule to models rated high risk for now
  D: Require each exception to carry a team remediation plan
answer: A
explanation:
  why_correct: 'The exceptions share one cause: the platform every team deploys through cannot sign. Adding signing to that
    shared pipeline fixes the gap once for all teams and lets the exceptions close, which no team-level step can do.'
  why_not:
    B: Per-team tooling suits teams that run their own deployments. Here every team deploys through the central platform,
      so the teams do not control the step where signing belongs, and thirty separate setups would be harder to keep consistent.
    C: Scoping a requirement by risk is often sound, but it does not remove the cause. High-risk teams would still deploy
      through a platform that cannot sign and would still need exceptions.
    D: Remediation plans are good exception practice when the gap sits with each team. These teams cannot fix a platform they
      do not own, so their plans would only restate the dependency.
