id: aaism-d1-1.3-0014
subdomain: '1.3'
difficulty: hard
stem: A demand-forecasting model is rated low criticality in the AI inventory because it only fed analysts' reports. A procurement
  team has now connected its output straight to automatic purchase orders. The model itself has not changed and its accuracy
  is stable. What should the security manager do FIRST?
options:
  A: Arrange adversarial testing of the forecasting model
  B: Re-rate its criticality based on how it is now used
  C: Require human approval for large purchase orders
  D: Add sign-off for any new consumers of model outputs
answer: B
explanation:
  why_correct: Criticality depends on how an asset is used, not only on the asset itself. Once its output drives payments
    with no human step, the old rating and the controls based on it no longer fit. Re-rating comes first, because it decides
    which controls and tests are now needed.
  why_not:
    A: Testing may well follow, but its scope and urgency depend on the new criticality rating.
    C: Human approval may be the right treatment, but choosing it before the new rating is known is premature.
    D: A sign-off step would stop this happening again, but it does nothing for the model that is already connected.
