subdomain: '1.3'
difficulty: medium
stem: A media group has acquired a smaller firm that runs several in-house AI models. Before connecting them to
  group systems, what should the security manager do FIRST?
options:
  A: Retrain all of the acquired models on the group's own data
  B: Inventory the models and data, with owners and classifications
  C: Run a penetration test against each acquired model's external interface
  D: Retire the acquired models and replace them with group models
answer: B
explanation:
  why_correct: Before deciding on testing, integration or retirement, the group must know what it has acquired,
    who owns it and how sensitive it is. Inventory and classification are the base for every later risk decision.
  why_not:
    A: Retraining is a business and technical choice. It does not tell the group what risks it has taken on.
    C: Testing is valuable, but scoping and prioritising it needs the assets and their criticality known first.
    D: Retiring models without assessing them may destroy business value and is premature.
