stem: A logistics firm's AI security reviews depend on one specialist, who has resigned and leaves in eight weeks. Hiring
  a replacement usually takes six months, and a consultancy can lend reviewers for up to three months. What is the BEST use
  of the specialist's remaining time?
options:
  A: Clear the current review backlog before leaving the firm
  B: Write down review methods and coach two internal staff
  C: Brief the consultancy's reviewers on the firm's platforms
  D: Help shortlist and interview candidates for the role
answer: B
explanation:
  why_correct: Even if hiring starts at the resignation, a replacement arrives about four months after the specialist leaves,
    longer than the three months the consultancy can cover, and what leaves with the specialist is knowledge of how the firm's
    reviews are done. Recording the methods and coaching two staff keeps that knowledge in the firm, lets reviews continue
    through the gap, and gives the consultants and the eventual hire something to work from.
  why_not:
    A: Clearing the backlog helps for the next two months, but new reviews keep arriving after the specialist has left, with
      nothing left behind to handle them.
    C: Briefing the consultants covers up to three months, but the gap before a new hire arrives is about four, and what the
      consultants learn leaves with them.
    D: Helping recruit is useful, but a six-month hiring process will not finish within eight weeks, and the new hire would
      still start without the specialist's knowledge.
