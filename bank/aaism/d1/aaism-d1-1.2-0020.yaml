id: aaism-d1-1.2-0020
subdomain: '1.2'
difficulty: medium
stem: A company's AI policy requires approval for external AI services and bars confidential data in them. Engineers
  now run open-weight models from public hubs inside their coding tools, which give each model their files and a terminal,
  and say the policy does not apply as no data leaves. Leadership wants this to continue. Last month a downloaded model
  file ran a script when loaded. What policy change is BEST?
options:
  A: Allow only model formats that cannot run code when loaded
  B: Require a model-aware scan of each file before first use
  C: Require local models to come from a vetted catalogue
  D: Require local models to run inside an isolated sandbox
answer: C
explanation:
  why_correct: The incident came through the file format, but the larger exposure is that an unvetted model is acting
    inside engineers' workspaces, with their files and a terminal. A model with hidden behaviour in its weights can do
    harm there even when its file is safe to load. A catalogue of models that have been vetted for source and behaviour,
    converted to safe formats and recorded, covers both the file and the model, and keeps the local use leadership wants.
  why_not:
    A: Safe formats stop the kind of payload that ran last month, but they say nothing about what the weights do. A
      model that behaves badly on certain inputs still runs with the engineer's files and terminal.
    B: Model-aware scanners find known code payloads in serialised files. They do not test the model's behaviour, which
      matters here because the model can act through the engineer's terminal.
    D: Isolation is the right control for untrusted code, but these models are useful only because the coding tools
      give them the engineer's files and terminal. A sandbox that removes that access ends the use, and one that keeps
      it isolates little.
