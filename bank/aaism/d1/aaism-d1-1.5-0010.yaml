difficulty: medium
stem: A retailer found poisoned reviews in its recommendation model's training data, rolled back to a clean model
  and secured forensic copies. Data science flagged suspect reviews by matching twelve known attacker accounts and
  wants to delete them and retrain. What is the GREATEST concern?
options:
  A: Deleting those accounts' reviews may destroy evidence
  B: Retraining may reduce accuracy for genuine customers
  C: Poisoned reviews from other accounts may remain
  D: Retraining may disrupt the model now in service
answer: C
explanation:
  why_correct: The suspect set was built only from known accounts. Attackers often use many accounts, so retraining
    on what is left may bring the poisoning back. The data needs content-based checks before retraining.
  why_not:
    A: Evidence must often be preserved before deletion. Forensic copies have already been secured.
    B: Removing data can affect accuracy, which can be tested before release. A model retrained on still-poisoned
      data is the bigger risk.
    D: The clean model stays in service while a new one is built and tested, so retraining need not cause disruption.
