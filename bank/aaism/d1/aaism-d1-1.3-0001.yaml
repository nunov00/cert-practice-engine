stem: A firm's AI inventory records each system's software components. A backdoor is reported in a popular open-weight
  model, and the security manager cannot tell which in-house models were fine-tuned from it. Which inventory gap
  does this MOST reveal?
options:
  A: No record of each system's software components
  B: No record of each system's training data sources
  C: No record of each model's base model and lineage
  D: No named business owner for each AI system
answer: C
explanation:
  why_correct: Fine-tuned models inherit flaws from the model they started from. Without a record of base models,
    the firm cannot trace which of its models carry the backdoor.
  why_not:
    A: Components are already recorded, and an open-weight model is not a software library.
    B: Training data shows what a model learned from, not which pre-trained model it was built on.
    D: Owners would help with the response, but they do not reveal which models are affected.
