id: aaism-d1-1.2-0034
subdomain: '1.2'
difficulty: hard
stem: A water utility's customers increasingly send AI agents to its web portal and phone line to dispute bills and switch
  tariffs for them, and say they use agents so they need not take part in each step. Policy lets staff deal only with the
  account holder, so agents are turned away. Fraudsters already use leaked customer details to change payment details by phone.
  Which policy provision BEST fits?
options:
  A: Agents may act once they give the holder's name, address and account number
  B: Agents may view account information, while changes stay with the holder
  C: Agents may act once the holder confirms each change with a code sent by text
  D: Agents may act once the holder grants them scoped access through the portal
answer: D
explanation:
  why_correct: Access that the holder grants once in the portal, limited to what the agent may do, proves the holder's consent
    rather than the agent's knowledge of account details. Agents can then handle disputes and tariff changes on their own,
    as customers want, while agents run by fraudsters holding leaked details are kept out.
  why_not:
    A: Name, address and account number are exactly the details fraudsters already hold from leaks, so their agents could
      pass this check and act on accounts.
    B: Read-only access is a sensible first step in some settings, but the agents' main tasks here, disputes and tariff switches,
      are changes, so the complaints would continue.
    C: A one-time code per change is strong verification, but it draws the holder into every step, which is what customers
      use agents to avoid, so agents could not do the work unattended.
