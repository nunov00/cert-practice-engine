id: aaism-d1-1.5-0033
subdomain: '1.5'
difficulty: hard
stem: For nine days, a supplier's tampered product sheet sat in the index of a retailer's sales assistant, which gave
  40,000 answers in that time. The assistant paraphrases its sources rather than quoting them. Responders could not tell
  which customers had received answers based on the sheet, so they contacted every customer who used the assistant.
  Which record would BEST have let them scope this?
options:
  A: The full text of each prompt and answer in the assistant's sessions
  B: The customer, time and session of each conversation with the assistant
  C: The documents and versions retrieved to produce each answer
  D: A dated log of each document added to or changed in the index
answer: C
explanation:
  why_correct: Scoping needs the link between the bad source and each answer it shaped. Logging which documents, and which
    versions, were retrieved for every answer, alongside the session that received it, lets responders narrow the review
    to the answers that drew on the tampered sheet during the nine days, and so contact only the customers who received
    them.
  why_not:
    A: Full transcripts are useful evidence, but the assistant paraphrases, so searching answer text for the sheet's content
      would miss answers that used it in other words.
    B: Session records show who used the assistant during the nine days, which responders already had. They cannot separate
      the answers that drew on the sheet from the rest.
    D: An index change log shows when the sheet was tampered with and removed, which fixes the nine-day window, but not
      which answers retrieved it within that window.
