id: aaism-d1-1.5-0011
subdomain: '1.5'
difficulty: hard
stem: A health insurer is adding an AI annex to its general breach playbook, which already sets notification criteria,
  for its AI assistant disclosing confidential data. The assistant was not fine-tuned, keeps no memory between sessions,
  and draws all content from a retrieval index over claims files. What is the MOST important addition to the annex?
options:
  A: Steps to remove or restrict the exposed source content
  B: Steps to find which AI component exposed the data
  C: Steps to add the data to output filters
  D: Criteria for notifying the regulator and affected members
answer: A
explanation:
  why_correct: All the assistant's content comes from the index, so that is where confidential data must be contained.
    The playbook needs steps to remove it or fix its permissions quickly, which a general breach playbook does not
    include.
  why_not:
    B: Locating the source is vital when data could come from training, memory or retrieval. This assistant has
      only one source, so the step adds little.
    C: Filtering can stop a repeat while the fix is made. It masks the symptom and leaves the data reachable in
      the index.
    D: Notification criteria are essential, but the stem says the general breach playbook already sets them, so the
      annex need not repeat them.
