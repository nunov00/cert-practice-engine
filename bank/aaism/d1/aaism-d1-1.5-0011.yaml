id: aaism-d1-1.5-0011
subdomain: '1.5'
difficulty: hard
stem: A health insurer is writing a playbook for a generative AI assistant that discloses confidential data. What should this
  playbook include that the general data breach playbook usually lacks?
options:
  A: Steps to retrain the model at once so that it no longer holds the disclosed data
  B: Contact details for legal counsel, the privacy officer and the public relations team
  C: Steps to find whether the data came from training data, retrieval or session context
  D: Steps to rotate the keys the assistant uses to call the model provider's API
answer: C
explanation:
  why_correct: The containment and fix differ by source. Data in retrieval sources can be removed or re-permissioned quickly.
    Data memorised from training may need a rollback or retraining. Data from session context points to isolation failures.
    An AI playbook must guide responders to tell these apart.
  why_not:
    A: Retraining only helps if the data was memorised from training. If it came from retrieval or session context, retraining
      is slow and leaves the real cause open.
    B: Contact lists for legal, privacy and communications are standard in any breach playbook.
    D: Key rotation suits a credential compromise. Here the assistant itself disclosed data, so rotating keys does not stop
      or explain the leak.
