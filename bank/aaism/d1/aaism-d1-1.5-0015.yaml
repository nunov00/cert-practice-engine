stem: At 2 a.m., a hospital suspects that its AI triage assistant has been manipulated through poisoned inputs over the
  last two months, which covers its last two retraining cycles. Evidence is still unclear. Full manual triage is staffed
  only in the daytime. What is the BEST immediate action?
options:
  A: Keep the assistant running, with a clinician confirming each recommendation
  B: Roll the assistant back to the version that was in use before the latest retraining
  C: Shut the assistant down at once and switch to manual triage with night staff
  D: Leave the assistant unchanged until the investigation confirms the poisoning
answer: A
explanation:
  why_correct: Human confirmation of each output limits the harm a manipulated model can do, while the service keeps running
    with the staff on hand. It is a proportionate containment step while evidence is gathered. Full shutdown or rollback
    can follow once the scope is clearer.
  why_not:
    B: Rollback is a standard containment step, but the suspect period covers two retraining cycles. The previous version
      may also be poisoned.
    C: Shutdown removes the model risk, but manual triage cannot be staffed safely at night. That creates a bigger patient
      risk.
    D: Waiting for proof leaves a possibly manipulated clinical tool working with no added safeguard.
