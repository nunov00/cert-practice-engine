stem: At 2 a.m., a hospital suspects its AI triage assistant was manipulated through poisoned inputs over the last
  two months, covering two retraining cycles. Evidence is unclear, and full manual triage is staffed only by day.
  What is the BEST immediate action?
options:
  A: Keep it running with clinician confirmation
  B: Roll back to the version before the latest retraining
  C: Shut the assistant down and switch to manual triage
  D: Add drift alerts on the assistant's outputs
answer: A
explanation:
  why_correct: Clinician confirmation limits the harm a manipulated model can do while the service keeps running
    with the staff on hand. Rollback or shutdown can follow by day, once the scope is clearer and staff are available.
  why_not:
    B: Rollback is a standard containment step for poisoning. The suspect period covers two retraining cycles, so
      the previous version may be poisoned too.
    C: Shutdown removes the model risk and would be right during the day. At night manual triage cannot be staffed
      safely, which creates a bigger patient risk.
    D: Output monitoring helps detect manipulation. It only raises alerts, leaving possibly wrong recommendations
      to reach patients in the meantime.
