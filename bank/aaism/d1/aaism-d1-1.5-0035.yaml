stem: A lender's fraud model retrains each night on the last 30 days of analysts' fraud labels, and the label store keeps
  only each case's latest label. Investigators suspect one of 40 analysts has been relabelling fraud cases as genuine for
  two weeks, but do not yet know who. The model still performs within tolerance. What should responders do FIRST?
options:
  A: Roll the model back to the version trained before the two weeks
  B: Suspend the labelling rights of the fraud team's analysts
  C: Pause the nightly retraining and snapshot the label store
  D: Retrain tonight without the labels changed in the two weeks
answer: C
explanation:
  why_correct: Pausing retraining stops tonight's run from building more relabelled cases into the model, and a snapshot preserves
    the current labels, which later edits would overwrite, as evidence for finding the analyst and the affected cases. The
    model is still within tolerance, so it can keep serving while the investigation proceeds.
  why_not:
    A: Rolling back is a common containment step, but the next nightly run would rebuild the model from the same tampered
      labels, and the model now in use is still within tolerance.
    B: Removing the team's labelling rights halts fraud work for 40 people to stop one unknown person, and the tampered labels
      already in the store would still feed tonight's retraining.
    D: Excluding recent changes may be a remedy once the scope is known, but the two-week window is only a suspicion, and
      the step does nothing to preserve evidence of which labels changed.
