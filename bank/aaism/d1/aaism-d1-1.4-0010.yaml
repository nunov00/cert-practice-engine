subdomain: '1.4'
difficulty: easy
stem: A manufacturer's new AI security program covers only models built by its own data science team. What is the GREATEST
  weakness of this scope?
options:
  A: It does not set how often the in-house models must be retrained
  B: It does not include the data science team's delivery and productivity goals
  C: It leaves out AI embedded in purchased products and external services
  D: It does not name which machine learning frameworks developers may use
answer: C
explanation:
  why_correct: Much AI exposure comes from AI in third-party software, cloud services and tools staff adopt. A scope limited
    to in-house models leaves that exposure ungoverned, so the program cannot give a complete view of AI risk.
  why_not:
    A: Retraining frequency is an operational detail for each model. It is not a program scope matter.
    B: Delivery goals belong to data science management. Omitting them is not a security weakness.
    D: Approved frameworks belong in standards set by the program. Their absence from the scope is minor.
