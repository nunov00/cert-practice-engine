stem: A law firm's incident classification scheme has no AI-specific categories. What is the PRIMARY benefit of adding them?
options:
  A: AI incidents reach the right responders and playbooks with suitable severity
  B: Regulators can see that the firm has a formal and documented approach to AI incidents
  C: Management can measure how many incidents each AI team is responsible for
  D: AI incidents can be handled separately from the normal security reporting
answer: A
explanation:
  why_correct: Classification drives routing and severity. Categories such as prompt injection, poisoned model or harmful
    output make sure the right people, including data scientists and model owners, are engaged and the correct AI playbook
    is used.
  why_not:
    B: Showing a formal approach may help with regulators, but it is a side effect, not the primary purpose.
    C: Classification is for response, not for assigning blame to teams.
    D: AI incidents should be part of normal incident reporting, not split from it.
