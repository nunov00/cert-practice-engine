subdomain: '1.5'
difficulty: hard
stem: A law firm's AI incident category sent a prompt injection against its research assistant to model-skilled
  responders within minutes. It was still rated low, since severity counts only records exposed, though tainted
  research had reached court filings. What change would MOST help?
options:
  A: Faster routing of AI tickets to model specialists
  B: A playbook step to check outputs for tampering
  C: Severity criteria that reflect AI-specific harms
  D: Trend reporting on AI incident severity over time
answer: C
explanation:
  why_correct: Routing worked; rating did not. A scale that counts only exposed records missed the harm of manipulated
    output reaching court. Severity rules covering output integrity and the actions taken on outputs would set the
    right urgency.
  why_not:
    A: Routing to the right skills is a main benefit of AI categories. Here the ticket reached specialists within
      minutes.
    B: Checking outputs is a sound response step. With a low rating, the case still gets low priority and limited
      escalation, so the step may come too late.
    D: Trend data supports planning. It reports the ratings as given and does not change how this kind of incident
      is rated.
