id: aaism-d1-1.2-0007
subdomain: '1.2'
difficulty: medium
stem: At a telecom operator, business units launch AI pilots quickly and security often hears about them only after
  go-live. Which measure is MOST effective in making sure security is considered early?
options:
  A: Have internal audit review each AI pilot shortly after it goes live
  B: Build a security risk check into intake and approval of AI use cases
  C: Run awareness sessions on AI risk for the heads of business units
  D: Require every AI vendor to complete a security questionnaire up front
answer: B
explanation:
  why_correct: Making a security check part of the standard path for approving a new AI use case means it happens
    every time, before launch. It is structural and proactive rather than dependent on goodwill or later detection.
  why_not:
    A: Post-launch audit is reactive, and audit should not own a management control.
    C: Awareness helps, but it relies on people remembering to involve security. It does not ensure it.
    D: Vendor questionnaires cover only bought tools and one type of risk. In-house pilots would still be missed.
