id: aaism-d1-1.2-0013
subdomain: '1.2'
difficulty: hard
stem: A research team was granted a six-month policy exception to use an unapproved coding assistant, on condition that
  no client code is entered. The exception ends next week. The team now relies on the tool, and a completed vendor assessment
  rates its residual risk within appetite. What should the security manager do?
options:
  A: Renew the exception for six more months with the same conditions
  B: Move the tool through the standard approval process
  C: Let the exception lapse and block the tool until approval is done
  D: Ask internal audit to check that the conditions were followed
answer: B
explanation:
  why_correct: Exceptions are meant to be temporary. Now that the tool has been assessed and found within appetite, the
    right path is to approve it formally, with its conditions written into the standard rules. This ends a standing exception
    and brings the tool under normal policy, monitoring and review.
  why_not:
    A: Renewal is defensible in the short term, but rolling exceptions turn into a permanent shadow approval that bypasses
      the normal process.
    C: Blocking a tool that is already assessed as within appetite disrupts the team with no risk benefit, and invites workarounds.
    D: Checking compliance with the conditions is useful input, but it does not decide how the tool should be governed from
      next week.
