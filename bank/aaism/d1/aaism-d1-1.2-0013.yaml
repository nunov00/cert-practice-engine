id: aaism-d1-1.2-0013
subdomain: '1.2'
difficulty: hard
stem: A research team's six-month exception to use an unapproved coding assistant ends next week. Logs show its
  no-client-code condition was met, and a vendor assessment completed last month rates residual risk within appetite.
  What should the security manager do?
options:
  A: Renew the exception with the same conditions
  B: Let the exception lapse until approval is complete
  C: Approve the tool through the standard process
  D: Commission a fresh vendor assessment
answer: C
explanation:
  why_correct: Exceptions are meant to be temporary. The tool has been assessed and the condition held, so the right
    move is formal approval, with the condition written into the standard rules. That ends a standing exception
    and brings the tool under normal monitoring and review.
  why_not:
    A: Renewal is defensible short term, but rolling exceptions become a shadow approval that bypasses the normal
      process.
    B: Lapsing follows the letter of the exception, but it disrupts a team using a tool already assessed as acceptable
      and invites workarounds.
    D: A fresh assessment adds delay without new information, since a recent one already exists.
