stem: A red team keeps its library of working jailbreak prompts against the company's own AI assistants on a wiki every employee
  can read. The release team reruns the prompts as regression tests after each release. What should the security manager do?
options:
  A: Move the library into the red team's private repository
  B: Reword the prompts so they no longer work as written
  C: Encrypt the wiki pages that hold the library
  D: Classify the library and limit it to teams that use it
answer: D
explanation:
  why_correct: Working attacks against the company's own systems are a sensitive asset. Classifying the library sets how it
    is stored and shared, and limiting access to the red and release teams cuts misuse while keeping it usable as a regression
    suite.
  why_not:
    A: A private repository restricts access, but it cuts off the release team that runs the tests, and leaves the library
      without handling rules.
    B: Prompts that no longer work cannot show whether fixes still hold, so the regression tests lose their value.
    C: Encryption at rest protects the storage, but every employee who can open the wiki still reads the prompts.
