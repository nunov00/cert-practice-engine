stem: After two tabletop exercises, a firm's data science and security responders coordinate well on AI incidents.
  Their playbook assumes a poisoned model can be rolled back within an hour, which nobody has tried. Which exercise
  BEST fits next?
options:
  A: A third tabletop with a harder poisoning scenario
  B: A live drill restoring a previous model version
  C: A red team attack on a production model
  D: A purple team test of AI detection rules
answer: B
explanation:
  why_correct: Coordination has been tested; the untested piece is the technical step the playbook depends on. A
    live rollback drill shows whether the one-hour assumption holds.
  why_not:
    A: Tabletops are the right start for new teams. These teams already coordinate well, and discussion cannot prove
      that a rollback works.
    C: Red teaming tests resistance to attack. It does not test the recovery step the playbook relies on.
    D: Purple teaming tunes detection. The untested assumption is in recovery, not detection.
