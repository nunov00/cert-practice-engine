id: aaism-d1-1.5-0019
subdomain: '1.5'
difficulty: easy
stem: A bank's assistant answers from a vector index that is not backed up, because it can be rebuilt from the source documents,
  which are replicated to a second region. A rebuild takes three days, and the assistant's recovery time objective is eight
  hours. What should the security manager recommend?
options:
  A: Run the assistant without retrieval during outages
  B: Pin the embedding model version used for the index
  C: Back up the index itself for a faster restore
  D: Test that a rebuilt index returns the same results
answer: C
explanation:
  why_correct: The recovery plan relies on a rebuild that takes three days, far beyond the eight-hour recovery time objective.
    Backing up the index itself, and testing its restore, lets it be recovered within the objective while the source documents
    remain the fallback.
  why_not:
    A: A degraded mode can help continuity, but an assistant without retrieval cannot answer from the bank's documents, so
      it does not deliver the service the objective protects.
    B: Pinning the embedding model helps a rebuild produce a consistent index, but it does not shorten the three-day rebuild.
    D: Checking that a rebuild gives the same results is good practice, but a rebuild that works still takes three days.
