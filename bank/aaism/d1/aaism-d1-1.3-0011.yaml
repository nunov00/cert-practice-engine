subdomain: '1.3'
difficulty: hard
stem: A support chatbot's system prompt holds refund limits. Prompt changes are reviewed and regression-tested,
  yet customers got the bot to quote its instructions, limits included. Which control would MOST likely have prevented
  this?
options:
  A: Keeping refund limits in a back-end check, not the prompt
  B: Reviewed and tested changes to the system prompt
  C: Output filtering for refund amounts and limits
  D: Classifying the system prompt as confidential
answer: A
explanation:
  why_correct: Anything in a prompt can be coaxed out. Moving the limits to a back-end check means there is nothing
    sensitive for the bot to reveal.
  why_not:
    B: Change control is already in place; the leak came from the prompt's content, not a bad change.
    C: Filters reduce leaks but can be evaded by rewording, while the data stays in the prompt.
    D: A label sets handling rules for people but does not stop the bot repeating the prompt.
