id: aaism-d1-1.3-0011
subdomain: '1.3'
difficulty: medium
stem: A customer-service team uses carefully tuned system prompts that hold business rules and name internal tools.
  How should these prompts be treated?
options:
  A: As temporary settings that do not need any formal control
  B: As public content, since customers interact with the chatbot
  C: As information assets with an owner, a class and change control
  D: As source code that belongs to the vendor of the language model
answer: C
explanation:
  why_correct: System prompts shape model behaviour and reveal internal details useful to attackers. Treating them
    as owned, classified assets under change control protects their integrity and confidentiality.
  why_not:
    A: Uncontrolled changes to prompts can alter behaviour and weaken guardrails without anyone noticing.
    B: Customers see the outputs, not the system prompt. Its contents are internal and can aid attacks if exposed.
    D: The prompts are written by the organisation for its own use. The model vendor does not own them.
