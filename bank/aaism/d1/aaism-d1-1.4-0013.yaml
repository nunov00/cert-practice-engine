id: aaism-d1-1.4-0013
subdomain: '1.4'
difficulty: medium
stem: A bank's model risk team already validates every model before use, but it has no security skills. The new AI security
  program needs security reviews of the same models. Business owners already complain about review fatigue. What is the
  BEST approach?
options:
  A: Run a separate security review after model validation is done
  B: Make the model risk team responsible for AI security reviews
  C: Add security criteria to validation, assessed by security staff
  D: Ask internal audit to cover AI security in its model reviews
answer: C
explanation:
  why_correct: Building security into the existing validation step uses a process that already reaches every model and adds
    no new gate. Security staff assess the security criteria, so the work is done by people with the right skills. Roles
    stay clear and the business sees one review, not two.
  why_not:
    A: A separate review covers the risk, but it adds a second gate that the business already resists. It invites delay
      and workarounds.
    B: Giving the work to a team with no security skills makes reviews weak, even though the process reaches every model.
    D: Audit gives independent assurance. It should not run a management control that it may later need to audit.
