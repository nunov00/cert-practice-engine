stem: A firm has rated its 40 AI assets, and 12 are high criticality. Threat reports show attackers targeting customer-facing
  chatbots at similar firms. Which high-criticality assets should get the strongest controls FIRST?
options:
  A: Those with the most internal users
  B: Those built on third-party foundation models
  C: Those processing the most sensitive data
  D: Those exposed to external users
answer: D
explanation:
  why_correct: Among assets of similar impact, those facing active threats carry the most risk. The threat reports
    point to externally reachable chatbots, so those high-criticality assets have the highest likelihood of attack
    and should be hardened first.
  why_not:
    A: User numbers affect business impact, which the criticality rating already reflects.
    B: Third-party models add supply chain risk, but the reported threat comes through external access.
    C: Data sensitivity is already part of the criticality rating that put all 12 at the top.
