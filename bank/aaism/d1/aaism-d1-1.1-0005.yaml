id: aaism-d1-1.1-0005
subdomain: '1.1'
difficulty: medium
stem: A health insurer learns that a new AI regulation, taking effect in 18 months, may cover its claims triage
  model. What should the security manager do FIRST?
options:
  A: Brief the board on the expected cost of meeting the regulation
  B: Run a full gap assessment of the model against the draft requirements
  C: Update the AI policy so that it refers to the forthcoming regulation
  D: Work with legal to confirm whether the model falls within its scope
answer: D
explanation:
  why_correct: Everything else depends on whether the regulation applies and in which category. Confirming scope
    with legal comes first. It decides which requirements a gap assessment should use.
  why_not:
    A: A cost briefing is premature. Until scope is confirmed, any estimate may be for duties that do not apply.
    B: A gap assessment is the likely next step, but it needs the scope and risk category settled first.
    C: A policy reference adds little until the organisation knows whether and how the rule applies.
