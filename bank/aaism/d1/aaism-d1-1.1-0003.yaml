subdomain: '1.1'
difficulty: medium
stem: A travel company mapped a new AI management standard onto its certified security management system and extended
  its risk method to score harm to customers. Three models now score above tolerance. What should the security manager
  do NEXT?
options:
  A: Agree treatment for the three models with their owners
  B: Build a separate AI risk register for the three models
  C: Schedule a certification audit against the AI standard
  D: Benchmark the risk method against peer travel firms
answer: A
explanation:
  why_correct: The method is in place and has identified risks above tolerance. The next step in the cycle is treatment,
    agreed with the owners who are accountable for those models.
  why_not:
    B: A separate register would split AI risk from the integrated system the company has just extended, and it
      does not treat the risks.
    C: Certification should follow once known risks above tolerance are being treated, not before.
    D: The method has just been extended and is producing results. Benchmarking it delays action on known risks.
