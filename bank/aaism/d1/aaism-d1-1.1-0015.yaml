id: aaism-d1-1.1-0015
subdomain: '1.1'
difficulty: hard
stem: A retailer has bought an AI hiring tool that is in a regulated high-risk category. The vendor has completed the required
  conformity assessment. The retailer now plans to fine-tune the tool on its own hiring data and offer it to its franchisees
  under the retailer's brand. What is the GREATEST concern?
options:
  A: The hiring data used for fine-tuning may hold more personal data than needed
  B: Franchisees may use the tool in ways that the retailer cannot easily supervise
  C: The fine-tuned version may perform worse than the vendor's original version
  D: The retailer may take on the legal duties of a provider for the changed tool
answer: D
explanation:
  why_correct: Changing a high-risk system substantially and supplying it to others under one's own name can shift the provider's
    obligations to the retailer. The vendor's conformity assessment covered the original tool, not the fine-tuned and rebranded
    one. This changes the whole compliance position, so legal and compliance must assess it before the plan goes ahead.
  why_not:
    A: Data minimisation is a real issue, but it is one control question within the plan, not a change in the retailer's
      legal role.
    B: Franchisee oversight matters and should be addressed by contract, but it follows from the bigger question of who
      is the provider.
    C: Performance must be tested, but a drop in quality can be measured and fixed. It does not change the regulatory duties.
