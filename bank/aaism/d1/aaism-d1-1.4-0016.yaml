id: aaism-d1-1.4-0016
subdomain: '1.4'
difficulty: hard
stem: A three-person AI security team must support 60 AI projects, and there is no budget for new hires or outside
  services this year. Most projects are low-risk internal tools built on the company's two approved AI platforms.
  What is the BEST approach?
options:
  A: Train a security champion in each project team
  B: Embed baseline controls in the approved platforms
  C: Triage by risk and review only the high-risk tier
  D: Use self-assessments for the low-risk projects
answer: B
explanation:
  why_correct: Because most projects run on two platforms, controls built into those platforms protect every low-risk
    project at once, freeing the small team to review the few high-risk projects in depth.
  why_not:
    A: Champions can help, but training and supporting 60 of them is a large load for three people, and controls
      would still vary by team.
    C: Triage puts the team's scarce review time where risk is highest, but it does not by itself give the many
      low-risk projects consistent baseline protections.
    D: Self-assessment gives some coverage, but it relies on each team's judgment and still needs the security team
      to read and follow up the results.
