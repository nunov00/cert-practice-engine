subdomain: '1.4'
difficulty: medium
stem: A firm's new AI security standard applies to systems launched from this year. Forty AI systems launched earlier. The
  most sensitive data sits in HR analytics tools that produce internal reports, while several models, each used by a small
  team, make credit decisions on customers. The security team can bring about six systems a quarter up to the standard. What
  is the BEST approach for the earlier systems?
options:
  A: Exempt them until their next major change, with interim compensating controls
  B: Upgrade them by the number of users exposed to risk, highest first
  C: Upgrade them by the harm a failure could cause, highest first
  D: Upgrade them by the sensitivity of the data held, highest first
answer: C
explanation:
  why_correct: At about six a quarter, bringing forty systems up to the standard takes well over a year, so the order matters.
    Ranking by the harm a failure could cause puts the credit-decision models, where a weakness directly affects customers'
    finances and creates regulatory exposure, at the front, however few staff use them and whatever data other systems hold.
  why_not:
    A: Phasing a standard in at the next major change, with compensating controls meanwhile, is common for low-harm systems,
      but it can leave the credit models below the standard for years if they rarely change, relying on stopgaps where harm
      is highest.
    B: User numbers are a reasonable proxy for exposure, but the credit models each serve a small team while their decisions
      affect many customers, so this order would push them towards the back.
    D: Data sensitivity matters for confidentiality, but here the most sensitive data sits in HR tools that only produce internal
      reports, while the credit models' failures harm customers directly; this order would put the reporting tools first.
