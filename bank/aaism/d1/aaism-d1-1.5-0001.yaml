difficulty: medium
stem: An online retailer's support chatbot is showing some users other customers' order details. The team disabled
  its order lookup tool an hour ago, but new leaks keep appearing and their source is not yet known. What should
  the team do NEXT?
options:
  A: Disable the chatbot's other tools one at a time
  B: Take the chatbot offline on all channels
  C: Add an output filter that masks order numbers
  D: Review session logs to identify affected customers
answer: B
explanation:
  why_correct: Targeted containment has failed, and the leak continues from an unknown source. Until the cause is
    found, taking the chatbot offline is the only reliable way to stop further exposure.
  why_not:
    A: Narrow isolation is better when the source is known. With the source unknown, trying tools one by one leaves
      customers exposed while each step is tested.
    C: Filtering is a useful extra layer. Names, addresses and items can still leak, so it does not reliably stop
      an active exposure.
    D: Scoping is needed for notification. It should follow once the leak is stopped, not while more customers are
      being exposed.
