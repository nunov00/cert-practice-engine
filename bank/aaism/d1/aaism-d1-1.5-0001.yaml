difficulty: easy
stem: An online retailer's customer chatbot has started showing some users other customers' order details. What should the
  incident response team do FIRST?
options:
  A: Retrain the chatbot so that it no longer reveals personal order data
  B: Notify every customer whose order data may have been shown to others
  C: Switch off the chatbot or the feature that retrieves order details
  D: Review the chatbot logs to establish the root cause of the leak
answer: C
explanation:
  why_correct: The leak is ongoing, so containment comes first. Disabling the chatbot or its order retrieval feature stops
    further exposure at once. Analysis, notification and a lasting fix follow.
  why_not:
    A: Retraining takes time and may not fix the cause, which could be in retrieval or access control. Data keeps leaking
      meanwhile.
    B: Notification may be required, but the scope is not yet known and the leak has not been stopped.
    D: Root cause analysis is needed, but it should not delay containment of an active leak.
