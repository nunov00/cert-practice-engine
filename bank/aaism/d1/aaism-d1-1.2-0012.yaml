subdomain: '1.2'
difficulty: hard
stem: The HR team of a growing software firm has been using an unapproved AI CV-screening tool on a free trial for
  two months. It processes applicant data. What should the security manager do FIRST?
options:
  A: Order the tool removed at once and all applicant data deleted
  B: Assess the risk of the current use and put it through approval
  C: Report the HR team's breach of policy to the audit committee
  D: Change the policy so that it forbids free trials of any AI service
answer: B
explanation:
  why_correct: 'The manager first needs to understand the exposure: what data has gone where, under what terms,
    and with what effects on applicants. Bringing the tool into the normal approval process then leads to a risk-based
    decision to approve with controls or stop.'
  why_not:
    A: Immediate removal may be the outcome, but acting before assessing can destroy evidence and lose data the
      firm must keep.
    C: Escalation may follow, but reporting first does not reduce the risk to applicant data.
    D: A policy change addresses future cases. It does nothing about the data already processed.
