id: aaism-d1-1.3-0029
subdomain: '1.3'
difficulty: hard
stem: A health app runs a mole-checking model on users' phones so that it works without a connection. One model version was
  found to miss some melanomas. Three months after a fixed app release, 30% of installs still run the faulty version. Which
  control would BEST let the firm withdraw an unsafe model version in future?
options:
  A: In-app messages urging users to install each new release
  B: A check at launch, when online, that blocks outdated app versions
  C: Model updates sent over the air, separately from app releases
  D: A validity date on each model version, renewed by a server check
answer: D
explanation:
  why_correct: 'Withdrawing a version means making sure old copies stop being used, including on phones that are rarely online.
    A validity date that only a server check can renew does that: once the firm stops renewing an unsafe version, it stops
    giving results when its date lapses, even on a phone that never connects, and the app asks the user to update.'
  why_not:
    A: Messages raise update rates a little, but 30% of installs ignored the fixed release for three months, so they cannot
      ensure withdrawal.
    B: A launch check blocks outdated versions on phones that are online at launch, but the app is built to work without a
      connection, so offline users would keep the faulty model.
    C: Over-the-air model updates reach more users faster than app releases, but they too need a connection, and nothing stops
      a phone that misses them from using the old model.
