subdomain: '1.1'
difficulty: medium
stem: A regulator has published draft AI rules for consultation. The draft would require all prompts to customer-facing
  AI to be kept for five years, which conflicts with the bank's data minimisation policy. The compliance function owns regulatory
  tracking but has little AI expertise. What is the security manager's BEST contribution?
options:
  A: Give compliance an analysis of the draft's security and privacy impact
  B: Start building five-year prompt retention now so the bank is ready if the rule passes
  C: Take over AI regulatory tracking from compliance, given the technical content involved
  D: Brief the board directly on the conflict between the draft and the minimisation policy
answer: A
explanation:
  why_correct: The rules are still a draft, so the bank can still influence them and should not yet build to them. Compliance
    owns the response, but it needs expert input on what the retention duty would mean for risk, cost and privacy. Feeding
    that analysis into the consultation through the owner uses the security manager's skills in the right role.
  why_not:
    B: Building to a draft is premature. The retention period may change, and the store would create a large new privacy
      exposure.
    C: Lack of AI skills is a reason to support compliance, not to move its ownership. That would split regulatory tracking
      across functions.
    D: The board may need to hear about this later, through compliance. A draft under consultation does not yet need a direct
      board briefing.
