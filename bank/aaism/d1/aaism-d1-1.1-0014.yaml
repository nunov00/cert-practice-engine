difficulty: medium
stem: A regulator's final AI rules require banks to keep customer prompts for five years. Legal has amended one
  bank's data minimisation policy to match, and compliance has logged the duty. What is the security manager's BEST
  contribution?
options:
  A: Design protected storage for the retained prompts
  B: Give compliance an impact analysis for its consultation response
  C: Lead AI regulatory tracking jointly with compliance
  D: Brief the board on prompt retention versus minimisation
answer: A
explanation:
  why_correct: The obligation and the policy are settled. Five years of customer prompts is a new store of sensitive
    data, and securing it is the security manager's part.
  why_not:
    B: The rules are final, so the consultation stage has passed.
    C: Compliance owns tracking and has already logged the duty; this does not act on the new obligation.
    D: Legal has already resolved the conflict by amending the policy.
