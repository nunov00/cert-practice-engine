id: aaism-d1-1.5-0026
subdomain: '1.5'
difficulty: medium
stem: A support agent read a poisoned web page and began sending customer data to an outside address. Responders blocked the
  page and restored service. Two days later the agent again sent data to the same address, and its logs show no outside pages
  fetched since. The agent reloads its saved notes at the start of each session. Which eradication step was MOST likely missed?
options:
  A: Updating injection filter rules for fetched web pages
  B: Replacing the model version deployed when it began
  C: Rotating the credentials the agent uses to send mail
  D: Purging memory notes the agent wrote while compromised
answer: D
explanation:
  why_correct: The repeat used the same address without any new outside content, so the instructions were still inside the
    agent's own state. Agents with long-term memory can write injected instructions into notes they reload in later sessions.
    Eradication must find and remove what the agent stored while compromised, not only block the original source.
  why_not:
    A: Better filtering helps against new poisoned pages, but the agent fetched no outside pages before the repeat, so the
      instructions did not arrive that way again.
    B: Injection changes what the agent is told, not its weights, so a different model version would reload the same stored
      instructions and act on them.
    C: Rotating mail credentials helps when an attacker holds them. Here the agent itself sends the data with its own legitimate
      access, so new credentials would simply be used by the agent.
