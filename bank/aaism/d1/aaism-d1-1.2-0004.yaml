stem: Marketing asks for a three-month exception to use an unapproved image generator. The tool's terms let the
  vendor train on uploads, and some planned assets show products not yet announced. Which condition is MOST important
  to attach?
options:
  A: Staff complete AI awareness training before use
  B: The head of marketing signs off the residual risk
  C: Images of unannounced products stay out of the tool
  D: The exception is reviewed when the three months end
answer: C
explanation:
  why_correct: The specific exposure is that images of unannounced products could be absorbed into the vendor's
    models and surface elsewhere. Keeping those images out of the tool removes that exposure directly, while the
    team can still use the tool for other material.
  why_not:
    A: Training is good practice, but it does not by itself stop the images being uploaded.
    B: Sign-off by an accountable owner is part of a sound exception, but signing does not reduce the exposure.
    D: A fixed review date keeps the exception temporary, but it limits how long it lasts, not what is exposed meanwhile.
