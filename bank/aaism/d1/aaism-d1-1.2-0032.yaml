id: aaism-d1-1.2-0032
subdomain: '1.2'
difficulty: easy
stem: A company's procedure requires a security review before an AI assistant goes live. Since then, teams have changed
  their assistants' prompts every week and sometimes linked them to other company systems, with no review because the
  model is unchanged. Last month a team linked the HR records system to a general staff assistant. Which change to the
  procedure is BEST?
options:
  A: Re-review each live assistant on a fixed quarterly cycle
  B: Run automated safety tests on each assistant change before release
  C: Require review when an assistant gets new data access or actions
  D: Require a full security review before each change to an assistant
answer: C
explanation:
  why_correct: 'The risk that slipped through came from widening what an assistant can reach, which changes who can see
    HR data, not from the model. A review trigger tied to new data access or new actions catches that class of change
    before it is live, while leaving weekly prompt edits to lighter checks, so teams are not pushed to work around the
    procedure.'
  why_not:
    A: Periodic re-review would find the HR link eventually, but it could stay exposed to all staff for up to a quarter
      before anyone looked.
    B: Safety tests check what the assistant says, such as harmful or off-policy replies; linking HR records to a staff
      assistant is an access decision that such tests would not flag.
    D: Reviewing every change would catch the HR link, but with weekly prompt edits across teams it would swamp reviewers
      and invite teams to bypass the procedure.
