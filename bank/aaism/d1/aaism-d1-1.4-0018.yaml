difficulty: hard
stem: An AI security program reports that 95% of inventoried AI systems have a current threat model. Most recent incidents
  involved AI tools that staff signed up for on their own, using free accounts. Which metric would add the MOST value to the
  program's reporting?
options:
  A: Share of inventoried systems with a current threat model, by risk tier
  B: Share of business units that confirmed their inventory this quarter
  C: Share of new AI purchases that went through security intake
  D: Share of AI tools seen in network discovery that the inventory lacks
answer: D
explanation:
  why_correct: Tools adopted on free accounts never pass through purchasing or registration, so only discovery of actual use
    reveals them. Measuring how many discovered tools are missing shows the coverage gap that the current figure hides.
  why_not:
    A: Splitting the threat model figure by tier adds detail, but it still describes only systems the program already knows
      about.
    C: Intake coverage tracks purchases, but tools used on free accounts are never bought, so this metric would stay high
      while the incidents continue.
    B: Unit confirmations rely on managers knowing what their staff use, which is exactly what free sign-ups bypass.
