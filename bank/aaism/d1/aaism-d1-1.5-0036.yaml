stem: At 09:00 a deepfake video of a listed retailer's CEO announcing a product recall spreads on social media, and the
  share price starts to fall. The communications team has confirmed with the CEO that the video is fake. What should the
  response team do FIRST?
options:
  A: Issue a denial through the company's official market disclosure channel
  B: Ask the main social platforms to take the video down as manipulated media
  C: Post a video of the CEO denying the recall on the company's social media
  D: Report the video to the police and preserve copies of it as evidence
answer: A
explanation:
  why_correct: The harm is happening in the market now, as investors trade on a false announcement. For a listed company,
    a denial through its official disclosure channel is the statement that investors, the exchange and the media rely on,
    and it can go out within minutes because the facts are already confirmed. A social media reply, takedowns and a police
    report can follow in parallel.
  why_not:
    B: Takedown requests are a standard response to manipulated media, but platforms take time to act, copies spread
      faster than they are removed, and removal does not tell investors the announcement was false.
    C: A reply from the CEO reaches the audience where the fake is spreading, but for a listed company price-sensitive
      statements go first through the official disclosure channel, which investors and the exchange rely on. A social
      post can follow, and a second video of the CEO may itself be doubted while deepfakes of him circulate.
    D: Reporting the crime and preserving evidence matter for any prosecution, but neither stops the share price falling
      on a statement investors still believe.
