id: aaism-d1-1.5-0012
subdomain: '1.5'
difficulty: hard
stem: A small online shop's support app uses a third-party language model API for about 150 chats a day. The six
  staff who handled every chat before the app are still employed, and budget is tight. What BEST supports continuity
  if the API fails?
options:
  A: A tested secondary model provider
  B: A contract with a higher availability commitment
  C: A cache of answers to frequent chat questions
  D: Manual handling by existing staff during outages
answer: D
explanation:
  why_correct: The staff handled the full volume before the app, so a human fallback is proven and costs nothing
    extra. It keeps support running during an API outage.
  why_not:
    A: A second provider is a strong design where volume exceeds human capacity. Here staff can carry the load,
      so it adds cost the shop does not need.
    B: Higher commitments reduce the chance of outages and give remedies. They do not keep support running when
      an outage happens.
    C: Caching can cover common questions. Account-specific requests would go unanswered, while staff could handle
      them all.
