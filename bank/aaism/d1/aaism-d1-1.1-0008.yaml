id: aaism-d1-1.1-0008
subdomain: '1.1'
difficulty: hard
stem: A payment firm's regulator requires notice of "material AI incidents" within a short deadline, but does not
  define material. What should the security manager do to BEST make sure the duty is met?
options:
  A: Report every AI-related security event so that no notice is ever missed
  B: Reuse the materiality test from the firm's cyber incident reporting
  C: Agree materiality criteria with legal early and embed them in triage
  D: Wait for regulator guidance and decide case by case until then
answer: C
explanation:
  why_correct: Deadlines are short, so the reporting decision cannot be invented during an incident. Criteria agreed
    in advance with legal and compliance, and built into incident classification, make decisions fast, consistent
    and defensible.
  why_not:
    A: Over-reporting floods the regulator, damages credibility and wastes effort. It does not show sound judgment.
    B: Reusing existing criteria is a sensible start, but cyber tests miss AI harms such as biased or wrong decisions,
      and they were not agreed for this regulator's duty.
    D: Guidance may come later, but the duty applies now. Deciding case by case under a short deadline is slow and
      inconsistent.
