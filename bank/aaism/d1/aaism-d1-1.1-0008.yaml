stem: A payment firm must notify its regulator of material AI incidents within 72 hours. Its triage already rates
  harms such as wrong decisions at scale, but last quarter's AI incidents reached triage after four days via data
  science tickets. What BEST fixes this?
options:
  A: Add AI-specific harm criteria to the triage scale
  B: Pre-draft notification templates for likely AI incidents
  C: Route model anomaly reports straight to incident triage
  D: Train responders on the regulator's notification process
answer: C
explanation:
  why_correct: Triage can already judge AI harm; the failure is that AI incidents arrive too late. Sending model
    anomaly reports directly to triage removes the delay that makes the deadline unreachable.
  why_not:
    A: The triage scale already covers AI harms, so this does not address the four-day delay before triage.
    B: Templates save time once an incident is triaged, but the deadline is already lost before triage starts.
    D: Responders cannot act on incidents that have not reached them yet.
