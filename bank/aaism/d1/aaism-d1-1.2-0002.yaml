stem: What is the PRIMARY purpose of an acceptable use policy for generative AI tools?
options:
  A: To set rules for how staff may use the tools and with what data
  B: To list the technical settings required on each approved tool
  C: To assign accountability for AI risks to business owners
  D: To document how the business buys and renews its AI tool licences
answer: A
explanation:
  why_correct: An acceptable use policy tells staff what is allowed and what is not, including which data may be
    entered and which uses are forbidden. It sets clear expectations that can be trained and enforced.
  why_not:
    B: Technical settings belong in standards or configuration baselines, not in a user-facing policy.
    C: Accountability is set in governance documents such as the AI policy or charter. An acceptable use policy
      governs what users may do.
    D: Procurement steps are a separate process. They do not govern how staff use the tools.
