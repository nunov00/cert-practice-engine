id: aaism-d1-1.5-0017
subdomain: '1.5'
difficulty: medium
stem: During a weekend incident, a hospital's appointment assistant kept showing patients other patients' details for two
  hours while staff tried to reach the clinical director for permission to take it offline. What would BEST prevent this delay?
options:
  A: Name a deputy for the clinical director who can approve shutdown
  B: Let the incident lead disable it under playbook conditions
  C: Let the data science lead roll the model back during incidents
  D: Let the service desk switch it off on any patient complaint
answer: B
explanation:
  why_correct: Containment must not wait on finding someone outside the response team. Pre-agreed conditions under which the
    incident lead may disable the service let containment start within minutes, with the owner told afterwards.
  why_not:
    A: A deputy helps when the director is away, but containment still depends on reaching someone outside the response team.
    C: A rollback may not stop a leak whose cause is unknown, and it puts the decision with someone who is not leading the
      response.
    D: 'Any complaint is too broad a trigger: the service would be switched off for ordinary complaints, and the decision
      sits outside incident handling.'
