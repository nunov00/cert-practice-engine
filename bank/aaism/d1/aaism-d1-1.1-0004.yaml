id: aaism-d1-1.1-0004
subdomain: '1.1'
difficulty: medium
stem: A retailer runs the same customer-service AI in eight countries, each with different and changing AI rules.
  Which approach BEST supports compliance while keeping the program manageable?
options:
  A: Adopt a recognised AI framework and treat it as meeting every local rule
  B: Rely on the AI provider's compliance statements for each country
  C: Set a group baseline from shared requirements and add local controls
  D: Run a full separate compliance program and control set in each country
answer: C
explanation:
  why_correct: A common baseline covers what most rules require once, so controls and evidence are consistent. Local
    additions then handle the differences. This meets every jurisdiction while avoiding eight separate programs.
  why_not:
    A: A framework gives structure, but it is not law. Local rules add duties, such as notices or registrations,
      that a framework does not cover.
    B: The deploying company keeps its own legal duties. Provider statements are one input and cannot show that
      the retailer's use complies.
    D: Separate programs would comply but duplicate most of the work. They are costly and hard to keep consistent.
