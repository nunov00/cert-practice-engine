id: aaism-d1-1.1-0004
subdomain: '1.1'
difficulty: hard
stem: A retailer runs one shared customer-service AI platform in eight countries. The strictest country's AI rules
  cover every requirement of the other seven and add only extra notice and documentation duties. Which approach
  BEST keeps compliance manageable?
options:
  A: Map local rules to a recognised AI framework as a common reference
  B: Set a group baseline from shared rules and add local controls
  C: Give each country's compliance team its own control set
  D: Apply the strictest country's rules as the group baseline
answer: D
explanation:
  why_correct: The strictest rules already include every other country's requirements, and the extra notice and
    documentation duties cost little and conflict with nothing elsewhere. Meeting them everywhere gives one shared
    platform a single control set, with no local variants to build, test or evidence.
  why_not:
    A: A framework helps organise and compare requirements, but it is not law and does not by itself decide which
      controls the platform needs.
    B: A shared baseline with local additions suits rules that differ a lot or conflict. Here every local rule is
      already inside the strictest set, so it would create country variants of one platform for little benefit.
    C: Separate control sets suit separate systems. For one shared platform they duplicate work and drift apart
      over time.
