id: aaism-d1-1.5-0018
subdomain: '1.5'
difficulty: medium
stem: Over a week, a prompt injection led a company's CRM agent to make unauthorised changes. The agent has been disabled.
  Responders must find every record it changed. Which evidence is MOST important to preserve FIRST?
options:
  A: The documents that carried the injected text
  B: The system prompt version that was in use
  C: The agent's tool call logs and arguments
  D: A snapshot of the model weights in production
answer: C
explanation:
  why_correct: Tool call logs show each action the agent took and on which record, which is what responders need to find every
    change. They are also the logs most likely to roll over, so they come first.
  why_not:
    A: The injected documents show how the attack worked and are worth keeping, but they do not show which records were changed.
    B: The prompt version helps explain why the agent was open to injection, not what it did.
    D: An injection does not alter the model, so the weights tell responders nothing about the changes.
