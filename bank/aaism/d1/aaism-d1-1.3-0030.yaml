difficulty: hard
stem: Consultants upload files to their firm's AI assistant to ask questions about them. Each upload is also added to
  the firm-wide knowledge base so later answers can draw on it. Uploads have included client contracts and HR
  complaints. Client terms require the firm to delete a client's documents within 60 days of each engagement ending.
  Conversations are deleted 30 days after they start. Which change BEST manages these uploads?
options:
  A: Index each upload with access limited to the person who uploaded it
  B: Keep each upload only within its conversation, deleted along with it
  C: Scan each upload and keep files flagged as sensitive out of the index
  D: Keep uploads in the knowledge base for one year, then delete them
answer: B
explanation:
  why_correct: Staff upload files to ask about them, so the files are needed only for that conversation. Keeping each
    upload, and any text extracted from it, with its conversation and deleting them together after 30 days stops the
    files spreading to other staff and always meets the 60-day deadline after an engagement closes, with no copies left
    to hunt down.
  why_not:
    A: Limiting access to the uploader stops other staff seeing the files, but the copies stay in the index with no end
      date, so client documents outlive the engagements the client terms tie them to.
    C: Scanning keeps some sensitive files out, but contracts and complaints are hard to flag reliably, and unflagged client
      documents would still stay in the shared index after engagements end.
    D: A fixed retention period ends the copies eventually, but engagements end on their own dates, and the files are
      visible firm-wide for the whole year.
