stem: A media group's board receives a quarterly AI security report. Which content is MOST useful to the board?
options:
  A: Detailed counts of blocked prompts and filtered outputs for every AI system in use
  B: AI risk exposure trends against appetite, with the decisions that are needed
  C: A full list of the models tested this quarter and the test methods used
  D: Technical details of each vulnerability found in the group's AI systems
answer: B
explanation:
  why_correct: Boards oversee risk and make decisions. Trends in AI risk exposure, compared with the agreed appetite, show
    whether risk is under control. Highlighting the decisions needed, such as funding or accepting a risk, lets the board
    act.
  why_not:
    A: Operational counts are useful to the security team. They need interpretation before they mean anything to a board.
    C: A list of tests shows activity, not whether risk is within appetite.
    D: Vulnerability details are too technical for board oversight. They belong in management reporting.
