id: aaism-d1-1.4-0012
subdomain: '1.4'
difficulty: medium
stem: A media group's quarterly AI security report already compares exposure with the board's risk limits. Exposure
  has stayed above the limits for two quarters despite extra funding approved last year, and the board asks why.
  Which content would MOST help?
options:
  A: Exposure trends compared with the board's risk limits
  B: AI incident counts and impact after last year's funding
  C: Delivery status of the projects funded last year
  D: Maturity scores against an industry framework
answer: C
explanation:
  why_correct: The board knows exposure is too high; it wants to know why its investment has not reduced it. Showing
    whether the funded projects were delivered, delayed or ineffective explains the gap and guides the next decision.
  why_not:
    A: This is usually the most useful board content when limits exist. The report already shows it, and it does
      not explain why exposure has not fallen.
    B: Incident data since the funding shows harm that has occurred. It does not show whether the funded projects
      produced the planned controls, so it cannot explain why exposure stayed high.
    D: Maturity scores show capability gaps. They are not tied to the funded projects, so they cannot explain the
      lack of progress.
