id: aaism-d1-1.3-0033
subdomain: '1.3'
difficulty: hard
stem: 'An insurer must be able to re-run any pricing decision for ten years, so it archives each retired model version''s
  weights, training code, data and settings. Its models use custom layers the team wrote, and training is not exactly repeatable.
  A test found a four-year-old version would not load: current framework releases cannot read it, and several of its libraries
  have been withdrawn from public repositories. Which addition BEST makes the archive fit for purpose?'
options:
  A: A container image of each version's exact runtime and libraries
  B: A copy of each version converted to an open model exchange format
  C: A rerun of training from the archived inputs when a decision is disputed
  D: A record of the exact library versions each model version used
answer: A
explanation:
  why_correct: Re-running an old decision needs the model to load and compute exactly as it did, which depends on the framework
    and library versions it ran on. Archiving a container image with that exact runtime keeps everything needed in the archive
    itself, so it no longer depends on current framework releases or on public repositories that have already withdrawn some
    of the libraries.
  why_not:
    B: Converting to an exchange format is a good way to reduce framework lock-in, but such formats support only standard
      operations, so the team's custom layers would not convert, and any conversion can change numerical results.
    C: Retraining from archived inputs works only when training is repeatable; the stem says it is not, so a retrained model
      would not reproduce the original decision.
    D: A list of library versions documents what is needed but does not preserve it; the stem says several of those libraries
      have already been withdrawn from public repositories, so the list cannot be turned back into a working runtime.
