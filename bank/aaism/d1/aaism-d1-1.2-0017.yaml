id: aaism-d1-1.2-0017
subdomain: '1.2'
difficulty: easy
stem: An AI policy requires human approval before an agent changes a customer account. Agents now finish tasks through chains
  of small steps, each below the approval rule, that together change accounts. Most agent tasks only read account data. What
  should the security manager do?
options:
  A: Lower the per-action limit that triggers approval
  B: Base approval on a task's total effect on the account
  C: Require approval for any task that reads customer data
  D: Approve each agent's set of tools once before release
answer: B
explanation:
  why_correct: The policy means a human sees changes to customer accounts before they happen, and splitting work defeats it.
    Judging the combined effect of a task restores that intent however the agent breaks up the work.
  why_not:
    A: 'A lower limit catches more steps but keeps the same flaw: agents can split work below any limit.'
    C: Covering reads would catch the chains, but most tasks only read, so approvers would be flooded with tasks that change
      nothing and approvals would turn into a formality.
    D: Approving tools once sets what an agent can do in general, but puts no human in front of each change to an account.
