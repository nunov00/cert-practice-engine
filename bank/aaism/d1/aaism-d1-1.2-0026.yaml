id: aaism-d1-1.2-0026
subdomain: '1.2'
difficulty: medium
stem: A company's AI note-taker saves a summary of each meeting in the organiser's workspace and deletes it after 30 days.
  Staff now rely on the summaries as their only record of decisions. In a lawsuit, summaries of meetings under a legal hold
  were found deleted on schedule. Which policy provision BEST addresses this?
options:
  A: Summaries are business records, under the records schedule and holds
  B: Summaries are kept in a central archive for seven years
  C: Legal hold notices name note-taker summaries as data to keep
  D: Note-takers are switched off in meetings on disputed matters
answer: A
explanation:
  why_correct: 'The summaries now serve as the record of decisions, so they need the same life cycle as other business records:
    retention set by the records schedule, and suspension of deletion when a legal hold applies. That keeps what the law and
    the business need without keeping everything.'
  why_not:
    B: Seven years for every summary would preserve the held ones, but it keeps far more than the business or the law needs,
      adding to privacy exposure and to what must be searched in each dispute.
    C: Naming summaries in hold notices tells custodians to keep them, which is good practice, but the note-taker deletes
      them on its own schedule, so the summaries disappear whatever custodians do unless the hold reaches the tool's retention
      itself.
    D: Disputes often arise after a meeting, so this would not cover them, and staff would lose their only record of decisions
      in the meetings most likely to matter.
