stem: 'Midyear, an AI security budget is cut by 40%. Workstreams: an AI inventory that already lists every system
  and now adds lineage fields; testing a refund-issuing customer agent launching next month; a second awareness
  campaign; and a board risk dashboard. Which should be protected FIRST?'
options:
  A: Completion of the AI asset inventory
  B: A second staff awareness campaign
  C: A dashboard reporting AI risk to the board
  D: Pre-launch testing of the refund agent
answer: D
explanation:
  why_correct: The agent will soon move money for customers, so an untested flaw could cause direct loss. The inventory
    already serves its main purpose of showing what AI exists, so its remaining fields can wait.
  why_not:
    A: An incomplete inventory is often the first thing to protect, since other priorities depend on it. This one
      already lists every system; only extra fields remain.
    B: Awareness reduces misuse, but one campaign has already run and a second is easy to defer.
    C: Board reporting supports oversight. It can be built later, while an untested agent that moves money launches
      next month.
