difficulty: hard
stem: Midway through the year, an AI security program's budget is cut by 40%. Its three workstreams are an AI inventory
  that is 80% complete, pre-launch security testing of a customer-facing agent that can issue refunds, and a second awareness
  campaign. The agent's launch date is fixed. Which should the security manager protect FIRST?
options:
  A: The pre-launch testing of the customer agent
  B: The remaining 20% of the AI asset inventory
  C: The second awareness campaign for all staff
  D: An equal share of each of the three workstreams
answer: A
explanation:
  why_correct: The agent faces customers and can move money, and it will launch whether or not it is tested. That is the
    largest risk the cut could leave open. The inventory is mostly done and awareness has already been delivered once, so
    both can slow down with less harm.
  why_not:
    B: An inventory is foundational, but at 80% most of its value is already there. A short delay costs less than an untested
      agent.
    C: Awareness matters, but one campaign has already run. A second round is the easiest work to defer.
    D: Spreading the cut evenly avoids hard choices, but it may leave the highest-risk activity underfunded.
