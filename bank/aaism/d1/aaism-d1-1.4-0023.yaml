id: aaism-d1-1.4-0023
subdomain: '1.4'
difficulty: medium
stem: A retailer's AI security team reports to the chief data officer, who leads AI delivery and sets the team's budget and
  objectives, including on-time launches. Twice this year, findings the team rated low just before a fixed launch date later
  caused incidents. Nobody had overruled the team's ratings. What should the security manager propose?
options:
  A: A right to escalate overruled findings to the risk committee
  B: An annual internal audit review of a sample of the team's ratings
  C: A reporting line for the team to the CISO, outside AI delivery
  D: A target in the team's objectives for high-rated findings raised
answer: C
explanation:
  why_correct: The team softened its own ratings while working for a manager whose goals depend on launches and who controls
    its budget and objectives. That is a conflict of interest built into the structure. Reporting to the CISO, outside AI
    delivery, removes the pressure at its source, while delivery teams still receive the findings and decide on treatment
    through the normal process.
  why_not:
    A: An escalation right protects findings that management overrules. Here nothing was overruled; the team rated the findings
      low itself, so the right would not have been used.
    B: Audit sampling may detect softened ratings, but once a year and after launches, and the team keeps working under the
      same pressure.
    D: A target for high-rated findings answers one incentive with an opposite one, which can inflate ratings rather than
      make them accurate.
