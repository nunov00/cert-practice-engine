id: aaig-d1-1.1-0034
subdomain: '1.1'
difficulty: hard
stem: Across a hospital network, departments have approved dozens of exceptions to the AI policy. Each was
  judged low risk on its own and approved at department level. What should the governance lead do?
options:
  A: Take no action, since each exception was properly approved
  B: Report the combined exposure and review whether the policy fits
  C: Revoke all exceptions at once and suspend all of the affected AI uses
  D: Move all exception approvals to the IT security department
answer: B
explanation:
  why_correct: Many small exceptions can add up to a material exposure no single approver sees. A pattern of
    exceptions also signals that the policy may be impractical. Reporting the aggregate to the right governance
    level and reviewing the policy addresses both the risk and its cause.
  why_not:
    A: Individual approvals do not show the combined risk. Ignoring the pattern leaves the network exposed
      and the policy weakened.
    C: Mass revocation could disrupt clinical and administrative services without any assessment of which exceptions
      actually matter.
    D: IT security is not the right owner for business and ethical AI risk, and moving approvals does not address
      the aggregate exposure.
