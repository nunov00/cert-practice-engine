difficulty: hard
stem: An insurer uses AI to rank claims for handling. Staff formally sign off each decision but rarely
  depart from the AI's ranking. A journalist asks about AI in claims, and the communications team wants
  to say 'no AI makes decisions about claims'. What should the governance leader advise?
options:
  A: Describe the AI's ranking role and how often staff follow it
  B: Describe the AI's role as decision support under staff sign-off
  C: Describe the insurer's AI principles and its human review policy
  D: Approve the statement once legal confirms it is accurate in law
answer: A
explanation:
  why_correct: The proposed statement is technically true but misleading, because the AI strongly shapes
    outcomes. Describing what the AI does and how rarely staff depart from it gives an accurate picture
    and protects the insurer's credibility. A misleading statement exposed later would cause far greater
    harm.
  why_not:
    B: Decision support with sign-off is the formal design, but staff rarely depart from the ranking.
      Describing the design without that reliance leaves the same false impression.
    C: Principles and the review policy show intent, but they describe how things should work, not how
      claims are actually decided. The reliance on the AI stays hidden.
    D: A statement can be accurate in law and still misleading. Legal sign-off does not deal with the
      gap between formal sign-off and how decisions are really made.
