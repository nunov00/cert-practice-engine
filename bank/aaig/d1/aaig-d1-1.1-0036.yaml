stem: A chief audit executive at a large retailer is planning the first internal audit of AI governance.
  The retailer has about 200 AI uses, most of them low risk. The framework's design was reviewed by consultants
  last year, and the AI inventory has been validated. Which audit scope would give the board the MOST
  useful assurance?
options:
  A: Whether controls operate effectively for the high-risk AI uses
  B: Whether controls operate effectively for a random sample of AI uses
  C: Whether the governance framework's design covers each type of AI use
  D: Whether the AI policy and standards meet the latest regulation
answer: A
explanation:
  why_correct: The board needs to know whether governance actually works where it matters most. Testing
    that controls such as approval, ownership, oversight and monitoring operate effectively for the high-risk
    uses gives assurance where failure would do the most harm.
  why_not:
    B: Testing operation is right, but a random sample of mostly low-risk uses would spend the audit where
      failures matter least. The high-risk uses could be barely covered.
    C: A design review is a sound audit scope, but consultants reviewed the design last year. Repeating
      it adds less than testing whether the controls work in practice.
    D: Policy alignment is useful, but it tests design on paper. It does not show whether governance operates
      in practice.
