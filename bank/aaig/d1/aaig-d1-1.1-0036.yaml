stem: A chief audit executive at a large retailer is planning the first internal audit of AI governance. Which
  audit scope would give the board the MOST useful assurance?
options:
  A: Whether governance controls work as designed for high-risk AI uses
  B: Whether the data science team consistently follows its development standards
  C: Whether model accuracy is tested against the agreed thresholds
  D: Whether the AI policy text matches the latest AI regulation
answer: A
explanation:
  why_correct: The board needs to know whether governance actually works where it matters most. Testing that
    controls such as approval, ownership, oversight and monitoring operate effectively for high-risk uses gives
    assurance on the system as a whole.
  why_not:
    B: Development standards are one part of the picture, but a narrow technical scope misses the governance
      processes the board relies on.
    C: Accuracy testing is a single control. Its success says nothing about ownership, approval or ethical
      oversight.
    D: Policy alignment on paper does not show whether governance operates in practice, which is what assurance
      must cover.
