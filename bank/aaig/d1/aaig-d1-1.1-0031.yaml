difficulty: medium
stem: A retail bank is about to launch an AI chatbot for customer service. Customers can reach it in the
  app or on the website without logging in. In testing, many customers assumed they were chatting with
  staff. What should the bank's disclosure policy require for this use?
options:
  A: Tell customers in the app's onboarding screens that service uses AI
  B: Publish an explanation of the bank's use of AI on its website
  C: Tell customers at the start of each chat that they are using AI
  D: Label chatbot answers that contain financial guidance as AI-made
answer: C
explanation:
  why_correct: Customers should know when they are interacting with AI at the moment it matters. Testing
    shows they assume they are talking to staff. A notice at the start of every chat reaches both app
    and website users, whether or not they are logged in, and corrects that assumption before they rely
    on the answers.
  why_not:
    A: Onboarding screens reach app users once, when they sign up. Website visitors who chat without logging
      in never see them, and app users may have forgotten by the time they chat.
    B: A public explanation supports general transparency, but customers in the chat may never read it.
      Testing shows they need to be told while they are talking to the chatbot.
    D: Labelling guidance answers covers the riskiest content, but for the rest of the conversation customers
      would still assume they were chatting with staff.
