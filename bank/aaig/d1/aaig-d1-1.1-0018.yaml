subdomain: '1.1'
difficulty: medium
stem: The HR department of a large employer wants to use AI to analyse staff emails to predict who is
  likely to resign. The practice is lawful where the company operates and is technically feasible. The
  company's AI principles include respect for privacy and transparency. What should the AI governance
  committee do?
options:
  A: Approve it subject to a data protection impact assessment
  B: Approve it once staff are told of it in the privacy notice
  C: Refer it to legal to confirm it is lawful in each country
  D: Assess it against the company's AI principles
answer: D
explanation:
  why_correct: Legality is a minimum, not the whole test. The committee exists to apply the organisation's
    own principles, and analysing staff emails to predict resignations raises clear privacy and transparency
    concerns. It should assess the proposal against those principles and decide whether it can proceed,
    be changed or be rejected.
  why_not:
    A: An impact assessment is good practice, but approving in advance treats the question as one of legal
      risk control. The committee has not yet decided whether the use fits the company's principles at
      all.
    B: Notice supports transparency, but telling staff does not make the intrusion consistent with the
      principle of respect for privacy. The ethical question is still unanswered.
    C: The stem already says the practice is lawful where the company operates. Another legal check does
      not address the principles the committee is meant to apply.
