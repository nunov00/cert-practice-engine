difficulty: medium
stem: A restaurant brand with 300 franchised outlets learns that some franchisees use AI chatbots for
  customer orders under the brand's name, on many different ordering systems. One chatbot gave customers
  false allergy information. What is the BEST governance response for the brand?
options:
  A: Set AI standards in the franchise agreement for branded tools
  B: Require franchisees to switch to a chatbot the brand supplies
  C: Publish recommended AI practices in the franchise operations manual
  D: Audit the accuracy of each franchisee's chatbot once a year
answer: A
explanation:
  why_correct: Franchisees are independent, but they trade under the brand, and customers hold the brand
    responsible. Setting minimum standards for AI tools used under the brand in the franchise agreement
    makes them binding, while leaving franchisees free to choose tools that fit their own ordering systems.
  why_not:
    B: A single supplied chatbot gives control, but franchisees run many different ordering systems. Forcing
      one tool on all of them is costly and overrides their independence more than the risk requires.
    C: Recommended practices help franchisees who want to do the right thing, but they do not bind those
      who do not. The brand would have no basis to require changes.
    D: An annual audit finds problems after customers may already be harmed, and without agreed standards
      there is nothing binding to audit against.
