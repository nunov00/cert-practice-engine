subdomain: '1.1'
difficulty: medium
stem: A family-owned food producer with about 600 staff has no formal AI governance and few documented
  risk controls. It uses a handful of AI tools, mostly in forecasting and marketing. The executive team
  decides to base its approach on a widely used published AI governance framework. What is the BEST way
  to adopt it?
options:
  A: Tailor it to match the firm's existing risk management structure
  B: Tailor it to the firm's scale, risks and the AI it actually uses
  C: Tailor it to the expectations of the firm's largest retail customers
  D: Start with the controls the framework marks as foundational
answer: B
explanation:
  why_correct: Published frameworks are designed to be adapted. Tailoring to the organisation's scale,
    risk exposure and actual AI uses gives proportionate governance that people will follow, and focuses
    effort where the firm's real risks are.
  why_not:
    A: Fitting the framework to existing structures works where those are mature. This firm has few documented
      risk controls, so there is little structure to tailor to.
    C: Major customers' expectations matter commercially, but they reflect one group's concerns. They
      do not cover the firm's own risks across forecasting and marketing.
    D: Foundational controls are a reasonable start, but they are foundational in the framework's terms.
      Choosing by the framework's order rather than the firm's own risks may spend effort where exposure
      is low.
