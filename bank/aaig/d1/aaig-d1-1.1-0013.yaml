id: aaig-d1-1.1-0013
subdomain: '1.1'
difficulty: easy
stem: A family-owned food producer with about 600 staff has no formal AI governance. Its executive team decides
  to base its approach on a widely used published AI governance framework. What is the BEST way to adopt it?
options:
  A: Implement every control in the framework exactly as written
  B: Adapt it to the firm's scale, risks and the AI it actually uses
  C: Wait until a regulator mandates one specific framework
  D: Combine several frameworks so that no control is missed
answer: B
explanation:
  why_correct: Published frameworks are designed to be adapted. Tailoring to the organisation's scale, risk
    exposure and actual AI uses gives proportionate governance that people will follow, and focuses effort
    where the risks are.
  why_not:
    A: Adopting everything as written can impose controls that do not fit a firm of this size, creating cost and
      box-ticking without reducing real risk.
    C: Waiting leaves current AI use ungoverned. Good governance does not need a mandate to start.
    D: Stacking frameworks adds overlap and complexity. Coverage comes from understanding the firm's risks,
      not from collecting controls.
