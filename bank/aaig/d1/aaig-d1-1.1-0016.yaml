difficulty: hard
stem: A fintech operating in five jurisdictions has twice been caught out by new AI-related rules that required
  costly last-minute changes. The board asks the governance leader how to avoid a repeat. What is the BEST
  recommendation?
options:
  A: Assign ownership for horizon scanning with a route into decisions
  B: Subscribe to a legal update service for each of the jurisdictions
  C: Delay AI launches until every jurisdiction has final AI rules
  D: Ask external counsel to review each AI system once a year
answer: A
explanation:
  why_correct: The failure is not a lack of information but a lack of a process that turns it into action.
    A named owner who tracks emerging rules, assesses their impact and feeds them into strategy and project
    decisions gives the early warning the board wants.
  why_not:
    B: Subscriptions provide information, but without an owner to assess and act on it the updates can be missed
      just as before.
    C: AI regulation keeps evolving, so waiting for final rules everywhere would halt AI use indefinitely and
      give up its value.
    D: An annual system review looks at what exists today. It does not anticipate rules still being developed
      or inform new initiatives early.
