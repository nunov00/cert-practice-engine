subdomain: '1.1'
difficulty: hard
stem: A fintech operating in five jurisdictions has twice been caught out by new AI-related rules that
  required costly last-minute changes. Both rules had been public in draft for over a year. Legal already
  sends product teams alerts on new drafts, but the teams rarely act on them. The board asks the governance
  leader how to avoid a repeat. What is the BEST recommendation?
options:
  A: Assign an owner to assess emerging rules and feed them into plans
  B: Ask legal to send product teams more detailed alerts on draft rules
  C: Require a compliance sign-off before each AI launch in each market
  D: Have the risk committee review the regulatory outlook each quarter
answer: A
explanation:
  why_correct: The rules were visible and alerts went out, so the failure was not information but the
    lack of anyone charged with turning it into action. A named owner who assesses what each emerging
    rule means for products and feeds that into strategy and project decisions gives the early warning
    the board wants.
  why_not:
    B: More detail may help a little, but teams already ignore the alerts they get. Nobody is charged
      with working out the impact and making sure plans change.
    C: A launch sign-off checks rules in force at launch. It does not prepare for drafts that will apply
      later to systems already running.
    D: A committee review keeps the outlook in front of senior people, but discussing the outlook is not
      the same as assessing each draft's impact on products and roadmaps. The same gap would remain.
