subdomain: '1.1'
difficulty: hard
stem: The board of a national retail chain has just approved a three-year business strategy that replaces
  the previous one. The current AI strategy was written for the old business strategy, and the AI risk
  appetite is still being drafted. Business units have sent in 40 AI proposals. What should the head of
  AI governance advise as the FIRST filter?
options:
  A: Test each proposal against the priorities in the current AI strategy
  B: Test each proposal against the objectives in the business strategy
  C: Test each proposal against the board's AI risk appetite
  D: Ask each unit to rank its own proposals by expected financial return
answer: B
explanation:
  why_correct: An AI strategy exists to serve the business strategy, and the new business strategy is
    the only approved reference that is current. Testing each proposal against its objectives shows which
    ideas create value the enterprise now wants. Risk and return can then be judged for the proposals
    that pass this first filter.
  why_not:
    A: Testing against the AI strategy is normally right, but this one was written for a business strategy
      the board has just replaced. Its priorities may point the wrong way.
    C: Screening against risk appetite is a sound filter, but the appetite is still being drafted. There
      is no approved boundary to screen against yet.
    D: Each unit's ranking reflects its own priorities and estimates. It gives no enterprise view of which
      proposals support the strategy the board has just approved.
