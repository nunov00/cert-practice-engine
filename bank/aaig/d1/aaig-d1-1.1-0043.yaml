subdomain: '1.1'
difficulty: hard
stem: A bank and a telecom operator form a joint venture to offer AI-based credit scoring to small merchants.
  Each parent has its own AI governance framework, and the two differ on fairness testing and incident
  reporting. The telecom parent will run the platform and the merchant data under telecom rules the bank's
  framework does not cover. The joint venture agreement is being drafted. What should the bank's governance
  leader insist on?
options:
  A: The agreement sets the AI standards and accountability for the venture
  B: The agreement applies the bank's AI framework to the whole venture
  C: Each parent applies its own framework to the parts of the venture it staffs
  D: The venture's board adopts its own AI framework in its first year
answer: A
explanation:
  why_correct: In a joint venture, neither parent's framework applies automatically or fits completely.
    Setting the venture's own standards, decision rights and accountability in the agreement, including
    fairness testing and incident reporting to both parents, closes the gaps where the frameworks differ
    while the bank still has leverage.
  why_not:
    B: The bank's framework would bring its stricter fairness testing, but it does not cover the telecom
      rules under which the platform and data will run. Gaps would remain, and the partner may not accept
      it.
    C: Splitting by staffing creates two sets of rules for one product. Issues that cross the boundary,
      such as a fairness problem found in production, would have no clear owner.
    D: A venture board can own its framework, but leaving it until after launch means the product runs
      without agreed standards. The parents also lose the leverage they have while negotiating.
