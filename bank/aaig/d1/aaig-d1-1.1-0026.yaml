subdomain: '1.1'
difficulty: hard
stem: An energy company relies on a vendor's AI service to forecast grid demand, a function critical to
  operations. Last year the vendor retrained the model without warning, and forecasts were off for weeks
  before the company noticed or could find out what had changed. Which governance action is MOST important
  at contract renewal?
options:
  A: Add accuracy service levels with penalties and monthly reporting
  B: Require an independent AI certification renewed each year
  C: Agree exit terms and a tested fallback forecasting method
  D: Secure rights to change notice, test evidence and audit
answer: D
explanation:
  why_correct: The company remains accountable for a critical operation even when the AI is supplied.
    Last year's problem came from a change it was not told about and could not examine. Rights to advance
    notice of changes, to see test evidence and to audit let it oversee the model before and after each
    change. Renewal is the point of greatest leverage to obtain them.
  why_not:
    A: Accuracy service levels with penalties would have compensated for the weeks of poor forecasts,
      but only after they happened. They do not warn the company before the model changes or show how
      a new version was tested.
    B: A certificate gives general assurance about the vendor, but it does not give the company information
      on changes to this model or its testing.
    C: Exit terms and a fallback are sound resilience measures for a critical service, but they address
      losing the vendor. They do not close the information gap in the contract.
