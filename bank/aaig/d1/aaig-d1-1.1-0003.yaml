id: aaig-d1-1.1-0003
subdomain: '1.1'
difficulty: medium
stem: The board of a regional bank approved an AI risk appetite last year. Its quarterly AI update is
  a long list of project milestones and model accuracy figures, and a separate report already tracks AI
  benefits against the strategy. Directors say they still cannot tell whether AI is being governed well.
  What should the chief risk officer change in the reporting?
options:
  A: Report total AI exposure against appetite and flag decisions needed
  B: Report AI benefits against the strategy and flag projects off track
  C: Report key risk indicators for each AI project against set thresholds
  D: Report the maturity of AI governance against an industry framework
answer: A
explanation:
  why_correct: Boards oversee direction, risk and value, and the board has already set an AI risk appetite.
    Showing total AI exposure against that appetite, and highlighting the decisions directors must take,
    lets them judge whether governance is keeping risk where they want it and where to intervene.
  why_not:
    B: Tying benefits to strategy is good board reporting, but a separate report already does it. The
      missing view is risk against the limits the board set.
    C: Key risk indicators with thresholds are a good management tool, but per-project figures still leave
      directors judging a long list. They need the total picture against the appetite they approved.
    D: A maturity rating shows how capable the governance processes are, but not whether current exposure
      is inside the board's appetite. A mature framework can still carry too much risk.
