difficulty: medium
stem: The board of a regional bank receives a quarterly AI update made up of a long list of project milestones
  and model accuracy figures. Directors say they still cannot tell whether AI is being governed well. What
  should the chief risk officer change in the reporting?
options:
  A: Report AI exposure against risk appetite and key decisions needed
  B: Add a technical appendix explaining each accuracy metric in detail
  C: Shorten the report to a one-page list of project status colours
  D: Invite the data science leads to present each project in turn
answer: A
explanation:
  why_correct: Boards oversee direction, risk and value, not engineering progress. Reporting that shows AI
    exposure against the appetite the board set, and highlights the decisions directors must take, lets them
    judge whether governance is working and where to intervene.
  why_not:
    B: More technical detail makes the report longer but no more useful for oversight. Directors need meaning
      and implications, not a tutorial on metrics.
    C: Status colours are brief but say little about risk, value or compliance. A short report can still miss
      what the board needs to know.
    D: Project presentations add more operational detail and take board time without connecting AI activity
      to appetite, strategy or accountability.
