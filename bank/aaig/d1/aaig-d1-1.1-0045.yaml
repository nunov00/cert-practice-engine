id: aaig-d1-1.1-0045
subdomain: '1.1'
difficulty: medium
stem: A logistics company in a country with strong worker representation plans to use AI to set warehouse
  shift patterns. The project team intends to inform the works council once the system is ready to launch.
  What should the governance leader advise?
options:
  A: Involve the works council at the pilot stage, using real results
  B: Involve the works council now, while the design is still open
  C: Survey staff on their shift preferences before configuring the system
  D: Agree a joint review with the works council six months after launch
answer: B
explanation:
  why_correct: When AI affects how people work, early engagement with their representatives lets their
    concerns shape the design, builds trust and, in many countries, meets legal duties to consult before
    the decision is made. Waiting turns consultation into a reaction to choices already made.
  why_not:
    A: Pilot results make the discussion concrete, but by then the main design choices are fixed and staff
      are already working to the new patterns. Consultation duties usually apply before such decisions.
    C: A preference survey gathers useful input, but it does not engage the workers' representatives,
      who play a formal role in a country with strong worker representation.
    D: A post-launch review is good practice, but it only lets the council comment on a system already
      in use. Their views should shape the design first.
