id: aaig-d1-1.1-0039
subdomain: '1.1'
difficulty: hard
stem: The full board of a mid-sized insurer approves major AI proposals from management, usually without questions. In a private session, several directors admit they do not understand AI well enough to know what to challenge. One board seat falls vacant later this year. What is the BEST recommendation for the governance leader?
options:
  A: Tailored board education and independent advice on request
  B: More frequent, detailed briefings from the data science leads
  C: A board technology committee supported by an external AI adviser
  D: Recruiting a director with AI expertise to the vacant seat
answer: A
explanation:
  why_correct: Directors do not need to be engineers, but the full board approves these proposals, so each member must understand AI well enough to ask informed questions and judge management's answers. Tailored education on AI risk, value and governance, plus independent advice when a decision needs it, builds the whole board's ability to challenge, without blurring its role.
  why_not:
    B: Briefings build familiarity, but they come from the management whose proposals the board must test. Directors would learn management's view and still lack an independent basis for challenge.
    C: A committee with an adviser is a common and sound structure, but the full board still approves the proposals. Directors outside the committee would still be unable to challenge, and members would lean on the adviser rather than their own understanding.
    D: The vacancy makes an expert director a timely step, but one expert does not equip the others. The rest of the board would tend to defer to that director instead of challenging for themselves.
