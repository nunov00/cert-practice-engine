subdomain: '1.1'
difficulty: easy
stem: A global company with 40,000 employees is designing its AI awareness programme. Its staff range
  from factory workers who rarely use AI, to analysts who build models, to executives who approve AI investments.
  Which approach is MOST effective?
options:
  A: A common AI awareness course, refreshed each year
  B: Mandatory AI policy training with a yearly signed attestation
  C: In-depth AI training for model developers and model approvers
  D: Training tailored to each role's use of AI and its AI duties
answer: D
explanation:
  why_correct: People use and influence AI in different ways, from executives who decide on it to staff
    who enter data into it. Role-based training gives each group what it needs to act responsibly, which
    makes the programme relevant and effective across this mix of roles.
  why_not:
    A: A common baseline course is useful, but one level of content is too deep for factory staff and
      too shallow for analysts and executives.
    B: Policy training with attestation shows that people have read the rules, but it does not build the
      different skills each group needs.
    C: Developers and approvers need depth, but leaving out everyone else ignores the many staff who use
      AI and the executives who decide on it.
