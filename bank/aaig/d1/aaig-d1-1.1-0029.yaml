stem: A global company with 40,000 employees is designing its AI awareness programme. Which approach is MOST
  effective?
options:
  A: The same technical course on AI models for every employee
  B: A one-time video at onboarding covering the AI policy
  C: Training only for the data scientists who build AI models
  D: Training tailored to each role's use of AI and its duties
answer: D
explanation:
  why_correct: 'People use and influence AI in different ways: executives make decisions about it, managers
    approve uses, and staff enter data into it. Role-based training gives each group what it needs to act responsibly,
    which makes the programme relevant and effective.'
  why_not:
    A: A single technical course is too deep for most staff and too shallow for specialists, so it serves almost
      nobody well.
    B: A one-off video is quickly forgotten and cannot keep pace with changing tools and policy.
    C: Most AI risk now comes from people who use AI, not only those who build it. Leaving them out ignores
      a large exposure.
