subdomain: '1.1'
difficulty: medium
stem: A churn-prediction model at a telecoms operator wrongly flagged thousands of loyal customers for retention
  offers. Marketing blamed the data team for the model, and the data team blamed marketing for the input data.
  The board asks how to prevent a repeat. What should the governance lead do FIRST?
options:
  A: Assign a named owner for each AI system with documented duties
  B: Move the data science team into the marketing department
  C: Require a second model to cross-check every single churn prediction
  D: Add a clause on AI errors to each team's annual objectives
answer: A
explanation:
  why_correct: The incident shows that nobody owned the system end to end, so each team could point to the
    other. Naming an accountable owner for every AI system, with written duties covering data, performance
    and use, closes the gap and gives a single point for decisions and follow-up.
  why_not:
    B: A reorganisation might bring the teams closer, but it does not by itself define who is accountable for
      the model's outcomes.
    C: A second model is a technical control. It might catch some errors but leaves the accountability gap
      that caused the finger-pointing untouched.
    D: Shared objectives spread responsibility even more thinly. Without a single owner, both teams can still
      claim the problem lay with the other.
