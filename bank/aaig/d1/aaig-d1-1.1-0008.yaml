id: aaig-d1-1.1-0008
subdomain: '1.1'
difficulty: medium
stem: A churn-prediction model at a telecoms operator wrongly flagged thousands of loyal customers for
  retention offers. Marketing blamed the data team for the model, and the data team blamed marketing for
  the input data. Both teams attend a monthly model review meeting, and the input data met the agreed
  specification. Nobody had checked whether the outputs still made sense for marketing's purpose. What
  should the governance lead do FIRST?
options:
  A: Name an accountable owner for each AI system with documented duties
  B: Have the monthly model review track output quality for each model
  C: Define a data quality standard for inputs to customer models
  D: Document a RACI matrix splitting model duties between the two teams
answer: A
explanation:
  why_correct: The incident shows that nobody owned the system end to end, so each team could point to
    the other even with a shared meeting. Naming one accountable owner for every AI system, with written
    duties covering data, performance and fitness for use, closes the gap and gives a single point for
    decisions.
  why_not:
    B: Tracking output quality would add a useful check, but the shared review already existed and did
      not stop the finger-pointing. A meeting does not make anyone answerable for the outcome.
    C: A data standard addresses input quality, but the inputs met the specification. The failure was
      that nobody owned the fit of the outputs to their use.
    D: A RACI clarifies tasks, but splitting duties between the teams recreates the seam where the problem
      fell. Someone must be accountable for the whole system.
