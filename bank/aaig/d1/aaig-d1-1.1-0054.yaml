id: aaig-d1-1.1-0054
subdomain: '1.1'
difficulty: hard
stem: A hotel group plans to let an AI agent approve supplier invoices for payment automatically. The
  agent will run under the finance director's account. The company's delegation of authority lets the
  director approve payments up to 250,000, and the project plans to give the agent the same limit. What
  should the governance leader advise?
options:
  A: Give the agent its own identity and lower limits in the delegation
  B: Keep the director's limit and have the director review payments daily
  C: Give the agent its own system account with the director's limit
  D: Require a second human approval for agent payments over 10,000
answer: A
explanation:
  why_correct: Authority given to an AI agent should be a deliberate, recorded delegation, not inherited
    from a person's login. Giving the agent its own identity in the delegation framework, with limits
    set for what it can safely decide alone and a named accountable human, keeps its actions traceable
    and proportionate to the controls around it.
  why_not:
    B: A daily review detects problems after payments have gone out. The agent would still act under the
      director's login with a limit set for a person.
    C: A separate account fixes the shared login, but the agent would still hold a limit set for human
      judgment. Its authority would not have been deliberately decided.
    D: Dual approval is a sound compensating control, but the agent would still act under the director's
      login and formally hold a 250,000 limit set for a person. The second approver catches only what
      reaches them, and the agent's own authority is never deliberately decided.
