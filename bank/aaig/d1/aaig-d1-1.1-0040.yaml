subdomain: '1.1'
difficulty: medium
stem: The company secretary of a listed retailer proposes that directors use a public generative AI tool
  to summarise board packs, which include unpublished financial results and merger plans. Directors like
  the idea because the packs are long. What should the governance leader advise?
options:
  A: Bring directors under the staff acceptable use policy for AI
  B: Allow it only for packs that hold no inside information
  C: Provide an approved tool set up for board papers
  D: Have the company secretary's team summarise each pack by hand
answer: C
explanation:
  why_correct: The board's own use of AI handles the company's most sensitive information and should meet
    at least the standard it expects of staff. An approved tool with suitable data protection, and rules
    for how directors use summaries, meets the real need while keeping inside information under control.
  why_not:
    A: Bringing directors under the policy is right in principle, but that policy would bar confidential
      data from a public tool. It stops the risky use without meeting the directors' real need.
    B: Screening for inside information reduces the worst risk, but board packs hold other confidential
      material, and the public tool's terms still apply to all of it.
    D: Human summaries keep the data in-house, but they add a heavy recurring workload and filter what
      directors see through one team. An approved tool meets the need with less of both.
