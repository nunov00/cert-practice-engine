difficulty: medium
stem: The board of a health insurer is asked to approve an AI risk appetite statement. Which of the following
  draft statements is MOST useful for guiding management?
options:
  A: The company has a low appetite for AI risk in customer-facing uses
  B: AI risk will be managed in line with the company's risk framework
  C: No AI system may make a final claim denial without human review
  D: AI models must reach 95% accuracy before they are used in claims
answer: C
explanation:
  why_correct: A useful appetite statement is specific enough to guide decisions and to be monitored,
    and it targets the harms the board cares about. A clear boundary on fully automated claim denials
    tells management exactly where the board draws the line on a high-impact use.
  why_not:
    A: Qualitative statements like this are common, but on their own they leave management to guess what
      low means in practice. They need specific boundaries to guide decisions.
    B: This describes how risk is managed, not how much risk the board will accept. It gives management
      no boundary to act on.
    D: It is specific, but it is a technical threshold that management should set. Accuracy alone does
      not address the harm to members from a wrong denial with nobody to review it.
