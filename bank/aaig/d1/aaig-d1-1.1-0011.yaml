id: aaig-d1-1.1-0011
subdomain: '1.1'
difficulty: medium
stem: The board of a health insurer is asked to approve an AI risk appetite statement. Which of the following
  draft statements is MOST useful for guiding management?
options:
  A: The company accepts no risk of any kind from its AI systems
  B: AI risk will be managed in line with recognised industry good practice
  C: No AI system may make a final claim denial without human review
  D: Each business unit will set its own appetite for AI risk
answer: C
explanation:
  why_correct: A useful appetite statement is specific enough to guide decisions and to be monitored. A clear
    boundary on fully automated claim denials tells management exactly where the board draws the line on a
    high-impact use.
  why_not:
    A: Zero tolerance for all AI risk is unrealistic and would prevent any use of AI. Management cannot act
      on it, so it gets ignored.
    B: This sounds reassuring but sets no boundary. It gives management nothing to measure against and the
      board nothing to monitor.
    D: Risk appetite is set by the board for the enterprise. Business units can apply it, but letting each
      set its own removes the board's control.
