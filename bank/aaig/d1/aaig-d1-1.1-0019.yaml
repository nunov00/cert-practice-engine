id: aaig-d1-1.1-0019
subdomain: '1.1'
difficulty: easy
stem: The board of a water utility asks why the company should invest effort in maintaining an enterprise AI
  inventory. What is the MAIN governance value of the inventory?
options:
  A: It shows what AI is in use so that it can be overseen
  B: It lowers licence costs for the AI tools the company uses
  C: It removes the need for separate AI risk assessments
  D: It proves to regulators that all AI in use is compliant
answer: A
explanation:
  why_correct: Governance cannot cover what it cannot see. A complete inventory is the foundation for assigning
    owners, assessing risk, meeting regulatory duties and reporting to the board.
  why_not:
    B: An inventory may reveal duplicate licences, but cost saving is a side benefit, not its governance purpose.
    C: The inventory tells you which systems need assessment. It does not replace the assessments themselves.
    D: Listing systems shows what exists, not whether each one meets its obligations. Compliance needs separate
      evidence.
