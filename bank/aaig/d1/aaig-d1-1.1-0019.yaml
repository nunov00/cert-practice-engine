subdomain: '1.1'
difficulty: easy
stem: The board of a water utility asks why the company should invest effort in maintaining an enterprise
  AI inventory. What is the MAIN governance value of the inventory?
options:
  A: It shows what AI is in use so each use can be overseen
  B: It records the risk rating of each AI system for reporting
  C: It gives regulators evidence of the company's AI controls
  D: It finds duplicate AI tools so that spending can be reduced
answer: A
explanation:
  why_correct: Governance cannot cover what it cannot see. A complete inventory is the foundation for
    assigning owners, assessing risk, meeting regulatory duties and reporting to the board.
  why_not:
    B: An inventory often holds risk ratings, but the ratings come from assessments. Recording them depends
      on first knowing which systems exist.
    C: An inventory may be shown to regulators, but listing systems is not evidence that controls work.
      That needs separate testing.
    D: Finding duplicate tools is a real side benefit, but it is a cost matter, not the main governance
      purpose.
