difficulty: medium
stem: An industrial design firm's engineers are using generative AI to create new product designs that
  the firm intends to patent and license. Legal advises that protection for AI-generated work is uncertain
  in several of its markets. What should the firm's AI policy require?
options:
  A: That AI is used only for early concepts, not for final designs
  B: That core designs record human input and get legal review before filing
  C: That AI-assisted designs are filed early to secure priority dates
  D: That only AI tools whose terms assign output rights to the firm are used
answer: B
explanation:
  why_correct: The firm's business depends on owning its designs, so the policy must protect that value.
    Recording the human creative contribution and reviewing core assets with legal before filing gives
    the best chance of protection and shows where AI use could weaken it, without giving up the productivity
    gain.
  why_not:
    A: Limiting AI to concepts reduces the risk, but it gives up much of the benefit and does not show
      how much human contribution a final design holds.
    C: Early filing protects priority, but it does not help if the design cannot be protected because
      too little of it is human work. It may also waste filing costs.
    D: Vendor terms that assign rights remove the vendor's claim, but they cannot create protection that
      the law may not give. The legal uncertainty remains.
