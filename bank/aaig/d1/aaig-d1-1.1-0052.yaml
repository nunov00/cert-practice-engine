stem: An industrial design firm's engineers are using generative AI to create new product designs that the firm
  intends to patent and license. Legal advises that protection for AI-generated work is uncertain in several of
  its markets. What should the firm's AI policy require?
options:
  A: That engineers stop using AI for any design work
  B: That core designs record the human contribution and get legal review before filing
  C: That the firm claims ownership of every AI output in all its customer and licensing contracts
  D: That the AI vendor confirms the firm owns all outputs
answer: B
explanation:
  why_correct: If the firm's business depends on owning its designs, the policy must protect that value. Recording
    the human creative contribution and reviewing core assets with legal before filing gives the best chance of
    protection and shows where AI use could weaken it, without giving up the productivity gain.
  why_not:
    A: A total ban gives up a real benefit. The concern applies mainly to assets the firm needs to own, which can
      be managed without stopping all use.
    C: A contract claim does not create rights that the law may not recognise. It could also mislead customers about
      what the firm can actually protect.
    D: A vendor can waive its own claims, but it cannot grant legal protection that the law does not give. The uncertainty
      remains.
