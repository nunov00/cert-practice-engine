id: aaig-d1-1.1-0024
subdomain: '1.1'
difficulty: medium
stem: Several projects in a retail group's AI portfolio have missed their value milestones for three quarters
  in a row. Their sponsors argue that AI simply needs more time. What should the portfolio governance
  body do?
options:
  A: Review each against its case, then continue, change or stop it
  B: Review each with its sponsor and agree a recovery plan and date
  C: Ask internal audit to review how the business cases were approved
  D: Ask the sponsors to submit revised business cases with new targets
answer: A
explanation:
  why_correct: Good portfolio governance makes active, case-by-case decisions. Some projects may have
    sound reasons for delay and deserve more time; others should be reshaped or stopped. The governance
    body reviewing each against its business case avoids both throwing good money after bad and killing
    viable work.
  why_not:
    B: A recovery plan suits a project that should continue, but agreeing one with each sponsor assumes
      that all of them should. Stopping or reshaping is taken off the table before the review.
    C: An audit of approvals may yield lessons, but it looks backward. It does not decide what to do with
      the projects now missing their milestones.
    D: Revised cases may be part of the outcome, but asking sponsors to reset targets lets them move the
      goalposts. The governance body still has to judge each project itself.
