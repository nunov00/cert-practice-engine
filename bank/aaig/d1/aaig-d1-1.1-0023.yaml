subdomain: '1.1'
difficulty: medium
stem: After two years of significant AI spending, the board of a private bank asks whether the investments
  delivered value. Management has usage and cost figures for each project but cannot say what any of them
  was meant to achieve. What governance gap does this MOST likely reveal?
options:
  A: Benefits were not tracked once the projects had gone live
  B: Business units did not own the AI investments they used
  C: Expected benefits were not defined and approved up front
  D: The board did not set an appetite for AI investment
answer: C
explanation:
  why_correct: Value can only be judged against what was promised. Management cannot say what the projects
    were meant to achieve, so the expected benefits, measures and owners were never set when the money
    was approved. Defining these at approval is a basic investment governance control.
  why_not:
    A: Tracking matters, but management does have usage and cost data. What it lacks is a target to compare
      it with, which had to be set before approval.
    B: Business ownership helps realise benefits, but even an owner cannot show value without an agreed
      statement of what the investment should deliver.
    D: An investment appetite sets how much the bank will spend and on what, but it does not define what
      each project should achieve. The missing piece is at project approval.
