subdomain: '1.1'
difficulty: medium
stem: After two years of significant AI spending, the board of a private bank asks whether the investments
  delivered value. Management cannot give an answer. What governance gap does this MOST likely reveal?
options:
  A: The AI models were not accurate enough to add any value
  B: The AI budget was too small to show meaningful results
  C: Expected benefits were not defined and approved up front
  D: The board did not get enough technical briefings on AI
answer: C
explanation:
  why_correct: Value can only be judged against what was promised. If investments were approved without clear
    expected benefits, measures and owners, there is nothing to compare results with. Defining these at approval
    is a basic investment governance control.
  why_not:
    A: Accuracy may or may not be a problem, but the scenario shows management cannot answer at all, which
      points to missing value targets rather than model quality.
    B: Budget size is not the issue. Even large investments cannot show value if nobody defined what value
      should look like.
    D: Technical briefings would not tell the board whether value was delivered. The gap is in business measures,
      not technical knowledge.
