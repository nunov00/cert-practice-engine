stem: A freight company finds widespread use of unapproved AI tools, even though its policy requires approval
  first. Staff say approval takes about four months. Most requests are for low-risk uses, yet each goes
  through the same full review. Reviews of high-risk uses need specialist legal and data input that cannot
  be rushed. What is the BEST long-term response?
options:
  A: Create a faster approval route for low-risk tools and uses
  B: Set a 30-day service level for completing each approval
  C: Publish a list of pre-approved tools that staff may use now
  D: Delegate approval of AI tools to the business unit heads
answer: A
explanation:
  why_correct: Shadow AI here comes from a process that does not match effort to risk. A quicker, proportionate
    route for low-risk uses removes the incentive to bypass controls, while keeping full review for higher-risk
    ones.
  why_not:
    B: A service level speeds the process for everyone, but high-risk reviews need specialist input that
      cannot be rushed. Forcing them into 30 days weakens the reviews that matter most, while low-risk
      requests still get a full review.
    C: A pre-approved list helps in the short term, but any new need would still face the four-month process.
      It does not fix the design that drives the bypassing.
    D: Delegation speeds decisions, but it gives up consistent review for higher-risk uses too. The fix
      is a route that scales with risk, not moving the whole decision.
