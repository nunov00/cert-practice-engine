difficulty: easy
stem: A director on a hospital trust's board is asked to vote on a contract for an AI scheduling system.
  The director holds shares in the vendor that is bidding. What should happen?
options:
  A: The director declares the interest and votes with it recorded
  B: The director declares the interest and leaves the room for the vote
  C: The director declares the interest and an adviser reviews the bid
  D: The director declares the interest and leaves discussion and vote
answer: D
explanation:
  why_correct: A personal financial interest in a supplier is a clear conflict. The standard governance
    response is to declare it, record it, and have the conflicted person take no part in either the discussion
    or the vote, so the decision stays objective and can be defended later.
  why_not:
    A: Declaring and recording are needed, but voting with a known interest still lets it influence the
      outcome. Disclosure alone does not remove the conflict.
    B: Leaving for the vote is better than voting, but the director could still shape the discussion that
      leads to it. The conflict influences the decision before the vote is taken.
    C: An independent review of the bid can add assurance, but the conflicted director would still take
      part in the board's decision.
