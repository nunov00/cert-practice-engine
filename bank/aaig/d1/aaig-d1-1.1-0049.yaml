difficulty: easy
stem: A director on a hospital trust's board is asked to vote on a contract for an AI scheduling system. The director
  holds shares in the vendor that is bidding. What should happen?
options:
  A: The director votes, since the board as a whole makes the decision
  B: The director votes but asks for the shareholding to be noted later
  C: The board delays the decision until the director sells the shares
  D: The director declares the interest and takes no part in the decision
answer: D
explanation:
  why_correct: A personal financial interest in a supplier is a clear conflict. The standard governance response
    is to declare it, record it, and have the conflicted person step out of the discussion and vote, so the decision
    stays objective and can be defended later.
  why_not:
    A: Collective decision-making does not cancel an individual conflict. One conflicted vote can sway the outcome
      and undermines confidence in the whole decision.
    B: Recording the interest after voting is too late. The point is to keep the conflict out of the decision, not
      merely to document it.
    C: Forcing a share sale is not needed and delays the trust's business. Recusal resolves the conflict without
      holding up the decision.
