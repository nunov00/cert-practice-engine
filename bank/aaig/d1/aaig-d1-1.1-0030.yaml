difficulty: medium
stem: After an AI pricing error harmed customers at an online travel company, it emerged that several
  staff had noticed the problem weeks earlier but said nothing. Interviews show they did not know whom
  to tell and doubted anything would change. The board wants AI concerns raised early. What is the BEST
  action?
options:
  A: Add AI concerns to the whistleblowing policy and publicise it widely
  B: Provide easy channels to raise concerns and show what action follows
  C: Name an AI concerns contact in each team and train staff to use it
  D: Recognise staff who raise AI concerns in team meetings and reviews
answer: B
explanation:
  why_correct: The interviews give two causes, not knowing where to go and not believing it would matter.
    Easy, known channels answer the first, and showing what action followed answers the second. Together
    they build the habit of raising issues early.
  why_not:
    A: Whistleblowing channels suit serious misconduct and are often confidential, so staff rarely see
      the outcome. Publicising them tells people where to go but does little for the doubt that anything
      will change.
    C: A named contact and training tell staff whom to tell, which answers one cause. Without visible
      follow-up, the doubt that anything will change remains.
    D: Recognition encourages people who speak up, but it does not tell staff where to go. It also says
      nothing about whether their concerns lead to action.
