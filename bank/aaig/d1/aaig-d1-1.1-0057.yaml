subdomain: '1.1'
difficulty: medium
stem: A law firm approved an enterprise AI assistant after a careful review. The vendor adds new features
  every few weeks, such as web browsing and connections to email, and turns them on for all users by default.
  What should the firm's governance require?
options:
  A: New features stay on but are reviewed within 30 days of release
  B: New features stay off until assessed against the approval
  C: New features are enabled for a pilot group until assessed
  D: A full re-approval of the assistant at each major vendor release
answer: B
explanation:
  why_correct: The original approval covered the tool as it was then. New capabilities can bring new risks,
    such as client data leaving through web browsing. Keeping them off until assessed, with the check
    scaled to the change, lets the firm keep pace with the vendor while keeping control.
  why_not:
    A: A prompt review is useful, but features would run for up to a month before anyone looked. Client
      data could leave through web browsing in that time.
    C: A pilot limits exposure, but pilot lawyers would still handle client data through features nobody
      has assessed. The risk is reduced, not controlled.
    D: Major releases may need a fuller look, but features arrive every few weeks and are on by default.
      They would be live long before the next re-approval.
