subdomain: '1.1'
difficulty: hard
stem: A law firm approved an enterprise AI assistant after a review that assumed it would handle only
  documents lawyers upload for one client matter at a time. The vendor adds features every few weeks and
  turns them on by default. Recent ones include web browsing, email connections and a memory that carries
  content from one client matter into another. Which control BEST keeps the assistant within what the
  firm approved?
options:
  A: New features that reach outside data stay off until assessed
  B: New features stay off until assessed against the approval
  C: New features are enabled for a pilot group until assessed
  D: New features the vendor rates high-risk stay off until assessed
answer: B
explanation:
  why_correct: The approval rests on two assumptions, uploaded documents only and one client matter at
    a time, so any new feature can break it in more than one way. Keeping each new feature off until it
    is assessed against those assumptions catches web browsing and email connections, which reach new
    data, and the memory feature, which breaks the separation between client matters, while still letting
    the firm adopt features that fit.
  why_not:
    A: Screening for outside data catches web browsing and email connections, but the memory feature reaches
      no outside data. It would go live and carry one client's content into another client's matter.
    C: A pilot limits exposure, but pilot lawyers would still use features the approval never covered,
      carrying client content between matters or into email. The risk is reduced, not controlled.
    D: The vendor rates risk for its customers in general, not against this firm's approval. A memory across
      matters is a convenience to most customers but a confidentiality breach for a law firm, so it could
      go live unassessed.
