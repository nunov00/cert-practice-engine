id: aaig-d1-1.1-0048
subdomain: '1.1'
difficulty: easy
stem: After a data leak through a public chatbot, a manufacturer's executive committee adopted an emergency
  rule blocking generative AI tools while a proper policy was written. A policy was drafted within three
  months but has sat unapproved since. Eighteen months later the block is still in force because nobody
  reopened it. What should the emergency rule have included?
options:
  A: A condition that it lapses once the new AI policy is approved
  B: A named owner responsible for writing the full AI policy
  C: An expiry date or a set point at which it must be reviewed
  D: A route for staff to request urgent business exceptions
answer: C
explanation:
  why_correct: Emergency measures taken under pressure are often broader than needed. A sunset date or
    mandatory review point ensures the rule is reconsidered once the facts are known and a proper policy
    is ready, so a stopgap does not become permanent by default.
  why_not:
    A: Linking the rule to the new policy is a sensible design, but the policy is still unapproved. The
      condition would never have triggered, and the block would still stand.
    B: An owner for the policy is useful, but the policy was drafted on time. What was missing was a trigger
      to reopen the emergency rule itself.
    D: An exception route eases the impact of a broad rule, but it does not bring the rule itself back
      for decision. The block would still stay in place by default.
