id: aaig-d1-1.1-0004
subdomain: '1.1'
difficulty: hard
stem: A director of a listed manufacturer proposes that the board itself approve every AI model before it goes
  into use, to show strong oversight. The company runs several hundred models, most of them low risk. What
  is the BEST response from the governance advisor?
options:
  A: Agree, as approval by the board gives the strongest possible assurance
  B: Decline, as AI is purely an operational matter for management
  C: Have the board set direction and thresholds, delegating approvals
  D: Create a board subcommittee of directors to review each model
answer: C
explanation:
  why_correct: The board's role is to set direction, risk appetite and the limits of delegated authority, then
    hold management to account. Defining which AI uses must come to the board, and delegating the rest to management
    within clear thresholds, gives real oversight without turning directors into a model review team.
  why_not:
    A: Reviewing hundreds of models would overwhelm the board, slow the business and blur accountability. Directors
      would be approving work they cannot meaningfully assess.
    B: AI can create strategic, legal and reputational risk that directors must oversee. Treating it as purely
      operational leaves the board blind to material exposure.
    D: A subcommittee still puts directors into case-by-case approvals. It narrows the burden but keeps the
      board doing management's job.
