subdomain: '1.1'
difficulty: hard
stem: A manufacturing group has 30 approved AI use cases but budget for only eight this year. The CIO proposes
  ranking them by technical feasibility alone. What should the governance leader recommend?
options:
  A: Rank by feasibility, as delivery success matters most
  B: Rank by strategic value, risk and feasibility together
  C: Fund the cases put forward by the most senior sponsors
  D: Split the budget evenly so all 30 cases make progress
answer: B
explanation:
  why_correct: 'Portfolio choices should maximise value to the enterprise within its risk appetite. Combining
    strategic contribution, risk and feasibility gives a balanced ranking: an easy project with little value,
    or a valuable one with unacceptable risk, should not automatically win.'
  why_not:
    A: Feasibility alone favours easy projects whether or not they matter. The group may deliver eight projects
      that add little value.
    C: Seniority reflects influence, not value. This replaces transparent criteria with internal politics.
    D: Spreading funds thinly means few projects receive enough to deliver anything, which wastes the whole
      budget.
