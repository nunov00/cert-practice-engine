id: aaig-d1-1.1-0050
subdomain: '1.1'
difficulty: hard
stem: A group headquartered in one country issues an AI policy for all its subsidiaries. A subsidiary
  abroad, which has its own board, launched an AI pricing tool that breaches the group policy. Its managers
  say the policy was never adopted locally, so it does not bind them. What should the group governance
  leader recommend?
options:
  A: Have each subsidiary board adopt the policy, with local additions
  B: Ask the subsidiary board to withdraw the pricing tool pending review
  C: Reissue the policy as a binding directive signed by the group CEO
  D: Have group internal audit report the breach to the group audit committee
answer: A
explanation:
  why_correct: Subsidiaries are separate legal entities whose boards have their own duties under local
    law. A group policy binds a subsidiary reliably once its own board adopts it, adding what local law
    requires. That gives the policy legal standing in each entity and closes the gap the managers are
    using.
  why_not:
    B: The tool may well need to come out, and going through the subsidiary board is the right route.
      But this deals with one tool and leaves the policy without standing for future cases.
    C: A CEO directive adds weight inside the group, but it is still issued from headquarters to an entity
      with its own board. The managers' argument that it was never adopted locally would still stand.
    D: Reporting the breach informs the group, but it does not give the policy force in the subsidiary.
      The same gap would remain for the next case.
