difficulty: medium
stem: A university's AI policy, written two years ago, bans all use of generative AI by staff. A recent survey
  shows that most staff use such tools anyway for routine work. What should the governance lead recommend?
options:
  A: Enforce the ban strictly with disciplinary action for breaches
  B: Revise the policy to allow defined uses with clear safeguards
  C: Withdraw the policy and let each faculty set its own rules
  D: Block all generative AI websites on the university network
answer: B
explanation:
  why_correct: A policy that most people ignore is not controlling risk. Revising it to permit legitimate uses
    under clear conditions, such as approved tools and limits on sensitive data, brings real behaviour inside
    governance where it can be overseen.
  why_not:
    A: Strict enforcement of an unrealistic rule drives use further out of sight and damages trust, while the
      real need remains unmet.
    C: Removing the enterprise policy creates inconsistent rules across faculties and leaves the university
      with no common baseline.
    D: Network blocks are easily bypassed on personal devices and do not address why staff turn to these tools.
