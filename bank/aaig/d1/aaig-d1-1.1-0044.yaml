difficulty: hard
stem: The remuneration committee of a contact-centre outsourcing firm is setting executive bonuses. Management proposes paying the COO's bonus mainly on the number of customer contacts handled by AI. Satisfaction scores for AI contacts are high, yet quality audits regularly find AI responses that misled customers. What is the BEST recommendation for the governance leader to make to the committee?
options:
  A: Weight part of the bonus on satisfaction scores for AI contacts
  B: Apply malus to the bonus when audits find misleading AI responses
  C: Weight part of the bonus on audited accuracy of AI responses
  D: Defer part of the bonus for two years, reducible for audit findings
answer: C
explanation:
  why_correct: Incentives shape behaviour. A bonus paid mainly on volume rewards pushing contacts to AI even when customers are misled. Giving audited accuracy a weight in the formula means the COO earns the bonus only when AI handles contacts well, so the incentive points the right way from the start while still rewarding responsible adoption.
  why_not:
    A: Satisfaction with AI contacts is high while audits find misleading answers, so customers are content at the moment they are misled. Weighting the bonus on it would reward the same contacts the audits criticise.
    B: Malus is a valuable backstop, but it removes pay after findings, at the committee's discretion. The formula would still reward volume first, and the audits show misleading answers are a regular pattern, not a rare event.
    D: Deferral with reduction gives the committee time to act on audit findings, but the amount deferred is still earned on volume. It corrects after the fact instead of changing what the bonus rewards.
