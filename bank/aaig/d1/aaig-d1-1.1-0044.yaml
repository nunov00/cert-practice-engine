subdomain: '1.1'
difficulty: medium
stem: The remuneration committee of a contact-centre outsourcing firm is setting executive bonuses. Management
  proposes paying the COO's bonus mainly on the number of customer contacts handled by AI. Recent audits
  found AI responses that misled customers. What should the governance leader recommend to the committee?
options:
  A: Add a customer satisfaction measure alongside AI contact volume
  B: Add a malus clause so the committee can cut awards after misconduct
  C: Add quality and conduct measures that carry real weight in the bonus
  D: Defer part of the bonus for two years before it is paid
answer: C
explanation:
  why_correct: Incentives shape behaviour. A bonus paid mainly on volume rewards pushing contacts to AI
    even when customers are misled. Giving measures of outcome quality and conduct real weight in the
    formula means the COO earns the bonus only when AI handles contacts well, which aligns the incentive
    with the board's appetite while still rewarding responsible adoption.
  why_not:
    A: Satisfaction is a useful balance, but customers may be content at the moment they are misled. It
      would not capture the harm the audits found.
    B: A malus clause is a valuable backstop, but it is used only after misconduct is established and
      rarely for routine harm. Day to day, the formula would still reward volume regardless of how often
      customers are misled.
    D: Deferral is a sound remuneration tool, but without conduct measures nothing reduces the deferred
      amount. It delays a payment that is still based on volume.
