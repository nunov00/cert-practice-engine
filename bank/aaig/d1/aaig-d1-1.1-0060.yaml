stem: A non-executive director of a consumer bank receives management's quarterly report stating that all AI models
  are within risk appetite. The same week, the director reads press reports of customer complaints about one of
  the bank's AI lending decisions. What should the director do?
options:
  A: Rely on the report, since directors are entitled to trust what management tells them
  B: Ask management to explain the gap and to provide supporting evidence
  C: Commission an external investigation without telling management
  D: Contact the customers named in the press directly
answer: B
explanation:
  why_correct: 'Directors may generally rely on management reports in good faith, but not when they have reason
    to doubt them. A clear warning sign requires the director to inquire: ask management to reconcile the report
    with the complaints and to show evidence, and escalate through the board if the answers are not satisfactory.'
  why_not:
    A: Reliance on management is reasonable only without warning signs. Ignoring a visible conflict between the
      report and the facts would fall short of the director's duty of care.
    C: An external review may become necessary, but launching it secretly as a first step bypasses the board and
      management and damages trust before the facts are known.
    D: Directors oversee; they do not handle individual cases. Contacting customers directly could also create legal
      and conduct problems for the bank.
