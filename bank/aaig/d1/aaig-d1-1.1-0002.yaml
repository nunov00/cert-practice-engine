subdomain: '1.1'
difficulty: hard
stem: Two years ago the board of a logistics company approved an AI strategy focused on cutting costs.
  The company has since repositioned itself around premium customer service, but the AI strategy still
  names cost reduction as its main aim. New AI proposals are still scored against it, and several projects
  under way aim to cut contact-centre headcount. What should the governance leader recommend FIRST?
options:
  A: Ask each project sponsor to confirm fit with the new corporate direction
  B: Pause the contact-centre projects until their business cases are reviewed
  C: Add customer experience measures to each project's benefit tracking
  D: Refresh the AI strategy so that it reflects the new corporate direction
answer: D
explanation:
  why_correct: The AI strategy is the reference that proposals and projects are judged against, and it
    still points at cost cutting. Until it is refreshed, every new proposal is approved against the wrong
    aim. Once it reflects the new direction, the in-flight projects can be reassessed against criteria
    the board has endorsed.
  why_not:
    A: Sponsor confirmation looks at the current portfolio, but each sponsor judges their own project,
      and new proposals would still be scored against the outdated cost aim. The reference that drives
      every approval has to change first.
    B: Pausing the contact-centre projects may be prudent, but it covers only one area and does not say
      what the reviewed business cases should be judged against. The outdated strategy would still drive
      new approvals.
    C: Better measures show how projects affect customers, but they track results without changing the
      direction. Projects built to cut headcount would continue under a strategy that still rewards it.
