id: aaig-d1-1.1-0014
subdomain: '1.1'
difficulty: medium
stem: A multinational has a mature enterprise IT governance framework and a well-run enterprise risk management
  process. It now wants to govern AI across all its divisions. Which approach is MOST effective?
options:
  A: Set up an AI governance office that coordinates the divisions
  B: Adopt an AI management standard and certify each division to it
  C: Extend existing governance and risk processes to cover AI
  D: Have each division extend its own governance to cover its AI
answer: C
explanation:
  why_correct: Building on enterprise structures that already work avoids duplication and keeps AI risk
    visible in the same place as other enterprise risks. The existing processes still need AI-specific
    additions, such as bias, transparency and model change, so they are extended rather than copied or
    left alone.
  why_not:
    A: A coordinating office can support the work, but on its own it sits beside the mature framework
      rather than inside it. AI risk could drift away from the enterprise risk view the board relies on.
    B: A standard provides useful content, but certifying each division to it builds a second management
      system beside the one that already works. Its content is better used to extend existing processes.
    D: Extending governance is right, but doing it division by division gives inconsistent rules and no
      enterprise view. The company already has enterprise-wide frameworks to extend.
