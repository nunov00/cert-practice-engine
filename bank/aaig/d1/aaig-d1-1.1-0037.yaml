subdomain: '1.1'
difficulty: hard
stem: A health insurer's AI policy says that denials of prior authorisation recommended by AI need 'human
  involvement'. An internal review finds that nurses confirm the denials in batches of fifty with a single
  click, and none has overturned a denial in the past year. What should the governance lead recommend?
options:
  A: Track override rates and report them to the governance committee
  B: Hire more nurse reviewers so that each can spend longer per case
  C: Train the nurses on automation bias and their power to override
  D: Define in policy what effective human oversight must involve
answer: D
explanation:
  why_correct: A vague requirement for human involvement allows rubber-stamping that gives no real protection.
    Policy should state what oversight means in practice, such as which cases need individual review,
    the authority and information reviewers need, and how overrides are tracked. Training, staffing and
    monitoring then have a standard to meet.
  why_not:
    A: Override rates are a useful indicator, and the review already shows they are zero. Reporting the
      number again does not say what reviewers must do differently.
    B: More reviewers give more time per case, but the policy would still accept batch confirmation as
      human involvement. Extra time alone may not change the practice.
    C: Training helps nurses resist automation bias, but the policy still treats a one-click batch confirmation
      as compliant. Without a clear standard, the process can stay a formality.
