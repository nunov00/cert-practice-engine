subdomain: '1.1'
difficulty: hard
stem: A health insurer's AI policy says that denials of prior authorisation recommended by AI need 'human
  involvement'. An internal review finds that nurses confirm the denials in batches of fifty with a single
  click, and none has overturned a denial in the past year. What should the governance lead recommend?
options:
  A: Remove the human review, as it adds cost without adding value
  B: Hire more reviewers so that each can spend longer per case
  C: Accept the practice, as the policy's review requirement is met
  D: Define in policy what effective oversight must involve
answer: D
explanation:
  why_correct: A vague requirement allows rubber-stamping that gives no real protection. Policy should state
    what oversight means in practice, such as which cases need review, the authority and information reviewers
    need, and how overrides are tracked, so that oversight is effective and can be checked.
  why_not:
    A: Removing review because it is ineffective abandons a control the insurer decided it needed. The fix is
      to make it meaningful.
    B: More reviewers might add time, but without clear expectations, authority and information the review
      can remain a formality.
    C: The policy is met in form only. Confirming batches with one click and never overturning a denial suggests
      automation bias, not real oversight.
