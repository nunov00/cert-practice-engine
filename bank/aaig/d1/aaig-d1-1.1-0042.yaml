stem: A healthcare software group plans to acquire a start-up whose AI diagnostic product drives most
  of the deal value. Financial and legal due diligence are under way. The product's clinical validation
  studies are published and have been checked by the group's medical team. What should the governance
  leader MOST ensure is added to the due diligence before the price is agreed?
options:
  A: An assessment of the maturity of the start-up's AI governance
  B: Independent testing of the diagnostic model's accuracy
  C: A plan to bring the start-up's models under group governance
  D: A review of its training data rights and regulatory exposure
answer: D
explanation:
  why_correct: Before signing, the buyer needs to know whether the asset it is paying for is sound. If
    the start-up lacks the rights to the data its models learned from, or its product faces unmet regulatory
    duties, the value may be far lower or carry hidden liabilities. These findings can change the price,
    the warranties or the decision itself.
  why_not:
    A: Governance maturity matters for integration, but weak processes can be fixed after the deal. It
      rarely changes what the business is worth as much as missing data rights would.
    B: Accuracy testing is valuable, but the clinical validation is already published and checked by the
      group. Repeating it adds less than examining the legal basis of the product.
    C: Integration planning comes after the decision to buy. It does not reveal problems that should affect
      whether to buy and at what price.
