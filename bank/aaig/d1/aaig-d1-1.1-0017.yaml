id: aaig-d1-1.1-0017
subdomain: '1.1'
difficulty: hard
stem: A media group published AI ethics principles and trained staff on them. A year later, nobody can
  point to a decision they changed, and teams call them too abstract to apply. A review of reader complaints
  found the harms came from what AI was used for, such as profiling readers, not from how systems were
  built. What is the BEST way for the governance lead to give the principles effect?
options:
  A: Turn the principles into binding requirements in the AI policy
  B: Turn the principles into criteria for approving AI use cases
  C: Turn the principles into design standards for build teams
  D: Give each principle an executive owner who reports to the board
answer: B
explanation:
  why_correct: Principles change outcomes only when they become concrete tests at the point where the
    decision that causes harm is made. The complaints trace the harm to what AI was used for, which is
    settled when a use case is proposed and approved. Turning the principles into approval criteria makes
    each team show how its use case meets them before it goes ahead, which makes them concrete and puts
    them where the harm starts.
  why_not:
    A: Binding status raises the principles' weight, but they would stay as abstract as before and still
      not say where or how they apply. Teams already find them too abstract to use.
    C: Design standards make the principles concrete for build teams, which answers the abstraction complaint,
      but they act on how systems are built. The harm came from what AI was used for, and a well-built
      profiling tool still profiles readers.
    D: Executive owners create accountability and board visibility for each principle, but reporting on
      a principle does not change which uses are proposed and approved, where the harm arose.
