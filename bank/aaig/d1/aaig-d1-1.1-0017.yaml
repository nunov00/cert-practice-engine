subdomain: '1.1'
difficulty: medium
stem: A media group published AI ethics principles on fairness, transparency and accountability. A year later,
  nobody can point to a single decision the principles influenced. What should the governance lead do?
options:
  A: Republish the principles with a personal statement from the CEO
  B: Build the principles into intake criteria and approval checks
  C: Hire an ethicist to give talks on the principles to all staff
  D: Add more principles so the set covers every possible issue
answer: B
explanation:
  why_correct: Principles shape behaviour only when they are turned into concrete requirements at the points
    where decisions are made. Adding them to use-case intake questions and approval criteria makes teams show
    how each proposal meets them, which creates evidence and changes outcomes.
  why_not:
    A: Leadership support helps, but restating the principles does not create any mechanism for applying them
      to decisions.
    C: Talks can raise awareness, yet without process changes the principles remain aspirations that do not
      affect approvals.
    D: The problem is not the scope of the principles but that none are applied. More principles add words,
      not influence.
