id: aaig-d1-1.1-0027
subdomain: '1.1'
difficulty: medium
stem: The head of AI governance at a construction firm learns that staff in the finance team are using
  unapproved AI tools to summarise contracts. The firm has an approved enterprise AI tool, but finance
  staff have not been given access to it. What should be done FIRST?
options:
  A: Survey staff across the firm on the AI tools they use and why
  B: Review web logs to see which AI sites finance staff visit
  C: Ask finance staff which tools they use, why, and with what data
  D: Ask legal which of the summarised contracts hold confidential terms
answer: C
explanation:
  why_correct: Before deciding on a response, governance needs the facts on which tools, what need they
    meet, and what contract data has gone into them. Asking the finance staff directly gets all three
    quickly, which shapes both the immediate response to exposed data and the longer-term fix, such as
    access to the approved tool.
  why_not:
    A: A firm-wide survey may be useful later, but it is slow and broad. The known exposure is in finance,
      and contract data may already be leaving.
    B: Web logs show which sites were visited, but not why staff used them or what contract data they
      entered.
    D: Legal's view on confidentiality matters, but it depends on first knowing which contracts and tools
      were involved.
