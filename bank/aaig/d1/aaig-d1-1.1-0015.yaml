subdomain: '1.1'
difficulty: medium
stem: The general counsel of a hotel group reports that a risk-based AI law has been passed in one of
  the group's main markets and takes effect in 18 months. Most of the group's AI, in pricing and guest
  services, was built in-house. The executive committee asks the governance leader where to start. What
  should the governance leader do FIRST?
options:
  A: Map the regulation's obligations to the company's existing controls
  B: Map the AI tools bought from vendors against the regulation's scope
  C: Brief the board on the law's penalties and its timeline
  D: Map the company's AI uses against the regulation's obligations
answer: D
explanation:
  why_correct: Obligations under a risk-based law depend on what each AI use does. The first step is to
    know which of the company's uses fall in scope and what each would have to do. That view shows the
    size of the effort, the priorities and the owners, and it drives the rest of the compliance plan.
  why_not:
    A: A controls gap analysis is a later step. Until the company knows which uses are in scope and in
      which category, it cannot tell which obligations its controls need to meet.
    B: Vendor tools need checking, but most of the group's AI was built in-house. Starting with bought
      tools leaves the largest share of its exposure unassessed.
    C: The board should be told, but a briefing on penalties says nothing about the company's own exposure.
      It is more useful once the mapping shows what is affected.
