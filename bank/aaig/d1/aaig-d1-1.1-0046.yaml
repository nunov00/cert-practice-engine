id: aaig-d1-1.1-0046
subdomain: '1.1'
difficulty: medium
stem: An AI governance maturity assessment at a utility rates the company low on most dimensions, from
  policy and inventory to monitoring and skills. The utility uses far less AI than most peer utilities.
  The executive committee asks for a roadmap. Which approach is BEST?
options:
  A: Set target levels per dimension from peer utilities' benchmarks
  B: Start with the dimensions that are cheapest and quickest to improve
  C: Set a common target level and close the largest gaps first
  D: Set target levels per dimension from AI strategy and risk exposure
answer: D
explanation:
  why_correct: Maturity is a means, not an end. Target levels should reflect how much AI the company uses,
    how risky those uses are and where the strategy is heading. Gaps that matter most to the risk profile
    come first, and some dimensions may sensibly stay at a modest level.
  why_not:
    A: Benchmarks give useful context, but peers use far more AI. Their levels would set targets above
      what this utility's own use and risk call for.
    B: Quick wins can help momentum, but choosing on ease alone may leave the most serious exposures until
      last.
    C: Closing the largest gaps first sounds orderly, but a common target treats every dimension as equally
      important. The largest gap may not be the one that matters for the utility's actual AI use.
