subdomain: '1.1'
difficulty: medium
stem: A public benefits agency is writing policy on which AI-supported decisions require human review
  before they take effect. Which factor should MOST determine the level of human oversight?
options:
  A: The likelihood of error found in the agency's own pilot testing
  B: The impact of the decision on people and its reversibility
  C: The degree of autonomy the AI system has in each decision
  D: The sensitivity of the personal data the system processes
answer: B
explanation:
  why_correct: Oversight should be proportionate to potential harm. Decisions that significantly affect
    people, especially ones that are hard to reverse such as denying benefits, need stronger human involvement
    than low-impact, easily corrected ones.
  why_not:
    A: The agency's own error rate matters, but even a rare error can do serious harm in a high-impact
      case. Impact sets how much oversight is needed, and the error rate then informs how it is designed.
    C: Autonomy describes how much the system decides alone, which is what the policy is setting. It is
      the outcome of the oversight decision, not the factor that should drive it.
    D: Data sensitivity drives privacy and security controls. A decision can use ordinary data and still
      have a severe effect on someone's benefits.
