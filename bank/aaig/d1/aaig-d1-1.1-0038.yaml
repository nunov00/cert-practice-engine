difficulty: easy
stem: A public benefits agency is writing policy on which AI-supported decisions require human review before
  they take effect. Which factor should MOST determine the level of human oversight?
options:
  A: The accuracy rate the AI vendor reports for its product
  B: The impact of the decision on people and its reversibility
  C: The number of decisions the AI system makes each day
  D: Whether the AI was built in-house or bought from a vendor
answer: B
explanation:
  why_correct: Oversight should be proportionate to potential harm. Decisions that significantly affect people,
    especially ones that are hard to reverse such as denying benefits, need stronger human involvement than
    low-impact, easily corrected ones.
  why_not:
    A: Reported accuracy is a general figure and even an accurate system can cause serious harm in individual
      cases. Impact matters more.
    C: Volume affects how oversight is resourced, not how much is needed. High volume does not justify less
      protection for people.
    D: Who built the system does not change its effect on people. The same oversight principles apply to bought
      and built AI.
