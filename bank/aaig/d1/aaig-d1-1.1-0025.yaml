id: aaig-d1-1.1-0025
subdomain: '1.1'
difficulty: medium
stem: A logistics company's procurement policy was written before AI became common. Its HR software vendor
  has just added AI-based candidate screening to the product through a routine update. Which policy change
  would BEST address this kind of situation?
options:
  A: Ban all software vendors from adding AI features to products
  B: Require vendors to give notice of AI features so they are reviewed
  C: Rely on each vendor's own published ethics statement about its AI use
  D: Ask IT to scan vendor software for AI components once a year
answer: B
explanation:
  why_correct: Embedded AI often arrives silently through updates. A policy and contract terms that oblige
    vendors to notify the company when AI is added or changed, and that trigger the internal review process,
    bring that AI into governance before it affects decisions such as hiring.
  why_not:
    A: A blanket ban is unrealistic, as AI is being added across most software, and would cut the company off
      from useful features.
    C: A vendor's ethics statement is generic and self-declared. The company still owns how the tool affects
      its own candidates.
    D: An annual scan could find the feature many months after it began screening candidates, and code scanning
      may not reveal AI features at all.
