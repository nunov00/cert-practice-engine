id: aaig-d1-1.1-0025
subdomain: '1.1'
difficulty: medium
stem: A logistics company's procurement policy was written before AI became common. Its HR software vendor
  has just added AI-based candidate screening to the product through a routine update. Which policy change
  would BEST address this kind of situation?
options:
  A: Require an AI risk review whenever new software is bought
  B: Require vendors to give notice of AI features so they are reviewed
  C: Require vendors to certify that their AI meets recognised standards
  D: Have IT check release notes for key software for new AI features
answer: B
explanation:
  why_correct: Embedded AI often arrives silently through updates to software already in use. A policy
    and contract terms that oblige vendors to notify the company when AI is added or changed, and that
    trigger internal review, bring that AI into governance before it affects decisions such as hiring.
  why_not:
    A: A review at purchase is good practice, but this feature arrived later through a routine update.
      A purchase check would not have caught it.
    C: A certificate says something about the vendor's product in general. It does not tell the company
      when AI is added, or whether its own use for screening candidates is acceptable.
    D: Checking release notes is a useful detective step, but it depends on notes that may not mention
      AI and covers only software someone thinks is key.
