subdomain: '1.1'
difficulty: medium
stem: A pharmaceutical company's executive committee set up an AI governance committee last year, chaired
  by the chief operating officer. The committee has published review criteria, and units register each
  new AI tool with it. Units now launch tools after only informing the committee, and two launches went
  ahead last quarter despite its written objections. What is the MOST likely root cause?
options:
  A: The committee has no agreed criteria for judging AI tools
  B: The committee's charter grants it no decision rights
  C: Senior executives have not visibly sponsored the committee
  D: The AI policy has no process for registering new AI tools
answer: B
explanation:
  why_correct: A governance body whose objections can be ignored is advisory in practice. The committee
    has criteria, a senior chair and a register, yet launches go ahead over its objections. That points
    to its mandate. Without decision rights written into its charter, units have no obligation to wait
    for approval or act on its view.
  why_not:
    A: Missing criteria would weaken reviews, but the committee has published them. The problem is that
      its view does not bind anyone.
    C: Weak sponsorship can undermine a committee, but this one was set up by the executive committee
      and is chaired by the COO. Sponsorship is visible. What the committee lacks is a mandate that makes
      its objections binding.
    D: Units already register each new tool, so the committee knows what is launching. Knowing is not
      the same as being able to stop or condition a launch.
