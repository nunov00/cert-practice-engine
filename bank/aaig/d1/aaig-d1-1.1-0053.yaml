id: aaig-d1-1.1-0053
subdomain: '1.1'
difficulty: hard
stem: A wealth manager is launching an AI portfolio tool for independent financial advisers. Sales has
  agreed contract terms with early clients that accept unlimited liability for losses from the tool's
  recommendations, to win deals. The board's risk appetite sets limits on financial exposure from any
  single product. What should the governance leader recommend?
options:
  A: Have legal renegotiate the current contracts to cap liability
  B: Require CRO approval for each contract above a set liability cap
  C: Buy professional indemnity cover for losses from the tool's advice
  D: Set an approved AI product liability position within appetite
answer: D
explanation:
  why_correct: How much liability the firm accepts for AI-driven outcomes is a risk appetite decision,
    not a sales tactic. An approved position, with authority levels for any departure, keeps contractual
    exposure within the limits the board set and makes the allocation of risk between the firm and its
    clients deliberate.
  why_not:
    A: Renegotiating may be needed for the existing clients, but it fixes only these contracts. Sales
      would have no set position for the next ones.
    B: Escalation to the CRO adds a senior check, but without an approved position each case is judged
      alone. Nobody would be setting the cap or tracking total exposure against the board's appetite.
    C: Insurance may cover part of the exposure, but cover for AI losses is often limited and does not
      replace a deliberate decision on how much risk to accept.
