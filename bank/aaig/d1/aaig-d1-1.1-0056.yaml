difficulty: medium
stem: On a Saturday night, an online retailer's AI pricing system starts selling some products far below
  cost. The on-call engineer knows how to switch it off, but spends three hours trying to reach the commercial
  director, who owns the system, before acting. What governance gap does this MOST reveal?
options:
  A: The pricing system had no automatic floor on below-cost prices
  B: The on-call engineer had no runbook for the pricing system
  C: The incident process did not cover AI pricing systems
  D: No one held advance authority to suspend critical AI systems
answer: D
explanation:
  why_correct: When an AI system causes harm in real time, the decision to suspend it must be quick. That
    needs authority set in advance on who may stop which systems, under what conditions, without waiting
    for senior approval. Without it, people capable of acting hesitate while losses grow.
  why_not:
    A: A price floor is a sensible preventive control, but faults of other kinds will still happen. The
      gap the night revealed is the inability to act once one does.
    B: The engineer already knows how to switch the system off. A runbook describes the steps, but the
      engineer was not missing steps. They waited for someone to allow them to act.
    C: An incident process coordinates a response, but the engineer was not short of a process. They waited
      for permission. What was missing was authority, set in advance, to suspend a critical system without
      reaching its owner.
