stem: On a Saturday night, an online retailer's AI pricing system starts selling some products far below cost. The
  on-call engineer can switch it off, but nobody is sure who has the authority to stop a revenue-critical system,
  and the commercial director cannot be reached. What governance gap does this MOST reveal?
options:
  A: The pricing system was not tested enough before it went live
  B: The on-call engineer lacked training on the pricing system
  C: The vendor's support contract does not cover weekends
  D: No one was given advance authority to suspend critical AI systems
answer: D
explanation:
  why_correct: 'When an AI system causes harm in real time, the decision to suspend it must be quick. That needs
    authority set in advance: who may stop which systems, under what conditions, without waiting for senior approval.
    Without it, people capable of acting hesitate while losses grow.'
  why_not:
    A: Better testing might have prevented the fault, but faults will still happen. The gap here is the inability
      to act when one does.
    B: The engineer already knows how to switch the system off. The problem is uncertainty about whether they are
      allowed to.
    C: Vendor support may help with diagnosis, but deciding to stop the company's own pricing is the company's decision
      and needs clear authority.
