difficulty: hard
stem: At an all-staff event, the chief executive of a fast-growing online lender says teams should 'ship
  AI features first and fix governance later' to beat competitors. The board-approved AI policy requires
  risk review before customer-facing launches. Two teams have since skipped the review, and the risk team
  has already begun retrospective reviews of both launches. What should the governance leader do FIRST?
options:
  A: Add a release gate that blocks customer-facing launches without review
  B: Raise the conflict with the CEO and ask for a public restatement
  C: Report the CEO's statement to the chair of the board risk committee
  D: Remind product teams in writing that the review still applies
answer: B
explanation:
  why_correct: Staff take their cue from what senior leaders say. The teams acted on a message from the
    top, so the root cause is the conflicting tone, and the two launches are already being reviewed. Raising
    it directly with the CEO, and asking the CEO to restate visibly that the board's policy applies, corrects
    the signal quickly. If the CEO refuses, the matter goes to the board.
  why_not:
    A: A release gate is a strong preventive control, but it takes time to build, and teams acting on
      the CEO's message would look for ways round it. The conflicting signal from the top would remain
      the cause.
    C: Escalation to the board is right if the CEO will not act, but going over the CEO first skips the
      quickest fix and may harm the working relationship the governance leader needs.
    D: A reminder from the governance function is weaker than the CEO's public message. Teams are likely
      to follow the chief executive over a written reminder.
