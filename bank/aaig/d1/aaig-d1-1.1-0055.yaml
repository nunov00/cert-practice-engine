id: aaig-d1-1.1-0055
subdomain: '1.1'
difficulty: medium
stem: The audit committee of a telecom group asks how it can tell whether the AI governance framework
  is actually working. Management reports the number of policies issued and the number of training courses
  held. Which measure would BEST add to the picture?
options:
  A: The share of AI proposals changed or rejected at review
  B: The number of AI incidents reported by customers each quarter
  C: Issues caught before launch against those found after launch
  D: The average time taken to approve each new AI use case request
answer: C
explanation:
  why_correct: Effective governance should catch problems before AI reaches customers. Comparing issues
    found in review with those found later in production shows whether the framework is preventing harm,
    which counts of activity cannot show.
  why_not:
    A: Changed or rejected proposals show the review is active, but not whether it catches the problems
      that matter. A high rate could reflect strict paperwork rather than harm prevented.
    B: Customer-reported incidents show harm after launch, which is useful, but on their own they cannot
      show whether the framework caught other problems earlier. The comparison is what shows effect.
    D: Approval time measures efficiency, which matters to the business, but a fast process can still
      let problems through.
