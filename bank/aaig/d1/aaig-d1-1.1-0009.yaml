id: aaig-d1-1.1-0009
subdomain: '1.1'
difficulty: easy
stem: A professional services firm already has an AI governance policy that covers the governance committee,
  risk tiers and the approval process. It is now writing a short acceptable use policy for all staff.
  Which content BEST belongs in this policy?
options:
  A: The current list of approved AI tools and their licence terms
  B: The criteria for classifying AI use cases into risk tiers
  C: The roles and decision rights of the AI governance committee
  D: What staff may and may not do with AI, and with which data
answer: D
explanation:
  why_correct: An acceptable use policy sets expectations for behaviour, such as permitted and prohibited
    uses, what data may be entered into AI tools, and the user's responsibilities. That is what staff
    need to act correctly, and what the firm needs to enforce. The governance matters are already covered
    elsewhere.
  why_not:
    A: Staff need to know where to find approved tools, but the list changes often. It belongs in a register
      the policy points to, not in the policy text, and licence terms are not a rule of behaviour.
    B: Risk tier criteria guide the people who assess use cases. They already sit in the governance policy
      and do not tell staff how to behave.
    C: Committee roles and decision rights are governance structure, already set out in the governance
      policy. Repeating them does not tell staff what they may do.
