stem: A government agency funds its AI governance office by charging each AI project a share of its budget. When
  projects are cut, the office loses reviewers, and sponsors have started hinting that a quick approval would keep
  the funding flowing. What should the governance leader recommend?
options:
  A: Raise the share charged to each project so the office can hire more reviewers
  B: Fund the office from a central baseline budget sized to the AI portfolio
  C: Let sponsors choose which reviewers they pay for from a shared pool
  D: Reduce reviews to a self-assessment that projects can fund themselves
answer: B
explanation:
  why_correct: Oversight that depends on payments from those it oversees is neither stable nor independent. A central
    baseline budget, sized to the volume and risk of the AI portfolio, keeps the office's capacity steady and removes
    the link between approvals and funding.
  why_not:
    A: 'A higher charge keeps the same dependency and makes it stronger: the office would rely even more on sponsors
      whose projects it must judge.'
    C: Letting sponsors pick and pay reviewers invites them to choose lenient ones. It deepens the conflict instead
      of removing it.
    D: Self-assessment removes independent challenge altogether. It cuts cost by giving up the very oversight the
      office exists to provide.
