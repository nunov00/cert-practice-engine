id: aaig-d1-1.1-0047
subdomain: '1.1'
difficulty: hard
stem: A government agency funds its AI governance office by charging each AI project a share of its budget.
  Its reporting line runs to the audit committee. When projects are cut, the office loses reviewers,
  and sponsors have started hinting that a quick approval would keep the funding flowing. What is the BEST recommendation for the governance leader?
options:
  A: Charge each project a fixed review fee, whatever its budget
  B: Fund the office from a central budget sized to the AI portfolio
  C: Rotate reviewers so that none reviews the same sponsor's projects twice
  D: Require approval decisions to be recorded and audited each year
answer: B
explanation:
  why_correct: Oversight that depends on payments from those it oversees is neither stable nor independent.
    The reporting line is independent; the remaining link is money. A central baseline budget,
    sized to the volume and risk of the AI portfolio, keeps the office's capacity steady and removes the
    link between approvals and funding.
  why_not:
    A: A flat fee is fairer than a budget share, but the office would still be paid by the projects it
      reviews. Its capacity would still fall when projects are cut.
    C: Rotation reduces the chance that a reviewer is captured by one sponsor, but every reviewer would
      still be paid from project budgets. Capacity would still fall when projects are cut, and sponsors
      could still hint that approvals keep the money flowing.
    D: Recording and auditing decisions can detect lenient approvals, but only after the fact. The pressure
      built into the funding model stays in place.
