stem: An insurer wants to use AI to settle simple claims with no human involvement, which is new in its market.
  The rules do not clearly say whether this is allowed, and the regulator has an innovation office that discusses
  new approaches with firms. What should the governance leader recommend?
options:
  A: Launch quietly and respond if the regulator raises concerns
  B: Drop the idea until the regulator issues specific rules
  C: Ask a competitor whether it plans to do the same
  D: Engage the regulator's innovation office before launch
answer: D
explanation:
  why_correct: When the rules are unclear and the use is new, early, open dialogue with the regulator lowers the
    risk of a forced reversal later and shows good faith. The firm gains insight into the regulator's expectations
    and can design controls to match before customers are affected.
  why_not:
    A: Launching quietly in an unclear area risks enforcement, remediation costs and damaged trust if the regulator
      later objects.
    B: Waiting for specific rules may mean waiting indefinitely and losing a legitimate opportunity that the regulator
      might well support.
    C: Discussing plans with a competitor can raise competition law concerns and says nothing about what the regulator
      expects.
