subdomain: '1.1'
difficulty: hard
stem: An insurer wants to use AI to settle simple claims with no human involvement. No other insurer in
  its market does this, and the rules do not clearly say whether it is allowed. External counsel's view
  is that it is probably permitted. What is the BEST recommendation for the governance leader to make before launch?
options:
  A: Obtain a second opinion from a specialist regulatory law firm
  B: Launch as a pilot with human review of a sample of settlements
  C: Ask the industry association to seek guidance for its members
  D: Discuss the design and its controls with the regulator
answer: D
explanation:
  why_correct: The rules are unclear and no other insurer has tried this, so only the regulator can say
    how it reads them. Early, open dialogue about the design and its controls lowers the risk of a forced
    reversal later and shows good faith. The firm learns what the regulator expects and can adjust its
    controls before customers are affected.
  why_not:
    A: A second opinion is sensible on a hard legal point, but where the rules themselves are unclear
      another firm can only offer its own 'probably'. It does not tell the insurer how the regulator will
      read them.
    B: A sampled pilot limits harm, but it still launches without knowing the regulator's view. If the
      regulator objects, customers and the firm still bear the reversal.
    C: An industry request suits questions many members share, but no other insurer in the market does
      this. The association has little reason to act, and its guidance would be slow and general.
