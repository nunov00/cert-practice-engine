id: aaig-d3-3.1-0011
subdomain: '3.1'
difficulty: medium
stem: Six months after a utility launched an AI system to forecast customer demand, the steering committee
  plans a post-implementation review. The executive team must use it to decide whether to fund a second
  phase. Which focus would make the review MOST useful to the executives?
options:
  A: Whether realised outcomes match what the approved case promised
  B: Whether controls are operating as the risk assessment assumed
  C: Whether the system still fits the current enterprise AI strategy
  D: Whether the project kept to its approved scope, time and budget
answer: A
explanation:
  why_correct: A funding decision for a second phase turns on whether the first phase is delivering what
    executives approved. Comparing realised outcomes with the approved case gives them that evidence,
    and shows whether the assumptions behind a second phase still hold.
  why_not:
    B: Control performance matters and belongs in the review, but working controls do not show that the
      system is worth extending. The funding decision needs the value evidence first.
    C: Strategic fit was tested when the case was approved. It is worth confirming, but it does not show
      whether the system is delivering.
    D: Delivery to scope, time and budget is a project closure question. It says little about whether
      the system is creating value in operation.
