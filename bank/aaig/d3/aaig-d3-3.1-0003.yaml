difficulty: easy
stem: A logistics company approved an AI route-planning system on the basis of a business case promising a
  12% fuel saving. After go-live, nobody is measuring fuel use against that figure. Who should be accountable
  for confirming that the promised benefits are realised?
options:
  A: The data science team that designed and built the model
  B: The internal audit function, in its yearly plan
  C: The business owner who sponsored the business case
  D: The IT operations team running the system
answer: C
explanation:
  why_correct: Benefits realisation belongs to the business owner who argued for the investment. They control
    the process changes needed to capture the saving and are answerable to executives for the return. Without
    a named benefit owner, value tracking tends to stop at go-live, as it has here.
  why_not:
    A: The builders can report model performance, but fuel savings depend on how depots and drivers use the
      routes. They do not own the business outcome.
    B: Internal audit can later test whether benefits were tracked, but it provides independent assurance;
      it does not own or deliver the benefit.
    D: Operations keeps the system available and performing. Availability is necessary but is not the same
      as proving the business saving.
