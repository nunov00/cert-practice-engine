difficulty: medium
stem: A logistics company approved an AI route-planning system on a business case promising a 12% fuel
  saving. The chief financial officer approved the investment, the chief digital officer's team built
  it, and the operations director sponsored the case. A year after go-live, nobody is measuring fuel use
  against the promised figure. Who should be accountable for confirming that the benefit is realised?
options:
  A: The chief financial officer, who approved the investment
  B: The chief digital officer, whose team delivered the system
  C: The operations director, who sponsored the business case
  D: The portfolio office, which tracks the AI investments
answer: C
explanation:
  why_correct: Benefits realisation belongs to the business sponsor who argued for the investment. The
    operations director controls how depots and drivers use the routes, which is where the fuel saving
    is made, and answers to executives for the return. Others approve, build or report, but the sponsor
    owns the outcome.
  why_not:
    A: The CFO approves investments and may challenge reported returns, but does not run the operations
      that produce the saving. Approving the spend is not owning the benefit.
    B: The delivery team's accountability is for building a working system. Whether depots use it to save
      fuel is outside its control.
    D: The portfolio office can collect and report benefit data, but it does not run the depots and cannot
      be answerable for whether the saving is achieved.
