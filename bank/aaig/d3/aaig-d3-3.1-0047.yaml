stem: A building society validates its mortgage affordability model every three years; the last validation was 18
  months ago. Since then the model has been extended to buy-to-let mortgages, and a new source of income data has
  been added. The next validation is due in 18 months. What should the governance leader recommend?
options:
  A: Define material changes, such as new products or data sources, that trigger revalidation early
  B: Shorten the validation cycle for all of the society's models from three years to one year
  C: Keep to the scheduled date, since a validation within its cycle remains in force until it expires
  D: Ask the model owner to confirm in writing that the changes have not affected performance
answer: A
explanation:
  why_correct: A validation covers the model as it was used when it was validated. A new product and a new data
    source change both the population and the inputs, so the earlier conclusion may no longer hold. Calendar cycles
    should be backed by event triggers that bring validation forward when material changes happen. That keeps assurance
    current for the models that change, without raising cost for those that do not.
  why_not:
    B: A shorter cycle for every model raises cost across the board and could still miss a change made the week
      after a validation. The trigger, not the frequency, is the gap.
    C: The earlier validation did not cover buy-to-let lending or the new data. Treating it as still valid gives
      false assurance.
    D: The owner is not independent of the model, and a written statement is not a test. Material changes need independent
      review.
