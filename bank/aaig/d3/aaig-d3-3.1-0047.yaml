subdomain: '3.1'
difficulty: hard
stem: A building society validates its mortgage affordability model every three years, the cycle its
  tiering scheme sets for this model. The last validation was 18 months ago. Since then the model has
  been extended to buy-to-let mortgages and given a new source of income data, and more product
  extensions are planned for next year. What is the BEST recommendation for the governance leader?
options:
  A: Define material changes that trigger early revalidation
  B: Move this model to a shorter cycle within the tiering scheme
  C: Commission a one-off validation of the two recent changes now
  D: Increase monitoring of the model until the scheduled validation
answer: A
explanation:
  why_correct: A validation covers the model as it was when validated. A new product and a new data
    source change the population and the inputs, and more extensions are coming. Event triggers for
    material changes bring validation forward for these changes and for each later one, whatever the
    calendar says.
  why_not:
    B: A shorter cycle still runs on the calendar. It brings the next validation closer but could still
      miss a change made just after one.
    C: A one-off validation would cover the two recent changes, but the planned extensions would again
      go live under the three-year cycle, with no rule to bring validation forward.
    D: Monitoring shows trends but is not an independent check that the model is sound for a product it
      was never validated for.
