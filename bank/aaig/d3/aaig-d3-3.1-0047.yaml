stem: A building society validates its mortgage affordability model every three years, the cycle its tiering
  scheme sets for this model. The last validation was 18 months ago. Since then the model has been extended
  to buy-to-let mortgages, and a new source of income data has been added. What should the governance
  leader recommend?
options:
  A: Define material changes that trigger revalidation ahead of the cycle
  B: Move this model to a shorter cycle within the tiering scheme
  C: Require the owner to attest to performance after each change
  D: Increase monitoring of the model until the scheduled validation
answer: A
explanation:
  why_correct: A validation covers the model as it was when validated. A new product and a new data source
    change the population and the inputs, so the earlier conclusion may no longer hold. Event triggers
    for material changes bring validation forward now and for future changes, whatever the calendar says.
  why_not:
    B: A shorter cycle still runs on the calendar. It brings the next validation closer but could still
      miss a change made just after one.
    C: The owner is not independent of the model, and an attestation is not a test.
    D: Monitoring shows trends but is not an independent check that the model is sound for a product it
      was never validated for.
