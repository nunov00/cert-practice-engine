difficulty: medium
stem: An airline's customer chatbot gave hundreds of passengers wrong information about refund rights over
  a weekend. The AI team fixed the prompt on Monday and closed the matter internally. Legal and communications
  learned of it from a news story. What is the main governance weakness?
options:
  A: The chatbot was deployed without enough testing before its launch
  B: AI incidents had no route into enterprise incident handling
  C: The AI team lacked authority to change the chatbot quickly
  D: The vendor's model was not able to explain its answers
answer: B
explanation:
  why_correct: The technical fix was fast, but the incident had legal, customer and reputational consequences
    that the AI team was not equipped to judge. AI incidents need defined criteria for escalation into the
    enterprise incident and crisis processes so that legal, communications and affected customers are dealt
    with properly.
  why_not:
    A: Better testing might have prevented this error, but some incidents will always happen. The failure here
      is in how the incident was handled once it occurred.
    C: The team did change the chatbot quickly. Speed of the fix was not the problem; the missing escalation
      was.
    D: Explainability would not have alerted legal or communications. The gap is organisational, not a property
      of the model.
