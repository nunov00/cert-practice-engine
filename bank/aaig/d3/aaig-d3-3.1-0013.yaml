stem: An airline's customer chatbot gave hundreds of passengers wrong information about refund rights
  over a weekend. The AI team's monitoring flagged the errors on Saturday. The team fixed the prompt on
  Monday and closed the matter internally. Legal and communications learned of it from a news story. What
  is the MAIN governance weakness?
options:
  A: Pre-launch testing did not cover questions on refund rights
  B: AI incidents had no criteria for escalation beyond the AI team
  C: The team took two days to fix the prompt after the alert
  D: The chatbot was allowed to answer questions on legal rights
answer: B
explanation:
  why_correct: Monitoring worked and the fix was made, but the incident had legal, customer and reputational
    consequences the AI team was not placed to judge. Without criteria that send AI incidents into enterprise
    incident handling, legal, communications and affected passengers were left out. That is why the news
    story came first.
  why_not:
    A: Better testing might have prevented this error, but some incidents will always happen. The failure
      shown here is in how the incident was handled once detected.
    C: A faster fix would have reduced the number of wrong answers. Even an instant fix would still have
      left legal and communications unaware and misinformed passengers uncorrected.
    D: Limiting the chatbot's scope is a valid design choice that reduces exposure. It does not address
      the weakness this event exposed, which is how incidents are escalated.
