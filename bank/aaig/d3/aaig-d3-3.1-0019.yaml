id: aaig-d3-3.1-0019
subdomain: '3.1'
difficulty: easy
stem: A retail bank is replacing the AI model that has set customers' credit card limits for five years.
  An interface review confirms that no other system uses its scores. To cut hosting costs, the project
  manager plans to delete the model files and decision logs on the day the new model goes live. Customers
  can complain about past limit decisions for several years. What should the governance leader require
  FIRST?
options:
  A: A parallel run of the old and new models before shutdown
  B: Retention of the model files and decision logs for complaints
  C: Approval of the shutdown date by the model risk committee
  D: A final accuracy test recorded for the outgoing model
answer: B
explanation:
  why_correct: Deletion cannot be undone, and the bank may need to explain past limit decisions for years.
    Keeping the model and its decision logs for that period preserves the evidence. Dependencies are already
    confirmed, so retention is the gap to close before anything is deleted.
  why_not:
    A: A parallel run tests the new model, which is useful, but does nothing to stop the loss of evidence
      on past decisions.
    C: Committee approval of a date does not settle what must be kept. The committee could approve the
      same deletion.
    D: A final test records the model's last performance. It cannot explain individual past limit decisions,
      which need the logs.
