difficulty: hard
stem: A retail bank is replacing the AI model that has set customers' credit card limits for five years. To
  cut hosting costs, the project manager plans to shut down its servers and delete the model files and decision
  logs on the day the new model goes live. Customers can complain about past limit decisions for several years.
  What should the governance leader require FIRST?
options:
  A: A check that no other system still consumes the model's scores
  B: A plan covering dependencies, record retention and complaint evidence
  C: Approval from the original vendor before any data is deleted
  D: A final accuracy test so the model's last performance is recorded
answer: B
explanation:
  why_correct: Decommissioning is a governed process, not just a shutdown. The bank must confirm downstream
    dependencies, keep records it is required to retain, and preserve evidence of how past decisions were
    made, because customers may still challenge them. Deleting logs could leave the bank unable to explain
    earlier decisions.
  why_not:
    A: Checking dependencies is part of the job, but it misses the retention and evidence obligations that
      deleting logs would breach.
    C: The vendor is not the authority on the bank's retention duties. The bank decides, under its own
      obligations.
    D: A final test may be useful for the record but does nothing to protect evidence of past decisions or
      manage dependencies.
