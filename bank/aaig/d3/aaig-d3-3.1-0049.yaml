subdomain: '3.1'
difficulty: medium
stem: An insurer is preparing its first public report on responsible AI, including performance figures
  for its main AI systems. The marketing draft uses accuracy figures from vendor test results and picks
  the most favourable measure for each system. Internal monitoring uses different definitions. What should
  the governance leader require?
options:
  A: Adopt an industry metric set for the published figures
  B: Use the vendor figures, with their definitions stated
  C: Have internal audit check the figures before publication
  D: Use internal monitoring figures, approved like other disclosures
answer: D
explanation:
  why_correct: Public statements about AI performance should match what the insurer actually measures
    and governs. Monitoring data with consistent definitions makes the figures reconcilable and defensible,
    and the usual disclosure approval guards against selective or misleading reporting.
  why_not:
    A: Industry metrics aid comparison, but internal monitoring does not use them, so the published figures
      could not be reconciled with what the insurer actually governs.
    B: Stating definitions does not fix the problem. Vendor tests describe the product under the vendor's
      conditions, not its performance in the insurer's use.
    C: Audit can check that the figures are accurate, but it would be checking selective vendor figures.
      The source and measures need fixing first.
