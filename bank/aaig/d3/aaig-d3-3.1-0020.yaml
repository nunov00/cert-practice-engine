difficulty: medium
stem: A professional services firm gave all staff access to a generative AI assistant billed per use. Monthly
  charges have tripled in a quarter, and finance cannot tell which teams or uses are driving the growth. What
  should be the governance leader's priority?
options:
  A: Cap every employee's monthly use at a fixed amount
  B: Track consumption by team and use case against value
  C: Withdraw access until next year's budget is approved
  D: Negotiate a flat-fee licence with the provider instead
answer: B
explanation:
  why_correct: The firm cannot judge whether the spend is waste or valuable growth without visibility. Attributing
    consumption to teams and uses, and comparing it with the value they report, allows informed decisions about
    budgets, limits and which uses to encourage.
  why_not:
    A: 'A uniform cap is blunt: it may starve high-value work while barely affecting low-value use.'
    C: Withdrawing access throws away whatever value is being created and may push staff to unsanctioned tools.
    D: A flat fee might stabilise cost, but it still leaves the firm blind to which uses create value and may
      cost more than current consumption.
