subdomain: '3.1'
difficulty: medium
stem: A professional services firm gave all staff access to a generative AI assistant billed per use.
  Monthly charges have tripled in a quarter. A new dashboard now shows spend by team and use case, led
  by proposal drafting and research. Partners want to keep the uses that help win client work. What should
  be the governance leader's priority?
options:
  A: Negotiate lower per-use rates with the AI provider
  B: Have each team show the value of its main uses against cost
  C: Set a firm-wide AI spending limit approved by executives
  D: Require each new use case to be registered and approved
answer: B
explanation:
  why_correct: Spend is now visible by team and use, but the firm still cannot tell which uses are worth
    their cost. Partners want to protect the uses that win work, so the next step is to set value against
    cost for the main uses. Rate, budget and limit decisions can then rest on evidence.
  why_not:
    A: Lower rates cut the bill, which matters after charges tripled, but they leave the firm unable to
      tell which uses are worth their cost. Low-value use keeps growing at a lower price, and the partners
      still cannot see which uses help win work.
    C: A firm-wide limit controls the total, but set without knowing which uses create value, it may cut
      the uses partners want to keep.
    D: Registration governs new uses, but the growth comes from existing uses, led by drafting and research,
      whose value is not yet known.
