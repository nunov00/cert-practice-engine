subdomain: '3.1'
difficulty: medium
stem: A national tax agency's AI assistant answers citizens' questions online. In the last week before
  last year's filing deadline, the AI provider's usage limits throttled the service, citizens received
  errors and phone lines were overwhelmed. The agency already has a tested call-back queue for overload.
  What should the governance leader make sure is in place for this year?
options:
  A: Service credits from the provider if throttling happens again
  B: A tested overload plan with a call-back queue for citizens
  C: A demand forecast shared with the provider before the peak
  D: Peak quotas agreed with the provider, based on the filing calendar
answer: D
explanation:
  why_correct: Demand for this service is predictable, peaking at the filing deadline. The failure was
    quota, so capacity must be planned against that calendar with peak quotas agreed in advance. This
    treats the AI as a business service with known demand rather than a tool expected to cope alone.
  why_not:
    A: Service credits compensate the agency afterwards. They do not keep the assistant running for citizens
      in the busiest week.
    B: The overload plan is already in place and tested. It absorbs overflow but does not stop the provider's
      limits throttling the assistant at the peak.
    C: A forecast informs the provider but commits it to nothing. Usage limits can still throttle the
      service unless peak quotas are agreed.
