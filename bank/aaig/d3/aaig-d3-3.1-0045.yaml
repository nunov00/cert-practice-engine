subdomain: '3.1'
difficulty: hard
stem: A national tax agency's AI assistant answers citizens' questions online. In the final week before last year's filing deadline, the provider's usage limits throttled the service and phone lines were overwhelmed. The provider had spare capacity, but its standard contract caps each customer's usage. What is MOST important for the governance leader to have in place for this year?
options:
  A: Real-time alerts to the agency as usage nears the provider's limits
  B: A tested fallback provider the assistant switches to when throttled
  C: A demand forecast shared with the provider before the peak
  D: Peak quotas agreed with the provider, based on the filing calendar
answer: D
explanation:
  why_correct: Demand for this service is predictable, peaking at the filing deadline, and the throttling came from a contractual cap, not a lack of capacity. Peak quotas agreed in advance against the filing calendar lift the cap where it matters and commit the provider's spare capacity to the agency.
  why_not:
    A: Alerts tell the agency the limit is near, but they add no capacity. Citizens would still be throttled in the busiest week.
    B: A fallback provider adds resilience, but it means assuring and paying for a second service to work around a cap the current provider could lift. The contract limit that caused the throttling would remain.
    C: A forecast tells the provider what is coming, but the cap sits in the standard contract. Without an agreed quota the service would still be throttled at the limit.
