id: aaig-d3-3.1-0043
subdomain: '3.1'
difficulty: medium
stem: A bank's central machine learning platform team hosts models for several business units. The bank's
  service catalogue already rates fraud scoring as critical. The card fraud unit's models went offline
  twice over a weekend, and no one responded until Monday because the platform team supports office hours
  only. What should the governance leader recommend?
options:
  A: Agree service levels with each unit based on its services' criticality
  B: Classify each hosted model by its business criticality
  C: Set one platform-wide support standard for hosted models
  D: Agree weekend on-call cover with the fraud unit for its models
answer: A
explanation:
  why_correct: An internal platform is a service provider to the business. Like an external vendor, it
    needs explicit service levels. Agreeing support hours, response times and escalation with each unit,
    scaled to how critical its services are, sets clear expectations and lets capacity and cost be planned.
  why_not:
    B: Classifying criticality is a sound first step, but fraud scoring is already rated critical. The
      gap is that no support levels follow from that rating.
    C: One standard is consistent, but it either over-serves a low-criticality tool or under-serves fraud
      detection. Support should be scaled to each unit's need.
    D: On-call cover fixes the fraud unit's case, but other units still have no agreed levels. It also
      gives no basis for sizing support across the platform.
