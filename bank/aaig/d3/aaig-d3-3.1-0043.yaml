id: aaig-d3-3.1-0043
subdomain: '3.1'
difficulty: hard
stem: A bank's central machine learning platform team hosts models for several business units and supports office hours only. Some hosted models, such as card fraud scoring, run around the clock, while others are used only in branch hours. The fraud models went offline twice over a weekend, and no one responded until Monday. What is the BEST recommendation for the governance leader?
options:
  A: Agree service levels with each unit, scaled to its criticality
  B: Classify each hosted model by the criticality of its business use
  C: Set one platform-wide support standard for the hosted models
  D: Agree weekend on-call cover with the fraud unit for its models
answer: A
explanation:
  why_correct: An internal platform is a service provider to the business. Like an external vendor, it needs explicit service levels. The units' needs differ, from round-the-clock fraud scoring to branch-hours tools, so agreeing support hours, response times and escalation with each unit, scaled to how critical its services are, closes the gap and lets capacity and cost be planned.
  why_not:
    B: Classifying criticality is a sound step and would feed the service levels. On its own it changes no one's support hours, so a weekend outage would still wait until Monday.
    C: One standard is consistent, but needs here range from round-the-clock to branch hours. It either over-serves the branch-hours models or under-serves the round-the-clock ones.
    D: On-call cover fixes the fraud unit's case, but other hosted models also run around the clock with no agreed support. It treats one incident rather than the platform's gap.
