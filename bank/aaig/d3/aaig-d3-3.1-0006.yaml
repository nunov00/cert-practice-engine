id: aaig-d3-3.1-0006
subdomain: '3.1'
difficulty: hard
stem: A telecom provider's churn model has lost accuracy slowly and steadily for five months. Its
  monthly accuracy threshold is set wide because monthly results are noisy, and each result has stayed
  inside it. Input drift checks also run and show no shift. Marketing has noticed retention offers going
  to the wrong customers. Which change to monitoring is BEST for the governance leader to recommend?
options:
  A: Add a trend trigger that flags sustained decline across months
  B: Add a check for input drift on the model's main features
  C: Lower the monthly threshold so this decline would have triggered
  D: Have the model validator review the accuracy results each quarter
answer: A
explanation:
  why_correct: Point thresholds catch sudden failures but miss gradual decline, where each reading looks
    acceptable while the total change is material. The threshold is wide for a good reason, monthly
    noise, so the answer is to read the direction of travel. A trend trigger flags sustained decline
    over several months without reacting to one noisy month.
  why_not:
    B: Input drift checks already run and show no shift. The decline lies in how the inputs relate to
      churn, which input checks cannot see, and the accuracy data already shows it.
    C: The threshold is wide because monthly accuracy is noisy. Narrowing it to fit this decline would
      raise false alarms on normal variation, and it still would not look at the trend over time.
    D: A quarterly review adds independent eyes and could spot the trend, but it is manual, periodic and
      depends on someone looking for it. A trend trigger reads the monthly data automatically and flags
      the next slow decline without waiting for a review.
