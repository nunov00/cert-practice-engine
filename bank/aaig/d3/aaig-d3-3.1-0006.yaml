id: aaig-d3-3.1-0006
subdomain: '3.1'
difficulty: medium
stem: A telecom provider's churn model has shown a slow, steady decline in accuracy for five months. Each
  monthly result stays inside the alert threshold, so no action has been triggered. Marketing has noticed
  retention offers going to the wrong customers, and data science is investigating the cause. What change
  to monitoring should the governance leader recommend?
options:
  A: Add a trend trigger that flags sustained decline across months
  B: Add an outcome measure on offer take-up to model monitoring
  C: Lower the monthly threshold so this decline would have triggered
  D: Have the model validator review the accuracy results each quarter
answer: A
explanation:
  why_correct: Point thresholds catch sudden failures but miss gradual decline, where each reading looks
    acceptable while the total change is material. The accuracy data already shows the decline; the monitoring
    just does not read it over time. A trend trigger closes that blind spot and would flag the current
    decline for review now.
  why_not:
    B: Outcome measures are worth having, but take-up depends on offers, prices and competitors as well
      as the model. It would not isolate the model's decline, which the accuracy data already shows.
    C: A lower point threshold fitted to this month's result is arbitrary and raises false alarms on normal
      noise. It still does not look at the direction of travel over time.
    D: A quarterly review adds independent eyes and could spot the trend, but it is manual, periodic and
      depends on someone looking for it. The monitoring already collects the monthly accuracy data, and
      a trend trigger reads it automatically and flags the next slow decline without waiting for a review.
