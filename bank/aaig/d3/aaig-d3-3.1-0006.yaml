subdomain: '3.1'
difficulty: medium
stem: A telecom provider's churn model has shown a slow, steady decline in accuracy for five months. Each monthly
  result stays inside the alert threshold, so no action has been triggered. Marketing has noticed retention
  offers going to the wrong customers. What should the governance leader recommend?
options:
  A: Add trend-based triggers alongside the point thresholds and review now
  B: Leave the model as it is, since every monthly result is still within threshold
  C: Lower the point threshold so the latest month would have triggered
  D: Retrain the model monthly from now on regardless of its results
answer: A
explanation:
  why_correct: Point thresholds catch sudden failures but can miss gradual decline, where each reading looks
    acceptable but the cumulative change is material. Adding trend triggers closes that gap, and the business
    evidence of misdirected offers justifies a review now rather than waiting for a breach.
  why_not:
    B: Compliance with a threshold is not the same as acceptable performance. The business is already seeing
      harm, which shows the monitoring design is missing something.
    C: Moving the threshold to fit the latest result is reactive and arbitrary. It does not solve the underlying
      blind spot for slow decline and may cause false alarms.
    D: Routine retraining may hide the symptom but skips diagnosis. The cause might be a change in the market
      or the data that retraining alone would not address.
