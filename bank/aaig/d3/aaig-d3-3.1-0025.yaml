subdomain: '3.1'
difficulty: easy
stem: A logistics firm's executives strongly support a new AI dispatching system, which plans work across
  the whole network. Drivers and depot managers have been trained on it. Depot managers are still rated
  on their own depot's on-time rate, and they keep overriding the system with their own allocations. What
  change management action is MOST likely to help?
options:
  A: Require depot managers to log a reason for each override
  B: Give depot managers hands-on training in the system's logic
  C: Revise depot managers' targets to match the system's goals
  D: Have executives restate the case for change to depot managers
answer: C
explanation:
  why_correct: Middle managers act on what they are measured on. Their targets reward their own depot,
    while the system optimises the network, so overriding is rational for them. Aligning their targets
    with the system's goals removes the reason to resist.
  why_not:
    A: Override reasons give insight and an audit trail, but the incentive to override stays in place.
    B: The managers have already been trained. Skill is not the gap when their targets pull the other
      way.
    D: Executive support is already clear. Repeating the message does not change how the managers are
      rated.
