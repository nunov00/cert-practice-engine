subdomain: '3.1'
difficulty: hard
stem: A payments company released a new version of its fraud model. Within two days, false declines of legitimate
  card payments doubled, and merchant complaints are rising. The previous version performed acceptably. What
  should the governance leader support as the immediate action?
options:
  A: Keep the new version and retrain it urgently on the latest data
  B: Keep the new version but add a manual review of declined payments
  C: Roll back to the previous version and then investigate the cause
  D: Pause the fraud model completely until the root cause is found
answer: C
explanation:
  why_correct: When a new release causes clear harm and a known-good version exists, rolling back restores
    acceptable service quickly and limits damage to customers and merchants. The cause can then be investigated
    without pressure. This is why tested rollback capability should be a release requirement.
  why_not:
    A: Urgent retraining keeps the harm going while a fix is built and tested, and a rushed retrain may introduce
      new problems.
    B: Manual review of every decline at payment volumes is unlikely to be fast enough and leaves customers
      facing delays meanwhile.
    D: Switching off fraud detection would expose the company to fraud losses. A working earlier version is
      available and safer.
