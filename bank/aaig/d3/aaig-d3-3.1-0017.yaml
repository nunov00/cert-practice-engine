subdomain: '3.1'
difficulty: medium
stem: A payments company released a new version of its fraud model. Within two days, false declines of
  legitimate card payments doubled, and merchant complaints are rising. The previous version performed
  acceptably. What should the governance leader support as the immediate action?
options:
  A: Escalate the release to the model risk committee to decide
  B: Keep the new version and add manual review of declines
  C: Roll back to the previous version while the cause is found
  D: Return the most affected merchants to the previous version
answer: C
explanation:
  why_correct: The new release is causing clear harm, and a version that performed acceptably exists.
    Rolling back restores acceptable service quickly and limits damage to customers and merchants. The
    cause can then be investigated without pressure.
  why_not:
    A: The committee should hear about the release failure, but waiting for its decision keeps the harm
      going. Rolling back to a known-good version is within normal release control.
    B: Manual review of declines at payment volumes is slow and leaves customers waiting. It treats the
      symptom while the faulty version keeps running.
    D: A partial rollback protects some merchants but leaves the rest exposed to a version already shown
      to harm legitimate payments.
