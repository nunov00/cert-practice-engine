subdomain: '3.1'
difficulty: medium
stem: A conglomerate runs a federated AI model in which each division builds and monitors its own AI systems.
  A group policy already requires every division to monitor drift, and each division has a named AI risk
  owner. A review finds five divisions use separate tools and define drift differently, so group risk
  cannot compare their results. What should the governance leader recommend?
options:
  A: Set group definitions of drift and metrics that divisions report on
  B: Form a group committee to review each division's monitoring reports
  C: Have internal audit assess each division's monitoring each year
  D: Name an accountable AI risk owner for each division's monitoring
answer: A
explanation:
  why_correct: A federated model works when the centre sets common standards that divisions apply locally.
    The policy already requires monitoring, but without shared definitions and reporting metrics the results
    cannot be compared or aggregated. Setting those keeps divisional ownership and gives group risk a
    consistent view.
  why_not:
    B: A committee can only compare what is reported on the same basis. With different definitions it
      would still be unable to compare divisions.
    C: Audit can confirm that each division follows its own practice, but it does not make the results
      comparable.
    D: Accountable owners are already named in every division. Ownership does not make results comparable
      when each owner defines drift differently.
