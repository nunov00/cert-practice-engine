difficulty: medium
stem: A mining company has installed AI cameras in haul trucks to detect driver fatigue and prompt a rest
  break. The business case was made on safety grounds, not cost. The board asks how the value of the system
  will be tracked. What should the governance leader recommend?
options:
  A: Track system uptime and alert response time against targets
  B: Report the number of fatigue alerts raised each month
  C: Compare annual injury statistics before and after installation
  D: Set targets for fatigue incidents and breaks taken after alerts
answer: D
explanation:
  why_correct: Safety benefits can be measured. Targets for fatigue-related incidents and for the share
    of alerts followed by a rest break, reported regularly, show the board whether the system delivers
    the value it was approved for.
  why_not:
    A: Uptime and response show the system works, not that it reduces fatigue risk.
    B: Alert counts measure activity, not benefit. More alerts could mean more fatigue, more false alarms
      or better detection.
    C: Annual injury figures are an outcome, but they are slow and shaped by many factors, so they give
      little chance to act during the year.
