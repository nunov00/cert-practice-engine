subdomain: '3.1'
difficulty: hard
stem: A public employment agency tested its job-matching model for fairness before launch and found no significant
  disparities. A year later, a civil society group reports that older applicants receive noticeably fewer interview
  referrals. The agency has not measured fairness since launch. What is the most important governance gap?
options:
  A: The pre-launch fairness test used too small a sample
  B: The agency has no process for receiving external complaints
  C: The model was not re-approved by the ethics committee each year
  D: Fairness outcomes were not monitored once the model was live
answer: D
explanation:
  why_correct: Fairness can change after launch as the applicant population, labour market and data shift.
    A one-off test cannot show how the model treats groups in operation. Ongoing monitoring of outcomes by
    relevant groups is the control that would have detected the disparity before an outside group did.
  why_not:
    A: Even a perfect pre-launch test only describes conditions at that time. The deeper gap is that nobody
      checked how outcomes evolved in live use.
    B: The complaint did reach the agency, so the intake route worked. The problem is that the agency had no
      internal signal of its own.
    C: An annual re-approval without fresh outcome data would rest on the same old test. Monitoring evidence
      is what any committee would need.
