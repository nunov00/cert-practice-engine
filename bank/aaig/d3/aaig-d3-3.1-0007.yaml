id: aaig-d3-3.1-0007
subdomain: '3.1'
difficulty: medium
stem: A public employment agency tested its job-matching model for fairness before launch, using data
  from two of its six regions, and found no significant disparities. Its ethics committee approved the
  model once, at launch. A year later, a civil society group reports that older applicants receive fewer
  interview referrals. The complaint form does not record age, and no fairness results have been produced
  since launch. What is the MOST significant governance gap?
options:
  A: The pre-launch test drew on data from two of the six regions
  B: The complaint form does not capture the applicant's age
  C: The ethics committee has not re-approved the model since launch
  D: No fairness results have been produced since the launch
answer: D
explanation:
  why_correct: Fairness can change after launch as the applicant population, the labour market and the
    data shift. Ongoing monitoring of outcomes by relevant groups is the control that would have detected
    the disparity before an outside group did. Each of the other gaps matters less, because none of them
    would show how the model treats people in live use.
  why_not:
    A: Data from more regions would have improved the test, but it would still describe conditions at
      launch only. Disparities that develop in live use would be missed.
    B: Recording age on complaints would help analysis, but complaints are a reactive signal. Many applicants
      never know they were disadvantaged, so they never complain.
    C: A repeat approval would need fresh outcome evidence. Without monitoring, any later committee review
      would rest on the same launch test.
