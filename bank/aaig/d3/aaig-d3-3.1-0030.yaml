difficulty: hard
stem: An online marketplace routes content its AI moderation model is unsure about to human reviewers.
  After a viral event, uncertain cases rose tenfold; managers responded by raising the confidence level
  at which the model decides alone so the queue would shrink. What is the governance concern?
options:
  A: The surge plan set no reviewer capacity for viral events
  B: The new confidence level was not tested before it went live
  C: The change raised accepted risk without the owner's approval
  D: Monitoring gave no alert as uncertain cases rose tenfold
answer: C
explanation:
  why_correct: Raising the confidence level means more decisions are made with no human review, so the
    organisation accepts more risk. A change like that is a risk-acceptance decision for the accountable
    owner. Managers made it on their own to clear a queue. Surge plans should set in advance what may
    be changed, by whom and within what limits.
  why_not:
    A: Planned surge capacity would have eased the pressure, but the concern is the response the managers
      chose. Even with a capacity plan, nobody had approved shifting risk to clear the queue.
    B: Testing would show how the change affects error rates, but a tested change can still exceed what
      the owner is willing to accept. The missing step is the owner's decision, not the test.
    D: The rise was noticed, since managers reacted to it. Detection worked. The weakness is in who decided
      how to respond.
