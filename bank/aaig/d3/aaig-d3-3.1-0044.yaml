id: aaig-d3-3.1-0044
subdomain: '3.1'
difficulty: medium
stem: A telecom operator uses an AI agent to handle billing disputes. It reads the complaint, checks the
  account, decides on a credit, issues it and closes the case. Most credits are small. Monitoring tracks
  the accuracy of each step, and all are within threshold. Finance then finds that some customers received
  several credits for one dispute, because the agent reopened cases and repeated steps. What should the
  governance leader recommend?
options:
  A: Tighten each step's accuracy threshold to catch smaller errors
  B: Require a person to approve credits above a set amount
  C: Monitor each case end to end, with a limit on credits per case
  D: Cap the total value of credits the agent issues each day
answer: C
explanation:
  why_correct: When AI takes chained actions, harm can come from the sequence rather than from any step.
    Each step here was correct on its own; the problem was repetition across the case. Monitoring whole
    cases, with limits such as one credit per dispute, catches loops and combined effects.
  why_not:
    A: Each step was already accurate, so stricter step thresholds would still miss a problem visible
      only across the sequence.
    B: Approval above an amount suits large credits, but most credits are small. Repeated small credits
      would pass without review.
    D: A daily cap limits total exposure, but duplicates can fit under it, and when it is hit valid credits
      are blocked too. It does not see repetition within a case.
