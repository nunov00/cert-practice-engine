id: aaig-d3-3.1-0042
subdomain: '3.1'
difficulty: medium
stem: A manufacturer has deployed an AI agent that creates purchase orders from demand signals. The procurement
  manager sets the agent's ordering rules and limits. The project team proposes that the same manager
  approve the orders it creates under 50,000, arguing that the agent, not the manager, prepared them.
  What should the governance leader advise?
options:
  A: Review the agent's access as a privileged system account
  B: Have someone other than the rule-setter approve the orders
  C: Rely on the agent's built-in spending caps below the limit
  D: Have finance approve the agent's rules and limits quarterly
answer: B
explanation:
  why_correct: Whoever controls an agent's rules shapes every order it raises. If the same person approves
    those orders, preparing and approving are no longer separated, even though the agent does the typing.
    The agent's configuration should be treated as part of the preparer role, so approval must be independent
    of it.
  why_not:
    A: Privileged access reviews are good practice for agents, but they check what the agent can reach.
      They do not separate the person who configures it from the person who approves its orders.
    C: Spending caps limit size, not legitimacy, and the same manager sets them. Dropping approval weakens
      the control further.
    D: Independent approval of the rules adds oversight, but the manager who configures the agent would
      still approve each order it raises.
