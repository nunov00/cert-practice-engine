id: aaig-d3-3.1-0033
subdomain: '3.1'
difficulty: medium
stem: An insurer's broker support desk uses a generative AI tool to draft answers to brokers' questions about
  policy wording, which staff edit before sending. Leadership wants assurance the drafts stay accurate and
  compliant over time. Which monitoring approach is MOST appropriate?
options:
  A: Sample drafts and final replies against set criteria
  B: Track how many drafts staff send each day without edits
  C: Rely on brokers to raise any problems in their replies
  D: Review the provider's published quality scores each quarter
answer: A
explanation:
  why_correct: Generative output has no single accuracy score, so quality is best tracked by structured sampling
    against defined criteria such as accuracy, tone and regulatory content, comparing drafts with what was
    sent. That shows both model quality and whether staff edits are catching problems.
  why_not:
    B: Unedited drafts could mean high quality or careless review. On its own the count is ambiguous.
    C: Broker complaints are a lagging signal and many errors would never be raised.
    D: Provider scores reflect general benchmarks, not this insurer's use, policy wordings and brokers.
