id: aaig-d3-3.1-0033
subdomain: '3.1'
difficulty: medium
stem: An insurer's broker support desk uses a generative AI tool to draft answers to brokers' questions
  about policy wording, which staff edit before sending. Leadership wants assurance the drafts stay accurate
  and compliant over time. Which monitoring approach is MOST appropriate?
options:
  A: Sample live drafts and final replies against set criteria
  B: Track how much staff change each draft before sending
  C: Require staff to review and edit each draft before sending
  D: Re-test the tool on a fixed set of questions each quarter
answer: A
explanation:
  why_correct: Generative output has no single accuracy score, so quality is best tracked by sampling
    against defined criteria such as accuracy and compliant wording. Comparing live drafts with what was
    sent shows both the tool's quality and whether staff edits are catching problems.
  why_not:
    B: The amount of editing is ambiguous. Light edits could mean good drafts or careless review, and
      heavy edits do not show whether the final reply is right.
    C: Staff already review and edit every draft. That is the human control, but it is not monitoring,
      and it does not show whether drafts or edits are getting worse over time.
    D: A fixed question set is useful for regression testing, but it does not reflect the live questions
      or show what staff actually send.
