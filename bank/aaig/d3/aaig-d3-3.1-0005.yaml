id: aaig-d3-3.1-0005
subdomain: '3.1'
difficulty: hard
stem: A health insurer's data science team monitors a claims triage model for drift. Model validation
  has confirmed the statistical method, and alerts reach the business owner within a day. The business
  owner is accountable for triage outcomes, and the risk function provides challenge. The team chose the
  alert thresholds itself, using statistical convention. What is the BEST improvement?
options:
  A: Have the business owner approve thresholds linked to risk appetite
  B: Have the risk function set the thresholds from the enterprise appetite
  C: Have the risk committee set a single threshold policy across models
  D: Have the second line take over drift monitoring from the team
answer: A
explanation:
  why_correct: Thresholds decide when the organisation acts, so they are a risk decision, not only a statistical
    one. The business owner is accountable for triage outcomes, so the owner should approve how much degradation
    this use can tolerate within the appetite. The risk function then challenges that choice rather than
    making it.
  why_not:
    B: Linking thresholds to appetite is right, but having the risk function set them moves a first-line
      decision to the second line. It would then be challenging its own choice, and the accountable owner
      would not own the tolerance.
    C: A group policy helps consistency, but one threshold policy for all models ignores how different
      the harm from drift is in each use. Claims triage needs its own tolerance.
    D: Independent monitoring can add challenge, but alerts already reach the owner quickly. Moving the
      work does not link the thresholds to risk appetite or to an accountable approver.
