subdomain: '3.1'
difficulty: medium
stem: A consumer lender's branch loan officers earn a bonus for each loan approved. They may override the AI credit
  model's declines, and override rates vary widely by branch. Loans approved by override default much more often
  than others. What should the governance leader recommend?
options:
  A: Remove officers' ability to override declines so that the model's decisions always stand
  B: Retrain the model to approve more of the applications that officers tend to override
  C: Align officers' incentives with loan quality and review override outcomes by branch
  D: Send officers a reminder of the lending policy and the purpose of the AI recommendation
answer: C
explanation:
  why_correct: The volume bonus rewards officers for overriding declines, so the human judgement meant to improve
    decisions is being pulled in one direction. Integrating AI into a process includes checking that incentives
    support the intended use. Rewarding loan quality and reviewing override outcomes by branch keeps the override
    as a genuine judgement and shows where it is being misused.
  why_not:
    A: Removing overrides loses legitimate human judgement on cases the model gets wrong, and leaves the incentive
      problem in place elsewhere.
    B: Teaching the model to copy overrides that default more often would build the incentive problem into the model
      itself.
    D: A reminder does nothing to change the bonus that drives the behaviour. Incentives usually outweigh guidance.
