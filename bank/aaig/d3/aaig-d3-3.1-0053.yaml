id: aaig-d3-3.1-0053
subdomain: '3.1'
difficulty: hard
stem: A consumer lender's branch loan officers and their managers earn bonuses on the number of loans
  approved. Officers may override the AI credit model's declines, and override rates vary widely by
  branch. Credit risk already reviews override outcomes by branch each quarter. Loans approved by
  override default much more often than others. What is the BEST recommendation for the governance leader?
options:
  A: Set override-rate limits for each branch, owned by credit risk
  B: Require branch manager sign-off for each override of a decline
  C: Base branch bonuses on loan quality, not approval count
  D: Report override outcomes by branch to the credit committee
answer: C
explanation:
  why_correct: Officers and their managers are both rewarded for approvals, so the human judgement meant
    to improve decisions is pulled one way. Basing branch bonuses on loan quality removes that pressure
    and keeps the override as a genuine judgement.
  why_not:
    A: Rate limits curb the number of overrides, but they also block good overrides and leave the bonus
      pushing officers toward approval within the limit.
    B: A second sign-off is a standard control on overrides, but branch managers are also paid on
      approvals, so the check is under the same pressure.
    D: Credit risk already reviews override outcomes by branch. Reporting them upward adds visibility,
      but the bonus keeps driving the behaviour.
