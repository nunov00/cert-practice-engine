subdomain: '3.1'
difficulty: medium
stem: A consumer lender's branch loan officers earn a bonus for each loan approved. They may override
  the AI credit model's declines, and override rates vary widely by branch. Loans approved by override
  default much more often than others. What should the governance leader recommend?
options:
  A: Set override-rate limits for each branch, owned by credit risk
  B: Retrain the model on the applications officers override
  C: Base officers' bonuses on loan quality, not approval count
  D: Review override outcomes by branch each quarter
answer: C
explanation:
  why_correct: The volume bonus rewards officers for overriding declines, so the human judgement meant
    to improve decisions is pulled one way. Rewarding loan quality removes that pressure and keeps the
    override as a genuine judgement.
  why_not:
    A: Rate limits curb the volume of overrides, but they also block good overrides and leave the bonus
      pushing officers toward approval within the limit.
    B: Teaching the model to copy overrides that default more often would build the incentive problem
      into the model.
    D: Branch reviews show where overrides go wrong and are worth doing, but they detect the behaviour
      after loans are made. The bonus keeps driving it.
