id: aaig-d3-3.1-0004
subdomain: '3.1'
difficulty: hard
stem: The board of a bank receives a quarterly AI report on its credit model showing approval speed,
  cost per decision and input drift scores by product and channel against tolerances. A director asks
  what else would warn the board that the model is becoming riskier before arrears and losses appear.
  Which addition would BEST answer the director?
options:
  A: Trends in how often credit officers override the model
  B: Accuracy on recent loans compared with the validation results
  C: Shifts in the applicant mix by product and channel
  D: First-payment defaults on model-approved loans by segment
answer: A
explanation:
  why_correct: The report already carries input drift by product and channel, so the board needs a
    different kind of early signal. A rising or shifting override rate shows that the officers closest
    to the decisions increasingly disagree with the model, which often comes before arrears appear. It
    adds a human view that drift scores cannot give.
  why_not:
    B: Accuracy on a credit model can only be measured once loans have had time to repay or default, so
      it lags in the same way as arrears. It confirms deterioration after outcomes arrive rather than
      warning ahead of them.
    C: A shift in the applicant mix by product and channel is what the input drift scores in the report
      already measure. Reporting it again in another form adds no new warning.
    D: First-payment defaults are an early outcome measure and are useful in credit monitoring, but they
      are themselves arrears. The director wants a signal that warns before arrears appear.
