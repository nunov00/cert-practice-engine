subdomain: '3.1'
difficulty: medium
stem: The board of a bank receives a quarterly AI report on its credit model showing approval speed, cost
  per decision and input drift scores by product and channel against tolerances. A director asks what
  else would warn the board that the model is becoming riskier before arrears and losses appear. What
  should be added?
options:
  A: Trends in how often credit officers override the model
  B: Accuracy on recent loans compared with the validation results
  C: Findings from the yearly independent model validation
  D: Loss rates on model-approved loans by customer segment
answer: A
explanation:
  why_correct: The report already carries input drift by segment, so the board needs a second, different
    early signal. A rising or shifting override rate shows that the officers closest to the decisions
    increasingly disagree with the model, which often comes before arrears appear. It adds a human view
    that drift scores cannot give.
  why_not:
    B: Accuracy on a credit model can only be measured once loans have had time to repay or default, so
      it lags in the same way as arrears. It confirms deterioration after outcomes arrive rather than
      warning ahead of them.
    C: Independent validation gives valuable assurance, but once a year. It cannot warn the board between
      validations that the model is becoming riskier.
    D: Loss rates by segment are useful outcome measures, but they are lagging. They show the risk after
      it has turned into losses, which is what the director wants to get ahead of.
