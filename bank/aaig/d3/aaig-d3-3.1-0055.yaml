stem: A medical device manufacturer with a certified quality management system has added AI visual inspection
  to its final assembly line. The company also has an enterprise AI governance committee. The project
  team proposes a separate AI process, run by data science, for model changes and inspection defects.
  What should the governance leader recommend?
options:
  A: Bring the AI under the quality system's change and corrective action
  B: Have the AI governance committee approve model changes and defects
  C: Add a data science AI procedure that the quality manual references
  D: Validate the model fully once and then lock it against changes
answer: A
explanation:
  why_correct: The AI now performs a quality control on a regulated product, so it belongs in the certified
    system that governs quality. Using the existing change control and corrective action processes, adapted
    for model updates, keeps one line of accountability for product quality. Enterprise AI governance
    can still set policy around it.
  why_not:
    B: The committee sets enterprise AI policy, but it sits outside the certified quality system. Handling
      inspection changes and defects there splits accountability for product quality.
    C: A cross-reference makes the procedure visible but leaves data science running it outside quality's
      change control and corrective action.
    D: A locked model reduces change risk, but defects still need corrective action, and any later update
      still needs change control.
