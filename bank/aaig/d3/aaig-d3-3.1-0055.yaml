subdomain: '3.1'
difficulty: medium
stem: A medical device manufacturer with a certified quality management system has added AI visual inspection to
  its final assembly line. The project team proposes a separate AI process, run by data science, for model changes
  and inspection defects. What should the governance leader recommend?
options:
  A: Bring the AI inspection under the quality system's existing change control and corrective action
  B: Approve the separate process, since AI models change too often for quality system procedures
  C: Keep the AI outside the quality system until the certification body issues AI-specific guidance
  D: Let data science manage model changes while quality staff record any defects found afterwards
answer: A
explanation:
  why_correct: The AI now performs a quality control, so it belongs inside the management system that governs quality.
    Using the existing change control and corrective action processes, adapted where needed for model updates, keeps
    one line of accountability, satisfies certification expectations and avoids a parallel process that auditors
    and quality staff cannot see.
  why_not:
    B: Frequent change is a reason to make change control efficient, not to bypass it. A separate process fragments
      accountability for product quality.
    C: The AI is already inspecting products. Leaving it outside the quality system until guidance appears leaves
      a live control ungoverned.
    D: Splitting change and defect handling between teams breaks the link between a model change and the defects
      it may cause.
