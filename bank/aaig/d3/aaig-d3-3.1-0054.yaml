subdomain: '3.1'
difficulty: medium
stem: An airline's AI crew scheduling system reduced the number of standby crew needed. The operations
  division reports a saving of 6 million from fewer standby shifts, and the finance division reports the
  same 6 million as lower payroll. Each figure is correct on its own. The AI portfolio report adds both,
  showing 12 million. What should the governance leader put in place?
options:
  A: Finance validation of each benefit figure before it is reported
  B: One benefits register with rules on who records each benefit
  C: A year-end reconciliation of AI benefits with the ledger
  D: Sign-off of each benefit figure by its sponsoring executive
answer: B
explanation:
  why_correct: Both figures are right, but the same saving has been counted twice, because there is no
    shared record or rule about who claims what. A single register with attribution rules prevents double
    counting across units and makes portfolio totals reliable during the year.
  why_not:
    A: Each figure is correct on its own, so validating them one by one finds nothing wrong. The problem
      only appears across units.
    C: Reconciliation could reveal the double count, but only at year end, after reports and investment
      decisions have used the inflated total. It also sets no rule on who records each benefit.
    D: Each sponsor would sign off their own correct figure, so both claims would still stand.
