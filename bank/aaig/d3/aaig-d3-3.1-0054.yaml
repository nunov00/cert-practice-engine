difficulty: easy
stem: An airline's AI crew scheduling system reduced the number of standby crew needed. The operations division
  reports a saving of 6 million from fewer standby shifts, and the finance division reports the same 6 million as
  lower payroll. The AI portfolio report adds both, showing 12 million. What should the governance leader put in
  place?
options:
  A: A request for internal audit to check each claim separately before the year-end report
  B: A single benefits register with rules on which unit records each benefit and how
  C: A rule to report only the smaller of two claimed figures, to stay on the safe side
  D: Removal of AI benefits from the portfolio report until each one can be fully proven
answer: B
explanation:
  why_correct: The same saving has been counted twice because there is no shared record of benefits or rule about
    who claims what. A single register with attribution rules prevents double counting across units and makes portfolio
    totals reliable, which matters for future investment decisions.
  why_not:
    A: Audit might catch this instance, but without attribution rules the same problem will recur in every reporting
      cycle.
    C: Picking the smaller figure is arbitrary and still does not say which unit owns the benefit. It also does
      not stop double counting where figures differ.
    D: Dropping benefits from reporting hides real value and leaves the board unable to judge the portfolio.
