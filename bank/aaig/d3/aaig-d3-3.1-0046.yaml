subdomain: '3.1'
difficulty: medium
stem: An energy retailer uses AI to set some repayment plans for customers in arrears; agents set the
  rest. The board asks whether the AI is causing customer harm. The complaints system records complaints
  only by product and channel. What should the governance leader do FIRST?
options:
  A: Survey customers on repayment plans about their fair treatment
  B: Record on each complaint whether AI set the plan concerned
  C: Report complaint trends on repayment plans to the board
  D: Confirm the model's accuracy is within its approved threshold
answer: B
explanation:
  why_correct: Complaints are one of the most direct signals of customer harm, but only if they can be
    linked to the AI. Today the data cannot separate AI-set plans from those agents set. Tagging AI involvement
    lets the retailer compare the two and report AI-related harm to the board.
  why_not:
    A: A survey may add insight, but it is slow, depends on who responds, and does not fix the gap in
      routine data.
    C: Plan complaints mix AI-set and agent-set plans, so trends say little about the AI. The board's
      question needs attributable data.
    D: Accuracy shows whether the model predicts well, not whether customers are harmed by the plans it
      sets. Harm is an outcome measure.
