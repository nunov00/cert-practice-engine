subdomain: '3.1'
difficulty: easy
stem: An energy retailer uses AI to set repayment plans for customers in arrears. The board asks whether the AI
  is causing customer harm. The complaints system records complaints only by product and channel. What should the
  governance leader do FIRST?
options:
  A: Commission a survey asking customers whether they feel the AI treated them fairly
  B: Record on each complaint whether AI played a part in the decision complained about
  C: Report total complaint numbers to the board, since any harm from AI would appear there
  D: Ask the data science team to confirm the model's accuracy is still within threshold
answer: B
explanation:
  why_correct: Complaints are one of the most direct signals of customer harm, but only if they can be linked to
    the AI. Today the data cannot show which complaints involve AI-set plans. Tagging complaints for AI involvement
    lets the retailer track AI-related complaints over time, compare them with other decisions and report them to
    the board.
  why_not:
    A: A survey may add insight, but it is slow, depends on who responds, and many customers will not know AI was
      used. It does not fix the gap in routine data.
    C: Totals mix AI-related complaints with everything else, so a rise or fall says little about the AI. The board's
      question needs attributable data.
    D: Model accuracy says whether the model predicts well, not whether customers are harmed by the plans it sets.
      Harm is an outcome measure.
