subdomain: '3.1'
difficulty: medium
stem: A public procurement agency uses AI to score how well tenders meet requirements, and review teams
  in two cities correct the scores. Both teams follow the same written review guidance, and each handles
  over a thousand bids a year. Analysis shows the two teams shift the AI's scores in opposite directions
  on similar bids. What should the governance leader recommend?
options:
  A: Move tender review to a single central team
  B: Issue shared written guidance on when to change scores
  C: Treat AI scores as final unless a bidder appeals
  D: Calibrate both teams on shared cases and track consistency
answer: D
explanation:
  why_correct: Both teams already have the same guidance, yet they apply it in opposite directions, so
    the guidance alone is not producing consistent judgement. Calibration on shared cases aligns how reviewers
    read it, and tracking adjustments shows whether consistency holds. In public procurement, consistent
    treatment of similar bids is a fairness and challenge requirement.
  why_not:
    A: One team would be consistent, but it could not absorb more than two thousand bids a year without
      large delays. Consistency can be achieved without moving the work.
    B: Shared guidance is the usual first step, but both teams already follow the same guidance. More
      written rules do not align how they apply it.
    C: Relying on appeals removes the routine check on AI errors and puts the burden on bidders to find
      them.
