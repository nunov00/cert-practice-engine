subdomain: '3.1'
difficulty: medium
stem: An online retailer will launch AI-personalised offers next quarter. In the same quarter it is also
  cutting prices and running a large brand campaign. The CFO wants a credible figure for the sales uplift
  caused by the AI. What should the governance leader recommend before launch?
options:
  A: Record sales in the quarter before launch as a baseline
  B: Estimate the uplift with marketing mix modelling afterwards
  C: Launch the offers in one region and compare it with the others
  D: Keep a random group of customers without AI offers as a control
answer: D
explanation:
  why_correct: With a price cut and a campaign in the same quarter, a before-and-after comparison cannot
    separate the AI's effect. A random holdout group experiences everything except the AI offers, so the
    difference isolates the AI's contribution. It must be designed before launch.
  why_not:
    A: A baseline is useful, but the change from it mixes the effects of all three initiatives.
    B: Mix modelling can estimate contributions, but it relies on assumptions and history. It is less
      credible than a randomised comparison that can be set up before launch.
    C: A regional test helps, but regions differ in customers and in how the campaign and prices land,
      so the comparison is not clean.
