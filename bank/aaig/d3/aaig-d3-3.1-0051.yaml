id: aaig-d3-3.1-0051
subdomain: '3.1'
difficulty: easy
stem: A commercial insurer introduced an AI tool that writes a risk summary for each new application. Underwriters
  say the summaries are accurate. However, procedures still require them to compile the full manual file as before,
  with the AI summary added on top, and cost per application has risen. What is the MOST likely reason the expected
  benefit has not appeared?
options:
  A: The process was not redesigned, so the AI added a step instead of replacing work
  B: The model is not yet accurate enough for underwriters to rely on its summaries alone
  C: Underwriters have not been trained well enough on how to use the AI tool
  D: The business case overstated the time that the AI would save on each case
answer: A
explanation:
  why_correct: Benefits from AI come from changing how work is done, not from installing a tool. Here the old procedure
    is unchanged, so underwriters do all the previous work plus read the summary. The procedure needs redesigning
    so the summary replaces the manual compilation where that is appropriate.
  why_not:
    B: The underwriters themselves say the summaries are accurate. Accuracy is not what blocks the benefit.
    C: Training would not help when the procedure requires the full manual file anyway. The constraint is the process,
      not skills.
    D: The estimate may or may not have been optimistic, but no saving can appear while the old work remains mandatory.
