id: aaig-d3-3.1-0051
subdomain: '3.1'
difficulty: easy
stem: A commercial insurer introduced an AI tool that writes a risk summary for each new application.
  Underwriters say the summaries are accurate, though some still check them line by line. Training covered
  the tool's features only. Procedures still require the full manual file as before, with the summary
  added. Cost per application has risen. What is the MOST likely reason the expected benefit has not appeared?
options:
  A: Procedures still require the old work, so nothing was removed
  B: Underwriters do not yet trust the summaries enough to rely on them
  C: Underwriters were not trained to work from the summaries
  D: The business case overstated the time each summary saves
answer: A
explanation:
  why_correct: Benefits from AI come from changing how work is done. While procedures still require the
    full manual file, underwriters do all the previous work plus the summary, so cost can only rise. Trust
    and training matter only once the process allows the summary to replace work.
  why_not:
    B: Some line-by-line checking adds time, but even full trust would not remove the manual file the
      procedures require.
    C: Better training would not help while the procedure mandates the manual file anyway. The constraint
      is the process.
    D: The estimate may have been optimistic, but no saving can appear while the old work remains mandatory.
