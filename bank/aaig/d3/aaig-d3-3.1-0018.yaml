stem: A media company's AI model that recommends articles now costs more to run each year than the extra subscriptions
  it is credited with, and newer features in the main platform do the same job. The model owner wants to keep
  tuning it. What should the governance leader recommend?
options:
  A: Keep the model and assign more staff to improve its accuracy
  B: Keep the model running alongside the platform as a backup
  C: Put a retirement case to the portfolio body
  D: Move the model to a cheaper hosting provider to reduce cost
answer: C
explanation:
  why_correct: AI systems should be reviewed through their whole life, including whether they still earn their
    place. Here costs exceed benefits and an alternative exists. Bringing a retirement case to the body that
    governs the AI portfolio ensures an objective decision rather than one driven by the owner's attachment.
  why_not:
    A: Investing more in a model with negative net value and a ready replacement is unlikely to be the best
      use of resources.
    B: Running both duplicates cost and risk without a clear need for a backup in a non-critical service.
    D: Cheaper hosting trims cost but avoids the real question of whether the model should exist at all now
      that an alternative does the job.
