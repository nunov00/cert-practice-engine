stem: A media company's AI model that recommends articles now costs more to run each year than the extra
  subscriptions it is credited with, and newer features in the main platform do the same job. The model
  owner wants to keep tuning it. What should the governance leader recommend?
options:
  A: Set the owner improvement targets and review in six months
  B: Move the model to cheaper hosting to restore a positive return
  C: Present a retirement case to the AI portfolio board
  D: Ask finance to re-test how subscriptions are credited to it
answer: C
explanation:
  why_correct: AI systems should be reviewed through their whole life, including whether they still earn
    their place. Here costs exceed benefits and the platform already does the same job. A retirement case
    to the body that governs the portfolio gives an objective decision rather than one driven by the owner's
    attachment.
  why_not:
    A: Improvement targets suit a model with a unique role. Here the platform does the same job, so better
      accuracy adds little value.
    B: Cheaper hosting trims cost but avoids the real question of whether the model is needed now that
      the platform does the job.
    D: Re-testing attribution makes sense when value is disputed. Even a higher credit would not justify
      running a duplicate of a platform feature.
