subdomain: '3.1'
difficulty: medium
stem: An insurer's AI fast-track settles claims that its model scores as simple; claims handlers deal
  with the rest. Before the fast-track, all claims averaged 9 days. The quarterly report shows fast-track
  claims settle in 2 days against 11 days for handler claims, and management proposes sending all claims
  through the AI, citing an 80% time saving. What is the MAIN flaw in the 80% figure?
options:
  A: The comparison sets simple claims against complex ones
  B: Settlement time is a lagging rather than a leading measure
  C: There is no pre-AI baseline for settlement times
  D: The case does not test the accuracy of fast-track settlements
answer: A
explanation:
  why_correct: The AI only receives claims it has already judged simple, while handlers get everything
    difficult. Much of the gap between 2 and 11 days comes from case mix, not from the AI. Without a comparison
    of like claims, the 80% saving for all claims is unsupported.
  why_not:
    B: Leading indicators help with early warning, but they do not fix a comparison between two different
      groups of claims.
    C: A baseline exists, since all claims averaged 9 days before the fast-track. The problem is that
      the 80% figure compares two different groups of claims instead.
    D: Accuracy should be part of the decision. But even a perfectly accurate fast-track would not support
      the 80% figure, because the time comparison is biased by case mix.
