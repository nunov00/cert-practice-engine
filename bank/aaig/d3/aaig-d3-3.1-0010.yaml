stem: A healthcare network piloted an AI tool that prioritises radiology scans in its urban hospitals, and
  the pilot met every go/no-go criterion. Executives now want to switch it on immediately across rural clinics,
  which use older scanners and serve an older population. What should the governance leader advise?
options:
  A: Proceed, since the pilot met all of the agreed criteria
  B: Cancel the rural rollout until a fully new pilot is designed
  C: Run a limited rural stage with monitoring before wider rollout
  D: Proceed but ask clinicians to report any problems they notice
answer: C
explanation:
  why_correct: A pilot's evidence only holds for conditions like those tested. Different equipment and patient
    mix could change performance. A limited, monitored stage in the new setting tests that risk at small scale
    while keeping momentum, which is proportionate to the evidence gap.
  why_not:
    A: The criteria were met under urban conditions. Treating them as valid for a materially different setting
      ignores a known risk to patient safety.
    B: Cancelling discards strong evidence and delays benefits. A staged extension can address the specific
      differences without starting over.
    D: Relying on ad hoc reports is reactive. Clinicians may not notice subtle degradation, and harm could
      occur before reports accumulate.
