id: aaig-d3-3.1-0034
subdomain: '3.1'
difficulty: hard
stem: An insurer retrains its claims fraud model every quarter on the results of fraud investigations.
  Investigators can examine about 3% of claims and work through those the model scores highest. The confirmed
  fraud rate among investigated claims has risen every quarter. What risk should the governance leader
  raise?
options:
  A: Retraining each quarter may overfit to recent fraud patterns
  B: Investigators' own biases may carry into the training labels
  C: Fraudsters may adapt faster than the quarterly cycle
  D: Training labels exist only for claims the model chose to flag
answer: D
explanation:
  why_correct: Investigations only happen on claims the model scores highest, so confirmed outcomes, and
    the training labels built from them, exist only where the model already looked. The model never learns
    whether the claims it scored low were clean, so its blind spots become entrenched, and a rising hit
    rate can look like success while new fraud goes unseen. Governance should require checks such as investigating
    a random sample of low-scored claims.
  why_not:
    A: Retraining frequency is not the issue. A rising hit rate among investigated claims fits better
      targeting, not overfitting, and it says nothing about fraud the model never sends for investigation.
    B: Investigator bias is a real label risk, but nothing in the stem points to it. The problem is which
      claims get labels at all, not how investigators judge them.
    C: Adaptation is a real fraud risk, but faster retraining on the same one-sided labels would not fix
      the feedback loop described.
