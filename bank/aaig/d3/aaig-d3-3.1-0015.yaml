id: aaig-d3-3.1-0015
subdomain: '3.1'
difficulty: medium
stem: A retailer's contract for an AI demand-forecasting service includes monthly reports on uptime and
  response time. Store managers complain that stock forecasts have become unreliable, yet every vendor
  report shows targets met. The contract is due for renewal next quarter. What should the governance leader
  recommend?
options:
  A: Retender the service at renewal and compare other vendors
  B: Commission an independent review of the vendor's model design
  C: Have the retailer's analysts track forecast accuracy each month
  D: Add forecast accuracy targets to the renewed service levels
answer: D
explanation:
  why_correct: The service levels measure whether the system responds, not whether its forecasts are good.
    With renewal close, adding accuracy targets ties the vendor's obligations to the value the retailer
    is paying for and gives the retailer a contractual lever when forecasts slip.
  why_not:
    A: A new vendor under a contract that again measures only uptime would recreate the same gap. The
      measures need to change whoever supplies the service.
    B: A design review gives a one-off view of the model. It creates no ongoing measure of forecast quality
      and no obligation on the vendor.
    C: The retailer's own tracking gives useful evidence, but without a target in the contract the vendor
      has no duty to act on it. The renewal is the moment to set that duty.
