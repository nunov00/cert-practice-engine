subdomain: '3.1'
difficulty: medium
stem: A hospital ran an AI tool that drafts radiology reports for six months, with stable report quality.
  It then began rewarding radiology teams for cutting report turnaround time. Turnaround halved, but corrected
  reports and queries from referring doctors rose. Monitoring shows the tool's draft accuracy is unchanged.
  What should the governance leader recommend?
options:
  A: Require a second read of AI drafts on complex cases
  B: Set a minimum review time for each AI-drafted report
  C: Retrain the tool on the corrected reports from this period
  D: Add report quality measures to the turnaround reward
answer: D
explanation:
  why_correct: The tool has not changed; behaviour changed when a single speed measure was rewarded. People
    optimise for what is rewarded, so the fix is to reward a balanced set of measures, here turnaround
    together with correction and query rates. That removes the pressure to skim drafts while keeping the
    efficiency gain the tool makes possible.
  why_not:
    A: Second reads add a check, but they add cost and leave the incentive in place. Teams would still
      be rewarded for speed alone, and quality on cases outside the second read would keep slipping.
    B: A minimum review time treats the symptom and is easy to game, since time spent is not attention
      paid. The reward that drives the behaviour would stay as it is.
    C: Monitoring shows draft accuracy is unchanged, so the tool is not the cause. Retraining would not
      change how quickly radiologists sign off.
