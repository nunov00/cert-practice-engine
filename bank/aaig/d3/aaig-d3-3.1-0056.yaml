subdomain: '3.1'
difficulty: hard
stem: A retailer uses an AI model to estimate the provision for customer returns at each quarter end.
  The model was independently validated before first use, and data science monitors its accuracy and updates
  it several times a year. Finance posts the output as received. The external auditor asks how the company
  ensures each quarter's estimate is reliable. What should the governance leader recommend?
options:
  A: Run the previous manual method in parallel as a check
  B: Give finance access to the model's accuracy dashboard
  C: Add finance-owned output review and change approval
  D: Have the model independently revalidated after each update
answer: C
explanation:
  why_correct: A model that produces a figure in the accounts is part of financial reporting. Validation
    and monitoring already exist, but no one in finance reviews the quarterly figure or approves changes
    to the model that produces it. Documented, tested controls owned by finance give management evidence
    for each quarter's figure and give the auditor something to test.
  why_not:
    A: A parallel manual method doubles the work, and the old method may itself be less accurate. It puts
      no control over the model's data, changes or output.
    B: Access to the dashboard informs finance, but reading a dashboard is not a documented control with
      an owner, evidence and testing.
    D: Revalidation after each update is good model risk practice. It checks the model's soundness, but
      not the data fed in each quarter or the review of the posted figure. Finance still owns nothing.
