id: aaig-d3-3.1-0028
subdomain: '3.1'
difficulty: medium
stem: At an asset manager, the model risk committee assessed and approved its AI portfolio-analytics tools
  last quarter. Investment teams were slow to check the tools' outputs, so the operational risk function
  (second line) took over the weekly checks and now signs them off. The audit committee chair asks internal
  audit for its view. What is the MOST likely concern?
options:
  A: The second line now runs checks it should independently challenge
  B: Operational risk has no charter mandate for performing the checks
  C: Operational risk staff may lack the skill to judge AI outputs
  D: The tools' risks have not been assessed by an independent body
answer: A
explanation:
  why_correct: Routine output checks are a first-line control. When the second line runs and signs them
    off, it can no longer challenge them independently, and the investment teams stop owning the risk.
    The fix is to build first-line capability while the second line sets standards and challenges.
  why_not:
    B: A charter could be updated to cover the work, but that would not fix the conflict. The function
      would still be challenging checks it performs.
    C: Skill may be an issue, but internal audit's main concern is roles and independence, not capability.
    D: The model risk committee assessed and approved the tools last quarter. The concern is who now runs
      the checks, not whether the tools were assessed.
