subdomain: '3.1'
difficulty: medium
stem: At a community hospital, a pharmacist caught an AI tool's wrong dosage suggestion before it reached
  a patient. Because no harm occurred, it was not reported. How should the governance leader view this?
options:
  A: As appropriate, since only incidents causing harm need reporting
  B: As a training issue for the pharmacist rather than an AI issue
  C: As a reason to withdraw the AI tool from use immediately
  D: As a near miss to be reported and analysed for patterns
answer: D
explanation:
  why_correct: Near misses reveal weaknesses before they cause harm. Recording and analysing them shows whether
    errors are isolated or systematic and whether human checks are carrying too much of the load. An AI incident
    process should explicitly cover near misses.
  why_not:
    A: Waiting for harm wastes the warning. Safety-critical sectors learn most from events that were caught
      in time.
    B: The pharmacist did exactly what was needed. The issue is the tool's error and the missing report.
    C: One caught error does not justify immediate withdrawal without analysis. Reporting and investigation
      should inform that decision.
