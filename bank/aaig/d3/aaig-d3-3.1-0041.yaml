subdomain: '3.1'
difficulty: medium
stem: A water utility introduced AI that matches supplier invoices to purchase orders, and about 90% now
  go through automatically. The business case removed most accounts payable clerk roles. Invoices the
  AI cannot match go to a queue that no team was assigned to. Resolving them needs contact with buyers
  and budget holders. Some suppliers are now charging late-payment fees. What should the governance leader
  recommend?
options:
  A: Lower the match confidence level to shrink the queue
  B: Contract the vendor to clear exceptions within set times
  C: Record the queue as a risk with an owner and action plan
  D: Assign the exception queue to a named team with a service level
answer: D
explanation:
  why_correct: The AI is doing what it was bought to do. The failure is that roles were removed without
    deciding who handles exceptions. Giving the queue an owner with capacity and a service level protects
    supplier payments, and makes the exceptions part of the designed process.
  why_not:
    A: Accepting weaker matches shrinks the queue by letting more wrong payments through. It moves the
      problem rather than solving it.
    B: Exceptions need contact with the utility's buyers and budget holders and decisions on its own payments.
      The vendor lacks that authority and knowledge.
    C: A risk owner makes the gap visible, but the queue still has no one working it. Fees keep building
      until a team handles the exceptions.
