subdomain: '3.1'
difficulty: medium
stem: A retail group runs about forty AI models. Its product photo-tagging tool supports the most online
  sales, while a simpler model sets staff working hours and pay. The monitoring team applies identical
  daily checks to every model and is overstretched. How should the governance leader recommend tiering
  the monitoring?
options:
  A: By the impact each model has on customers
  B: By the harm each model could cause
  C: By each model's technical complexity
  D: By how often each model is retrained
answer: B
explanation:
  why_correct: Monitoring effort should follow the impact of failure. A wrong schedule affects people's
    hours and pay, so the scheduling model warrants closer watch than the photo tagger, however much revenue
    the tagger supports. Tiering by potential harm puts effort where it protects most.
  why_not:
    A: Customer impact is one form of harm, but it misses harm to staff. It would leave the model that
      sets staff hours and pay with light monitoring.
    C: Complexity affects how a model can fail, but a simple model can still cause serious harm. The scheduling
      model is simple and high impact.
    D: Retraining frequency is one change signal, but it says nothing about the consequences when a model
      goes wrong.
