difficulty: medium
stem: Over a year, a utility's AI incident log shows six separate incidents, each closed after a technical
  fix. Four were caused by upstream data changes that the model owners were not told about. What should
  the governance leader do?
options:
  A: Add input validation checks to each affected model
  B: Require upstream teams to notify model owners of data changes
  C: Present the incident trend to the risk committee with each case
  D: Hold a root cause review of each future incident before closure
answer: B
explanation:
  why_correct: Looking across incidents shows a common cause, which is upstream changes made without telling
    model owners. A notification control at the source prevents recurrence for every dependent model.
    Incident management should feed lessons back into governance, not only close tickets.
  why_not:
    A: Input checks may catch some changes sooner, but only on these models and only after the change
      has reached them. The cause sits upstream.
    C: Reporting the trend informs the committee, but it does not put a control in place. The cause is
      already known.
    D: Root cause reviews are good practice, but the common cause is already clear. Another review step
      does not stop silent changes.
