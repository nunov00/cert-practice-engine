subdomain: '3.1'
difficulty: medium
stem: An accounting firm's finance software vendor has added an AI feature that categorises expense claims
  for tax treatment. The vendor passed the firm's third-party risk assessment last year, but shares no
  information about the model or its performance. Wrong categories can cause tax errors. How should the
  firm monitor the feature's performance?
options:
  A: Obtain the vendor's independent assurance report each year
  B: Check a regular sample against the correct treatment and track errors
  C: Run a fresh third-party risk assessment of the vendor
  D: Require staff to review each categorised claim before filing
answer: B
explanation:
  why_correct: When the model is a black box, the firm can still watch what comes out in its own process.
    Comparing a regular sample with the correct tax treatment gives an error rate the firm owns and can
    act on, including escalating to the vendor or adding review where errors cluster.
  why_not:
    A: An assurance report covers the vendor's controls, not how the feature performs on the firm's own
      claims.
    C: A vendor assessment was done last year and reviews the vendor's controls. It does not show how
      the feature categorises this firm's claims.
    D: Reviewing every claim removes most of the feature's value and is not monitoring. A sample shows
      whether such heavy review is needed.
