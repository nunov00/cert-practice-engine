id: aaig-d3-3.1-0040
subdomain: '3.1'
difficulty: medium
stem: A hospital trust has used AI to suggest diagnosis codes for patient records for four years; coders
  confirm or correct each suggestion. Most experienced coders have since retired, and newer staff have
  only ever worked with the AI. Quality audits now show coders miss more AI errors on complex cases than
  before. What should the governance leader recommend?
options:
  A: Route complex cases to the few remaining senior coders
  B: Increase quality audit sampling of complex cases
  C: Keep coder skill up with unaided practice and skill checks
  D: Require coders to justify each AI code they accept
answer: C
explanation:
  why_correct: The human check only works if the people doing it can still recognise a wrong answer. Years
    of reliance on the AI have worn that skill away. Treating coder skill as a control, with unaided practice
    on complex cases and regular competence checks, keeps the review meaningful.
  why_not:
    A: The few senior coders are a short-term buffer, and they too are retiring. The newer staff who do
      most of the work still cannot spot errors.
    B: More sampling finds more errors, but after they are made. It does not restore the reviewers' ability
      to catch them.
    D: Written justifications add paperwork, but someone without the expertise will still justify a wrong
      code. The problem is skill, not documentation.
