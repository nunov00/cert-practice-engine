subdomain: '3.1'
difficulty: medium
stem: A public pension administrator is introducing an AI service for member enquiries. The approved business
  case includes cutting contact centre staff by 40%. HR wants to make the reductions at go-live to capture
  savings in this financial year, although the AI has not yet run at full volume in production. What should
  the governance leader recommend?
options:
  A: Make the reductions at go-live to capture this year's savings
  B: Tie the reductions to agreed performance milestones in production
  C: Freeze hiring so that turnover delivers the saving over time
  D: Make half the reductions at go-live and the rest after a year
answer: B
explanation:
  why_correct: Removing capacity before the AI has proven itself at full volume leaves members exposed
    if it underperforms, and the expertise may be hard to rebuild. Tying reductions to agreed milestones
    in production still captures the approved benefit, once the evidence supports it.
  why_not:
    A: The approved case assumed the AI would work; it did not prove it. Acting before full-volume evidence
      risks service failure for members.
    C: A hiring freeze ties savings to turnover rather than to evidence. Capacity may fall before the
      AI is ready, or long after.
    D: Phasing by calendar still cuts staff before the AI has shown it can handle full volume.
