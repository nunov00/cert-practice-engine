subdomain: '3.1'
difficulty: medium
stem: An insurer's governance, risk and compliance platform records that its AI pricing controls are 'effective'
  based on annual self-assessments by model owners. Last year internal audit tested the monitoring controls
  and found them well designed, but could find no record that they ran. A regulator now asks for evidence
  that monitoring controls operated during the year. What would BEST strengthen the position for future
  years?
options:
  A: Feed monitoring outputs into the platform as control evidence
  B: Have the second line review a sample of self-assessments
  C: Move the model owners' self-assessments to a quarterly cycle
  D: Have internal audit test the monitoring controls each year
answer: A
explanation:
  why_correct: A self-assessment is an assertion, and audit has already shown that the operating record
    is missing. Feeding monitoring results, alerts and responses into the platform builds a continuous
    record that the controls ran during the year. That is what the regulator asked for, and it also gives
    audit something to test.
  why_not:
    B: Second-line review adds challenge, but it still reviews owners' assertions rather than evidence
      that controls operated.
    C: Quarterly assertions are more frequent but remain assertions. They do not prove the controls ran
      between the dates.
    D: Audit testing is valuable, but last year's test failed for lack of operating records. Testing again
      each year does not create the evidence the regulator and auditors need.
