stem: An insurer's governance, risk and compliance platform records that its AI pricing controls are 'effective'
  based on annual self-assessments by model owners. A regulator asks for evidence that monitoring controls
  operated during the year. What would BEST strengthen the position for future years?
options:
  A: Link monitoring outputs to the platform as control evidence
  B: Have the second line review a sample of self-assessments each year
  C: Ask model owners to complete their self-assessments every quarter
  D: Commission an external audit of the AI pricing models each year
answer: A
explanation:
  why_correct: A self-assessment is an assertion, not evidence that a control ran. Feeding monitoring results,
    alerts and responses directly into the GRC platform creates a continuous record that controls operated,
    which is what the regulator asked for, and reduces manual effort.
  why_not:
    B: Second-line review improves challenge, but it is still reviewing owners' assertions rather than evidence
      of operation throughout the year.
    C: Quarterly assertions are more frequent but remain assertions. They do not prove controls ran between
      the dates.
    D: An annual external audit gives point-in-time assurance and is costly. It does not create the ongoing
      evidence trail the regulator wants.
