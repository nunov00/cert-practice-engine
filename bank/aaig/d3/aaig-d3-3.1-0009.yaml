difficulty: easy
stem: A manufacturer is about to pilot an AI quality-inspection system on one production line before deciding
  whether to roll it out to all plants. When should the go/no-go criteria for the rollout decision be agreed?
options:
  A: After the pilot, once the results can be reviewed
  B: During the pilot, as the team learns what is realistic
  C: Before the pilot, with the accountable executive
  D: At rollout, by each plant manager for their own site
answer: C
explanation:
  why_correct: 'Criteria agreed in advance make the decision objective: the pilot is designed to produce exactly
    the evidence needed, and results cannot be rationalised afterwards. The accountable executive should own
    them because they will make, and answer for, the rollout decision.'
  why_not:
    A: Setting criteria after seeing results invites bias toward whatever the pilot achieved and makes the
      go/no-go decision a formality.
    B: Adjusting criteria mid-pilot has the same weakness in a milder form, and the pilot may not collect the
      data the final criteria need.
    D: Local judgment is useful for site readiness, but the enterprise-level rollout decision needs common
      criteria agreed before the evidence is gathered.
