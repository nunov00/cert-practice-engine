stem: A manufacturer will pilot an AI quality-inspection system on one production line before deciding
  whether to roll it out to all plants. The chief operating officer will make the rollout decision. The
  group quality director owns the company's inspection standards. Who should agree the go/no-go criteria
  for rollout before the pilot starts?
options:
  A: The group quality director, who owns the inspection standards
  B: The project team that will run the pilot on the line
  C: The chief operating officer, who will decide on the rollout
  D: Each plant manager, for the conditions at their own site
answer: C
explanation:
  why_correct: The person who will make and answer for the rollout decision should own the criteria it
    rests on. If the chief operating officer agrees them before the pilot starts, the later decision is
    judged against a standard set in advance, not one shaped by the results. The COO should draw on quality
    and plant input, but the criteria belong to the decision-maker.
  why_not:
    A: The quality director should shape the inspection criteria, but does not make the rollout decision.
      Criteria owned by someone other than the decision-maker can be set aside when the decision comes.
    B: The team running the pilot has an interest in its success and does not make the rollout decision.
    D: Plant managers can add site readiness checks, but an enterprise rollout needs one set of go/no-go
      criteria owned by whoever makes the decision.
