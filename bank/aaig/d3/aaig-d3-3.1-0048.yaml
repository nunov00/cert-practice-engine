subdomain: '3.1'
difficulty: medium
stem: A retail bank built a card fraud model meant to block suspicious payments as they happen. The core
  banking system, however, can only receive scores in an overnight batch, so the model flags fraud the
  day after it occurs. Six months after go-live, fraud savings are far below the business case, which
  assumed real-time blocking. What lesson should the governance leader draw for future AI investments?
options:
  A: Prefer bought models so that vendors carry integration work
  B: Judge benefits after a full year of operation
  C: Check integration with core systems before approval
  D: Track benefits monthly from go-live to spot shortfalls
answer: C
explanation:
  why_correct: The model's value depended on acting in real time, and the core system could not support
    that. This was knowable before approval. Business cases should check that existing systems can deliver
    the operating mode the benefits assume.
  why_not:
    A: A bought model would face the same overnight constraint in the core system. The problem is integration,
      not who built the model.
    B: Waiting will not close the gap, because a next-day flag cannot block fraud that has already happened.
    D: Monthly tracking would reveal the shortfall sooner, but only after the money is spent. The lesson
      is to catch the constraint before approval.
