difficulty: medium
stem: A garden supplies retailer in northern Europe sees its AI demand-forecasting error rise every winter,
  when sales are low and erratic. This year the rise has tripped the drift alert, and the operations team
  wants an urgent retrain. Past winters show the same pattern, with accuracy recovering by spring. What
  should the governance leader advise?
options:
  A: Retrain the model on recent winter data to clear the alert
  B: Compare with past winters and set seasonal thresholds
  C: Add seasonal features to the model at the next retrain
  D: Escalate the breach to the model risk committee to decide
answer: B
explanation:
  why_correct: A known seasonal pattern is not the same as degradation. Comparing this winter with earlier
    winters shows whether the model is worse than its normal seasonal level. Season-aware thresholds then
    fire on true deterioration rather than on the calendar, and retraining is decided on evidence.
  why_not:
    A: An alert breach calls for assessment, not an automatic fix. Retraining on low, erratic winter data
      may make the model worse for the rest of the year.
    C: Seasonal features may improve the model later, but the alert would keep firing each winter until
      then, and the current breach still needs judging.
    D: Escalation suits a breach that needs a risk decision. Here the data to judge it is at hand, and
      the committee would first need that comparison anyway.
