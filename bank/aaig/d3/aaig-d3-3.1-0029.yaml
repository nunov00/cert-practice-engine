subdomain: '3.1'
difficulty: medium
stem: A city council deployed an AI tool to speed up planning permit decisions. The business case set
  a 25% target for faster processing, and the planning director owned the benefit. A year later, the council
  claims a 30% improvement, based on staff recollection of how long permits took before launch. Councillors
  question the figure. What lesson should the governance leader draw for future AI initiatives?
options:
  A: Have internal audit verify benefit figures before publication
  B: Measure processing times before launch as the baseline
  C: Name an accountable benefit owner for each AI initiative
  D: Define benefit measures and targets in each business case
answer: B
explanation:
  why_correct: A benefit can only be shown against a reliable starting point. Recollection is not measurement.
    Measuring processing times before launch, as part of the benefits plan, is what makes a later improvement
    credible. Without it the claim is open to challenge, however it is reviewed.
  why_not:
    A: Audit can add credibility, but without a baseline the auditor faces the same problem. The fix belongs
      before launch.
    C: Ownership matters, but this benefit already had an owner. An owner without a baseline still cannot
      prove the improvement.
    D: This business case already set a measure and a target. A target is of little use without a measured
      starting point to compare against.
