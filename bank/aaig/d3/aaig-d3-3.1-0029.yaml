subdomain: '3.1'
difficulty: medium
stem: A city council deployed an AI tool to speed up planning permit decisions. A year later, it claims a 30%
  improvement, but nobody measured processing times before the launch. Councillors question the figure. What
  lesson should the governance leader draw for future AI initiatives?
options:
  A: Avoid publishing any benefit figures until an external audit
  B: Measure a baseline before launch in the benefits plan
  C: Use staff estimates of time saved as the main benefit measure
  D: Report adoption rates instead of benefit figures in future
answer: B
explanation:
  why_correct: Benefits can only be shown by comparing results with a reliable starting point. Capturing a
    baseline before launch, with agreed measures and owners, should be part of every benefits realisation plan;
    without it, any claimed improvement is open to challenge.
  why_not:
    A: External audit can add credibility, but without a baseline the auditor faces the same problem. The fix
      belongs at the start.
    C: Staff estimates are subjective and prone to optimism. They are a weak substitute for measured before-and-after
      data.
    D: Adoption shows usage, not value. Swapping to it avoids the question councillors are asking.
