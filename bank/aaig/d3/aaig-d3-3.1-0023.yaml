subdomain: '3.1'
difficulty: medium
stem: A hospital uses an AI service to schedule nursing shifts. The service has never failed, but it depends
  on an external cloud provider. The hospital's business impact analysis already rates the service as
  critical. What should the governance leader confirm is in place?
options:
  A: An availability service level with penalties in the contract
  B: A business impact analysis covering the scheduling service
  C: Regular reports from the provider on availability and incidents
  D: A tested way to produce rosters when the service is down
answer: D
explanation:
  why_correct: Any service can fail, from the provider, the network or the AI service itself. For nurse
    staffing the hospital needs its own documented, tested way to keep scheduling during an outage. That
    keeps wards staffed whatever the cause.
  why_not:
    A: Penalties compensate the hospital after an outage. They do not staff the wards while it lasts.
    B: The impact analysis is already done and rates the service critical. The next step is to make sure
      the hospital can keep rostering when the service fails.
    C: Reports describe past performance. They do not help the hospital on the day the service fails.
