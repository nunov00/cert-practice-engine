id: aaig-d3-3.1-0023
subdomain: '3.1'
difficulty: easy
stem: A hospital uses an AI service to schedule nursing shifts. The service has never failed, but it depends
  on an external cloud provider. What should the governance leader confirm is in place?
options:
  A: A clause in the contract that guarantees the service never fails
  B: A second AI vendor kept on standby for immediate switching
  C: A monthly report from the provider on its past availability
  D: A tested fallback process for scheduling when the service is down
answer: D
explanation:
  why_correct: Any service can fail. For a critical operation such as nurse staffing, the hospital needs a
    documented, tested way to keep scheduling if the AI service is unavailable. That keeps patient care safe
    regardless of the cause of the outage.
  why_not:
    A: No provider can guarantee zero failure, and a contractual promise does not keep wards staffed during
      an outage.
    B: A standby vendor is costly and may still take time to switch to. A manual or simpler fallback is usually
      more proportionate.
    C: Past availability reports describe history, not readiness. They do not help on the day the service fails.
