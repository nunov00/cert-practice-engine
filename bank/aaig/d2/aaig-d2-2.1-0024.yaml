subdomain: '2.1'
difficulty: medium
stem: A retail bank runs all its generative AI uses on one external model provider. Architects propose
  an abstraction layer so models can be switched, which adds cost and some performance loss. The CFO asks
  whether it is worth it. What is the BEST basis for the decision?
options:
  A: Whether the provider contract gives enough notice of model changes
  B: How critical the uses are and the impact of losing the provider
  C: How likely the provider is to fail or withdraw the models it offers
  D: How much the bank already spends with the provider each year
answer: B
explanation:
  why_correct: Portability is a form of insurance; its value depends on what is at stake. If critical
    customer services depend on one provider, the cost of an abstraction layer may be justified by resilience
    and bargaining power. If the uses are minor, simpler exit terms may suffice. The decision should be
    proportionate to concentration risk.
  why_not:
    A: Notice terms reduce one risk, a model change. They do not address provider failure or withdrawal,
      and they do not tell the CFO what protection is worth.
    C: Likelihood is half the picture. Even a stable provider can justify the layer if critical services
      depend on it, and a fragile one may not if the uses are minor.
    D: Spend shows commercial weight, not what the bank stands to lose if the provider goes. A small spend
      can support a critical service.
