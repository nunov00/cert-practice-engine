id: aaig-d2-2.1-0020
subdomain: '2.1'
difficulty: medium
stem: A pharmaceutical company built an assistant that retrieves from all internal document stores to
  help teams with their own project files. During testing, a junior employee received a summary of an
  unreleased merger plan. The project team suggests a warning in the user terms. What should the governance
  lead require?
options:
  A: Restrict the index to documents marked for company-wide sharing
  B: Make retrieval enforce each user's existing document permissions
  C: Add sensitivity labels to the index and block restricted content
  D: Restrict the assistant to staff cleared for restricted documents
answer: B
explanation:
  why_correct: The flaw is that retrieval ignores the access controls on the source documents. The assistant
    should only retrieve what the requesting user may already read, so it cannot become a route around
    existing permissions. This fixes the cause, which a warning in the user terms would not.
  why_not:
    A: This would keep sensitive files out, but it also removes the project files teams are meant to work
      with, which are rarely marked for company-wide sharing.
    C: Labels are often missing or wrong, and blocking restricted content stops people who are entitled
      to it. It does not follow each user's actual rights.
    D: Clearance for restricted documents does not entitle staff to every project's files. The permission
      gap would remain for those users.
