id: aaig-d2-2.1-0020
subdomain: '2.1'
difficulty: hard
stem: A pharmaceutical company built an assistant that retrieves from its internal document stores to
  help staff with project work. In testing, a finance analyst cleared for confidential material received
  a summary of an unreleased merger plan from a folder only the deal team can open. Team membership changes
  weekly as projects start and end. Which design change BEST closes the gap?
options:
  A: Screen generated answers for sensitive content before display
  B: Make retrieval check each user's current document permissions
  C: Copy each document's access list into the index at indexing time
  D: Make retrieval match each user's clearance to sensitivity labels
answer: B
explanation:
  why_correct: The folder's access list already said who may see the plan, but the assistant retrieved
    it with its own broad access. Checking each user's current permissions at query time makes the assistant
    honour exactly the access the user has in the source, and it stays right as team membership changes
    each week.
  why_not:
    A: Output screening judges how sensitive the content is, not whether this user may see it. Confidential
      material is normal in project work, so the screen would either block legitimate answers or pass the
      merger plan.
    C: Copying access lists into the index enforces the source permissions, but only as they stood when
      each document was indexed. With team membership changing weekly, people who leave a project would
      keep seeing its files until the next re-index.
    D: Clearance against labels controls sensitivity, not need to know. The analyst is cleared for confidential
      material, so a confidential merger plan would still reach her although she is not on the deal team.
