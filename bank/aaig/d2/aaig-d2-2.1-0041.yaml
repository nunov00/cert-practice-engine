stem: A law firm's retention schedule requires client files to be destroyed six years after a matter closes.
  Its AI research assistant draws on a vector store built from text chunks and embeddings of past client
  files. When records management destroys an expired file, nothing changes in the vector store. What should
  the governance lead require?
options:
  A: Give the vector store its own retention period suited to knowledge tools
  B: Rebuild the vector store each quarter from the client files still held
  C: Restrict retrieval to matters closed less than six years ago
  D: Bring the vector store under the retention rules of its source files
answer: D
explanation:
  why_correct: The vector store holds text chunks and representations derived from client files, and the
    assistant can surface that content. It is a data asset that should follow the retention rules of its
    sources. Destroying a source file should then trigger removal of its derived entries.
  why_not:
    A: A separate period breaks the link with the source files. Content could outlive a destroyed file,
      which breaks the firm's commitment for the client.
    B: A quarterly rebuild leaves expired content held for up to three months and keeps the store outside
      normal records governance.
    C: Filtering by date hides expired content but still holds it, so the firm breaks its destruction
      commitment. It also misses files destroyed for other reasons.
