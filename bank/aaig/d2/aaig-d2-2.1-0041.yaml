stem: A law firm's retention schedule requires client files to be destroyed six years after a matter closes.
  Its AI research assistant draws on a vector store built from text chunks and embeddings of past client
  files. When records management destroys an expired file, nothing changes in the vector store. What should
  the governance lead require?
options:
  A: Exclude the vector store from the schedule, since embeddings are not documents
  B: Rebuild the vector store once a year from the files still held at that time
  C: Disable the assistant until the firm proves no expired content remains
  D: Register the vector store as a data asset under the same retention rules
answer: D
explanation:
  why_correct: The vector store holds text chunks and representations derived from client files, and the
    assistant can surface that content. It is a new data asset and should be inventoried, classified and
    covered by the retention schedule, with deletion of a source file triggering removal of its derived
    entries. This keeps the firm's retention commitments true across every copy.
  why_not:
    A: The store contains readable chunks of client text, and embeddings can reveal content. Excluding
      it means destroyed files survive in another form.
    B: A yearly rebuild leaves expired content available for up to a year and treats the store as outside
      normal records governance.
    C: Shutting the tool down may be an overreaction while a fix is designed. The lasting need is to bring
      the store under retention control.
