subdomain: '2.1'
difficulty: medium
stem: A European public agency wants to use a cloud AI service to summarise citizen case files. The provider's
  public-sector terms bar it from training on agency data. Its default processing region is outside the
  agency's jurisdiction. What should the governance lead check FIRST?
options:
  A: Whether the provider's security certifications cover the AI service
  B: Whether the provider's terms meet public procurement rules
  C: Whether the provider can process in-region for an added fee
  D: Whether residency rules allow processing in that location
answer: D
explanation:
  why_correct: Citizen case files are likely subject to residency obligations and rules on cross-border
    transfer. Where the data is processed is a threshold question. If the location is not permitted, the
    service cannot be used in its default form, however secure, accurate or cheap it is.
  why_not:
    A: Certification is an important check, but secure processing in a place the agency may not use is
      still not allowed. Location comes first.
    B: Procurement rules govern how the service is bought. They do not decide whether the files may be
      processed outside the jurisdiction.
    C: An in-region option may be the fix, but whether it is needed depends on what the residency rules
      allow. That check comes first.
