id: aaig-d2-2.1-0023
subdomain: '2.1'
difficulty: medium
stem: A mid-sized insurer is about to sign a five-year contract for an AI claims platform. The vendor
  stores models and data in a proprietary format. What should the governance lead insist on before signing?
options:
  A: A discount for committing to the full five years
  B: A seat for the insurer on the vendor's customer product advisory board
  C: An exit plan with data and model export in usable formats
  D: A guarantee that the vendor will not change its prices
answer: C
explanation:
  why_correct: Lock-in becomes a governance risk when the organisation cannot leave without losing its
    data or models. Agreeing exit terms before signing, including export of data, model artefacts and
    logs in usable formats, keeps options open and strengthens the insurer's position for the whole contract.
  why_not:
    A: A discount makes the commitment cheaper but deepens lock-in. It does nothing to make leaving possible.
    B: Influence on the roadmap is nice to have, but it does not give the insurer a way out if the vendor
      fails or underperforms.
    D: Price protection covers one risk but not the risks of vendor failure, poor performance or changing
      needs.
