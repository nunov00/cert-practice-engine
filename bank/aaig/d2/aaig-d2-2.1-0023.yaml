id: aaig-d2-2.1-0023
subdomain: '2.1'
difficulty: medium
stem: A mid-sized insurer is about to sign a five-year contract for an AI claims platform. The vendor
  stores models and data in a proprietary format. What should the governance lead insist on before signing?
options:
  A: A termination right if the vendor misses agreed service levels
  B: Source code escrow released to the insurer if the vendor fails
  C: Exit terms with export of data and models in usable formats
  D: A transition clause with vendor support for a set handover period
answer: C
explanation:
  why_correct: Lock-in becomes a governance risk when the organisation cannot leave without losing its
    data or models. With a proprietary format and five years ahead, agreed exit terms keep options open.
    Export of data, model artefacts and logs in usable formats strengthens the insurer's position for
    the whole contract.
  why_not:
    A: A right to terminate is of little use if the insurer cannot take its data and models with it. Leaving
      would still mean starting again.
    B: Escrow helps only if the vendor fails. Source code does not return the insurer's data and models
      in a usable form, and it does not help if the insurer simply wants to leave.
    D: Vendor help during a handover is useful, but if data and models can only be read on the vendor's
      platform there is little to hand over.
