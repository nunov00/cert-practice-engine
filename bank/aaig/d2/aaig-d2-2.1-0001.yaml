subdomain: '2.1'
difficulty: easy
stem: A retail bank's analytics team wants to use five years of card transaction data to train a fraud
  model. The data platform team has granted them technical access. Who should approve whether this data
  may be used for the new purpose?
options:
  A: The business data owner accountable for the transaction data
  B: The platform administrator who granted the technical access
  C: The lead data scientist building the fraud model
  D: The data steward who maintains the data definitions and quality rules
answer: A
explanation:
  why_correct: 'Decisions about whether data may be used, and for what, belong to the data owner: the
    business leader accountable for that data set and its risks. Technical access is not the same as permission
    to use the data for a new purpose. The owner weighs the business value against privacy, contractual
    and reputational risk and is answerable for the decision.'
  why_not:
    B: The administrator acts as a custodian who implements controls on the owner's instructions. Granting
      access is an operational act, not authority to approve a new use of the data.
    C: The data scientist is the requester. Letting the user of the data approve its own use removes the
      independent accountability that ownership is meant to provide.
    D: The steward manages definitions, quality rules and day-to-day data care, and often advises the
      owner. The steward does not normally hold the authority to approve new uses.
