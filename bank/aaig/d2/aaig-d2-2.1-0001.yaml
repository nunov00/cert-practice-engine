stem: A retail bank's analytics team wants to use five years of card transaction data to train a fraud
  model. The platform team can grant access, and the privacy office has confirmed a lawful basis exists.
  Who should decide whether the data may be used for this new purpose?
options:
  A: The head of cards, who is accountable for the transaction data
  B: The privacy officer, who confirmed the lawful basis for the use
  C: The model risk committee, which will validate the fraud model
  D: The data steward, who maintains the definitions and quality rules
answer: A
explanation:
  why_correct: Decisions about whether data may be used, and for what, belong to the data owner. That
    is the business leader accountable for the data set and its risks, here the head of cards. A lawful
    basis shows the use is permitted, not that it is wise. The owner weighs the value against contractual,
    customer and reputational risk and answers for the decision.
  why_not:
    B: The privacy office decides whether a use is lawful, and its view is an input. Whether the bank
      should use its card data this way is a business decision the owner is accountable for.
    C: The committee judges whether the model is sound once it is built. It does not decide whether a
      business unit's data may be put to a new use in the first place.
    D: The steward manages definitions and quality and often advises the owner. The steward does not hold
      the authority to approve new uses of the data.
