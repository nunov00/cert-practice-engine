difficulty: hard
stem: A large conglomerate plans to move from a central data lake to an approach in which each business
  domain publishes its own data products for AI teams to use. Each domain head will own its products.
  Domain heads welcome the autonomy. What should the governance lead insist on as a condition of the change?
options:
  A: Shared standards on quality, metadata and access for every product
  B: Central data team approval of each new data product before release
  C: A named domain owner accountable for each data product
  D: A central catalogue where each domain registers its products
answer: A
explanation:
  why_correct: Decentralised ownership can improve quality and speed, but without common rules each domain's
    products become incompatible and uneven in control. Enterprise standards for quality, metadata and
    access, ideally checked automatically, keep domain autonomy within a governed whole.
  why_not:
    B: A central approval gate for every product recreates the bottleneck the change is meant to remove.
    C: Named owners are needed, but each owner would still apply its own rules. Products would remain
      hard to combine and uneven in control.
    D: A catalogue makes products findable, but it does not set the quality, metadata or access rules
      they must meet.
