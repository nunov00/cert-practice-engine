id: aaig-d2-2.1-0049
subdomain: '2.1'
difficulty: easy
stem: A payroll software company serving 3,000 business clients wants to add an AI feature that predicts
  payroll errors. Its engineers propose one shared model trained on all clients' payroll data. Client
  contracts say each client's data is used only to provide the service to that client. What should the
  governance lead require in the design?
options:
  A: Pool the data now and add a consent clause at each contract renewal
  B: Pseudonymise client and employee identifiers before any pooled training
  C: Pool the data after a privacy impact assessment of the shared model
  D: Keep each client's data in its own scope unless that client agrees
answer: D
explanation:
  why_correct: The contracts limit each client's data to that client's service, so the architecture must
    keep tenants separate by default. Pooled training is possible only where clients have agreed, for
    example through an opt-in with clear terms. This keeps the company within its commitments while still
    allowing a shared model where permitted.
  why_not:
    A: Seeking agreement at renewal is reasonable, but pooling now breaches the current contracts for
      every client that has not yet agreed.
    B: Pseudonymising does not change the purpose for which the data is used, and payroll data stays identifiable
      in many ways. The contracts still forbid the use.
    C: An impact assessment examines privacy risk but cannot override what the contracts promise each
      client.
