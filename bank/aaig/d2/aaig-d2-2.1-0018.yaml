subdomain: '2.1'
difficulty: medium
stem: A regional hospital network must choose between building a sepsis-alert model in-house and buying
  a certified product. Both met the network's accuracy threshold in local testing. The in-house team argues
  building is cheaper. Which consideration should weigh MOST in the governance view?
options:
  A: Which option the network can monitor and support over its life
  B: Which option carries a regulatory certification for clinical use
  C: Which option has the lower total cost of ownership over five years
  D: Which option gives the network more control over the model's design
answer: A
explanation:
  why_correct: Both options meet the accuracy threshold, so the decision turns on whether the network
    can keep the system safe across its life. That covers validation, monitoring, retraining, accountability
    and support. A cheaper build the network cannot sustain is a poor choice for a patient-safety use.
  why_not:
    B: Certification shows the product met requirements at a point in time. It does not show that the
      network can keep it safe as patients and practice change.
    C: Total cost is a fair way to answer the in-house team's claim, but cost is secondary to whether
      the network can control the risk to patients.
    D: Design control helps only if the network has the skills and resources to use it. The governance
      question is whether it can sustain the model, not whether it can shape it.
