id: aaig-d2-2.1-0005
subdomain: '2.1'
difficulty: medium
stem: A regulator asks a telecom operator which data sources fed the churn model that set retention offers
  last year. The model was retrained several times as pipelines changed. The team can only rebuild the
  answer from emails and memory. What should the governance lead establish to prevent this?
options:
  A: Lineage captured automatically from source to each model version
  B: An annual attestation by each model owner of the sources used
  C: Source documentation required in each model's validation report
  D: A data inventory linking each production model to approved sources
answer: A
explanation:
  why_correct: Lineage shows where data came from, how it was transformed and which model version used
    it. Captured automatically in the pipelines, it stays complete as they change. The operator can then
    answer for any past version without relying on memory.
  why_not:
    B: An attestation is a statement after the fact and depends on the owner's recollection. It adds accountability
      but not the evidence trail the regulator asks for.
    C: A validation report records sources at the time of validation. Later retraining and pipeline changes
      are not captured, so it would not show what fed last year's versions.
    D: An inventory records the sources a model is approved to use. It does not show what actually flowed
      into a given version after the pipelines changed.
