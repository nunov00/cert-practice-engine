difficulty: medium
stem: A news publisher will use generative AI to create illustrations for some articles. Readers and partner
  sites need to be able to tell which images are AI-generated, even after the images are shared elsewhere.
  Which design requirement BEST meets this need?
options:
  A: Attach machine-readable provenance data to each image at creation
  B: Embed an invisible watermark that the publisher's own tools detect
  C: Add a visible label to each image where it is published
  D: Record each image's AI origin in the publisher's asset register
answer: A
explanation:
  why_correct: The need is for the origin of each image to stay identifiable wherever it travels. Embedding
    provenance data in the image when it is created, using an open standard where possible, makes the
    AI origin travel with the content. That is what traceability by design means for generated material.
  why_not:
    B: A proprietary watermark does travel with the image, but partner sites and readers cannot read it,
      so they still cannot tell.
    C: A label on the publisher's page is lost as soon as the image is shared elsewhere.
    D: An asset register supports the publisher's own records but is invisible to readers and partner
      sites.
