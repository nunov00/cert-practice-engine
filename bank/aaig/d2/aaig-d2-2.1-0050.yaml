subdomain: '2.1'
difficulty: easy
stem: A news publisher will use generative AI to create illustrations for some articles. Readers and partner
  sites need to be able to tell which images are AI-generated, even after the images are shared elsewhere.
  Which design requirement BEST meets this need?
options:
  A: Attach machine-readable provenance data to each image when it is created
  B: Mention the use of AI on the publisher's editorial policy page
  C: Keep an internal log of which images were generated with AI
  D: Generate images only in a cartoon style so that readers can recognise them
answer: A
explanation:
  why_correct: The need is for the origin of each image to remain identifiable wherever it travels. Embedding
    provenance information in the image at creation, using an open standard where possible, makes the
    AI origin travel with the content, which is what traceability by design means for generated material.
  why_not:
    B: A policy page tells readers AI is used somewhere but does not identify individual images, and it
      does not travel with shared images.
    C: An internal log supports the publisher's own records but is invisible to readers and partner sites.
    D: A visual style is not a reliable signal, restricts editorial choice and can be imitated by images
      that are not AI-generated.
