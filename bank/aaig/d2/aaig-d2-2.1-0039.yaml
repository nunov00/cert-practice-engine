id: aaig-d2-2.1-0039
subdomain: '2.1'
difficulty: medium
stem: A retail group runs separate AI models for demand forecasting, pricing and promotions, built by
  different units. Each unit keeps its own product hierarchy and store list. The models now give conflicting
  recommendations for the same products, and executives cannot reconcile the reports. What is the BEST
  architecture principle to adopt?
options:
  A: Manage the three models under one central model owner
  B: Manage product and store data in one warehouse fed by each unit
  C: Manage product and store data as master data with one owner
  D: Manage the reports through one reconciled executive dashboard
answer: C
explanation:
  why_correct: The conflict comes from inconsistent reference data, not from the models. Managing products
    and stores as master data, with an accountable owner and one authoritative source, removes the cause.
    Separate models then stay consistent with each other and with reporting.
  why_not:
    A: The models serve different decisions and can rightly stay separate. One model owner would not fix
      the inconsistent hierarchies the models are fed.
    B: One warehouse puts the data in one place, but each unit would still feed its own hierarchy. With
      no owner deciding the one true version, the conflict remains.
    D: A reconciled dashboard hides the inconsistency at the reporting layer. The models would still give
      conflicting recommendations.
