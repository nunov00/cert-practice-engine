id: aaig-d2-2.1-0039
subdomain: '2.1'
difficulty: hard
stem: A retail group runs separate AI models for demand forecasting, pricing and promotions, built by
  different units. The group already has an agreed business glossary defining products and stores, yet
  each unit keeps its own product hierarchy and store list. The models give conflicting recommendations
  for the same products. What is the BEST architecture principle to adopt?
options:
  A: Manage product and store definitions through the business glossary
  B: Manage product and store data in one warehouse fed by each unit
  C: Manage product and store data as master data with one owner
  D: Manage the models' inputs through one shared feature store
answer: C
explanation:
  why_correct: The conflict comes from inconsistent reference data, not from the models or the definitions.
    The glossary already agrees what a product and a store mean, but each unit holds its own values and
    hierarchies. Managing products and stores as master data, with an accountable owner and one authoritative
    source, removes the cause, so separate models stay consistent with each other and with reporting.
  why_not:
    A: The glossary exists and agrees the meaning of terms. Shared definitions do not give
      one authoritative list of products, stores and hierarchies, which is where the units differ.
    B: One warehouse puts the data in one place, but each unit would still feed its own hierarchy. With
      no owner deciding the one true version, the conflict remains.
    D: A feature store shares computed features across models, but the features would still be built from
      each unit's own hierarchy unless the reference data itself is mastered.
