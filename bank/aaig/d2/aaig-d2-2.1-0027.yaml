id: aaig-d2-2.1-0027
subdomain: '2.1'
difficulty: medium
stem: A national statistics office plans to release synthetic data derived from census records so researchers
  can train models. Leadership assumes synthetic data carries no privacy risk. What should the governance
  lead advise?
options:
  A: Test it for statistical fidelity against the census before release
  B: Test it for usefulness with a group of pilot researchers
  C: Test it for re-identification risk before release
  D: Release it under a licence that bars attempts at re-identification
answer: C
explanation:
  why_correct: Synthetic data can leak information about real people, especially outliers, if the generator
    copies them too closely. Leadership's assumption needs evidence. Testing disclosure risk before release
    shows whether the data is safe and what changes are needed.
  why_not:
    A: Fidelity shows usefulness, not safety. High fidelity can mean the data mirrors real records too
      closely, which raises privacy risk.
    B: A pilot tests whether researchers can use the data, not whether it reveals people. It also releases
      the data before the risk is known.
    D: A licence gives recourse against misuse but does not show whether the data itself reveals people.
      It relies on every recipient complying.
