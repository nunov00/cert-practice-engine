id: aaig-d2-2.1-0010
subdomain: '2.1'
difficulty: hard
stem: A fitness app trains a personalisation model on users who consented. Several users withdraw consent
  each month, and retraining from scratch costs a great deal. The board asks how the architecture should
  handle this. What should the governance lead recommend?
options:
  A: Delete withdrawn users' raw records and keep the model unchanged
  B: Retrain the model from scratch whenever a user withdraws consent
  C: Apply machine unlearning to remove each user on withdrawal
  D: Record training data per version and retrain on a set cycle
answer: D
explanation:
  why_correct: Consent withdrawal should flow through to models that may still reflect the data, not only
    to raw records. Recording which records trained each version makes it possible to exclude withdrawn
    data. A set retraining cycle gives a predictable, defensible time within which the model stops reflecting
    it, at a cost the business can plan.
  why_not:
    A: The model may still reflect the withdrawn data, so deleting raw records alone may not honour the
      withdrawal. It treats the model as outside the user's choice.
    B: This honours withdrawals fastest, but several users withdraw each month and full retraining is
      very costly. The cost is out of proportion when a set cycle gives a defensible time limit.
    C: Unlearning methods are still hard to verify for most model types. The company could not show that
      a user's influence was removed, so it would still need a retraining path.
