subdomain: '2.1'
difficulty: easy
stem: A review at a media group finds API keys for a paid AI service pasted directly into shared notebooks
  and scripts. What is the BEST principle to apply?
options:
  A: Rotate the keys every year and keep them in the notebooks
  B: Ask staff to delete the notebooks after each project ends
  C: Store keys in a secrets vault and retrieve them at run time
  D: Share one key across all teams to make tracking simpler
answer: C
explanation:
  why_correct: Credentials embedded in code are easily copied, leaked or committed to repositories. Keeping
    them in a managed vault, issued per application and retrieved at run time, controls who can use them
    and allows quick revocation.
  why_not:
    A: Yearly rotation helps a little, but keys stay exposed in shared notebooks for most of the year.
    B: Deletion is unreliable and still leaves keys exposed while projects run.
    D: A single shared key removes accountability and means any leak affects everyone.
