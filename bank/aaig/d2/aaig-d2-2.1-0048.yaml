stem: An engineering company's AI assistant answers staff questions from its intranet document library.
  Users report answers based on withdrawn procedures, and it turns out nobody is responsible for keeping
  most library content current or removing obsolete versions. What should the governance lead recommend?
options:
  A: Give the AI team responsibility for flagging outdated documents
  B: Give the intranet team responsibility for archiving old versions
  C: Give each content collection a named owner accountable for currency
  D: Give users a way to report outdated answers directly to the AI team
answer: C
explanation:
  why_correct: The assistant is only as reliable as the content it draws on, and the root cause is that
    the library has no owners. Owners for each collection review, update and archive content. This applies
    normal data governance to unstructured content and fixes the problem for the assistant and for human
    readers alike.
  why_not:
    A: The AI team can spot suspect answers but cannot know which procedures the business has withdrawn.
      It is not accountable for the content.
    B: The intranet team runs the library but does not know which procedures are current. Archiving needs
      someone who owns the content.
    D: User reports catch problems after staff are given wrong procedures, and they still need someone
      accountable to fix the content.
