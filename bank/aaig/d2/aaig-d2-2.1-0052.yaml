subdomain: '2.1'
difficulty: medium
stem: A social media company outsources the labelling of violent and abusive content to train its moderation
  model. A media investigation reports that the supplier's annotators are poorly paid, view disturbing
  material for full shifts and get no psychological support. The labels themselves are of high quality.
  What should the governance lead recommend?
options:
  A: Commission independent audits of working conditions at each annotation supplier
  B: Add welfare clauses to each annotation supplier contract at renewal
  C: Set welfare standards for annotation suppliers and verify they are met
  D: Require the supplier to provide psychological counselling for annotators
answer: C
explanation:
  why_correct: Training data is part of the AI supply chain, and how it is produced is a governance and
    ethics issue as well as a quality one. The company should set clear standards for pay, exposure limits
    and psychological support for annotation work, write them into contracts and check compliance, whether
    the work stays with this supplier or moves.
  why_not:
    A: Audits show what is happening, but without agreed standards for pay, exposure limits and support
      there is nothing to audit against, and findings bind no supplier to change.
    B: Clauses applied at renewal leave current annotators unprotected until each contract comes up, and
      with no checking nobody knows whether suppliers meet them.
    D: Counselling addresses one harm, but not low pay or the length of exposure, and it applies only
      to this supplier.
