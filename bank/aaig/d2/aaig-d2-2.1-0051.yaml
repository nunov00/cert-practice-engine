subdomain: '2.1'
difficulty: medium
stem: A supermarket loyalty programme's model groups shoppers into segments. One segment, labelled 'likely
  expecting a baby', is inferred from purchases and used for targeted offers. The data team says the model
  holds no sensitive data, as it uses only shopping baskets. What should the governance lead advise?
options:
  A: Treat the basket data as sensitive because it reveals buying habits
  B: Treat inferences as data and classify them by their sensitivity
  C: Treat the segment as marketing data covered by programme consent
  D: Treat the targeting as a fairness issue for the ethics committee
answer: B
explanation:
  why_correct: An inference about pregnancy is health-related information even if every input was ordinary.
    Classification must cover what models infer, not only what they ingest. Inferred attributes then get
    the protections, purpose limits and access rules their sensitivity demands.
  why_not:
    A: Ordinary baskets are not health data, and classifying all of them as sensitive would be excessive.
      The sensitive element is what the model concludes from them.
    C: Programme consent covered ordinary marketing, not inferences about pregnancy. Calling it marketing
      data repeats the team's error.
    D: Ethics review may help, but the immediate gap is classification. Until the inference is recognised
      as health-related, it lacks the protections and limits it needs.
