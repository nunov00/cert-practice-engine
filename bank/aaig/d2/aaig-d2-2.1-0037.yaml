id: aaig-d2-2.1-0037
subdomain: '2.1'
difficulty: medium
stem: A bank's data science team built a customer income-estimation model approved for setting credit
  card limits. The collections team wants to reuse it to decide which customers to pursue first. Reuse
  would save months. What should the governance lead advise?
options:
  A: Reuse it once the collections team tests its accuracy on their cases
  B: Reuse it once model risk confirms the original validation still holds
  C: Reuse it with a monitoring plan for collections outcomes
  D: Reuse it once it is assessed and approved for the collections purpose
answer: D
explanation:
  why_correct: Reuse of shared assets saves cost, but an approval covers a specific purpose. Collections
    is a different decision with different impacts, fairness concerns and data permissions. An assessment
    for the new use, which may confirm reuse with conditions, has to come before the model is applied.
  why_not:
    A: Accuracy is one question, but collections raises new questions of fairness, impact and permission
      to use the data. The team that wants the model should not be the one to confirm it.
    B: The original validation tested fitness for setting credit limits. Confirming it still holds says
      nothing about how the model behaves when it decides whom to pursue for debt.
    C: Monitoring finds harm after customers have been pursued. The fairness and permission questions
      of the new use need answering before it starts.
