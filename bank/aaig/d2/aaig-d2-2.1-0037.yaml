id: aaig-d2-2.1-0037
subdomain: '2.1'
difficulty: hard
stem: A bank's income-estimation model was approved by the credit committee for setting card limits. The
  collections team wants to reuse it to rank which customers to contact first about missed payments. Collections
  decisions, including how customers in financial difficulty are treated, fall under the operations risk
  committee. The credit committee offers to review the new use, which would save months. What is the BEST
  route for the governance lead to advise?
options:
  A: Reuse once model risk revalidates the model for the collections use
  B: Reuse once a privacy impact assessment covers the collections use
  C: Reuse once the credit committee assesses and approves the new use
  D: Reuse once operations risk assesses and approves the new use
answer: D
explanation:
  why_correct: An approval covers a specific purpose and comes from whoever is accountable for that kind
    of decision. Ranking customers for collections is a new decision with its own impacts, and it falls
    under the operations risk committee, which owns how customers in difficulty are treated. A full assessment
    and approval by that committee puts the decision with the accountable owner, drawing on model and privacy
    work as inputs.
  why_not:
    A: Revalidation tests whether the model is accurate enough for collections, but not whether ranking
      customers this way treats those in difficulty fairly or is permitted. It is an input to the approval,
      not the approval.
    B: A privacy assessment answers whether the income data may be used for collections. It leaves the model's
      fitness and the treatment of customers in difficulty unassessed.
    C: The credit committee would assess the whole use and save months, but collections decisions are not
      its to approve. The committee that owns the treatment of customers in difficulty would be bypassed.
