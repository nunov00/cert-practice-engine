id: aaig-d2-2.1-0015
subdomain: '2.1'
difficulty: medium
stem: An insurer's governance committee wants a minimum metadata standard for data sets registered for
  AI use. Reviewers must be able to decide from it whether a proposed AI use may go ahead. Which set of
  fields should be mandatory?
options:
  A: Owner, steward, retention period and next review date
  B: Steward, sensitivity, lineage and retention period
  C: Owner, source, lineage and usage history
  D: Owner, sensitivity, permitted uses and quality status
answer: D
explanation:
  why_correct: Reviewers need to know who is accountable, how sensitive the data is, which uses are allowed
    and whether it is fit. These fields answer the questions that decide whether a proposed use may go
    ahead.
  why_not:
    A: These fields support data management and accountability, but they do not say how sensitive the
      data is or which uses are allowed, so reviewers still cannot decide.
    B: Sensitivity helps, but without an owner and permitted uses reviewers do not know who answers for
      the data or whether the proposed use is allowed.
    C: These fields show who owns the data and where it came from. Without sensitivity and permitted uses,
      they do not support an approval decision.
