id: aaig-d2-2.1-0030
subdomain: '2.1'
difficulty: hard
stem: A property management firm plans an AI agent that reads tenant emails and updates the finance system.
  To save time, the project gives the agent the same administrator account the integration team uses.
  What should the governance lead require?
options:
  A: Monitoring of the administrator account for unusual activity
  B: Using the administrator account only during business hours
  C: Human approval of every action the agent takes
  D: A dedicated identity limited to the actions the agent needs
answer: D
explanation:
  why_correct: An agent that reads external email can be manipulated by crafted messages, so its permissions
    define the damage it could do. A dedicated identity with only the rights it needs, separate from human
    admin accounts, limits that damage and makes its actions traceable.
  why_not:
    A: Monitoring may detect misuse but leaves broad rights in place. Prevention through least privilege
      should come first.
    B: Time limits shrink the window but not the scope of what a manipulated agent could do.
    C: Approving every action removes most of the benefit and approvers tire quickly. Proportionate oversight
      starts from narrow permissions.
