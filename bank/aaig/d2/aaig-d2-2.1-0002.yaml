id: aaig-d2-2.1-0002
subdomain: '2.1'
difficulty: easy
stem: A logistics company is setting up a shared feature store for its AI models. Data owners decide who
  may use each feature. The governance lead must assign the role that runs encryption, backups and access
  provisioning on the store to those rules. Which role fits?
options:
  A: The data steward for each feature domain
  B: The model owner for each consuming model
  C: The data custodian for the feature store
  D: The product owner for the feature store
answer: C
explanation:
  why_correct: The custodian runs the technical environment that holds the data and applies the safeguards
    the owner decides on, such as encryption, backups and access provisioning. Separating the owner who
    decides from the custodian who implements keeps accountability clear and lets the platform team work
    to agreed rules.
  why_not:
    A: Stewards look after the meaning and quality of data, such as definitions, quality rules and issue
      resolution. They do not operate encryption or backup controls.
    B: A model owner is accountable for a model and its outcomes. Using features gives no duty to operate
      the store's safeguards.
    D: A product owner sets the store's roadmap and priorities for its users. Running the safeguards day
      to day on the owners' rules is the custodian's job.
