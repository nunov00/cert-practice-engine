id: aaig-d2-2.1-0014
subdomain: '2.1'
difficulty: hard
stem: A manufacturing group's automated catalogue scans every plant system and lists each data set's schema,
  location and size. AI teams now find data quickly, but they keep training on copies of uncertain standing
  and cannot tell which uses are allowed or who could approve one. Which measure would help MOST?
options:
  A: Catalogue entries naming each set's owner, origin and allowed uses
  B: Lineage tooling that traces each copy back to its authoritative source
  C: A certified tier in the catalogue for sets approved for AI use
  D: A data lake consolidating the plants' sets behind one access layer
answer: A
explanation:
  why_correct: Finding data is solved; the scanner already gives technical metadata. What teams lack is
    business metadata, which a scanner cannot infer. Recording each set's accountable owner, its authoritative
    origin and its allowed uses tells teams which source to use, what they may do with it and whom to ask,
    so uncontrolled copies lose their purpose.
  why_not:
    B: Lineage shows where a copy came from, which answers part of the problem. It does not say who owns
      the source or which uses are allowed, so teams still cannot tell whether their use is permitted.
    C: A certified tier gives a short list of approved sets, but it leaves most of the plants' data without
      owners or use limits. Teams needing other sets are back to guessing.
    D: Consolidation adds one more copy and one access point, but it does not record who owns each set
      or what it may be used for.
