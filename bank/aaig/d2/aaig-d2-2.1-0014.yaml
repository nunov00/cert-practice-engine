id: aaig-d2-2.1-0014
subdomain: '2.1'
difficulty: medium
stem: A manufacturing group has hundreds of data sets spread across plants. AI teams keep spending weeks
  finding data and often use copies whose origin and restrictions are unclear. Which measure would help
  MOST?
options:
  A: A data catalogue recording each set's owner, origin and use limits
  B: A data catalogue built by scanning the plants' systems automatically
  C: A data catalogue limited to the sets certified for AI use
  D: A data lake with a search index over the plants' data sets
answer: A
explanation:
  why_correct: A catalogue makes data findable, and the owner, origin and permitted uses it records are
    exactly what the teams lack. Teams find the authoritative source quickly and know what they may do
    with it, which cuts uncontrolled copies.
  why_not:
    B: Automated scanning finds data quickly but captures technical metadata. Owners, origin and use limits
      still have to be recorded, so teams remain unsure what they may do.
    C: Listing only certified sets leaves most of the plants' data hard to find, so teams keep searching
      and copying.
    D: A searchable lake helps finding but creates yet another copy, and it does not record who owns the
      data or how it may be used.
