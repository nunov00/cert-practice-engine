subdomain: '2.1'
difficulty: medium
stem: An engineering services company wants an assistant that helps field technicians troubleshoot equipment
  from its maintenance manuals. Manufacturers issue revised manuals several times a year, and safety rules
  require technicians to record which manual section they followed. Which architecture choice BEST meets
  these needs?
options:
  A: Fine-tune on each revision and name the manual version in each answer
  B: Retrieve sections from an index rebuilt once a year, with citations
  C: Retrieve current manual sections and cite them in each answer
  D: Retrieve current manual sections and blend them into one summary
answer: C
explanation:
  why_correct: A retrieval-augmented design pulls the current documents at question time, so answers reflect
    the latest manuals without retraining, and the system can show which sections it used. That meets
    both governance needs, currency and traceability, at lower cost.
  why_not:
    A: Naming the manual version does not show which section was followed, and fine-tuning does not reliably
      tie an answer to a source. Each revision also needs a costly retrain.
    B: Citations meet the traceability need, but a yearly index misses revisions issued several times
      a year.
    D: The answers would be current, but technicians could not record which section they followed.
