subdomain: '2.1'
difficulty: hard
stem: A bank's customer chatbot logs every prompt and response. Security wants the logs kept indefinitely
  for investigations; privacy wants them deleted after 30 days. Complaints about chatbot advice can arise
  up to two years later. What should the governance lead propose?
options:
  A: Keep all logs indefinitely, as investigations outweigh privacy
  B: Delete logs after 30 days and rely on customers' own records
  C: Set a period linked to the complaint window, with tight access
  D: Keep full logs for 30 days and aggregated statistics after that
answer: C
explanation:
  why_correct: Retention should follow a documented need. The complaint window gives a clear, defensible
    reason to keep logs for about two years so the bank can reconstruct what the chatbot told a customer.
    Limiting access and deleting after that period balances traceability with minimisation.
  why_not:
    A: Indefinite retention has no defined purpose and keeps growing the privacy and breach exposure.
      'Might be useful' is not a retention rule.
    B: Deleting after 30 days leaves the bank unable to answer complaints it is obliged to handle, which
      is its own risk to customers and the bank.
    D: Aggregates cannot show what was said to a particular customer, so they do not support complaint
      handling within the two-year window.
