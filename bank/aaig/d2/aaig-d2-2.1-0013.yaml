id: aaig-d2-2.1-0013
subdomain: '2.1'
difficulty: hard
stem: A bank's customer chatbot logs every prompt and response. Security wants the logs kept indefinitely
  for investigations; privacy wants them deleted after 30 days. Complaints about chatbot advice can arise
  up to two years later. No record-keeping rule sets a longer period for these logs. What should the governance
  lead propose?
options:
  A: Keep logs in a restricted archive for as long as security needs them
  B: Delete logs after 30 days and keep complaint-related logs on request
  C: Keep logs for the complaint window, with access limited
  D: Keep full logs for 30 days and aggregated statistics after that
answer: C
explanation:
  why_correct: Retention should follow a documented need. The complaint window gives a clear reason to
    keep logs for about two years, so the bank can rebuild what the chatbot told a customer. Limiting
    access and deleting after that period balances traceability with minimisation.
  why_not:
    A: Security's wish to investigate is not a defined need for each log, and an open-ended period gives
      nothing to delete against. It covers the complaint window but adds privacy and breach exposure with
      no end point.
    B: Complaints can arrive up to two years later, long after the 30 days. By then the logs would already
      be gone and could not be held on request.
    D: Aggregates cannot show what was said to a particular customer, so they do not support complaint
      handling within the two-year window.
