stem: Five hospitals plan to train a shared diagnostic model using federated learning, so patient records
  never leave each hospital and updates are combined by secure aggregation. The project lead says that
  because no data is shared, no agreement between the hospitals is needed. What is the MAIN gap in this
  view?
options:
  A: A privacy impact assessment at each hospital for its part
  B: Ownership, use rights and accountability for the joint model
  C: Data sharing terms for patient records moved between the sites
  D: Security terms for each hospital's link to the aggregator
answer: B
explanation:
  why_correct: The lead concludes that no agreement is needed. Keeping records local and using secure
    aggregation reduce what the updates reveal, but the hospitals are still jointly creating an asset
    that will influence patient care. They must agree who owns it, who may use or sell it, how withdrawals
    work, who validates it and who answers when it errs.
  why_not:
    A: Each hospital's assessment covers its own privacy risk and is often required. The lead's error
      is about the joint model, which no single site's assessment settles, such as who owns it, who may
      use it and who answers when it errs.
    C: Under federated learning the patient records stay at each hospital, so terms for moving records
      misdescribe the arrangement. What the hospitals create together is the joint model, and its ownership,
      use and accountability are what remain unsettled.
    D: Connection security terms are sensible, but they protect the training channel. They leave open
      who owns the resulting model, who may use or sell it and who answers when it errs.
