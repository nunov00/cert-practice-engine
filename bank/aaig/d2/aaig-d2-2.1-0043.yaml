difficulty: easy
stem: A new chief technology officer at an airline asks why the AI platform was built on a particular
  cloud service and model family. The architects who made these choices have left, and the only records
  are old slide decks. Which practice would BEST have prevented this?
options:
  A: Keeping a register of all software licences and renewal dates
  B: Recording each major decision with its context, options and rationale
  C: Requiring the review board to approve every code change on the platform
  D: Storing all architecture diagrams in a single shared repository
answer: B
explanation:
  why_correct: Architecture decision records written in plain language capture what was decided, the alternatives
    considered, the reasons and the risks accepted. They let later leaders, auditors and review boards
    understand and revisit choices without relying on the memory of people who may leave.
  why_not:
    A: A licence register shows what is used and when it renews, not why it was chosen over alternatives.
    C: Approving every code change is excessive and focuses on detail rather than on the significant decisions
      and their reasons.
    D: Diagrams show what was built, not the reasoning or trade-offs behind it.
