id: aaig-d2-2.1-0034
subdomain: '2.1'
difficulty: medium
stem: A global consumer goods company is choosing a foundation model for marketing content and internal
  knowledge search. The shortlist is based on public benchmark scores. Which additional criteria should
  governance add?
options:
  A: Provider certifications, uptime record and support response times
  B: Provider safety test scores, red-team results and model cards
  C: Data use terms, disclosure of limits and fit to the two uses
  D: Contract liability caps, indemnities and price protection
answer: C
explanation:
  why_correct: Benchmarks measure general capability, not whether a model is acceptable for the company.
    Governance criteria include how the provider uses submitted data and what it discloses about training
    and limitations. They also include fit with the risks of the two planned uses.
  why_not:
    A: These show the provider runs a reliable, secure service. They do not show how it uses the company's
      data or whether the model fits these uses.
    B: Provider safety results are useful but are still the provider's general claims. They do not show
      how submitted data is used or whether the model fits these uses.
    D: These terms manage financial loss if things go wrong. They do not show whether the model is acceptable
      to use.
