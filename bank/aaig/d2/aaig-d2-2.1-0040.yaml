id: aaig-d2-2.1-0040
subdomain: '2.1'
difficulty: medium
stem: An engineering consultancy plans to build a client-facing design assistant on an openly available
  model downloaded from a public repository. The project team describes the model as 'open source, so
  free to use however we like'. Which concern does this assumption MOST overlook?
options:
  A: Whether the model's training data sources are publicly disclosed
  B: Whether its licence permits the intended commercial client use
  C: Whether the model card describes known limits and risks
  D: Whether the files were scanned for malicious code before use
answer: B
explanation:
  why_correct: Openly available models come with licences that can restrict commercial use, field of use
    or redistribution, and can impose attribution or other duties. The team assumes there are no limits,
    so the gap is a review of the licence against the intended client use.
  why_not:
    A: Training data disclosure supports transparency and risk review, but it does not answer whether
      the firm may use the model however it likes.
    C: A model card helps judge fitness and risk. It does not grant or limit the right to use the model.
    D: Scanning files is a sound security control, but it addresses a different risk from the legal right
      to use the model.
