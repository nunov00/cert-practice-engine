subdomain: '2.1'
difficulty: medium
stem: A Swiss private bank chose an AI platform hosted in-country to keep client data local. During due
  diligence it learns the provider's support staff in two other countries can access production data to
  troubleshoot. What should the governance lead conclude?
options:
  A: Treat the remote access as a data transfer that needs assessment
  B: Treat the remote access as a security risk handled by access logging
  C: Treat the remote access as a supplier risk under the outsourcing contract
  D: Treat the remote access as acceptable if staff sign confidentiality terms
answer: A
explanation:
  why_correct: Data residency is about where data can be accessed, not only where it is stored. Remote
    access by foreign staff can amount to a cross-border transfer. The bank should assess it against its
    obligations and then decide on controls such as approval of each access or local-only support.
  why_not:
    B: Logging records who accessed what, but it does not settle whether foreign access to client data
      is allowed at all. It is a control, not the answer to the legal question.
    C: Contract terms matter, but they do not settle whether foreign access to client data is allowed
      at all. That legal question comes first.
    D: Confidentiality terms address misuse but not whether foreign access is allowed in the first place.
