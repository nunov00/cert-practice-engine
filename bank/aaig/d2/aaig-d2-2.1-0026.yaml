id: aaig-d2-2.1-0026
subdomain: '2.1'
difficulty: hard
stem: A Swiss private bank chose an AI platform hosted in-country to keep client data local. During due
  diligence it learns that the provider's support staff in two other countries can access production
  data to troubleshoot. The draft contract already requires access logging and confidentiality terms for
  those staff. What is the BEST conclusion for the governance lead to draw?
options:
  A: Treat the remote access as a data transfer that needs assessment
  B: Treat the remote access as a risk managed by approving each session
  C: Treat the remote access as a supplier risk under the outsourcing policy
  D: Treat the remote access as grounds to require in-country support only
answer: A
explanation:
  why_correct: Data residency is about where data can be accessed, not only where it is stored. Remote
    access by staff abroad can amount to a cross-border disclosure of client data. Logging and confidentiality
    are already in the draft and do not answer whether that access is allowed. The bank should assess
    it against its obligations first, and that assessment then decides which controls or limits are needed.
  why_not:
    B: Approving each session is a strong control and may be the outcome. Choosing it now assumes foreign
      access is permitted at all, which has not been assessed.
    C: The outsourcing policy governs the supplier relationship, and the contract terms already in the
      draft come from it. It does not settle whether disclosing client data abroad is allowed.
    D: In-country support may be where the assessment leads, but deciding it now skips the assessment
      and may impose cost and service limits the obligations do not require.
