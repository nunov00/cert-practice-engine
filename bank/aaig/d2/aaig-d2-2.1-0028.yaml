difficulty: medium
stem: A dermatology start-up's model underperforms on darker skin tones because few real images exist.
  The team proposes generating synthetic images to balance the training set. What should the governance
  lead require?
options:
  A: Validate on held-out synthetic images from the under-represented groups
  B: Validate performance on real images from under-represented groups
  C: Have dermatologists review the synthetic images for realism
  D: Validate overall accuracy on real images from the existing test set
answer: B
explanation:
  why_correct: Synthetic data can help, but it may not capture real clinical variation. A model can then
    look balanced on paper while still failing patients. The decisive evidence is performance measured
    on genuine images from the under-represented groups, even if collecting them takes effort.
  why_not:
    A: Testing on synthetic images checks the model against the same kind of data it learned from. It
      does not show how it performs on real patients.
    C: Expert review checks that the inputs look real. It does not show that the model now works for real
      patients, which is the outcome that matters.
    D: The existing test set has few darker skin images, so overall accuracy can rise while the gap for
      those patients stays.
