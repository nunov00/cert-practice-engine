subdomain: '2.1'
difficulty: easy
stem: A dermatology start-up's model underperforms on darker skin tones because it has few real images
  of them. The team used those few images to generate synthetic ones and rebalanced the training set. Partner
  clinics, which photograph lesions with their own devices, will start using the model next quarter. What
  is the BEST evidence for the governance lead to require before release?
options:
  A: Validate on the real images that seeded the synthetic set
  B: Validate on new real images of those groups from partner clinics
  C: Validate on real darker-skin images from a public research set
  D: Validate on real partner-clinic images, scored as one pooled result
answer: B
explanation:
  why_correct: The question is whether the model now works for patients with darker skin in the setting
    where it will be used. New real images of those groups, taken with the partner clinics' own devices,
    test exactly that, and they are independent of the data the model learned from.
  why_not:
    A: These images are real, but they seeded the synthetic set, so the model has in effect already learned
      from them. Good results on them would overstate how it performs on new patients.
    C: A public set gives real, independent images of darker skin, but they were taken with other equipment.
      The clinics photograph lesions with their own devices, so results may not carry over.
    D: Clinic images are the right source, but one pooled score is dominated by the groups the
      model already handles well. It can look good while the model still fails patients with darker skin.
