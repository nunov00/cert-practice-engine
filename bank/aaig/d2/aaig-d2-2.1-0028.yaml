difficulty: hard
stem: A dermatology start-up's model underperforms on darker skin tones because few real images exist.
  The team proposes generating synthetic images to balance the training set. What should the governance
  lead require?
options:
  A: A disclosure that the model was trained partly on synthetic data
  B: Validation of performance on real images from those groups
  C: A ban on synthetic images in any medical model
  D: Generating enough images to make all groups equal in size
answer: B
explanation:
  why_correct: Synthetic data can help, but it may not capture real clinical variation, so a model can
    look balanced on paper while still failing patients. The decisive evidence is performance measured
    on genuine images from the under-represented groups, even if collecting them takes effort.
  why_not:
    A: Disclosure supports transparency, but it does not show that the model works for those patients.
    C: A blanket ban discards a useful technique. The issue is validating its effect, not prohibiting
      it.
    D: Equal numbers do not prove equal quality. Synthetic images could be unrealistic, so the model would
      still need real-world validation.
