id: aaig-d2-2.1-0007
subdomain: '2.1'
difficulty: medium
stem: A consulting firm rolls out an internal AI assistant. Staff paste client material into prompts,
  and the assistant stores conversation history. The firm already has a four-level classification scheme
  for documents. What is the BEST governance step?
options:
  A: Write a separate classification scheme for AI conversation data
  B: Set a 30-day retention limit on stored assistant conversation history
  C: Label assistant content as confidential by default
  D: Extend the existing scheme to prompts, outputs and stored history
answer: D
explanation:
  why_correct: Prompts, outputs and conversation history are data like any other and can hold the most
    sensitive client information. Extending the existing, understood scheme to them means the same handling,
    access and retention rules apply. The firm needs no parallel system.
  why_not:
    A: A second scheme for the same client data creates two sets of rules and confusion over which applies.
      The existing scheme is understood, and the gap is in its coverage.
    B: Retention limits how long history is kept, but not who can see prompts or how outputs are handled.
      Retention periods should follow from how the data is classified.
    C: Over-classifying content by default weakens the meaning of labels and makes routine work harder,
      so people start ignoring them. Classification should reflect actual content.
