difficulty: medium
stem: A telecoms group has 40 AI pilots, each built on its own tools and cloud accounts. Running costs
  are rising, and few pilots can be scaled without rebuilding. The executive committee asks for a principle
  to guide future work. What should the governance lead propose?
options:
  A: A review gate before any pilot is scaled into production
  B: New work uses shared platforms unless a deviation is approved
  C: A central team that rebuilds successful pilots for production
  D: Monthly cost reporting with a chargeback to each pilot's budget
answer: B
explanation:
  why_correct: Fragmented stacks create technical debt, with duplicated cost, uneven controls and pilots
    that cannot scale. Building on shared, governed platforms by default, with approved exceptions, cuts
    cost and makes successful pilots easier to scale. It still allows deviation where it is justified.
  why_not:
    A: A gate checks pilots once they want to scale, but by then they are already built on their own stacks
      and need rebuilding.
    C: Central rebuilding accepts the duplication and pays for it twice. It does not change how new work
      starts.
    D: Reporting and chargeback make cost visible but do not stop the fragmentation that causes it.
