subdomain: '2.1'
difficulty: hard
stem: A telecoms group has 40 AI pilots, each built on its own tools and cloud accounts. Running costs
  are rising, and few pilots can be scaled without rebuilding. A reference architecture was published
  last year as guidance, but few teams adopted it. The executive committee asks for a principle to guide
  future work. What is the BEST principle for the governance lead to propose?
options:
  A: A review gate before any pilot is scaled into production
  B: New work uses shared platforms unless a deviation is approved
  C: A refreshed reference architecture promoted to pilot teams
  D: Monthly cost reporting with a chargeback to each pilot's budget
answer: B
explanation:
  why_correct: Fragmented stacks create technical debt, with duplicated cost, uneven controls and pilots
    that cannot scale. The group already has guidance, and it was ignored because it was optional. Making
    shared, governed platforms the default for new work, with approved deviations, changes how work starts
    while still allowing exceptions where they are justified.
  why_not:
    A: A gate checks pilots once they want to scale, but by then they are already built on their own stacks
      and need rebuilding.
    C: A better reference architecture is useful, but the existing one failed through low adoption, not
      poor content. Promoting guidance again leaves adoption optional.
    D: Reporting and chargeback make cost visible but do not stop the fragmentation that causes it.
