id: aaig-d2-2.1-0012
subdomain: '2.1'
difficulty: medium
stem: A recruitment platform's matching model uses 140 attributes about candidates. Analysis shows 30
  of them, including date of birth and home address, add almost nothing to accuracy. What should the governance
  lead recommend?
options:
  A: Keep them and test the model for age and location bias each quarter
  B: Remove them from the model but keep them in the training data store
  C: Remove them from the model and stop collecting them for it
  D: Replace them with banded age and region values in the model
answer: C
explanation:
  why_correct: Data minimisation means using only the data needed for the purpose. Attributes that add
    little value but carry privacy and discrimination risk, such as age and address, should be removed
    from the model and from the collection that feeds it. This cuts risk with almost no loss of value.
  why_not:
    A: Bias testing is detective. It may find unfair outcomes after candidates are affected, while keeping
      data that adds nothing to the model's purpose.
    B: Taking them out of the model helps, but the data would still be collected and stored with no purpose,
      keeping the privacy and breach risk.
    D: Banding reduces precision, but the attributes still add almost nothing to accuracy. Age and region
      bands can still drive unfair matching, so the data is still not needed.
