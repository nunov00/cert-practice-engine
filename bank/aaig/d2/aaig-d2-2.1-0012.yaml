id: aaig-d2-2.1-0012
subdomain: '2.1'
difficulty: medium
stem: A recruitment platform's matching model uses 140 attributes about candidates. Analysis shows 30
  of them, including date of birth and home address, add almost nothing to accuracy. What should the governance
  lead recommend?
options:
  A: Keep them in case they become useful in future versions
  B: Keep them but restrict access to the data science team only
  C: Remove them from the model and stop collecting them for it
  D: Encrypt them so the model can still use them safely
answer: C
explanation:
  why_correct: Data minimisation means using only the data needed for the purpose. Attributes that add
    little value but carry privacy and discrimination risk, such as age and address, should be removed
    from the model and from the collection that feeds it. This cuts risk with almost no loss of value.
  why_not:
    A: Holding personal data 'just in case' is exactly what minimisation rules out. Future needs should
      be justified when they arise.
    B: Restricting access reduces one risk but keeps unnecessary data in the model, where age and address
      can still drive unfair outcomes.
    D: Encryption protects data at rest and in transit, but the model still uses the attributes. It does
      not address whether the data should be processed at all.
