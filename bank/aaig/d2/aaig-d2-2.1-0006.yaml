difficulty: medium
stem: A media company wants to fine-tune a writing model on a large set of articles and forum posts that
  a contractor scraped from the web. The contractor says the material was 'freely accessible online'. The
  content team is eager to start. What should the governance lead require FIRST?
options:
  A: A quality check that removes duplicates and offensive material
  B: Evidence of the content's sources and licence terms for this use
  C: A contract clause making the contractor liable for any claims
  D: A small pilot to confirm the data improves the model
answer: B
explanation:
  why_correct: '''Freely accessible'' does not mean licensed for training. Before the data enters the
    model, the company needs provenance: where the data came from, under what terms, and whether those
    terms permit fine-tuning and commercial use. Once data is absorbed into a model it is very hard to
    remove, so rights must be settled first.'
  why_not:
    A: Cleaning is needed later, but it does not answer whether the company may use the data at all. Clean
      data used without rights is still a legal and reputational risk.
    C: An indemnity may shift some financial loss, but it does not make the use lawful, and the contractor
      may be unable to pay. Contracts complement provenance checks; they do not replace them.
    D: A pilot already uses the data in training, which is the act whose legitimacy is in question. Value
      should be tested only after the right to use the data is confirmed.
