subdomain: '2.1'
difficulty: medium
stem: The CIO of a growing retailer proposes an enterprise AI reference architecture. A board member asks
  what governance benefit it brings. What is the BEST answer?
options:
  A: It sets who must approve each new AI use before it is built
  B: It gives approved patterns with security and logging built in
  C: It lowers delivery cost by reusing shared platform components
  D: It gives a view of the AI systems now in use and their owners
answer: B
explanation:
  why_correct: A reference architecture sets out approved building blocks and patterns, with security,
    privacy and logging controls already designed in. Teams that follow it start from a governed baseline,
    so systems are more consistent, cheaper to assure and quicker to approve.
  why_not:
    A: Approval rights belong in the governance framework and operating model. A reference architecture
      shapes how systems are built, not who decides whether to build them.
    C: Reuse does lower cost, but that is an efficiency benefit. The board member asked about governance,
      which comes from controls being built in.
    D: That describes an inventory of systems, which records what exists. A reference architecture guides
      how new systems should be built.
