id: aaig-d2-2.1-0029
subdomain: '2.1'
difficulty: hard
stem: At a payments company, data scientists build and test fraud models on the platform that runs live
  fraud scoring, using copies of production customer data. To work quickly they need broad rights to create
  and change jobs, data stores and settings on that platform. Last month a test job overwrote a live model's
  settings. Which design principle is MOST important for the governance lead to require?
options:
  A: Separate environments for experimentation and live production
  B: Masked or synthetic copies of customer data for each experiment
  C: Least-privilege access for experiment jobs to live systems
  D: Change control with approval for live model setting changes
answer: A
explanation:
  why_correct: The data scientists need broad rights, and on a shared platform those rights reach live
    systems too. Separate environments let them keep broad rights where they experiment while live scoring
    sits behind a boundary their jobs cannot cross. The same boundary is where the use of production data
    in tests can be approved and controlled.
  why_not:
    B: Masking reduces exposure of customer data, but test jobs would still run where they can change live
      models, which is what happened last month.
    C: Least privilege is the right instinct, but on one shared platform the broad rights the data scientists
      need are rights over the live system. Narrowing them enough to protect live scoring would block the
      work they need to do.
    D: Change control governs changes people intend to make to live settings. The overwrite came from a
      test job, not a planned change, so it would bypass the approval step.
