id: aaig-d2-2.1-0029
subdomain: '2.1'
difficulty: medium
stem: At a payments company, data scientists experiment with models in the same environment that serves
  live fraud decisions, using copies of production customer data. Last month an experiment overwrote a
  live model's settings. Which design principle should the governance lead require?
options:
  A: Separate experiment and production environments
  B: Masked or synthetic copies of customer data for experiments
  C: Role-based access limiting who can deploy to production
  D: Resource quotas so experiments cannot slow live decisions
answer: A
explanation:
  why_correct: Segregating experimentation from production keeps experiments from changing live decisions
    and limits who can touch the live system. It also creates the boundary at which the use of production
    data in tests can be approved and controlled.
  why_not:
    B: Masking reduces exposure of customer data, but experiments would still run where they can change
      live models, which is what happened last month.
    C: Deployment rights limit formal releases. An experiment in the shared environment changed a live
      model without any deployment.
    D: Quotas protect performance, not the integrity of live models or access to customer data.
