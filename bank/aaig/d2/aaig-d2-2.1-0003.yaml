subdomain: '2.1'
difficulty: easy
stem: A health insurer plans to train a claims triage model next month. The data team says the claims
  data meets the enterprise quality standard, which was written for financial reporting. Nobody has said
  what the triage model needs from the data. What should the governance lead require before training starts?
options:
  A: Quality criteria from the enterprise standard, retested on claims data
  B: Quality criteria set for the triage purpose and tested before training
  C: Quality criteria from a published AI data standard, tested in full
  D: Quality criteria agreed with the claims owner for claims reporting
answer: B
explanation:
  why_correct: Data quality means fitness for a stated purpose. A standard for financial reporting checks
    completeness and reconciled totals, but a triage model also needs correct labels, representative cases
    and coverage of rare claim types. Criteria set for this model, then tested, show whether the data
    is fit before it shapes the model.
  why_not:
    A: Retesting against the reporting standard repeats checks the data has already passed. That standard
      was never designed for triage, so passing it again says nothing new about fitness.
    C: A published AI standard lists general dimensions, but it does not say what this model needs, such
      as label accuracy or coverage of rare claim types. Testing it in full may still miss the gaps that
      matter.
    D: Criteria for claims reporting serve a different purpose. The triage model's needs have still not
      been defined.
