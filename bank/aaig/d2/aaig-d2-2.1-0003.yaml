subdomain: '2.1'
difficulty: medium
stem: A health insurer plans to train a claims triage model. The data team says the claims data 'meets
  the enterprise quality standard', which was written for financial reporting. What should the governance
  lead require before training starts?
options:
  A: A sign-off from finance that the claims figures reconcile to the ledger
  B: Quality criteria defined for this model's purpose, then tested
  C: A larger data set so that quality issues average out
  D: An external audit of the enterprise data quality standard
answer: B
explanation:
  why_correct: Data quality is fitness for a stated purpose. A standard built for financial reporting
    checks things like completeness and reconciliation of totals, but a triage model also needs representativeness,
    correct labels and coverage of rare claim types. The governance lead should require purpose-specific
    criteria, agreed before training, and evidence that the data meets them.
  why_not:
    A: Reconciliation shows the financial totals are right. It says nothing about label accuracy or whether
      the data represents the cases the model will see.
    C: More data does not cure systematic problems such as biased labels or missing groups; it can scale
      them. Volume is not a substitute for defined quality criteria.
    D: Auditing the existing standard might confirm it works for reporting, but the problem is that it
      was never designed for this use. The model needs its own criteria.
