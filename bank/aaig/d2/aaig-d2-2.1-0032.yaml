id: aaig-d2-2.1-0032
subdomain: '2.1'
difficulty: medium
stem: A government benefits agency is designing a model that flags applications for fraud investigation.
  Investigators and applicants may challenge a flag. When and how should the explainability requirement
  be set?
options:
  A: At design, matched to what the chosen model type can explain
  B: At design, at the level the agency's AI policy sets for its models
  C: After the pilot, based on the questions investigators raise
  D: At design, proportionate to the impact on applicants
answer: D
explanation:
  why_correct: Explainability must be set at design because it shapes the choice of model and data. The
    level should match the impact. A flag that can trigger an investigation into someone's benefits needs
    reasons that investigators and applicants can understand and challenge.
  why_not:
    A: This lets the model choice set the standard. The need comes from the people affected, and the model
      should be chosen to meet it.
    B: A policy level is a sound baseline, but one level across the agency's models ignores that this
      flag can open an investigation into someone's benefits. The requirement should follow the impact
      of this use.
    C: Retrofitting explanations is costly and may not be possible with the chosen model. Applicants need
      reasons from the first flag, and investigators are not the only ones who may challenge.
