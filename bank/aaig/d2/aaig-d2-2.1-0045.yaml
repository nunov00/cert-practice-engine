id: aaig-d2-2.1-0045
subdomain: '2.1'
difficulty: medium
stem: At a consumer lender, the approval cut-off score for its credit model is written into the model
  code. When the credit committee wanted to tighten lending during a downturn, the change took six weeks
  of development and revalidation, and nobody outside data science could see the current cut-off. Which
  design principle should the governance lead promote?
options:
  A: Hold the cut-off in a configuration file data science changes on request
  B: Hold the cut-off outside the model, changed through the IT change process
  C: Hold the cut-off in the model code, with fast-track revalidation
  D: Hold decision thresholds outside the model, owned by the business
answer: D
explanation:
  why_correct: The cut-off is a credit policy decision, not part of the model's logic. Thresholds held
    as visible, configurable settings owned by the business let the committee change policy quickly through
    its own approval. The change is logged and its impact checked, while the validated model stays unchanged.
  why_not:
    A: A configuration file makes changes faster, but data science still owns them and the committee still
      cannot see the current cut-off.
    B: Taking the cut-off out of the code is right, but IT would own the change, so the credit committee
      still has to queue a technical change to apply its own policy decision.
    C: A faster process shortens the delay but still treats a policy setting as a code change needing
      development.
