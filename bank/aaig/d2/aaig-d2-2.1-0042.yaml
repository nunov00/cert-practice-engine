stem: A bank's group marketing team trains a cross-selling model on account data owned by the retail banking
  division. Every month the marketing analysts find the same address and product-code errors and fix them
  in their own copy before training. The retail division does not know about the problems. What should
  the governance lead recommend?
options:
  A: Report the defects to the data owner and agree quality fixes at the source
  B: Report the defects to the platform team that hosts the account data
  C: Formalise the analysts' cleaning scripts so fixes are applied consistently
  D: Report the defects to the steward of marketing's analytics copy
answer: A
explanation:
  why_correct: Quality is the responsibility of the data owner, and defects should be fixed where the
    data is created. Telling the retail division and agreeing quality requirements for this use corrects
    the data for every consumer, stops repeated hidden rework and keeps marketing's copy from drifting
    away from the authoritative source.
  why_not:
    B: The platform team runs the systems but does not decide or own the content of the data. It cannot
      agree what correct addresses and product codes are.
    C: Standardising downstream fixes makes the workaround permanent, while the source stays wrong for
      every other user of the data.
    D: A steward of the copy can only fix the copy. The source stays wrong, and the retail division still
      does not know.
