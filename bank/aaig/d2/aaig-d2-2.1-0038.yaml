id: aaig-d2-2.1-0038
subdomain: '2.1'
difficulty: medium
stem: An insurance group wants its health-insurance subsidiary in one country to share claims records
  with the group's analytics hub in another, to train a fraud model that every subsidiary will use. The
  hub's director says no formal arrangement is needed because 'we are all one company'. What should the
  governance lead advise?
options:
  A: A written intra-group agreement setting purpose, limits and duties
  B: Written consent from each customer for transfer to the hub
  C: A group data protection policy that each subsidiary must follow
  D: Written approval of the transfer from the subsidiary's privacy officer
answer: A
explanation:
  why_correct: Group companies are usually separate legal entities with their own duties to customers
    and regulators, often in different countries. A written agreement between them fixes the permitted
    purpose, safeguards, cross-border conditions, retention and who answers for what. The shared fraud
    model then rests on a clear basis.
  why_not:
    B: Consent is hard to make free and informed for insurance customers, and it would not set the hub's
      duties or who answers for the model. The entities still need an arrangement between them.
    C: A group policy sets common standards, but it is not a binding arrangement between the two entities
      for this transfer and use.
    D: An approval inside the subsidiary records its own decision but binds nothing at the hub. Purpose,
      limits and accountability on the receiving side are left open.
