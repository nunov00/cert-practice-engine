id: aaig-d2-2.1-0017
subdomain: '2.1'
difficulty: medium
stem: A business unit at a shipping company wants to deploy an AI tool that does not meet the enterprise
  logging standard, because the vendor cannot support it for six months. The tool would save significant
  cost. What should the governance lead recommend?
options:
  A: Grant a six-month exception approved by the business unit head
  B: Grant a six-month exception once the vendor commits to a delivery date
  C: Grant an exception that lasts until the vendor delivers logging
  D: Grant a six-month exception with compensating controls for the gap
answer: D
explanation:
  why_correct: A formal exception lets the organisation take a reasoned risk. The deviation is documented
    and accepted at the right level, and compensating controls reduce the gap while logs are missing.
    A fixed expiry makes sure the standard is met once the vendor can support it.
  why_not:
    A: Missing logs affect enterprise risks such as incident investigation, which the unit head does not
      own. Approval alone also leaves the gap uncontrolled for six months.
    B: A vendor commitment makes the end date more likely, but nothing covers the missing logs in the
      meantime.
    C: An exception with no fixed end depends on the vendor's timing, and nothing reduces the gap while
      it lasts.
