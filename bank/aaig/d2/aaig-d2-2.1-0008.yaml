id: aaig-d2-2.1-0008
subdomain: '2.1'
difficulty: medium
stem: An engineering firm fine-tuned a model on restricted design documents. A business unit now wants
  to offer it to suppliers through a portal so they can ask design questions. The unit argues that the
  model holds only weights, not documents. What should the governance lead advise?
options:
  A: Treat the model as internal, matching its weights rather than its sources
  B: Treat the model as confidential, one level below its source documents
  C: Treat the model as restricted, matching the documents it was tuned on
  D: Treat the model as restricted until extraction tests show it is safe
answer: C
explanation:
  why_correct: A model can memorise and reproduce parts of its training data, and it answers questions
    with what it learned. So it carries the sensitivity of that data. The sound principle is that a model
    inherits the highest classification of the data used to train it. Offering it to suppliers would share
    restricted information with people not cleared to see it.
  why_not:
    A: Classifying by the form of the asset ignores what it can reveal. A model that answers design questions
      discloses the content of the restricted documents.
    B: There is no basis for a lower level. Suppliers asking design questions would receive the same knowledge
      the restricted documents hold.
    D: Passing extraction tests does not prove content cannot be extracted. Answering design questions
      is the model's purpose, so the restricted knowledge would still be offered.
