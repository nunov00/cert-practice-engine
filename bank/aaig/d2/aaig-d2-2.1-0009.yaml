id: aaig-d2-2.1-0009
subdomain: '2.1'
difficulty: medium
stem: A hospital group holds years of messages that patients sent through its portal to ask clinical questions.
  Its commercial arm now wants to use them to train a model that predicts which patients would buy private
  health checks. What should the governance lead do FIRST?
options:
  A: Assess whether the new purpose is compatible with the original one
  B: Assess whether the messages can be anonymised for the commercial arm
  C: Assess whether the portal privacy notice covers analytics uses
  D: Assess the ethical risk of targeting patients with health offers
answer: A
explanation:
  why_correct: Purpose limitation means data collected for one purpose should not be reused for an unrelated
    one without a lawful basis and fair notice. Selling health checks differs from answering clinical
    questions. The first step is to test whether the new purpose is compatible and, if not, what basis
    or consent would be needed before any reuse.
  why_not:
    B: Free-text health messages are hard to anonymise, and anonymisation is a later safeguard. It skips
      whether the reuse is legitimate at all.
    C: A general mention of analytics does not settle whether profiling for sales fits what patients expected
      when they asked clinical questions. The question is the purpose, not the wording of a notice.
    D: An ethics review is useful for sensitive targeting, but it comes after the threshold question of
      whether the data may be reused for this purpose at all.
