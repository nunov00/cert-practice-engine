id: aaig-d2-2.1-0033
subdomain: '2.1'
difficulty: hard
stem: A car insurer's AI system assists adjusters in settling claims. Adjusters must write a reason
  when they override a recommendation. An internal review still cannot tell whether a disputed settlement
  followed the AI recommendation or an override. Which design requirement would BEST have prevented this?
options:
  A: Log each recommendation with the model version and inputs used
  B: Log each AI recommendation with the adjuster's resulting action
  C: Show a confidence score and key factors with each recommendation
  D: Store the final settlement and the adjuster's notes for each claim
answer: B
explanation:
  why_correct: Traceability means being able to rebuild who or what decided, and on what basis. Override
    reasons depend on adjusters noticing and recording a departure, and nothing ties them to what the
    system actually recommended. Logging each recommendation together with what the adjuster did with
    it shows directly whether a settlement followed the AI or an override.
  why_not:
    A: This records the AI side well and supports reproducing a recommendation. It does not record what
      the adjuster then did, so the review still cannot tell whether the settlement followed it.
    C: Scores and factors help the adjuster decide but do not record what happened afterwards.
    D: The outcome and notes do not show what the AI recommended, so the review still could not tell whether
      the AI shaped the settlement.
