id: aaig-d2-2.1-0033
subdomain: '2.1'
difficulty: medium
stem: A car insurer's AI system assists adjusters in settling claims. An internal review cannot tell whether
  a disputed settlement followed the AI recommendation or the adjuster's override. Which design requirement
  would have prevented this?
options:
  A: Requiring adjusters to accept the AI recommendation every time
  B: Recording each recommendation, model version and human action
  C: Showing a confidence score with every recommendation
  D: Storing the final settlement amount for each claim
answer: B
explanation:
  why_correct: Traceability means being able to reconstruct who or what decided, on what basis. Logging
    the model's recommendation, the version that produced it and what the adjuster did with it lets the
    insurer explain decisions, handle disputes and learn where overrides help or harm.
  why_not:
    A: Forcing acceptance removes human judgment and would not explain the decision any better.
    C: Confidence scores help the adjuster but do not record what happened afterwards.
    D: The outcome alone does not show how it was reached or whether the AI shaped it.
