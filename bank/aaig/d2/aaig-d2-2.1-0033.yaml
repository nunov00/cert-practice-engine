id: aaig-d2-2.1-0033
subdomain: '2.1'
difficulty: medium
stem: A car insurer's AI system assists adjusters in settling claims. An internal review cannot tell whether
  a disputed settlement followed the AI recommendation or the adjuster's override. Which design requirement
  would have prevented this?
options:
  A: Require a written reason whenever an adjuster overrides the AI
  B: Log each AI recommendation with the adjuster's resulting action
  C: Show a confidence score and key factors with each recommendation
  D: Store the final settlement and the adjuster's notes for each claim
answer: B
explanation:
  why_correct: Traceability means being able to rebuild who or what decided, and on what basis. Logging
    each recommendation and what the adjuster did with it shows whether a settlement followed the AI or
    an override. The insurer can then explain decisions and handle disputes.
  why_not:
    A: This depends on adjusters noticing and recording their departures. The review still could not check
      which recommendation an adjuster saw.
    C: Scores and factors help the adjuster decide but do not record what happened afterwards.
    D: The outcome and notes do not show what the AI recommended, so the review still could not tell whether
      the AI shaped the settlement.
