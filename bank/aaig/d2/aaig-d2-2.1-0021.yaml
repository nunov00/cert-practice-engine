id: aaig-d2-2.1-0021
subdomain: '2.1'
difficulty: medium
stem: An energy trading firm has dozens of models in production, and nobody can say with confidence which
  version of each is live or who approved it. What should the governance lead put in place?
options:
  A: A model registry recording versions, owners and approvals
  B: A model inventory in the risk system updated each quarter
  C: A change ticket raised and approved for each model deployment
  D: A pipeline that tags each live model with its version and owner
answer: A
explanation:
  why_correct: 'A model registry is the authoritative record of each model: its versions, which version
    is deployed, who owns it and what approvals it received. Linking deployment to the registry means
    only registered, approved versions reach production.'
  why_not:
    B: A quarterly inventory is out of date between updates and relies on each team's accuracy. It does
      not show which version is live today.
    C: Tickets record single events in many places. They do not give one current view of which version
      of each model is live and who approved it.
    D: Tags show which version is running and who owns it, but not whether it was approved.
