subdomain: '2.1'
difficulty: medium
stem: A pan-European lender is about to approve a credit model for all eight of its markets. It was trained
  mostly on data from its five larger markets. The data quality report shows high accuracy and completeness,
  but the three smaller markets are barely represented. What should the governance lead advise?
options:
  A: Approve use in the eight markets with a stricter score cut-off in the smaller ones
  B: Approve use in the eight markets after reweighting the smaller-market records
  C: Approve use in the two largest markets until more data is gathered
  D: Approve use in the represented markets and extend once the gap closes
answer: D
explanation:
  why_correct: Accuracy and completeness can be high while the data still fails to represent part of the
    population the model will serve. Approving use in the five markets the data covers keeps the decision
    within the evidence. Wider use then has a clear condition, which is to close the gap and revalidate.
  why_not:
    A: A stricter cut-off changes how many applicants are accepted, not whether the scores are right for
      people the model barely learned. It can also refuse sound borrowers unfairly.
    B: Reweighting a handful of records gives them more influence but adds no new information. The model
      would still be unvalidated in those markets.
    C: The data supports five markets, not only the two largest. Limiting use to two gives up value the
      evidence already supports.
