subdomain: '2.1'
difficulty: hard
stem: A pan-European lender is about to approve a credit model trained mostly on data from its two largest
  markets. It will be used in all eight markets. The data quality report shows high accuracy and completeness,
  but three smaller markets are barely represented. What should the governance lead advise?
options:
  A: Approve it everywhere, since the quality scores meet the standard
  B: Approve it everywhere and monitor default rates in smaller markets
  C: Replace the model with separate models built for each market
  D: Restrict use to markets the data represents until the gap is closed
answer: D
explanation:
  why_correct: 'Accuracy and completeness scores can be high while the data still fails to represent part
    of the population the model will serve. Limiting use to the markets the training data covers keeps
    the decision within what the evidence supports, and sets a clear condition for wider use: close the
    representativeness gap and revalidate.'
  why_not:
    A: The scores measure the records that exist, not the populations that are missing. Approving use
      in under-represented markets accepts an untested risk of unfair or wrong decisions.
    B: Monitoring would detect harm only after customers in the smaller markets had been affected. Detective
      controls do not justify deploying where the data gives no assurance.
    C: Separate models may be one answer, but it is a costly design choice made before the gap is understood.
      The immediate governance decision is to keep use within the evidence.
