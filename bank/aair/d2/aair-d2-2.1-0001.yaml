id: aair-d2-2.1-0001
subdomain: '2.1'
difficulty: medium
stem: A clinic's internal team is designing a model to help prioritise patient referrals. Their design
  document covers the algorithm, data pipeline and code repository. From a risk perspective, which addition
  is MOST important?
options:
  A: The hyperparameter search history and the final chosen settings
  B: A full list of the software libraries and their version numbers
  C: The intended use, known limitations and situations it is not designed for
  D: The project delivery schedule and the approved development budget
answer: C
explanation:
  why_correct: 'Stating the intended use and its boundaries is the basis for later risk work: validation
    tests against it, monitoring watches for use outside it, and users know when not to rely on the model.
    Without it, misuse and scope creep go unnoticed.'
  why_not:
    A: This is useful technical record-keeping, yet it tells reviewers and users nothing about safe use
      or the model's limits.
    B: Dependency details help reproducibility and security patching, but they do not define what the
      model should and should not be used for.
    D: Schedule and budget matter to project management, not to understanding the risks of the model once
      it is in use.
