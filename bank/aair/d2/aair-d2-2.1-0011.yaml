difficulty: medium
stem: Analysts at a broadcaster built a model in a notebook during an internal hackathon to predict which
  programmes viewers will watch next. Marketing liked the results and now runs it weekly from an analyst's
  laptop to target campaigns. What should the risk practitioner recommend?
options:
  A: Move the model to a managed server and schedule the weekly run there
  B: Take the model through the standard development and approval process
  C: Have a second analyst check each week's targeting list before it is used
  D: Register it in the model inventory with a named owner and keep the weekly runs going
answer: B
explanation:
  why_correct: A hackathon prototype has skipped the testing, documentation, risk assessment and controls
    that production use needs. Putting it through the normal life cycle, in proportion to its risk, brings
    it under control while keeping the value the business has found.
  why_not:
    A: A managed server removes the laptop dependency, but the model would still be in use without validation,
      documentation, ownership or approval. It fixes the hosting, not the governance gap.
    C: A second check adds some assurance on each output, but it does not validate the model or bring
      it under the organisation's model risk controls.
    D: Registering the model with an owner is a sound first step, but use would continue with no validation,
      documentation or approval. The model needs to go through the standard process before it keeps driving
      campaigns.
