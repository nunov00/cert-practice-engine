id: aair-d2-2.3-0008
subdomain: '2.3'
difficulty: hard
stem: A logistics company's delivery-time model uses package weights from a warehouse system. During an
  upgrade, the warehouse team changed the field from kilograms to pounds, and the model's estimates were
  wrong for two weeks before anyone noticed. Which control would BEST prevent a repeat?
options:
  A: Include model owners in impact assessments of source system changes
  B: Monitor the model's inputs for sudden shifts in their distribution
  C: Require data science approval for changes to the warehouse system
  D: Give the data science team read access to the warehouse system's code
answer: A
explanation:
  why_correct: Models depend on upstream systems that other teams change. Making model owners part of
    the impact assessment for changes to source systems means a change like this is spotted and handled
    before release, as part of normal change management.
  why_not:
    B: Input monitoring is valuable and would have caught the problem sooner, but it is detective, and
      errors still reach customers before the alert. Including model owners in change assessments stops
      the breaking change being made without preparation.
    C: Approval for every change is out of proportion, as most warehouse changes do not affect the model.
    D: Read access to code does not mean anyone will notice a change at the right time.
