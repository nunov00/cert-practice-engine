subdomain: '2.4'
difficulty: hard
stem: A hospital is building a new sepsis model from six years of ward records. For the last five years, an older
  alert tool has flagged at-risk patients, and staff started antibiotics early for most of them; few flagged patients
  went on to develop sepsis. The new model will learn from whether each patient developed sepsis. What should be
  done with the training data?
options:
  A: Train only on the year of records from before the older alert tool went live
  B: Flag alerted patients given early antibiotics, and set their labels with clinicians
  C: Remove the patients the older tool flagged from the training data altogether
  D: Have clinicians re-review the alert-flagged patients' labels against sepsis criteria
answer: B
explanation:
  why_correct: Many patients the old tool flagged were treated before sepsis could develop, so high-risk patients
    are recorded as not developing it. Trained on those labels, the new model would learn that the signs which prompted
    an alert mean low risk. Flagging these patients and agreeing with clinicians how to label them, for example
    as at risk or as a separate group, keeps five years of data while stopping the treatment's success from being
    read as low risk.
  why_not:
    A: Pre-tool records avoid the effect of the alerts, but one year holds few cases of a rare outcome and reflects
      older practice. The model would be weak and out of date.
    C: Removing flagged patients avoids the misleading labels, but it also removes most of the high-risk patients,
      so the model would rarely see the signs it most needs to recognise.
    D: A review against the criteria would confirm that these patients did not develop sepsis, which is true. The
      labels are accurate but misleading, so checking them against criteria changes nothing.
