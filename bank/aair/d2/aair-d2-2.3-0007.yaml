id: aair-d2-2.3-0007
subdomain: '2.3'
difficulty: hard
stem: A public employment service validated a model that matches jobseekers to vacancies. For deployment,
  the IT team rewrote the feature calculations in the production system's own programming language. What
  should be done before go-live?
options:
  A: Ask the data scientists to sign off the production code by reading it
  B: Have IT peer-review the rewritten code against the specification
  C: Compare production outputs with the validated model on the same inputs
  D: Rerun the original validation suite on the production system and compare the metrics
answer: C
explanation:
  why_correct: Rewriting feature logic can introduce subtle differences, such as rounding or handling
    of missing values. Running the same inputs through both versions and reconciling the outputs shows
    whether what will run in production is the model that was validated.
  why_not:
    A: Reading code rarely catches subtle differences in behaviour; running both versions on the same
      data does.
    B: A peer review may find coding errors, but it compares the code with a document, not with the validated
      model. Small differences in calculations are easy to miss and only show up when outputs are compared.
    D: Matching aggregate metrics can hide differences in individual scores, such as rounding or missing-value
      handling. Comparing outputs record by record on the same inputs shows whether the rewrite reproduces
      the validated model.
