subdomain: '2.1'
difficulty: hard
stem: An energy utility approved the design of a model that ranks customers for energy-saving offers.
  During development the team added household-level smart meter data and changed the output so it automatically
  enrols customers in a tariff. The design document was not updated. What is the MOST significant risk?
options:
  A: The approval and risk assessment no longer cover what is being built
  B: Smart meter readings may be less reliable for homes with older meters
  C: Household smart meter data may reveal occupancy patterns and need a privacy assessment
  D: Customers enrolled automatically may complain about tariffs they did not choose
answer: A
explanation:
  why_correct: The approval was given for a ranking tool using less sensitive data. Adding granular personal
    data and automatic decisions changes the risk profile substantially, so the system is going ahead
    without its real risks having been assessed or accepted. Documentation matters because approvals rest
    on it.
  why_not:
    B: Data quality is a real concern for the new input, but it is one narrow risk. The bigger problem
      is that nobody has assessed or approved the new data and the automatic enrolment at all.
    C: The privacy question is real, but it is one of several new risks created by the changes. The bigger
      exposure is that none of them has been assessed, because the approval no longer covers what is being
      built.
    D: Complaints are a likely consequence, but they are an effect of one change. The significant risk
      is that a system with new data and automated decisions is going ahead outside its approval and risk
      assessment.
