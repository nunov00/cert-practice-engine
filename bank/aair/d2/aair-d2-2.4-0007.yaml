subdomain: '2.4'
difficulty: medium
stem: A microfinance lender is preparing training data for a repayment model. About 30% of records have
  no income value, and the team plans to fill the gaps with the average income. Most of the missing values
  come from branches serving rural, informal workers. What should the risk practitioner recommend?
options:
  A: Test whether missing income is correlated with repayment before imputing it
  B: Establish with the rural branches why income is not recorded before choosing a treatment
  C: Impute income from branch and occupation using a regression model
  D: Add a missing-income flag alongside a median-imputed value
answer: B
explanation:
  why_correct: The gaps are concentrated in branches serving rural, informal workers, which points to
    a collection cause, for example informal income that is never documented. Only the branches can explain
    that, and the right treatment depends on it. Filling the gaps without knowing why could misrepresent
    the people the lender most needs to assess fairly.
  why_not:
    A: A correlation test shows whether missingness predicts repayment, but not why income is missing.
      Statistics cannot tell undocumented informal income from no income.
    C: Model-based imputation is a recognised technique, but if income is missing because informal workers
      lack documents, the imputed values may misrepresent them. The cause should be understood first.
    D: A missing-value flag with imputation is common practice, but the flag can act as a proxy for rural
      or informal applicants, and whether that is acceptable depends on why the data is missing.
