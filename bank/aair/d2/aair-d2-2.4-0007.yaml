stem: A microfinance lender is preparing training data for a repayment model. About 30% of records have
  no income value, and the team plans to fill the gaps with the average income. Most of the missing values
  come from branches serving rural, informal workers. What should the risk practitioner recommend?
options:
  A: Delete all records with missing income so that only complete data is used
  B: Investigate why the values are missing before choosing how to treat them
  C: Fill the gaps with the median instead, as it is less affected by outliers
  D: Drop the income field from the model so that missing values do not matter
answer: B
explanation:
  why_correct: The gaps are concentrated in one group, so they are not random. Any treatment could distort
    how the model treats rural borrowers. Understanding the cause, checking the effect on each group and
    then choosing and documenting a treatment is the sound order.
  why_not:
    A: Deleting these records would strip out many rural borrowers and make the training data unrepresentative.
    C: 'The median has the same core problem as the mean: it imposes a typical urban figure on a different
      group.'
    D: Dropping a likely important field is premature, and other fields may still carry the same pattern.
