subdomain: '2.3'
difficulty: hard
stem: A freight insurer is replacing a rules engine with an AI model that routes incoming claims to handling
  teams. Testing went well, but the model has not yet seen live claim volumes. Which go-live approach
  BEST limits risk?
options:
  A: Load-test the model with synthetic claim volumes, then switch over
  B: Go live for one region and expand once complaints stay low
  C: Run the model alongside the rules engine and compare results
  D: Go live fully, with handlers able to re-route any claim sent wrongly
answer: C
explanation:
  why_correct: Running the model in parallel lets the insurer see how it behaves on real claims without
    those decisions taking effect. Differences can be investigated and fixed before any claim depends
    on the model, which gives the most evidence for the least exposure.
  why_not:
    A: Load testing shows the model can cope with volume, but not whether its routing decisions on real
      claims are right. The switch-over would still put every claim at risk at once.
    B: A regional rollout limits scope, yet relying on complaints means problems are found only after
      customers are affected.
    D: Manual re-routing limits harm, but it relies on handlers spotting each error after it has happened,
      and it puts all live claims through an unproven model.
