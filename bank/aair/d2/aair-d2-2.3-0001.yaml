subdomain: '2.3'
difficulty: medium
stem: An airline plans to retire a model that has scored customer churn risk for six years and replace
  it with a new vendor system. What should the risk practitioner ensure is done FIRST?
options:
  A: Delete the model's training data to reduce data protection exposure
  B: Switch off the model as soon as the vendor system has gone live
  C: Identify the systems, reports and decisions that depend on the model's outputs
  D: Archive the model code and weights in the document management system
answer: C
explanation:
  why_correct: Decommissioning can break processes that quietly rely on a model, such as downstream reports
    or marketing rules. Mapping dependencies first allows a planned cut-over, so nothing is left without
    an input when the model is switched off.
  why_not:
    A: Data may be subject to retention duties or needed for audits and comparisons. Deleting it first
      could breach obligations and remove evidence.
    B: Turning it off without knowing what relies on it risks failures in downstream processes that the
      new system may not feed.
    D: Archiving is a sensible step in retirement, but it can be done later. It does not prevent the business
      disruption caused by unknown dependencies.
