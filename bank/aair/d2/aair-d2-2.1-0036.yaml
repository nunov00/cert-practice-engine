subdomain: '2.1'
difficulty: hard
stem: A bank retrains a marketing model each month on customer data. Customers may withdraw consent at any time, and the bank
  has promised that a withdrawn customer's data will be left out of the next training run. Records reach the training set
  through several joins and aggregations. Which documentation design BEST supports this promise?
options:
  A: A version hash of each training dataset, stored with each model release
  B: A link from each training record to its source customers and consent status
  C: A datasheet describing each dataset's sources, collection and known gaps
  D: A record of each training run's code version, settings and data snapshot
answer: B
explanation:
  why_correct: After joins and aggregations, only record-level lineage tells the pipeline which training records derive from
    a customer who withdrew, so those records can be excluded before the next run.
  why_not:
    A: A hash proves which dataset a model used, but says nothing about which records came from which customer, so it cannot
      drive exclusions.
    C: A datasheet describes a dataset as a whole. It helps reviewers judge suitability, but it cannot pick out individual
      customers' records.
    D: Run records support reproducing a model, but a snapshot reference still does not show which records derive from a given
      customer after the joins.
