id: aair-d2-2.2-0005
subdomain: '2.2'
difficulty: medium
stem: A university is validating a model that flags students at risk of dropping out so advisers can contact
  them. Overall recall and precision meet the agreed thresholds. The student body includes many part-time
  and international students. Which additional test is MOST important?
options:
  A: Compare error rates across the main student groups
  B: Check that the risk scores are well calibrated so advisers can rank whom to contact first
  C: Repeat the test on the most recent intake of students only
  D: Test performance separately for first-year and later-year students
answer: A
explanation:
  why_correct: Good overall figures can hide poor performance for smaller groups. If part-time or international
    students are missed more often, they lose support the model was meant to trigger. Breaking results
    down by group shows whether the model works for everyone it serves.
  why_not:
    B: Calibration helps advisers prioritise, but it is still a whole-population measure. It would not
      show whether part-time or international students are flagged less reliably.
    C: Testing on the latest intake checks for change over time, but it still reports overall figures.
      It would not show whether part-time or international students are flagged less reliably.
    D: This is a sensible subgroup cut, but not of the groups the scenario highlights. The large part-time
      and international populations are where unequal errors are most likely.
