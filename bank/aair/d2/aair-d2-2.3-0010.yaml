subdomain: '2.3'
difficulty: hard
stem: A critical security vulnerability is announced in a machine learning library used by a hospital's
  bed-demand forecasting model. The patched version of the library changes some numerical routines. The
  model's annual revalidation is eight months away. What should the risk practitioner recommend?
options:
  A: Deploy the patch now and revalidate the model fully afterwards
  B: Run regression tests on the model's outputs with the patch, then deploy it promptly
  C: Deploy the patch to a test copy, run the full revalidation, then deploy
  D: Apply compensating network controls now and include the patch in next month's release
answer: B
explanation:
  why_correct: 'Both risks need to be handled: the vulnerability needs fixing quickly, and the changed
    numerical routines could shift forecasts. Comparing outputs on reference inputs before and after the
    patch confirms the model still behaves as validated, with escalation to fuller validation only if
    material differences appear.'
  why_not:
    A: Speed matters for a critical vulnerability, but deploying first could put changed forecasts into
      bed planning without anyone knowing. Targeted regression tests are quick and confirm outputs before
      release.
    C: Full revalidation is thorough but slow for a critical vulnerability. Targeted regression tests
      on the model's outputs give enough assurance to deploy promptly.
    D: Compensating controls reduce exposure, but leaving a critical flaw open for a month is hard to
      justify when quick regression tests would allow the patch to go in safely now.
