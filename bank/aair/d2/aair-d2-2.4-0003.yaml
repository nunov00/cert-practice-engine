stem: A news publisher has outsourced the labelling of 200,000 articles by topic to train a classification
  model, and 60,000 are labelled so far. Spot checks show annotators interpret some topic definitions
  differently. Which control would BEST improve the reliability of the training labels?
options:
  A: Have senior editors adjudicate each article where spot checks find disagreement
  B: Revise the topic guidelines and measure agreement on overlapping samples
  C: Replace the annotation vendor with an in-house team of editors
  D: Double-label a weekly sample and track agreement between annotators
answer: B
explanation:
  why_correct: The spot checks show the definitions are being read differently, so the guidelines themselves
    need clarifying. With most of the labelling still to come, measuring agreement on overlapping samples
    then shows whether consistency has improved and keeps monitoring it for the remaining 140,000 articles.
  why_not:
    A: Adjudication corrects the articles found in spot checks, but most disagreements go unseen, and
      the unclear guidelines keep producing new ones.
    C: Editors may know the topics better, but without clearer guidelines and agreement checks they can
      also read the definitions differently. The cause is the unclear definitions, not who does the labelling.
    D: Tracking agreement shows the size of the problem, but it does not fix the unclear definitions that
      are causing it.
