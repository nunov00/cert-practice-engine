id: aair-d2-2.1-0009
subdomain: '2.1'
difficulty: easy
stem: A small insurer's pricing model was built and is maintained by a single data scientist, who has
  just resigned with four weeks' notice. Her documentation consists of brief code comments. What standard
  should the risk practitioner set for the documentation she completes before leaving?
options:
  A: A summary of the model's business purpose for senior management
  B: Enough detail for a competent peer to rerun, maintain and explain it
  C: A full copy of her emails and meeting notes from the project
  D: A list of every dataset she has accessed during her employment
answer: B
explanation:
  why_correct: The risk is that nobody left can operate, change or explain the model. The right test for
    the handover documentation is whether a competent person who did not build it could rebuild and run
    it, maintain it and answer questions about how it works.
  why_not:
    A: A business summary is useful for managers but gives a successor nothing to run, fix or explain
      the model with.
    C: Raw emails and notes are unstructured and incomplete; a successor would still have to reconstruct
      how the model works.
    D: A list of datasets accessed is an access-review matter and does not explain the model, its data
      preparation or its assumptions.
