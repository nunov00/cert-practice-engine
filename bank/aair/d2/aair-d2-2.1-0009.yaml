id: aair-d2-2.1-0009
subdomain: '2.1'
difficulty: medium
stem: A small insurer's pricing model was built and is maintained by a single data scientist, who has
  just resigned with four weeks' notice. Her documentation consists of brief code comments. What standard
  should the risk practitioner set for the documentation she completes before leaving?
options:
  A: Enough detail to rebuild the model from source data and reproduce its outputs
  B: Enough detail for a competent peer to rerun, maintain and explain it
  C: The firm's standard documentation template, completed and peer-reviewed by a contractor
  D: Enough detail for the model validation team to review and challenge it
answer: B
explanation:
  why_correct: The risk is that nobody left can operate, change or explain the model. The right test for
    the handover documentation is whether a competent person who did not build it could rebuild and run
    it, maintain it and answer questions about how it works.
  why_not:
    A: Reproducibility is part of the standard, but a successor also has to maintain, change and explain
      the model, which needs design choices, assumptions and limitations, not only the build steps.
    C: A completed template and an outside review help, but a template can be filled in without what a
      peer needs to run and change the model. Adequacy is judged by whether a competent peer could take
      over.
    D: Validation-ready documentation shows the model is sound, but validators review a model rather than
      run, retrain or fix it. A successor needs operational detail as well, so the standard is what a
      competent peer would need to take the model over.
