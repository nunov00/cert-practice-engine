subdomain: '2.3'
difficulty: medium
stem: A council's housing repairs model runs in a container image that is rebuilt monthly to take operating system patches.
  After one rebuild, its priority scores shifted noticeably, although nobody had changed the model; the rebuild had pulled
  newer releases of its numerical libraries. Full revalidation takes about three weeks. Which control BEST prevents a repeat?
options:
  A: Rerun the full validation suite after each monthly image rebuild
  B: Alert the model owner when live score distributions shift suddenly
  C: Pin the library versions so rebuilds change only operating system patches
  D: Rebuild the image for critical patches instead of on a monthly cycle
answer: C
explanation:
  why_correct: The scores moved because an unrelated rebuild silently changed the libraries the model depends on. Pinning
    those versions keeps the monthly security patching while ensuring the model's numerical behaviour changes only when someone
    deliberately upgrades a library, which can then be tested as a model change.
  why_not:
    A: Full validation would catch the shift, but at three weeks per run it would take up most of each monthly cycle, and
      it treats every routine patch as a model change.
    B: An alert finds the shift after scores have already changed priorities for live repairs; it limits the harm rather than
      preventing it.
    D: Fewer rebuilds lower how often libraries change but leave the model exposed whenever a rebuild happens, and they delay
      security patches the council needs.
