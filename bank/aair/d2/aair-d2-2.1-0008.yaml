id: aair-d2-2.1-0008
subdomain: '2.1'
difficulty: medium
stem: A bank's data science team writes model documentation only after a model is in production, by having
  a technical writer interview the developers. A validator finds that several documents describe data
  choices that differ from what the code actually does. What is the BEST way to fix this?
options:
  A: Have a second technical writer review each document for accuracy
  B: Ask validators to rely on the code instead of the documentation
  C: Require documentation to be produced at each development stage gate
  D: Shorten the documentation template so that it is quicker to finish
answer: C
explanation:
  why_correct: 'The root cause is timing: documents written from memory after the event drift from what
    was built. Making documentation a required output at each stage gate means it is written by the people
    making the decisions, when they make them, and a gate cannot be passed without it.'
  why_not:
    A: A second writer still works from the developers' recollection after the fact, so the same gaps
      between the record and the code would remain.
    B: 'Code shows what the model does but not why: rationale, assumptions, rejected options and limitations.
      Users, auditors and future maintainers also need the documentation.'
    D: A shorter template would capture less, and it does nothing about documents being written long after
      the decisions they describe.
