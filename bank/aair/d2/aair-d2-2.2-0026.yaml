subdomain: '2.2'
difficulty: medium
stem: A pharmacy chain's model sets a daily stock level for each store and medicine. The chain's aim is that a store
  runs short of any given medicine on no more than about one day in fifty. Which validation result BEST shows whether
  the model meets this aim?
options:
  A: How closely the model's levels track actual demand from day to day
  B: How often actual demand outran the level, across store-days
  C: Size of the model's errors on the highest-demand store-days
  D: Fall in stockouts compared with the previous ordering method
answer: B
explanation:
  why_correct: 'The aim is a service level: shortfalls on about 2% of days. The direct test is coverage, the share
    of store-days on which demand went above the level set, compared with that target and ideally broken down by
    store and medicine group.'
  why_not:
    A: Tracking demand closely sounds right, but the level is meant to sit above typical demand. A model can track
      demand well and still run short far more often than the aim allows.
    C: Errors on peak days look relevant to shortages, but they do not show how often shortages happen overall,
      which is the property the aim sets.
    D: An improvement on the old method is encouraging, but it does not show the aim is met. Stockouts could fall
      a lot and still exceed one day in fifty.
