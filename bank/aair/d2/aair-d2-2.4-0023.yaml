id: aair-d2-2.4-0023
subdomain: "2.4"
difficulty: medium
stem: An insurer's staff assistant answers from a library of 40,000 procedure documents. Its answers sometimes
  follow procedures that were later replaced or withdrawn, and some were withdrawn with no replacement. Which
  data management practice BEST addresses this?
options:
  A: Give each document an owner and a date to confirm or retire it
  B: Rank more recent documents higher in the assistant's retrieval
  C: Show the date of each source document beside each answer
  D: Have authors link each replaced document to its successor, retrieving only the latest
answer: A
explanation:
  why_correct: The library holds documents that are no longer valid, and nothing in it says so. Named owners who
    must confirm or retire each document by a set date keep the content current at its source, including
    procedures withdrawn without a successor. The assistant then answers only from documents someone has
    confirmed still apply.
  why_not:
    B: Favouring newer documents helps where a replacement exists. Where a procedure was withdrawn with no
      replacement, nothing newer outranks it, so the assistant keeps following it.
    C: Showing source dates is good transparency, but it leaves staff to judge whether a dated document still
      applies, which they often cannot. The invalid documents stay in the library.
    D: Linking each document to its successor is sound version metadata and would stop the assistant quoting
      replaced procedures. A procedure withdrawn with no replacement has no successor to link to, so it stays
      the latest version and the assistant keeps following it.
