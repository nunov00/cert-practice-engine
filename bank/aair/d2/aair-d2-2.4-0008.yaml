id: aair-d2-2.4-0008
subdomain: '2.4'
difficulty: hard
stem: A health research charity wants to give an external partner a synthetic version of its patient dataset,
  instead of the real records, to train a model. The supplier of the generation tool says synthetic data
  contains no personal data. What should the risk practitioner advise before the data is shared?
options:
  A: Test this synthetic dataset for re-identification risk against the real records
  B: Share it under a contract that prohibits re-identification attempts
  C: Commission an independent privacy assessment of the generation tool
  D: Regenerate the data with differential privacy at a documented privacy budget
answer: A
explanation:
  why_correct: A supplier's general claim does not show that this dataset is safe. Synthetic data can
    reproduce rare records closely enough to identify people, so the charity should test this dataset
    against the real records before sharing. Checking fidelity at the same time confirms the data is still
    useful to the partner.
  why_not:
    B: A contractual ban is a useful extra safeguard, but it does not show that the data is safe. The
      re-identification risk and usefulness of the data should be tested first.
    C: An independent review of the tool adds assurance, but the risk depends on this dataset, with its
      rare conditions and small groups. A tool can be sound in general and still produce a risky dataset.
    D: Differential privacy reduces risk by design, but the charity still needs evidence that re-identification
      risk is acceptably low for this dataset before sharing.
