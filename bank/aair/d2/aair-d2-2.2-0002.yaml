id: aair-d2-2.2-0002
subdomain: '2.2'
difficulty: easy
stem: At a small fintech, the engineer who built a fraud scoring model also wrote and ran its validation
  tests before release. Which is the MOST significant weakness in this approach?
options:
  A: The tests did not measure how quickly the model scores each transaction
  B: The validation was done before release rather than after
  C: The engineer may not have documented the model's source code
  D: The validation is not independent of the development work
answer: D
explanation:
  why_correct: Validation is meant to challenge the model. A developer checking their own work tends to
    share the same assumptions and blind spots. Even in a small firm, a separate reviewer gives more reliable
    assurance.
  why_not:
    A: Scoring speed matters operationally, but it says nothing about whether the model's fraud decisions
      are sound. Lack of independent challenge is the bigger weakness.
    B: Validating before release is correct. The concern is who did it, not when.
    C: Documentation matters, but nothing in the scenario suggests it is missing, and it is less serious
      than the lack of independent challenge.
