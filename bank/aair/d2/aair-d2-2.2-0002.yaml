id: aair-d2-2.2-0002
subdomain: '2.2'
difficulty: hard
stem: At a small fintech, the engineer who built a fraud scoring model also wrote and ran its validation
  tests. The tests used a holdout sample from the same months as the training data, and no pass criteria
  were written down before the tests. Which is the MOST significant weakness?
options:
  A: The holdout came from the same period as the training data
  B: No acceptance criteria were agreed before testing
  C: The engineer's manager did not review and approve the test results
  D: The validation is not independent of the development work
answer: D
explanation:
  why_correct: Independence is the control that makes all other validation findings reliable. An independent
    validator would set criteria in advance, choose an appropriate holdout and challenge coverage. When
    the builder marks their own work, every weakness in the tests, including the others listed, is likely
    to go unchallenged. Even a small firm can get independent challenge from a peer outside the build
    or an external reviewer.
  why_not:
    A: A same-period holdout is a real weakness because it hides drift, but it is a test design flaw that
      independent validation would normally catch. Fixing it alone would leave the builder still checking
      their own work.
    B: Missing criteria let results be judged leniently, but this is also a symptom of the lack of independent
      challenge. An independent validator would set the criteria before testing.
    C: Management sign-off adds oversight, but a manager in the same team is not independent challenge
      and would rarely question the test design or set criteria in advance.
