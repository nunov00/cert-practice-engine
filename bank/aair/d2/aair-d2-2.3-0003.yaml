subdomain: '2.3'
difficulty: easy
stem: At an online retailer, a data scientist retrained the production pricing model on new data and deployed
  it the same afternoon without review, as the code had not changed. What is the main control weakness?
options:
  A: The retrained model bypassed change control and revalidation
  B: The retraining was done by a data scientist, not an engineer
  C: The deployment took place during normal trading hours
  D: The new data was more recent than the original training data
answer: A
explanation:
  why_correct: Retraining on new data produces a new model whose behaviour can differ even if the code
    is the same. It should go through the same change approval and testing as any other production change
    before it sets live prices.
  why_not:
    B: Data scientists commonly retrain models. The issue is the absence of review and testing, not the
      person's job title.
    C: Timing may affect the impact of a failure, but deploying an unvalidated model is the root weakness
      at any hour.
    D: Using recent data is often the purpose of retraining and is not itself a weakness.
