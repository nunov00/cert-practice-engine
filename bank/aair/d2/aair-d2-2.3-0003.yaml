id: aair-d2-2.3-0003
subdomain: '2.3'
difficulty: medium
stem: A data scientist at an online retailer retrained the production pricing model on new data. The release
  team approved deployment the same afternoon because no code had changed. Which control would BEST have
  prevented this?
options:
  A: A change policy that classifies retraining as a model change needing revalidation
  B: Automated data quality checks in the retraining pipeline
  C: Monitoring of live prices against the previous model's prices
  D: Require a second data scientist to approve each deployment
answer: A
explanation:
  why_correct: Separate people were already involved; the release team approved because its criteria looked
    only at code. A policy that defines retraining as a model change needing revalidation closes that
    gap for anyone who retrains or releases the model.
  why_not:
    B: Data quality checks are a useful preventive control, but they cover only the input data. A retrained
      model can behave differently even on clean data, so it still needs revalidation.
    C: Price monitoring is detective. It would show the effect after customers had already seen the new
      prices.
    D: Separation of duties already existed here, since the release team approved the deployment. A second
      approver using the same criteria would also see no change to review.
