subdomain: '2.1'
difficulty: medium
stem: A city council is developing a model to decide which roads to inspect for potholes first. The team
  plans to train it on the number of resident complaints logged for each road over the past five years.
  Some districts log far fewer complaints online than others. What is the MOST significant design risk?
options:
  A: Roads with few complaints give the model too few examples to learn from
  B: Repairs made over the five years may make older complaint counts out of date
  C: Complaint counts are not adjusted for each road's length or traffic volume
  D: Complaint counts measure reporting habits, not actual road condition
answer: D
explanation:
  why_correct: The chosen target is a proxy for the thing the council cares about. A model trained on
    complaints learns who complains, so districts that report less would be inspected less, however bad
    their roads. This flaw is built in at design and would persist even if the model predicted complaints
    perfectly; the team should find a target closer to road condition, such as inspection survey data.
  why_not:
    A: Sparse data is a real modelling issue, but the bigger problem is not the number of examples. Even
      with plenty of data, complaints would measure who reports, not road condition.
    B: Repairs can make old complaints stale, and the team should handle that, for example by weighting
      recent data. But that is a correctable data issue; the deeper flaw is that complaints measure who
      reports, so the model would systematically under-serve districts that complain less.
    C: Normalising by length or traffic would improve the measure, but it would still be a measure of
      complaints. The districts that report less would still be under-served.
