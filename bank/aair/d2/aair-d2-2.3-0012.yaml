stem: A telecom retired its churn model last quarter, following its retirement procedure. A marketing system was
  still reading the model's last scores from a table and used months-old scores in a retention campaign. What should
  the retirement procedure have included?
options:
  A: Archiving the model files and its documentation
  B: Revoking the model's service accounts and keys
  C: Deleting the training data under the retention schedule
  D: Confirming each downstream consumer had switched over
answer: D
explanation:
  why_correct: The failure came from a consumer that kept using the retired model's outputs. Identifying downstream
    users and confirming each one had moved to a replacement before retirement would have prevented stale scores
    being used.
  why_not:
    A: Archiving is a sound retirement step for audit and reproducibility, but it does not stop a system reading
      old outputs.
    B: Revoking credentials stops the model running, but the marketing system read stored scores, not the model.
    C: Deleting training data follows retention rules but does not affect the score table the marketing system used.
