id: aair-d2-2.4-0001
subdomain: '2.4'
difficulty: medium
stem: A telecom operator discovers that one of its customer datasets was collected under consent terms
  that do not cover AI training. It cannot tell which of its models were trained on that dataset. Which
  control would MOST have helped?
options:
  A: A maintained record linking each dataset to the models trained on it
  B: Longer retention of access logs on the data storage platform
  C: Encryption of all customer datasets held in the data lake
  D: A rule that all models are retrained from scratch each quarter
answer: A
explanation:
  why_correct: Data lineage between datasets and models lets the organisation quickly find every affected
    model when a data problem appears, so it can assess and act. Without it, the scope of the issue is
    unknown.
  why_not:
    B: Access logs show who read files, which might give clues, but they are a poor and incomplete substitute
      for an intended record of dataset use in training.
    C: Encryption protects confidentiality but records nothing about which models used which data.
    D: Regular retraining does not show which data was used and may keep reusing the problem dataset.
