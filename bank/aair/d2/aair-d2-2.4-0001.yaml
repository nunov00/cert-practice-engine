id: aair-d2-2.4-0001
subdomain: '2.4'
difficulty: medium
stem: A telecom operator discovers that one of its customer datasets was collected under consent terms
  that do not cover AI training. It cannot tell which of its models were trained on that dataset. Which
  control would MOST have helped?
options:
  A: A maintained record linking each dataset to the models trained on it
  B: A model inventory recording each model's training pipeline and owner
  C: A data catalogue recording the consent terms of each dataset
  D: Model cards that list each model's main data sources at summary level
answer: A
explanation:
  why_correct: Data lineage between datasets and models lets the organisation quickly find every affected
    model when a data problem appears, so it can assess and act. Without it, the scope of the issue is
    unknown.
  why_not:
    B: An inventory with pipelines and owners helps, but pipeline names do not record which dataset versions
      were used. The operator would still have to reconstruct which models consumed the affected data.
    C: A catalogue of consent terms helps spot the problem dataset, which the operator has already done.
      The gap is the link from that dataset to the models built from it.
    D: Summary-level source lists may name a system rather than the exact dataset, so they might not show
      which models used the affected data. A maintained dataset-to-model record does.
