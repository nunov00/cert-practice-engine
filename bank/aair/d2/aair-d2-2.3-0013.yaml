id: aair-d2-2.3-0013
subdomain: '2.3'
difficulty: medium
stem: A card issuer will switch to a new version of its fraud model over a weekend. To free capacity, the plan removes
  the old version's serving environment as soon as the new one is live. What should the risk practitioner ask to
  be added to the plan?
options:
  A: Extra monitoring of fraud alerts during the first week live
  B: A phased rollout to a share of card transactions at first
  C: A tested way to restore the old version quickly if needed
  D: Sign-off from fraud operations before the switch goes ahead
answer: C
explanation:
  why_correct: Removing the old environment straight away leaves no fallback if the new version misbehaves in production.
    A tested rollback path, keeping the old version restorable until the new one has proven itself, limits how long
    a fault can last. Monitoring and phasing are useful but depend on having somewhere to go back to.
  why_not:
    A: Extra monitoring helps spot problems sooner, but without a way back the team could only watch while it fixed
      the new version.
    B: A phased rollout reduces exposure, but if the old environment is removed there is still nothing to send the
      remaining traffic to when a fault appears.
    D: Operational sign-off confirms readiness, but it does not provide a recovery option if something goes wrong
      after the switch.
