id: aair-d2-2.1-0015
subdomain: '2.1'
difficulty: hard
stem: "A dermatology clinic is designing how its AI tool will present results to doctors. In a trial, the tool showed its suggested diagnosis with a confidence score, and many of its wrong suggestions carried high scores. Doctors' accuracy fell well below their usual level on those cases. Which design change BEST addresses this?"
options:
  A: Show the three most likely diagnoses instead of a single one
  B: Highlight the image regions that drove each suggestion
  C: Hide the suggestion when the model's confidence is low
  D: Ask doctors to record their own view before showing the AI's
answer: D
explanation:
  why_correct: 'The trial shows anchoring: doctors followed the tool when it was wrong, even with its confidence
    shown. Having doctors form and record their own judgement first keeps an independent view. The tool then works
    as a second opinion, and a disagreement prompts a closer look instead of quiet acceptance.'
  why_not:
    A: A short list of possible diagnoses gives more information, but doctors still see the tool's framing before
      forming their own view, so anchoring remains.
    B: Highlighting regions can help doctors check a suggestion, but such maps are often hard to interpret and can
      increase trust in wrong outputs.
    C: "Confidence was already shown and did not prevent over-reliance. Many wrong suggestions carried high scores, so hiding low-confidence ones would not reach those errors."
