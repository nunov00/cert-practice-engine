subdomain: '2.4'
difficulty: hard
stem: A software company fine-tunes its support model each quarter on its own knowledge base. Staff now publish most new
  articles by lightly editing drafts from that same model. Which data management practice BEST protects future fine-tuning?
options:
  A: Fine-tune only on articles that customers rated as helpful
  B: Record for each article whether the model drafted it
  C: Have experts review a sample of articles before each fine-tune
  D: Fine-tune only on articles updated within the past year
answer: B
explanation:
  why_correct: 'Training a model repeatedly on its own lightly edited output risks reinforcing its errors and habits and
    narrowing its range over successive rounds. Recording which articles the model drafted does not prevent that by itself,
    but it is what lets the team curate: limit or down-weight model-drafted articles in each training set, verify them more
    closely, and keep enough independent human-written material. Without the label, none of those controls can be applied.'
  why_not:
    A: Ratings filter out poor articles, but model-drafted articles can be rated helpful while still repeating the model's own
      patterns and subtle errors back into training.
    C: Expert sampling can catch substantive errors and is worth keeping, but it measures article quality, not how much of the
      training set is the model's own output, so a sample can pass while that share keeps growing.
    D: A recency filter keeps content current, but recent articles are mostly model drafts, so it raises the share of the
      model's own output in training.
