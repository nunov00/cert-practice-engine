difficulty: medium
stem: The design document for an invoice-reading model records its purpose, architecture and test results. The model
  was trained and tested only on invoices from domestic suppliers, and the document does not say so. Procurement
  plans to onboard foreign suppliers next year. What should the team add before approval?
options:
  A: A plan to retrain the model on foreign invoices
  B: The model's tested scope and known limits of use
  C: Test results on a sample of foreign supplier invoices
  D: An accuracy monitor that alerts on falling performance
answer: B
explanation:
  why_correct: The model is being approved for domestic invoices. Recording what it was tested on and where it should
    not be relied on lets anyone extending it to foreign suppliers see that it needs new testing first, instead
    of assuming it works.
  why_not:
    A: Retraining may be needed later, but planning it now does not record the limit that applies to the model being
      approved.
    C: Testing on foreign invoices belongs to the later decision to extend the model; the current approval is for
      domestic use.
    D: A monitor would detect falling accuracy after foreign invoices arrive, rather than preventing reliance on
      an untested use.
