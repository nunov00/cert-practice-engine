id: aair-d2-2.2-0001
subdomain: '2.2'
difficulty: hard
stem: A credit card issuer's team reports an AUC of 0.86 for a new default prediction model. They trained
  and tested it by randomly splitting five years of account history into training and test sets. The model
  will be used to predict defaults in future months. What is the risk practitioner's MAIN concern?
options:
  A: The test does not reflect use on future data, so a time-based holdout is needed
  B: AUC measures ranking only, so the calibration of predicted default rates should be tested
  C: Accuracy should also be reported separately for each year of the history
  D: The developers ran the test, so an independent team should repeat it
answer: A
explanation:
  why_correct: A random split mixes later records into training, letting the model learn from conditions
    it would not have known at prediction time. Results can look much better than live performance. Testing
    on a later period than the training data mirrors how the model will be used.
  why_not:
    B: Calibration testing is valid work, but it would use the same random split. The main issue is that
      the test mixes past and future records, so every metric, calibration included, is likely to be optimistic.
    C: Year-by-year results could reveal drift, but every year would still be tested on records mixed
      randomly with the training data. The test would still not mimic predicting months the model has
      never seen.
    D: Independent validation is good practice, but repeating the same flawed design would confirm the
      same misleading figure. The test design must change.
