id: aair-d2-2.4-0004
subdomain: '2.4'
difficulty: hard
stem: A specialty chemicals firm trained a model on its confidential formulation data. The trained model
  files are stored on a shared drive open to all engineers and contractors, while the source data sits
  in a restricted system. Which action BEST addresses the risk?
options:
  A: Restrict the shared drive folder to permanent engineering staff
  B: Require engineers and contractors to sign confidentiality terms
  C: Add a watermark to the model so leaked copies can be traced
  D: Protect the model files at the level of the training data
answer: D
explanation:
  why_correct: A trained model can reveal or reproduce information from its training data, and it is valuable
    in its own right. Classifying and restricting the model artefacts like the confidential data they
    came from closes the gap between the two access regimes.
  why_not:
    A: Removing contractors narrows access, but it is still far broader than the access to the source
      data. The model can reveal information about its training data, so it needs the same protection.
    B: Confidentiality terms are a deterrent, but everyone on the drive could still copy the files. Models
      can leak information about their training data, so they need the same access controls as that data.
    C: Watermarking may help after a leak, but it does not stop people without a need from accessing the
      model.
