id: aair-d2-2.2-0003
subdomain: '2.2'
difficulty: medium
stem: A manufacturer's vision model inspects parts for defects, which occur in about 1% of output. The
  test report shows 99% accuracy and the team proposes release. What should the risk practitioner ask
  for before agreeing?
options:
  A: Precision on the parts the model flags as defective
  B: A comparison of accuracy against the previous model
  C: The rate at which actual defects are caught and missed
  D: Accuracy on a test set rebalanced to equal numbers of defective and good parts
answer: C
explanation:
  why_correct: With defects this rare, a model that passes every part would also score about 99% accuracy.
    The figure that matters is how many real defects the model catches and misses, measured on the defect
    class itself.
  why_not:
    A: Precision shows how many flagged parts are really defective, which matters for wasted rework, but
      it says nothing about defects the model misses. Missed defects are the main risk when they reach
      customers.
    B: Comparing one misleading figure with another does not show whether defects are being caught.
    D: Rebalancing makes the accuracy figure less misleading, but it still blends both kinds of error
      into one number. The practitioner needs the catch and miss rates for actual defects directly.
