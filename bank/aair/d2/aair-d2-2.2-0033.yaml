stem: A marketplace will replace its manual review with a model that removes counterfeit listings within seconds
  of posting. It was validated on a random holdout of last year's listings labelled by the review team, with high
  recall. A seller gets a removal notice at once and can post a new listing straight away at no cost. Which further
  test is MOST important before launch?
options:
  A: Recall on a time-based holdout of listings from the most recent quarter
  B: Precision by product category, to size wrongful removals of genuine sellers
  C: Recall on listings from seller accounts opened after the holdout period
  D: Recall on listings testers alter to evade the model as sellers would
answer: D
explanation:
  why_correct: Instant notice and free relisting give counterfeit sellers a fast, costless way to try variations
    until one passes, a feedback loop the manual process never offered. Last year's listings were written against
    human reviewers, not against this model. Testing recall on listings deliberately altered the way sellers would
    alter them estimates performance against that adaptive behaviour, which no historical sample contains.
  why_not:
    A: A recent holdout tests for drift over time, which matters, but recent listings were still written before
      this model existed. None of them was changed to get past it.
    B: Wrongful removals of genuine sellers are a real cost to measure, but they do not show whether the model keeps
      counterfeits off the site once sellers start working around it.
    C: Counterfeit sellers do churn accounts, so new accounts are a sensible slice, but their listings were also
      written without any chance to probe this model and say nothing about evasion.
