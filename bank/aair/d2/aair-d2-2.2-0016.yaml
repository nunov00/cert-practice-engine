id: aair-d2-2.2-0016
subdomain: '2.2'
difficulty: hard
stem: An insurer validates an AI tool that summarises claim files by scoring each summary's word overlap with a summary a
  claims handler wrote. Average overlap is high on 2,000 claims. What is the MAIN weakness of this validation?
options:
  A: Overlap scores penalise valid summaries worded differently
  B: Overlap scores can be high when key facts are wrong
  C: Handler summaries vary in length and level of detail
  D: The 2,000 claims may not include the rarest claim types
answer: B
explanation:
  why_correct: Word overlap measures shared wording, not accuracy. A summary can repeat most of the handler's words while
    getting an amount, date or exclusion wrong, which is the error that harms claimants, so a high score does not show the
    tool is safe to use.
  why_not:
    A: Penalising good paraphrases is a real flaw, but it makes the tool look worse than it is. The larger risk is a score
      that hides wrong facts.
    C: Varied references add noise to the scores, but they do not explain why a high average could hide harmful errors.
    D: Coverage of rare claims is worth checking, but the method would still miss wrong facts on common claims.
