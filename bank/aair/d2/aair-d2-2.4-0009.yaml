id: aair-d2-2.4-0009
subdomain: '2.4'
difficulty: medium
stem: Data scientists at a university copy full student records, including names, addresses and disability
  details, from the production system into their development environment to build a course recommendation
  model. Which practice BEST reduces the risk?
options:
  A: Apply production-level access controls, logging and encryption to the development environment
  B: Pseudonymise each record with a keyed hash before it leaves production
  C: Build the model on synthetic records generated from the production data
  D: Use only the fields needed, with identifiers removed or masked
answer: D
explanation:
  why_correct: Development environments usually have weaker controls than production. Copying only the
    fields the model needs, with direct identifiers removed or masked, cuts the amount of sensitive data
    exposed in the first place.
  why_not:
    A: Securing the environment like production reduces the chance of a breach, but the team would still
      hold addresses and disability details that a course recommendation model does not need.
    B: Pseudonymisation protects identities, but every field, including disability details, would still
      be copied. Minimisation removes what the model does not need.
    C: Synthetic data can reduce risk, but generating it still processes the full records, and its privacy
      and fidelity would need testing. Taking only the needed, de-identified fields is simpler and directly
      limits exposure.
