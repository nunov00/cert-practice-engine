id: aair-d2-2.4-0009
subdomain: '2.4'
difficulty: easy
stem: Data scientists at a university copy full student records, including names, addresses and disability
  details, from the production system into their development environment to build a course recommendation
  model. Which practice BEST reduces the risk?
options:
  A: Encrypt the development environment's backups with a strong key
  B: Ask the data scientists to sign a confidentiality agreement
  C: Delete the copied records once the model has been deployed
  D: Use only the fields needed, with identifiers removed or masked
answer: D
explanation:
  why_correct: Development environments usually have weaker controls than production. Copying only the
    fields the model needs, with direct identifiers removed or masked, cuts the amount of sensitive data
    exposed in the first place.
  why_not:
    A: Encrypting backups protects one copy but leaves the full sensitive data exposed in the working
      environment.
    B: An agreement sets expectations but does not reduce the sensitive data held or who could reach it.
    C: Deletion after deployment still leaves full records exposed throughout development.
