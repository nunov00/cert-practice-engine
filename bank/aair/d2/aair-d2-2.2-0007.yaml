id: aair-d2-2.2-0007
subdomain: '2.2'
difficulty: hard
stem: A grocery chain's team built a demand forecasting model over several months. Each time they changed
  features or settings, they checked the result against the same held-back test set and kept the changes
  that improved it. They now present that test score as the expected live performance. What is the BEST
  response?
options:
  A: Re-split the existing data with a new random test set and rescore the final model
  B: Ask for cross-validation on the training data to confirm it
  C: Ask for confidence intervals around the reported test score
  D: Evaluate the final model on fresh data not used in tuning
answer: D
explanation:
  why_correct: Repeatedly choosing changes based on one test set tunes the model to that set, even if
    it was never used for training. The score is therefore optimistic. A final check on data that played
    no part in any decision gives an honest estimate of live performance.
  why_not:
    A: Records from the old test set already shaped many tuning choices, and a new random split would
      mix them back into the test. The new estimate would still be partly leaked; only data unused in
      tuning gives an honest figure.
    B: Cross-validation on training data assesses fit during development, but it does not remove the bias
      in the reported test score.
    C: Confidence intervals describe random error around the score, not the bias created by repeated tuning.
      The interval would be centred on an inflated number.
