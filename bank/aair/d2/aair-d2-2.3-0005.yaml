id: aair-d2-2.3-0005
subdomain: '2.3'
difficulty: medium
stem: A social benefits agency is retiring a model that helped assess eligibility for housing support.
  Applicants can appeal decisions for several years. Which action is MOST important for the agency to
  complete as part of decommissioning?
options:
  A: Archive the model so that it could be restarted if needed
  B: Revoke the model's system access and remove its interfaces
  C: Document the reasons for retiring the model
  D: Retain decision records and model details for the appeal period
answer: D
explanation:
  why_correct: Appeals require the agency to show how a past decision was reached. Keeping decision logs,
    the model version and its documentation for as long as appeals are possible preserves that evidence
    after the model itself stops running.
  why_not:
    A: Keeping the model is part of the answer, but the appeals need the records of each decision and
      how it was reached, not just the ability to run the model again.
    B: Removing access is an important decommissioning step, but it does not protect applicants' ability
      to challenge decisions over the coming years.
    C: Recording the reasons is good practice, but it does not preserve what applicants and reviewers
      will need to examine past decisions on appeal.
