id: aair-d2-2.1-0003
subdomain: '2.1'
difficulty: medium
stem: A city council is building an AI tool to triage building permit applications. The pilot will issue
  real decisions to applicants. The project lead plans to decide on logging, human review and appeal handling
  after the pilot shows how the tool behaves. What should the risk practitioner advise?
options:
  A: Complete an impact assessment during the pilot and set controls from its findings
  B: Run the pilot with each decision reviewed by an officer, logged in a spreadsheet and open to the
    complaints process
  C: Specify logging and human review now, and define the appeal route before full go-live
  D: Specify logging, human review and appeal handling as requirements before the build
answer: D
explanation:
  why_correct: Logging, human review and appeals shape what data is kept, how interfaces work and how
    decisions flow, so they are cheaper and more reliable when designed in than retrofitted. Because the
    pilot issues real decisions, applicants need all three, including a route to appeal, from the first
    decision.
  why_not:
    A: An impact assessment is valuable, but doing it during the pilot means real applicants are decided
      on before the controls exist, and the controls would then have to be retrofitted.
    B: Manual review, a spreadsheet log and the complaints route cover the pilot, but they sit outside
      the tool. The real controls would still have to be built in later, and a general complaints process
      is not designed for appeals against automated triage decisions.
    C: This designs in most of the controls, but applicants in the pilot receive real decisions and would
      have no way to appeal until full go-live.
