subdomain: '2.2'
difficulty: medium
stem: A pension provider is testing a generative AI assistant that will answer members' questions about
  their benefits. So far the developers have tried about 40 questions they wrote themselves, and the answers
  looked good. Which further testing is MOST important before launch?
options:
  A: A structured evaluation with realistic and adversarial questions
  B: A load test showing the assistant can handle peak member traffic
  C: A review of the assistant's tone by the marketing department
  D: A repeat of the 40 questions after each change to the prompt
answer: A
explanation:
  why_correct: Forty questions written by the builders are narrow and share their assumptions. A broad
    set of realistic member questions, edge cases and attempts to mislead or misuse the assistant, scored
    against agreed criteria by people who know the pension rules, gives real evidence of answer quality
    and safety.
  why_not:
    B: Capacity matters for launch, but it says nothing about whether the answers are correct or safe.
    C: Tone affects member experience, but the main risk is wrong or misleading answers about benefits.
    D: Repeating a small set is useful as a regression check, but it does not widen the coverage that
      is missing.
