id: aair-d2-2.2-0010
subdomain: '2.2'
difficulty: medium
stem: A pension provider is testing a generative AI assistant that will answer members' questions about
  their own benefits and options. So far the developers have tried about 40 questions they wrote themselves,
  and the answers looked good. Which further testing is MOST important before launch?
options:
  A: Scored testing on a large sample of real member questions
  B: Red-team testing for prompt injection, data leakage and harmful answers
  C: Pension experts scoring the 40 answers against agreed accuracy criteria
  D: Automated regression tests on the 40 questions after each prompt change
answer: A
explanation:
  why_correct: The main harm to members is a wrong answer about their benefits, and the only evidence
    so far comes from 40 questions written by the builders, who share the same assumptions. Scored testing
    on a large sample of real member questions shows how accurate the assistant is on what members will
    actually ask.
  why_not:
    B: Red-teaming is needed for a public-facing assistant, but it does not show whether answers to ordinary
      benefit questions are correct, which is the untested core risk.
    C: Expert scoring makes the judgement of accuracy more reliable, but it still covers only the 40 questions
      the developers chose.
    D: Regression tests catch changes in known answers, but they keep testing the same narrow set of questions.
