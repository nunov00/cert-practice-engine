id: aair-d2-2.1-0007
subdomain: '2.1'
difficulty: medium
stem: A water utility is procuring an AI system that detects leaks from pressure sensor data. The leading
  vendor reports 95% detection on its own benchmark dataset, gathered from networks in other countries
  with different pipe materials. What should the risk practitioner recommend before the contract is signed?
options:
  A: Run a proof of concept on the utility's own network data
  B: Ask for the benchmark's method and an independent audit of the result
  C: Ask the vendor's reference customers how well detection works in practice
  D: Add a contract penalty for detection rates below the benchmark figure
answer: A
explanation:
  why_correct: Results on other networks may not carry over to different pipes, sensors and operating
    conditions. Testing the system on the utility's own representative data, against acceptance criteria
    agreed in advance, shows whether it works where it will actually be used, while the utility can still
    walk away or negotiate.
  why_not:
    B: An audit could confirm the benchmark was run properly, but the benchmark still comes from networks
      with different pipe materials. A sound test on the wrong data does not show performance on this
      network.
    C: Reference customers give useful practical insight, but their networks may differ from the utility's
      as much as the benchmark's do. Only a test on the utility's own data shows how the system will perform
      here.
    D: A penalty offers some compensation after a poor result, but it does not establish fitness before
      the utility commits, and it leaves the operational risk of missed leaks in place.
