id: aair-d2-2.3-0006
subdomain: '2.3'
difficulty: hard
stem: A hospital deployed a sepsis alert model three months ago. Nurses now override about 70% of its
  alerts. Retrospective checks show the model still performs at its validated level. What should the risk
  practitioner do FIRST?
options:
  A: Find out with clinical staff why the alerts are being overridden
  B: Compare the override rate with the rate assumed in the deployment risk assessment
  C: Raise the alert threshold so that fewer, higher-risk alerts are sent
  D: Report the override rate to the clinical governance committee as a safety risk
answer: A
explanation:
  why_correct: The model still performs as validated, so the problem probably lies in how the alerts fit
    clinical work, or in whether nurses trust them. The practitioner cannot choose a fix until the reasons
    for the overrides are known, and the clinical staff who override the alerts are the people who can
    explain them.
  why_not:
    B: The comparison shows how far use has drifted from the plan, which the overrides already make clear.
      It does not reveal why nurses override, which is what a fix depends on.
    C: Changing the threshold may turn out to be the fix, but it is a guess before the cause is known.
      If nurses override alerts for workflow or trust reasons, fewer alerts could simply hide real sepsis
      cases.
    D: Escalation may be needed, but the committee will first ask why alerts are overridden. Finding the
      cause with clinical staff gives it something to act on.
