subdomain: '2.3'
difficulty: hard
stem: A hospital deployed a sepsis alert model three months ago. Nurses now override about 70% of its
  alerts. Retrospective checks show the model still performs at its validated level. What should the risk
  practitioner do FIRST?
options:
  A: Find out with clinical staff why the alerts are being overridden
  B: Retrain the model on recent patient data to restore trust
  C: Require nurses to act on every alert the model raises
  D: Suspend the model until its accuracy has been revalidated
answer: A
explanation:
  why_correct: The model performs as validated, so the problem lies in how it fits into clinical work,
    for example alert volume, timing or thresholds. Understanding the reasons comes before any fix and
    may reveal alert fatigue that could cause real cases to be ignored.
  why_not:
    B: The evidence shows performance has not degraded, so retraining addresses a problem that has not
      been shown to exist.
    C: Forcing compliance ignores clinical judgement and could cause harm if the overrides reflect real
      issues with the alerts.
    D: Revalidation was effectively already done, and suspending removes a working safety aid without
      knowing the cause.
