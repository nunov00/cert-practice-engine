id: aair-d2-2.2-0006
subdomain: '2.2'
difficulty: easy
stem: A logistics company tested a model that predicts delivery arrival times. After seeing the results,
  the team set the pass threshold just below the error rate the model achieved. What is the main weakness
  in this validation?
options:
  A: The threshold was set by the team rather than by the vendor
  B: The acceptance criteria were set after seeing the results
  C: The test measured average error instead of the worst case
  D: The error was reported in minutes rather than as a percentage
answer: B
explanation:
  why_correct: Acceptance criteria should come from business needs and be fixed before testing. Setting
    them afterwards to fit the result means the test can no longer fail, so it gives no real assurance
    that the model is good enough.
  why_not:
    A: The team, with the business, is often the right party to set criteria. The problem is timing, not
      who set them.
    C: Which measure to use is a fair design question, but any measure loses value if its threshold is
      fitted to the result.
    D: The unit of measure is a presentation choice; either works if the threshold reflects business
      needs and is fixed before testing.
