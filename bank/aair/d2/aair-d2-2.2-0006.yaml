id: aair-d2-2.2-0006
subdomain: '2.2'
difficulty: hard
stem: A logistics company validated a model that predicts delivery arrival times. The team judged it on
  average error only, set the pass threshold after reviewing the results, and did not compare it with
  dispatchers' current estimates. What is the MOST significant weakness in this validation?
options:
  A: Only average error was used, so large misses could be hidden
  B: The pass threshold was set after the results were seen
  C: The model was not compared with the dispatchers' current estimates
  D: Error was not reported separately for each delivery region
answer: B
explanation:
  why_correct: A threshold chosen after seeing the results can be fitted to whatever the model achieved,
    so the validation cannot fail. That removes the point of the test. The other gaps weaken the evidence,
    but they can only be judged once there are criteria agreed in advance.
  why_not:
    A: Average error can hide large misses, and other metrics should be added. But even a richer set of
      metrics would be meaningless if the pass levels are set after the results are known.
    C: A comparison with current estimates shows whether the model adds value, but it is still a test
      without a pre-agreed pass mark. Fixing the criteria comes first.
    D: Regional results would show uneven performance, but the same problem applies. Any threshold set
      after the fact can be made to pass.
