subdomain: '2.1'
difficulty: hard
stem: A card issuer's design has its fraud model update its weights continuously from customers' fraud reports, so it
  adapts to new schemes within hours. Investigators take about two weeks to confirm a report. Fraud rings open accounts
  cheaply and file reports in coordinated waves. What should the risk practitioner require in the design?
options:
  A: Batched updates that pass validation gates before release
  B: Training only on reports that investigators have confirmed
  C: A cap on how far any single report can shift the weights
  D: Limits on how many reports each customer can file
answer: A
explanation:
  why_correct: Continuous learning lets every report change the live model with no check. Batching updates, perhaps
    hourly, and passing each batch through automated validation gates keeps fast adaptation while testing every version,
    including the effect of a wave of fake reports, before it scores real payments.
  why_not:
    B: Confirmed labels remove fake reports, but a two-week wait defeats the design's purpose of adapting within hours.
    C: A per-report cap limits each single report, but a coordinated wave of many small shifts can still add up to a
      large change in the model.
    D: Per-customer limits slow one account, but cheap accounts let fraud rings spread their reports across many of them.
