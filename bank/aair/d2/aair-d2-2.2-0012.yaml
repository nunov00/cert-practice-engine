id: aair-d2-2.2-0012
subdomain: '2.2'
difficulty: medium
stem: An online retailer's model risk team validated a new returns-fraud model by rerunning the developers'
  performance tests and confirming they got the same results. They did not examine the model's design,
  data choices or assumptions. What is the MAIN gap in this validation?
options:
  A: It did not test the model on data from a later period
  B: It did not include a review of the model's production code
  C: It did not run sensitivity analysis on the model's key inputs and assumptions
  D: It does not assess whether the design suits its intended purpose
answer: D
explanation:
  why_correct: 'Reproducing the developers'' results only confirms their arithmetic. Effective validation
    also challenges conceptual soundness: whether the approach, data and assumptions are suitable for
    detecting returns fraud, and where they could fail.'
  why_not:
    A: Out-of-time testing is worth adding, but it is still a performance test. The main gap is that nobody
      challenged whether the design, data and assumptions suit the purpose.
    B: A code review checks implementation, which matters, but correct code can still implement an unsuitable
      design. Conceptual soundness is the core of independent validation and was skipped.
    C: Sensitivity analysis is useful and closer to the gap, but it tests how outputs react to inputs.
      It does not challenge whether the design, data choices and assumptions suit the purpose in the first
      place.
