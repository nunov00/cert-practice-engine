subdomain: '2.1'
difficulty: hard
stem: A benefits agency is designing a system to decide whether applicants are eligible, under criteria set out exactly in
  law, and to pick applications for fraud checks. The team proposes one machine learning model trained on ten years of past
  decisions for both tasks. What should the risk practitioner recommend?
options:
  A: Encode eligibility as rules and use a model only to select fraud checks
  B: Use the one model, with officers reviewing each refusal before it is sent
  C: Use the one model, with an explanation tool giving reasons for each refusal
  D: Train separate models for eligibility and for selecting fraud checks
answer: A
explanation:
  why_correct: Where eligibility criteria are set out exactly in law, they can be applied as rules that give the legally correct
    result and can be traced to the law. A model trained on past decisions would only approximate them and would learn past
    officers' errors. Machine learning still adds value where judgement is needed, in choosing which applications to check
    for fraud.
  why_not:
    B: Reviewing refusals catches some wrong refusals, but leaves wrong approvals unchecked, and reviewers would be checking
      a model's approximation of rules that could be applied exactly.
    C: Explanations help applicants and reviewers, but they explain a learned approximation of the law. They do not make the
      eligibility result correct.
    D: Separating the tasks is a step forward, but a model for eligibility still learns from past decisions, errors included,
      where exact legal criteria can be applied directly.
