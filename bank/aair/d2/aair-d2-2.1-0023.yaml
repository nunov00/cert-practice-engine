subdomain: '2.1'
difficulty: hard
stem: A lender is developing a gradient-boosted credit model. Testing shows that, within some narrow income bands, a higher
  income gives a slightly worse score, although overall accuracy is high. The lender's credit policy requires that a higher
  income can never worsen an applicant's score. What should the development team do?
options:
  A: Group income into broad bands before it enters the model
  B: Add training data from the income bands where scores dip
  C: Give underwriters an explanation of each input's effect on the score
  D: Constrain the model in training so higher income cannot lower a score
answer: D
explanation:
  why_correct: The policy sets a guarantee, not a tendency. Tree-based models such as gradient boosting can be trained with
    a monotonic constraint on chosen inputs, so the learned relationship with income can only rise or stay flat. That meets
    the policy by construction, at little cost to accuracy, and the property can be tested before release.
  why_not:
    A: Broad bands smooth out some small dips, but the score can still fall from one band to the next, and grouping throws
      away information. It reduces the problem without guaranteeing what the policy requires.
    B: Sparse data often causes such dips, and more data may shrink them, but nothing makes the learned pattern rise with
      income in every band.
    C: Explanations would let underwriters see the dips, but they leave the scores as they are, so applicants could still
      be scored against the policy.
