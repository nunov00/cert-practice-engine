id: aair-d2-2.4-0011
subdomain: '2.4'
difficulty: medium
stem: A regulator asks an insurer to show how a pricing model used eighteen months ago was built, including
  the exact data it learned from. The insurer still has that model version, but its training tables have
  since been overwritten by routine updates in the data warehouse. Which practice would have allowed it
  to respond?
options:
  A: Keeping the training code and feature pipeline under version control
  B: Logging the exact query used to extract each training set
  C: Keeping immutable, versioned snapshots of the training data
  D: Documenting the data fields used in each model version
answer: C
explanation:
  why_correct: Showing how a model was built needs the data exactly as it was at training time. Fixed,
    versioned snapshots linked to each model version make the training reproducible even after the live
    tables change.
  why_not:
    A: Versioned code is needed to rebuild a model, but rerunning it against overwritten tables would
      produce different data. The original data itself must be kept.
    B: The logged query shows how the data was selected, but running it today returns today's data. Only
      an immutable snapshot preserves what the model actually learned from.
    D: A list of fields describes the data's structure but not the actual values used in training.
