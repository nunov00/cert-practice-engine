id: aair-d2-2.4-0010
subdomain: '2.4'
difficulty: hard
stem: A consumer lender is building a new credit model trained only on loans it approved in the past,
  because repayment outcomes exist only for those applicants. The model will score all future applicants,
  including types the lender used to decline. What is the MOST significant data risk?
options:
  A: The training data does not represent the full population being scored
  B: The historical loans may include personal data with outdated consent
  C: Past approval decisions may carry the lender's historical bias against some groups
  D: Repayment outcomes may take several years to be fully observed
answer: A
explanation:
  why_correct: Outcomes exist only for applicants past lenders accepted, so the model learns nothing about
    how declined types would have repaid. Its scores for those applicants are unsupported by data and
    may simply repeat past decisions. The gap needs assessing and treating, for example with careful outcome
    inference or limited test lending.
  why_not:
    B: Consent issues need checking, but they do not explain why the model may be unreliable for applicants
      it was never trained on.
    C: Historical bias is a real concern, but it is part of a wider problem. The model learns only from
      applicants who were approved, so it has no evidence about the types it will now score, whether biased
      or not.
    D: Outcome delay affects how recent the data is, but it is not the main gap between the training data
      and the scored population.
