subdomain: '3.6'
difficulty: easy
stem: During an incident in which a bank's AI chatbot quoted customers wrong interest rates, branch staff, the social
  media team and a product manager each told journalists something different. Which part of the incident response
  plan would MOST have prevented this?
options:
  A: A technical procedure for rolling the chatbot back quickly
  B: A record of the chatbot's known limitations and test results
  C: A severity scale for classifying AI incidents by their impact
  D: Defined roles and approval for external communications
answer: D
explanation:
  why_correct: Conflicting statements arise when nobody is designated to speak and messages are not approved. A
    plan that names who communicates externally and how statements are approved keeps messages consistent and accurate.
  why_not:
    A: Rollback limits the technical damage but does not control what people tell the media.
    B: Knowing the limitations helps with diagnosis but does not coordinate external messages.
    C: A severity scale guides escalation and response effort. It does not decide who may speak to journalists.
