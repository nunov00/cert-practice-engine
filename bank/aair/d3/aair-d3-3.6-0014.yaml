difficulty: medium
stem: During an incident in which a bank's AI chatbot quoted customers wrong interest rates, branch staff,
  the social media team and a product manager each told journalists something different. Which part of
  the incident response plan would MOST have prevented this?
options:
  A: A pre-approved holding statement for AI incidents
  B: Media training for staff in customer-facing roles
  C: A stakeholder map of who must be informed in an incident
  D: Defined roles and approval for external communications
answer: D
explanation:
  why_correct: Conflicting statements arise when nobody is designated to speak and messages are not approved.
    A plan that names who communicates externally and how statements are approved keeps messages consistent
    and accurate.
  why_not:
    A: A holding statement helps, but it does not stop branch staff or product managers from saying something
      else. Someone must be designated to speak.
    B: Media training improves how people speak, but it does not decide who should speak or approve what
      is said.
    C: A stakeholder map shows who must be told, which supports internal coordination. It does not control
      who talks to journalists.
