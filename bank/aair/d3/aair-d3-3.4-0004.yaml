id: aair-d3-3.4-0004
subdomain: '3.4'
difficulty: easy
stem: A logistics company monitors its route planning model with a key risk indicator for late deliveries caused
  by model errors. This month the indicator crossed its agreed threshold. What should the risk practitioner
  do?
options:
  A: Escalate the breach to the risk owner under the agreed procedure
  B: Raise the threshold so that it reflects the recent level of performance
  C: Note the breach and include it in the next scheduled quarterly report
  D: Instruct the data science team to retrain the model straight away
answer: A
explanation:
  why_correct: Thresholds exist to trigger action. When one is crossed, the agreed escalation path should be
    followed so the risk owner can decide on a response while the issue is still small.
  why_not:
    B: Moving the threshold to fit current results hides the problem and defeats the purpose of the indicator.
    C: Waiting for a routine report delays the response. A threshold breach should prompt timely escalation,
      not just a later mention.
    D: Retraining may be the eventual fix, but the cause is not yet known and the response is the risk owner's
      decision, not the practitioner's.
