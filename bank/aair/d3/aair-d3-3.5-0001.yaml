subdomain: '3.5'
difficulty: hard
stem: A travel company builds its customer assistant on a third-party foundation model accessed through
  an API. The provider updated the model without notice, and the assistant began giving poorer itinerary
  advice for several days before anyone noticed. Which action BEST addresses this risk going forward?
options:
  A: Agree change notice and version terms, and retest before adopting updates
  B: Monitor the assistant's answers more closely to detect quality drops
  C: Obtain the provider's independent assurance report on its controls
  D: Move to another foundation model provider with a stronger reputation
answer: A
explanation:
  why_correct: The root cause is uncontrolled change from a supplier. Contract terms for advance notice
    and the option to stay on a fixed version, combined with the company's own regression tests before
    moving to a new version, prevent silent changes from reaching customers.
  why_not:
    B: Better monitoring would shorten detection time, but it still lets the faulty change reach customers.
      It complements, rather than replaces, change control with the supplier.
    C: Assurance reports usually cover security and service controls, not how model changes affect a particular
      customer's use. They would not have prevented this issue.
    D: Any provider may change its models. Switching without changing contract terms and testing practice
      leaves the same exposure in place.
