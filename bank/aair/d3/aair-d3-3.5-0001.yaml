subdomain: '3.5'
difficulty: hard
stem: A travel company builds its customer assistant on a third-party foundation model accessed through
  an API. The provider updated the model without notice, and the assistant began giving poorer itinerary
  advice for several days before anyone noticed. Which action BEST addresses this risk going forward?
options:
  A: Contract for advance notice and version pinning, then test upgrades
  B: Add automated quality monitoring of answers, with alerts to the team
  C: Obtain the provider's assurance report and review its change controls
  D: Route traffic across two model providers so one can take over
answer: A
explanation:
  why_correct: The root cause is uncontrolled change from a supplier. Contract terms for advance notice
    and the option to stay on a fixed version, combined with the company's own regression tests before
    moving to a new version, stop silent changes from reaching customers.
  why_not:
    B: Better monitoring would shorten detection time, but the faulty change would still reach customers
      before the alert fired. It is detective, while the gap is preventive.
    C: Assurance reports usually cover the provider's own change process, not how a model update affects
      this customer's use. The company would still receive unannounced changes.
    D: A second provider helps with outages, but here the service did not fail. Someone would still need
      to notice the quality drop before switching, and the second provider can change its model too.
