stem: A bank's assessment of a new card fraud model takes the likelihood of each kind of error from validation on a
  test set that held equal numbers of fraudulent and genuine payments. In live use, about one payment in 500 is fraud.
  Which scenario's rating is MOST likely understated?
options:
  A: Genuine customers' cards blocked by false fraud alerts
  B: Fraudulent payments that the model fails to flag
  C: Fraudsters changing tactics to avoid the model's patterns
  D: Some customer groups being scored less accurately than others
answer: A
explanation:
  why_correct: The false alarm rate per genuine payment carries over, but in a balanced test set false alerts look rare
    next to true ones. Live, genuine payments outnumber fraud about 500 to 1, so the same rate yields many false alerts
    for each true one, and per payment genuine customers are blocked about twice as often as the test mix implies. The
    burden of blocked customers is understated by the test design.
  why_not:
    B: The miss rate is measured on fraudulent payments only, so the test estimates it fairly. Because fraud is far rarer
      live, the test mix if anything overstates how often missed fraud occurs per payment, which errs on the cautious
      side rather than understating it.
    C: Adaptive fraudsters are a real scenario for any fraud model and belong in the register, but nothing in the
      validation method biases that rating in a known direction. It is not the rating the evidence shows to be wrong.
    D: Uneven accuracy across groups is a real concern worth testing, but the balanced mix of fraud and genuine
      payments does not by itself understate it. The test design misleads most on how often genuine customers are
      blocked.
