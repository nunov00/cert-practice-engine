id: aair-d3-3.4-0005
subdomain: '3.4'
difficulty: medium
stem: An insurer's AI risk dashboard shows that 100% of its production models completed annual validation.
  A sample review finds that several validations were checklists completed by the model developers without
  any testing. Which change to the dashboard BEST addresses this finding?
options:
  A: Report the completion rate with a note explaining the sample findings
  B: Report the share of models with open validation findings
  C: Report validation quality, such as independence and depth of testing
  D: Report completion only for validations signed off by the risk team
answer: C
explanation:
  why_correct: The metric counts activity, not effectiveness, so it gives false comfort. Measuring whether
    validations were independent and actually tested the models makes the dashboard reflect real assurance.
  why_not:
    A: A note warns readers once, but the headline figure still overstates assurance and will do so again
      next period.
    B: Open findings only arise from validations that tested something. A checklist with no testing produces
      no findings, so this measure would look even better.
    D: Sign-off adds a review step, but a reviewer can approve a checklist too. It does not show whether
      real, independent testing took place.
