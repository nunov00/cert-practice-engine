id: aair-d3-3.6-0002
subdomain: '3.6'
difficulty: easy
stem: A parcel delivery firm relies on an AI model to plan daily driver routes. It is carrying out a business
  impact analysis for this process. What should the analysis MAINLY establish?
options:
  A: How the impact grows over time if routes cannot be planned by the model
  B: Which technical faults are most likely to cause the model to fail
  C: How accurate the model's routes are compared with manual planning
  D: Which controls are needed to stop the model from being compromised
answer: A
explanation:
  why_correct: A business impact analysis looks at what happens to the business when a process is disrupted
    and how quickly harm builds. This sets how fast the routing capability must be restored and what fallback
    is needed.
  why_not:
    B: Likely causes of failure belong to a risk assessment. A business impact analysis focuses on consequences,
      whatever the cause.
    C: Accuracy compared with manual planning is a performance question. It does not tell the firm how long
      it can cope without the model.
    D: Selecting preventive controls is part of risk treatment, not the purpose of a business impact analysis.
