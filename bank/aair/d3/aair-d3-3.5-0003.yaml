subdomain: '3.5'
difficulty: medium
stem: Data scientists at a manufacturer regularly download pre-trained models from public model repositories
  and use them in production quality inspection systems. There is no formal process for this. Which control
  BEST addresses the supply chain risk?
options:
  A: Ban the use of all externally sourced models in production systems
  B: Only allow models that have a high number of downloads and ratings
  C: Let each project lead decide which external models their team may use
  D: Check provenance, integrity and licence before models enter an approved list
answer: D
explanation:
  why_correct: Public models can contain tampered weights, unsafe code in their files or licence restrictions.
    Verifying where a model came from, that it has not been altered and that its licence permits the intended
    use, before adding it to an approved list, manages these risks while keeping the benefit.
  why_not:
    A: A blanket ban removes a valuable source of capability when the risk can be controlled. It is also likely
      to be worked around.
    B: Popularity is not assurance. Widely downloaded models can still be compromised or carry restrictive
      licences.
    C: Leaving the decision to each lead keeps the current inconsistency and gives no assurance that checks
      are done.
