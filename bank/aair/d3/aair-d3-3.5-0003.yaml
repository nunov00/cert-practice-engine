subdomain: '3.5'
difficulty: medium
stem: Data scientists at a manufacturer regularly download pre-trained models from public model repositories
  and use them in production quality inspection systems. Some of these models carry licences that restrict
  commercial use. Which control BEST addresses the supply chain risk?
options:
  A: Add model sourcing rules to the acceptable use policy and train staff
  B: Require team leads to approve each download against a checklist
  C: Record each production model and its origin in the AI inventory
  D: Set up a central intake that checks each model before approval
answer: D
explanation:
  why_correct: Public models can contain tampered weights, unsafe code or licence restrictions, and today
    each team acts alone. A central intake applies common checks for source, integrity and licence to
    every model before approval, so all these risks are managed consistently while keeping the benefit.
  why_not:
    A: Policy rules and training set expectations, but they rely on each data scientist applying them
      correctly. Nothing checks a model before it reaches production.
    B: Checklist approval adds a check, but each team lead applies it separately, with varying expertise
      in integrity and licence review, so results stay inconsistent across teams.
    C: An inventory shows which models are in use and where they came from, but it records models after
      the fact. It does not stop a tampered or restricted model from being used.
