id: aair-d3-3.3-0003
subdomain: '3.3'
difficulty: medium
stem: A building society is concerned that staff will paste customer account details into a public generative
  AI website. Which control would MOST reliably prevent this from happening?
options:
  A: An approved internal AI tool that staff can use instead
  B: Real-time alerts to security when staff visit AI websites
  C: A data loss prevention rule that blocks such data from being sent
  D: An AI use policy that staff must accept at each login
answer: C
explanation:
  why_correct: A technical preventive control that blocks the transfer stops the data leaving whether
    or not staff remember the rules. Of the options, it is the most reliable at preventing the event.
  why_not:
    A: An approved tool removes much of the reason to use public sites, but it does not stop a member
      of staff who chooses to use one anyway.
    B: Alerts are detective. They fire as or after the data leaves, so they do not prevent the disclosure.
    D: A policy is a directive control. It relies on people remembering and choosing to comply.
