id: aair-d3-3.2-0001
subdomain: '3.2'
difficulty: medium
stem: An online retailer's customer chatbot sometimes gives wrong answers about refund eligibility, and
  the residual risk is above appetite. The business owner proposes buying an insurance policy to cover
  refund disputes. What should the risk practitioner advise?
options:
  A: Accept the risk with a formal sign-off by the business owner
  B: Buy the policy to transfer the cost of refund disputes
  C: Reduce wrong answers by limiting replies to approved refund policy text
  D: Add a notice that chatbot refund answers are not binding
answer: C
explanation:
  why_correct: Insurance can transfer some financial loss, but it does not stop customers being misled,
    and it leaves the regulatory and trust impact with the retailer. Limiting replies to approved policy
    text reduces the risk itself by cutting wrong answers at the source. Insurance may later cover what
    remains.
  why_not:
    A: The residual risk is above appetite, so a business owner's sign-off is not enough. It needs treatment
      or acceptance at a higher level with a justification.
    B: Transfer only covers part of the impact. The non-financial harm stays with the retailer, so the
      risk would likely remain above appetite.
    D: A notice may limit some legal exposure, but customers are still misled, and regulators may see
      it as unfair, so the conduct risk remains.
