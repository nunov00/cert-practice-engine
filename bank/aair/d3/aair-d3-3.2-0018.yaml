subdomain: '3.2'
difficulty: easy
stem: 'A treatment plan for a fraud model''s rising miss rate names an owner, a budget and a due date. Its only action reads:
  improve monitoring. What is the plan MAINLY missing?'
options:
  A: A named second-line reviewer for the plan
  B: An estimate of the monitoring tool's cost
  C: A description of how the miss rate rose
  D: The target residual risk and how it is measured
answer: D
explanation:
  why_correct: A treatment plan must say what risk level it aims to reach and how that will be shown. Without a target and
    a measure, nobody can tell whether better monitoring has brought the risk within appetite.
  why_not:
    A: Second-line review is useful oversight, but even a reviewed plan has nothing to judge success by without a target.
    B: The plan already has a budget. A more detailed cost does not say what the action should achieve.
    C: Root cause helps choose the right action, but the plan's main gap is that no outcome is defined.
