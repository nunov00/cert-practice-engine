id: aair-d3-3.4-0035
subdomain: '3.4'
difficulty: medium
stem: A card issuer's key risk indicator for its fraud model, the false positive rate across all payments, has stayed
  well within tolerance. Complaints about wrongly blocked cards are rising, many from frequent travellers. An analysis
  finds that most wrong blocks last quarter fell on a small share of cardholders. Which indicator BEST tracks this
  risk?
options:
  A: False positive rate on payments made abroad, tracked weekly
  B: Share of customers wrongly blocked three or more times a month
  C: Complaints about blocked cards per 10,000 active customers
  D: False positive rate for each card product, tracked weekly
answer: B
explanation:
  why_correct: Wrong blocks are concentrated on a small group of cardholders, a harm that a payment-level rate averages
    away. Counting customers wrongly blocked several times a month measures that concentrated, repeated harm directly
    and can show it rising before complaints do.
  why_not:
    A: A rate for payments abroad targets travel, but it is still measured per payment, so it can stay low while
      a small group of customers is blocked again and again.
    C: Complaint rates are a useful lagging signal, but many affected customers do not complain, and complaints
      arrive after the harm.
    D: Splitting by product is a common segment view, but it is still a payment-level rate, so harm concentrated
      on a few customers would be diluted in each product's figure.
