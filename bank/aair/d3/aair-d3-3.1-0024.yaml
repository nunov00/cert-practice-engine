stem: A pharmacy's health chatbot serves customers in English, Spanish and Tagalog. All safety testing, including its
  refusal of dangerous dosing questions, was done in English. Which risk scenario is MOST important to add to the
  assessment?
options:
  A: Refusals failing on rephrased English dosing questions
  B: Dosing questions about children that the tests did not include
  C: Dangerous dosing replies to questions asked in Spanish or Tagalog
  D: Correct English answers losing accuracy once translated
answer: C
explanation:
  why_correct: Safety behaviour tested in one language often holds less well in others, and two of the chatbot's three
    languages had no safety testing at all. Dangerous dosing advice in those languages is a high-impact scenario for
    which the testing gives no evidence.
  why_not:
    A: Rephrasing attacks are a real risk, but English refusals were tested, so the evidence there is at least partial,
      unlike the untested languages.
    B: Children's dosing may be a gap, but the stem gives no sign the tests left it out, while it states plainly that two
      languages were never tested.
    D: Translation quality matters for clarity, but a less accurate translation of a correct answer is a lesser harm than
      unchecked dangerous advice.
