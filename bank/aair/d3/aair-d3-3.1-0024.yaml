stem: A pharmacy's health chatbot serves customers in English, Spanish and Tagalog. All safety testing, including its
  refusal of dangerous dosing questions, was done in English. Which risk scenario is MOST important to add to the
  assessment?
options:
  A: Unsafe dosing replies in the two languages that were not tested
  B: Translation errors that make correct English answers confusing
  C: Customers asking questions outside the chatbot's intended scope
  D: Slower replies in Spanish and Tagalog during busy periods
answer: A
explanation:
  why_correct: Safety behaviour learned and tested in one language often holds less well in others. Dangerous dosing
    advice in an untested language is the highest-impact scenario, and the testing gives no evidence about it.
  why_not:
    B: Translation quality affects clarity, which matters, but confusing wording is a lesser harm than unsafe dosing advice.
    C: Out-of-scope questions arise in every language, and nothing in the stem suggests they were missed in the English
      testing.
    D: Response time is a service issue, not a safety risk to customers.
