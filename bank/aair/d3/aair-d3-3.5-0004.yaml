subdomain: '3.5'
difficulty: medium
stem: A university uses a software-as-a-service platform to manage student support cases. The supplier has
  added an AI feature that sends case notes to a large language model run by another company. The university's
  contract with the supplier does not mention subcontractors. What should the risk practitioner recommend?
options:
  A: Require disclosure of the subcontractor and pass key obligations down to it
  B: Accept the change, since the supplier remains responsible for its own subcontractors
  C: Sign a separate contract directly with the company running the language model
  D: Ask the supplier for its latest independent security assurance report
answer: A
explanation:
  why_correct: Sensitive student data now flows to a party the university has not assessed. The supplier should
    disclose the subcontractor, and the contract should require it to impose equivalent data protection terms
    and give notice of future changes.
  why_not:
    B: The supplier may be accountable to the university, but that does not reduce the harm if the subcontractor
      misuses student data. The exposure must still be understood and controlled.
    C: The university has no direct relationship with that company, and a separate contract is rarely practical.
      The obligations should flow through the supplier.
    D: An assurance report on the supplier may not cover the subcontractor or how the AI feature handles data,
      so it would leave the main gap open.
