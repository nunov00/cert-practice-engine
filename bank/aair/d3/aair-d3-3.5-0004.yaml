id: aair-d3-3.5-0004
subdomain: '3.5'
difficulty: medium
stem: A university uses a software-as-a-service platform to manage student support cases. The supplier
  has added an AI feature that sends case notes to a large language model run by another company. Staff
  want to keep using the feature. The university's contract with the supplier does not mention subcontractors.
  What should the risk practitioner recommend?
options:
  A: Require disclosure of the subcontractor and flow-down of data terms
  B: Ask the supplier to disable the AI feature for the university's account
  C: Sign a separate data agreement directly with the model provider
  D: Obtain the supplier's latest independent security assurance report
answer: A
explanation:
  why_correct: Sensitive student data now flows to a party the university has not assessed, and the contract
    is silent. Requiring the supplier to disclose the subcontractor and impose equivalent data protection
    terms on it closes the gap while letting staff keep the feature.
  why_not:
    B: Disabling the feature removes the exposure, and would be right if the risk could not be controlled.
      But staff want the feature, and the gap can be fixed through the contract.
    C: The university has no direct relationship with that company, and a separate agreement is rarely
      practical. The obligations should flow through the supplier who holds the relationship.
    D: An assurance report on the supplier may not cover the subcontractor or how the AI feature handles
      data, so it would leave the main gap open.
