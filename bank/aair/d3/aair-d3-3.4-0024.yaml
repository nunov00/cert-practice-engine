difficulty: medium
stem: An online retailer's AI agent updates delivery addresses and order details, and there are no labelled outcomes to
  show whether each change was right. Staff can undo any change, and each undo is logged with a reason. Which key risk
  indicator gives the EARLIEST warning that the agent's error rate is rising?
options:
  A: Daily share of agent changes undone by staff, by reason
  B: Monthly accuracy from reviewers grading a sample of changes
  C: Weekly count of complaints about wrong deliveries
  D: Daily average of the agent's confidence in its changes
answer: A
explanation:
  why_correct: Each undo is a direct, logged signal that staff judged a change wrong, available the same day across all
    changes. A rising daily share, broken down by reason, warns of more errors before parcels go astray.
  why_not:
    B: Graded samples give a reliable accuracy figure, but monthly results arrive weeks after a rise begins.
    C: Complaints arrive after deliveries have gone wrong, and many affected customers never complain.
    D: A model's confidence can stay high while it is wrong, so it is a weak signal of rising errors.
