subdomain: "3.6"
difficulty: medium
stem: Six months after an incident in which a bank's chatbot gave wrong mortgage rates to thousands of customers, all
  review actions are closed. The risk register still rates that scenario's likelihood as rare, the rating set before
  launch. What should the risk practitioner do?
options:
  A: Re-rate the likelihood as likely, based on the incident alone
  B: Log the incident as a loss event and revisit the rating at the next review cycle
  C: Re-rate the scenario now, using the incident and its causes as evidence
  D: Re-rate the scenario once an indicator for wrong rates shows a trend
answer: C
explanation:
  why_correct: A scenario rated rare has just happened, which is direct evidence about its likelihood and about the
    controls the rating assumed. Re-rating it now, weighing both the incident and the fixes made since, keeps the
    register an accurate basis for the decisions that rely on it.
  why_not:
    A: The incident shows the rare rating was wrong, but rating from the incident alone ignores the causes found and the
      fixes made since, which also bear on likelihood.
    B: Logging the loss event is good practice, but deferring the rating leaves the register wrong for months after the
      evidence arrived.
    D: Waiting for an indicator trend leaves a rating the incident has already disproven in place until more errors occur.
