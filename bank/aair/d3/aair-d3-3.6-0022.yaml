stem: Six months after an incident in which a bank's chatbot gave wrong mortgage rates to thousands of customers, all
  review actions are closed. The risk register still rates that scenario's likelihood as rare, the rating set before
  launch. What should the risk practitioner do?
options:
  A: Add a key risk indicator for wrong rates and keep the rating until the annual review
  B: Log the incident as a loss event and revisit the rating at the next review cycle
  C: Re-rate the scenario now, using the incident and its causes as evidence
  D: Keep the rare rating and mark the scenario's controls as strengthened
answer: C
explanation:
  why_correct: A scenario rated rare has just happened, which is direct evidence about its likelihood and about the
    controls the rating assumed. Re-rating it now, taking account of the fixes made, keeps the register an accurate
    basis for the decisions that rely on it.
  why_not:
    A: A new indicator helps monitor the risk, but leaving a disproven rating in place until the annual review misleads
      decisions in the meantime.
    B: Logging the loss event is good practice, but deferring the rating leaves the register wrong for months after the
      evidence arrived.
    D: The fixes may justify a lower rating than the incident suggests, but that judgement needs a fresh assessment, not a
      pre-launch rating kept as it was.
