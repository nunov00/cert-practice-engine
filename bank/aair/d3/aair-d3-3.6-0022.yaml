stem: Six months after an incident in which a bank's chatbot gave wrong mortgage rates to thousands of customers, all
  review actions are closed. The risk register still rates that scenario's likelihood as rare, the rating set before
  launch. What should the risk practitioner do?
options:
  A: Re-rate the scenario using the incident and its causes as evidence
  B: Close the scenario, as the review's actions are complete
  C: Add the incident to the register as a separate new scenario
  D: Keep the rating, as one incident does not change the long-run rate
answer: A
explanation:
  why_correct: A scenario rated rare has just happened, which is direct evidence about its likelihood and about the
    controls the rating assumed. Re-rating it, taking account of the fixes made, keeps the register a true picture for
    the decisions that rely on it.
  why_not:
    B: Closing the actions fixes known causes, but the scenario can still occur, and its rating should reflect what the
      incident showed.
    C: A separate entry splits one risk in two and leaves the original rating unchallenged.
    D: The rating was a pre-launch estimate. Real experience with the system should update it, not be set aside.
