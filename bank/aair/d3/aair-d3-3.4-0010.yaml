id: aair-d3-3.4-0010
subdomain: '3.4'
difficulty: medium
stem: A housing association uses a generative AI assistant to answer tenants' questions about rent, repairs and
  tenancy rights. There are no labelled outcomes that show whether each answer was correct. Which monitoring approach
  BEST tracks the accuracy of its answers over time?
options:
  A: Track the average time the assistant takes to answer each question
  B: Have reviewers grade a regular sample of answers against policies
  C: Count how many tenants rate their conversation with a thumbs-up
  D: Rely on the accuracy level measured in testing before the launch
answer: B
explanation:
  why_correct: Where no ground truth arrives automatically, regular human grading of a sample against the authoritative
    source creates an accuracy measure that can be tracked over time. It directly measures the risk of wrong answers
    about tenants' rights and obligations.
  why_not:
    A: Response time is an operational measure. A fast answer can still be wrong, so it says nothing about accuracy.
    C: Satisfaction ratings show whether tenants liked the answer, not whether it was correct. Tenants often cannot
      judge the accuracy of advice on their rights, and a confident wrong answer may be rated highly.
    D: A pre-launch result is a fixed point in time. It cannot show changes caused by new questions, policy updates
      or model changes after launch.
