subdomain: '3.5'
difficulty: hard
stem: A regional hospital network plans to adopt a scheduling tool from a young start-up. The start-up's
  AI model will be fine-tuned on the network's own appointment data, and its funding position is uncertain.
  Which contract provision BEST protects the network?
options:
  A: Return of its data and the fine-tuned model in usable form on exit
  B: Escrow of the application source code, released on insolvency
  C: Service credits whenever the tool misses agreed service levels
  D: Quarterly financial reports from the start-up, reviewed by the network
answer: A
explanation:
  why_correct: The main supply chain risk is that the supplier fails and the network loses both the service
    and the model built from its own data. Rights to get back its data and the fine-tuned model in a usable
    form support continuity and a move to another provider.
  why_not:
    B: Escrow is a standard protection against supplier failure, but source code alone cannot restore
      the service. The fine-tuned model and the network's data are what took effort to build.
    C: Service credits compensate for poor performance while the supplier operates. They are worth nothing
      if the start-up stops trading.
    D: Financial reports may give early warning of trouble, but warning alone does not let the network
      recover its data or model if the start-up fails.
