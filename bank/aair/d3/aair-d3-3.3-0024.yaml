stem: Forty models run on one machine learning platform that provides access control, logging and deployment approval.
  Each model's annual review re-tests these platform controls from scratch, and reviews take months. The platform team
  changes its controls only through a governed release. What should the risk practitioner recommend?
options:
  A: Test platform controls in a rotating sample of model reviews
  B: Have internal audit test the platform controls every three years
  C: Re-test platform controls only in reviews of high-risk models
  D: Test platform controls once per cycle and after releases, for all reviews to use
answer: D
explanation:
  why_correct: The controls are shared by all forty models and change only through governed releases. Testing them once
    per review cycle, and again after a release, gives every model review current evidence, so reviews can focus on
    model-specific controls.
  why_not:
    A: A rotating sample cuts the repetition, but evidence then depends on which review happened to test the controls, and a
      release can change them between samples.
    B: Internal audit adds independence, but a three-year cycle leaves reviews relying on old evidence across several
      platform releases.
    C: Limiting re-testing to high-risk reviews still repeats the same tests many times, while lower-risk reviews rely on no
      evidence at all.
