stem: Forty models run on one machine learning platform that provides access control, logging and deployment approval.
  Each model's annual review re-tests these platform controls from scratch, and reviews take months. The platform team
  changes its controls only through a governed release. What should the risk practitioner recommend?
options:
  A: Keep re-testing platform controls in each model review
  B: Rely on the platform team's annual self-assessment of its controls
  C: Test platform controls once per cycle and let model reviews rely on it
  D: Rely on the cloud provider's assurance report for the platform controls
answer: C
explanation:
  why_correct: The controls are common to all forty models and change only through governed releases. Testing them
    independently once per cycle, and again after a release, gives every model review reliable evidence, so reviews can
    focus on model-specific controls.
  why_not:
    A: Testing the same shared controls forty times adds cost and delay without adding assurance.
    B: A self-assessment by the team that runs the controls is not independent evidence that they operate.
    D: The provider's report covers its own infrastructure, not how the company configured access, logging and approval on
      the platform.
