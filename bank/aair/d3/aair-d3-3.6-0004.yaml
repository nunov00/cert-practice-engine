subdomain: '3.6'
difficulty: medium
stem: During a disaster recovery test, a bank restored its credit decision application on time, but the
  AI model inside it would not run. The backups held the application and its database, but not the model
  files, feature definitions or library versions. What should the risk practitioner recommend?
options:
  A: Rebuild the model from the training pipeline during each recovery
  B: Add the model artefacts to the backups and confirm the jobs succeed
  C: Add a manual decision process to use while the model is rebuilt
  D: Add the model artefacts to recovery scope and repeat the restore test
answer: D
explanation:
  why_correct: An AI system depends on more than code and data. Bringing the versioned model, its feature
    logic and its exact libraries into recovery scope, and proving restoration by repeating the test,
    is what shows the decision service can come back as it was.
  why_not:
    A: Rebuilding takes time, may not reproduce the same model and needs its own validation, so it would
      likely miss the recovery objective.
    B: Backing up the artefacts is necessary, but a successful backup job does not prove they restore
      and run together. Without a repeated restore test, the next recovery could fail the same way.
    C: A manual fallback is a useful continuity measure, but it leaves the gap in recovery scope unfixed.
      The bank would rely on it in every future recovery.
