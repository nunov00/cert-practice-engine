id: aair-d3-3.6-0003
subdomain: '3.6'
difficulty: medium
stem: A hospital uses an AI system to prioritise urgent scans for radiologists. The continuity plan says staff
  will return to manual prioritisation if the system fails. The system has run without problems for two years,
  and many current staff have never prioritised scans manually. What should the risk practitioner recommend?
options:
  A: Contract a second AI supplier to provide a standby prioritisation system
  B: Exercise the manual procedure regularly and train staff who will use it
  C: Add more detailed written steps for manual prioritisation to the plan
  D: Negotiate a stronger availability commitment from the system's supplier
answer: B
explanation:
  why_correct: A fallback is only useful if people can carry it out under pressure. Regular exercises and training
    keep the manual procedure workable and reveal gaps before a real failure puts patients at risk.
  why_not:
    A: A standby system adds cost and complexity and may share the same failure causes. It does not fix the
      gap in staff ability to use the existing fallback.
    C: Better documentation helps, but staff who have never performed the task will still struggle without
      practice.
    D: A stronger commitment may reduce how often outages occur but cannot prevent them, and the fallback would
      still fail when needed.
