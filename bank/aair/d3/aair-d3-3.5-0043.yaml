stem: An education company's homework app for children aged 8 to 12 uses a provider's language model API and relies
  on the provider's built-in content filter. The provider tunes that filter for its customers' general-audience
  uses and adjusts it from time to time. The company's own safety standard for children is stricter. Which control
  BEST addresses this supply chain risk?
options:
  A: Screen the model's answers with the company's own filter, set to its standard
  B: Contract for advance notice of each change to the provider's filter settings
  C: Retest the provider's filter against the company's standard at each model update
  D: Set out the company's safety standard in the app's system prompt to the model
answer: A
explanation:
  why_correct: The provider sets its filter for a general audience across all its customers and changes it on its
    own schedule, so the company cannot make that filter meet its stricter standard for children. Screening answers
    with its own filter, set to that standard, puts the control the app depends on under the company's ownership,
    whatever the provider changes.
  why_not:
    B: Notice would help the company react to changes, but the provider's filter would still be set for a general
      audience, below the company's standard, before and after each change.
    C: Retesting shows the gap but does not close it, and the filter is adjusted from time to time, not only with
      model updates, so changes between updates would go untested.
    D: System prompt instructions shape the model's behaviour but do not enforce it; some requests and wordings
      override them, and they do not check what is actually returned to the child.
