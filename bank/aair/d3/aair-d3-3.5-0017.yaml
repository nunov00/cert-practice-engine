difficulty: hard
stem: Data scientists at an insurer download pre-trained model files from a public model hub. A security advisory
  warns that some model file formats can run hidden code when they are loaded. Which control BEST addresses this
  risk?
options:
  A: Download models only from publishers with many downloads and good ratings
  B: Verify each file's checksum against the hash published on the hub
  C: Accept only safe file formats, scanned in an isolated environment first
  D: Load the models only on servers with no direct internet access
answer: C
explanation:
  why_correct: The risk lies in formats that can execute code when loaded. Accepting only formats that store weights
    without executable content, and scanning files in an isolated environment before use, stops hidden code from
    running on the insurer's systems at all.
  why_not:
    A: Popularity is no guarantee of safety. Popular models are attractive targets, and accounts or files can be
      compromised.
    B: A checksum confirms the file is the one the publisher posted, not that it is safe. A malicious file matches
      its own published hash.
    D: Removing internet access limits what hidden code can send out, but the code still runs with access to internal
      data and systems.
