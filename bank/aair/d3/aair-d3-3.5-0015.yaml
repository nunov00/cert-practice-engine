id: aair-d3-3.5-0015
subdomain: '3.5'
difficulty: medium
stem: A medical imaging company sends scans with patient details to an overseas vendor to be labelled
  for model training. The vendor uses freelance annotators who work from home on their own devices. The
  company's radiologists check label quality on every batch. What is it MOST important for the risk practitioner
  to assess?
options:
  A: Whether annotators have signed confidentiality agreements
  B: How patient data is protected on annotators' own devices
  C: Whether the vendor's labelling accuracy meets the agreed standard
  D: Whether the vendor holds a recognised security certificate
answer: B
explanation:
  why_correct: Sensitive health data is leaving the company and being handled on personal devices by freelancers
    it does not employ. The main risk is a breach or unlawful access, so the practitioner should assess
    the controls over those devices and access, and whether patient details need to be sent at all.
  why_not:
    A: Confidentiality agreements set obligations but do not stop data leaking from unmanaged home devices.
    C: Label quality is already checked by the company's radiologists on every batch, so it is not the
      main gap.
    D: A certificate may cover the vendor's own offices and staff but not freelancers working on their
      own devices.
