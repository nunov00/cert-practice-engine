subdomain: '3.2'
difficulty: hard
stem: A bank's AI assistant keeps full chat transcripts, which often mention customers' health and debts, and the residual
  privacy risk is above appetite. The privacy owner proposes deleting transcripts after 30 days. The fairness team compares
  the assistant's outcomes across customer groups every six months, and some groups have only a few dozen chats a month. Which
  treatment BEST brings the privacy risk within appetite?
options:
  A: Keep transcripts for six months, encrypted, with access limited to the fairness team
  B: Delete transcripts at 30 days and run the fairness comparison each month instead
  C: Keep each chat's outcome and customer group for six months; delete transcripts at 30 days
  D: Keep transcripts for six months, pseudonymised by removing names and account numbers
answer: C
explanation:
  why_correct: The privacy risk sits in the free text, where customers describe their health and debts, while the fairness
    comparison needs only each chat's outcome and the customer's group. Keeping those few structured fields for the six-month
    cycle and deleting the transcripts at 30 days removes most of the sensitive data without losing the evidence the fairness
    team needs, so both risks are managed instead of one being traded for the other.
  why_not:
    A: Encryption and restricted access lower the chance of misuse, but six months of health and debt details are still kept
      for a test that does not need them, so the exposure stays far larger than necessary.
    B: Monthly testing would fit within the 30-day window, but with only a few dozen chats a month in some groups, the comparisons
      would be too small to show real differences, so the fairness monitoring would be weakened.
    D: Removing names and account numbers leaves the health and debt details in free text, which can often still identify
      a customer, so the transcripts remain sensitive personal data held for longer than the test needs.
