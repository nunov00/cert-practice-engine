id: aair-d3-3.1-0007
subdomain: '3.1'
difficulty: medium
stem: An online marketplace retrains its product recommendation model every night on the previous day's
  clicks and purchases, with no checks on the incoming data. Which risk scenario does this weakness MOST
  directly create?
options:
  A: Coordinated fake accounts skew the training data to promote certain products
  B: Seasonal changes in buying habits make the previous day's data less representative
  C: Feedback loops narrow recommendations toward already popular products
  D: Click logs keep customer data longer than the privacy notice allows
answer: A
explanation:
  why_correct: Training directly on unvetted user behaviour lets anyone who can generate clicks shape
    the model. Coordinated manipulation of this data can unfairly promote sellers, mislead customers and
    breach marketplace rules, and nightly retraining means it takes effect quickly. Checks on incoming
    data are the control it lacks.
  why_not:
    B: Nightly retraining actually helps the model keep up with seasonal shifts, so this is a lesser concern
      and not caused by the missing checks.
    C: Feedback loops are a real risk of training on the model's own outcomes, but they arise even with
      clean data. They are not created by the lack of input checks.
    D: Retention is a privacy compliance issue in data storage. It does not stem from the missing checks
      on training inputs.
