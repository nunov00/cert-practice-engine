subdomain: '3.4'
difficulty: hard
stem: A lender's fairness indicator compares each applicant group's monthly approval rate with the overall rate, and the risk
  committee wants any gap of five points or more to be detected. Two groups have about 40 applicants a month, and their indicator
  flips between red and green, while larger groups are steady. What should the risk practitioner recommend?
options:
  A: Flag a month red only when a significance test confirms the gap
  B: Set each group's thresholds from the confidence interval of its rate
  C: Measure each group's gap over a rolling twelve-month window
  D: Report the two small groups as one combined group each month
answer: C
explanation:
  why_correct: 'With about 40 applicants, one month''s approval rate has a margin of error of roughly fifteen points, so no
    single-month method can reliably detect a five-point gap: it either raises false alarms or misses real gaps. Pooling twelve
    months gives each group around 480 decisions, which narrows the margin to about four or five points, in line with the
    committee''s aim, while each group is still tracked on its own. The price is slower detection.'
  why_not:
    A: A significance test stops chance swings from turning red, but with 40 applicants a month it has little power. A real
      five-point gap would rarely reach significance, so the indicator would stay green when it should not.
    B: Confidence-interval thresholds are sound practice for small samples, but at 40 a month the interval spans roughly fifteen
      points either side, so a five-point gap would sit well inside it and never trigger.
    D: Combining the groups gives more data, but a gap affecting one of them can be diluted or cancelled in the combined figure,
      and the committee wants each group's gap detected.
