id: aair-d3-3.4-0007
subdomain: '3.4'
difficulty: medium
stem: An energy utility uses an AI model to flag faults on its grid. The risk team must set thresholds for
  a key risk indicator that tracks the model's missed fault rate. How should the thresholds BEST be set?
options:
  A: Use the default alert levels in the monitoring tool supplied with the model
  B: Set them at the missed fault rate the model achieved in pre-release testing
  C: Set them as low as possible so that any change at all raises an alert
  D: Agree them with the risk owner using appetite and a measured baseline
answer: D
explanation:
  why_correct: Thresholds should reflect how much risk the organisation is willing to accept and what normal
    performance looks like in production. Agreeing them with the risk owner also makes clear who must act when
    they are crossed.
  why_not:
    A: Tool defaults are generic. They do not reflect this utility's appetite or the safety impact of a missed
      fault.
    B: Test results are a useful reference, but live performance often differs, and the figure says nothing
      about what level of misses is tolerable.
    C: Overly tight thresholds produce constant alerts. Staff soon start ignoring them, which weakens monitoring.
