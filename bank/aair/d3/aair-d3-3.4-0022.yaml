id: aair-d3-3.4-0022
subdomain: '3.4'
difficulty: hard
stem: A hospital's AI tool suggests which patients are ready for discharge. Over a year, the share of suggestions that
  clinicians override fell from 30% to 6%, while readmissions among patients discharged on the tool's suggestion rose.
  What should the risk practitioner conclude?
options:
  A: The tool's suggestions have become less accurate over the year
  B: The override field is no longer being recorded reliably
  C: Clinicians are accepting suggestions they once would have challenged
  D: The patient mix has shifted toward cases the tool handles well
answer: C
explanation:
  why_correct: Only growing over-reliance explains both trends together. Clinicians accept more suggestions, so
    overrides fall, and some of the suggestions they now accept are wrong, so readmissions rise. The two indicators must
    be read together, not one at a time.
  why_not:
    A: Weaker suggestions would explain more readmissions. But vigilant clinicians would then override more often, not
      far less, so this does not fit the fall in overrides.
    B: A recording fault could make overrides appear to fall. It would not cause the rise in readmissions among patients
      discharged on the tool's suggestion.
    D: Easier cases would explain fewer overrides, but they should also bring readmissions down. A rise points the other
      way.
