id: aair-d3-3.6-0006
subdomain: '3.6'
difficulty: medium
stem: An insurer finds that its AI claims model has been wrongly rejecting a type of valid claim. The data
  science team is ready to replace the model with a corrected version today. What should the incident manager
  ensure BEFORE the replacement goes ahead?
options:
  A: The faulty model version, inputs and decision logs are preserved
  B: The corrected version has run in production for a trial period
  C: A public statement about the issue has been approved and issued
  D: The team that built the faulty model has been identified and named
answer: A
explanation:
  why_correct: Once the faulty model is overwritten, it may be impossible to work out what went wrong or which
    claims were affected. Preserving the version, inputs and logs supports root cause analysis, customer redress
    and any regulatory enquiry.
  why_not:
    B: The corrected model should be tested, but a production trial before replacement would prolong the harm.
      Evidence must be kept whatever the test approach.
    C: Communication may be needed, but it can follow later. It does not have to happen before the fix, whereas
      evidence will be lost if not kept first.
    D: Incident response looks for causes, not blame. Naming individuals does not help contain or investigate
      the issue.
