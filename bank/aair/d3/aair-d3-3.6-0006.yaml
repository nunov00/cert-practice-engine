id: aair-d3-3.6-0006
subdomain: '3.6'
difficulty: hard
stem: An insurer finds that its AI claims model has been wrongly rejecting a type of valid claim. The
  corrected version has passed validation, and the data science team is ready to replace the model today.
  What should the incident manager ensure BEFORE the replacement goes ahead?
options:
  A: The faulty model version, inputs and decision logs are preserved
  B: The affected claimants have been identified from the decision logs
  C: The regulator has been notified of the wrongly rejected claims
  D: Claims handlers are reviewing rejections manually until go-live
answer: A
explanation:
  why_correct: Once the faulty model is overwritten, it may be impossible to work out what went wrong
    or which claims were affected. Preserving the version, inputs and logs supports root cause analysis,
    customer redress and any regulatory enquiry, and only this step must happen before the change.
  why_not:
    B: Claimants must be identified, but that can be done after go-live as long as the logs are kept.
      Waiting for it would delay the fix.
    C: Notification may be required, but its timing follows legal deadlines, not the deployment. It does
      not have to happen before the fix.
    D: Manual review is a reasonable interim measure, but the fix goes live today. It does not protect
      the evidence that the replacement would destroy.
