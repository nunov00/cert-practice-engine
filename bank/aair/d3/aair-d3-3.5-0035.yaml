id: aair-d3-3.5-0035
subdomain: '3.5'
difficulty: medium
stem: 'A bank pays a vendor to improve its customer assistant with human preference ratings: the vendor''s raters
  compare pairs of answers, and the model is tuned toward the preferred ones. The raters follow the vendor''s general
  guidelines, which favour direct, confident answers. The assistant may explain the bank''s products but may not
  tell a customer which one suits them. What should the risk practitioner MOST require?'
options:
  A: Raters judge answers against criteria the bank sets, including its advice rules
  B: Add a vendor guideline telling raters to mark down answers that name products
  C: Test the tuned model for personal recommendations before each release
  D: Bank experts re-rate a sample of each batch and compare it with the vendor's raters
answer: A
explanation:
  why_correct: 'The raters'' preferences become what the model learns. The line the bank must hold is subtle: describing
    products is allowed, saying which one suits the customer is not. Criteria the bank sets can draw that line,
    so the training signal itself rewards the behaviour the bank needs.'
  why_not:
    B: A rule against naming products patches the guidelines bluntly. It would mark down allowed product explanations
      and miss recommendations that steer a customer without naming a product.
    C: Release testing is a useful backstop, but it catches the problem after the model has been tuned toward it,
      and each failed release means repeating the work.
    D: Re-rating would show that the bank's experts and the vendor's raters disagree, but the batches would still
      be rated, and the model tuned, on the vendor's criteria.
