id: aair-d3-3.1-0014
subdomain: '3.1'
difficulty: hard
stem: A genetic testing company plans to give researchers public API access to a model trained on its
  customers' genetic and health records. The API will return a detailed confidence score with each prediction.
  Which risk scenario should the practitioner MOST ensure is assessed?
options:
  A: Researchers find the predictions less accurate for their own populations
  B: Attackers use the API to infer whether a person was in the training data
  C: Researchers use the predictions for clinical decisions they were not validated for
  D: Attackers send many queries to reconstruct a working copy of the model
answer: B
explanation:
  why_correct: Detailed confidence scores can let an attacker test whether a specific person's record
    was used in training. That would reveal that the person is a customer and may expose genetic and health
    information, which is highly sensitive. This scenario arises directly from the planned design and
    has the most severe impact on individuals.
  why_not:
    A: Poor accuracy for some populations matters to researchers, but it is a quality issue with far less
      impact than exposing customers' genetic data.
    C: Misuse of outputs is a real scenario, but it mainly harms third parties and can be limited through
      terms and guidance. It does not expose the customers whose data trained the model.
    D: Confidence scores do make model extraction easier, but the main harm is loss of intellectual property.
      Exposing customers' genetic data is more severe.
