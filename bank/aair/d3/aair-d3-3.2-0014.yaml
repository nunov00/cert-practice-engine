stem: A law firm's AI research assistant sometimes cites court decisions that do not exist. The vendor
  says this rate can be lowered but not removed, and a fake citation in a court filing could lead to sanctions.
  The firm still wants the tool for research. Which treatment approach is BEST?
options:
  A: Move to the vendor's newest model, which has a lower error rate
  B: Train lawyers to spot the signs of a fabricated citation
  C: Require each citation to be checked at source before filing
  D: Limit the tool to early research rather than drafting filings
answer: C
explanation:
  why_correct: Because the likelihood of fake citations cannot be brought to zero, the treatment should
    limit their impact. Checking every citation against the source before filing stops a fabricated case
    reaching a court, which is where the serious harm occurs.
  why_not:
    A: A newer model lowers the likelihood but does not remove it, so the impact of an unchecked fake
      citation remains.
    B: Training helps, but fabricated citations often look plausible, and spotting them by sight does
      not ensure that each one is checked.
    D: Citations found in early research still flow into filings, so the impact remains unless they are
      checked.
