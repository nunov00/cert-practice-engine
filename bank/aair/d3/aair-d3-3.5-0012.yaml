id: aair-d3-3.5-0012
subdomain: '3.5'
difficulty: medium
stem: A retailer trains and hosts its models on a cloud provider's machine learning platform. A review
  finds that a storage area holding training data was left open to the internet, because the team assumed
  the provider managed such settings. What should the risk practitioner recommend to prevent similar gaps?
options:
  A: Apply automated policy checks that block public storage settings
  B: Train the team on the platform's storage security settings
  C: Agree and record which security duties sit with each party
  D: Review the provider's independent assurance report each year
answer: C
explanation:
  why_correct: The exposure happened because the team misunderstood the split of responsibilities. Agreeing
    and documenting which controls the provider runs and which the retailer must run closes that gap for
    every setting, not only storage access.
  why_not:
    A: An automated guardrail is a strong fix for this specific setting. But the cause was a misunderstanding
      of duties, so other settings the team assumes the provider manages would remain exposed.
    B: Training on storage settings fixes this one area, but the team could hold the same wrong assumption
      about other controls, such as identity or logging.
    D: The provider's report covers the provider's own controls. The failure was in a setting the retailer
      was responsible for.
