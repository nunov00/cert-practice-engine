subdomain: '3.1'
difficulty: hard
stem: A clinic will use an AI tool that turns recorded consultations into draft notes, which doctors check from memory
  before signing. Testing on clear recordings found a low word error rate. In many consultations the doctor examines the
  patient for several minutes without speaking. Which risk scenario should the assessment MOST include?
options:
  A: Drug names misheard by the tool and missed by the doctor at signing
  B: Strongly accented speech transcribed less accurately than in testing
  C: Background noise in busy rooms raising the tool's word error rate
  D: Fluent statements in the note that no one in the room made
answer: D
explanation:
  why_correct: Speech-to-text tools built on generative models are known to produce fluent text during long stretches with no
    speech, and the stem says many consultations contain several silent minutes. That condition was not part of testing, and
    a word error rate measured on clear recordings says nothing about it. A fabricated symptom or history item in a signed
    note can drive later clinical decisions.
  why_not:
    A: 'Misheard drug names are a serious risk worth testing, since an overall word error rate does not show accuracy on drug
      names. But the stem points to a condition testing did not cover at all: long silent stretches, which generative tools
      are known to fill with invented text.'
    B: Accuracy across accents is worth testing, but nothing in the stem points to accent as this clinic's gap. The untested
      condition here is the long periods with no speech at all.
    C: Noise raises error rates and is worth checking, but it degrades speech that was actually spoken. The silent stretches
      described are a separate untested condition in which the tool can produce content nobody said.
