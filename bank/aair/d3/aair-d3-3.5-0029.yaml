id: aair-d3-3.5-0029
subdomain: '3.5'
difficulty: hard
stem: A hospital plans to send patient notes to a cloud provider's language model to draft discharge letters. The contract
  bars the provider from training models on the hospital's data or passing it to other parties. During due diligence, what
  should the risk practitioner MOST confirm?
options:
  A: Whether the model was evaluated on clinical text like the hospital's
  B: Whether the provider holds a recognised security certification
  C: Whether the hospital can have its stored data deleted on exit
  D: Whether the provider keeps prompts for misuse checks staff can read
answer: D
explanation:
  why_correct: Many hosted model services keep prompts and replies for a period to detect misuse, and allow their staff to
    review flagged content, even when they promise not to train on customer data. For patient notes that is a direct exposure
    the contract's training and sharing terms do not cover. The practitioner should confirm whether this applies and whether
    the hospital can opt out.
  why_not:
    A: Clinical accuracy matters, but the hospital can and should test the drafts itself on its own notes. It is not the main
      open question about the provider's handling of patient data.
    B: A certification shows the provider runs a security programme, but it does not say whether prompts are kept or who may
      read them. It does not reach the gap the contract leaves.
    C: Deletion on exit is a sound term, but it matters only once the practitioner knows what the provider stores. Whether
      prompts are kept and read during the contract is the earlier and larger question.
