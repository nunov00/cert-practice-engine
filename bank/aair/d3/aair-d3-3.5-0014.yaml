subdomain: '3.5'
difficulty: hard
stem: To avoid depending on one supplier, an airline contracted two different vendors for its AI customer chat service,
  keeping the second as a backup. During an outage, both vendors' services failed within the same hour, while the
  airline's own systems were unaffected. What should the risk practitioner MOST suspect?
options:
  A: Both vendors may rely on the same underlying model provider
  B: The backup vendor's contract may lack a service level agreement
  C: The switch-over from the first vendor to the second was untested
  D: Two vendors are too few, and a third should have been contracted
answer: A
explanation:
  why_correct: Two vendors failing at the same time while the airline's systems worked points to a shared dependency
    further down the supply chain, such as the same foundation model or hosting provider. Dual sourcing gives resilience
    only if the suppliers' own dependencies are independent, so the airline needs to map them.
  why_not:
    B: A missing service level affects compensation and expectations, not whether the backup fails at the same moment
      as the primary.
    C: An untested switch-over could cause problems, but here the backup service itself was down. The switch-over
      was not the point of failure.
    D: Adding a third vendor that uses the same upstream provider would fail in the same way. The issue is a shared
      dependency, not the number of vendors.
