id: aair-d3-3.5-0014
subdomain: '3.5'
difficulty: medium
stem: To avoid depending on one supplier, an airline contracted two different vendors for its AI customer
  chat service, keeping the second as a backup. During an outage, both vendors' services failed at the
  same moment, before any traffic was switched. The airline's own systems and network were unaffected.
  What should the risk practitioner MOST suspect?
options:
  A: Both vendors may rely on the same underlying model provider
  B: The backup vendor may have been overloaded by switched traffic
  C: The switch-over from the first vendor to the second was untested
  D: The airline's single integration gateway to both vendors failed
answer: A
explanation:
  why_correct: Two vendors failing at the same moment, with no traffic switched and the airline's side
    working, points to a shared dependency further down the supply chain, such as the same foundation
    model or hosting provider. Dual sourcing gives resilience only if the suppliers' own dependencies
    are independent.
  why_not:
    B: Overload is a common cause of backup failure, but no traffic had been switched when the backup
      failed.
    C: An untested switch-over is a real weakness, but the backup was already down before any switch-over
      was tried.
    D: A shared gateway is a common single point of failure, but the airline's own systems and network
      were unaffected.
