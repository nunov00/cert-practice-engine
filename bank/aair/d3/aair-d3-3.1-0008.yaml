subdomain: '3.1'
difficulty: hard
stem: A pharmacy chain's chatbot answers about 400,000 customer questions about medicines each month.
  In pre-launch testing, 0.05% of its answers contained unsafe dosage advice. The product owner rates
  the likelihood of unsafe advice as rare. What should the risk practitioner conclude?
options:
  A: The rating is reasonable, as the rate is under one in a thousand
  B: The rating should stand until live data confirms the test rate
  C: The rating is too low, given the monthly volume of answers
  D: The rating is too low, given the severity of unsafe dosage advice
answer: C
explanation:
  why_correct: Likelihood must reflect how often the event will occur at the real volume of use. 0.05%
    of 400,000 answers is about 200 unsafe answers a month, which is almost certain rather than rare.
    With potential harm to health, this changes the risk level sharply.
  why_not:
    A: The percentage looks small, but applied to the volume of use it means hundreds of unsafe answers
      a month.
    B: Waiting would expose customers to a known hazard. The test data is already enough to show that
      the rating is wrong.
    D: This reaches the right conclusion for the wrong reason. It lets the severity of the harm drive
      the likelihood rating, which mixes impact into likelihood. The evidence for a higher likelihood
      is the volume.
