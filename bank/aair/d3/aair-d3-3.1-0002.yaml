id: aair-d3-3.1-0002
subdomain: '3.1'
difficulty: hard
stem: A professional services firm deploys an internal AI assistant that answers staff questions by searching
  the firm's document repositories. The initial assessment rated the risk low because only employees can
  use it. Which concern should MOST lead the practitioner to challenge that rating?
options:
  A: It may sometimes give staff inaccurate or incomplete answers
  B: Staff may use its answers to draft client advice without a second review
  C: Its answers may cite superseded versions of the firm's internal procedures
  D: It may return content from files the asking employee is not allowed to open
answer: D
explanation:
  why_correct: If the assistant retrieves documents with its own broad access rather than the user's permissions,
    it can expose confidential client or HR material to any employee. "Internal only" does not mean every
    employee may see everything, so the rating misses a significant confidentiality scenario.
  why_not:
    A: Inaccuracy is a real risk, but staff are expected to check answers and the effect is usually limited.
      It is less severe than systemic exposure of restricted information.
    B: Unreviewed use of answers is a real quality risk, but the rating's logic was about who can use
      the tool. This concern does not show that the "employees only" premise is wrong.
    C: Outdated sources can mislead staff, but this is an accuracy issue that version control of the repositories
      can handle. It does not undermine the low rating the way exposure of restricted files does.
