subdomain: '3.1'
difficulty: hard
stem: A hospital uses AI to transcribe doctors' dictated notes into patient records. Testing showed similar accuracy across
  accents. Doctors sign the notes without replaying the audio. Which risk scenario is MOST important to assess?
options:
  A: Lower accuracy for doctors with strong regional accents
  B: A plausible wrong drug or dose is written into a record
  C: An outage delays notes reaching the records for hours
  D: The vendor keeps the audio for longer than agreed
answer: B
explanation:
  why_correct: Speech models can produce fluent but wrong words, and drug names and doses are where a small error causes serious
    harm. Doctors sign without replaying the audio, so such errors pass into records that other clinicians act on.
  why_not:
    A: Accent bias is a common concern for speech tools, but testing found similar accuracy, so it is not the priority here.
    C: Delays are disruptive, but staff can see that a note is missing. A wrong dose looks correct and is acted on.
    D: Excess retention is a privacy and contract risk worth tracking, but it carries less harm than wrong clinical information.
