stem: 'Two analysts at a retail bank separately assessed the same AI scenario: an investment chatbot giving
  customers unsuitable advice. One rated the impact as minor and the other as severe. Both used the bank''s
  five-level impact scale, which gives only a one-word label for each level. What should the risk practitioner
  recommend?'
options:
  A: Define each impact level with criteria and examples of AI harms
  B: Hold a calibration session where the analysts agree one rating
  C: Have a second reviewer moderate every AI impact rating
  D: Rate impact as an estimated financial loss for each scenario
answer: A
explanation:
  why_correct: The two ratings differ because the scale is vague. Defining each level with measurable
    criteria, such as customers affected, financial loss and regulatory consequences, with examples of
    AI harms, makes ratings repeatable and comparable whoever does the assessment.
  why_not:
    B: Calibration settles this one scenario, but the scale stays vague, so the next pair of analysts
      will disagree again.
    C: Moderation catches some outliers, but the moderator has the same vague scale to work from, so consistency
      still depends on one person's view.
    D: Money alone misses non-financial harms such as unsuitable advice to vulnerable customers and regulatory
      consequences, which matter most in this scenario.
