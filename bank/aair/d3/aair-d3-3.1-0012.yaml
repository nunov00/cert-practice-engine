difficulty: medium
stem: 'Two analysts at a retail bank separately assessed the same AI scenario: an investment chatbot giving
  customers unsuitable advice. One rated the impact as minor and the other as severe. Both used the bank''s
  five-level impact scale, which gives only a one-word label for each level. What should the risk practitioner
  recommend?'
options:
  A: Define each impact level with criteria and examples for AI harms
  B: Average the two ratings and record that result in the register
  C: Use the higher of the two ratings for all AI scenarios from now on
  D: Have one analyst carry out all of the bank's AI risk assessments
answer: A
explanation:
  why_correct: The two ratings differ because the scale is vague. Defining each level with measurable
    criteria, such as customers affected, financial loss and regulatory consequences, with examples of
    AI harms, makes ratings repeatable and comparable whoever does the assessment.
  why_not:
    B: Averaging hides the disagreement and produces a rating that neither analyst supports. The scale
      stays as vague as before.
    C: Always taking the higher rating inflates results and distorts priorities. It treats the symptom,
      not the unclear scale that causes it.
    D: One person may be consistent but not necessarily right. It also creates a key-person dependency
      and leaves the scale undefined for everyone else.
