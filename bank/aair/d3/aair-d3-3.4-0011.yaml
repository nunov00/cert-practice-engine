subdomain: '3.4'
difficulty: medium
stem: An asset manager's AI risk dashboard takes model performance figures from spreadsheets that each
  model team fills in by hand every month. Every model already logs its performance to a central monitoring
  platform. One team was recently found to have resubmitted the previous quarter's numbers. What should
  the risk practitioner recommend?
options:
  A: Require each team lead to sign off its figures before submission
  B: Have internal audit test a sample of the spreadsheets each year
  C: Feed the dashboard directly from the central monitoring platform
  D: Have the risk team review the spreadsheets for anomalies monthly
answer: C
explanation:
  why_correct: A report is only as reliable as the data behind it. Because the figures already exist on
    the monitoring platform, taking them directly from it removes manual copying and selective reporting
    at the source.
  why_not:
    A: Sign-off adds accountability but verifies nothing. The same stale figures could be submitted with
      a signature.
    B: An annual audit sample is independent, but it is detective and infrequent. Wrong figures could
      drive decisions for most of a year before being found.
    D: A monthly review may catch obvious anomalies, but it keeps the manual process and can miss plausible
      wrong figures. The data can be taken from the platform instead.
