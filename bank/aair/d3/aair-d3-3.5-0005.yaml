id: aair-d3-3.5-0005
subdomain: '3.5'
difficulty: medium
stem: A hospital is about to deploy an AI tool from a supplier that drafts clinical notes from recorded
  consultations. The standard terms allow the supplier to use customer data to improve its models. What
  should the risk practitioner do BEFORE deployment?
options:
  A: Configure the tool to strip patient identifiers before upload
  B: Add the supplier's reuse of data to the patient privacy notice
  C: Negotiate terms that limit data use, with deletion and audit rights
  D: Limit the tool to patients who agree to have consultations recorded
answer: C
explanation:
  why_correct: Recorded consultations contain highly sensitive health data. Contract terms that prohibit
    or tightly limit reuse for model training, and give the hospital rights to require deletion and to
    verify compliance, control the risk at its source before any data is shared.
  why_not:
    A: Removing identifiers helps, but recorded consultations contain names, conditions and details in
      free speech that are hard to strip reliably. The contract would still allow reuse of what remains.
    B: Telling patients about the reuse is transparency, not control. It does not make the reuse appropriate
      or limit what the supplier does with the data.
    D: Consent to recording is needed, but patients agreeing to be recorded have not agreed to the supplier
      training its models on their data. The contract problem remains.
