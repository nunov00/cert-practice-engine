subdomain: '3.5'
difficulty: hard
stem: A software firm embeds an open-weight model in a document tool it sells to other businesses. The model's licence allows
  commercial use but bars some uses, such as deciding eligibility for credit, and requires distributors to bind their customers
  to the same limits. Several prospective customers are lenders. What should the risk practitioner recommend?
options:
  A: Replace the model with one whose licence sets no limits on its use
  B: Set out the licence's use limits in the product documentation for customers
  C: Have each customer warrant that it complies with the law where it operates
  D: Bind customers to the licence's use limits by contract and check deals against them
answer: D
explanation:
  why_correct: The licence makes the firm responsible for passing its limits down to customers, and lenders are the customers
    most likely to use the tool in a barred way. Binding customers to the limits in contract meets the licence condition,
    and checking deals against them catches uses such as credit decisions before the firm is in breach.
  why_not:
    A: A more permissive model would remove the obligation, but it means re-selecting and revalidating the product's core
      component, when the licence can be met and lenders can still use the tool for permitted work.
    B: Documentation tells customers about the limits but does not bind them to them, which is what the licence requires of
      distributors.
    C: A warranty of legal compliance does not cover the licence's own use limits, which go beyond what the law forbids, so
      a lender could use the tool for credit decisions without breaching it.
