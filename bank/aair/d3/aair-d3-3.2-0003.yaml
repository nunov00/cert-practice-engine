id: aair-d3-3.2-0003
subdomain: '3.2'
difficulty: hard
stem: A city council is considering live facial recognition to confirm the identity of people entering
  its benefit offices. Its privacy and discrimination risks are far above appetite. The only controls
  that bring them within appetite amount to the staff ID checks already done at each desk. Which risk
  treatment is MOST appropriate?
options:
  A: Transfer the risk by contracting the system out to a specialist provider
  B: Avoid the risk by deciding not to go ahead with the system
  C: Accept the risk with explicit approval from the council's leadership
  D: Reduce the risk by having staff confirm every match at the desk
answer: B
explanation:
  why_correct: Controls that bring the risk within appetite would simply repeat the existing ID checks,
    so the system would add risk without adding benefit. When reduction removes the reason for the activity,
    not undertaking it is the sensible treatment, and it removes the exposure entirely.
  why_not:
    A: Outsourcing does not remove the council's accountability for privacy and discrimination harms to
      the public.
    C: Senior approval can make some above-appetite acceptances valid, but a risk far above appetite with
      no added benefit gives leadership no sound basis to accept it.
    D: Staff confirmation would bring the risk within appetite, but it repeats the checks already done,
      so the council keeps the privacy exposure of live capture while gaining nothing.
