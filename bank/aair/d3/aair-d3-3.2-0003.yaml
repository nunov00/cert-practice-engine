id: aair-d3-3.2-0003
subdomain: '3.2'
difficulty: easy
stem: A city council is considering live facial recognition to identify people entering its benefit offices. The
  assessment finds that the privacy and discrimination risks are far above appetite, no practical controls would
  bring them within it, and the expected benefit is small. Which risk treatment is MOST appropriate?
options:
  A: Transfer the risk by contracting the system out to a specialist provider
  B: Avoid the risk by deciding not to go ahead with the system
  C: Accept the risk and monitor complaints from the public closely
  D: Reduce the risk by adding signs that tell visitors about the cameras
answer: B
explanation:
  why_correct: When a risk is far above appetite, controls cannot bring it within appetite and the benefit is small,
    the sensible choice is not to undertake the activity. Avoidance removes the exposure entirely.
  why_not:
    A: Outsourcing does not remove the council's accountability for privacy and discrimination harms to the public.
    C: Accepting a risk far above appetite is not justified, especially when the benefit is small.
    D: Signs improve transparency but do little to reduce the underlying privacy and discrimination risks.
