subdomain: "3.2"
difficulty: medium
stem: An airline's AI agent will rebook passengers during disruptions without staff review. Testing went well, but the
  residual risk of costly wrong rebookings cannot be estimated reliably until the agent handles real disruptions, and
  appetite for such errors is low. Which treatment is MOST appropriate?
options:
  A: Delay launch for six more months of simulated disruption testing
  B: Launch fully, with alerts when daily rebooking costs pass a set level
  C: Launch to a small share of passengers with caps and stop criteria
  D: Launch fully, with staff approving any rebooking above a set cost
answer: C
explanation:
  why_correct: The missing evidence can only come from real disruptions, and appetite is low. A limited launch with caps
    on what the agent can do and agreed criteria for stopping gathers that evidence while keeping losses small, and the
    rollout grows only as results support it.
  why_not:
    A: More simulation cannot reproduce real disruptions, which is the evidence the stem says is missing, so the uncertainty
      would remain.
    B: Cost alerts detect a problem after many passengers have been rebooked wrongly, which a low appetite does not allow on
      a full launch.
    D: Approval above a cost limit catches the most expensive errors, but the many cheaper wrong rebookings across all
      passengers still go through unchecked.
