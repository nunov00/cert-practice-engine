id: aair-d3-3.1-0003
subdomain: '3.1'
difficulty: medium
stem: A cross-functional workshop has drafted risk scenarios for a hospital's sepsis alert tool before
  go-live. Which step would BEST check the list for gaps?
options:
  A: Walk the list through each lifecycle stage and each affected group
  B: Compare the list with incident reports from hospitals using similar tools
  C: Run a failure mode analysis of the model with the data science team
  D: Survey ward nurses on how they would respond to the alerts
answer: A
explanation:
  why_correct: A gap check needs a structured frame that covers the whole scope. Walking the list through
    each stage, from data and build to use, change and retirement, and through each affected group, such
    as patients, nurses, doctors and IT, shows where no scenario exists yet.
  why_not:
    B: Other hospitals' incidents are a useful input, but they only show scenarios that have already happened
      elsewhere, so new and local gaps stay hidden.
    C: Failure mode analysis is good at technical failures, but done by one team it misses workflow, clinical
      and compliance gaps.
    D: Nurses give valuable workflow insight, but a survey of one group checks only their part of the
      scope.
