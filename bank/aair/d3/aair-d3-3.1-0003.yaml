id: aair-d3-3.1-0003
subdomain: '3.1'
difficulty: easy
stem: A hospital is preparing to deploy an AI tool that alerts nurses to early signs of sepsis. The risk practitioner
  must identify risk scenarios for the tool before go-live. Which approach will BEST produce a complete set of scenarios?
options:
  A: Run a workshop with clinicians, data scientists, IT and compliance staff
  B: Adopt the list of risks given in the developer's product documentation
  C: Ask the data science team to list the ways the model could fail technically
  D: Wait for the pilot period and record the issues that nurses report
answer: A
explanation:
  why_correct: Scenarios for a clinical AI tool span clinical workflow, data, technology, privacy and compliance.
    Bringing these perspectives together surfaces scenarios that any one group would miss, such as alert fatigue
    on busy wards or missed alerts where local data differs from the training data.
  why_not:
    B: A developer's list is a useful input, but it reflects the developer's view and not how this hospital will
      use the tool.
    C: Technical failures are only part of the picture. This misses workflow, clinical and compliance scenarios,
      such as nurses ignoring frequent alerts.
    D: Waiting for issues is reactive. Scenarios should be identified before patients are exposed to the tool.
