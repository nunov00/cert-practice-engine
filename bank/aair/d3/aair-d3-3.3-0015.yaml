id: aair-d3-3.3-0015
subdomain: '3.3'
difficulty: hard
stem: A bank uses a large language model to draft replies to customer complaints. To catch inaccurate
  statements, a second instance of the same model reviews each draft before it is sent. Testing shows
  the checker flags very few problems. What should the risk practitioner be MOST concerned about?
options:
  A: The checker may share the drafting model's blind spots and miss its errors
  B: The checker's prompt may not define clearly what counts as inaccurate
  C: The checker's results may not be logged for later quality review
  D: The checker may flag accurate drafts and slow down the replies
answer: A
explanation:
  why_correct: A check that uses the same model as the process it reviews is not independent. Errors that
    come from the model's own gaps are likely to be repeated, so a low flag rate gives false comfort.
    The control should be tested with drafts containing known errors, or use a different method.
  why_not:
    B: A vague prompt can cause missed errors, but it can be fixed and tested. Even with a clear prompt,
      a checker that shares the drafter's gaps would still miss the same errors.
    C: Logging supports oversight, but it does not tell whether the check can detect errors in the first
      place.
    D: Few problems are being flagged, so false positives and delay are not the concern the evidence points
      to.
