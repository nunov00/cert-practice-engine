id: aair-d3-3.3-0015
subdomain: '3.3'
difficulty: hard
stem: A bank uses a large language model to draft replies to customer complaints. To catch inaccurate
  statements, a second instance of the same model reviews each draft before it is sent. Testing shows
  the checker flags very few problems. What should the risk practitioner be MOST concerned about?
options:
  A: The checker may share the drafting model's blind spots and miss its errors
  B: The checker may slow replies enough to breach complaint handling deadlines
  C: The checker's instructions may need updating when complaint policies change
  D: The checker doubles the cost of model usage for every complaint handled
answer: A
explanation:
  why_correct: A check that uses the same model as the process it reviews is not independent. Errors that
    come from the model's own gaps are likely to be repeated, so a low flag rate gives false comfort.
    The control should be tested with drafts containing known errors, or use a different method.
  why_not:
    B: Delay is a manageable operational issue and is not what makes the control unreliable.
    C: Keeping instructions current is ordinary maintenance; it does not address whether the check can
      detect errors at all.
    D: Cost is a business consideration and says nothing about whether the control works.
