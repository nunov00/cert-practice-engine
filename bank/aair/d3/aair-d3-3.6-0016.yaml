subdomain: '3.6'
difficulty: medium
stem: A bank's AI assistant answers from a vector index of product documents. In a disaster recovery test, the assistant
  came up on time at the recovery site but answered from an index rebuilt weeks earlier, quoting outdated rates.
  What should the risk practitioner recommend?
options:
  A: Rebuild the index at the recovery site after each failover
  B: Set a recovery point objective for the index
  C: Keep the assistant switched off during any failover
  D: Add the index to the scope of the annual recovery test
answer: B
explanation:
  why_correct: The recovery time was met, but the data was too old. Setting a recovery point objective for the index,
    and replicating it often enough to meet it, ensures the recovered assistant answers from current documents.
  why_not:
    A: A rebuild after failover takes time, which can break the recovery time objective, and leaves the assistant
      stale until it finishes.
    C: Switching it off avoids wrong answers but gives up availability the business expects.
    D: The index was already tested, which is how the problem was found; testing again does not fix it.
