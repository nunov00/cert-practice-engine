subdomain: '3.6'
difficulty: medium
stem: A logistics firm's demand forecasting model retrains every night. The team discovers that a faulty
  data feed has been adding corrupted records to the training data, and forecasts are now unreliable.
  It is still tracing when the fault began. Which model version should it plan to restore?
options:
  A: The version saved from last night's retraining run
  B: The version from one week ago, as an interim step
  C: The last version trained before the faulty feed began
  D: The version that last passed full validation
answer: C
explanation:
  why_correct: Restoring the last version trained before the faulty feed began removes the fault while
    keeping as much valid learning as possible. That is why the team must establish when the fault started
    before choosing the restore point.
  why_not:
    A: Last night's version was trained on data that probably already includes corrupted records, so restoring
      it would keep the problem.
    B: An interim restore sounds cautious, but a week is a guess. The fault may have started earlier,
      so this version could still contain the corruption.
    D: A validated version feels safe, but its validation date has no link to when the fault began. It
      may postdate the corruption or discard much valid learning.
