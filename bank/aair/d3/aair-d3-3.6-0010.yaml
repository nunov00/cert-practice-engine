subdomain: '3.6'
difficulty: hard
stem: A post-incident review at an insurer traces a pricing model's errors to a mislabelled field in a
  shared customer dataset. The pricing model has been corrected and redeployed. Three other models, owned
  by different teams, were trained on the same dataset. What should the review recommend as the priority?
options:
  A: Correct the field and add a quality check to the dataset pipeline
  B: Ask the other owners to review their models at the next validation
  C: Notify the dataset owner and close the pricing model incident
  D: Check the three other models for the same fault now
answer: D
explanation:
  why_correct: The root cause is in shared data, so the fault may already be live in three other models.
    Checking them now finds any ongoing harm before it grows. Correcting the dataset and adding pipeline
    checks follow, so the incident is closed at its cause rather than at its first symptom.
  why_not:
    A: Fixing the source and adding a check prevents future errors, but the three models may be making
      wrong live decisions now. Checking them comes first.
    B: Waiting for the next scheduled validation could leave a known fault in live models for months.
      The risk is known now and should be checked now.
    C: Informing the dataset owner is useful, but closing the incident leaves the possible fault in three
      other models unexamined.
