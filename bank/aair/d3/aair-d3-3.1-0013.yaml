id: aair-d3-3.1-0013
subdomain: '3.1'
difficulty: hard
stem: A hospital pharmacy uses an AI tool to suggest chemotherapy doses, which pharmacists then verify.
  The risk register multiplies likelihood by impact. The scenario of a fatal overdose getting through
  scores 5 out of 25 (rare times catastrophic), falls in the low band, and so has no further action planned.
  What should the risk practitioner recommend?
options:
  A: Keep the low band and monitor the pharmacist override rate
  B: Raise the likelihood rating to reflect the severity of the harm
  C: Add a rule that catastrophic impacts need review whatever the score
  D: Escalate this scenario to the risk committee for a decision
answer: C
explanation:
  why_correct: Multiplying likelihood by impact understates rare but catastrophic scenarios, which can
    then drop out of attention. A severity rule makes sure severe, irreversible harms always get an explicit
    treatment decision, and it fixes the method for every such scenario rather than this one only.
  why_not:
    A: Monitoring overrides is a useful detective step, but it leaves a scenario that could kill a patient
      with no treatment decision, and the method flaw stays.
    B: Changing the likelihood to reflect severity mixes impact into likelihood, misrepresents the evidence
      and fixes only this case.
    D: Escalation gets this scenario a decision, but other catastrophic scenarios will keep falling into
      the low band because the method itself is unchanged.
