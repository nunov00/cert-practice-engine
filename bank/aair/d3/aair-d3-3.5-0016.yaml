id: aair-d3-3.5-0016
subdomain: '3.5'
difficulty: medium
stem: A lender uses a vendor's credit scoring model. The vendor reports accuracy each quarter, measured across its
  whole client base. The lender's applicants are younger and more often self-employed than that base. What should
  the risk practitioner recommend?
options:
  A: Ask the vendor to report monthly instead of quarterly
  B: Commission an independent audit of the vendor's model
  C: Add accuracy service levels to the vendor contract
  D: Compare the model's results with the lender's outcomes
answer: D
explanation:
  why_correct: Pooled accuracy may hide poor performance on the lender's different applicants. Monitoring results
    against the lender's own repayment outcomes shows how the model performs where the lender uses it.
  why_not:
    A: More frequent reports still measure the pooled base, not the lender's applicants.
    B: An audit can check the model's build, but it is a point-in-time review and may still use data unlike the
      lender's.
    C: Service levels measured on pooled data have the same blind spot.
