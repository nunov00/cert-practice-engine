id: aair-d3-3.5-0009
subdomain: '3.5'
difficulty: medium
stem: A serious vulnerability is announced in an open-source library widely used to load machine learning
  models. An insurer's security team asks which of its AI systems are affected, but nobody can say without
  inspecting each system's code by hand. Which control would BEST have prevented this delay?
options:
  A: A subscription to threat intelligence alerts on AI libraries
  B: A contract clause requiring suppliers to notify and patch flaws quickly
  C: Annual penetration testing of each production AI system
  D: A maintained list of the components and versions in each AI system
answer: D
explanation:
  why_correct: A maintained bill of materials for each AI system records which libraries, models and versions
    it uses. When a flaw is announced, the insurer can find affected systems in minutes and prioritise
    fixes, instead of searching code by hand.
  why_not:
    A: Alerts tell the insurer about the flaw sooner, but the delay was in finding which systems use the
      library. Alerts do not answer that.
    B: The affected library is open source and used in-house, so there may be no supplier to hold to a
      clause. A clause also does not tell the insurer where the library is used.
    C: Annual testing finds some weaknesses at one point in time. It does not give a current record of
      components to check when a new flaw is announced.
