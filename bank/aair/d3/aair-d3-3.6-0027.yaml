subdomain: '3.6'
difficulty: hard
stem: An online marketplace's recommendation model updates continuously from shoppers' clicks. Two hours ago, a
  coordinated group of fake accounts began clicking one seller's products, and new accounts keep joining. Those
  products are only starting to rise in recommendations. What should the incident team do FIRST?
options:
  A: Roll the model back to a snapshot from before the campaign
  B: Block the accounts identified as part of the campaign
  C: Pause the model's learning from new click data
  D: Switch to non-personalised recommendations for now
answer: C
explanation:
  why_correct: The harm grows with every click the model learns from, and the campaign is still running. Pausing
    learning stops the damage growing straight away, while the model keeps serving recommendations that are so far
    only slightly affected. Rollback, blocking and cleaning the click data can then follow without the campaign undoing
    them.
  why_not:
    A: Rollback removes the skew learned so far, but while the model keeps learning, the campaign's clicks would skew
      the restored model again. It is the step after learning is paused.
    B: Blocking the known accounts is needed, but new accounts keep joining, so the model would go on learning from
      those not yet identified.
    D: A non-personalised fallback avoids the skewed model, but the effect is still small, and it takes personalisation
      away from every shopper when pausing learning contains the harm with less disruption.
