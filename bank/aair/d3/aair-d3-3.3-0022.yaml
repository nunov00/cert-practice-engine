subdomain: '3.3'
difficulty: hard
stem: An internal AI assistant summarises emails and web pages for staff. Testers showed that hidden instructions on a
  web page could make it write a staff member's data into an image address, which the chat window then loaded from the
  attacker's server. Which control BEST blocks this leak path?
options:
  A: Scan the assistant's replies for personal data before display
  B: Stop the chat window loading images from external addresses
  C: Filter retrieved pages for hidden instructions before use
  D: Limit retrieval to pages from approved internal sources
answer: B
explanation:
  why_correct: The data leaves when the chat window fetches the image, because the address itself carries the data. Not
    loading external images closes that channel completely, whatever the model was tricked into writing.
  why_not:
    A: Output scanning catches plain personal data, but data packed into an address can be encoded or split up and slip
      past pattern checks. It reduces the leak rather than closing the path.
    C: Injection filters are worth having, but hidden instructions can be phrased in endless ways and filters miss some.
      Any that get through can still use the image channel.
    D: Limiting sources would shrink exposure, but summarising web pages is part of the assistant's job. It would remove
      a core function rather than close the leak path.
