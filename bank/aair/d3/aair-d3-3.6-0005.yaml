id: aair-d3-3.6-0005
subdomain: '3.6'
difficulty: hard
stem: An online retailer's dynamic pricing model charged some postcodes much higher prices for a week.
  Staff noticed, but the incident process covers only system outages and security breaches, so no one
  logged it. Which change BEST addresses the gap?
options:
  A: Add automated alerts for unusual price differences between postcodes
  B: Require a fairness review of the pricing model before each release
  C: Extend incident definitions and severity criteria to cover AI harms
  D: Give staff a channel to report concerns about model outputs
answer: C
explanation:
  why_correct: The process failed because harmful model behaviour was not recognised as an incident. Defining
    AI-specific harms, such as unfair or erroneous outputs, and how to rate their severity ensures they
    are logged, escalated and handled like other incidents.
  why_not:
    A: Alerts would detect this pattern sooner, but the staff already noticed. The gap is that nothing
      defined the harm as an incident, and that gap covers other AI systems too.
    B: A release review may prevent some unfair pricing, but it does not change how live harms are recognised
      and handled when they occur.
    D: Staff did notice the problem. A reporting channel into a process that only covers outages and breaches
      would still not treat it as an incident.
