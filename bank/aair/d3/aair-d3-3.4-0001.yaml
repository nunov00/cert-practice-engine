id: aair-d3-3.4-0001
subdomain: '3.4'
difficulty: medium
stem: A risk team wants a key risk indicator that warns that a deployed demand forecasting model is becoming
  less reliable, before planners or sales results show any effect. Which indicator is MOST suitable?
options:
  A: The monthly forecast error, calculated once actual sales are recorded
  B: The share of forecasts that planners override each week
  C: The trend in how far current input data differs from the training data
  D: The model's accuracy on its original held-out test set, rerun quarterly
answer: C
explanation:
  why_correct: A growing gap between live inputs and training data signals drift before errors reach forecasts,
    planners or sales results. The stem asks for a warning ahead of any visible effect, and input drift
    is the only option that moves first.
  why_not:
    A: Forecast error is the most direct measure of reliability, but it is lagging. It appears only after
      sales are recorded, which is after the effect the team wants to anticipate.
    B: Planner overrides are a useful signal of lost trust, but they happen only once planners notice
      bad forecasts. The stem wants a warning before that point.
    D: A fixed test set does not change, so rerunning it shows the same result even while live data drifts
      away from it. It cannot warn of change in production.
