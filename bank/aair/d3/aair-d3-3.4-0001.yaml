id: aair-d3-3.4-0001
subdomain: '3.4'
difficulty: easy
stem: A risk team wants a key risk indicator that gives early warning that a deployed demand forecasting
  model is becoming less reliable. Which indicator is MOST suitable?
options:
  A: The total cost of running the model on the cloud platform each month
  B: The number of AI models the organisation has deployed in production
  C: The trend in how far current input data differs from the training data
  D: The accuracy the model achieved in testing before it was released
answer: C
explanation:
  why_correct: A growing gap between live inputs and training data signals drift before errors become
    visible in business results. A good key risk indicator is forward-looking and tied to the risk being
    managed.
  why_not:
    A: Running cost is a performance or financial measure. It says nothing about forecast quality.
    B: This measures the size of the AI estate, not whether this particular model is becoming unreliable.
    D: A fixed historical figure cannot warn of change. It is a baseline for comparison, not an indicator.
