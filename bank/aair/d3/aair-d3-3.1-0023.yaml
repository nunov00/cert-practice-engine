stem: A grocery chain's model forecasts demand for each product in each store, and stock orders follow the forecast. The
  model retrains weekly on recorded sales. When an item sells out, the records show only the units sold. Which risk
  scenario should the assessment MOST include?
options:
  A: Seasonal shifts in shopping move demand away from the training data
  B: Under-forecast items get less stock, sell less and are forecast lower
  C: Competitors' price changes move demand faster than weekly retraining
  D: A corrupt sales feed from store systems skews a week of retraining
answer: B
explanation:
  why_correct: Sales are capped by the stock the model ordered, so a sold-out item looks as if demand was lower than it
    was. Retraining on those sales lowers the next forecast, which cuts stock again, a self-reinforcing loop that this
    design creates.
  why_not:
    A: Seasonal shifts are a real source of error, but weekly retraining tracks them; they are not specific to this design.
    C: Competitor moves cause short-term error that weekly retraining partly absorbs, while the loop in the stem keeps
      growing.
    D: A corrupt feed is a plausible one-off event, but the stem describes a weakness that operates every week with correct
      data.
