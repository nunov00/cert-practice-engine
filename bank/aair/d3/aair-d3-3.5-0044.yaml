id: aair-d3-3.5-0044
subdomain: '3.5'
difficulty: hard
stem: A bank uses a fraud model run by an industry consortium and retrained each week on the fraud cases that member
  firms report. The operator accepts each member's reports as submitted, and several recent members are small firms
  with little capacity to investigate fraud. Which requirement should the bank MOST place on the operator?
options:
  A: Advance notice of each retrained version, with the option to keep the last one
  B: Monthly reporting of the model's accuracy on the bank's own payments
  C: Checks on each member's reported cases before they are used in training
  D: An independent assurance report on the operator's model change controls
answer: C
explanation:
  why_correct: The model learns from other members' fraud reports, which the bank cannot see. Unchecked reports
    from firms with weak investigation, or from a member acting in bad faith, can mislabel genuine activity as fraud
    and degrade the model for every member. Checking each member's cases before training controls the risk where
    it enters the supply chain.
  why_not:
    A: Notice and the option to stay on a version help when a release looks worse, but the bank would have to spot
      the damage first, and staying put means missing new fraud patterns each week. The bad labels would keep flowing
      in.
    B: Accuracy on the bank's own payments shows the effect of bad training data after it has happened. It does
      not stop mislabelled cases entering each weekly retrain.
    D: An assurance report on change controls covers how releases are approved and deployed. It would not address
      the quality of the labels members contribute.
