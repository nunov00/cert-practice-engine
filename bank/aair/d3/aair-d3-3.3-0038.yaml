id: aair-d3-3.3-0038
subdomain: '3.3'
difficulty: medium
stem: Developers run an AI coding agent on their laptops, where it executes shell commands to build and test code.
  Testers showed that instructions hidden in a cloned repository could make it send the developer's cloud credentials
  to an outside server. Developers value the agent because it completes long tasks while they work on other things.
  Which control BEST addresses this?
options:
  A: Run the agent in a container without credentials or open network
  B: Have developers approve each command before the agent is allowed to run it
  C: Allow the agent to run only commands on an approved tool list
  D: Scan cloned repositories for hidden instructions before use
answer: A
explanation:
  why_correct: Isolating the agent in a container that holds no credentials and cannot reach arbitrary servers removes
    what the attack needs, whatever instructions the agent follows. It does not depend on spotting the instruction,
    and the agent can still work through long tasks unattended.
  why_not:
    B: Per-command approval suits a few high-impact actions, but it would stop the agent working unattended, and
      developers asked to approve a long stream of commands tend to approve by habit.
    C: An allowlist narrows what the agent can call, but build and test tools run scripts defined in the repository
      itself, so an attacker can act through an allowed tool.
    D: Scanning can catch known patterns, but hidden instructions can be worded in many ways and placed anywhere
      in a repository, so some will get through.
