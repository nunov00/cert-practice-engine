stem: A logistics firm advertises driver jobs on a social platform, targeting all adults in each area. The platform
  offers click-optimised and even-reach delivery, and the firm uses the default, click-optimised. About 85% of those
  reached are men, and a review traced the skew to delivery rather than targeting. Equality law in the firm's markets
  bars targeting job adverts by sex. The skew is above the firm's appetite for discrimination risk. Which treatment is
  MOST appropriate?
options:
  A: Switch the adverts from click-optimised delivery to even reach
  B: Rewrite the adverts with images and wording that appeal more to women
  C: Target part of the budget at women only to even out overall reach
  D: Track each month the share of applicants for the jobs who are women
answer: A
explanation:
  why_correct: The review places the cause in the platform's click-optimised delivery, which steers reach by predicted
    engagement learned from past patterns. Switching to the even-reach setting the platform offers acts where the skew
    arises. Auction costs can still tilt reach between groups, so the firm should check the reach it gets afterwards.
  why_not:
    B: Creative content does influence delivery, so this may narrow the gap, but the optimiser still steers reach by
      predicted engagement. It adjusts an input to the cause rather than the cause.
    C: Equality law in the firm's markets bars targeting job adverts by sex, so this swaps one discrimination risk for a
      breach.
    D: Monitoring applicants is useful evidence, but it does not change who sees the adverts. The risk stays above appetite.
