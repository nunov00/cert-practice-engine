stem: A company will train an image model on a large public dataset that is published as a list of web addresses with
  captions. The images themselves are downloaded from thousands of third-party websites when the training set is built.
  Which control BEST protects against poisoned training images?
options:
  A: Take the address list only from the dataset's official source
  B: Check each image against the hash recorded when the list was built
  C: Screen downloaded images with a harmful-content classifier
  D: Use only the latest published version of the dataset
answer: B
explanation:
  why_correct: The list is fixed, but the content behind each address is not. A website can change, or its expired domain
    can be bought by an attacker, who then serves altered images to anyone who downloads the dataset. Checking each image
    against the hash recorded when the list was built rejects anything that has changed since, wherever it is hosted.
  why_not:
    A: An official source is the right protection when a dataset is published as one file. Here it guarantees only the
      list of addresses, not what the third-party sites serve at download time.
    C: A content classifier is the right control against harmful or offensive images, but poisoned images are built to
      look normal and would pass it.
    D: The latest version may fix known problems, but it is still a list of addresses, and the sites behind them can
      change after it is published.
