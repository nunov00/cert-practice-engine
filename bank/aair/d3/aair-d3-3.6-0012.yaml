difficulty: hard
stem: A utility's business impact analysis rated its AI billing assistant as low criticality because staff
  could answer customers if it failed. Since then, the assistant has taken over 80% of contacts and the
  contact centre has cut half its staff. What should the risk practitioner conclude?
options:
  A: The rating holds, but the manual fallback should be retested
  B: The rating no longer holds and the analysis should be redone
  C: The assistant needs a second instance for higher availability
  D: The contact centre should rehire staff to restore the fallback
answer: B
explanation:
  why_correct: Criticality depends on whether the business can cope without the system. With half the
    staff and far more volume on the assistant, an outage would now cause serious disruption, so the analysis
    must be redone before deciding how to treat the gap.
  why_not:
    A: Retesting the fallback would expose the problem, but the rating itself rests on an assumption that
      is no longer true. Keeping it would understate the impact.
    C: Higher availability is one possible treatment, but it is premature. The analysis must first be
      updated so the right recovery options can be chosen.
    D: Rehiring is another possible treatment, also premature. The updated analysis should decide which
      option fits.
