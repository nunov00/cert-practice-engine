subdomain: '3.2'
difficulty: hard
stem: A warehouse's AI system steers autonomous forklifts through aisles where workers pick goods throughout each shift. Since
  a model update, forklifts sometimes pass close to workers at full speed, and the residual risk is above appetite. Retraining
  with a stronger penalty for close passes would take about three months. Which treatment BEST brings the risk within appetite?
options:
  A: Retrain the model with a larger penalty for passing close to workers
  B: A separate safety controller that caps speed whenever a person is near
  C: A supervisor on each shift who watches routes and stops unsafe forklifts
  D: Close the aisles to workers while the forklifts operate, for now
answer: B
explanation:
  why_correct: An independent, non-learned safety layer that limits speed near people bounds the harm whatever the model does,
    so it holds through this update and future ones.
  why_not:
    A: Retraining tackles the cause, but the risk stays above appetite for three months, and a learned penalty still gives
      no hard limit on the model's behaviour.
    C: One supervisor cannot watch every forklift at once, and close passes happen in seconds, faster than a person can spot
      and stop them.
    D: Workers pick goods in the same aisles all shift, so closing them would halt the operation the forklifts exist to support.
