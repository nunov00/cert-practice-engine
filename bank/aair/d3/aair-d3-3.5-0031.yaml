id: aair-d3-3.5-0031
subdomain: '3.5'
difficulty: hard
stem: A publisher uses a vendor's text generation service to draft articles and relies on the vendor's promise to
  defend customers against copyright claims over outputs. Editors often change the service's default settings to
  get longer, freer drafts. What should the risk practitioner check FIRST before relying on the promise?
options:
  A: The vendor's financial capacity to meet large claims against it
  B: The cap on the vendor's total liability under the promise
  C: The conditions the publisher must meet for the promise to apply
  D: Whether the vendor licensed the content used to train its model
answer: C
explanation:
  why_correct: Vendors' copyright promises usually apply only when the customer meets conditions, such as keeping
    default filters and safety settings on and not deliberately prompting for protected content. If editors routinely
    change the defaults, the promise may not apply at all, which would make the cap and the vendor's finances irrelevant.
    That is the first thing to establish.
  why_not:
    A: A vendor's ability to pay matters for any large indemnity, but it becomes relevant only once the publisher's
      use is actually covered.
    B: The cap limits how much protection the promise gives and should be checked, but the editors' habits raise
      the earlier question of whether the promise applies at all.
    D: Licensing of training data affects how likely claims are, and the promise exists to deal with that exposure.
      It does not tell the publisher whether it can rely on the promise.
