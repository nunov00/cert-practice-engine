subdomain: '3.1'
difficulty: hard
stem: A software firm's AI meeting assistant joins each call on an account manager's calendar, records until the
  meeting link closes, and emails a summary with action items to everyone invited. To save time, account managers
  book client calls back to back with their team's internal account reviews, on the same meeting link. Which risk
  scenario should the assessment MOST include?
options:
  A: Clients receive summaries that state commitments the firm did not make
  B: Client participants are recorded without having agreed to it
  C: Summaries leave out conditions that clients raised during the call
  D: Clients receive summaries that include the firm's internal account review
answer: D
explanation:
  why_correct: Because recording runs until the link closes and internal reviews follow client calls on the same
    link, a single summary covers both parts and goes to every invitee, including the client. The client is then
    likely to receive the firm's internal views, such as pricing positions or concerns about the account, in the
    normal running of the process. That routine, high-impact disclosure is the scenario the assessment must cover.
  why_not:
    A: Invented commitments in a summary sent to a client would be harmful, and generated summaries can contain
      them, but they are occasional errors. The internal review reaches clients through the process working as set
      up.
    B: Recording consent is a real legal point, but it is usually handled by notice when the assistant joins, and
      it does not reflect the exposure created by the way these calls are booked.
    C: Omitted client conditions could mislead the firm's follow-up and are a known summarisation weakness, but
      they are occasional. The booking practice makes the disclosure of the internal review a likely, repeated event.
