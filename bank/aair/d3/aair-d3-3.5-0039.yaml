subdomain: '3.5'
difficulty: hard
stem: A health insurer will make a vendor's model central to its claims handling. Press reports say the vendor's regulator
  is examining whether the model's training data was collected without a lawful basis, and in similar cases regulators have
  ordered such models deleted. Which due diligence item is MOST important?
options:
  A: The vendor's indemnity against claims over its training data
  B: Evidence of the lawful basis for the vendor's training data
  C: Escrow of the model's weights for use if the vendor fails
  D: A right to end the contract without penalty if the regulator acts
answer: B
explanation:
  why_correct: A deletion order would remove the model the claims process depends on. Evidence of how the training data was
    collected shows how likely that is before the insurer builds a critical process on the model.
  why_not:
    A: An indemnity may cover the cost of claims, but it cannot keep the model available if a regulator orders it deleted.
    C: Escrow protects against vendor failure, but a deletion order would reach the model itself, so escrowed weights could
      not lawfully be used.
    D: A termination right limits contractual exposure but leaves the insurer without its claims model, the disruption the
      diligence should help avoid.
