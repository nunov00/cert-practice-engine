id: aair-d3-3.1-0005
subdomain: '3.1'
difficulty: hard
stem: A manufacturer's twelve business units each use the same externally hosted foundation model for
  different tasks. Each unit has assessed its own use with the group's standard method and rated the risk
  low. What should the risk practitioner be MOST concerned about?
options:
  A: Each unit may have set impact levels using its own local thresholds
  B: The units may not have assessed data sent to the external host
  C: No one outside each unit may have challenged its own rating
  D: A single fault in the shared model could hit all units together
answer: D
explanation:
  why_correct: Each unit-level assessment sees only a small exposure, but the common dependency means
    an outage, a harmful model update or a change in the provider's terms hits every unit together. This
    concentration risk only becomes visible when the uses are assessed together at enterprise level, and
    the combined impact may exceed appetite even when each part does not.
  why_not:
    A: The stem says every unit used the group's standard method, so inconsistent local thresholds are
      unlikely to be the problem.
    B: Data shared with the host is a scenario each unit can see and assess within its own use, so a unit-level
      assessment would normally capture it.
    C: Independent challenge is good practice, but even well-challenged unit ratings would still miss
      the combined exposure, because no single unit can see it.
