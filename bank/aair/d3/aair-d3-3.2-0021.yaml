stem: A lender's AI tool reads income from uploaded payslips and misreads about 3% of them, which leads to wrong loan amounts.
  The residual risk is above appetite. Analysis shows that 90% of the errors come from handwritten payslips, which are 5%
  of volume and come mostly from casual workers. Which treatment is MOST appropriate now?
options:
  A: Cap the loan amount for applicants with handwritten payslips
  B: Retrain the model on more handwritten payslips before relying on it
  C: Accept only typed payslips and ask other applicants to resubmit
  D: Route handwritten payslips to manual review before a decision
answer: D
explanation:
  why_correct: The errors sit in a small, identifiable segment. Routing that 5% to people removes about 90% of the errors
    at once and at low cost, bringing the risk within appetite without disadvantaging any group of applicants.
  why_not:
    B: Retraining may help over time, but its effect is unknown until validated, and the risk is above appetite now.
    C: Requiring typed payslips shifts the burden to casual workers who may not have them, creating a fairness and customer
      harm issue.
    A: A cap limits loss size but penalises applicants for the format of their payslip, and wrong amounts still occur under
      the cap.
