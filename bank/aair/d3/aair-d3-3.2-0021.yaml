stem: A lender's AI tool reads income from uploaded payslips and misreads about 3% of them, which leads to wrong loan amounts.
  The residual risk is above appetite. Analysis shows that 90% of the errors come from handwritten payslips, which are 5%
  of volume. Which treatment is MOST appropriate now?
options:
  A: Retrain the model with many more handwritten payslip examples
  B: Send handwritten payslips to manual review before a decision
  C: Have staff review each extraction before the loan is offered
  D: Accept the risk and add the errors to the lender's insurance cover
answer: B
explanation:
  why_correct: The errors are concentrated in a small, identifiable segment. Routing that 5% to people removes about 90% of
    the errors at once and at low cost, bringing the risk within appetite while the model is improved.
  why_not:
    A: Retraining may help over time, but its effect is uncertain until it is validated, and the risk is above appetite now.
    C: Reviewing every extraction removes the risk but at many times the cost, since 95% of volume causes only a tenth of
      the errors.
    D: Acceptance is not open to the lender while residual risk is above appetite, and insurance does not prevent harm to
      customers from wrong loan amounts.
