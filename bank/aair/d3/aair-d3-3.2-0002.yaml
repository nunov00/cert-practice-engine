id: aair-d3-3.2-0002
subdomain: '3.2'
difficulty: hard
stem: A digital bank's head of product wants to launch an AI-based savings adviser next week. The risk
  assessment shows a residual risk that exceeds the bank's stated appetite, and the remaining controls
  will take two months. The head of product says, as risk owner, she accepts the risk. What should the
  risk practitioner do?
options:
  A: Escalate so the acceptance is made, documented and time-limited at the right authority level
  B: Allow the launch with extra monitoring and review the position after two months
  C: Block the launch until every outstanding control has been put in place
  D: Record her acceptance, since the risk owner has the right to make this decision
answer: A
explanation:
  why_correct: Risk owners can usually accept risk only within appetite. Accepting a risk above appetite
    needs a decision from the level that set the appetite, such as executive management or the board,
    with conditions, a deadline for the controls and a record of the decision.
  why_not:
    B: Monitoring may form part of the conditions, but it does not resolve who may accept an above-appetite
      risk. Proceeding without the right approval is the core problem.
    C: The practitioner advises and challenges but does not normally hold the authority to block a business
      decision. The right response is escalation to those who do.
    D: Ownership does not give unlimited authority. Recording an acceptance that exceeds her delegated
      limits would bypass the appetite the bank's leaders set.
