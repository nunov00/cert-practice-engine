id: aair-d3-3.2-0002
subdomain: '3.2'
difficulty: hard
stem: A digital bank's head of product wants to launch an AI-based savings adviser next week. The risk
  assessment shows a residual risk that exceeds the bank's stated appetite, and the remaining controls
  will take two months. The head of product says, as risk owner, she accepts the risk. What should the
  risk practitioner do?
options:
  A: Escalate the acceptance decision to the level that owns the appetite
  B: Allow the launch with extra monitoring until the controls are in place
  C: Recommend delaying the launch until the remaining controls are ready
  D: Record her acceptance with a review date two months from now
answer: A
explanation:
  why_correct: Risk owners can usually accept risk only within appetite. Accepting a risk above appetite
    needs a decision from the level that set the appetite, such as executive management or the board,
    which can set conditions and a deadline for the controls and record the decision.
  why_not:
    B: Monitoring may form part of the conditions, but it does not resolve who may accept an above-appetite
      risk. Proceeding without the right approval is the core problem.
    C: Delay is one option the decision maker may choose, but the practitioner's role is to get the decision
      to the right authority, not to substitute a recommendation for that decision.
    D: A review date makes the acceptance time-limited, but ownership does not give authority beyond appetite.
      Recording it would bypass the appetite the bank's leaders set.
