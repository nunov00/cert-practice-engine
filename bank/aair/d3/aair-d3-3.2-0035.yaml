id: aair-d3-3.2-0035
subdomain: '3.2'
difficulty: hard
stem: A hospital's AI tool assigns billing codes to patient records, and wrong codes lead to payer penalties. Coders
  can review about 10% of records. In an audit sample, codes the tool gave with over 95% confidence were wrong about
  as often as its other codes. A second, separately built model of similar overall accuracy is available. Which
  treatment BEST reduces the risk?
options:
  A: Send the 10% of records with the lowest confidence scores to coders
  B: Use the second model's code wherever its confidence is higher
  C: Send the records with the highest billed values to coders
  D: Send the records where the two models' codes disagree to coders
answer: D
explanation:
  why_correct: 'With review capacity limited, the treatment depends on finding the records most likely to be wrong.
    The audit shows the tool''s confidence does not separate right codes from wrong ones. Disagreement between two
    separately built models is a different signal: where they differ, at least one is wrong, so those records are
    rich in errors. Sending them to coders puts scarce review where it catches the most mistakes.'
  why_not:
    A: Routing by confidence is standard when scores track accuracy, but the audit shows these do not, so the records
      chosen would be little better than a random pick.
    B: Switching to the more confident model still trusts confidence scores, which have not been shown to work for
      either model, and it sends no records to coders, so errors pass with no review.
    C: High-value records may carry larger penalties, but value says nothing about whether a code is wrong, so most
      errors in other records would go through.
