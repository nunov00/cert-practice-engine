subdomain: '3.2'
difficulty: hard
stem: A telehealth provider uses an AI tool to draft visit summaries from recorded consultations. To reduce
  the risk of inaccurate summaries, the team proposes keeping every full recording for seven years so
  reviewers can check summaries against them. Testing shows the check catches most errors. What should
  the risk practitioner MOST ensure before this treatment is approved?
options:
  A: The privacy and security risk of keeping the recordings is assessed
  B: Reviewers have enough time set aside to check every summary
  C: Reviewers are independent of the clinicians who held the consultations
  D: Patients are told that an AI tool drafts their visit summaries
answer: A
explanation:
  why_correct: A treatment can create new risks. Keeping years of sensitive health recordings sharply
    increases exposure to breaches and may conflict with data minimisation and retention duties. That
    secondary risk must be assessed and controlled, for example through shorter retention or sampling,
    before the treatment is accepted.
  why_not:
    B: Reviewer capacity matters for running the check, but it does not address the significant new risk
      the proposal creates.
    C: Independence improves the quality of the check, but it does nothing about the new exposure from
      storing years of recordings.
    D: Transparency about AI use is good practice, but it does not address the breach and retention risk
      the proposal creates.
