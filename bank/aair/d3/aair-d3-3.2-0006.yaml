id: aair-d3-3.2-0006
subdomain: '3.2'
difficulty: medium
stem: An energy company agreed treatment plans for twelve AI risks six months ago. A review finds that half are
  overdue and several have no named owner, yet the register still shows all twelve risks as being treated. What
  should the risk practitioner do?
options:
  A: Ask the AI team to deliver all the overdue plans within the next month
  B: Report the register as accurate, since the plans are still in progress
  C: Assign accountable owners and new dates, and escalate long delays
  D: Close the overdue plans and open new ones with fresh target dates
answer: C
explanation:
  why_correct: Treatment plans only work if someone is accountable for delivering them and progress is tracked.
    Assigning owners, setting realistic dates and escalating serious delays restores accountability and lets management
    see risks that remain above target.
  why_not:
    A: An arbitrary deadline for one team ignores the missing ownership and may be unrealistic.
    B: The register would overstate the treatment in place and give management false assurance.
    D: Closing and reopening plans hides the delay and loses the record of slippage.
