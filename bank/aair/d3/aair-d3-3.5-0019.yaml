subdomain: '3.5'
difficulty: hard
stem: Developers add community plug-ins from a public marketplace to the company's AI agent framework. Plug-ins run with the
  agent's permissions, which include CRM access. Which control BEST addresses this supply chain risk?
options:
  A: Allow only plug-ins reviewed and approved by security
  B: Run the agent in a container isolated from the host
  C: Scan plug-ins for known vulnerabilities before each release
  D: Prefer plug-ins with high ratings and download counts
answer: A
explanation:
  why_correct: Any plug-in can act with the agent's CRM rights, so the main risk is a malicious or careless plug-in. An approved
    list, with review before use, stops untrusted code from getting those rights at all.
  why_not:
    B: Isolation protects the host, but the plug-in still has the agent's CRM access inside the container, which is where
      the harm lies.
    C: Vulnerability scans find known flaws in honest code. A deliberately malicious plug-in usually has no published vulnerability.
    D: Popularity lowers the odds of a bad plug-in, but attackers can inflate ratings, and popular packages have been compromised.
