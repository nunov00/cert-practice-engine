id: aair-d3-3.2-0041
subdomain: '3.2'
difficulty: medium
stem: An insurer's claims system decides each claim, and its AI chatbot tells customers the outcome. Regulation
  requires each rejection to tell the customer of their right to complain to an ombudsman. The chatbot leaves this
  out in about one rejection in 500. The assessment rates the risk low and within appetite, and the owner proposes
  to accept it. What should the risk practitioner advise?
options:
  A: Accept the risk with a recorded rationale and a six-month review date
  B: Append the required notice in code to each rejection the chatbot sends
  C: Retrain the chatbot on rejection replies that include the required notice
  D: Have staff check a weekly sample of rejections and contact those missed
answer: B
explanation:
  why_correct: A rule that applies to each rejection is not met by a tolerable error rate; accepting a known, recurring
    breach would mean choosing to break the rule for some customers. Because the claims system knows when a claim
    is rejected, code can add the notice to each rejection message, which makes the control complete without depending
    on the model's wording.
  why_not:
    A: Acceptance with a rationale and review date suits risks the organisation may tolerate, but here it would
      knowingly accept repeated breaches of a requirement owed to each customer.
    C: Retraining may lower the miss rate, but a generative model gives no guarantee, so breaches would continue
      at a lower level.
    D: Sampling with follow-up repairs some misses after the fact, but a sample cannot find them all, and the customers
      have already received rejections that break the rule.
