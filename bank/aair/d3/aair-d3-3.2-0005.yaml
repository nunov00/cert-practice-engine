id: aair-d3-3.2-0005
subdomain: '3.2'
difficulty: medium
stem: A logistics firm's AI tool predicts the delivery times shown to customers. Late estimates cause
  a few complaints, with expected losses of about 10,000 a year in goodwill credits. A proposed real-time
  monitoring control would cost about 80,000 a year. The risk is already within appetite. What should
  the risk practitioner recommend?
options:
  A: Accept the risk and keep tracking complaint levels
  B: Implement the control to lower the residual risk further
  C: Look for a cheaper control that brings losses near zero
  D: Accept the risk only after the board approves the decision
answer: A
explanation:
  why_correct: A treatment should cost less than the risk it reduces unless other factors justify it.
    Here the risk is within appetite and the control would cost eight times the expected loss, so accepting
    the risk while watching complaint trends is the sensible choice.
  why_not:
    B: Lowering risk is not enough on its own. The cost far exceeds the benefit for a risk already within
      appetite.
    C: The risk is already within appetite, so pursuing near-zero losses spends effort on a tolerable
      risk. Treatment would only be worth considering if complaint trends rose.
    D: A risk within appetite can normally be accepted by its owner. Board approval is for risks outside
      appetite, so this adds cost and delay without need.
