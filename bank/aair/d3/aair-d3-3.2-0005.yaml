id: aair-d3-3.2-0005
subdomain: '3.2'
difficulty: medium
stem: A logistics firm's AI tool predicts the delivery times shown to customers. Late estimates cause a few complaints,
  with expected losses of about 10,000 a year in goodwill credits. A proposed real-time monitoring control would
  cost about 80,000 a year. The risk is already within appetite. What should the risk practitioner recommend?
options:
  A: Accept the risk and keep tracking complaint levels
  B: Implement the control, since it lowers the residual risk
  C: Transfer the risk by adding a disclaimer to the estimates
  D: Avoid the risk by removing the delivery time estimates
answer: A
explanation:
  why_correct: A treatment should cost less than the risk it reduces unless other factors justify it. Here the risk
    is within appetite and the control would cost eight times the expected loss, so accepting the risk while watching
    complaint trends is the sensible choice.
  why_not:
    B: Lowering risk is not enough on its own. The cost far exceeds the benefit for a risk already within appetite.
    C: A disclaimer does not move the loss to another party, so it is not a real transfer, and it may irritate customers.
    D: Removing the estimates gives up a useful service to avoid a minor, tolerable risk.
