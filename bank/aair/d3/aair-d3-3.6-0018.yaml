difficulty: medium
stem: A company's AI agent has started issuing duplicate payments to suppliers. Logs show no model or prompt change in the
  past month, and the cause is unknown. What should the incident team do FIRST?
options:
  A: Roll the agent back to last month's version
  B: Analyse the logs to find what triggers duplicates
  C: Contact suppliers to recover the duplicate payments
  D: Suspend the agent's ability to issue payments
answer: D
explanation:
  why_correct: 'Containment comes first: every hour adds more duplicates. Removing the agent''s payment permission stops the
    harm while the cause is investigated, and payments can go through manual handling meanwhile.'
  why_not:
    A: Rollback is a common first step when a change caused the fault. No change was made, so rolling back would likely not
      help.
    B: Analysis is needed, but doing it first lets the agent keep paying duplicates while the cause is traced.
    C: Recovery is necessary, but it comes after the losses are stopped.
