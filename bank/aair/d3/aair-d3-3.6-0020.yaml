id: aair-d3-3.6-0020
subdomain: '3.6'
difficulty: medium
stem: A bank's fraud model runs on GPUs, and its recovery site has only CPUs, which can score about 5% of normal volume.
  The business impact analysis says only payments over 10,000, about 2% of volume, must be screened during a disaster.
  What should the risk practitioner recommend?
options:
  A: Screen only the payments the analysis requires at the recovery site
  B: Add GPU capacity at the recovery site to match production
  C: Contract burst GPU capacity from a cloud provider for disasters
  D: Keep a smaller, CPU-friendly model ready for use in recovery
answer: A
explanation:
  why_correct: Recovery should meet what the business impact analysis requires, not mirror production. The CPUs can
    already score more than the 2% of volume that must be screened, so routing only those payments to the model meets
    the requirement with no new spend.
  why_not:
    B: Matching production capacity is a common recovery design, but it pays for far more than the analysis says must
      continue. The existing CPUs already cover the requirement.
    C: Burst capacity is a sound option when recovery needs exceed what the site can do. Here they do not, so it adds a
      third-party dependency and cost for no gain.
    D: A lighter model is a sensible fallback when capacity is short. Here the full model can already handle the required
      volume on CPUs, so a weaker model would only lower detection.
