id: aair-d3-3.3-0002
subdomain: '3.3'
difficulty: hard
stem: A logistics company is giving an AI agent the ability to read supplier emails, update orders and
  issue payments up to a set limit. The security team warns that a crafted email could instruct the agent
  to act against the company. Which control MOST reduces the impact if such an attack succeeds?
options:
  A: Keep email content separate from the agent's system instructions
  B: Require a person to approve each payment the agent prepares
  C: Alert on agent payments to new or changed supplier bank details
  D: Filter incoming emails for known prompt injection phrases and patterns
answer: B
explanation:
  why_correct: Filters and prompt separation can lower the chance of a malicious instruction getting through,
    but none are fully reliable. Putting a person in the path of payments caps the damage even when an
    injected instruction is followed.
  why_not:
    A: Separating content from instructions makes injection harder, so it reduces likelihood. It does
      not limit the damage once an instruction gets through.
    C: An alert is detective. A fraudulent payment may already have left before anyone responds.
    D: Filtering reduces likelihood but attackers can word instructions in endless ways. It does little
      to limit impact once something gets past it.
