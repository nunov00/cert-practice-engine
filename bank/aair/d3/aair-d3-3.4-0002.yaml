id: aair-d3-3.4-0002
subdomain: '3.4'
difficulty: medium
stem: A risk practitioner at a pharmaceutical company is preparing the first quarterly AI risk report
  for the board. What should the report MAINLY contain?
options:
  A: The full AI risk register rated against appetite, with owners and action plans
  B: The top AI risks against appetite, with the decisions required
  C: Progress of the AI risk programme against its plan and budget
  D: AI incidents and near misses for the quarter, with root causes
answer: B
explanation:
  why_correct: A board oversees risk and sets appetite. A short view of the most significant AI risks
    measured against appetite, and the decisions the board must take, lets it exercise that role without
    operational detail.
  why_not:
    A: Rating every risk against appetite is sound risk work, but giving the board the whole register
      buries the few exceptions that need its decision.
    C: Programme progress tells the board whether the risk team is busy and on budget, not how exposed
      the company is or what the board must decide.
    D: Incidents and near misses are valuable inputs, but they are backward-looking. On their own they
      do not show exposure against appetite or ask for board decisions.
