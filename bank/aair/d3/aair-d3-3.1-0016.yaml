stem: Two AI risks at a retailer have the same rated impact and likelihood. A forecasting model's drift would build
  up errors over several months, while an exploit of a refund agent could drain funds within hours. What does this
  difference MOST imply for the refund agent?
options:
  A: It needs automated limits that act without people
  B: It needs a higher likelihood rating in the risk register
  C: It needs a monthly key risk indicator on refund losses
  D: It needs a larger share of this year's treatment budget
answer: A
explanation:
  why_correct: Risk velocity is how fast impact arrives. A loss that builds within hours outruns human review cycles,
    so the refund agent needs controls that stop payouts automatically as they happen.
  why_not:
    B: Velocity is a separate dimension from likelihood; raising likelihood would misstate the risk.
    C: A monthly indicator reports losses long after an hours-long exploit has run its course.
    D: Budget follows the treatment chosen; more money does not by itself respond to the speed of the risk.
