id: aair-d3-3.3-0016
subdomain: '3.3'
difficulty: hard
stem: A recruitment platform's fairness monitor compares shortlisting rates across candidate groups each
  week and has raised no alerts for five months. A review finds that the feed supplying candidates' self-reported
  group data stopped updating five months ago, after an application form was redesigned. Which change
  would BEST stop this kind of failure going unnoticed again?
options:
  A: Reconcile the monitor's group counts with applicant totals each quarter
  B: Have the monitor owner sign off each weekly report as reviewed
  C: Add checks that alert when the monitor's input data is missing or stale
  D: Ask the form design team to restore the field that feeds the monitor
answer: C
explanation:
  why_correct: The control failed silently because nothing checked its inputs. Completeness and freshness
    checks let the monitor signal its own failure, so that no alerts can be trusted to mean no issue,
    whatever future change breaks the feed.
  why_not:
    A: Reconciliation would detect missing data, but quarterly it could leave the monitor blind for months.
    B: Sign-off shows a report was read, but a report with no alerts looks normal even when its data is
      stale.
    D: Restoring the field fixes this instance, but the next change to forms or systems could break the
      feed again without warning.
