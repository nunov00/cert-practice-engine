id: aair-d3-3.1-0004
subdomain: '3.1'
difficulty: medium
stem: A government agency plans to use an AI model to flag benefit applications for extra checks. It has no history
  of losses or incidents from AI systems to draw on when rating likelihood. How should the risk practitioner BEST
  estimate likelihood for the scenarios it has identified?
options:
  A: Give every scenario the highest likelihood rating until real data is available
  B: Leave likelihood unrated and rank the scenarios on impact alone for now
  C: Use structured expert judgement and record the assumptions for later review
  D: Apply loss frequencies published for AI systems in other sectors directly
answer: C
explanation:
  why_correct: When internal data is lacking, structured judgement from informed people, such as estimates given
    as ranges, produces usable ratings. Recording the assumptions lets the agency compare them with real results
    once the model is running and revise the ratings.
  why_not:
    A: Rating everything at the maximum removes any basis for prioritising and would drive excessive treatment.
    B: Ignoring likelihood prevents sensible prioritisation, because severe but very unlikely scenarios would crowd
      out likely ones.
    D: External data can inform judgement, but applying it directly ignores differences in context, use and controls.
