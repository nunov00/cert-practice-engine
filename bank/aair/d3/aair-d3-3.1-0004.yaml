id: aair-d3-3.1-0004
subdomain: '3.1'
difficulty: hard
stem: A government agency plans to use an AI model to flag benefit applications for extra checks. It has
  no history of losses or incidents from AI systems to draw on when rating likelihood. How should the
  risk practitioner BEST estimate likelihood for the scenarios it has identified?
options:
  A: Base likelihood on manual error history, adjusted for AI failure modes
  B: Base likelihood on other agencies' AI incident data, adjusted for local controls
  C: Use structured expert estimates, with assumptions recorded for review
  D: Rate likelihood from error rates on a back-test of past applications
answer: C
explanation:
  why_correct: When internal loss data is lacking, structured judgement from informed people, such as
    estimates given as ranges, can cover every identified scenario. Recording the assumptions lets the
    agency compare them with real results once the model is running and revise the ratings.
  why_not:
    A: Manual error history describes a different process. Adjusting it still starts from failure modes
      that do not match AI risks such as bias, drift or misuse.
    B: Other agencies' data can inform the experts, but it reflects different models, uses and populations,
      and adjusting only for controls leaves those differences unaddressed.
    D: A back-test shows how often the model misclassifies past cases, but it says nothing about scenarios
      such as misuse, data changes or unfair treatment, so it cannot rate most of them.
