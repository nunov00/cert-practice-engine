id: aair-d3-3.5-0033
subdomain: '3.5'
difficulty: hard
stem: A bank bought a vendor's tool that makes final decisions on small personal loans. Six months after launch,
  the vendor's foundation model provider suspended the vendor's access for breaching its usage policy, which bars
  fully automated credit decisions. Lending stopped for two weeks. Which due diligence step would MOST likely have
  prevented this?
options:
  A: Requiring the vendor to keep a second model provider for failover
  B: Checking the bank's planned use against the model provider's usage terms
  C: Contracting for prompt notice of any dispute with the model provider
  D: Reviewing the vendor's continuity plan for loss of its model provider
answer: B
explanation:
  why_correct: The outage came from the use itself. Fully automated credit decisions were barred by the upstream
    provider's terms, which bind the vendor and so limit what the bank can do with the tool. Checking the planned
    use against those terms during due diligence would have exposed the conflict before launch, when the bank could
    still add human review of decisions or choose another tool.
  why_not:
    A: A second provider might have kept lending going, but if its terms are similar the use would breach them too,
      and the cause, a use the terms do not allow, would remain.
    C: Earlier notice of a dispute would give the bank a little more time to react, but the suspension would still
      come, since the use breaches the terms.
    D: A continuity plan covers recovery from losing the provider, but here the loss was caused by the bank's own
      use, which a continuity review would not have changed.
