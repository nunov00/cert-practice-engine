id: aair-d3-3.1-0006
subdomain: '3.1'
difficulty: hard
stem: A retail chain uses an AI tool to rank job applicants for store roles. Its risk assessment rated
  impact as low because a wrong ranking costs the company little, as there are plenty of other applicants.
  Which gap in the assessment should MOST concern the risk practitioner?
options:
  A: It does not consider how applicants' personal data is protected
  B: It ignores harm to applicants who are unfairly screened out
  C: It does not assess how often the tool ranks applicants wrongly
  D: It ignores strong applicants being ranked low and lost to rivals
answer: B
explanation:
  why_correct: Impact assessment for AI must consider the people affected by its decisions, not only the
    organisation's direct costs. Systematic unfair exclusion of applicants harms individuals and can bring
    discrimination claims, regulatory action and reputational damage, which can make the true impact high.
  why_not:
    A: Data protection is a real scenario for a hiring tool, but it is a separate scenario. It does not
      correct the flawed reasoning behind this impact rating.
    C: How often errors occur is a likelihood question. The stated gap is in how impact was judged, which
      looked only at the company's own cost.
    D: Losing good candidates is a real impact, but it is an organisational cost of the kind the assessment
      already judged small. It misses the larger harm to individuals and the legal exposure that follows.
