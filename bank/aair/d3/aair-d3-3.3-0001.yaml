id: aair-d3-3.3-0001
subdomain: '3.3'
difficulty: medium
stem: An insurer requires a claims handler to review every claim that its AI model recommends rejecting.
  Logs show that handlers confirm 99.8% of recommendations, usually within ten seconds. What should the
  risk practitioner conclude?
options:
  A: The model is accurate enough to drop the review for low-value claims
  B: The review control may exist on paper but not be operating effectively
  C: Handlers need more time per claim to review the recommendations
  D: The model's rejection threshold may be set too conservatively
answer: B
explanation:
  why_correct: Near-total agreement in a few seconds suggests rubber-stamping and automation bias. The
    control needs testing, for example by checking whether reviewers catch planted errors, and may need
    redesign such as workload changes or requiring reasons for decisions.
  why_not:
    A: Agreement does not show accuracy if reviewers are not really judging. Removing the review on that
      basis would drop the only human check on rejections.
    C: More time may be part of a fix, but it assumes the cause before the control has been tested. Extra
      time alone may not stop automation bias.
    D: Nothing in the stem points to the threshold. High, fast agreement says more about the reviewers
      than about where the model sets its cut-off.
