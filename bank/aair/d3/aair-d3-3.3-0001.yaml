id: aair-d3-3.3-0001
subdomain: '3.3'
difficulty: medium
stem: An insurer requires a claims handler to review every claim that its AI model recommends rejecting.
  Logs show that handlers confirm 99.8% of recommendations, usually within ten seconds. What should the
  risk practitioner conclude?
options:
  A: The review step adds little value and should be removed to save cost
  B: The review control may exist on paper but not be operating effectively
  C: More claims handlers should be added so each review takes longer
  D: The high agreement rate shows that the model is accurate and reliable
answer: B
explanation:
  why_correct: Near-total agreement in a few seconds suggests rubber-stamping and automation bias. The
    control needs testing, for example by checking whether reviewers catch planted errors, and may need
    redesign such as workload changes or requiring reasons for decisions.
  why_not:
    A: The step exists because rejections can harm customers. The finding calls for making the control
      work, not removing the only human check.
    C: Staffing may be part of a fix, but it assumes the cause before the control has been tested. Extra
      time alone may not stop automation bias.
    D: Agreement between model and reviewer is only meaningful if reviewers are really judging each case.
      Fast agreement is equally consistent with reviewers not checking.
