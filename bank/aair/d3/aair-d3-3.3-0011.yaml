id: aair-d3-3.3-0011
subdomain: '3.3'
difficulty: hard
stem: A pension provider is launching an AI assistant that answers members' questions about their benefits.
  The compliance team wants to be able to reconstruct, months later, why the assistant gave a particular
  answer. Which control BEST supports this?
options:
  A: Per-answer logs of the question and reply, kept for the retention period
  B: Dated version control of prompts, source documents and model releases
  C: Per-answer logs linking each reply to its retrieved sources and model version
  D: Session transcripts plus daily logs of retrieved sources and model version
answer: C
explanation:
  why_correct: To reconstruct a specific answer, the provider needs the input, the content the assistant
    drew on, the output and the model version that produced it, all linked to that answer. Per-answer
    logs that link each reply to its sources and model version, with suitable retention and access controls,
    give that traceability.
  why_not:
    A: Per-answer logs of question and reply show what was said, but not which sources the answer drew
      on or which model version produced it, so the reason for it cannot be reconstructed.
    B: Dated versions show what the assistant could draw on at a given time, but not which sources a particular
      answer used.
    D: Transcripts and daily source logs hold the right information, but nothing links a particular reply
      to the sources and model version behind it, so a disputed answer cannot be traced reliably.
