id: aair-d3-3.3-0013
subdomain: '3.3'
difficulty: hard
stem: An insurer offers brokers a public API that returns instant premium quotes from its pricing model.
  The risk team is concerned that a competitor could send large numbers of systematic queries to copy
  the model's pricing behaviour. Which control BEST addresses this?
options:
  A: Encrypting the model files where they are stored on the servers
  B: Per-client rate limits with monitoring for systematic queries
  C: A separate access key issued to each broker firm
  D: Rounding returned quotes to reduce the detail exposed
answer: B
explanation:
  why_correct: Copying a model through its interface needs many queries. Limiting volume per client and
    watching for systematic patterns makes extraction slow, costly and visible, so the insurer can act
    before much is learned.
  why_not:
    A: Encryption protects stored files, but the attack uses the legitimate API, so the files are never
      touched.
    C: Per-firm keys identify who is calling, which is a prerequisite, but on their own they do not limit
      or detect a competitor posing as a broker.
    D: Coarser outputs make copying less precise, but systematic queries can still map the pricing, and
      brokers need exact quotes.
