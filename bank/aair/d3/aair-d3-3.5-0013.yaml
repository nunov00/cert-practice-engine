id: aair-d3-3.5-0013
subdomain: '3.5'
difficulty: hard
stem: Developers at a software company use an AI coding assistant. A security researcher shows that the
  assistant sometimes suggests importing code packages that do not exist, and attackers have begun publishing
  malicious packages under those names. Which control BEST addresses this supply chain risk?
options:
  A: Train developers to check each suggested package before use
  B: Turn off package suggestions in the coding assistant
  C: Run software composition scanning on code at each release
  D: Install packages only from a vetted internal repository
answer: D
explanation:
  why_correct: Allowing builds to pull only from an approved internal repository stops an unknown or malicious
    package from entering the code, whatever the assistant suggests. It is a preventive control at the
    point where the third-party code enters.
  why_not:
    A: Awareness helps, but a package with a believable name is hard to spot. Relying on care alone leaves
      the main exposure open.
    B: Turning off suggestions removes one source of bad names, but developers can still mistype or copy
      names from elsewhere, and it gives up useful help. The point of entry stays uncontrolled.
    C: Scanning at release is detective and late. A malicious package runs as soon as it is installed
      in development, long before release.
