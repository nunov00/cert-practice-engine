id: aair-d3-3.5-0007
subdomain: '3.5'
difficulty: medium
stem: A large retailer has about two hundred suppliers whose products now include AI features, from shelf
  planning tools to payroll software. The supplier risk team is small. What is the BEST way to organise
  AI due diligence?
options:
  A: Send a short AI questionnaire to each supplier and review flagged replies
  B: Assess suppliers in order of their annual contract value
  C: Rely on suppliers' independent certifications where they hold them
  D: Tier suppliers by impact and data sensitivity and scale the reviews
answer: D
explanation:
  why_correct: Risk-based tiering puts limited effort where the potential harm is greatest, for example
    suppliers whose AI handles personal data or drives important decisions, while lower-risk suppliers
    get lighter checks.
  why_not:
    A: A light questionnaire for everyone is a reasonable start, but two hundred replies still swamp a
      small team, and the effort is spread by supplier count rather than by risk.
    B: Spend does not equal risk. A cheap tool can process sensitive payroll data or make significant
      decisions.
    C: Certifications help where they exist, but many do not cover AI-specific risks, and suppliers without
      them would receive no review at all.
