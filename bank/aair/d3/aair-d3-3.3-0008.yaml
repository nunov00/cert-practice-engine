id: aair-d3-3.3-0008
subdomain: '3.3'
difficulty: hard
stem: An online learning provider's release process requires a fairness test before each update to the
  model that decides which students are offered extra tutoring. Under deadline pressure, the test was
  skipped for the last two releases, which have now been live for a month. The test takes a day to run.
  What should the risk practitioner recommend as the immediate priority?
options:
  A: Roll back to the last model version that passed the fairness test
  B: Run the missed fairness test on the live model straight away
  C: Raise a control exception and get retrospective sign-off for the skips
  D: Add an automated gate that blocks any release without a test result
answer: B
explanation:
  why_correct: The key question is whether students are being treated unfairly now. Running the test on
    the live model within a day shows whether harm is occurring and informs the next step, such as a rollback
    if it fails. Root cause analysis and reporting follow.
  why_not:
    A: Rolling back without knowing whether there is a problem discards two releases of changes and may
      reintroduce issues they fixed. It may be needed, but only if the test fails.
    C: Recording the exception is needed, but sign-off without a test result does not show whether students
      are being treated unfairly now.
    D: A release gate prevents recurrence, but it does nothing about the two untested releases that are
      live now. It should follow once current exposure is known.
