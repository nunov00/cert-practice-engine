subdomain: "3.4"
difficulty: medium
stem: A bank's key risk indicator for its chatbot's wrong-answer rate has a single threshold, set at the board's
  tolerance, and a breach goes straight to the board. Last quarter the rate rose steadily for two months and breached in
  the third, and the board learned of it only then. What should the risk practitioner recommend?
options:
  A: Lower the single threshold so the board hears of breaches sooner
  B: Add an earlier warning threshold that triggers action by the owner
  C: Add a trend rule that alerts the board after two monthly rises
  D: Have the owner review the indicator's trend monthly and act on rises
answer: B
explanation:
  why_correct: A single threshold at tolerance warns only when the limit is already reached. A lower warning level tied to
    action by the model owner lets the rise be dealt with in the first two months, while the board level still marks the
    tolerance.
  why_not:
    A: Moving the board threshold below tolerance sends the board alerts that do not mean tolerance is breached, and still
      gives no one earlier responsibility to act.
    C: A trend rule gives an earlier signal, but it sends it to the board, which oversees tolerance rather than managing
      the chatbot, and still gives no one the duty to act before the limit is reached.
    D: A monthly owner review puts the right person on the indicator, but with no defined level the decision to act is
      left to judgement each month, which is how a steady two-month rise can pass without action.
