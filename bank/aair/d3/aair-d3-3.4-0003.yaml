id: aair-d3-3.4-0003
subdomain: '3.4'
difficulty: easy
stem: A bank uses a machine learning model to approve personal loans. Its main AI risk concern is that
  the model could treat some groups of applicants unfairly. Which key risk indicator is MOST suitable
  for this concern?
options:
  A: The model's overall approval rate, tracked month by month
  B: The number of fairness complaints from declined applicants
  C: The model's accuracy for each applicant group at its latest validation
  D: The gap in approval rates between applicant groups over time
answer: D
explanation:
  why_correct: A key risk indicator should be tied directly to the risk being managed. A widening gap
    in approval rates between applicant groups is an early signal of possible unfair treatment, so it
    tells the bank when to investigate before harm builds up.
  why_not:
    A: An overall approval rate can stay flat while one group is approved less and another more. It cannot
      show unequal treatment between groups.
    B: Complaints are a lagging and incomplete signal. Many unfairly declined applicants never complain,
      and those who do complain only after harm has occurred.
    C: Group-level accuracy is a useful fairness test, but it is a point-in-time validation result, not
      a production indicator. Accuracy can look similar across groups while approval rates drift apart
      in live use.
