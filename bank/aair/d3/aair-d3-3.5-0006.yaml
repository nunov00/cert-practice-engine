subdomain: '3.5'
difficulty: hard
stem: A payments company has adopted AI widely. Its fraud scoring, customer chatbot and internal coding assistant
  all use models from the same external provider. A review of the third-party inventory brings this to light.
  What should the risk practitioner recommend?
options:
  A: Move each of the three uses to a different provider as soon as possible
  B: Assess the concentration and set exit or fallback plans for critical uses
  C: Buy insurance that covers losses from an outage at the AI provider
  D: Negotiate higher service credits for downtime in the provider contract
answer: B
explanation:
  why_correct: 'Reliance on one provider creates concentration risk: a single failure, price change or policy
    change could disrupt several services at once. The response should be proportionate. Assess which uses
    are critical, then plan exit routes or fallbacks for those, rather than changing everything.'
  why_not:
    A: Spreading every use across providers is costly and disruptive, and the coding assistant may not justify
      it. Decisions should follow an assessment of criticality.
    C: Insurance may cover some financial loss but would not keep fraud scoring running or protect customers
      during an outage.
    D: Service credits are usually small compared with the business impact, and they do nothing to restore
      the service.
