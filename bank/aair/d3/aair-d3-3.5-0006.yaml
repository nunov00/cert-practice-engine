id: aair-d3-3.5-0006
subdomain: '3.5'
difficulty: hard
stem: A payments company has adopted AI widely. Its fraud scoring, customer chatbot and internal coding
  assistant all use models from the same external provider. A review of the third-party inventory brings
  this to light. What should the risk practitioner recommend?
options:
  A: Add a second provider for each of the three uses to remove the dependency
  B: Rank uses by criticality and plan fallbacks for the critical ones
  C: Negotiate resilience and change notice terms with the provider
  D: Review the provider's assurance report on resilience and continuity
answer: B
explanation:
  why_correct: Reliance on one provider creates concentration risk. A single failure, price change or
    policy change could disrupt several services at once. The response should be proportionate, so the
    company should establish which uses are critical and plan exit routes or fallbacks for those.
  why_not:
    A: Dual sourcing removes the dependency but is costly, and the coding assistant may not justify it.
      Decisions should follow an assessment of criticality.
    C: Better terms reduce some risks, but they cannot prevent a provider-wide outage or exit. Critical
      services still need a fallback.
    D: An assurance report shows how the provider manages its own resilience. It does not tell the company
      what it would do if the provider failed anyway.
