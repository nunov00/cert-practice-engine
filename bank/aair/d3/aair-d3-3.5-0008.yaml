difficulty: hard
stem: A media company wants to use a major provider's generative AI service to draft news summaries. The
  provider refuses individual customer audits but offers independent assurance reports and documentation
  of its safety testing. What is the BEST course of action for the risk practitioner?
options:
  A: Negotiate a pooled audit right shared with other large customers
  B: Secure contract rights to future assurance reports and bridge letters
  C: Assess the reports' scope and test the service for this use
  D: Escalate to the board to accept the lack of audit rights
answer: C
explanation:
  why_correct: Large providers often cannot allow every customer to audit them, so other assurance must
    be used. Checking that the independent reports cover the relevant controls, and testing how the service
    performs for news summaries, gives a sound and proportionate basis for the decision.
  why_not:
    A: Pooled audits can work with some providers, but this one refuses customer audits, and an audit
      of its controls still would not show whether the outputs suit news summaries.
    B: Ongoing rights to reports keep the assurance current, which is worth having. But the reports cover
      only the provider's own controls, not whether the outputs are suitable for news summaries.
    D: Escalation is premature. The available reports and testing have not yet been assessed, so the residual
      risk the board would accept is not yet known.
