subdomain: '3.5'
difficulty: hard
stem: A media company wants to use a major provider's generative AI service to draft news summaries. The provider
  refuses individual customer audits but offers independent assurance reports and documentation of its safety
  testing. What is the BEST course of action for the risk practitioner?
options:
  A: Reject the provider, since the right to audit is a mandatory contract term
  B: Accept the provider's reports as full assurance and proceed with the service
  C: Review the reports, test outputs for this use and record the residual risk
  D: Insist on an on-site audit as a condition before any contract is signed
answer: C
explanation:
  why_correct: Large providers often cannot allow every customer to audit them, so other assurance must be
    used. Reviewing independent reports for relevance, testing how the service performs for the company's own
    use and documenting any residual risk for acceptance gives a sound, proportionate basis for the decision.
  why_not:
    A: Treating audit rights as non-negotiable may rule out suitable providers when equivalent assurance is
      available by other means.
    B: The reports cover the provider's own controls, not whether the outputs are accurate and suitable for
      news summaries. Gaps would go unexamined.
    D: The provider has already said it refuses audits, so insisting is unlikely to succeed and delays the
      assessment the company can actually do.
