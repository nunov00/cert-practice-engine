id: aair-d3-3.4-0016
subdomain: '3.4'
difficulty: medium
stem: A payments firm's monthly AI risk report counts only AI incidents that caused a financial loss.
  Last month, staff caught several wrong outputs from its dispute-handling model before they reached customers,
  but these cases appear nowhere in the report. What should the risk practitioner recommend?
options:
  A: Report near misses caught by staff alongside loss incidents
  B: Report the model's sampled error rate alongside loss incidents
  C: Add a commentary on operational issues to the monthly report
  D: Report incidents by severity, including customer harm without loss
answer: A
explanation:
  why_correct: Near misses show how often the model fails and how much the business relies on staff catching
    the errors. Reporting them gives leaders early warning before a failure gets through and causes a
    loss.
  why_not:
    B: An error rate is a useful model measure, but it does not show how many errors were stopped by staff,
      which is the control dependency the report is missing.
    C: A free-text commentary may mention the cases, but it gives no consistent count that leaders can
      track over time or compare against thresholds.
    D: Widening incidents to include customer harm is sensible, but these errors never reached customers.
      They would still be left out of the report.
