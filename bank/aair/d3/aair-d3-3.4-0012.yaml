id: aair-d3-3.4-0012
subdomain: '3.4'
difficulty: medium
stem: A retail bank reports a single AI risk score to its executive committee, calculated as the average
  of the risk ratings of its 30 models. The score has been green all year. Meanwhile, a model used in
  mortgage decisions has been rated above appetite for two quarters. What is the MAIN weakness in this
  reporting?
options:
  A: The score is not weighted by each model's business criticality
  B: The ratings are not independently validated before averaging
  C: The score shows the current position but no trend over time
  D: Averaging lets an individual breach of appetite go unseen
answer: D
explanation:
  why_correct: Any average lets many low ratings offset a serious one, so the committee never sees that
    a mortgage model has been outside appetite for six months. Reporting should show every risk that breaches
    appetite on its own, whatever the overall picture.
  why_not:
    A: Weighting by criticality is a better aggregate, but it is still an aggregate. The mortgage model
      would be diluted by 29 others and the breach could still be hidden.
    B: Independent validation of ratings improves their quality. But the mortgage model is already rated
      above appetite, so the rating is not what failed to reach the committee.
    C: Trends add useful context, but a trend in the same average would also stay green. The breach would
      still be invisible.
