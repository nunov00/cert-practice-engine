subdomain: '3.2'
difficulty: medium
stem: A university's AI writing-integrity tool flags essays from students writing in a second language
  far more often than others, and each flag triggers an automatic grade penalty. The vendor needs three
  months to investigate. Which treatment is MOST appropriate in the meantime?
options:
  A: Lower the flagging sensitivity for essays written in a second language
  B: Stop automatic penalties and have trained staff review each flag
  C: Let flagged students appeal any penalty to an academic panel
  D: Keep the penalties but have staff review a sample of the flags
answer: B
explanation:
  why_correct: The harm comes from penalties applied without judgement to a group the tool treats unfairly.
    Requiring a trained person to review flags before any action keeps the tool's benefit while preventing
    unfair outcomes until the vendor fixes the cause.
  why_not:
    A: A group-specific threshold may narrow the gap, but it treats students differently by background,
      may not remove the bias, and still applies penalties without judgement.
    C: An appeal route helps, but students are penalised first and must challenge an unfair outcome afterwards.
    D: Sampling checks some flags, but most students wrongly flagged would still be penalised automatically.
