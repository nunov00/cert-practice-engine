subdomain: '3.1'
difficulty: medium
stem: An online travel agency is assessing two pricing tools with the same impact per wrong price. In
  one, analysts approve each price change. The other is an AI agent that changes thousands of prices an
  hour with no human step. When rating the agent's risk scenarios, which factor should the practitioner
  MOST weigh?
options:
  A: The agent's lower staff cost compared with the analyst-approved tool
  B: The higher accuracy the agent showed when back-tested on past prices
  C: The vendor's assurance that many other clients have tested the agent
  D: How many wrong prices could go live before an error is noticed
answer: D
explanation:
  why_correct: With no human step and high speed, one fault can be repeated thousands of times before
    anyone notices. The exposure therefore depends on volume and time to detection, which raises the impact
    of each scenario and should shape both the rating and the controls chosen.
  why_not:
    A: Staff savings belong in the business case. They do not change how much harm a fault in the agent
      could cause.
    B: Back-tested accuracy speaks to how often single errors occur, but not to how far a systematic error
      spreads at machine speed.
    C: Other clients' experience does not measure this agency's exposure, which depends on how the agent
      is deployed here.
