id: aair-d3-3.1-0015
subdomain: '3.1'
difficulty: hard
stem: An online travel agency is assessing two pricing tools with the same impact per wrong price. In
  one, analysts approve each price change. The other is an AI agent that changes thousands of prices an
  hour with no human step. When rating the agent's risk scenarios, which factor should the practitioner
  MOST weigh?
options:
  A: The agent's error rate per price compared with the analysts' rate
  B: The severity of the harm caused by each individual wrong price
  C: How quickly the agent's model drifts as market prices change
  D: How many wrong prices could go live before an error is noticed
answer: D
explanation:
  why_correct: With no human step and high speed, one fault can be repeated thousands of times before
    anyone notices. The exposure therefore depends on volume and time to detection, which raises the impact
    of each scenario and should shape both the rating and the controls chosen.
  why_not:
    A: Error rate per price speaks to how often single errors occur, but not to how far a systematic error
      spreads at machine speed before detection.
    B: The stem says the impact per wrong price is the same for both tools, so this factor does not separate
      their risk.
    C: Drift affects how likely errors become over time, but the distinctive exposure here is how many
      errors go live before anyone notices.
