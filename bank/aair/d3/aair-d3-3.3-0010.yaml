id: aair-d3-3.3-0010
subdomain: '3.3'
difficulty: easy
stem: A growing retailer's AI controls were set up by several teams over time. The risk practitioner suspects
  that some AI risks have no control while others are covered several times over. Which step will BEST
  reveal this?
options:
  A: Ask each team to rate how well its own controls are working
  B: Count the number of AI controls that each team owns
  C: Benchmark the number of AI controls against similar retailers
  D: Map each control to the risks it addresses in the register
answer: D
explanation:
  why_correct: Mapping controls to risks shows directly which risks have no control (gaps) and which have
    several (possible duplication), giving a basis to add, merge or retire controls.
  why_not:
    A: Self-ratings speak to how controls perform, not to which risks they cover, so gaps stay hidden.
    B: A count per team says nothing about which risks are covered.
    C: Comparing totals with other firms does not show whether this retailer's own risks are covered.
