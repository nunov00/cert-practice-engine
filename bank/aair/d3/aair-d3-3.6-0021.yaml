difficulty: medium
stem: A retailer's AI pricing model has started showing clearly wrong prices online. The cause is unknown, and the previous
  model version reads the same data feed that is suspected. What should the incident team do FIRST?
options:
  A: Switch to the documented fallback of last-known-good static prices
  B: Roll back to the previous version of the pricing model
  C: Retrain the model on data checked for the suspected errors
  D: Analyse the data feed to find the root cause of the errors
answer: A
explanation:
  why_correct: The first goal is to contain harm. The documented fallback does not depend on the suspect feed, so it stops
    wrong prices reaching customers while the cause is found.
  why_not:
    B: Rollback is a common containment step, but the previous version reads the same suspect feed, so it may show the same
      wrong prices.
    C: Retraining comes after the cause is known, and it takes time while wrong prices stay live.
    D: Root cause analysis is needed, but doing it before containment leaves customers seeing wrong prices for longer.
