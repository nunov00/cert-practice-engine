id: aair-d3-3.6-0029
subdomain: '3.6'
difficulty: medium
stem: An insurer's claims assistant runs on a vendor's base model that the insurer fine-tuned through the vendor's service.
  The vendor will retire that base model, and every fine-tune built on it, in 90 days. Under the insurer's retention
  schedule, the fine-tuning examples were deleted once training finished. What is the MOST significant continuity issue?
options:
  A: The replacement base model may answer differently and need revalidation
  B: Prompts tuned for the current model may work less well on its successor
  C: Ninety days may be too short to procure and onboard another vendor
  D: The insurer cannot repeat the fine-tuning on the replacement model
answer: D
explanation:
  why_correct: 'Once the base model and its fine-tunes are withdrawn, the usual recovery is to fine-tune the replacement on
    the same examples. With the examples deleted, the insurer cannot reproduce the behaviour it validated: it would have to
    rebuild a training set from scratch, with no way to show the new model matches the old one. The other issues are work to
    plan; this one impairs the recovery path itself.'
  why_not:
    A: Revalidation will be needed for any replacement, but it is planned work, and it assumes there is a comparable fine-tuned
      replacement to validate.
    B: Prompts may need tuning on a new model, but that is routine adjustment, much smaller than losing the fine-tuned behaviour
      itself.
    C: Moving to another vendor may be slow, but it is one of several routes the insurer could plan for, and any new model would
      still face the same missing examples.
