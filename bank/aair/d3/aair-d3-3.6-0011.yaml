subdomain: '3.6'
difficulty: hard
stem: A gym chain's AI chatbot revealed one member's address and payment history to another member who
  asked a cleverly worded question. The chatbot has been taken offline. What should the incident manager
  do NEXT?
options:
  A: Involve the privacy officer to assess breach notification duties
  B: Have the technical team search the logs for similar disclosures
  C: Contact the affected member to apologise and explain what happened
  D: Fix the chatbot's prompt filtering and test it before relaunch
answer: A
explanation:
  why_correct: With containment done, the disclosure of personal data may be a reportable breach with
    strict deadlines for telling the regulator and affected people. The privacy officer should assess
    scope and notification duties straight away.
  why_not:
    B: Scoping from logs is needed, but notification deadlines may already be running. The privacy officer
      should lead so that scoping serves the legal assessment rather than happening separately.
    C: The affected member may need to be told, but what to say and when depends on the breach assessment.
      Contact before that risks an incomplete or wrong message.
    D: Fixing the chatbot follows assessment. The legal duties arising from the disclosure come first.
