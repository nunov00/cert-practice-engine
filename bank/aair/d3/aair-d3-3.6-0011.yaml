difficulty: medium
stem: A gym chain's AI chatbot revealed one member's address and payment history to another member who asked a cleverly
  worded question. The chatbot has been taken offline. What should the incident manager do NEXT?
options:
  A: Involve the privacy officer to assess breach notification duties
  B: Retrain the chatbot with stronger instructions and relaunch it
  C: Wait for further complaints to judge how widespread the issue is
  D: Publish a public statement explaining the cause of the chatbot error
answer: A
explanation:
  why_correct: With containment done, the disclosure of personal data may be a reportable breach with strict deadlines
    for telling the regulator and affected people. The privacy officer should assess scope and notification duties
    straight away.
  why_not:
    B: A quick relaunch before the cause and scope are understood could repeat the leak. Fixing the chatbot follows
      assessment, not the other way round.
    C: Waiting for complaints is passive and could miss legal deadlines. The organisation should establish scope
      itself from logs.
    D: A public statement before facts and obligations are clear risks being wrong or incomplete. Communication
      should follow assessment and be coordinated.
