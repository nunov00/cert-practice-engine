id: aair-d3-3.6-0009
subdomain: '3.6'
difficulty: hard
stem: A telecom operator's network fault prediction model began raising thousands of alarms one weekend.
  The on-call incident team could not tell whether the alarms were false or real, and the data scientists
  were not on call until Monday. What should the risk practitioner recommend?
options:
  A: Write runbooks so the incident team can disable or roll back the model
  B: Give the incident team an escalation contact list for data scientists
  C: Add model owners to incident roles and on-call cover for key models
  D: Suppress model alarms automatically when volumes pass a set limit
answer: C
explanation:
  why_correct: AI incidents often need people who understand the model to judge whether its outputs are
    wrong and to decide on rollback or fallback. Building model owners into incident roles and on-call
    cover for critical models gives the team that expertise when it is needed.
  why_not:
    A: Runbooks help once a decision is made, but the team could not tell whether the alarms were real.
      Disabling the model without that judgement could hide genuine faults.
    B: A contact list helps only if someone answers. Without on-call duty, data scientists may still be
      unreachable at weekends.
    D: Automatic suppression could silence a real wave of faults. It removes the symptom without giving
      anyone the ability to diagnose it.
