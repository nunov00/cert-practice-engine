id: aair-d3-3.2-0010
subdomain: '3.2'
difficulty: easy
stem: A mid-sized insurer has budget this year to treat only some of the AI risks in its register. Several
  residual risks are rated above appetite. Which risks should the practitioner recommend treating FIRST?
options:
  A: Those above appetite whose treatments are cheapest to deliver
  B: Those with the highest inherent risk before any controls
  C: Those whose residual risk is furthest above appetite
  D: Those whose residual rating has risen most since last year
answer: C
explanation:
  why_correct: Limited treatment resources should go first where exposure is furthest outside what the
    organisation is willing to accept. Cost and speed then help choose between treatment options for those
    risks, not which risks come first.
  why_not:
    A: Cheap treatments can be attractive, but they may leave the largest exposures untreated while budget
      goes to risks only slightly above appetite.
    B: Inherent risk ignores the controls already in place. A risk with high inherent risk may already
      be well controlled and within appetite.
    D: A rising rating is a useful warning sign, but a risk that rose sharply may still sit less far above
      appetite than others that stayed high.
