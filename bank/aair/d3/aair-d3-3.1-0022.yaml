stem: An investment firm's AI tool recommends portfolio trades. Its risk assessment estimates how often a recommendation is
  wrong from back-testing, and rates impact on the loss from a single wrong recommendation. All recommendations use the same
  market data feed and are produced within minutes of each other. What has the assessment MOST likely missed?
options:
  A: That back-testing may not reflect live market conditions
  B: The risk posed by the vendor that supplies the data feed
  C: Losses when one fault affects many recommendations at once
  D: Losses when advisers rely on recommendations without review
answer: C
explanation:
  why_correct: Because every recommendation shares one feed and runs at the same time, a single fault can make many of them
    wrong together. Rating impact per recommendation understates this correlated loss.
  why_not:
    A: Back-testing limits are real, but they affect the likelihood estimate. The shared feed and timing point to a gap in
      how impact is sized.
    B: Supplier risk matters, but the shared feed is important here because of how one failure spreads across decisions, not
      because of who supplies it.
    D: Over-reliance can raise impact, but it applies to each recommendation separately and does not explain the concentration
      the stem describes.
