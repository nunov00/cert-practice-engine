stem: A bank plans to send customer identity documents to a vendor's AI document-reading service, going live next month.
  The vendor's independent assurance report covers its hosting and access controls, but the AI service launched after
  the report period, and the report carves out the pipeline that trains and serves its models. What should the risk
  practitioner do BEFORE go-live?
options:
  A: Accept the report and add a right-to-audit clause to the contract
  B: Request a bridge letter covering the months after the report period
  C: Obtain evidence on the carved-out model pipeline, such as a targeted assessment
  D: Require the vendor to include the AI service in next year's report scope
answer: C
explanation:
  why_correct: The report says nothing about the part of the service that will process the bank's identity documents.
    Evidence that covers that pipeline before data flows is the only option that closes the assurance gap in time.
  why_not:
    A: An audit right is worth having, but accepting the report means going live with no evidence on the pipeline that
      handles the documents.
    B: A bridge letter covers the time since the report period ended, not scope the report excluded, so the model pipeline
      stays unassured.
    D: Wider scope next year is a sensible ask, but it gives no assurance for the year of processing that starts next month.
