stem: A bank's customer chatbot answers from retrieved product documents. The risk team tracks complaints about wrong answers.
  Which key risk indicator would give the EARLIEST warning that wrong answers are rising?
options:
  A: Complaints about wrong answers per 10,000 chats
  B: Share of answers given with no relevant document retrieved
  C: Number of changes made each month to indexed documents
  D: Average customer satisfaction score after each chat
answer: B
explanation:
  why_correct: An answer given without a supporting document is likely to be unsupported or invented. Tracking that share
    shows the risk rising at the time answers are produced, before customers notice and complain.
  why_not:
    A: Complaints arrive only after customers have been misled, and many never complain, so this is a lagging indicator.
    C: Document changes are a driver of risk worth watching, but they do not show whether answers are actually going wrong.
    D: Satisfaction mixes many factors and moves after the fact, so it is a late, noisy signal of answer accuracy.
