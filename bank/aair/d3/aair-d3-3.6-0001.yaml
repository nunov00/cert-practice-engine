subdomain: '3.6'
difficulty: medium
stem: Hours after an update, a broadcaster's public AI chatbot starts producing offensive replies, and
  screenshots are spreading on social media. What should the incident response team do FIRST?
options:
  A: Add an output filter to block offensive replies and keep it running
  B: Roll the chatbot back to the last known good version
  C: Collect logs of the offensive replies to scope the incident
  D: Alert the communications team to prepare a holding statement
answer: B
explanation:
  why_correct: Containment comes first. The problem started with the update, so rolling back to the last
    known good version stops the harmful output quickly with a tested state. Investigation, communication
    and fixes follow.
  why_not:
    A: A new filter is untested and takes time to build, and the chatbot keeps producing harmful replies
      meanwhile. Rollback gives a known safe state now.
    C: Logs are needed to understand scope, but collecting them first lets the harm continue. They can
      be gathered after or during containment.
    D: Communications must be prepared, but a statement while the chatbot is still producing offensive
      replies would not limit the harm. Containment comes first.
