subdomain: '3.3'
difficulty: hard
stem: A company's model registry blocks deployment until a fairness test result is recorded for the model. Control testing
  finds a result recorded for every deployment, but several were copied from earlier versions of the same model. What does
  this MOST indicate?
options:
  A: Staff are not following the control as it was designed
  B: The control checks that a result exists, not that it matches the version
  C: A detective control is needed to monitor fairness after deployment
  D: Data scientists need training on why fairness testing matters
answer: B
explanation:
  why_correct: The registry accepted copied results because it only checks that a field is filled. That is a design deficiency,
    since even full compliance with the control as built cannot guarantee that the deployed version was tested.
  why_not:
    A: The staff did what the control allowed. Treating it as an operating failure would lead to reminders while the gap in
      the design stays open.
    C: Post-deployment fairness monitoring is valuable, but the finding is about the pre-deployment control, which can be
      passed without testing the right version.
    D: Training may change some behaviour, but the control would still accept a copied result, so the gap stays.
