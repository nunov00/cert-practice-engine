id: aair-d3-3.1-0010
subdomain: '3.1'
difficulty: medium
stem: A digital health company is identifying risk scenarios for its AI symptom checker, which is designed
  for adults only. User research shows that many parents are likely to enter their children's symptoms
  into it. How should the risk practitioner treat this in the assessment?
options:
  A: Note it in the assumptions and rely on the adult-only terms of use
  B: Assess it as a misuse scenario with its own likelihood and impact
  C: Assess it once live data shows how often it happens
  D: Refer it to the product team as a design defect to fix before launch
answer: B
explanation:
  why_correct: Scenario identification should cover reasonably foreseeable misuse, not only the intended
    use. The research shows this misuse is likely, and wrong advice about a child could cause serious
    harm, so it must be assessed now so that suitable treatments (such as age prompts, warnings or design
    changes) can be chosen.
  why_not:
    A: Terms of use may limit legal exposure, but they do not change what parents do. Noting it as an
      assumption leaves a likely, harmful use unassessed.
    C: Waiting for live data means children may already have been harmed. The research already gives enough
      evidence to assess the scenario now.
    D: A design fix may well be needed, but without assessing likelihood and impact first, no one can
      judge which fix is enough or track the risk afterwards.
