id: aair-d3-3.1-0009
subdomain: '3.1'
difficulty: hard
stem: A bank's fraud scoring model was assessed and approved for flagging suspicious card payments. The
  collections team now wants to use the same scores to decide which customers in arrears to contact first.
  The model and its data will not change. What should the risk practitioner do?
options:
  A: Validate the fraud scores on arrears data before approving the reuse
  B: Ask the model validation team to re-run the original accuracy tests
  C: Add the collections use to the existing risk record for the model
  D: Assess the collections use as a new use case before it starts
answer: D
explanation:
  why_correct: Risk depends on the context of use, not only on the model. Using fraud scores to treat
    customers in arrears raises new scenarios, such as unfair treatment of vulnerable customers or decisions
    based on a score never designed for that purpose, so the new use needs its own assessment.
  why_not:
    A: Validation on arrears data tests performance only. It does not assess harms such as unfair treatment
      of vulnerable customers, which the new decision context creates.
    B: Re-running the original tests confirms performance at detecting fraud, not suitability for a different
      decision.
    C: Recording the use against the old record treats it as covered by the fraud assessment, which never
      considered collections scenarios.
