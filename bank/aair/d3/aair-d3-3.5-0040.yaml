subdomain: '3.5'
difficulty: hard
stem: A retailer's product search assistant answers from 4 million documents, indexed as embeddings made by a provider's embedding
  model. The provider will retire that model version in 90 days and offers a newer one. Which response BEST manages this supply
  chain risk?
options:
  A: Use the new model for documents added from now on and keep the rest
  B: Negotiate with the provider to extend the retirement date by six months
  C: Move to a provider that commits to longer support for each model version
  D: Re-embed the whole index with the new model and test search before switching
answer: D
explanation:
  why_correct: Vectors from different embedding models sit in different spaces, so queries embedded with the new model cannot
    be matched reliably against documents embedded with the old one. The index has to be rebuilt with the new model and search
    quality tested before the switch, within the 90 days.
  why_not:
    A: Mixing vectors from two models in one index makes similarity scores meaningless between them, and once the old model
      is retired, queries can no longer be embedded to match the older documents.
    B: An extension buys time and may be worth asking for, but it delays the same rebuild, and the provider may refuse.
    C: Longer support makes this less frequent, but moving provider still means rebuilding the index with a different model,
      so it removes neither the work nor the deadline.
