difficulty: easy
stem: A small online retailer uses a generative AI tool to draft product descriptions, which staff edit before publishing.
  The residual risk is within appetite, and the owner decides to accept it. What should support this decision?
options:
  A: A full independent audit of the tool before the acceptance is confirmed
  B: An insurance policy that covers errors in product descriptions
  C: Confirmation from the tool's provider that its outputs are accurate
  D: A record of the owner's decision, the rationale and a review date
answer: D
explanation:
  why_correct: Acceptance is a valid treatment for a risk within appetite, but it should be a documented, owned
    decision. Recording the rationale and a review date makes the acceptance visible and ensures it is revisited
    if the use or conditions change.
  why_not:
    A: An independent audit is disproportionate for a low risk that is already within appetite.
    B: Insurance is a transfer option. It is not needed to accept a risk that is within appetite.
    C: Providers do not guarantee output accuracy, and the retailer's own staff review is the relevant control.
