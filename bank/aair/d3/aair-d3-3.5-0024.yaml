id: aair-d3-3.5-0024
subdomain: '3.5'
difficulty: hard
stem: An insurer's claims system uses a vendor's AI model to read medical invoices. A press report reveals that the vendor
  found, weeks earlier, that the model misread one invoice layout, and fixed it in a routine update without telling
  customers. The insurer had paid some claims on wrong amounts. Which contract change BEST addresses this risk?
options:
  A: Advance notice of each model update, with the option to pin a version
  B: A duty to tell customers promptly of known defects in the model
  C: Service credits when extraction accuracy falls below an agreed level
  D: Yearly independent assurance over the vendor's change process
answer: B
explanation:
  why_correct: The harm came from what the vendor knew and did not share. A duty to report known defects promptly, with
    what was affected and when, lets the insurer stop relying on the faulty output, find the claims paid on wrong amounts
    and correct them, instead of learning from the press.
  why_not:
    A: Notice and version pinning protect against harmful updates, which is the usual worry with vendor models. Here
      the update was the fix; notice of it would not say that past outputs were wrong, and pinning would have kept
      the faulty version running.
    C: Service credits compensate for poor accuracy in general, but they do not tell the insurer that a defect exists
      or which claims it affected, so the wrong payments stay uncorrected.
    D: Assurance over the change process checks that updates are controlled, and the update itself was handled. The
      failure was in disclosure to customers, which such assurance does not cover.
