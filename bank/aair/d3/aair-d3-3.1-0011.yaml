id: aair-d3-3.1-0011
subdomain: '3.1'
difficulty: medium
stem: A logistics firm's project team rates the risk of its new AI dispatch model as low. The rating assumes
  an output monitoring control and a manual override, both of which are planned but will not operate until
  three months after go-live. What should the risk practitioner do?
options:
  A: Accept the rating, noting that both controls are approved and funded
  B: Keep the rating as a target and add an action to track the controls
  C: Ask for both controls to be in place at go-live and keep the rating
  D: Rate the current risk on the controls that operate at go-live
answer: D
explanation:
  why_correct: A current risk rating must reflect the controls that actually operate. Planned controls
    support a target rating, not the current one. Rating on the go-live position shows the true exposure
    for the first three months, so the risk owner can decide whether to launch, add interim measures or
    accept the gap at the right level.
  why_not:
    A: Approval and funding do not reduce risk. A control only lowers exposure once it is operating, so
      the rating overstates the protection at go-live.
    B: Tracking delivery is useful, but presenting the low rating without a current rating hides the exposure
      in the first three months from decision makers.
    C: Bringing the controls forward may well help, but until they operate the low rating still misstates
      the exposure that decision makers rely on.
