id: aair-d3-3.6-0035
subdomain: '3.6'
difficulty: medium
stem: An AI agent that updates customer accounts followed instructions hidden in a supplier document for two days before
  it was stopped. It ran with an administrator role on the application server that holds its activity log, and reached
  the account systems only through their APIs. The team must establish exactly which account changes it made. Which
  source should the investigation MOST rely on?
options:
  A: The agent's own activity log for the two days
  B: The model provider's records of the tool calls the agent requested
  C: The audit logs kept by the account systems the agent changed
  D: The account systems' backups from before and after the two days, compared
answer: C
explanation:
  why_correct: The account systems' own audit logs record the changes actually made, and the agent, which reached those
    systems only through their APIs, had no administrator rights over them. They are the most reliable evidence of
    exactly what changed in customer accounts.
  why_not:
    A: An application's activity log is normally a key source, but the agent had administrator rights on the server holding
      that log, so the hidden instructions could have led it to alter or delete entries.
    B: The provider's records are independent of the agent, but they show what the model asked to do, not whether each call
      succeeded or what it changed in the accounts.
    D: Comparing backups shows the net difference in each account, but staff and customers also changed accounts in those
      two days, and a value the agent changed and was later changed again leaves no trace, so it cannot show exactly
      what the agent did.
