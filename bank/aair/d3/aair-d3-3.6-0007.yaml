stem: A city council's AI tool miscalculated housing benefit for three weeks before the error was found. The
  faulty logic has been fixed and verified, and the tool is working correctly again. What should the council
  prioritise NEXT?
options:
  A: Write a lessons learned report for the council's audit committee
  B: Identify affected decisions and correct them for residents
  C: Retrain the model on newer data to improve its future accuracy
  D: Commission an independent review of the council's AI strategy
answer: B
explanation:
  why_correct: With the cause fixed, the most pressing harm is to residents who received wrong payments. Identifying
    every affected decision and putting it right limits ongoing hardship and meets the council's duty to those
    people. Lessons learned and wider reviews can follow.
  why_not:
    A: A lessons learned review is important but can wait. Residents may be short of money now.
    C: The error was in the logic, which has been fixed. Retraining does not help the people already affected.
    D: A strategy review may be worthwhile later, but it is a long-term activity and does nothing for residents
      receiving wrong amounts.
