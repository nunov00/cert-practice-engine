stem: A city council's AI tool miscalculated housing benefit for three weeks before the error was found,
  and some residents were underpaid. The faulty logic has been fixed and verified, and the tool is working
  correctly again. What should the council prioritise NEXT?
options:
  A: Analyse why monitoring failed to detect the error for three weeks
  B: Identify affected decisions and correct them for residents
  C: Add monitoring that detects calculation errors in future
  D: Report the incident and its cause to the audit committee
answer: B
explanation:
  why_correct: With the cause fixed, the most pressing harm is to residents who received wrong payments.
    Identifying every affected decision and putting it right limits ongoing hardship and meets the council's
    duty to them. Analysis, monitoring and reporting can follow.
  why_not:
    A: Understanding the detection failure is important, but it does not help residents who are short
      of money now.
    C: Better monitoring prevents a repeat, but it is a later improvement. The harm already done comes
      first.
    D: Governance reporting matters, but the committee needs the scale of harm and the redress plan, which
      come from first identifying affected decisions.
