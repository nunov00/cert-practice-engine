subdomain: '3.2'
difficulty: medium
stem: A freight forwarder uses an AI model to assign customs tariff codes to shipments. Wrong codes lead
  to fines, and most errors occur in cases where the model reports low confidence. Staff have time to
  review about 15% of shipments manually. Which treatment BEST reduces the risk?
options:
  A: Have staff review a random 15% sample of all shipments the model codes
  B: Route shipments below a set confidence level to staff for coding
  C: Retrain the model every month on the latest shipment data
  D: Have staff review the shipments with the highest declared value
answer: B
explanation:
  why_correct: Errors cluster in low-confidence cases, so sending those to staff puts limited human capacity
    where it removes the most risk. The confidence threshold can be set so that the routed volume fits
    the 15% that staff can handle.
  why_not:
    A: A random sample spreads effort over mostly correct cases, so it catches far fewer errors with the
      same staff time.
    C: Nothing suggests out-of-date data causes the errors, and retraining would still let low-confidence
      errors go through unchecked.
    D: Value-based review targets the largest shipments, but the stem shows errors cluster in low-confidence
      cases, so this catches fewer errors with the same staff time.
