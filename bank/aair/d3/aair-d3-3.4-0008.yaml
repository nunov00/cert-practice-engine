stem: A telecom provider set its customer service team a target to cut the rate at which its AI assistant
  hands chats to human agents. The rate has fallen sharply and the target is met. Complaints about unresolved
  issues have risen. Weekly sampling shows answer accuracy is unchanged. What should the risk practitioner
  conclude?
options:
  A: The target is shaping behaviour and needs outcome measures beside it
  B: The assistant's answers have degraded and the model needs revalidation
  C: The target should move from handover rate to resolution rate
  D: Customers are raising new issues the assistant was not built to resolve
answer: A
explanation:
  why_correct: When a single measure becomes a target, teams may optimise it at the expense of the outcome
    it was meant to reflect. With accuracy unchanged and handovers falling as unresolved complaints rise,
    the likely cause is that chats are being kept from humans to meet the target. It should be paired
    with outcome measures such as resolution and complaint rates.
  why_not:
    B: Degraded answers would explain more complaints, but the weekly sampling shows accuracy has not
      changed.
    C: Resolution rate is a better outcome measure, but making it the single target in place of handovers
      invites the same gaming. The fix is balancing measures, not a swap of one lone target for another.
    D: New kinds of issue would usually push more chats to humans, not fewer. A sharp fall in handovers
      alongside more unresolved complaints points to the target, not to a change in demand.
