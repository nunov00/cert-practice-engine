subdomain: "3.5"
difficulty: easy
stem: An insurer will launch a vendor's hosted customer chatbot under its own brand, configured with the insurer's
  system prompt and knowledge base. Its red team wants to test the chatbot for prompt injection before launch, but the
  vendor's terms forbid customers from security testing its shared platform. The vendor offers its annual infrastructure
  penetration test summary. What should the risk practitioner recommend?
options:
  A: Accept the vendor's penetration test summary as the pre-launch evidence
  B: Agree a permitted test of the insurer's configuration on a vendor test instance
  C: Place the insurer's own input filter in front of the chatbot instead of testing
  D: Ask the vendor to warrant in the contract that the chatbot resists prompt injection
answer: B
explanation:
  why_correct: The risk sits in how the model behaves with the insurer's own prompt and knowledge base, which no vendor
    infrastructure test covers. A negotiated test on a test instance respects the terms and gives direct evidence before
    launch.
  why_not:
    A: The summary tests the vendor's infrastructure, not the model's behaviour under the insurer's configuration, so the
      injection risk stays untested.
    C: An input filter is a reasonable layer, but without testing nobody knows whether it or the chatbot resists injection
      in this configuration.
    D: A warranty shifts some liability after harm, but it provides no evidence of how the chatbot behaves before customers
      use it.
