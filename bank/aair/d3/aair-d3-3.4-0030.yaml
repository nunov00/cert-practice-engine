subdomain: '3.4'
difficulty: hard
stem: A news app's recommendation model is rewarded for reading time. The board has set a limit on readers being steered into
  ever narrower political content, a shift readers rarely notice in their own feeds. Which key risk indicator BEST tracks
  this risk?
options:
  A: Average reading time per reader, compared with the model's target
  B: Range of viewpoints in the articles each reader is shown, over time
  C: Share of readers who rate their feed as balanced in a survey
  D: Complaints about one-sided content per 10,000 readers
answer: B
explanation:
  why_correct: The risk is a change in what readers are shown, and readers rarely notice it themselves. Measuring the range
    of viewpoints in each reader's recommendations over time tracks that change directly from the app's own data, and can
    be compared with the board's limit as it develops.
  why_not:
    A: Reading time is what the model is rewarded for, so it shows whether the model meets its goal. A rise could come with
      narrowing, so it cannot show this risk.
    C: Surveys capture how readers see their feed, but readers rarely notice the narrowing in their own feeds, so many would
      still rate a narrowing feed as balanced.
    D: Complaints show some harm, but they depend on readers noticing a shift that they rarely notice, so the count would
      stay low while the risk grows.
