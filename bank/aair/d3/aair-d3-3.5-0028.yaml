subdomain: '3.5'
difficulty: medium
stem: A lender's credit models use a risk score bought from a credit bureau. The bureau rescaled the score in a routine release,
  announced in its published release notes, and the lender's approval rate rose sharply for a week before anyone noticed.
  Which control BEST addresses this supply chain risk?
options:
  A: A contract term requiring direct notice of changes to supplied data
  B: An alert when the daily approval rate moves outside a set range
  C: Checks on each bureau file that pause approvals if score patterns shift
  D: A named analyst who reviews the bureau's release notes each month
answer: C
explanation:
  why_correct: The change was announced, so notice was not what failed; the lender had no check on the data itself as it arrived.
    Checking the distribution of each bureau file against what the models expect, and pausing automated approvals on a shift,
    catches a rescaled score before loans are approved on it, whether or not anyone read the announcement.
  why_not:
    A: Direct notice is a reasonable contract term, but the bureau already published the change. Another notice still depends
      on someone reading it and linking it to the models in time.
    B: An approval-rate alert would flag the problem, but only after loans have been approved on the rescaled score. It acts
      on the outcome rather than the incoming data.
    D: Reading release notes is useful, but a monthly review could miss a change for weeks, and it relies on the analyst seeing
      the effect of each note on the models.
