subdomain: '3.6'
difficulty: hard
stem: An e-commerce company's business impact analysis sets a one-hour recovery time objective for fraud
  scoring at checkout. The scoring is provided by a third-party AI service whose contract commits to restoring
  service within 24 hours. What is the MOST significant issue for the risk practitioner?
options:
  A: The contract's penalties do not reflect the cost of an outage
  B: The supplier's 24-hour commitment has not been tested in an exercise
  C: The recovery objective cannot be met without a fallback or new terms
  D: The contract lacks a right to review the supplier's recovery plans
answer: C
explanation:
  why_correct: The continuity requirement and the supplier's commitment do not match, so in a real outage
    checkout fraud controls could be missing for up to a day. The company needs a fallback, such as rules-based
    scoring, or a contract that supports the one-hour objective.
  why_not:
    A: Penalties compensate after the fact. Even large ones would not restore fraud scoring within the
      hour the business needs.
    B: Testing would confirm the supplier can meet 24 hours, but even a proven 24-hour recovery is far
      outside the one-hour objective.
    D: Reviewing recovery plans adds insight, but it would only confirm a commitment that is already too
      slow.
