id: aair-d3-3.5-0002
subdomain: '3.5'
difficulty: easy
stem: A mid-sized engineering firm plans to buy an AI tool that screens job applications before recruiters
  see them. During supplier due diligence, which information is MOST important to obtain?
options:
  A: The supplier's list of reference customers in the same sector
  B: Evidence of how the supplier tested the tool for biased outcomes
  C: A demonstration of the tool's dashboard and reporting features
  D: The supplier's pricing model and the cost of adding more users later
answer: B
explanation:
  why_correct: Screening applicants is a high-impact use where unfair outcomes can harm candidates and breach
    employment law. Evidence of bias testing shows whether the supplier has managed the most significant risk
    the firm would be taking on.
  why_not:
    A: References show market acceptance, not whether the tool treats applicants fairly.
    C: A demonstration shows usability. It does not reveal how the tool reaches its decisions or how it was
      tested.
    D: Cost matters to the purchase decision but has no bearing on the main risk of the tool.
