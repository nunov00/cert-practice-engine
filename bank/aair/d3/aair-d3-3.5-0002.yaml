difficulty: medium
stem: A mid-sized engineering firm plans to buy an AI tool that screens job applications before recruiters
  see them. The tool will run inside the firm's own cloud environment. During supplier due diligence,
  which information is MOST important to obtain?
options:
  A: The supplier's security certification and data hosting arrangements
  B: Evidence of how the supplier tested the tool for biased outcomes
  C: The supplier's financial stability and plans for ongoing support
  D: How closely the tool's rankings match recruiters' past decisions
answer: B
explanation:
  why_correct: Screening applicants is a high-impact use where unfair outcomes can harm candidates and
    breach employment law. Evidence of bias testing shows whether the supplier has managed the most significant
    risk the firm would take on.
  why_not:
    A: Security and hosting matter in many purchases, but the tool runs in the firm's own environment,
      which reduces that exposure. Unfair screening remains the larger risk.
    C: Supplier stability affects continuity, which is worth checking, but losing the tool would cause
      less harm than unfair decisions about candidates.
    D: Agreement with past decisions sounds like accuracy, but it can show the tool has learned past bias.
      A close match is not evidence of fair outcomes.
