id: aair-d3-3.5-0034
subdomain: '3.5'
difficulty: medium
stem: An insurer's claims intake assistant calls a model provider's shared API. Its prompts and triage rules were
  validated only on this provider's model, and any model change needs revalidation. During a storm, claims rose
  tenfold and the provider throttled the insurer's requests for two days, so many customers could not file claims.
  The provider met its uptime commitment throughout. Which arrangement BEST addresses this supply chain risk?
options:
  A: Automatic failover to a second model provider when requests are throttled
  B: Uptime commitments with service credits for each hour of outage
  C: Queueing with retries, so throttled requests are sent again later
  D: Reserved capacity in the contract, sized to the insurer's peak volumes
answer: D
explanation:
  why_correct: 'The service did not go down; the insurer simply could not get enough of it when demand peaked. Reserved
    capacity, sized to the volumes a catastrophe brings, deals with that cause directly: the provider commits throughput
    to the insurer instead of sharing it with every other customer at the busiest moment.'
  why_not:
    A: Failover to a second provider is a sound pattern elsewhere, but here it would send claims through a model
      the prompts and triage rules were never validated on, which the insurer's own rules do not allow without revalidation.
    B: Uptime commitments cover outages, and the provider met them throughout; throttling is not an outage, so stronger
      credits would not have helped.
    C: Retries smooth short bursts, but a two-day tenfold peak leaves the queue growing faster than throttled capacity
      can clear it, so customers still cannot file in time.
