stem: A start-up plans to fine-tune its model on hospital patient records, including free-text clinical notes, using GPU time
  rented through a marketplace. The marketplace places each job on servers owned and run by independent hosts, chosen by price.
  Which control BEST addresses this supply chain risk?
options:
  A: Encrypt the records and model files in transit and while stored on hosts
  B: Bind the marketplace by contract to keep the records confidential
  C: Remove names and identifiers from the records before each job is sent
  D: Run jobs only on hosts offering attested confidential computing
answer: D
explanation:
  why_correct: During training, the records and model weights must be decrypted in the memory of servers that unknown hosts
    own and run, so anyone with control of a server could read or copy them. Confidential computing keeps data encrypted while
    in use, inside hardware-protected environments, and attestation lets the start-up verify that before it releases data
    to a host. It addresses the exposure at the point where the hosts would otherwise have access.
  why_not:
    A: 'Encryption in transit and at rest is necessary but stops at the point of use: to train, the data is decrypted on hardware
      the host controls, which is where the exposure lies.'
    B: A contract with the marketplace is useful, but the servers belong to independent hosts the marketplace does not run,
      and a contract cannot stop a host from reading data in its own memory.
    C: Removing direct identifiers helps, but free-text clinical notes often still identify patients through details in the
      text, and the fine-tuned weights would remain exposed on the hosts' servers.
