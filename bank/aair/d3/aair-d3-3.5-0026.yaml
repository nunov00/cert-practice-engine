subdomain: '3.5'
difficulty: medium
stem: A marketing team built a production lead-scoring workflow on the free tier of an external AI service, accepted
  through click-through terms. The terms let the provider change or withdraw the service without notice and use submitted
  data to improve its models. Customer records are sent with each request. What should the risk practitioner recommend?
options:
  A: Move to a contracted service with agreed data use and service terms
  B: Remove customer names and contact details from each request
  C: Prepare a manual scoring fallback in case the service is withdrawn
  D: Add the service to the third-party inventory for annual review
answer: A
explanation:
  why_correct: The click-through terms create two exposures, reuse of customer data by the provider and loss of a
    production service without notice. Bringing the service under a negotiated contract through procurement, with limits
    on data use and agreed service and change terms, addresses both at their source.
  why_not:
    B: Stripping direct identifiers reduces what is shared, but the remaining customer details can still identify people
      and be reused under the terms, and the service can still be withdrawn.
    C: A fallback limits the harm of withdrawal, but the provider would still be free to reuse the customer data sent with
      each request.
    D: Recording the service gives visibility, but an annual review leaves the click-through terms in force in the
      meantime and changes neither exposure.
