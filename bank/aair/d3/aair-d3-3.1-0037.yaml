stem: To cut payment delays, a bank moves its card fraud model into its mobile app. Each phone scores its own payments
  and sends the score with each payment, and the bank's server releases payments that arrive scored as low risk.
  Which risk scenario should the assessment MOST include?
options:
  A: Old app versions keep scoring payments with an outdated model
  B: Attackers copy the model from the app and probe it offline
  C: Altered apps send the server a low-risk score for any payment
  D: The smaller on-device model misses fraud the server model caught
answer: C
explanation:
  why_correct: The server trusts a score produced on a device the attacker controls. Anyone who modifies the app
    or intercepts its traffic can report every payment as low risk, which defeats the fraud model entirely, however
    good it is. The design moved a security decision outside the bank's trust boundary.
  why_not:
    A: Outdated models on old app versions are a real weakness, but they still score payments. They reduce accuracy
      rather than remove the control.
    B: Extracting the model to test evasion offline is a real threat, but attackers would still have to find payments
      the model passes. Faking the score makes that work unnecessary.
    D: A compressed on-device model may miss more fraud, and that is worth testing, but it is a gradual accuracy
      loss compared with a complete bypass.
