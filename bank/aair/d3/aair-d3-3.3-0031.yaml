id: aair-d3-3.3-0031
subdomain: '3.3'
difficulty: hard
stem: A retailer's AI purchasing agent cannot place orders above a limit that its ordering platform enforces, and the retailer's
  buyers can change the limit in the platform's settings. The risk practitioner tested the limit last week, and it blocked
  an order above it. The conclusion must cover the whole past year, and the platform keeps order logs for 30 days. Which further
  evidence BEST supports the conclusion?
options:
  A: The platform's audit trail of changes to the limit over the past year
  B: An analysis of the last 30 days of orders for any above the limit
  C: A sample of the year's supplier invoices checked against the limit
  D: The platform vendor's assurance report on its change controls
answer: A
explanation:
  why_correct: An automated control behaves the same way while its configuration and program stay unchanged. A test showing it works now,
    plus a complete record of every change to its setting during the year, supports a conclusion for the whole period,
    provided that history is trustworthy and the platform itself was not changed or bypassed, which the practitioner should
    confirm. Because buyers can change the limit at any time, the change history is the evidence that shows what the setting
    was across the year.
  why_not:
    B: Checking the logged orders is useful, but it covers only the last month. It says nothing about the eleven months before,
      when the limit could have been raised.
    C: Checking invoices is real evidence of outcomes, but buyers can change the limit at any time, so a sample can miss a
      period when it was raised. The audit trail covers every point in the year.
    D: The vendor's report covers the vendor's own change process, but the limit is changed by the retailer's buyers in its
      own settings. That report does not test those changes.
