stem: A public library service found out that its AI book recommendation tool was suggesting adult titles
  to children only when a parent posted about it online, weeks after the problem began. Library staff
  had heard similar remarks from visitors but had no way to raise them. The tool has since been fixed.
  What should the risk practitioner recommend?
options:
  A: Add content filters that block adult titles from children's suggestions
  B: Monitor social media daily for mentions of the library's AI tools
  C: Give staff and users a simple way to report AI problems for handling
  D: Include questions on AI tools in the library's annual visitor survey
answer: C
explanation:
  why_correct: The incident was detected late because the people who noticed the problem had no route
    into incident handling. A simple reporting channel that feeds the incident process turns these early
    signals into prompt investigation.
  why_not:
    A: A filter prevents this specific failure, but the tool is already fixed. The gap was that early
      signals from staff had no route into incident handling.
    B: Social media monitoring finds problems only after they become public. The library's own staff had
      earlier signals that went nowhere.
    D: A survey collects feedback, but once a year is far too slow to trigger incident handling.
