stem: A public library service found out that its AI book recommendation tool was suggesting adult titles to children
  only when a parent posted about it online, weeks after the problem began. Library staff had heard similar remarks
  from visitors but had no way to raise them. The tool has since been fixed. What should the risk practitioner recommend?
options:
  A: Remove the recommendation tool from the children's area of the site
  B: Monitor social media every day for mentions of the library's AI tools
  C: Give staff and users a simple way to report AI problems for handling
  D: Ask the vendor to send monthly reports on recommendation accuracy
answer: C
explanation:
  why_correct: The incident was detected late because the people who noticed the problem had no route into incident
    handling. A simple reporting channel that feeds the incident process turns these early signals into prompt investigation.
  why_not:
    A: The tool has been fixed, and removing it does not address the detection gap for this or other AI tools.
    B: Social media monitoring finds problems only after they become public. The library's own staff had earlier
      signals that went nowhere.
    D: Monthly accuracy reports are slow and may not show that suggestions are unsuitable for children. They do
      not use the signals staff were already receiving.
