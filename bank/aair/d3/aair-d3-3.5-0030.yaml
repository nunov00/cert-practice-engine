subdomain: "3.5"
difficulty: hard
stem: A bank pays a crowdsourcing platform per item to label customer complaint messages, many containing
  account details, for a new classifier. The latest batch came back in a third of the expected time, with
  higher agreement between annotators than among the bank's own experts. Which control BEST protects future
  batches?
options:
  A: Seed each batch with items whose labels the bank's experts have set
  B: Have the bank's experts relabel a sample of each batch and compare
  C: Pay annotators by the hour rather than for each item they label
  D: Bar the platform from using AI tools on the work without approval
answer: D
explanation:
  why_correct: "Fast, unusually uniform labels suggest annotators are pasting messages into an AI tool. That
    creates two risks: the classifier learns another model's errors, and customers' account details leave for
    an outside service. A contract term that bars unapproved AI tools, which the bank can enforce and audit,
    addresses both at the supplier, where the practice happens."
  why_not:
    A: Known-answer items are a standard quality check and would catch careless labelling. AI-generated labels can
      pass them, and they do nothing to stop account details being sent to an outside tool.
    B: Expert relabelling measures label quality well, but it is detective and covers only label quality. The data
      exposure would continue unchecked.
    C: Paying by the hour removes some of the incentive to cut corners, but it does not forbid the practice or
      give the bank any right to check. Annotators could still use outside tools.
