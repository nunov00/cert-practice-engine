id: aair-d1-1.5-0007
subdomain: '1.5'
difficulty: hard
stem: A recruitment firm licenses an AI screening tool, substantially changes how it scores candidates,
  and plans to sell the modified tool to other employers under its own brand. A risk-based AI regulation
  in its market sets different duties for those who supply AI systems and those who use them. What should
  the risk practitioner advise?
options:
  A: Keep only the user duties, since the firm did not build the tool
  B: Rely on the original vendor's compliance documentation as it is
  C: Pass all regulatory duties to the employers that buy the tool
  D: Check whether the changes make the firm a supplier, with its duties
answer: D
explanation:
  why_correct: Under risk-based regulations, an organisation that substantially modifies a system and
    markets it under its own name may take on the supplier's obligations. The firm must establish its
    role first, because that decides which duties apply, such as documentation, testing and conformity
    steps.
  why_not:
    A: Not having built the original tool does not settle the firm's role. Its changes and rebranding
      may make it the supplier in law.
    B: The vendor's documentation covers the original tool, not the modified version the firm is selling.
    C: Buyers have their own duties as users, but they cannot take on the supplier's obligations for a
      tool they did not change or bring to market.
