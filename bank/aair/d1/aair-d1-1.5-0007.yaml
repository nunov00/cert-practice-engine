subdomain: '1.5'
difficulty: medium
stem: A recruitment firm licenses an AI screening tool, substantially changes how it scores candidates,
  and plans to sell the modified tool to other employers under its own brand. A risk-based AI regulation
  in its market sets different duties for those who supply AI systems and those who use them. What should
  the risk practitioner advise?
options:
  A: Meet the user duties and obtain the vendor's technical file
  B: Agree contract terms with the vendor that allocate supplier duties
  C: Have buyers confirm their user duties in each sale contract
  D: Determine whether the changes make the firm a supplier in law
answer: D
explanation:
  why_correct: Under risk-based regulations, an organisation that substantially modifies a system and
    markets it under its own name may take on the supplier's obligations. The firm must establish its
    role first, because that decides which duties apply, such as documentation, testing and conformity
    steps.
  why_not:
    A: The vendor's file covers the original tool, not the modified version, and the firm's role may no
      longer be that of a user.
    B: Contracts can share practical work, but the regulation assigns roles by what a firm does. A contract
      cannot move the supplier's legal duties.
    C: Buyers do carry user duties, but confirming them leaves open whether the firm itself has supplier
      duties for the tool it sells.
