id: aair-d1-1.3-0009
subdomain: '1.3'
difficulty: medium
stem: The board of an online travel agency asks for independent assurance that its AI governance framework
  is working as intended. The AI risk team, which reports to the chief risk officer, designed the framework
  and offers to carry out the review. Who should BEST provide this assurance?
options:
  A: The AI risk team, with an external expert reviewing its findings
  B: The compliance function, which had no part in the framework's design
  C: An external consultancy engaged and paid by the chief risk officer
  D: Internal audit, reporting its findings to the audit committee
answer: D
explanation:
  why_correct: Internal audit is independent of both the people who run AI and the people who designed
    its governance, and it reports to the board. It can therefore give objective assurance on whether
    the framework is well designed and operating effectively.
  why_not:
    A: An outside reviewer adds some challenge, but the team would still be assessing its own design,
      so the assurance is not independent.
    B: Compliance did not design the framework, but it is a management function that operates within it.
      It cannot give the board fully independent assurance.
    C: The consultancy would be engaged by and report to the executive who oversees the framework's designers.
      That limits its independence from the work under review.
