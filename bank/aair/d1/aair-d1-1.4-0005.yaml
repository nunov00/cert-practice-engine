id: aair-d1-1.4-0005
subdomain: '1.4'
difficulty: medium
stem: A retailer's AI policy was approved eighteen months ago, before the company began testing AI agents
  that can place orders with suppliers. The policy requires review after any significant change in AI
  use. Its next scheduled review is in ten months, and the agents will not go live for at least six. What
  should the risk practitioner recommend?
options:
  A: Start an early policy review covering agent authority and oversight
  B: Issue an interim directive on agent use until the scheduled review
  C: Have procurement add agent controls to its purchasing procedures
  D: Require a risk assessment of each agent before it goes live
answer: A
explanation:
  why_correct: The policy itself calls for review after a significant change, and agents that act for
    the company are one. Questions of authority, spending limits and oversight need proper analysis and
    approval. The six months before go-live leave time to do this properly.
  why_not:
    B: An interim directive is a stopgap for urgent gaps. Here there is time for a full review, and a
      directive would skip the analysis and approval the policy requires.
    C: Procurement procedures cover one function's process. They cannot set enterprise rules on what authority
      an AI agent may hold.
    D: Assessments are needed, but they assess against the policy. A policy that does not address agent
      authority gives them no criteria to apply.
