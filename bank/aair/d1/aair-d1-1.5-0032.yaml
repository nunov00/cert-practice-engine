id: aair-d1-1.5-0032
subdomain: '1.5'
difficulty: medium
stem: A city's housing agency uses a model to rank applications for social housing. Applicants may appeal up to two years
  after a decision, and the agency must then show what the decision was based on. Its privacy officer wants the model's input
  data deleted after 90 days, once ranking is complete. What should the risk practitioner advise?
options:
  A: Delete the inputs after 90 days and keep each applicant's final score and rank
  B: Keep the inputs and model version for the appeal period, with access limited to appeals
  C: Keep the inputs for the appeal period in the case system, open to housing staff
  D: Keep the inputs for the appeal period and delete superseded model versions
answer: B
explanation:
  why_correct: Data minimisation means keeping personal data no longer, and no more widely, than its purposes need. Answering
    appeals is one of those purposes, backed by the agency's duty to show the basis of each decision, and that needs both
    the inputs and the model version that ranked them. Keeping both for the appeal period, used for appeals alone, meets the
    duty while limiting the processing.
  why_not:
    A: A score and rank show the outcome, not what it rested on. Without the inputs the agency cannot show on appeal whether
      the applicant's data was right or how the model reached the result.
    C: Keeping the inputs meets the appeal duty, but leaving them open to housing staff in the working system allows uses
      beyond appeals. The purpose that justifies keeping them should also limit who can see them.
    D: The inputs alone cannot show how the decision was reached if the model that ranked them is gone. On appeal the agency
      must be able to show which model version produced the result and why.
