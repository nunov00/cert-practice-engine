id: aair-d1-1.4-0007
subdomain: '1.4'
difficulty: hard
stem: A multinational manufacturer has one global AI policy. A new law in one country requires consultation
  with worker representatives before AI is used to monitor employees; the global policy does not cover
  this. Worker representation differs widely across its other countries, and some sites have no such body.
  How should the policy framework BEST handle this?
options:
  A: Keep the global policy as a baseline and add a local requirement
  B: Add the consultation rule to the global policy for each country
  C: Add a global clause stating that stricter local law takes precedence
  D: Have the local compliance lead attest to compliance each year
answer: A
explanation:
  why_correct: A tiered framework keeps one global baseline and adds a specific local requirement where
    the law demands more. The consultation step is written down for that country, so it can be followed
    and checked, without forcing a process that cannot work at sites with no worker body.
  why_not:
    B: A consultation rule cannot work at sites with no worker body, and it adds burden where no law requires
      it.
    C: A general precedence clause is useful, but it does not say what must be done. Nobody is required
      to consult before monitoring starts, and there is no evidence that it happens.
    D: An annual attestation checks after the fact. It does not build the consultation step into the process
      before monitoring is introduced.
