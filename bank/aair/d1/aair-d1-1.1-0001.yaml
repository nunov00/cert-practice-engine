id: aair-d1-1.1-0001
subdomain: '1.1'
difficulty: hard
stem: The pricing team at a mid-sized insurer proposes using a general-purpose generative AI model to
  calculate individual premiums from free-text application notes. Premiums must be repeatable and explainable
  to customers and the regulator. What should the AI risk practitioner recommend?
options:
  A: Fix the model's settings so the same notes always give the same premium
  B: Fine-tune the model on past premiums and validate its accuracy before launch
  C: Add an explanation tool that describes the factors behind each premium
  D: Price with an interpretable model, using AI only to extract inputs
answer: D
explanation:
  why_correct: The requirement is for premiums that are both repeatable and explainable. A generative
    model is weak on both counts. Using it only to turn free-text notes into structured inputs, and letting
    an interpretable pricing model set the premium, keeps the useful part of the technology while the
    price itself comes from logic that is stable and can be explained to customers and the regulator.
    It fits the technique to the task.
  why_not:
    A: Fixed settings can make outputs more consistent, though not always fully repeatable. Even then,
      nobody could explain why a given premium was produced, so the explainability requirement is still
      not met.
    B: Fine-tuning and validation may improve accuracy, but the model would still be hard to explain and
      its outputs could still vary. Accuracy is not the requirement the stem stresses.
    C: Explanation tools give an approximate, after-the-fact account of a generative model's output, which
      may not reflect how the premium was really produced. Repeatability is also left unaddressed.
