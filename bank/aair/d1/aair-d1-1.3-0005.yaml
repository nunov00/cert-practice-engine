id: aair-d1-1.3-0005
subdomain: '1.3'
difficulty: medium
stem: A hospital uses a vendor's AI tool that flags possible fractures on X-rays for radiologists. Asked
  who is accountable if a fracture is missed, the clinical director says the vendor is, because it built
  the tool. How should the risk practitioner respond?
options:
  A: Ensure the contract makes the vendor liable for missed fractures
  B: Explain that the hospital stays accountable for its use of the tool
  C: Explain that the signing radiologist is accountable for each reading
  D: Ask the vendor for evidence of the tool's clinical validation results
answer: B
explanation:
  why_correct: An organisation can buy a tool but cannot outsource its accountability for the care it
    provides with that tool. The hospital decides how the tool is used and must manage that risk. The
    contract can give the vendor specific duties, such as performance and fixing defects, without moving
    overall accountability.
  why_not:
    A: Liability terms can recover costs from the vendor, but they do not move accountability for patient
      care. The clinical director's misunderstanding would remain.
    C: Radiologists have professional duties for what they sign, but this ignores the hospital's decisions
      about adopting, configuring and governing the tool.
    D: Validation evidence is worth having, but it answers whether the tool performs, not who is accountable
      when it misses something.
