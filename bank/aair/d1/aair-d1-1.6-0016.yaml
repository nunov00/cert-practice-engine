stem: A mental health app's AI companion tells users it cares about them and is always there for them. Users consented to
  the processing of their health data. Some now say they prefer it to their therapist. What is the MOST significant ethical
  concern?
options:
  A: Users may depend on a system that cannot provide care
  B: Health data may be processed beyond what users agreed
  C: The companion may state wrong facts about treatments
  D: Usage costs may rise as users spend longer in the app
answer: A
explanation:
  why_correct: Language that suggests feelings and constant availability invites vulnerable users to rely on the companion
    as if it were a carer. Over-reliance can delay or replace real treatment, which is the most serious harm in this context.
  why_not:
    B: Consent issues matter for health data, but the stem says users consented, and nothing points to processing outside
      that.
    C: Inaccurate statements are a real risk for any language model, but the behaviour described is about the relationship
      users form, not factual errors.
    D: Rising cost is a business risk, not an ethical concern for users.
