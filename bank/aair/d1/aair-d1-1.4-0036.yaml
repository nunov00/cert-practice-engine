stem: At a logistics group, staff proposing a new AI use rate its risk tier themselves, and the tier sets how much review
  it gets. About 400 proposals arrive a year, and the AI risk team has two people. A review found that half the proposals
  rated low had been under-rated. Which procedure change BEST addresses this?
options:
  A: Derive the tier from proposers' factual answers on data, users and autonomy
  B: Keep proposers' own ratings, with the risk team spot-checking a sample
  C: Have each proposer's line manager confirm the rating before submission
  D: Have the risk team set each tier after a short call with the proposer
answer: A
explanation:
  why_correct: Self-rating fails because proposers judge risk loosely and gain from a low tier. Asking factual questions,
    such as what data is used, who is affected and whether the AI acts on its own, and deriving the tier from the answers
    removes that judgement while scaling to 400 proposals with a two-person team.
  why_not:
    B: Spot-checks are a sound backstop where ratings are mostly right, but with half the low ratings wrong, a sample would
      leave most under-rated proposals with too little review.
    C: Managers usually share the proposer's interest in a light review and rarely have the expertise to judge AI risk, so
      the rating would gain a signature rather than accuracy.
    D: Risk team tiering would be accurate, but two people cannot hold calls on about 400 proposals a year without becoming
      a bottleneck that encourages teams to bypass the process.
