subdomain: '1.4'
difficulty: medium
stem: A school district is rolling out an AI tool that helps teachers draft feedback on pupils' work.
  Training covers which pupil information, such as special needs and family circumstances, may be entered.
  It is planned for the end of term, but accounts will be active from next week. What should the risk
  practitioner recommend?
options:
  A: Send teachers a quick-reference guide on pupil data before launch
  B: Configure the tool to block pupil names and identifiers in prompts
  C: Grant each teacher access only after they complete the training
  D: Monitor prompts for pupil data and retrain teachers who misuse it
answer: C
explanation:
  why_correct: Untrained users are the most likely to misuse a new tool. Making training a condition of
    access ensures each teacher knows the rules before they can enter anything, without holding back those
    who are ready.
  why_not:
    A: A guide helps but is easily skipped, and it is not the same as training on judgement calls about
      sensitive details.
    B: A filter can catch names, but it cannot recognise sensitive details such as family circumstances
      written in free text.
    D: Monitoring finds misuse after pupil data has already been entered. It is a useful backstop, not
      a substitute for training first.
