id: aair-d1-1.4-0019
subdomain: "1.4"
difficulty: medium
stem: A retailer's AI policy lets risk owners approve exceptions to it. A review finds 40 open exceptions. Most have no
  end date, and several cover uses that have grown well beyond what was approved. What should the risk practitioner
  recommend?
options:
  A: Give each exception an expiry and scope, with re-approval to extend it
  B: Stop granting exceptions to the AI policy from now on
  C: Move approval of exceptions to the board risk committee
  D: Close the 40 open exceptions and ask teams to reapply
answer: A
explanation:
  why_correct: Exceptions are meant to be temporary and specific. A defined scope and expiry, with re-approval needed to
    extend, brings each one back for a decision before it can drift or become permanent.
  why_not:
    B: Exceptions handle cases the policy did not foresee. Removing them pushes teams to work around the policy unseen.
    C: Board approval adds weight, but exceptions approved by the board could still run on without limit.
    D: Closing all forty at once disrupts work, and the reapplications would face the same open-ended terms.
