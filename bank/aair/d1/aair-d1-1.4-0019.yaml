id: aair-d1-1.4-0019
subdomain: "1.4"
difficulty: medium
stem: A retailer's AI policy lets risk owners approve exceptions to it. A review finds 40 open exceptions. Most have no
  end date, and several cover uses that have grown well beyond what was approved. What should the risk practitioner
  recommend?
options:
  A: Review the open exceptions with their owners each quarter
  B: Give each exception a set scope and expiry, renewable only by re-approval
  C: Record each exception in the risk register with a named owner
  D: Require second-line sign-off before any new exception is granted
answer: B
explanation:
  why_correct: Exceptions are meant to be temporary and specific, and these drifted because nothing ended them. A defined
    scope and expiry, with re-approval needed to extend, brings each one back for a decision before it can grow or
    become permanent.
  why_not:
    A: Quarterly reviews would catch drift, but without an expiry an exception still runs on by default unless someone acts
      to end it.
    C: Registering exceptions with owners improves visibility, but owners already approve them, and nothing in the register
      makes an exception end.
    D: Second-line sign-off strengthens the approval, but approved exceptions could still run on without limit.
