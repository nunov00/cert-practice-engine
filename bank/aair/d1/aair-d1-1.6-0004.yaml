id: aair-d1-1.6-0004
subdomain: '1.6'
difficulty: medium
stem: A university is developing a model to identify students at risk of dropping out so that they can
  be offered extra support. Analysts show that the fairness measures under consideration cannot all be
  met at once. What should the risk practitioner recommend?
options:
  A: Choose the measure with stakeholders and document the trade-off
  B: Have the analysts recommend a measure and document the trade-off
  C: Use demographic parity and record why it was chosen
  D: Apply the AI standard's default measure and record the rationale
answer: A
explanation:
  why_correct: Fairness measures can conflict, so choosing one is a value judgement about which errors
    matter most for this use. Here, missing students who need support may matter more than offering help
    to some who do not. That choice should involve affected stakeholders, and the trade-off should be
    documented so it can be explained and reviewed.
  why_not:
    B: Analysts can explain what each measure does and recommend one, but the choice is a value judgement
      about which harms to students matter most. It should involve the people affected, not rest with
      the technical team.
    C: Recording the reason helps review, but picking equal flagging rates in advance skips the value
      judgement with stakeholders, and it ignores differences in need between groups.
    D: A default helps consistency across projects, but the analysts have shown the measures conflict
      for this use. Recording a rationale does not replace the judgement with stakeholders that this case
      needs.
