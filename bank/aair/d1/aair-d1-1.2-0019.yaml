subdomain: '1.2'
difficulty: hard
stem: An insurer's procurement process skips risk review for software purchases under 50,000. Business units now buy AI subscriptions
  through many small contracts, and some process claims data. Which change BEST addresses this?
options:
  A: Lower the review threshold for software to 10,000
  B: Require the CIO to sign off each AI subscription
  C: Screen by AI use and data, not contract value
  D: Block card payments for software in business units
answer: C
explanation:
  why_correct: 'Contract value does not track AI risk: a cheap subscription can process claims data at scale. Screening triggered
    by AI use and data sensitivity brings these purchases into review whatever they cost, and lets low-risk ones pass quickly.'
  why_not:
    A: A lower threshold catches more purchases, but AI tools can still be bought below it, and the trigger still has nothing
      to do with risk.
    B: CIO sign-off adds a gate, but approving on the CIO's judgment is not a risk review, and it creates a bottleneck for
      low-risk tools.
    D: Blocking card payments closes one buying route, but business units can still sign small contracts, which is what is
      happening.
