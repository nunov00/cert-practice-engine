stem: An insurer's procurement process skips risk review for software under 50,000. Business units now buy AI subscriptions
  through many small contracts, some processing claims data, and vendors often add AI to tools without saying so. Which change
  BEST addresses this?
options:
  A: Screen software whose vendor describes it as AI-based
  B: Screen software when it is added to the AI inventory
  C: Screen each purchase by its AI use and data, not value
  D: Screen software over 10,000 that processes claims data
answer: C
explanation:
  why_correct: 'The trigger must follow risk: how a tool uses AI and what data it handles. Asking about both at each purchase,
    whatever its value, catches the small claims-data subscriptions and the tools whose vendors do not label their AI.'
  why_not:
    A: Relying on the vendor's description misses the tools whose vendors add AI without saying so, which the stem says is
      common.
    B: The inventory records tools after they are bought, so screening there comes after the commitment and the data exposure.
    D: Adding a data condition helps, but a value threshold still lets claims-data subscriptions under 10,000 through.
