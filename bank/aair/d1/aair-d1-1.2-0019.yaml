id: aair-d1-1.2-0019
subdomain: '1.2'
difficulty: hard
stem: A bank's new product committee reviews AI only in new products. Last year, updates to card products added an AI
  spending-insights feature and let an existing model raise credit limits itself instead of suggesting them. Delivery
  teams called both maintenance releases. Card models retrain monthly. Which trigger for committee review should the
  risk practitioner recommend?
options:
  A: Any change to an AI model used in a live product
  B: A material change to the AI in an existing product
  C: Any new AI feature added to an existing product
  D: Any product release that the delivery team tags as AI
answer: B
explanation:
  why_correct: A materiality trigger catches both cases, a new AI feature and an existing model gaining authority to act
    on its own, while letting routine monthly retraining within approved limits go through normal model change control.
    It also does not depend on how delivery teams label their releases.
  why_not:
    A: This catches both updates but also every monthly retrain of every card model. The committee would be flooded with
      routine changes and lose focus on the ones that matter.
    C: This would have caught the spending-insights feature but not the credit limit change, which gave an existing model
      new authority without adding a feature.
    D: This relies on delivery teams to recognise AI changes, and they labelled both updates as maintenance. Neither would
      have been tagged.
