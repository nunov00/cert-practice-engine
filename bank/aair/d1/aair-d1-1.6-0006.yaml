id: aair-d1-1.6-0006
subdomain: '1.6'
difficulty: medium
stem: A water utility plans to use AI to handle most billing queries, which would remove many tasks now
  done by its call centre staff. The business case covers savings but says nothing about the staff affected.
  What should the risk practitioner recommend from an ethical standpoint?
options:
  A: Proceed as planned, since staffing is a matter for HR alone
  B: Delay the project until no job will be affected by the change
  C: Assess the impact on staff and plan consultation and reskilling
  D: Keep the project confidential from staff until it goes live
answer: C
explanation:
  why_correct: Responsible AI adoption considers its effects on workers as well as customers. Assessing
    the impact and planning consultation, redeployment or reskilling treats staff fairly and reduces risks
    such as loss of key skills, disputes and reputational harm.
  why_not:
    A: HR has a role, but the effect on staff is part of the ethical and risk assessment of the AI use
      itself.
    B: Waiting until no job is affected is unrealistic and ignores a legitimate business case. The aim
      is to manage the impact responsibly.
    D: Secrecy damages trust and may breach consultation duties. It increases rather than reduces the
      risk.
