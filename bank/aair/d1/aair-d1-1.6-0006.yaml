id: aair-d1-1.6-0006
subdomain: '1.6'
difficulty: medium
stem: A water utility plans to use AI to handle most billing queries, which would remove many tasks now
  done by its call centre staff. The business case covers savings but says nothing about the staff affected.
  What should the risk practitioner recommend from an ethical standpoint?
options:
  A: Add a reskilling and redeployment plan to the business case
  B: Phase the rollout so that job losses come through natural turnover
  C: Assess the effect on staff and consult them before approval
  D: Consult staff representatives once the rollout plan is final
answer: C
explanation:
  why_correct: Responsible AI adoption considers its effects on workers as well as customers. Assessing
    the impact and consulting staff before the decision lets the company plan redeployment or reskilling
    fairly, and reduces risks such as loss of key skills, disputes and reputational harm.
  why_not:
    A: Reskilling and redeployment are good measures, but planning them before assessing the impact or
      hearing from staff fixes the answer in advance.
    B: Phasing is a reasonable mitigation, but choosing it before assessing the impact and hearing from
      staff skips the analysis that should guide the choice.
    D: Consulting once the plan is final is too late for staff views to shape it, and it may breach consultation
      duties.
