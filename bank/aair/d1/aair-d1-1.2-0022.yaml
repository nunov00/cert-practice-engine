stem: A board has approved a strategy to automate claims decisions end to end within two years. The board's own risk
  appetite statement says no decision that affects a customer may be made without human review. The programme team plans
  to start by fully automating small claims. What should the risk practitioner do?
options:
  A: Ask the board to reconcile its strategy with its appetite statement
  B: Require human review of small claims and let the programme continue
  C: Let small claims go ahead, as the harm to each customer is minor
  D: Ask the chief risk officer to change the appetite to fit the strategy
answer: A
explanation:
  why_correct: The strategy and the appetite statement contradict each other, and both belong to the board. Only the board
    can decide whether to adjust its appetite, with conditions, or limit the strategy, so the conflict goes to it before
    the programme proceeds.
  why_not:
    B: Adding review keeps within appetite, but it quietly overrides the board's strategy without the board deciding.
    C: The appetite statement makes no exception for small claims, so this would breach it without the board's consent.
    D: The appetite statement is the board's, so the chief risk officer cannot change it to suit a programme.
