id: aair-d1-1.5-0023
subdomain: '1.5'
difficulty: hard
stem: A lender uses a vendor's credit model that returns only a score, and the vendor will not reveal how the model works,
  citing trade secrets. Consumer credit law in the lender's market requires telling declined applicants the main factors that
  actually drove their decision. What should the risk practitioner advise?
options:
  A: Explain declines with a simple model the lender fits to the vendor's scores
  B: Give declined applicants the main factors from the lender's credit policy
  C: Require the vendor to return the main reason codes with each score
  D: Have a credit officer review each decline and record the main reasons
answer: C
explanation:
  why_correct: The law asks for the factors that actually drove each decision, and only the vendor's model knows them. Reason
    codes returned with each score give the lender those factors per applicant while the vendor keeps the model itself confidential,
    so the lender can meet its duty without access to the model's internals.
  why_not:
    A: A surrogate model is a common explanation technique, but it only approximates the vendor's model, so its factors may
      not be the ones that actually drove a given decline.
    B: Policy-based reasons are easy to give, but they describe the lender's general criteria rather than what drove the model's
      score for this applicant.
    D: An officer review adds human judgement, but the officer sees only the score and cannot know which factors drove it,
      so the reasons recorded would be the officer's own.
