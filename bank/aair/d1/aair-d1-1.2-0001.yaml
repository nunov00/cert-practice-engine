id: aair-d1-1.2-0001
subdomain: '1.2'
difficulty: medium
stem: A regional bank has set up a separate AI risk register maintained by its data science group. The
  board now receives one report on enterprise risk and a separate one on AI risk, using different rating
  scales. What should the risk practitioner recommend?
options:
  A: Keep both registers but ask both teams to meet every quarter
  B: Bring AI risks into the enterprise register, taxonomy and rating scales
  C: Convert the enterprise register to the AI team's more detailed scales
  D: Transfer ownership of the AI register to the internal audit function
answer: B
explanation:
  why_correct: AI risk management works best when it is part of the existing enterprise risk process.
    Using one register, taxonomy and rating method lets the board compare AI risks with other risks against
    a single risk appetite and allocate resources consistently.
  why_not:
    A: Regular meetings may improve communication, but the board would still see two incompatible views
      of risk. The structural misalignment remains.
    C: Changing the whole enterprise process to suit one risk category reverses the logic of integration
      and would disrupt every other risk owner. AI should fit the enterprise framework, adapted where
      needed.
    D: Internal audit provides independent assurance and should not own or maintain a risk register. This
      would also harm its independence without fixing the inconsistency.
