id: aair-d1-1.2-0001
subdomain: '1.2'
difficulty: medium
stem: A regional bank's data science group maintains a separate AI risk register. The board receives one
  report on enterprise risk and another on AI risk, using different rating scales. Several AI risks also
  appear in the enterprise register under other names and owners. What should the risk practitioner recommend?
options:
  A: Keep the AI register but map its ratings to the enterprise scale
  B: Move AI risks into the enterprise register, using its taxonomy and scales
  C: Combine the two reports into one board pack with a common summary
  D: Have the second-line risk team take over the AI register from data science
answer: B
explanation:
  why_correct: AI risk management works best inside the existing enterprise risk process. One register,
    taxonomy and rating method removes the duplicates with conflicting owners and lets the board compare
    AI risks with other risks against a single risk appetite.
  why_not:
    A: Mapping makes the board's ratings comparable, but two registers remain, so the same risks are still
      recorded twice under different owners. It fixes the reporting, not the duplication.
    C: A combined pack improves presentation, but the board would still see two inconsistent views of
      risk underneath, with duplicated entries.
    D: Moving the register to the second line changes who maintains it, not the fact that it is separate.
      Two registers with different scales and duplicate entries would remain, and the board would still
      get two inconsistent views of risk.
