id: aair-d1-1.2-0012
subdomain: '1.2'
difficulty: easy
stem: At a pension fund, data scientists, lawyers and risk staff use words such as 'bias', 'validation'
  and 'explainability' to mean different things. Committee papers are often misread, and two teams recently
  reported the same model as both validated and not validated. What should the risk practitioner recommend?
options:
  A: Agree a shared AI glossary and use it in policies, papers and reports
  B: Add a definitions section, written by each author, to committee papers
  C: Set a validation standard defining when a model counts as validated
  D: Train committee members on core AI concepts and technical terms
answer: A
explanation:
  why_correct: A common vocabulary, agreed across functions and used in policies, assessments and reports,
    aligns how teams describe AI and its risks. Reports then mean the same thing to every reader, and
    decisions rest on a shared understanding.
  why_not:
    B: Author-written definitions make each paper clearer, but different authors would still define the
      same words differently. The inconsistency moves into the definitions.
    C: A validation standard settles one disputed term, which is worth doing, but 'bias' and 'explainability'
      would still mean different things to different teams.
    D: Training improves understanding, but it does not create agreed meanings. Teams could still use
      the words differently in their own work.
