id: aair-d1-1.4-0002
subdomain: '1.4'
difficulty: medium
stem: A risk practitioner at an insurer is drafting the company's first AI policy. A data scientist asks
  that it include the exact test thresholds models must pass before release. The thresholds will need
  updating as methods mature. Where should these thresholds BEST be set out?
options:
  A: In the AI policy, so that changes go through board approval
  B: In the risk appetite statement approved by the board
  C: In the validation team's internal work instructions
  D: In a model standard that the AI policy requires
answer: D
explanation:
  why_correct: A policy states principles, scope and responsibilities and changes rarely. Technical requirements
    that bind every model team and need regular updating belong in a supporting standard. Its owner can
    update it under the policy's authority without reopening the policy.
  why_not:
    A: Thresholds in the policy would be slow to update and would ask the board to approve technical detail
      it is not placed to judge.
    B: An appetite statement sets the level of risk the company will accept overall. It is not the place
      for model-level test criteria that change as methods mature.
    C: Work instructions describe how one team does its job. They do not bind the developers who must
      meet the thresholds, and they lack the standing of a standard under the policy.
