id: aair-d1-1.4-0002
subdomain: '1.4'
difficulty: easy
stem: A risk practitioner at an insurer is drafting the company's first AI policy. A data scientist asks
  that it include the exact test thresholds models must pass before release. Where should these thresholds
  BEST be set out?
options:
  A: In the AI policy itself, so the board approves them directly
  B: In each project's charter, agreed case by case with the sponsor
  C: In the staff handbook, so every employee can find them easily
  D: In a standard or procedure that supports the AI policy
answer: D
explanation:
  why_correct: A policy states principles, scope and responsibilities and changes rarely. Detailed technical
    requirements that need regular updating belong in supporting standards or procedures, which the right
    owners can maintain without reopening the policy.
  why_not:
    A: Putting technical thresholds in the policy makes it hard to update and asks the board to approve
      detail it is not placed to judge.
    B: Agreeing thresholds project by project leads to inconsistent requirements and invites pressure
      to lower them.
    C: The handbook is aimed at all staff. Model test thresholds concern specialists and need controlled
      maintenance.
