id: aair-d1-1.5-0006
subdomain: '1.5'
difficulty: medium
stem: An education technology company sells AI tutoring software in several countries. A new AI transparency
  rule in one market was flagged by the legal team's alert service, but nobody linked it to the products
  it affected until a customer asked. What should the risk practitioner recommend to prevent a repeat?
options:
  A: Route each alert to product managers for them to review
  B: Assign owners to assess AI rule changes against the AI inventory
  C: Require local counsel in each market to confirm compliance yearly
  D: Add regulatory change as a standing item at the risk committee
answer: B
explanation:
  why_correct: The alert arrived; the failure was that nobody owned assessing it against the products.
    A defined process with named owners who map each change to the systems in the AI inventory turns alerts
    into action on the affected products.
  why_not:
    A: Product managers know their products but not how to judge legal applicability, and nobody owns
      tracking each change to a decision across the full AI inventory.
    C: A yearly confirmation can leave a new rule unaddressed for months, and it does not fix the gap
      between alerts and products.
    D: Committee oversight helps, but a standing agenda item does not assign anyone to assess each change
      against the products it affects.
