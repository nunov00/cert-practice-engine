id: aair-d1-1.5-0006
subdomain: '1.5'
difficulty: medium
stem: An education technology company sells AI tutoring software in several countries. Its legal team
  learned of a new AI transparency rule in one market only after a customer asked about it. What should
  the risk practitioner recommend to prevent a repeat?
options:
  A: Ask each sales team to report legal changes they hear about
  B: Set up regulatory change tracking linked to the AI inventory
  C: Apply the rules of the strictest country to all products now
  D: Commission an external legal review of all products every year
answer: B
explanation:
  why_correct: A defined process for tracking legal developments in each market, with clear ownership
    and a link to the products and systems affected, lets the company spot new obligations early and act
    on them in time.
  why_not:
    A: Informal reports from sales staff are incomplete and depend on chance, which is how the gap occurred.
    C: Adopting today's strictest rules does not detect future changes and may impose needless obligations.
    D: A yearly review can miss changes for many months between reviews. Ongoing tracking is needed.
