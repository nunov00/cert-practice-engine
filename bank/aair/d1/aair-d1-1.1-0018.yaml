subdomain: '1.1'
difficulty: medium
stem: A retailer's draft AI strategy commits all its AI use to one provider's models for five years, in return for
  a large discount. AI capabilities are changing fast, and the board wants to be free to adopt better models as
  they appear. Which addition to the strategy is MOST important?
options:
  A: Contract terms giving notice and test time before each model change
  B: An abstraction layer and exit terms that allow a change of provider
  C: Contract terms that cap price rises across the five-year commitment
  D: Service levels with credits for outages affecting customer-facing uses
answer: B
explanation:
  why_correct: The board's aim is freedom to move to better models, and a five-year single-provider deal works against
    it. Building systems so the model behind them can be swapped, and agreeing exit terms in the contract, keeps
    the discount while keeping that freedom real.
  why_not:
    A: Change notice and test time protect against disruption from the provider's own updates. That matters, but
      it keeps the retailer tied to the provider rather than free to leave.
    C: A price cap limits one effect of lock-in, cost, but does not let the retailer adopt a better model from another
      provider.
    D: Service levels protect availability, but they do nothing for the board's aim of being able to change models.
