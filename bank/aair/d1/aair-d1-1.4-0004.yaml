id: aair-d1-1.4-0004
subdomain: '1.4'
difficulty: medium
stem: A product team at an online lender wants to launch a new AI feature next week, but it has not completed
  the bias testing that the AI policy requires. The sponsor says the deadline cannot move. What should
  the risk practitioner advise?
options:
  A: Let the launch go ahead and complete the testing soon afterwards
  B: Rewrite the policy so that bias testing is optional for new features
  C: Raise a formal policy exception for the risk owner to decide on
  D: Ask the team to record the gap in the project's issues log
answer: C
explanation:
  why_correct: Policies need a controlled way to handle departures. A formal exception makes the gap visible,
    requires the accountable owner to accept or reject the risk at the right level, and sets compensating
    controls and a deadline. If the risk is not accepted, the launch waits.
  why_not:
    A: Launching without an approved exception is a silent policy breach. Nobody with authority has weighed
      the risk of untested bias to customers.
    B: Changing the policy to suit one deadline weakens the standard for everyone and avoids, rather than
      manages, the risk.
    D: An issues log records the gap but involves nobody with authority to accept the risk. The launch
      would still breach the policy.
