id: aair-d1-1.4-0004
subdomain: '1.4'
difficulty: medium
stem: A product team at an online lender wants to launch a new AI feature next week, but it has not completed
  the bias testing that the AI policy requires. The sponsor says the deadline cannot move. What should
  the risk practitioner advise?
options:
  A: Ask the AI governance committee to amend the release requirement
  B: Approve a limited launch to a small segment while testing finishes
  C: Raise a formal policy exception for the accountable risk owner
  D: Record the gap in the risk register with a remediation date
answer: C
explanation:
  why_correct: Policies need a controlled way to handle departures. A formal exception makes the gap visible
    and puts the decision with the owner who is accountable for the risk. That owner can accept it with
    compensating controls and a deadline, or refuse it so that the launch waits.
  why_not:
    A: Changing a requirement to suit one project's deadline weakens the standard for everyone. The issue
      is a single departure, which the exception process exists to handle.
    B: A smaller launch still exposes real customers to untested bias, and the practitioner has no authority
      to approve a breach of policy. That decision belongs to the risk owner.
    D: A register entry records the risk but does not get anyone with authority to accept it. The launch
      would still breach the policy.
