stem: An insurer redesigned its supplier payment process around an AI tool that holds suspicious invoices. To keep work
  flowing, the clerks who enter invoices were also given the right to release held invoices. Last month a clerk released
  a held invoice from a fake supplier. What does this MOST likely show?
options:
  A: The tool's threshold for holding invoices is set too low
  B: The redesign removed a segregation of duties
  C: The clerks need training on fake supplier schemes
  D: The tool needs retraining on fake supplier invoices
answer: B
explanation:
  why_correct: The tool did its job and held the invoice. The redesigned process let the person who entered an invoice
    also release it, so one person could override the control, which is the gap a segregation of duties closes.
  why_not:
    A: A lower threshold would hold more invoices, but this one was already held. The release was the failure.
    C: Training might help, but a clerk who enters and releases the same invoice can bypass the control on purpose, which
      training does not prevent.
    D: Retraining improves detection, but the tool detected this invoice. The process let the hold be overridden.
