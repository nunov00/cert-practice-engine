subdomain: '1.6'
difficulty: medium
stem: A media technology company is preparing to launch a tool that clones a person's voice from a short
  recording, aimed at podcasters who want to edit their own audio. Testers note that anyone could upload
  a recording of someone else. What should the risk practitioner recommend before launch?
options:
  A: Add terms of service that forbid cloning voices without consent
  B: Build in a check that the voice belongs to the account holder
  C: Watermark generated audio so that cloned speech can be traced
  D: Set up a reporting channel for people whose voices are misused
answer: B
explanation:
  why_correct: The testers found that anyone could clone someone else's voice. A built-in check that the
    voice belongs to the account holder prevents that misuse at the source, before any harm, and fits
    the intended use by podcasters editing their own audio.
  why_not:
    A: Terms set expectations, but people intent on fraud or harassment will ignore them.
    C: Watermarks help detect and trace fakes after they spread, but they do not stop someone cloning
      another person's voice.
    D: A reporting channel is reactive. Harm such as fraud has already happened by the time a report arrives.
