difficulty: medium
stem: At a national retailer, the chief information officer, chief data officer and chief risk officer
  each manage parts of AI. When a cross-cutting issue arose, staff use of public generative AI tools,
  each assumed one of the others would deal with it, and nothing was done for months. What should the
  risk practitioner recommend?
options:
  A: Give one senior executive a mandate for enterprise-wide AI risk
  B: Form a cross-functional AI working group drawn from the three teams
  C: Issue a policy on staff use of public generative AI tools
  D: Document each executive's AI duties in their role descriptions
answer: A
explanation:
  why_correct: Shared, unclear responsibility let a significant risk go unmanaged. Giving one senior executive
    accountability for enterprise-wide AI risk, with a mandate to work with the other functions, closes
    the gap for future cross-cutting issues while keeping their specialist roles.
  why_not:
    B: A working group improves coordination, but without one accountable executive, issues that span
      all three can still go unresolved.
    C: A policy addresses this one issue, and is needed, but the next cross-cutting issue would fall between
      the three executives in the same way.
    D: Clearer role descriptions help, but cross-cutting issues by nature fall outside any single description.
      Someone still needs the overall mandate.
