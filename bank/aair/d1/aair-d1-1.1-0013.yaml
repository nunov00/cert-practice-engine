id: aair-d1-1.1-0013
subdomain: '1.1'
difficulty: hard
stem: An insurer wants a large language model to summarise medical reports attached to claims. Its regulator
  and customer contracts require this data to stay within the insurer's own environment. The shortlisted
  cloud provider offers a dedicated instance in the same country. An open-weight model could run on the
  insurer's own servers. What should the risk practitioner advise?
options:
  A: Use the cloud service under a contract banning storage and training on the data
  B: Use the cloud service with the reports de-identified before they are sent
  C: Use the provider's dedicated, single-tenant instance in the same country
  D: Use the open-weight model on its own servers and take on its upkeep
answer: D
explanation:
  why_correct: Only the self-hosted model keeps the data in the insurer's own environment, which is the
    binding requirement. Choosing it moves duties a provider would carry, such as securing the infrastructure,
    evaluating the model and applying updates, onto the insurer, so the advice must include taking them
    on. That is the best balance of compliance and managed risk.
  why_not:
    A: Contract terms limit what the provider may do with the data, but the data still leaves the insurer's
      environment, which the requirement forbids.
    B: Medical reports hold many indirect identifiers and are hard to de-identify reliably. The data would
      still leave the insurer's environment, so the requirement is still breached.
    C: A dedicated instance improves isolation and keeps data in the country, but it runs in the provider's
      environment, not the insurer's. Data residency is not the same as the insurer's own environment.
