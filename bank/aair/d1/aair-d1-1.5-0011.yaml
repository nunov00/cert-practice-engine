id: aair-d1-1.5-0011
subdomain: '1.5'
difficulty: medium
stem: A recruitment software company plans to advertise that its AI 'removes all bias from hiring'. Its
  own testing shows smaller but still measurable differences in outcomes between groups of candidates.
  What should the risk practitioner advise?
options:
  A: Revise the claim so that test evidence supports it, with legal review
  B: Keep the claim, as the testing shows a clear reduction in bias
  C: Keep the claim and add more fairness tests over the coming year
  D: Publish the full test results alongside the original advertising claim
answer: A
explanation:
  why_correct: Claims about what an AI product does are subject to consumer protection and advertising
    law. An absolute claim that the company's own testing contradicts could be misleading, exposing it
    to enforcement and to claims from customers who relied on it. The wording should match the evidence
    and be checked by legal counsel.
  why_not:
    B: A reduction does not support an absolute claim, so the claim would still be misleading.
    C: Future tests cannot justify a claim that current evidence contradicts.
    D: Publishing results that contradict the headline does not cure a misleading claim and may draw more
      attention to it.
