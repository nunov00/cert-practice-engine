id: aair-d1-1.5-0011
subdomain: '1.5'
difficulty: medium
stem: A recruitment software company plans to advertise that its AI 'removes all bias from hiring'. Its
  own testing shows smaller but still measurable differences in outcomes between groups of candidates.
  What should the risk practitioner advise?
options:
  A: Revise the claim to match the test evidence, with legal review
  B: Commission an independent bias audit before deciding on the claim
  C: Retrain the model to close the remaining gaps before launch
  D: Qualify the claim as based on the company's internal testing
answer: A
explanation:
  why_correct: Claims about what an AI product does fall under consumer protection and advertising law.
    An absolute claim that the company's own testing contradicts could mislead. The wording should match
    the evidence and be checked by legal counsel.
  why_not:
    B: The company's own testing already contradicts an absolute claim. An audit would delay the decision
      without changing that answer.
    C: Narrowing the gaps is worthwhile, but no testing can show that all bias has been removed, so the
      absolute claim would still mislead.
    D: A qualifier does not cure a headline that the evidence contradicts. The main message would still
      promise something untrue.
