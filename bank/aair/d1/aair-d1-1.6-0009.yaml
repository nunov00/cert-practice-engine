difficulty: medium
stem: A bank has made a public commitment to cut its carbon emissions. Its AI team now plans to train
  several very large models from scratch for tasks where smaller existing models perform almost as well.
  Project assessments cover accuracy, cost and fairness only. What should the risk practitioner recommend?
options:
  A: Add energy use and emissions to each project's assessment criteria
  B: Buy certified carbon offsets for the energy the training runs will use
  C: Run the training in a data centre powered by renewable energy
  D: Report AI energy use in the bank's annual sustainability report
answer: A
explanation:
  why_correct: Training very large models uses a lot of energy, and here smaller models perform almost
    as well. Adding energy and emissions to each assessment lets the bank weigh them against small gains
    and choose options consistent with its public commitment.
  why_not:
    B: Offsets do not avoid the emissions and do not question whether such large models are needed.
    C: Cleaner power reduces the impact, but the energy and hardware are still used for little gain, and
      the choice of model size is left unexamined.
    D: Reporting adds transparency after the fact but does not change project decisions.
