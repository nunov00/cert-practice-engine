subdomain: '1.6'
difficulty: medium
stem: A bank has made a public commitment to cut its carbon emissions. Its AI team now plans to train
  several very large models from scratch for tasks where smaller existing models perform almost as well.
  Project assessments cover accuracy, cost and fairness only. What should the risk practitioner recommend?
options:
  A: Add energy use and emissions to the assessment of each project
  B: Approve the plan, as AI is outside the scope of the commitment
  C: Ask the team to buy carbon offsets for the energy training uses
  D: Postpone all AI model training until the bank meets its targets
answer: A
explanation:
  why_correct: Training very large models uses a lot of energy. Adding energy and emissions to each assessment
    lets the bank weigh them against small performance gains and choose options consistent with its public
    commitment, reducing both environmental impact and reputational risk.
  why_not:
    B: Emissions from AI count toward the bank's footprint like any other activity; leaving them out could
      make the commitment misleading.
    C: Offsets do not avoid the emissions and do not address whether such large models are needed at all.
    D: A blanket postponement is disproportionate and blocks low-impact AI uses as well.
