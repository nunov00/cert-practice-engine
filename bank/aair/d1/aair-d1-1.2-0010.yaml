id: aair-d1-1.2-0010
subdomain: '1.2'
difficulty: medium
stem: A manufacturing group runs all AI work through a central centre of excellence. Its backlog is now
  nine months long, and plant teams have started buying their own AI tools without telling it. The group
  wants to keep consistent risk standards while delivering faster. Which operating model BEST fits these
  needs?
options:
  A: Keep central delivery and triage the backlog by business value and risk
  B: Set standards centrally and let plants deliver under central oversight
  C: Let plants deliver their own AI and register each tool centrally
  D: Approve a list of AI tools that plants may buy without central review
answer: B
explanation:
  why_correct: A federated, hub-and-spoke model keeps one set of standards, tools and oversight at the
    centre while letting plant teams deliver within them. It removes the bottleneck that is driving unmanaged
    buying, yet keeps consistency and visibility, so it meets both stated needs.
  why_not:
    A: Triage puts the most valuable work first, but a single central queue stays a bottleneck, so delivery
      is not faster overall and plants would likely keep buying around it.
    C: Registration gives visibility, but without central standards each plant would manage risk in its
      own way, losing the consistency the group wants.
    D: An approved list vets products, but not how plants use them. The same tool can carry very different
      risk in different uses, so standards would still be inconsistent.
