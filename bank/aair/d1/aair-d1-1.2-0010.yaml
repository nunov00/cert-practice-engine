subdomain: '1.2'
difficulty: hard
stem: A manufacturing group runs all AI work through a central centre of excellence. Its backlog is now
  nine months long, and plant teams have started buying their own AI tools without telling it. The group
  wants to keep consistent risk standards while delivering faster. Which operating model BEST fits these
  needs?
options:
  A: Keep the central model and add staff to clear the backlog quickly
  B: Set standards centrally and let plants deliver under central oversight
  C: Let each plant choose its own approach and report AI use once a year
  D: Ban AI purchases by plants until the central backlog has been cleared
answer: B
explanation:
  why_correct: A federated, hub-and-spoke model keeps one set of standards, tools and oversight at the
    centre while letting business teams deliver within them. It removes the bottleneck that is driving
    unmanaged buying, yet keeps consistency and visibility, so it meets both stated needs.
  why_not:
    A: Extra staff may shrink the backlog for a while, but a single central queue stays a bottleneck as
      demand grows, and unmanaged buying would likely continue.
    C: Full decentralisation gives speed but loses the consistent standards the group wants, and yearly
      reporting is too late to catch problems.
    D: A ban adds delay to an already slow model and tends to push more AI use out of sight rather than
      less.
