id: aair-d1-1.6-0007
subdomain: '1.6'
difficulty: medium
stem: A retail chain proposes using cameras with AI emotion analysis to score how engaged its shop staff
  appear during shifts, and to use the scores in performance reviews. What should the risk practitioner
  advise?
options:
  A: Approve it if staff are told that the cameras are being installed
  B: Challenge whether the method is valid and the use proportionate
  C: Approve it once the vendor confirms high accuracy in its testing
  D: Limit the scores to staff who have had poor reviews in the past
answer: B
explanation:
  why_correct: Inferring inner feelings from facial expressions has a weak scientific basis, and using
    such scores in performance reviews is intrusive and could lead to unfair treatment. The practitioner
    should question both the validity and the proportionality of the use before it goes any further.
  why_not:
    A: Notice is necessary but not sufficient. Telling staff does not make an unreliable and intrusive
      measure fair.
    C: Vendor accuracy claims may not hold for real staff in real conditions, and accuracy does not address
      the intrusion or the doubtful link between expressions and engagement.
    D: Targeting staff with poor past reviews would compound possible unfairness and still rests on an
      unreliable measure.
