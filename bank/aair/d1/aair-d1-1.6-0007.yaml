id: aair-d1-1.6-0007
subdomain: '1.6'
difficulty: hard
stem: A retail chain proposes using cameras with AI emotion analysis to score how engaged its shop staff
  appear during shifts, and to use the scores in performance reviews. What should the risk practitioner
  advise?
options:
  A: Require staff consent and a clear notice before cameras go live
  B: Challenge the method's validity and the use's proportionality
  C: Pilot the tool and check its scores against manager ratings
  D: Use the scores only for coaching, not in formal performance reviews
answer: B
explanation:
  why_correct: Inferring inner feelings from facial expressions has a weak scientific basis, and scoring
    staff this way is intrusive. The practitioner should question both whether the method measures anything
    real and whether the use is proportionate, before it goes further in any form.
  why_not:
    A: Notice is needed, but consent from employees is rarely freely given, and neither makes an unreliable
      and intrusive measure fair.
    C: Agreement with manager ratings would not show that the tool reads emotions, and a pilot already
      subjects staff to the intrusion.
    D: Lower stakes reduce the harm, but the measure is still unreliable and intrusive, so coaching based
      on it may still mislead.
