id: aair-d1-1.2-0008
subdomain: '1.2'
difficulty: medium
stem: A retail bank's data science team is measured on the number of models it puts into production each
  year. Several deployed models are barely used, and business units say they never asked for them. What
  should the risk practitioner recommend?
options:
  A: Tie each AI initiative to a business objective and a named sponsor
  B: Measure the team on model accuracy rather than the number deployed
  C: Have the risk function review the usage of each deployed model
  D: Retire deployed models whose usage falls below an agreed level
answer: A
explanation:
  why_correct: The root problem is that AI work is not driven by business needs. Requiring each initiative
    to serve a defined objective, with a business sponsor accountable for its benefits and risks, directs
    effort to useful work and avoids unowned, low-value models that still carry risk.
  why_not:
    B: Accuracy is a better measure than volume, but it is still technical. An accurate model nobody asked
      for still adds risk without value.
    C: Usage reviews find unused models after they are built. They do not change how work is chosen, and
      judging business value is not the risk function's role.
    D: Retiring unused models is sensible case by case, but it deals with models already built and does
      not stop new ones being built without demand.
