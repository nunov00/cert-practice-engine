id: aair-d1-1.5-0003
subdomain: '1.5'
difficulty: easy
stem: A consumer lender wants to approve or reject small loan applications automatically, with no staff
  involvement. Data protection law in its market gives people rights in relation to decisions with significant
  effects made solely by automated means. Which measure BEST addresses this legal consideration?
options:
  A: Publish the model's accuracy statistics on the lender's website
  B: Ask applicants to accept automated decisions in the loan terms
  C: Let rejected applicants ask for a person to review the decision
  D: Keep all application data for longer in case of later disputes
answer: C
explanation:
  why_correct: Laws of this kind typically expect safeguards when solely automated decisions have significant
    effects, including the right to human intervention and to contest the decision. Offering a route to
    human review addresses this directly.
  why_not:
    A: Accuracy figures do not let an individual challenge their own decision or obtain human involvement.
    B: Consent hidden in loan terms may not be valid, and even where consent applies, safeguards such
      as human review are usually still expected.
    D: Keeping data longer may itself breach storage limits, and it does nothing for the individual's
      rights about the decision.
