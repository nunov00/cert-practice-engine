id: aair-d1-1.5-0003
subdomain: '1.5'
difficulty: medium
stem: A consumer lender wants to approve or reject small loan applications automatically, with no staff
  involvement. Data protection law in its market gives people rights in relation to decisions with significant
  effects made solely by automated means. Which measure BEST addresses this legal consideration?
options:
  A: Give each rejected applicant the main reasons for the decision
  B: Obtain applicants' explicit consent to automated decision-making
  C: Let applicants obtain human review of the decision and contest it
  D: Have staff review a sample of automated decisions each month
answer: C
explanation:
  why_correct: Laws of this kind expect safeguards when solely automated decisions have significant effects,
    chiefly the right to obtain human intervention and to contest the decision. A route to human review
    gives each person exactly that.
  why_not:
    A: Reasons support transparency and help people decide whether to challenge, but on their own they
      leave the decision solely automated with no human to turn to.
    B: Consent may give a basis for automated decisions, but safeguards such as human intervention are
      usually still expected alongside it.
    D: Sample reviews are good quality assurance, but they do not let an individual applicant obtain a
      human review of their own decision.
