subdomain: '1.2'
difficulty: hard
stem: An insurer's complaints process refunds each customer whose complaint about a premium is upheld. Last quarter a pricing
  model fault overcharged a few thousand renewing customers by small amounts; 60 complained and were refunded, and the model
  team fixed the fault within a week. The model logs which version priced each policy. Which change BEST aligns these processes?
options:
  A: Send complaints traced to a model fault to the model owner for a root-cause fix
  B: Tag each complaint with the model involved and report the counts to its owner
  C: Have the model owner review a monthly sample of complaints about premiums
  D: Review every policy a faulty version priced once a complaint confirms the fault
answer: D
explanation:
  why_correct: The complaints process repairs harm only for people who complain, and with small overcharges most affected
    customers will never notice. Once a complaint confirms a model fault, the version logs identify each policy the faulty
    version priced, so the process should move from refunding the complainant to reviewing and refunding everyone affected.
    That ties complaint handling to the model's records instead of leaving remediation to whoever speaks up.
  why_not:
    A: Routing faults to the model owner gets the model fixed, which here already happened within a week. The customers who
      were overcharged and did not complain are still out of pocket.
    B: Tagging complaints by model gives the owner useful monitoring data, but it still counts only people who complained,
      so most of the overcharged customers stay unrefunded.
    C: A monthly sample helps the owner spot pricing problems, but it also works only from complaints and does nothing for
      affected customers who never complained.
