id: aair-d1-1.5-0001
subdomain: '1.5'
difficulty: medium
stem: A manufacturer that sells into several markets learns that a new regional AI regulation, which places
  obligations on systems according to their risk category, will apply to some of its products and internal
  tools. What should the risk practitioner do FIRST?
options:
  A: Run a gap analysis of current controls against the regulation
  B: Ask legal counsel to draft an AI compliance policy for the region
  C: Inventory the AI systems in scope and classify each by category
  D: Start conformity assessments on the products sold in the region
answer: C
explanation:
  why_correct: Obligations under a risk-based regulation depend on how each system is classified. The
    organisation cannot plan compliance until it knows which systems it has and which category each falls
    into. The inventory and classification then drive the gap analysis and any assessments.
  why_not:
    A: A gap analysis needs to know which obligations apply to which system. Without classification there
      is no baseline to measure gaps against.
    B: A policy is useful later, but drafting it before knowing which systems are in scope risks rules
      that do not fit the actual obligations.
    D: Only some categories need conformity assessments. Starting them before classification may waste
      effort on products that do not need them and miss internal tools that do.
