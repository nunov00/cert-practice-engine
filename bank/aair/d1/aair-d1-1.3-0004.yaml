subdomain: '1.3'
difficulty: hard
stem: An online retailer's AI review committee approves models before deployment. It meets quarterly,
  while models are released weekly. Its minutes record only approve or reject. The head of data science
  chairs it and presents her own team's models. No other member has technical expertise, and business
  units using the models do not attend. What is the MAIN oversight concern?
options:
  A: Quarterly meetings lag behind the weekly release cycle
  B: Minutes do not record the reasons for each decision
  C: Approvals lack challenge independent of the builders
  D: Business units that use the models are not on the committee
answer: C
explanation:
  why_correct: Oversight depends on challenge from people who are independent of the work being approved.
    Here the builder in effect approves her own team's models, and nobody else can question them on technical
    grounds. Fixing the other weaknesses would still leave a review that offers little real challenge.
  why_not:
    A: The timing gap is a real weakness, but more frequent meetings would only let the builders approve
      their own work faster.
    B: Recording reasons helps evidence decisions, but documenting a review that lacks independence does
      not make it effective.
    D: Business input matters for judging use and impact, but adding users would not supply the independent
      technical challenge the committee lacks.
