id: aair-d1-1.1-0010
subdomain: '1.1'
difficulty: medium
stem: A supermarket chain's model shows that customers who use its mobile app spend 30% more than those
  who do not. The marketing director proposes a strategy of paying every customer a bonus to install the
  app, expecting their spending to rise by a similar amount. What should the risk practitioner point out?
options:
  A: A link between app use and spending does not show the app causes it
  B: The model should be validated on a holdout sample before it is used
  C: The bonus cost should be weighed against the forecast rise in spending
  D: The data may under-represent customers who shop only in stores
answer: A
explanation:
  why_correct: Predictive models find patterns in data; they do not show cause and effect. Customers who
    already spend more may simply be more likely to install the app. The strategy assumes a causal effect
    the model cannot support, so a controlled trial is needed to show whether the bonus actually changes
    spending.
  why_not:
    B: Holdout validation checks that the pattern is stable, and it would likely confirm it. A confirmed
      correlation is still not evidence that paying people to install the app will raise their spending.
    C: A cost-benefit check is sensible, but it uses the forecast rise as if it were real. The flaw is
      in that forecast's assumption, not in the arithmetic.
    D: Representativeness matters for any model, but app users and non-users are both in the data. Better
      coverage would not turn a correlation into a cause.
