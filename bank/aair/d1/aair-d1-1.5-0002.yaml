id: aair-d1-1.5-0002
subdomain: '1.5'
difficulty: hard
stem: A subscription service receives a valid request from a customer to erase their personal data. The
  customer's records were included, lawfully, in data used to train a recommendation model last year.
  What should the risk practitioner advise?
options:
  A: Erase the records and assess whether the model retains their data
  B: Erase the records and add the customer to a suppression list
  C: Erase the records and retrain the model without them straight away
  D: Erase the records and document that model weights are out of scope
answer: A
explanation:
  why_correct: Erasure clearly applies to the stored records. Whether the trained model also holds the
    person's data, for example through memorisation, is a technical and legal question. Assessing it with
    legal and data science decides whether retraining or other measures are needed, rather than assuming
    either answer.
  why_not:
    B: A suppression list stops the data being collected again, which is good practice, but it does not
      address whether the trained model still holds the customer's data.
    C: Retraining for each request may be costly and may not be what the law requires. The decision should
      follow an assessment, not come before it.
    D: Some models can memorise and reproduce training examples, so declaring weights out of scope is
      an untested assumption. It closes the matter without the assessment the risk needs.
