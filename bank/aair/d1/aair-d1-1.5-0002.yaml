id: aair-d1-1.5-0002
subdomain: '1.5'
difficulty: hard
stem: A subscription service receives a valid request from a customer to erase their personal data. The
  customer's records were included, lawfully, in data used to train a recommendation model last year.
  What should the risk practitioner advise?
options:
  A: Erase the source records and assess with legal and data science whether the model must change
  B: Refuse the request because the data was used lawfully at the time of training
  C: Retrain the model straight away without the customer's records
  D: Delete the database records only, since model weights never contain personal data
answer: A
explanation:
  why_correct: Erasure clearly applies to the stored records. Whether the trained model also holds the
    person's data, for example through memorisation, is a technical and legal question that needs assessment.
    The outcome decides whether retraining or other measures are needed, rather than assuming either answer.
  why_not:
    B: Lawful collection and use in the past does not cancel a valid erasure right now. Refusing exposes
      the organisation to regulatory and reputational harm.
    C: Retraining for each request may be unnecessary and costly, and may not be what the law requires.
      The decision should follow an assessment, not precede it.
    D: Some models can memorise and reproduce training examples, so the assumption that weights never
      hold personal data is unsafe. It closes the matter without the assessment the risk requires.
