id: aair-d1-1.5-0014
subdomain: '1.5'
difficulty: hard
stem: An employer uses an AI tool that scores recorded video interviews on speech patterns and facial
  movement. A candidate with a speech impairment asks to be assessed in another way. Equality law in the
  employer's market requires reasonable adjustments for disabled applicants. What should the risk practitioner
  advise?
options:
  A: Score with the tool and have a panel take the impairment into account
  B: Ask the vendor to adjust the weight the tool gives to speech features
  C: Extend the time limit for the candidate's recorded interview
  D: Offer an alternative assessment of equal weight in the decision
answer: D
explanation:
  why_correct: The law requires a reasonable adjustment, and a tool that scores speech and facial movement
    is likely to disadvantage this candidate. An alternative assessment with equal standing removes that
    disadvantage now. The employer should also review the tool's wider use, as others may be affected
    without asking.
  why_not:
    A: A panel adjusting a score that rests on the impaired features cannot know how much to correct.
      The disadvantage is built into the measure.
    B: Changing the tool might help over time, but it does not meet this candidate's request now.
    C: Extra time is a common adjustment, but the tool would still score the candidate on speech patterns
      the impairment affects.
