stem: A bank's language model assistant drafts summaries of loan applicants' files for credit officers, who make the decisions.
  Files include names, addresses, languages spoken and community memberships. The bank wants to know whether the summaries
  describe similar applicants differently by ethnicity. Which test BEST answers this?
options:
  A: Compare approval rates by ethnic group before and after the assistant's launch
  B: Measure how often summaries mention ethnicity or nationality, for each group
  C: Run paired files that differ only in identity cues and compare the summaries
  D: Have credit officers rate a random sample of summaries for tone and accuracy
answer: C
explanation:
  why_correct: 'Paired files that are identical except for identity cues isolate the assistant''s own treatment of ethnicity:
    any systematic difference in tone, emphasis or content can come only from those cues.'
  why_not:
    A: Approval rates reflect officers' decisions and many other factors, and a before-and-after shift cannot separate the
      summaries' effect from changes in applicants or lending policy.
    B: Counting explicit mentions misses the more likely bias, a difference in tone or emphasis for similar applicants, which
      needs no mention of ethnicity at all.
    D: Officers rating summaries one at a time cannot see how a similar applicant with different identity cues would have
      been described, so subtle differences go unnoticed.
