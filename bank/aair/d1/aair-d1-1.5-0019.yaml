stem: A media start-up scrapes public websites to train a text model. Copyright law in its market allows text and data
  mining of lawfully accessible content unless the rights holder has reserved those rights in a machine-readable way.
  Which control BEST addresses this legal consideration?
options:
  A: Honour machine-readable opt-outs when crawling, and keep records
  B: Collect only from websites that show no copyright notice
  C: Remove scraped text that later appears word for word in outputs
  D: Rely on the fair use defence if a rights holder complains
answer: A
explanation:
  why_correct: The exception holds only where rights have not been reserved. Checking for and honouring machine-readable
    reservations at collection time, and recording what was checked, keeps the crawl within the exception and provides
    evidence if challenged.
  why_not:
    B: A copyright notice is not the legal test, as content is protected without one, and the reservation that matters is
      the machine-readable one.
    C: Filtering outputs deals with reproduction later, but the collection itself may already have been unlawful.
    D: The stem's law sets a specific exception with an opt-out, and relying on a defence after a complaint leaves the
      start-up exposed.
