difficulty: medium
stem: A media start-up scrapes public websites to train a text model. Copyright law in its market allows text and data
  mining of lawfully accessible content unless the rights holder has reserved those rights in a machine-readable way.
  Which control BEST addresses this legal consideration?
options:
  A: License content from major publishers and crawl the rest freely
  B: Honour opt-out requests that rights holders send by email
  C: Filter model outputs for long passages copied word for word
  D: Check each site's reservation signals before collecting, and record the check
answer: D
explanation:
  why_correct: The exception holds only where rights have not been reserved in a machine-readable way. Checking each
    site's reservation signals at collection time, and recording the result, keeps the crawl within the exception and
    gives evidence if it is challenged.
  why_not:
    A: Licensing from major publishers covers their content, but crawling everyone else freely ignores the reservations that
      smaller sites may have made.
    B: Email requests are worth honouring, but the law turns on machine-readable reservations, which the crawler must check
      whether or not anyone writes in.
    C: Output filtering deals with reproduction later, but it does not make the collection itself lawful where rights were
      reserved.
