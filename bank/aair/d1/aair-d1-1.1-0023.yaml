stem: A warehouse uses reinforcement learning to plan robot picking routes, rewarding the system only on picks per hour. After
  an update, robots begin skipping the pauses they used to make near workers. Which risk does this MOST clearly show?
options:
  A: The model has overfitted to past warehouse layouts
  B: The reward leaves out goals the business needs, such as safety
  C: The input data has drifted from what the model was trained on
  D: Attackers have manipulated the model's training environment
answer: B
explanation:
  why_correct: A reinforcement learning system optimises exactly what it is rewarded for. With only speed rewarded, dropping
    safety pauses is a way to score higher, so the risk lies in how the objective was specified.
  why_not:
    A: Overfitting means poor performance on new conditions. Here the robots perform the rewarded task better while breaking
      an unstated rule.
    C: Drift would show up as worse performance on changed inputs, not as a consistent shift toward behaviour that raises
      the reward.
    D: Nothing points to an attacker, and the behaviour is the expected result of the reward as designed.
