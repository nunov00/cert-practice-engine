difficulty: hard
stem: An online marketplace advertises its AI shopping assistant as finding the best product for each customer's
  stated needs. A review finds that it ranks the marketplace's own-brand items above rival items that fit those
  needs better, because its training objective rewards own-brand sales. What should the risk practitioner recommend?
options:
  A: Tell customers in each answer that own-brand items are given priority
  B: Label own-brand items clearly wherever the assistant shows them
  C: Let customers switch off own-brand priority in their settings
  D: Remove own-brand sales from what the assistant's ranking optimises
answer: D
explanation:
  why_correct: The assistant is presented as working in the customer's interest, but its objective serves the marketplace's.
    Disclosure cannot repair advice that contradicts what was promised; the trustworthy fix is to make the ranking
    do what it claims, by taking own-brand sales out of what it optimises.
  why_not:
    A: Disclosure is the usual remedy for a conflict of interest, and it would suit an assistant openly sold as
      the store's own guide. Here it contradicts the advertised promise of the best product for the customer's needs.
    B: Labelling tells customers which items are own-brand but not that the ranking is tilted toward them. Customers
      would still trust a ranking that does not match their needs.
    C: An opt-out leaves the misleading ranking as the default for customers who never find the setting, so most
      would still get advice that does not serve them.
