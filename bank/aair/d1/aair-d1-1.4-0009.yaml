id: aair-d1-1.4-0009
subdomain: '1.4'
difficulty: easy
stem: A water utility's AI policy states that AI must be 'fair, transparent and safe'. A year later, project
  teams interpret these words in very different ways, and auditors cannot tell whether any project has
  complied. What should the risk practitioner recommend?
options:
  A: Publish guidance with worked examples of each principle in practice
  B: Train project teams on what each principle means for their work
  C: Require each project to self-attest compliance with the principles
  D: Set specific, testable requirements for each principle in a standard
answer: D
explanation:
  why_correct: Principles alone are too broad to act on or audit. Requirements that say what must be tested,
    documented and approved, and by whom, give teams clear direction and give auditors criteria for judging
    compliance.
  why_not:
    A: Worked examples help teams interpret the principles, but guidance does not bind them. Auditors
      would still have no criteria to test against.
    B: Training spreads a shared understanding but does not create checkable requirements. Auditors would
      still be unable to judge compliance.
    C: An attestation records that a team believes it complied. Without defined requirements, neither
      the team nor the auditor can show what compliance means.
