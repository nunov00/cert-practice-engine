subdomain: '1.5'
difficulty: medium
stem: An education app company plans to add AI-driven personalised learning paths to a product used by
  children aged 8 to 12. The feature would build a profile of each child's learning behaviour. Its compliance
  work so far has followed the rules for adult users. What should the risk practitioner recommend?
options:
  A: Treat the feature as low risk, as it is meant to benefit the children
  B: Rely on schools to obtain any consent needed from parents
  C: Identify the added legal protections that apply to children's data
  D: Limit the profiling to children whose parents have paid for it
answer: C
explanation:
  why_correct: Many data protection and consumer laws give children extra protection, such as limits on
    profiling, stricter consent rules or duties of age-appropriate design. The company must first establish
    which apply in its markets and design the feature to meet them; rules written for adults are not enough.
  why_not:
    A: Good intentions do not remove legal duties, and profiling children can be restricted whatever its
      purpose.
    B: Schools may have a role, but the company remains responsible for its own legal basis and design
      duties and cannot assume schools have handled them.
    D: Whether parents have paid has no bearing on whether processing children's data is lawful.
