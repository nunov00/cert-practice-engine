id: aair-d1-1.5-0012
subdomain: '1.5'
difficulty: medium
stem: An education app company plans to add AI-driven personalised learning paths to a product used by
  children aged 8 to 12. The feature would build a profile of each child's learning behaviour. Its compliance
  work so far has followed the rules for adult users. What should the risk practitioner recommend?
options:
  A: Run a data protection impact assessment on the adult template
  B: Obtain verifiable parental consent before any profiling begins
  C: Identify the added legal protections that apply to children's data
  D: Keep the adult controls and add age checks at account sign-up
answer: C
explanation:
  why_correct: Many data protection and consumer laws give children extra protection, such as limits on
    profiling, stricter consent rules or duties of age-appropriate design. The company must first establish
    which apply in its markets and design the feature to meet them.
  why_not:
    A: An assessment is needed, but an adult template will not prompt the questions specific to children,
      so it may miss the very duties at issue.
    B: Parental consent is one possible protection, but some laws limit profiling of children whatever
      consent is given, and other design duties may apply.
    D: Age checks identify child users but do not tell the company what extra rules apply once it knows
      they are children.
