id: aair-d1-1.2-0007
subdomain: '1.2'
difficulty: hard
stem: A bank has acquired a fintech that uses several AI credit models approved under the fintech's own,
  lighter governance. The models will keep running after the deal closes. What should the risk practitioner
  do to align them with the bank's processes?
options:
  A: Have the bank's validation team revalidate the models, highest risk first
  B: Bring the models under the bank's monitoring and reporting, highest risk first
  C: Have internal audit review the fintech's model governance after closing
  D: Assess each model against bank standards, highest risk first
answer: D
explanation:
  why_correct: The bank is now responsible for these models, so they must meet its standards. Assessing
    each one against those standards, starting with the highest-risk models, finds the gaps in validation,
    ownership, monitoring and documentation and fixes them in order without stopping the business.
  why_not:
    A: Revalidation by the bank's team is part of the answer, but validation covers model performance
      only. It does not find the gaps in ownership, documentation, approval or monitoring left by the
      fintech's lighter governance.
    B: Bank-standard monitoring gives ongoing oversight from now on, but it does not find where the models'
      validation, documentation or approval fell short of bank standards. Those gaps remain.
    C: Audit gives later, independent assurance, but it is not the management action that brings each
      model up to bank standards. Credit decisions continue on the old basis meanwhile.
