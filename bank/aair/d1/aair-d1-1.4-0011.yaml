id: aair-d1-1.4-0011
subdomain: '1.4'
difficulty: medium
stem: A government department's AI policy and training apply to its employees. About a third of the people
  who process citizens' applications are contractors supplied by an agency, and some of them use AI tools
  in their work. What should the risk practitioner recommend?
options:
  A: Require the agency to train contractors to its own AI standard
  B: Bind contractors to the department's AI policy and training by contract
  C: Give contractors access only to the AI tools the department has approved
  D: Add contractor AI use to the agency's quarterly performance review
answer: B
explanation:
  why_correct: Contractors handle the same data and decisions as employees, so the same rules and training
    should apply. Writing the department's policy and training duties into the agency contract makes them
    binding and lets the department check that they are met.
  why_not:
    A: The agency's standard may not match the department's rules on citizens' data, and the department
      stays accountable for how its work is done.
    C: Limiting tools helps, but it does not tell contractors what data they may enter or how to use outputs.
      Those rules sit in the policy they are not bound by.
    D: A performance review checks after the fact, and without the department's rules in the contract
      there is no agreed standard to review against.
