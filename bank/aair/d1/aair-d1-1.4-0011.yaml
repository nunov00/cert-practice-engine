id: aair-d1-1.4-0011
subdomain: '1.4'
difficulty: medium
stem: A government department's AI policy and training apply to its employees. About a third of the people
  who process citizens' applications are contractors supplied by an agency, and some of them use AI tools
  in their work. What should the risk practitioner recommend?
options:
  A: Ask the agency to confirm that its contractors use AI responsibly
  B: Extend the policy and training duties to contractors by contract
  C: Prevent contractors from using any AI tool during their assignments
  D: Assume the agency's own policies already cover the department's needs
answer: B
explanation:
  why_correct: Contractors handle the same data and decisions as employees, so the same rules and training
    should apply to them. Writing those duties into the agency contract makes them binding and allows
    the department to check they are met.
  why_not:
    A: A general assurance is not enforceable and does not tell contractors what the department's rules
      are.
    C: A blanket ban blocks legitimate approved uses and is hard to enforce while contractors are outside
      the policy.
    D: The agency's policies may not match the department's needs, and the department stays accountable
      for how its work is done.
