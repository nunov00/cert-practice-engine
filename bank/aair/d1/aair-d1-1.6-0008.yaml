subdomain: '1.6'
difficulty: hard
stem: A mobile gaming company uses a model to personalise in-game purchase offers to maximise spending.
  A review finds that the model sends the most offers to players whose behaviour shows signs of compulsive
  play. All players have accepted the terms of service. What should the risk practitioner recommend?
options:
  A: Add spending reminders and limit-setting tools for players
  B: Disclose the personalisation clearly and let players opt out
  C: Cap the daily number of offers each player can receive
  D: Exclude players showing signs of harm from targeted offers
answer: D
explanation:
  why_correct: The model is targeting the players most at risk, an ethical harm that acceptance of general
    terms does not cure. Its objective needs a constraint so that people showing signs of harmful play
    are not targeted, even at some cost to revenue.
  why_not:
    A: Safer-play tools help, but they depend on at-risk players using them while the model keeps aiming
      offers at them.
    B: Transparency and choice are good practice, but people with signs of compulsive play are the least
      likely to opt out.
    C: A cap reduces volume for everyone, but the model still directs its offers at the most vulnerable
      players.
