id: aair-d1-1.1-0009
subdomain: '1.1'
difficulty: medium
stem: A software company with 80 staff uses AI in two products and a few internal tools. Its new risk
  lead proposes adopting in full an AI risk management framework written with large multinationals in
  mind, with several committees and dozens of required documents. Staff are already pushing back. What
  should the risk practitioner recommend?
options:
  A: Adopt the framework in full so that no requirement is missed
  B: Delay adopting any framework until the company has grown
  C: Write a new framework from scratch that suits the company
  D: Tailor the framework to the company's size and AI risk profile
answer: D
explanation:
  why_correct: Risk management frameworks are meant to be adapted. Tailoring keeps the framework's structure
    and risk coverage while scaling roles, documents and review depth to the company's size and the actual
    risk of its AI uses. That makes adoption realistic and keeps effort where the risk is highest.
  why_not:
    A: Full adoption would create overhead a small company cannot sustain. Resistance and box-ticking
      would likely follow, weakening risk management rather than strengthening it.
    B: The company already uses AI in its products, so the risks exist now. Waiting leaves them unmanaged.
    C: Starting from scratch wastes effort and risks gaps that an established framework already covers.
      Adapting an existing framework is quicker and easier to justify.
