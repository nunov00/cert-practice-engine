id: aair-d1-1.1-0009
subdomain: '1.1'
difficulty: hard
stem: A software company with 80 staff uses AI in two products and a few internal tools. Its new risk
  lead proposes adopting in full an AI risk management framework written with large multinationals in
  mind, with several committees and dozens of required documents. Staff are already pushing back. What
  should the risk practitioner recommend?
options:
  A: Adopt the framework in phases, starting with the highest-risk AI uses
  B: Apply the framework only to the two AI products, not internal tools
  C: Keep the framework and give each requirement a named, accountable owner
  D: Scale the framework's roles and documents to the company's risk
answer: D
explanation:
  why_correct: Risk management frameworks are meant to be adapted. Scaling roles, documents and review
    depth to the company's size and the actual risk of its AI uses keeps the framework's structure and
    risk coverage while making adoption realistic. Effort goes where the risk is highest.
  why_not:
    A: Ordering the work by risk is sensible, but the company still ends up running committees and dozens
      of documents designed for a multinational. The overhead is delayed, not reduced, and the pushback
      will return.
    B: Cutting scope by system leaves the internal tools unmanaged, though they may carry real risk. Tailoring
      should adjust depth, not drop coverage.
    C: Clear ownership helps adoption, but it does not reduce overhead that an 80-person company cannot
      sustain. The requirements stay disproportionate.
