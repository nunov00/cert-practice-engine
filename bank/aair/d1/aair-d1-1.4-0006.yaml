id: aair-d1-1.4-0006
subdomain: '1.4'
difficulty: medium
stem: A media group reports that 98% of staff have completed its training on safe use of generative AI.
  Monitoring still shows staff entering unpublished stories and source details into public AI tools. The
  staff involved all completed the course and passed its quiz. The policy allows public tools for research
  on published material. What should the risk practitioner do NEXT?
options:
  A: Add examples of unpublished material and source details to the course
  B: Interview the staff involved to find why the training is not working
  C: Report the completion and incident trends to the risk committee
  D: Provide an approved enterprise AI tool for work on unpublished material
answer: B
explanation:
  why_correct: Staff who passed the quiz are still making the mistake, so the training is not changing
    behaviour, and the reason is not yet known. Talking to the people involved shows whether the cause
    is unclear rules, time pressure, a missing approved tool or something else. The fix can then target
    the real cause.
  why_not:
    A: Better examples may help, but changing the content before knowing why trained staff still do this
      may fix the wrong thing.
    C: Reporting is part of oversight, but it does not tell anyone why the training fails or what to change.
    D: An approved tool helps if the cause is that staff have nothing safe to use. That is an assumption
      until the practitioner finds out why trained staff still do this.
