subdomain: '1.3'
difficulty: hard
stem: During an AI inventory review at a city council, the risk practitioner finds a chatbot that the
  communications team built on a low-code platform. It answers residents' questions, but no owner is recorded
  and nobody has assessed it. What should the practitioner recommend FIRST?
options:
  A: Carry out a risk assessment of the chatbot's answers to residents
  B: Restrict the chatbot to pre-approved answers until it is reviewed
  C: Register the chatbot in the inventory with its platform and data
  D: Have a named business owner take accountability for the chatbot
answer: D
explanation:
  why_correct: Without an owner, nobody is responsible for assessing, controlling or monitoring the chatbot
    or acting on what is found. Naming an accountable owner in the team that runs it is the basis for
    the assessment and controls that follow.
  why_not:
    A: An assessment is needed soon, but with no owner there is nobody to accept its results or act on
      them. Ownership comes first so the assessment leads somewhere.
    B: Nothing in the stem suggests the chatbot is causing harm that needs urgent containment, and restricting
      it does not settle who is responsible for it.
    C: Recording details is useful, but an inventory entry with no owner still leaves nobody accountable.
      The missing field that matters is the owner.
