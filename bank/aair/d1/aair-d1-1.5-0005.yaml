id: aair-d1-1.5-0005
subdomain: '1.5'
difficulty: medium
stem: A telecom operator recorded customer service calls, telling customers the recordings were for quality
  and staff training. The marketing team now wants to use the recordings to train a model that predicts
  which customers will buy upgrades. What should the risk practitioner advise?
options:
  A: Assess whether the new purpose is compatible and has a lawful basis
  B: Anonymise the recordings by removing customer names and account numbers
  C: Run a data protection impact assessment on the model's outputs
  D: Update the privacy notice to tell customers about the new use
answer: A
explanation:
  why_correct: Data collected for one purpose cannot simply be reused for another. The marketing use must
    be checked against the original purpose and notice, and a lawful basis found, with steps such as fresh
    notice or consent where needed, before training begins.
  why_not:
    B: Voices and conversation content can still identify people, so removing names and numbers may not
      anonymise the data. The purpose question also remains.
    C: An impact assessment is useful, but one focused on outputs does not answer whether the recordings
      may be reused for this new purpose at all.
    D: A new notice may be part of the answer, but it does not by itself make reuse of recordings made
      under the old notice lawful. Compatibility and lawful basis come first.
