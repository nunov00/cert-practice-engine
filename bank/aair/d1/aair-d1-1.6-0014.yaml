id: aair-d1-1.6-0014
subdomain: '1.6'
difficulty: hard
stem: A city police service plans a model that decides where to send patrols, trained on past records
  of recorded offences. More patrols in an area lead to more offences being recorded there, and the model
  will be retrained every month on the new records. What is the MOST significant ethical concern?
options:
  A: Monthly retraining may make the model's patrol choices unstable
  B: Officers may come to rely too heavily on the model's choices
  C: The model may amplify existing patrol patterns over time
  D: Offences that go unreported will be missing from the training data
answer: C
explanation:
  why_correct: Because patrols generate the records the model learns from, heavily patrolled areas show
    more recorded offences, attract more patrols and so produce still more records. Monthly retraining
    feeds this loop, which can entrench past over-policing of some communities regardless of actual offending.
  why_not:
    A: Unstable choices would be an operational problem, but the stem's details point to choices that
      grow more fixed, not less.
    B: Over-reliance is a real concern but secondary. Even careful officers would act on recommendations
      that are skewed by the loop.
    D: Under-reporting is a real data bias, but it is a fixed gap. The patrol-to-record loop compounds
      with each retraining, which makes it more significant here.
