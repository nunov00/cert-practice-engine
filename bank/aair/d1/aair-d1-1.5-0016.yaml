stem: A city plans an AI model that scores welfare claims for fraud risk. Data protection law requires an impact assessment
  before high-risk processing begins. The project is in procurement, and no vendor has been chosen. When should the assessment
  start?
options:
  A: Now, so its findings shape the vendor requirements
  B: Once a vendor is chosen and the design is known
  C: Before go-live, when the final system can be assessed
  D: After a limited pilot shows how the model performs
answer: A
explanation:
  why_correct: The law sets a deadline, before processing, but the assessment adds most value early. Starting now lets its
    findings, such as needs for explanations, human review or data limits, go into the tender, when they are still cheap to
    require.
  why_not:
    B: Waiting for a vendor gives more design detail, but the requirements would already be fixed, and gaps would mean costly
      changes to the contract.
    C: Assessing just before go-live meets the letter of the law but leaves little room to change what has been built.
    D: A pilot that scores real claims is already processing personal data, so the assessment would come too late.
