subdomain: '1.4'
difficulty: easy
stem: A company's board will approve its first AI risk appetite statement next quarter. Several directors say they
  lack the background to judge AI risks. What should the risk practitioner arrange FIRST?
options:
  A: Enrol directors in a general online AI literacy course
  B: Ask the risk committee to approve the appetite instead
  C: Recruit a director with AI expertise at the next election
  D: Hold a briefing on the AI risks in the company's own uses
answer: D
explanation:
  why_correct: Directors need enough understanding to set appetite before next quarter. A focused briefing on the
    risks in the company's actual AI uses gives them that context in time and ties it to the decision they must
    make.
  why_not:
    A: A general course takes longer and may not cover the risks specific to the company's AI uses.
    B: Setting risk appetite is a board responsibility; handing it to a committee avoids the knowledge gap rather
      than closing it.
    C: An expert director may help in the longer term but will not arrive in time for next quarter's approval.
