id: aair-d1-1.5-0008
subdomain: '1.5'
difficulty: hard
stem: A health insurer wants to test its claims model for unfair bias by ethnicity. Its data protection
  law treats ethnicity as a special category that may be processed only on limited grounds, and the insurer
  does not hold this data today. What should the risk practitioner advise?
options:
  A: Test for bias using ethnicity estimated from postcode data
  B: Agree a lawful basis and safeguards for the testing with legal
  C: Test outcomes by age and gender, which the insurer already holds
  D: Collect ethnicity voluntarily on new claim forms from next month
answer: B
explanation:
  why_correct: Two duties apply, avoiding unlawful discrimination and protecting sensitive data. Agreeing
    a lawful basis and safeguards with legal and privacy specialists, for example voluntary collection,
    strict access limits or privacy-preserving methods, lets the testing go ahead lawfully and records
    the decision.
  why_not:
    A: Estimating ethnicity is still processing a special category, and estimates can be inaccurate. Without
      a lawful basis and safeguards it adds risk.
    C: Testing other attributes is worthwhile but does not answer whether the model is biased by ethnicity.
    D: Voluntary collection may be part of the answer, but starting it before the lawful basis, notice
      and safeguards are agreed risks breaching the law.
