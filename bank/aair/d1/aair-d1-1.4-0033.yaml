id: aair-d1-1.4-0033
subdomain: "1.4"
difficulty: easy
stem: A company's AI policy requires every new AI use to be registered and risk-assessed. Teams now switch on AI
  features inside software that is already approved, through admin settings, without registering them, because they
  believe the software's approval covers them. Admin setting changes already go through the IT change process. Which
  procedure change BEST closes the gap?
options:
  A: Retrain software administrators on the AI policy's registration rule
  B: Ask suppliers to notify the risk team when they add AI features
  C: Scan each approved tool's settings quarterly for AI features that are switched on
  D: Make the change process require an AI registration reference to enable an AI feature
answer: D
explanation:
  why_correct: Every enablement already passes through the change process, so adding a registration check there catches
    each AI feature at the moment it is switched on, whatever the team believes about the software's approval.
  why_not:
    A: Training helps, but the gap comes from a reasonable belief and many administrators; relying on them to remember
      leaves no check at the point of change.
    B: Supplier notices say a feature exists, not that a team has switched it on, and many suppliers will not send them
      reliably.
    C: A quarterly scan finds features months after they went live without a risk assessment, so it detects the gap rather
      than closing it.
