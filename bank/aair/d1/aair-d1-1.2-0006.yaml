id: aair-d1-1.2-0006
subdomain: '1.2'
difficulty: medium
stem: An insurer's data science teams release model updates every two weeks, but the model risk review
  takes about eight weeks. Teams have started to label changes as minor to avoid review. What should the
  risk practitioner recommend?
options:
  A: Have the review team audit a sample of changes labelled as minor
  B: Set review depth by each change's risk, within the release cycle
  C: Add reviewers so the full review can be completed in two weeks
  D: Define what counts as a minor change and have the risk team confirm labels
answer: B
explanation:
  why_correct: The review process is out of step with how teams work, so they route around it. Risk-based
    tiers with clear criteria let low-risk changes pass quickly while material changes still get full
    review, and fitting reviews into the release cycle removes the incentive to bypass them.
  why_not:
    A: Sampling may catch some mislabelled changes, but it detects the problem after release and leaves
      the eight-week delay that drives the behaviour.
    C: More reviewers may shorten the queue, but a full review of every change is disproportionate for
      low-risk updates and would remain a bottleneck as release volume grows.
    D: Clear criteria help, but changes that are not minor would still wait eight weeks. The pressure
      to label changes as minor would remain.
