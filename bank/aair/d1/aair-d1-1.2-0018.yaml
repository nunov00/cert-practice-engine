id: aair-d1-1.2-0018
subdomain: '1.2'
difficulty: hard
stem: A water utility's debt collection model was built to maximise the amount recovered each month. The company's
  strategy now aims to keep customers in financial difficulty on supply and to cut complaints, and its regulator
  watches both. Which new objective for the model should the risk practitioner MOST support?
options:
  A: Maximise recovery, excluding customers flagged as vulnerable
  B: Minimise the number of complaints about collection contacts
  C: Maximise the customers keeping to plans they can afford
  D: Maximise recovery while keeping complaints under a set limit
answer: C
explanation:
  why_correct: 'The strategy has two parts: keep customers in difficulty on supply, and cut complaints. Optimising
    for customers who keep to affordable payment plans serves both. It steers the model toward arrangements people
    can sustain, which keeps them on supply and tends to reduce complaints, while still bringing in money.'
  why_not:
    A: Excluding flagged customers protects some of them, but many people in difficulty are never flagged, and everyone
      else is still pursued for maximum recovery.
    B: Minimising complaints serves one half of the strategy, but the model could achieve it by simply contacting
      fewer people, with no help for customers in difficulty.
    D: A complaints limit adds a guardrail, but the model still pushes for maximum recovery, which works against
      keeping customers in difficulty on supply.
