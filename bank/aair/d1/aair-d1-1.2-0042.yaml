stem: A bank lets customers opt out of having their data used for profiling. The opt-out is held in the marketing platform,
  which drops those customers from campaign lists. An AI propensity model scores each customer nightly, and branch staff see
  the scores on screen when customers visit. Which change BEST aligns these processes?
options:
  A: Apply the opt-out in each system that receives the model's scores
  B: Apply the opt-out before customer data reaches the model for scoring
  C: Apply the opt-out to the training data the model is rebuilt from
  D: Apply the opt-out to the score display that branch staff see on screen
answer: B
explanation:
  why_correct: Customers opted out of profiling, and scoring them is itself profiling, whatever happens to the score afterwards.
    Applying the opt-out where data enters the scoring run means opted-out customers are not profiled at all, and every later
    use of the scores inherits that. Scores already produced before an opt-out takes effect should also be invalidated
    in the systems that cached them.
  why_not:
    A: Filtering in each system that receives scores hides them from campaigns and branches, but the customers are still being
      profiled each night, which is what they opted out of; any new consumer of the scores would also need its own filter.
    C: Leaving opted-out customers out of training stops their data shaping the model, but the model still scores them nightly,
      so they are still profiled.
    D: Hiding scores from branch staff closes the visible gap at the branch, but the customers are still scored nightly and
      the scores remain available to other uses.
