subdomain: '1.2'
difficulty: medium
stem: A retailer's IT change process covers software releases, but model retraining is treated as a data refresh
  and skips it. Last month a retrained pricing model caused a week of pricing errors. The data team retrains several
  models each week. What should the risk practitioner recommend?
options:
  A: Route each retraining through the weekly change board
  B: Have the data science lead approve each retraining
  C: Tier model changes by risk inside the change process
  D: Retrain only after a full revalidation of each model
answer: C
explanation:
  why_correct: 'Bringing model changes into the existing change process, with a risk classification, aligns AI with
    how the organisation already controls change: high-impact changes get full review, while routine low-risk retraining
    can follow a lighter, pre-approved path.'
  why_not:
    A: Sending every retraining to a weekly board would slow frequent, low-risk updates and still treat a pricing
      model the same as a minor one.
    B: An approval by the data science lead stays outside the organisation's change process and lacks independent
      review.
    D: Full revalidation for each retraining is disproportionate for low-risk changes and would make weekly retraining
      impractical.
