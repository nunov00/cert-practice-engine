id: aair-d1-1.2-0013
subdomain: '1.2'
difficulty: medium
stem: A public broadcaster approves AI projects on business cases that promise specific benefits and set
  out the expected risks. Once a project goes live, nobody checks whether the benefits arrived or whether
  the risks turned out as expected. What should the risk practitioner recommend?
options:
  A: Ask for more detailed business cases before projects are approved
  B: Tie project managers' bonuses to the benefits stated in their cases
  C: Add a post-implementation review against the approved business case
  D: Hand responsibility for live AI systems to the internal audit team
answer: C
explanation:
  why_correct: A review some months after go-live compares the benefits and risks that actually occurred
    with what was approved. It shows whether each system is worth its risk, feeds lessons into future
    approvals and closes the loop between the approval process and real results.
  why_not:
    A: More detail up front does not show what actually happened after launch.
    B: Bonuses tied to stated benefits may encourage inflated claims, and they still do not create any
      review of risks.
    D: Internal audit gives independent assurance. Owning live systems is not its role and would compromise
      its independence.
