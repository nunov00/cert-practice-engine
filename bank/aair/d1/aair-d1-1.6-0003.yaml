subdomain: '1.6'
difficulty: easy
stem: A city council uses an AI model to rank tenants' repair requests by urgency. Tenants complain that
  they cannot understand why their requests are placed low on the list. Which measure BEST improves trust
  in the system?
options:
  A: Publish the model's source code on the council's website
  B: Remind tenants that a model is used to rank all repair requests
  C: Give each tenant a plain-language reason for their request's rank
  D: Commission a technical audit and keep the report for internal use
answer: C
explanation:
  why_correct: People affected by an AI-supported decision trust it more when they can understand the
    main reasons for their own outcome and challenge it if something is wrong. A plain-language explanation
    answers the complaint directly.
  why_not:
    A: Source code is unreadable for most tenants and does not explain an individual ranking.
    B: Tenants already know a model is used; disclosure alone does not tell them why their request ranked
      low.
    D: An internal audit may improve the system, but tenants would still not understand their outcomes.
