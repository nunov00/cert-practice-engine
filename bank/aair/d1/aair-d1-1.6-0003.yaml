id: aair-d1-1.6-0003
subdomain: '1.6'
difficulty: medium
stem: A city council uses an AI model to rank tenants' repair requests by urgency. Tenants complain that
  they cannot understand why their requests are placed low on the list. Which measure BEST addresses this
  complaint?
options:
  A: Publish the factors the model uses and their general weighting
  B: Let tenants ask a housing officer to review their own request's rank
  C: Give each tenant a plain-language reason for their request's rank
  D: Commission an independent fairness audit and publish a summary
answer: C
explanation:
  why_correct: The complaint is about understanding individual outcomes. A plain-language reason for each
    tenant's own rank answers it directly, and also lets tenants spot errors and challenge them.
  why_not:
    A: A general list of factors helps, but it does not tell a tenant why their own request ranked low.
    B: A review route supports challenge, but tenants still would not understand their rank, and many
      would not know whether to ask.
    D: An audit can improve and reassure about the system as a whole, but it does not explain individual
      rankings.
