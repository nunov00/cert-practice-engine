stem: An inventory check finds that 14 of a bank's 60 models list owners who have left or changed roles, and nobody is
  reviewing those models' monitoring reports. What should the risk practitioner recommend to stop this recurring?
options:
  A: Add model ownership handover to the leaver and mover process
  B: Assign the 14 models to the head of data science for now
  C: Check the whole inventory monthly instead of yearly
  D: Send monitoring reports to a shared mailbox the risk team watches
answer: A
explanation:
  why_correct: Ownership lapses whenever an owner leaves or moves and nothing hands it on. Building the handover into the
    leaver and mover process means a new owner is named at the point of change, before monitoring goes unreviewed.
  why_not:
    B: A temporary owner deals with the current 14, but the next owner who leaves causes the same gap.
    C: Monthly checks find gaps sooner, but they still find them after the fact rather than preventing them.
    D: A shared mailbox gives the reports a reader but no accountable owner who can act on what they show.
