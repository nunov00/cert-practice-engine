id: aair-d1-1.3-0022
subdomain: "1.3"
difficulty: easy
stem: An inventory check finds that 14 of a bank's 60 models list owners who have left or changed roles, and nobody is
  reviewing those models' monitoring reports. In each case the HR leaver or mover process ran on time, but nothing in it
  touched the model inventory. What should the risk practitioner recommend?
options:
  A: Require owners to re-attest ownership of their models each quarter
  B: Name a deputy owner for each model in the inventory as cover
  C: Link the leaver and mover process to the inventory so ownership is reassigned
  D: Have the risk team check the inventory against the HR directory each month
answer: C
explanation:
  why_correct: The gap opens at the moment someone leaves or moves, in a process that already runs reliably but ignores
    the inventory. Linking that process to the inventory means a new owner is named at the point of change, before
    monitoring goes unreviewed.
  why_not:
    A: Quarterly attestation surfaces lapsed ownership, but an owner who has left cannot attest, so models can go up to
      three months without anyone reviewing them.
    B: A deputy gives cover while the owner is in post, but deputies also leave or move, and nothing in the HR process
      would reassign either role. The same gap reopens, one step later.
    D: A monthly comparison finds gaps sooner, but it still finds them after the fact, and it adds a manual check to a
      process that could reassign ownership directly.
