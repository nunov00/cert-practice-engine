id: aair-d1-1.3-0002
subdomain: '1.3'
difficulty: hard
stem: A retailer's demand forecasting model is used by three business units. Each unit asks the data science
  team for changes, and recent retraining for one unit caused stock shortages in another. The AI oversight
  committee wants to stop this happening again. What is the BEST way to assign accountability?
options:
  A: Have the oversight committee approve changes that affect several units
  B: Name one business owner for the model, who must consult each unit
  C: Make the data science team the model owner, with change approval rights
  D: Require testing against every unit's forecasts before each release
answer: B
explanation:
  why_correct: A shared model needs a single owner with clear decision rights over changes and a defined
    duty to consult the units that rely on it. This removes conflicting instructions and makes sure each
    unit's needs and risks are weighed before a change is approved.
  why_not:
    A: An oversight committee sets direction and reviews significant matters. Approving routine changes
      turns it into an operational owner, creates a bottleneck and weakens its oversight role.
    C: The builders can manage the technical work, but they are not placed to decide trade-offs between
      business units' risks. Giving them ownership blurs the line between developer and risk owner.
    D: Cross-unit testing is a good control and would reveal impacts, but it does not say who decides
      when a change helps one unit and harms another. The question is about accountability.
