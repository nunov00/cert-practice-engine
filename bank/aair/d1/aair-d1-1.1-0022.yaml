subdomain: '1.1'
difficulty: medium
stem: A bank wants AI to help onboard business customers. Documents arrive from many countries with no common layout,
  and staff cannot keep up with keying the data. The regulator sets the order of the checks and requires a named
  officer's decision on each one. Which design BEST fits?
options:
  A: An agent given the procedure and tools, planning its own steps
  B: Coded steps, with a model only extracting the document data
  C: Coded steps, with a model also deciding pass or fail on each check
  D: Fixed capture templates per document type, with staff on exceptions
answer: B
explanation:
  why_correct: The order of checks is fixed by the regulator and each decision belongs to a named officer, so the only
    task that needs AI is reading documents with no common layout. Coding the steps guarantees the sequence, and
    limiting the model to extraction leaves every check decision with the officer.
  why_not:
    A: An agent chooses its own steps and can skip or reorder them, even when the procedure is in its instructions. That
      leaves the regulator's fixed sequence to chance.
    C: The coded steps keep the order, but letting the model decide each check takes the decision away from the named
      officer the regulator requires.
    D: Templates work when documents share a layout. With documents from many countries and no common format, most would
      fall to the exceptions queue and staff would still be overwhelmed.
