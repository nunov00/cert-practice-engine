id: aair-d1-1.2-0033
subdomain: '1.2'
difficulty: medium
stem: A bank's marketing compliance team approves the wording of each campaign before it is sent. A new AI tool
  will instead write a different email for each of two million customers at send time, tailored to their own products
  and recent activity. The product team has confirmed that no fixed set of pre-written variants could cover the product and activity combinations involved. How should the approval process BEST be adapted?
options:
  A: Compliance approves each generated email before the tool sends it
  B: Compliance reviews a weekly sample of the emails the tool has sent
  C: The tool picks only from email variants compliance approved in advance
  D: Compliance approves the tool's brief and rules after a large test run
answer: D
explanation:
  why_correct: "When every customer gets a unique email, what can be approved before sending is the system that\
    \ writes them: the brief, the rules on claims and products, and evidence from a large test run that the output\
    \ keeps to them. This moves compliance sign-off from single texts to the generator, keeps the tailoring the\
    \ campaign depends on, and still gives a documented approval before anything reaches customers. As a follow-on step, the approved\
    \ rules can then be enforced by automated checks on each email before it is sent, and sampling of sent emails\
    \ follows as monitoring."
  why_not:
    A: Approving each item is the existing control and the reflex answer, but a compliance team cannot read two
      million unique emails at send time. The control would either stop the campaign or become a rubber stamp.
    B: Sampling sent emails is useful monitoring, but on its own it finds problems only after customers have received
      them. It drops pre-approval instead of adapting it.
    C: Picking from pre-approved variants is a common, safe design, but the product team has confirmed that fixed
      variants cannot cover the combinations involved, so it gives up the per-customer tailoring that is the reason
      for the tool. It solves the approval problem by giving up the use case.
