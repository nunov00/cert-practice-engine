subdomain: '1.6'
difficulty: medium
stem: A hospital group pilots a model that screens job applications for nursing roles. It meets its overall
  accuracy target, but applicants from one age group are shortlisted at a much lower rate than others
  with similar qualifications. What should the risk practitioner recommend?
options:
  A: Rebalance the training data so age groups are equally represented
  B: Continue the pilot and monitor shortlisting rates by age each month
  C: Remove age and likely proxies from the inputs and continue rollout
  D: Pause wider use while the cause and impact of the gap are analysed
answer: D
explanation:
  why_correct: A large gap between groups with similar qualifications is a sign of possible unfair bias,
    with legal and ethical consequences. The cause must be found before a fix can be chosen, and wider
    use should wait so the model does not affect more applicants in the meantime.
  why_not:
    A: Rebalancing is one possible fix, but the gap may come from labels or features rather than representation.
      Choosing a fix before the cause is known may not work.
    B: Monitoring tracks the gap but lets the model keep disadvantaging applicants while nobody works
      out why.
    C: Removing inputs without analysis may miss other proxies and hide the gap rather than remove it.
