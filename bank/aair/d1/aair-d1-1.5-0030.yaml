id: aair-d1-1.5-0030
subdomain: '1.5'
difficulty: medium
stem: A gym chain plans to replace membership cards with face recognition at its entrances, storing a face template for
  each member. Local law allows biometric identification of customers only with their explicit consent, and the chain
  will ask each member for it. Members who prefer a card will move to a card plan priced 5 a month higher. Which legal
  consideration should the risk practitioner MOST raise?
options:
  A: How long face templates may be kept after a membership ends
  B: Whether members' consent to the face scans is freely given
  C: What security the law requires for stored face templates
  D: Whether the system recognises some groups less reliably than others
answer: B
explanation:
  why_correct: Face templates used to identify people are biometric data, which data protection laws usually allow only on
    narrow grounds such as explicit consent. Consent must be freely given, and charging members more for refusing makes
    it hard to say that it is. If the consent is not valid, the chain has no lawful basis for the processing at all,
    whatever its retention, security or accuracy controls.
  why_not:
    A: Retention limits for templates are a real requirement, but they only matter once the processing has a lawful basis.
      The priced alternative puts that basis itself in doubt.
    C: Biometric templates need strong protection, and the chain must provide it. Good security does not cure processing
      that rests on consent members were pressed to give.
    D: Unequal recognition rates could cause discrimination and should be tested. The design detail that decides the legal
      question here is the price of refusing, which goes to the lawful basis.
