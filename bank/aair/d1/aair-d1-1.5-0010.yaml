stem: A car finance company plans to use machine learning to set interest rates for borrowers. The country
  has no law specific to AI, and the product manager concludes that the model is therefore free of legal
  constraints. How should the risk practitioner respond?
options:
  A: Agree, but suggest tracking AI-specific bills under debate
  B: Point out that consumer credit and equality laws still apply
  C: Agree, provided the model's accuracy is checked every year
  D: Point out that only internal policy can limit the model's use
answer: B
explanation:
  why_correct: Laws on consumer credit, equal treatment, data protection and fair dealing apply to the
    decision whatever technology makes it. A model that sets rates in a discriminatory or unfair way can
    breach them, so legal review is needed now, not only when AI-specific law arrives.
  why_not:
    A: Tracking new bills is good practice, but agreeing with the conclusion ignores obligations that
      already apply.
    C: Accuracy checks do not address legal duties such as non-discrimination and fair treatment of customers.
    D: Internal policy matters, but existing external laws also constrain the model.
