difficulty: medium
stem: A car finance company plans to use machine learning to set interest rates for borrowers. The country
  has no law specific to AI, and the product manager concludes that the model is therefore free of legal
  constraints. How should the risk practitioner respond?
options:
  A: Advise tracking AI bills so the model is ready when one becomes law
  B: Explain that existing credit, equality and data laws already apply
  C: Advise adopting a voluntary AI framework in the absence of law
  D: Advise a fairness test of the model before it goes live
answer: B
explanation:
  why_correct: Laws on consumer credit, equal treatment, data protection and fair dealing apply to the
    decision whatever technology makes it. Correcting the manager's conclusion is the first step, because
    it changes what reviews and tests the project needs now.
  why_not:
    A: Tracking bills is good practice, but it accepts the premise that no law applies today.
    C: A voluntary framework adds good practice, but it also accepts the premise and leaves current legal
      duties unaddressed.
    D: A fairness test is valuable, but recommending it without correcting the conclusion leaves the wider
      legal review, such as credit and data rules, unaddressed.
