id: aair-d1-1.5-0009
subdomain: '1.5'
difficulty: easy
stem: A retailer wants to use an AI customer service tool whose provider processes all data in data centres
  in another country. The retailer's data protection law restricts transfers of personal data abroad unless
  certain conditions are met. What should the risk practitioner check BEFORE customer data is sent?
options:
  A: Whether the provider holds a recognised security certification
  B: Whether the privacy notice tells customers their data goes abroad
  C: Whether the provider contract includes data processing terms
  D: Whether a lawful transfer mechanism and safeguards are in place
answer: D
explanation:
  why_correct: Because the law restricts transfers abroad, the retailer must establish that this transfer
    is permitted, for example through an adequacy decision, contractual safeguards or another lawful mechanism,
    before any data leaves.
  why_not:
    A: A certification gives assurance about security, but it does not make an otherwise restricted transfer
      lawful.
    B: Customers should be told, but a notice does not meet the legal conditions for the transfer itself.
    C: Processing terms are needed with any provider, but they do not on their own satisfy the separate
      conditions on sending data abroad.
