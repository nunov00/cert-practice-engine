stem: A logistics firm compares two designs for handling delivery exceptions. One AI assistant drafts rebookings
  for staff to send; one AI agent rebooks directly. Both use the same model, accuracy and carrier APIs. Which factor
  should MOST drive the difference in their risk ratings?
options:
  A: The share of exceptions each design resolves without error
  B: Whether a person reviews actions before they take effect
  C: The volume of carrier data each design is able to read
  D: The number of carrier systems each design connects to
answer: B
explanation:
  why_correct: With the same model, accuracy and connections, the designs differ only in autonomy. The assistant's
    errors can be caught before they reach carriers and customers; the agent's take effect at once, which raises
    impact.
  why_not:
    A: Both designs use the same model with the same accuracy, so their error rates do not differ.
    C: Both use the same carrier APIs, so the data they can read is the same.
    D: The connections are identical. Their number matters for exposure in general, but it does not separate these
      two designs.
