subdomain: '1.3'
difficulty: easy
stem: A lender uses a machine learning model to recommend approval or decline on small business loans.
  The model was built by the central data science team and is used by the commercial lending division.
  Who should be accountable for the risk the model creates in lending decisions?
options:
  A: The chief information officer, who runs the platform hosting it
  B: The lead data scientist who designed and trained the model
  C: The second-line risk function that reviews the model each year
  D: The head of the commercial lending division that relies on the model
answer: D
explanation:
  why_correct: Risk ownership sits with the business owner of the process the AI supports, because that
    person decides how it is used and bears the consequences. Builders and oversight functions support
    the owner but do not replace that accountability.
  why_not:
    A: The CIO is accountable for the technology platform, not for the credit decisions made with the
      model. Hosting a system does not make someone the owner of its business risk.
    B: The developer is responsible for building the model well, but does not decide how it is used in
      lending or own the business outcomes. Accountability for the risk belongs to the process owner.
    C: The second line sets standards and challenges the owner. If it owned the risk it could not independently
      challenge it.
