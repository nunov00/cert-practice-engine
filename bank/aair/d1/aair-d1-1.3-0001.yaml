stem: A lender uses a machine learning model to recommend approval or decline on small business loans.
  The central data science team built it and the commercial lending division uses it. The model inventory
  lists the head of data science as model owner. Who should be accountable for the risk the model creates
  in lending decisions?
options:
  A: The head of data science, whose team built and maintains the model
  B: The chief risk officer, who sets the bank's model risk policy
  C: The chief information officer, whose team runs the model platform
  D: The head of commercial lending, whose division uses the model
answer: D
explanation:
  why_correct: Risk ownership sits with the business owner of the process the AI supports, because that
    person decides how it is used and bears the consequences. The inventory entry reflects technical ownership.
    Builders, platform teams and oversight functions support the risk owner but do not replace that accountability.
  why_not:
    A: The builder is responsible for the model's technical quality, and the inventory may list it as
      technical owner. It does not decide how the model is used in lending or own the credit outcomes.
    B: The chief risk officer sets standards and challenges risk owners. Owning the risk would remove
      the independence that challenge needs.
    C: The CIO is accountable for the technology platform, not for the credit decisions made with the
      model. Hosting a system does not make someone the owner of its business risk.
