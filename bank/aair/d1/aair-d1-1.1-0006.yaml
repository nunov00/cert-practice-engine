id: aair-d1-1.1-0006
subdomain: '1.1'
difficulty: hard
stem: A bank wants a generative AI assistant to answer staff questions about internal policies, which
  change several times a month. Wrong or outdated answers could lead to breaches of conduct rules. Which
  approach BEST fits the use case?
options:
  A: Fine-tune a model on the current policy library every quarter
  B: Use a general model with instructions to answer only from policy
  C: Retrieve answers from the policy library, citing sources
  D: Use a general model and show a warning to verify every answer
answer: C
explanation:
  why_correct: 'Grounding answers in the current, controlled policy library means changes take effect
    as soon as the library is updated, and citations let staff check the source. This directly reduces
    the main risk of the use case: outdated or invented answers.'
  why_not:
    A: A fine-tuned model holds a snapshot of the policies, so its answers go out of date between quarterly
      updates. It also cannot show where an answer came from.
    B: Instructions do not give the model access to the actual policies. It would still answer from its
      general training and could invent plausible but wrong rules.
    D: A blanket warning shifts all the checking to staff, who may not know where to look. It leaves the
      underlying risk of wrong answers in place.
