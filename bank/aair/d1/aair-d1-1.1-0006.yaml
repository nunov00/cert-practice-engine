id: aair-d1-1.1-0006
subdomain: '1.1'
difficulty: medium
stem: A bank wants a generative AI assistant to answer staff questions about internal policies. The policy
  library runs to several thousand pages and changes several times a month. Wrong or outdated answers
  could lead to breaches of conduct rules. Which approach BEST fits the use case?
options:
  A: Fine-tune a model on the policy library after each round of changes
  B: Load summaries of the policies into a general model's instructions
  C: Retrieve passages from the current library and cite them in answers
  D: Use a general model, with compliance sampling its answers each week
answer: C
explanation:
  why_correct: Grounding answers in passages retrieved from the current, controlled library means changes
    take effect as soon as the library is updated, and citations let staff check the source. This directly
    reduces the main risks of the use case, which are outdated and invented answers.
  why_not:
    A: Frequent fine-tuning narrows the gap but is costly, and the model still holds a snapshot that lags
      behind changes. It also cannot show where an answer came from, and it may still blend or invent
      rules.
    B: Summaries lose the detail that conduct rules depend on, and a library of thousands of pages cannot
      be fully summarised in instructions. The model would fill gaps from its general training.
    D: Weekly sampling is a useful detective control, but it finds wrong answers only after staff have
      relied on them. It does nothing to make the answers current.
