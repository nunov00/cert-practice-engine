id: aair-d1-1.4-0010
subdomain: '1.4'
difficulty: hard
stem: A mid-sized insurer is drafting its AI policy. One draft defines AI so narrowly that it would exclude
  AI features in bought software; another is so broad that every spreadsheet formula would need review.
  Vendors often add AI features to existing software through updates. How should the policy BEST define
  its scope?
options:
  A: Use the broad definition with a list of exempt tool types
  B: Use the narrow definition plus AI checks when buying software
  C: Define AI by its characteristics, with a route for unclear cases
  D: Define the scope as the systems listed in the AI inventory
answer: C
explanation:
  why_correct: A definition based on characteristics, such as systems that learn from data or generate
    predictions, content or decisions, captures bought and built AI without sweeping in simple calculations.
    A set route for unclear cases keeps decisions consistent as vendors add new features.
  why_not:
    A: An exemption list goes out of date quickly, and anything not listed still falls under the broad
      definition. The burden on simple tools remains.
    B: Checks at purchase miss AI features that arrive later through updates to software already in use.
    D: An inventory records what is known. Defining scope by it leaves out any AI that nobody has yet
      listed, which is exactly what the policy should catch.
