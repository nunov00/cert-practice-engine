difficulty: medium
stem: A tax agency plans to close its phone line and handle all taxpayer questions through an AI chatbot
  on its website. Many older taxpayers and people in rural areas have limited internet access. What should
  the risk practitioner recommend?
options:
  A: Keep a phone or in-person channel for those who cannot go online
  B: Keep the phone line for a year while people adjust to the chatbot
  C: Offer assisted digital help at public libraries in rural areas
  D: Add a call-back request form to the chatbot for complex cases
answer: A
explanation:
  why_correct: A public service must stay available to everyone it serves. Removing the only non-digital
    route would exclude people who cannot use the chatbot, so a phone or in-person channel should remain
    for them.
  why_not:
    B: A transition period helps people learn a new tool, but limited internet access is a lasting barrier.
      When the line closes, the same people are excluded.
    C: Assisted help reaches some people, but it requires travel that many older and rural taxpayers may
      find hard, and it is still a digital route.
    D: A call-back form sits inside the chatbot, so people without internet access cannot reach it.
