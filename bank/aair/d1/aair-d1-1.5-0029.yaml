subdomain: '1.5'
difficulty: hard
stem: An online marketplace shows an AI-generated summary of customer reviews at the top of each product page. Testing
  finds that, for some products, the summaries leave out safety complaints that appear in many of the underlying
  reviews. Which legal consideration should the risk practitioner MOST raise?
options:
  A: Whether summarising makes it liable for what the reviews say
  B: Whether the summaries could mislead shoppers about the reviews
  C: Whether the summaries must be labelled as generated by AI
  D: Whether showing summaries creates a duty to act on safety complaints
answer: B
explanation:
  why_correct: The summary is the marketplace's own statement to shoppers about what the reviews say. Leaving out frequent
    safety complaints gives a more favourable picture than the reviews support, which raises consumer protection
    questions about misleading commercial practices, whoever wrote the reviews.
  why_not:
    A: Platform liability for user content is a real question, but the problem found is not the reviews' content. It is that
      the marketplace's own summary misstates them.
    C: Labelling may be required in some markets, but a label would not make an incomplete summary accurate. The omission of
      safety complaints is the more serious legal exposure.
    D: A duty to act on unsafe products depends on the marketplace's role as a seller or platform and exists whether or not
      summaries are shown. It does not address the risk the summaries themselves create by misstating the reviews.
