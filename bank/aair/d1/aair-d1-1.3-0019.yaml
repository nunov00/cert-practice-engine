id: aair-d1-1.3-0019
subdomain: '1.3'
difficulty: medium
stem: Each of a bank's production models has a named owner who must review monthly monitoring reports. The AI oversight committee
  wants to know whether owners actually do this. Which evidence BEST shows it?
options:
  A: Owners' signed annual attestations that they read the reports
  B: Distribution lists showing each report reached its owner
  C: Training records showing owners completed the oversight course
  D: Records of the decisions owners took on reported breaches
answer: D
explanation:
  why_correct: Oversight is shown by what owners do with the reports. Records of decisions on breaches, such as escalations,
    retraining requests or accepted exceptions, show the review took place and had an effect.
  why_not:
    A: An attestation is the owner's own claim. It does not show what they did when a report showed a problem.
    B: Delivery shows the reports were sent, not that anyone read or acted on them.
    C: Training shows owners should know how to review the reports. It does not show they do.
