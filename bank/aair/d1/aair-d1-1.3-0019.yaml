stem: A retailer's pricing models each have a business owner who must act on drift alerts. Alert tickets close automatically
  after 14 days. The AI oversight committee wants evidence that owners act on the alerts. Which evidence is BEST?
options:
  A: Owners' sign-off dates on a sample of monthly reports
  B: Committee minutes recording owners' updates on their models
  C: Ticket records showing each drift alert was closed
  D: Owners' recorded decisions on each alert, with follow-up
answer: D
explanation:
  why_correct: Acting on an alert means deciding something, such as retraining, adjusting prices or accepting the drift, and
    following it through. A recorded decision per alert with its follow-up shows that happened.
  why_not:
    A: Sign-offs show owners reviewed reports, not what they did about particular alerts.
    B: Minutes show owners report to the committee, but an update can be given without acting on any alert.
    C: Closed tickets look like action, but these tickets close on their own after 14 days, so closure proves nothing.
