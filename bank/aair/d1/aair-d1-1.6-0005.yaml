subdomain: '1.6'
difficulty: medium
stem: A delivery company's route optimisation model has cut fuel costs. It has changed routes across many
  towns, and now sends heavy vans through narrow streets near two primary schools, where residents have
  started to complain. What should the risk practitioner recommend?
options:
  A: Add a rule that keeps heavy vans off streets near the two schools
  B: Add an ethics review step for future changes to routing models
  C: Ask drivers to avoid the school streets at drop-off and pick-up
  D: Assess community impacts and add them as constraints in the model
answer: D
explanation:
  why_correct: AI systems can affect people who are not their users. Assessing effects on communities,
    such as safety and noise, and building them into the model's objective addresses the harm wherever
    the new routes cause it, not only where people have complained.
  why_not:
    A: A rule for the two schools fixes the streets where complaints arose, but routes have changed across
      many towns and similar harms may go unreported elsewhere.
    B: A review step improves future changes but does nothing about the model already running.
    C: Relying on drivers is informal and depends on individual behaviour. The model would keep planning
      the same routes.
