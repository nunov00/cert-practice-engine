stem: At a university, departments start AI projects on their own, and the risk office often learns of
  them only after they are in use. The university already has a project approval process for IT investments.
  What is the BEST way to make sure AI risks are considered early?
options:
  A: Require departments to record AI projects in a central inventory
  B: Scan purchasing and expense records each quarter for AI tools
  C: Set up an AI committee that reviews projects departments refer to it
  D: Add an AI risk screening step to the IT project approval process
answer: D
explanation:
  why_correct: A screening step in the existing approval gate catches AI projects when they seek resources,
    before design choices are fixed. It uses a process departments already follow, so coverage does not
    depend on them choosing to come forward.
  why_not:
    A: An inventory is useful, but recording relies on departments reporting their own projects, which
      is the gap the university already has. It also records projects rather than screening them.
    B: Scanning spend is a useful detective control, but it finds projects after money has been spent
      and often after they are in use. It does not bring risk in early.
    C: A committee that acts only on referral depends on departments choosing to come forward, which is
      the gap the university already has.
