stem: At a university, departments start AI projects on their own, and the risk office often learns of
  them only after they are in use. The university already has a project approval process for IT investments.
  What is the BEST way to make sure AI risks are considered early?
options:
  A: Ask departments to self-certify their AI projects every year
  B: Have internal audit review AI projects after they go live
  C: Set up an AI committee that reviews projects on request
  D: Add an AI risk screening step to the project approval process
answer: D
explanation:
  why_correct: An AI screening step in the existing approval gate catches projects when they seek resources,
    before design choices are fixed. It uses a process departments already follow, so coverage is better
    than with a separate, optional route.
  why_not:
    A: Annual self-certification is late and relies on departments recognising and reporting their own
      risks. It does not catch projects at the start.
    B: A review after go-live is assurance after the fact. Risks found then are costlier to fix, and harm
      may already have occurred.
    C: A committee that acts only on request depends on departments choosing to come forward, which is
      the gap the university already has.
