subdomain: '1.3'
difficulty: medium
stem: A bank's board asks internal audit to approve each high-risk AI model before deployment, because audit is trusted and
  independent. How should the chief audit executive respond?
options:
  A: Accept, and give the approvals to a separate team within internal audit
  B: Accept for high-risk models only, and audit lower-risk models as usual
  C: Decline the approval role and suggest it sits with management or the second line
  D: Accept on condition that audit hires staff with machine learning skills
answer: C
explanation:
  why_correct: Approving models is a management decision. If internal audit takes it on, it can no longer give independent
    assurance over the same decisions, so the role belongs with the first or second line, with audit later assessing how well
    it works.
  why_not:
    A: A separate team is still part of internal audit, so audit would be assuring decisions its own function made.
    B: Limiting approvals to high-risk models puts the conflict exactly where independent assurance matters most.
    D: More skills would improve audit's work, but they do not resolve the conflict between approving and assuring.
