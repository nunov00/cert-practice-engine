id: aair-d1-1.4-0012
subdomain: '1.4'
difficulty: medium
stem: A bank's information security policy forbids sending customer data to any external service. Its
  new AI policy allows approved external AI tools to process customer data under set conditions. Staff
  are unsure which rule applies, and some managers block approved tools while others allow them. What
  should the risk practitioner recommend?
options:
  A: Reconcile the two policies and set out how they relate to each other
  B: Issue a notice that the AI policy prevails where approved tools are used
  C: Grant a standing security policy exception for approved AI tools
  D: Train managers on when each of the two policies applies
answer: A
explanation:
  why_correct: Conflicting written policies cause uncertainty and inconsistent practice. Reconciling them,
    typically by updating the security policy to allow approved AI tools under the AI policy's conditions
    and setting out the hierarchy, gives staff one clear answer.
  why_not:
    B: A notice leaves the written conflict in place and may override security conditions that should
      still apply to these tools.
    C: Exceptions are for limited, temporary departures. Using one to cover a permanent, organisation-wide
      practice hides the conflict rather than fixing it.
    D: Training cannot settle which rule applies while the two written policies still contradict each
      other.
