id: aair-d1-1.1-0007
subdomain: '1.1'
difficulty: hard
stem: A telecom board has approved an AI strategy that aims to handle most customer service contacts with
  AI within two years. The strategy sets targets for cost and speed but says nothing about risk. What
  should the risk practitioner recommend?
options:
  A: Have the board set the AI risk appetite the strategy must respect
  B: Add key risk indicators to the cost and speed targets it reports on
  C: Require a risk assessment of each AI use case before it goes live
  D: Set up an AI steering group to oversee delivery of the strategy
answer: A
explanation:
  why_correct: A strategy without a stated risk appetite gives no basis for deciding how much harm to
    customers, compliance or reputation is acceptable on the way to its targets. A board-set appetite,
    with tolerances, links the strategy to risk management and gives the indicators, assessments and oversight
    that follow a standard to judge against.
  why_not:
    B: Risk indicators show how risk is moving, but without an agreed appetite nobody knows what level
      is acceptable or when to act. They measure against a boundary that has not yet been set.
    C: Use case assessments are needed, but without an appetite they cannot decide whether a given risk
      is acceptable. Each team would judge by its own standard.
    D: A steering group can oversee delivery, but it would steer towards cost and speed targets with no
      agreed limits on risk. The missing element is the boundary itself, not a body to apply it.
