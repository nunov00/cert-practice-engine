id: aair-d1-1.5-0013
subdomain: '1.5'
difficulty: hard
stem: A medical device maker's AI imaging tool passed the conformity assessment that a risk-based regulation
  requires before sale. The team now plans to let the tool keep learning from data at customer sites,
  which would change its performance over time. The assessment covered only the original model. What should
  the risk practitioner advise?
options:
  A: Enable learning with performance monitoring and rollback at each site
  B: Determine whether the change requires a new conformity assessment
  C: Update the technical documentation to describe the learning method
  D: Run a full internal revalidation before the learning is enabled
answer: B
explanation:
  why_correct: Rules for high-risk and medical AI commonly require significant changes after assessment
    to be reassessed, unless the changes were planned and assessed in advance. Continuous learning changes
    the product that was assessed, so the maker must establish its obligations before enabling it.
  why_not:
    A: Monitoring and rollback are good controls, but they do not settle whether the changed product is
      still covered by its assessment.
    C: Documentation will need updating, but describing the change does not answer whether it needs a
      new assessment.
    D: Internal revalidation checks performance at one point. It is not the regulatory assessment, and
      the model keeps changing after it.
