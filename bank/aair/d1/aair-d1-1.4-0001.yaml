id: aair-d1-1.4-0001
subdomain: '1.4'
difficulty: medium
stem: A law firm finds that several associates have been pasting client documents into a free public generative
  AI tool to draft summaries. The firm has no rules on AI use. What should the risk manager recommend
  FIRST?
options:
  A: Issue an acceptable use policy stating which tools and data are permitted
  B: Deploy data loss prevention rules to detect client data in web uploads
  C: Run awareness sessions on generative AI risks for all fee earners
  D: Block access to all generative AI websites from the firm's network
answer: A
explanation:
  why_correct: Staff cannot follow rules that do not exist. A policy that sets which tools may be used
    and which data may never be entered gives a clear standard. Training and technical controls can then
    be built around it.
  why_not:
    B: Detection tools need a policy to define what is allowed. Deploying them first enforces rules that
      have not been decided or communicated.
    C: Awareness helps, but without a policy there is no standard to train against and nothing to hold
      people to. Training supports policy rather than replacing it.
    D: A blanket block ignores a real business need and tends to push use onto personal devices, where
      the firm has even less visibility. It also leaves staff without guidance. An interim instruction
      to stop using the tool can accompany the policy, but a permanent blanket block is not the first
      recommendation.
