id: aair-d1-1.4-0001
subdomain: '1.4'
difficulty: medium
stem: A law firm finds that several associates have been pasting client documents into a free public generative
  AI tool to draft summaries. The general counsel is handling the documents already exposed. The firm
  has no rules on AI use. What should the risk manager recommend FIRST to prevent a repeat?
options:
  A: Issue an acceptable use policy that sets permitted tools and data
  B: Configure data loss prevention to block client data in web uploads
  C: Run role-based training on generative AI risks for fee earners
  D: Procure an enterprise AI tool with contractual confidentiality terms
answer: A
explanation:
  why_correct: With no rules in place, every other control lacks a standard to apply. A policy that states
    which tools may be used and which data may never be entered defines what is allowed. Data loss prevention
    rules, training and the choice of an approved tool can then be built to match it.
  why_not:
    B: Data loss prevention needs a policy to say what counts as a breach. Configuring it first enforces
      rules that nobody has decided or told staff about.
    C: Training needs a standard to teach. Without a policy there is nothing specific to train against
      and nothing to hold people to.
    D: An approved tool is a useful later step, but choosing one needs criteria the policy sets, such
      as which data may go into it. Without the policy, staff still have no rule against using free tools.
