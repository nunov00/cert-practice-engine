subdomain: '1.6'
difficulty: medium
stem: A recruitment agency uses an AI image generator to create pictures for job adverts. A review finds
  that it nearly always shows engineers as young men and care workers as women. The agency wants to keep
  using the tool. What should the risk practitioner recommend?
options:
  A: Stop using the tool for any of the agency's job adverts
  B: Add a note to each advert saying the image is AI-generated
  C: Ask the vendor to confirm the tool's training data was lawful
  D: Set guidance on stereotypes and check images before use
answer: D
explanation:
  why_correct: Stereotyped images can discourage some groups from applying and reinforce social bias.
    Clear guidance and a review step let the agency keep the benefits of the tool while catching and correcting
    stereotyped images before they are published.
  why_not:
    A: Stopping entirely is disproportionate when the harm can be managed through review.
    B: Labelling supports transparency but does nothing about the stereotyped content itself.
    C: Lawfully obtained training data does not mean the outputs are free of stereotypes.
