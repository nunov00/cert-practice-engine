id: aair-d1-1.6-0012
subdomain: '1.6'
difficulty: medium
stem: A recruitment agency uses an AI image generator to create pictures for job adverts. A review finds
  that it nearly always shows engineers as young men and care workers as women. The agency wants to keep
  using the tool. What should the risk practitioner recommend?
options:
  A: Write prompts that ask for diverse people in each advert image
  B: Label each advert image clearly as generated by AI
  C: Switch to a generator whose vendor publishes the results of bias testing
  D: Check each image against stereotype guidance before it is used
answer: D
explanation:
  why_correct: Stereotyped images can discourage some groups from applying and reinforce social bias.
    Guidance and a review step before publication let the agency keep using the tool while catching stereotyped
    images, whatever their cause.
  why_not:
    A: Better prompts reduce the problem, but generators do not follow them reliably, so stereotyped images
      can still reach adverts unchecked.
    B: Labelling supports transparency but does nothing about the stereotyped content itself.
    C: Vendor testing does not guarantee that a given output is free of stereotypes, and the agency would
      still publish without checking.
