id: aair-d1-1.4-0008
subdomain: '1.4'
difficulty: easy
stem: A risk practitioner at a logistics company has drafted the company's first AI policy, which sets
  principles and responsibilities for all AI use. The AI steering group, which advises the chief risk
  officer on AI matters, the chief risk officer and internal audit have each reviewed the draft. Who should
  approve the policy?
options:
  A: The board risk committee, under its delegated authority
  B: The chief risk officer, as the owner of the risk management framework
  C: The AI steering group, as the forum of business unit heads
  D: The chief information officer, who runs most of the AI systems
answer: A
explanation:
  why_correct: An enterprise policy binds every function, so it needs approval from a body with authority
    over all of them. A board committee acting under authority delegated by the board has that standing
    and shows leadership commitment. The other reviewers advise or recommend, and their input goes to
    that committee.
  why_not:
    B: The chief risk officer can sponsor and recommend the policy but cannot bind other functions alone.
      A policy for all AI use needs approval above any single executive.
    C: The steering group brings the right people and should endorse the draft, but it is an advisory
      forum. An advisory forum does not hold the authority to bind every function that approval requires.
    D: The chief information officer delivers much of the technology the policy governs. Approving rules
      for their own area would lack independence, and the role has no authority over other functions.
