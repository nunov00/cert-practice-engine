id: aair-d1-1.3-0013
subdomain: '1.3'
difficulty: hard
stem: At a mortgage lender, a document-reading model owned by operations extracts income figures from
  payslips for several teams, and a credit model owned by the lending division uses those figures. A change
  to the extraction model led to income being understated for some applicants, and each owner says the
  other was responsible. What is the BEST way to prevent a repeat?
options:
  A: Make the lending division accountable for both of the models
  B: Add checks in the credit model for unusual shifts in income data
  C: Have the model risk team validate each change to the extraction model
  D: Agree each owner's duties at the hand-off, with notice of changes
answer: D
explanation:
  why_correct: Where one model's output feeds another, accountability must be clear at the interface.
    The upstream owner commits to output quality and to giving notice of changes, and the downstream owner
    commits to checking the data is fit for its use. Recording these duties keeps each owner accountable
    while the dependency is managed.
  why_not:
    A: The extraction model serves several teams, so moving it to lending would leave their needs unowned,
      and it would still not define how changes are agreed.
    B: Input checks are a good downstream control, but they catch problems only after a change lands,
      and they leave the upstream owner with no duty to warn of changes.
    C: Second-line validation may catch some problems, but it moves first-line work to the risk team and
      still does not define who must notify whom.
