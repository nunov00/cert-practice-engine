id: aair-d1-1.1-0011
subdomain: '1.1'
difficulty: hard
stem: A regional hospital's new AI strategy commits it to building its own diagnostic support models over
  the next three years. The hospital has two data scientists, no staff to run models in production and
  no experience of validating clinical models. What should the risk practitioner recommend?
options:
  A: Start with one pilot model to build experience before scaling up
  B: Require external validation of each model before clinical use
  C: Assess whether building in-house fits the hospital's capabilities
  D: Assess the expected clinical benefit of each planned model first
answer: C
explanation:
  why_correct: The strategy depends on capabilities the hospital lacks, in building, validating and running
    models. Assessing that gap shows whether to build, buy, partner or invest in skills first, so the
    strategy is realistic and its delivery and patient safety risks are understood before the hospital
    commits to it.
  why_not:
    A: A pilot is a sound way to learn, but even one clinical model needs validation and production skills
      the hospital does not have. It tests the approach before asking whether the approach fits.
    B: External validation covers one gap, but the hospital still has no staff to run and monitor models
      in production. It also assumes the build strategy is right.
    D: Benefit matters, but it answers a different question. A valuable model the hospital cannot build
      or run safely is still a risk.
