id: aair-d1-1.3-0003
subdomain: '1.3'
difficulty: medium
stem: A logistics group's board wants to strengthen its oversight of AI as the company expands its use
  of the technology. Which role is MOST appropriate for the board?
options:
  A: Set the AI risk appetite and monitor management against it
  B: Approve AI models rated high risk before they are deployed
  C: Require yearly training for directors on AI technology trends
  D: Review an independent assessment of each key AI system's design
answer: A
explanation:
  why_correct: The board's job is direction and oversight. Setting how much AI risk the company will accept,
    and holding management to account against it through regular reporting, lets the board steer the expanding
    use of AI. Approvals and design work belong to management.
  why_not:
    B: Limiting approvals to high-risk models seems proportionate, but it is still an operational decision.
      It draws the board into management and blurs who is accountable for the model.
    C: Director training builds the knowledge needed for oversight, but it is a support for the board's
      role, not the role itself.
    D: Design assessments are detailed technical assurance for management and specialists. Reviewing them
      system by system is not an effective use of the board's oversight.
