stem: A logistics group's board wants to strengthen its oversight of AI as the company expands its use
  of the technology. Which role is MOST appropriate for the board?
options:
  A: Set AI risk appetite and oversee reporting on major risks
  B: Approve each AI model before it is deployed in the business
  C: Delegate all AI matters to the chief technology officer
  D: Review the design documents of the main AI systems in use
answer: A
explanation:
  why_correct: 'The board''s job is direction and oversight: setting how much AI risk the company will
    accept and holding management to account through regular reporting on the most significant risks.
    Detailed approvals and design work belong to management.'
  why_not:
    B: Approving each model is an operational task. It would overload the board and blur the line between
      oversight and management.
    C: The board can delegate execution, but it cannot hand off its oversight duty entirely. It still
      needs to set appetite and receive reporting.
    D: Reviewing design documents is technical work for specialists, not an effective use of the board's
      oversight role.
