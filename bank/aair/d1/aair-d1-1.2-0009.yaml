subdomain: '1.2'
difficulty: medium
stem: At a health insurer, a team launching an AI feature must complete a privacy impact assessment, a
  security review and an AI risk assessment, each with its own form and many repeated questions. Some
  teams now skip the AI assessment, and the three groups of reviewers rarely share findings. What should
  the risk practitioner recommend?
options:
  A: Make the AI risk assessment a release gate tracked by the change board
  B: Add the AI risk questions to the privacy impact assessment form
  C: Create one intake with shared questions that routes to each review
  D: Hold a monthly forum where the three review groups share findings
answer: C
explanation:
  why_correct: A single intake removes the duplicated effort that is driving teams to skip steps, and
    routes each case to the right specialists, who can then see each other's findings. It aligns the AI
    assessment with existing processes instead of adding another separate hurdle.
  why_not:
    A: A gate may raise completion rates, but it leaves the duplication that causes the problem and does
      nothing about reviewers not sharing findings.
    B: Folding AI questions into the privacy form reduces forms, but it sends AI risk to privacy reviewers
      and leaves the security review duplicated and separate.
    D: A forum helps reviewers share findings, but teams still fill in three forms with repeated questions,
      so the reason for skipping remains.
