id: aair-d1-1.6-0001
subdomain: '1.6'
difficulty: medium
stem: A utility company plans to replace its web chat agents with an AI chatbot that writes in a friendly,
  human style. Which measure BEST supports transparency towards customers?
options:
  A: Offer customers a clear option to switch to a human agent
  B: Publish a plain-language page on how the chatbot uses customer data
  C: Show a confidence score with each answer the chatbot gives
  D: Tell customers at the start that they are chatting with an AI
answer: D
explanation:
  why_correct: Transparency starts with people knowing when they are dealing with AI, so they can judge
    the answers and ask for a person if needed. A human-like style makes this disclosure more important,
    and many regulations and ethics frameworks expect it.
  why_not:
    A: A route to a person is good practice, but customers who think they are already talking to a person
      will not know to use it.
    B: A data page supports transparency about processing, but most customers will not read it, and it
      does not tell them in the moment that they face a machine.
    C: Confidence scores help judge answers but do not say the answers come from AI, and many customers
      would not understand them.
