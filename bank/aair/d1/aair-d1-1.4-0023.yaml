subdomain: '1.4'
difficulty: hard
stem: A hospital's pathologists check the grades an AI tool suggests for tissue slides. All of them attended a workshop on
  over-reliance on AI and can describe the problem accurately. Audits since then show they accept the tool's wrong grades
  as often as before. Which training change is MOST likely to help?
options:
  A: Refresher workshops on over-reliance, with a short test at the end
  B: Case studies of incidents where over-reliance on AI harmed patients
  C: Practice on slides with planted wrong grades, with feedback on misses
  D: An e-learning module on how the tool works and where it fails
answer: C
explanation:
  why_correct: The pathologists already understand over-reliance, yet their behaviour has not changed, so the gap is habit
    and skill rather than knowledge. Practice on realistic slides with planted wrong grades, and feedback on each one missed,
    trains the act of challenging a suggestion under working conditions and shows each person their own miss rate.
  why_not:
    A: A refresher with a test would confirm what they know, but the audits show that knowing about over-reliance has not
      changed how they review the tool's grades.
    B: Case studies make the stakes vivid and suit staff who doubt the risk, but these pathologists already accept and can
      explain it. More awareness does not build the habit of challenge.
    D: Knowing how the tool works and fails is useful background, but it is more knowledge for people whose problem is not
      a lack of knowledge.
