subdomain: '1.4'
difficulty: hard
stem: An insurer is training claims handlers to use an AI tool that turns claim files, often 40 pages long, into summaries
  of at most 150 words. Handlers decide routine claims from the summary and open the full file only when something in it looks
  wrong. Which training topic is MOST important?
options:
  A: Spotting facts and figures that the tool may have invented
  B: Checking the file for conditions the summary may have left out
  C: Recognising wording that signals the tool was unsure of an answer
  D: Knowing which claim types the tool is approved to summarise
answer: B
explanation:
  why_correct: Squeezing 40 pages into 150 words means the tool must drop content, and a missing exclusion or condition leaves
    nothing in the summary that looks wrong. Since handlers open the file only when something looks wrong, omissions pass
    straight into decisions. Training them on where key conditions sit in a file, and to check for them, targets the error
    their way of working will not catch.
  why_not:
    A: Invented content is a known risk of generative tools and worth covering, but an invented fact can look odd and prompt
      a check. Omissions leave no such signal under this way of working.
    C: Hedged wording can hint at weak output, but summarisers often state uncertain or incomplete content confidently, so
      this signal is unreliable.
    D: Knowing the approved scope matters, but the handlers already work on routine claims, and the risk described arises
      inside that scope.
