id: aair-d1-1.6-0010
subdomain: '1.6'
difficulty: medium
stem: A home insurer removed ethnicity from its pricing model's inputs to avoid unfair treatment. The
  model still uses postcode and the language customers choose for correspondence. The pricing team says
  the model is fair because it cannot see ethnicity. What should the risk practitioner advise?
options:
  A: Remove postcode and correspondence language from the inputs
  B: Review each input with the pricing team for business justification
  C: Measure pricing outcomes across ethnic groups
  D: Have an independent reviewer confirm ethnicity is fully excluded
answer: C
explanation:
  why_correct: Removing a protected attribute does not prevent indirect discrimination, because inputs
    such as postcode or language can be closely correlated with it. Measuring outcomes across groups shows
    whether the model treats them unfairly and which proxies must be removed or justified. Using or estimating
    ethnicity for this test needs a lawful basis and safeguards.
  why_not:
    A: These two inputs may be proxies, but other inputs may be too, and postcode may carry legitimate
      risk information. Removing them without measuring outcomes may not fix the problem.
    B: Justifying inputs matters, but without outcome data the review cannot show whether any input leads
      to unfair prices.
    D: Confirming that ethnicity is excluded checks the inputs, which is the step already taken. It does
      not show whether other inputs reproduce the same effect.
