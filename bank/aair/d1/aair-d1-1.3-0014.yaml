id: aair-d1-1.3-0014
subdomain: '1.3'
difficulty: medium
stem: At a consumer bank, the second-line AI risk team is asked to build and run drift monitoring for
  all production models, because it has the right skills. Model owners would then rely on the risk team's
  alerts. What is the MAIN concern with this arrangement?
options:
  A: The risk team's budget may not cover running the monitoring tools
  B: The risk team would run a control it is meant to challenge
  C: Alert thresholds may not suit each model's particular business use
  D: Central monitoring may miss data issues only owners can see
answer: B
explanation:
  why_correct: The second line sets standards and independently challenges first-line controls. If it
    builds and runs the monitoring itself, it takes on a first-line role and can no longer give an independent
    view of whether monitoring works, while model owners lose ownership of their models' performance.
  why_not:
    A: Budget is a practical constraint that can be solved. The structural problem of lost independence
      would remain even with enough funding.
    C: Thresholds do need input from owners, but that is a design point that can be fixed with consultation.
      It does not touch who runs the control.
    D: Owners do have context the centre lacks, which is a reason for them to run monitoring, but the
      main concern is the loss of independent challenge.
