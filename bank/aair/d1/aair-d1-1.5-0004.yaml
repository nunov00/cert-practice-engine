id: aair-d1-1.5-0004
subdomain: '1.5'
difficulty: medium
stem: A marketing agency plans to use an AI image generator to produce campaign visuals. Its client contracts
  warrant that all delivered work is original and does not infringe third-party rights. What should the
  risk practitioner advise before the tool is used for client work?
options:
  A: Choose a tool whose vendor indemnifies users against IP claims
  B: Use the tool only for internal concepts, not delivered work
  C: Run similarity checks on each image against known protected works
  D: Review the tool's terms against the client warranties with counsel
answer: D
explanation:
  why_correct: The warranties create legal exposure if generated images infringe others' rights or cannot
    be owned as promised. Comparing the tool's terms on ownership and indemnity with the client contracts
    lets the agency decide how, or whether, to use it and whether its contract terms need to change.
  why_not:
    A: An indemnity helps, but its limits and conditions vary, and it may not cover a warranty that the
      work is original. That can only be known by comparing the terms with the contracts.
    B: Avoiding client use removes the risk, but it also removes the purpose. The question is whether
      the tool can be used for client work, and that needs the legal review.
    C: Similarity checks can catch some close copies but not all protected elements. They also do not
      settle who owns the output or whether the warranties can be given.
