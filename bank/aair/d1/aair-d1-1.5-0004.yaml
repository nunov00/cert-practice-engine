id: aair-d1-1.5-0004
subdomain: '1.5'
difficulty: medium
stem: A marketing agency plans to use an AI image generator to produce campaign visuals. Its client contracts
  warrant that all delivered work is original and does not infringe third-party rights. What should the
  risk practitioner advise before the tool is used for client work?
options:
  A: Rely on the vendor's statement that outputs are free for commercial use
  B: Use the tool only for campaigns with a small media budget
  C: Have designers substantially rework each image before delivery
  D: Review the tool's terms and the client warranties with legal counsel
answer: D
explanation:
  why_correct: The warranties create legal exposure if generated images infringe others' rights or cannot
    be owned as promised. Reviewing the tool's terms on ownership and indemnity alongside the client contracts
    lets the agency decide how, or whether, to use it and whether its contract terms need to change.
  why_not:
    A: A permission to use outputs commercially does not promise that they infringe no one's rights, and
      the agency's warranties to clients go further than the vendor's terms may cover.
    B: A small budget does not reduce infringement exposure. A warranty breach applies whatever the campaign
      spend.
    C: Reworking an image does not remove protected elements it may reproduce, and it does not settle
      who owns the output or whether the warranties can be given.
