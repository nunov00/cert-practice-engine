id: aair-d1-1.4-0003
subdomain: '1.4'
difficulty: medium
stem: A bank gave all staff the same short course on AI awareness. A review finds that credit officers
  accept model outputs they should challenge, and developers misapply the bank's model standards. Both
  groups know the standards exist. What should the risk practitioner recommend?
options:
  A: Add a scored test to the course and report pass rates to management
  B: Add training modules aimed at the AI duties of each of these roles
  C: Make completion of the course a condition of access to model tools
  D: Issue procedures that set out each role's AI responsibilities
answer: B
explanation:
  why_correct: The gap is skill, not awareness. Officers need to know how to judge and challenge outputs,
    and developers need to know how to apply the standards. Training built around each role's duties targets
    those skills directly.
  why_not:
    A: A test measures whether people remember the general course. It does not add the role-specific skills
      the review found missing.
    C: Gating access ensures people take the course, but they have already taken it. The content is the
      problem, not attendance.
    D: Both groups already know the standards exist. More written duties tell them what to do but do not
      build the skill to do it.
