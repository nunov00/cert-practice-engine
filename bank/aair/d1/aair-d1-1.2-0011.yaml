id: aair-d1-1.2-0011
subdomain: '1.2'
difficulty: medium
stem: A motor insurer added an AI model that reads incoming claim documents and routes each claim to the
  right team. Claims it cannot classify with enough confidence go to an 'unresolved' queue. Months later,
  hundreds of claims in that queue are past their legal response deadlines. The queue receives about 8%
  of claims, as testing predicted, and 96% of routed claims reach the right team. What does this MOST
  likely indicate?
options:
  A: The confidence threshold is set too high for the current claim mix
  B: Model performance has drifted since the model went live
  C: Handlers need more training on how the routing model works
  D: Handling of exceptions was left out of the process redesign
answer: D
explanation:
  why_correct: Adding AI to a process changes the workflow around it. The model is performing as tested,
    so the failure lies in the exception path. Claims the model cannot handle were never given an owner,
    capacity or deadline tracking, which is a gap in how the process was redesigned around the model.
  why_not:
    A: The queue receives the share of claims testing predicted, so the threshold is working as designed.
      A lower one would send more claims to the wrong team, and those still queued would remain unhandled.
    B: Routing accuracy is high and the queue rate matches testing, so there is no sign of drift. The
      claims are late because nobody works the queue, not because the model changed.
    C: Training helps handlers work with the model, but the late claims sit in a queue no team is assigned
      to. Handler skill does not explain why it was never worked.
