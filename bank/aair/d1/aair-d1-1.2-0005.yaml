id: aair-d1-1.2-0005
subdomain: '1.2'
difficulty: medium
stem: An energy company approves AI business cases on build cost and expected benefits. Several models
  approved last year now have no budget for monitoring or retraining, and their performance is falling.
  Which change to the investment process would BEST address this?
options:
  A: Create a central budget line to fund monitoring of production models
  B: Require a performance review of each model a year after approval
  C: Require business cases to cost upkeep over each model's life
  D: Make monitoring a condition of deployment in the model risk policy
answer: C
explanation:
  why_correct: AI models need ongoing monitoring, retraining and eventual retirement. Including these
    costs in the business case gives decision makers a true view of value and makes sure funding for the
    controls is agreed when each model is approved.
  why_not:
    A: A central budget helps, but it is not tied to each approval, so business cases still overstate
      value and the pot may not match what the approved models need. Monitoring competes with other demands
      when money is tight.
    B: A yearly review would detect falling performance, but it does not fund the work needed to fix it.
      The approval process still ignores ongoing costs.
    D: A policy requirement sets the expectation, but the stem's problem is that no budget exists. Without
      funding agreed at approval, the condition is hard to meet.
