id: cissp-d6-6.2-0004
subdomain: "6.2"
difficulty: medium
stem: A medical imaging company's file-parsing library crashed when a hospital sent it a corrupted scan file. The team
  fixed that bug and wants to find other malformed files that could crash the parser or corrupt memory before the next
  release. Which testing approach BEST fits?
options:
  A: Taint-tracking static analysis from file input to memory writes
  B: Coverage-guided fuzzing seeded with the regression file corpus
  C: Property-based tests generating files valid under the format grammar
  D: Memory-sanitiser builds running the existing regression file corpus
answer: B
explanation:
  why_correct: The goal is to find unknown inputs that break the parser. Coverage-guided fuzzing, seeded with known
    files, feeds it large numbers of mutated files, steering towards new code paths, and reports the inputs that crash it or corrupt memory.
  why_not:
    A: Taint tracking can flag paths where file data reaches memory writes unchecked, but it does not run the parser, reports
      many paths that cannot be reached, and misses faults that depend on the exact input.
    C: Property-based tests generate many inputs automatically, but files that are valid under the format grammar are not the
      malformed files the team needs, and the crash came from a corrupted one.
    D: Sanitisers make memory corruption visible when it happens, but running them on the existing corpus tests only inputs
      the team already has, not the unknown malformed files it wants to find.
