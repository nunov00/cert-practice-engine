id: cissp-d6-6.1-0017
subdomain: '6.1'
difficulty: hard
stem: Internal audit at an insurer is planning its yearly test of user access reviews. Until June, system owners reviewed
  access each quarter in spreadsheets, a process last year's audit found effective. Since July, an identity governance tool
  has run the reviews, sending each user's access to that user's manager to confirm. The audit committee wants assurance
  over the whole year. Which test design BEST fits?
options:
  A: Test a sample of the tool's reviews, and roll forward last year's tests of the spreadsheets
  B: Draw one random sample of reviews from across the year, whichever method produced each
  C: Test a sample from each method, drawn only from the months that method was in use
  D: Test a sample of the tool's reviews, and cover January to June by inquiry of system owners
answer: C
explanation:
  why_correct: The control changed in July, so the year holds two different controls, run by different people in different
    ways. Assurance over the whole year needs each one tested as its own population, with a sample from the months it
    operated this year, so the audit can conclude on each and say whether the control worked before and after the change.
  why_not:
    A: Relying on earlier work saves effort on a control that did not change, but last year's tests show how the spreadsheet
      reviews ran last year. A manual quarterly control needs evidence that it operated in this year's first half, when owners
      knew it was about to be replaced.
    B: A sample drawn from the whole year looks like full coverage, but it mixes two controls in one population, so it may
      hold too few items from either to support a conclusion, and a failure cannot be traced to the method that caused it.
    D: Inquiry is a valid part of testing and cheap for a retired process, but on its own it cannot show that a control
      operated, so the first half would rest on what owners say. Quarterly reviews leave records, such as signed-off
      spreadsheets, that the audit should inspect, and if those records no longer exist, that is itself a finding.
