id: cissp-d6-6.3-0015
subdomain: '6.3'
difficulty: hard
stem: A group CISO must tell the board, at its meeting in six weeks, which of four subsidiaries most needs more investment
  in patching. One reports 97% of servers patched within 30 days of a fix's release, another 71% of all devices patched
  within 14 days, and the other two use measures of their own. Each subsidiary runs its own scanner. What should the CISO
  do FIRST?
options:
  A: Have internal audit check each subsidiary's reported figure against its source records
  B: Set one definition of the measure, and have each subsidiary recompute it from its scan data
  C: Roll out one scanning tool across the group, feeding a single central dashboard
  D: Compare the subsidiaries by the trend in each one's own figure over the past year
answer: B
explanation:
  why_correct: The four figures count different assets against different deadlines, so they cannot be ranked against each
    other, and the 71% may describe a better patching record than the 97%. Agreeing one definition, covering which assets
    count, when the clock starts and the deadline, and having each subsidiary recompute it from the scan data it already
    holds, gives comparable numbers in time for the board.
  why_not:
    A: Checking figures against their sources confirms that each one is accurate, but four accurate figures measured in
      different ways still cannot be compared.
    C: One tool and one dashboard would give consistent data for the future, but a group-wide rollout takes far longer than
      six weeks, and it still needs a common definition of what is measured.
    D: Trends avoid comparing unlike levels, but each trend still reflects only what that subsidiary chose to measure, and
      a subsidiary improving from a poor position may need more investment than one that is flat at a good level.
