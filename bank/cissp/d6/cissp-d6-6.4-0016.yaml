subdomain: '6.4'
difficulty: medium
stem: A penetration test of a ticketing company's mobile API found six high-risk flaws two weeks before launch. To fix one
  of them, the developers replaced the API's session-handling library, and they now report all six fixed. The contract provides
  a retest of the reported findings, and a full new test would take four weeks. What should the test lead recommend for the
  retest?
options:
  A: Retest the six findings as the contract provides, reporting each closed or open
  B: Retest the six findings and the session handling the new library now provides
  C: Run a full new test of the API before launch, moving the launch date if needed
  D: Review the developers' unit tests for each fix, retesting any fix they miss
answer: B
explanation:
  why_correct: A retest normally checks only the reported findings, but replacing the session library changed authentication
    and session behaviour across the whole API, which the original test examined under different code. Extending the retest
    to the new session handling covers the area most likely to hold new flaws, within the time left before launch.
  why_not:
    A: Retesting only the findings is the usual scope, but it would leave the new session handling, which every authenticated
      call depends on, untested before launch.
    C: A full test gives the broadest assurance, but most of the API did not change, and four weeks would delay the launch
      to re-cover areas the original test already examined.
    D: Unit tests show the behaviour the developers intended, but the same team wrote them and they rarely probe session attacks,
      so they do not replace an independent check of the new library.
