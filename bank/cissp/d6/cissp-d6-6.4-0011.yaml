difficulty: easy
stem: A retailer's quarterly scan reported 3,000 findings, and the team can fix about 100 this month. Its customer
  database servers accept connections only from the application servers, which in turn accept them only from the web
  servers facing the internet. Which group of findings should the report put FIRST for fixing?
options:
  A: Findings with a critical base score on the customer database servers
  B: Findings on the known-exploited list on the internet-facing web servers
  C: Findings with a high exploit prediction score on the internet-facing web servers
  D: Findings with public exploit code on the internet-facing web servers
answer: B
explanation:
  why_correct: Two things drive the real risk here. The database servers can be reached only by going through the web and
    application tiers, so the internet-facing servers are where an attack would start, and a flaw already being
    exploited elsewhere is far more likely to be used than one that merely scores high. Fixing exploited flaws on the
    exposed tier first removes the likeliest way in.
  why_not:
    A: The database servers hold the most valuable data, and a critical base score signals severe impact, but an attacker
      would first need a way through the web and application tiers, and the base score does not show that the flaw is
      being exploited.
    C: Exposure is the right focus, and a high exploit prediction score is a useful signal, but it estimates the chance
      of future attacks, while flaws on the known-exploited list are confirmed to be in use now.
    D: Exposure is the right focus, and public exploit code makes attacks easier, but code being available does not show
      that attackers are using it, while flaws on the known-exploited list are confirmed to be in use now.
