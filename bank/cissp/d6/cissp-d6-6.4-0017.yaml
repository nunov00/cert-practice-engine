stem: A bank's first static analysis scan of its 40 application repositories reports 9,000 findings. The development teams
  can fix about 200 findings a month between them, and they merge code changes many times a day. Which findings should the
  report to the teams put FIRST?
options:
  A: The findings rated most severe, with fix dates set by severity for each team
  B: The findings in internet-facing applications, ranked by severity within each team
  C: The findings that each new change introduces, with the existing ones as a backlog
  D: The finding types that occur most often, with training for the teams on each type
answer: C
explanation:
  why_correct: At about 200 fixes a month, clearing 9,000 findings takes years, and teams merging many times a day add new
    flaws all the while, so a backlog worked from the top never shrinks. Reporting what each change introduces stops the
    growth at the point where fixing is cheapest, because the developer still has the code open. The existing findings then
    form a fixed backlog that can be ranked and worked down.
  why_not:
    A: Severity ranking is the usual way to order a backlog, but with new findings arriving every day the list keeps
      growing, and severity alone ignores whether the code is reachable by an attacker.
    B: Ranking by exposure is a strong way to order the existing backlog, but it leaves the teams adding new flaws with each
      change, so the backlog grows faster than it is worked down.
    D: Fixing by type and training developers address causes and help in the long term, but they do not stop flaws entering
      the code from tomorrow's changes, and the most common types are not necessarily the most dangerous.
