subdomain: '6.4'
difficulty: hard
stem: A bank has added static analysis to the build pipeline of its 40 customer web and mobile apps, all reachable from
  the internet. The first run over the existing code reports findings in the thousands, far more than the teams could
  clear in a year alongside feature work, and the teams merge code changes many times a day. Which findings should the
  teams be asked to address FIRST?
options:
  A: The findings rated most severe, with fix dates set by severity for each team
  B: The findings in code that handles payments, ranked by severity within each team
  C: The findings that each new change introduces, with the existing ones as a backlog
  D: The finding types that occur most often, with training for the teams on each type
answer: C
explanation:
  why_correct: A backlog this size takes years to clear at the teams' pace, and with changes merged many times a day, new
    flaws arrive all the while, so a list worked from the top never shrinks. Requiring each change to add no new findings
    stops the growth where fixing is cheapest, because the developer still has the code open. The existing findings then
    form a fixed backlog to rank and work down. That does not mean old findings simply wait their turn. A critical,
    exploitable finding already in the code still gets urgent handling, put at the top of the backlog and fixed out of
    the normal order. Since every app faces the internet, exposure does not separate them; severity, exploitability and
    the data the code handles rank the backlog.
  why_not:
    A: Severity is the usual way to order a backlog, and the most severe exploitable findings do need fixing quickly, but
      with new findings arriving every day, a list worked only from the top keeps growing.
    B: Ranking by the data the code handles is a sound way to order the existing backlog, and payment code is a natural
      place to start, but it leaves each change free to add new flaws, so the backlog grows faster than it is worked down.
    D: Fixing by type and training developers address causes and help in the long term, but they do not stop flaws entering
      the code from tomorrow's changes, and the most common types are not necessarily the most dangerous.
