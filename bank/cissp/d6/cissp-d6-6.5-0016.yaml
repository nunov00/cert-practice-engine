id: cissp-d6-6.5-0016
subdomain: '6.5'
difficulty: hard
stem: Midway through an audit of a trading firm's market-data entitlements, the head of trading refuses auditors read access
  to the entitlement system, citing client confidentiality, and offers a summary report that his team prepares instead. The
  audit charter, approved by the board's audit committee, gives internal audit unrestricted access to records and systems.
  The report is due in three weeks. What should the lead auditor do NEXT?
options:
  A: Accept the team's summary report, testing its totals against billing records
  B: Report a scope limitation, stating which tests could not be performed
  C: Request read access through the CIO, who runs the system's administration
  D: Raise the refusal with the chief audit executive under the charter
answer: D
explanation:
  why_correct: The charter gives internal audit a right of access that a business head cannot override, and enforcing it is
    a matter for the chief audit executive, who reports to the audit committee that approved it. Escalating now, with three
    weeks left, gives the chance to get direct access and complete the planned tests.
  why_not:
    A: Checking a summary against billing records is a recognised alternative procedure, but evidence prepared by the audited
      team is weaker than direct access, and accepting it gives up a right the charter already grants.
    B: A scope limitation is the right way to report access that is finally refused, but reporting it now accepts the refusal
      before the charter has been used to overcome it.
    C: The CIO can grant the technical access, but the refusal came from the business owner, and going around him through
      IT leaves the dispute unresolved rather than settled through the audit's own reporting line.
