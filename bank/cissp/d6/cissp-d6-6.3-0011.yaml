id: cissp-d6-6.3-0011
subdomain: '6.3'
difficulty: hard
stem: A company's backup jobs all succeed, and quarterly restore tests meet every recovery time objective. At a peer firm,
  ransomware operators with domain administrator rights signed in to the backup console, which accepts domain accounts,
  shortened the retention on copies marked immutable and then deleted them. The board asks whether the company's backups
  would survive the same attack. Which data BEST answers this?
options:
  A: Share of critical systems with a backup copy held offsite at a second data centre
  B: Share of critical systems whose backup copies are set as immutable
  C: Share of critical systems whose backups are encrypted with vault-held keys
  D: Share of critical systems with copies that resisted a domain admin deletion test
answer: D
explanation:
  why_correct: The board's question is whether an attacker holding domain administrator rights could destroy the copies.
    A controlled test that tries, with such an account, to shorten retention on and delete each critical system's copies
    measures exactly that, through every path the attacker would use, including the backup console, rather than inferring
    it from settings.
  why_not:
    A: A copy at a second site survives the loss of a building, but if it is managed through the same console and accounts,
      an attacker with domain rights can delete it as easily as the local copy.
    B: The immutable setting is what the peer firm also had. Whether it holds depends on who can change retention, which the
      setting alone does not show.
    C: Encryption keeps stolen copies unreadable, but it does nothing to stop an administrator deleting them, which is how
      the peer firm lost its backups.
