stem: External auditors of a SaaS firm want to collect configuration evidence directly from its production cloud account,
  saying that screenshots supplied by staff could be altered. The cloud team proposes giving them an administrator account
  for the audit period. What should the security manager provide?
options:
  A: A time-limited read-only audit role, with its activity logged
  B: Configuration exports signed off by the cloud team lead
  C: The administrator account for the audit period, with activity logged
  D: The cloud provider's compliance reports for the account's services
answer: A
explanation:
  why_correct: Read-only access lets the auditors gather evidence first-hand, which meets their concern, while least privilege
    and logging protect production during the audit.
  why_not:
    B: Exports produced and signed by staff are still evidence prepared by the auditee, which is what the auditors are worried
      about.
    C: Administrator rights let auditors change production, far beyond what gathering evidence needs, and logging only records
      changes after they happen.
    D: The provider's reports cover the provider's own controls, not how the firm has configured its account.
