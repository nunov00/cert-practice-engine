stem: A hospital's monthly scan keeps reporting a critical remote code execution flaw on 30 infusion pump gateways. The
  vendor has ended support and will release no fix, and replacements are funded for 18 months from now. The security
  manager designed a segment that now isolates the gateways and judges the remaining risk low. How should the analyst
  record the finding in this month's report?
options:
  A: As an exception approved by the gateways' business owner, with a review date
  B: As closed and mitigated, citing the segment that now isolates the gateways
  C: As an exception approved by the security manager, with a review date
  D: As open and critical, reported again each quarter until the replacement arrives
answer: A
explanation:
  why_correct: The flaw is real and cannot be fixed for 18 months, so the residual risk has to be accepted for that time.
    Accepting risk is a decision for the business owner of the gateways, who owns the clinical service and its risk,
    informed by the security manager's view of the segment. A recorded exception with a review date keeps the finding
    visible and brings it back before the replacement.
  why_not:
    B: Segmentation reduces the exposure, but the vulnerable software is still running, so closing the finding would
      misstate the position and drop it from tracking.
    C: The security manager's assessment is valuable input, but the manager designed the control being relied on and does
      not own the clinical risk, so the acceptance belongs with the business owner.
    D: Keeping it open is honest, but with no fix coming it would repeat as critical for 18 months without anyone deciding
      to accept the risk, and it adds noise that hides findings that can be fixed.
