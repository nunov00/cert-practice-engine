id: cissp-d6-6.5-0005
subdomain: '6.5'
difficulty: hard
stem: A hospital uses 60 cloud suppliers and has staff for six supplier audits this year. Fourteen of the suppliers hold patient
  records, and most of these send current SOC 2 Type II reports covering the hospital's services, which its supplier policy
  accepts as audit evidence. Which suppliers should the hospital audit FIRST?
options:
  A: Patient-record holders that hold the largest volumes of records
  B: Patient-record holders that provide no independent assurance report
  C: Patient-record holders whose SOC 2 reports list control exceptions
  D: Patient-record holders that support the most critical clinical services
answer: B
explanation:
  why_correct: All fourteen carry high risk, so the question is where an audit adds assurance the hospital does not already
    have. Most send reports the policy accepts as evidence; the holders that send none are the ones whose controls the hospital
    knows nothing about, so the six audits do most there.
  why_not:
    A: Ranking by data volume is the usual way to aim audits, but most of the high-risk holders already provide reports the
      policy accepts, so auditing the largest ones would mostly repeat evidence the hospital holds.
    C: Exceptions are a real signal of weakness, but the report already tells the hospital what failed and how the supplier
      responded. That is followed up through remediation evidence and the next report, while suppliers with no report remain
      unknown.
    D: Clinical criticality matters for availability risk, but those suppliers may well be covered by accepted reports too,
      and ranking on criticality alone ignores which suppliers the hospital already has assurance over.
