stem: Owners of a finance system completed the quarterly review of its 4,000 user entitlements on time and confirmed
  99.8% of them as still needed. Internal audit asks whether the owners actually examine each entitlement. Which data
  would BEST answer this?
options:
  A: Median time each reviewer spent per entitlement
  B: Share of entitlements reviewed by a delegate
  C: Number of entitlements assigned to each reviewer
  D: Share of reviews completed by the deadline
answer: A
explanation:
  why_correct: The question is whether each item gets real attention. Time spent per entitlement, shown for each reviewer,
    reveals reviewers who confirm hundreds of rights in seconds, which a near-total confirmation rate already hints at.
  why_not:
    B: Delegation shows who did the review, which matters for accountability, but a delegate can examine items carefully and
      an owner can rubber-stamp them.
    C: Workload per reviewer helps explain why reviews might be rushed, but it does not show whether they were.
    D: Timeliness is already confirmed and says nothing about how carefully each entitlement was examined.
