difficulty: medium
stem: Managers completed all of last quarter's access recertifications on time. A later audit found many leavers' and
  movers' rights still active in the systems that were reviewed. Which data would BEST show whether the reviews are
  effective?
options:
  A: On-time completion rate of the reviews
  B: Revocation rate and time spent per reviewer
  C: Number of systems in the review campaign
  D: Number of access requests approved
answer: B
explanation:
  why_correct: Completion is already full, yet stale rights survived, which suggests rubber-stamping. A reviewer who
    revokes nothing across hundreds of entitlements, in a few minutes, is not really reviewing; these figures show which
    reviews are working.
  why_not:
    A: Completion is already at its maximum and the audit still found stale rights, so it cannot tell effective reviews from
      rubber stamps.
    C: The number of systems shows the campaign's scope, not whether managers actually remove rights that are no longer
      needed.
    D: Approved requests measure access being granted, not whether reviews remove access that should end.
