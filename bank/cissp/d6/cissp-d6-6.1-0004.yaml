subdomain: '6.1'
difficulty: easy
stem: A retailer has agreed the scope of its annual penetration test with the CIO. It covers the retailer's web shop on a
  public cloud's virtual machines and the login pages and API of the SaaS CRM it subscribes to. Testing starts in three weeks.
  What should the security manager do FIRST?
options:
  A: Confirm that the CRM provider permits testing and obtain written authorisation
  B: Decide whether the SOC will be told the dates of the test in advance
  C: Obtain the CIO's signed authorisation, covering the full scope agreed for the test
  D: Agree a test window outside the retailer's peak trading hours
answer: A
explanation:
  why_correct: The retailer does not own the SaaS CRM, so its CIO cannot authorise attacks on it. Testing without the provider's
    permission may be unlawful and breach its terms, so authorisation from the provider, and a check of the cloud provider's
    testing policy, must come before the other planning choices.
  why_not:
    B: Deciding whether to tell the SOC shapes what the test measures, but it is a planning choice that matters only once
      the test is lawful to run.
    C: Signed authorisation from the CIO is essential for the retailer's own systems, but the CIO cannot authorise testing
      of systems the SaaS provider owns and runs, so it does not cover the CRM.
    D: Scheduling around peak hours limits business disruption, but the CRM part of the test cannot go ahead without the provider's
      permission.
