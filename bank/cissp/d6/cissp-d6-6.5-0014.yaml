id: cissp-d6-6.5-0014
subdomain: '6.5'
difficulty: hard
stem: An auditor is testing a daily bank reconciliation control across a twelve-month audit period. In month seven the
  company moved to a new finance system, and since then a different team has run the reconciliation from a new report.
  The audit plan allows about 40 sample items. Which sampling approach BEST supports a conclusion for the whole period?
options:
  A: 20 days before the change and 20 after it, each half concluded on separately
  B: 40 days drawn at random across the year, concluded on as a single population
  C: 40 days stratified across the twelve months, concluded on as a single population
  D: 40 days drawn from the months after the change, concluded on for the whole year
answer: A
explanation:
  why_correct: After the move the reconciliation is in effect a different control, with a new system, team and report, so
    the year holds two populations. A sample from each, tested and concluded on separately, gives evidence for both parts
    of the period, and an exception in one is not diluted by results from the other.
  why_not:
    B: A single random sample suits one control run the same way all year. Across two populations it may draw few items from
      one of them, and one joint conclusion hides how each control performed.
    C: Stratifying by month spreads the days across both periods, but concluding on them as one population still blends two
      different controls, so a failure in either can be averaged away.
    D: Recent days show how the control works now, but the conclusion covers twelve months, and the first seven, under the
      old system and team, would go untested.
