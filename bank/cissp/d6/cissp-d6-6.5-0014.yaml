subdomain: '6.5'
difficulty: hard
stem: An auditor is testing a daily bank reconciliation control across a twelve-month audit period. In month seven the
  company moved to a new finance system, and since then a different team has run the reconciliation from a new report.
  The audit plan allows about 40 sample items. Which sampling approach BEST supports a conclusion for the whole period?
options:
  A: Separate random samples from the periods before and after the change, each tested on its own
  B: 40 days drawn at random from across the whole year, each checked for a completed reconciliation
  C: 40 days drawn from the months after the change, which show the control as it runs now
  D: 40 days chosen at month and quarter ends, when reconciling errors are most likely
answer: A
explanation:
  why_correct: After the move the reconciliation is in effect a different control, with a new system, team and report, so
    the year holds two populations. A random sample from each, tested and concluded on separately, gives evidence for both
    halves of the period, and an exception in one does not get diluted by results from the other.
  why_not:
    B: A single random sample suits one control run the same way all year. Across two populations it may draw few items from
      one of them and cannot support a conclusion on each.
    C: Recent days show how the control works now, but the conclusion covers twelve months, and the first seven, under the
      old system and team, would go untested.
    D: Targeting high-risk dates is useful as an addition, but a judgmental sample is not representative of either period,
      so it does not support a conclusion for the whole year.
