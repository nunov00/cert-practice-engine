difficulty: medium
stem: Before a major release, a team must check whether its web application's input handling stops injection. Testers
  have two days, input handling is spread across many modules with no central layer, and the static analysis tool
  cannot parse the framework. Which test is BEST?
options:
  A: Targeted manual review of the input-handling code
  B: Manual review of each module's source code
  C: Authenticated dynamic scans of the staging build
  D: Fuzz testing of the public login form
answer: C
explanation:
  why_correct: Dynamic testing exercises the running application, so it works regardless of framework or code layout,
    and authenticated scans reach the input points behind login within a two-day window.
  why_not:
    A: With input handling spread across many modules and no central layer, a targeted review cannot cover it in
      two days.
    B: A full manual review is thorough but cannot cover every module in two days.
    D: Fuzzing one form covers a single input point. Injection can occur in any input across the application.
