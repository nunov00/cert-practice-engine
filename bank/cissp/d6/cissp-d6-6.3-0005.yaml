subdomain: '6.3'
difficulty: medium
stem: A logistics company's board asks whether it is narrowing the window in which attackers can use known flaws against it.
  Both of last year's breaches used flaws that the scanner rated medium, for which exploit code was public. The scanner reports
  about 30,000 findings a month, and a merger doubled the number of scanned hosts this year. Which measure BEST answers the
  board?
options:
  A: Days to fix each flaw on a known-exploited list, trended by month
  B: Share of critical findings fixed within the 30-day target, by month
  C: Number of open critical and high findings at each month end
  D: Mean days to fix scanner findings of any rating, trended by month
answer: A
explanation:
  why_correct: The board's window is the time attackers have to use a flaw that they can actually exploit. Timing the fix
    of each flaw known to be exploited, whatever its scanner rating, measures that window directly and is not distorted by
    the merger or by volume.
  why_not:
    B: Patching criticals within target is a standard KPI, but both breaches used flaws rated medium, which this measure leaves
      out.
    C: Open critical and high counts are a common risk indicator, but the merger doubled the hosts, so the count moves with
      the estate's size, and it also misses medium-rated flaws with public exploits.
    D: Mean time to fix covers every rating, but with about 30,000 findings a month it is dominated by low-risk items and
      can improve while exploited flaws stay open.
