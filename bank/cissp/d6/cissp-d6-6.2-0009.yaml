id: cissp-d6-6.2-0009
subdomain: '6.2'
difficulty: medium
stem: A retailer's board wants to know whether an outside attacker could reach customer data through its internet-facing customer portal
  as it runs today. The portal's staging copy lacks production's web application firewall rules and single sign-on settings. Which test
  design BEST fits?
options:
  A: Test the staging copy, loaded with production-like synthetic customer data
  B: Test production, with the testers' addresses allow-listed past the web firewall
  C: Test production from an existing customer's account, with the internal API documentation
  D: Test production as an outside attacker would, with denial-of-service tests excluded
answer: D
explanation:
  why_correct: The board's question is about the portal as attackers meet it, with the production firewall rules and sign-on settings
    in the path. Testing production from outside, as an attacker would, measures exactly that, and leaving out denial-of-service tests
    keeps the risk to customers low, since knocking the portal over says nothing about reaching data.
  why_not:
    A: Staging is the safer place for intrusive tests, and synthetic data spares real customers, but staging lacks the firewall rules
      and sign-on settings that shape what an attacker meets, so its results would not answer the board.
    B: Allow-listing testers past the firewall is a common way to examine the application in depth, but it removes a defence that is
      part of the board's question, so the findings would overstate what an outside attacker could do.
    C: A gray-box test from a customer account with internal documentation finds flaws behind sign-in efficiently, but it starts with
      knowledge an outside attacker does not have, so its findings would not show what an outsider could reach.
