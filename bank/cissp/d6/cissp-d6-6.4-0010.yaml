id: cissp-d6-6.4-0010
subdomain: '6.4'
difficulty: medium
stem: An internal penetration test cracked the passwords of 40 domain accounts from captured hashes, including three
  administrator accounts. The draft report lists each account with its password to show impact. The final report will go
  to the 25 members of the IT steering group and to the external auditors. How should it present this finding?
options:
  A: List each affected account with its password partly masked, in the main report
  B: Give counts and password patterns, and send the account list to the identity team alone
  C: Put the full list of accounts and passwords in an encrypted annex to the report
  D: List the affected accounts without passwords in the main report, for their owners to reset
answer: B
explanation:
  why_correct: Readers of the report need to understand the weakness, which counts and patterns such as season-and-year
    passwords show. The identity team needs the account list to force resets, but nobody needs the cracked passwords
    themselves. Sending only the list, only to that team, keeps working credentials and a list of weak administrator
    accounts out of a document read by more than 25 people outside it.
  why_not:
    A: Partial masking shows impact vividly, but with the patterns in the same report a partly shown password is often easy
      to complete, and the report reaches a wide audience.
    C: Encryption protects the annex in transit and storage, but every recipient needs the means to open it, so working
      passwords, administrators' included, still reach the whole distribution, most of whom have no use for them.
    D: Leaving out the passwords removes the worst exposure, but naming accounts known to have crackable passwords, three of
      them administrators, gives every reader a list of targets until the resets are done.
