id: cissp-d6-6.1-0010
subdomain: '6.1'
difficulty: medium
stem: A retailer's yearly external penetration test is scoped from the internet-facing hosts in its CMDB, and for three
  years it has found little. Last month attackers broke in through a forgotten campaign site that a marketing agency had
  set up in the retailer's cloud account. The agency builds short-lived campaign sites throughout the year. Which change
  to the test strategy BEST addresses this?
options:
  A: Ongoing discovery of exposed assets, each new one added to the CMDB for the next yearly test
  B: An attack-surface scan before each yearly test, adding what it finds to the scope
  C: Ongoing discovery of exposed assets, each new one confirmed in scope and tested
  D: Continuous scanning of the CMDB's hosts, testing each change as it is recorded
answer: C
explanation:
  why_correct: The tests looked only where the CMDB pointed, and the breached site was never in it. Ongoing discovery of
    what is actually exposed, from DNS records, certificates and the cloud accounts' public addresses, catches
    short-lived sites while they are live. Confirming that each new asset is the retailer's and testing it under a
    standing authorisation covers them and shows where the inventory is wrong.
  why_not:
    A: Discovery finds the sites, but they wait months for a test, and short-lived campaign sites may be breached or gone by
      then.
    B: A pre-test scan brings unrecorded hosts into scope, which is a real improvement, but it looks once a year, while
      short-lived campaign sites can be built, exposed and abandoned between scans.
    D: Continuous testing keeps pace with change, but only for hosts the CMDB records, so the agency's site, which was never
      recorded, would never have been tested.
