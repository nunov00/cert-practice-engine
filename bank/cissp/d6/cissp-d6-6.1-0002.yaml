id: cissp-d6-6.1-0002
subdomain: '6.1'
difficulty: medium
stem: A bank's security team tests its own controls each quarter and reports that all passed. The audit committee wants assurance
  that does not rest on the team testing itself. Internal audit now has a technical specialist. Which approach BEST meets
  this need?
options:
  A: Ask the security team to document each test in more detail
  B: Commission an external penetration test of key systems
  C: Have internal audit re-perform a sample of the team's tests
  D: Rely on the bank's cloud providers' SOC 2 reports
answer: C
explanation:
  why_correct: The committee's concern is whether the self-testing can be trusted. Independent re-performance of a sample
    by internal audit tests that directly, and the bank now has the skills to do it.
  why_not:
    A: Better documentation makes tests easier to review, but the evidence is still produced by the team being assured.
    B: A penetration test is independent, but it looks for exploitable weaknesses. It does not check whether the team's control
      tests are reliable.
    D: Providers' reports cover the providers' controls, not the bank's own controls or its testing of them.
