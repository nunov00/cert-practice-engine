id: cissp-d6-6.4-0005
subdomain: "6.4"
difficulty: medium
stem: An unauthenticated vulnerability scan reports a critical OpenSSL flaw on 200 Linux servers, based on the version
  in each service's banner. The servers' distribution backports security fixes into its packages without changing the
  upstream version number. What should the analyst do FIRST before reporting the result?
options:
  A: Check installed package releases against the distribution's advisory on a sample of servers
  B: Raise an emergency change to patch OpenSSL on the 200 servers
  C: Mark the finding as a false positive on servers running that distribution
  D: Compare the finding with last month's scan results for the same servers
answer: A
explanation:
  why_correct: A banner shows the upstream version, which backported packages keep, so the finding may or may not be real.
    Comparing the installed package release with the distribution's own advisory on a sample shows whether the fix is
    present, which decides whether the 200 findings stand.
  why_not:
    B: Emergency patching treats every finding as real. If the fix is already backported, the change brings risk and effort
      for no benefit, and the report would overstate exposure.
    C: Backporting makes a false positive likely, but some servers may lack the updated package, so marking all of them
      unchecked could hide real exposure.
    D: Last month's results come from the same banner method, so they repeat the same uncertainty without resolving it.
