id: cissp-d6-6.2-0005
subdomain: "6.2"
difficulty: hard
stem: A tester found that a company's API returned other customers' invoices when the invoice number in the request was
  changed. The API has 140 endpoints that take object IDs, and the team wants a test that would catch this class of flaw
  on every release. Which approach BEST fits?
options:
  A: A dynamic application scanner run against the API in the release pipeline
  B: Automated tests that call each endpoint as one user with another user's object IDs
  C: Static analysis rules that flag handlers lacking an authorisation call
  D: A manual penetration test of the API before each major release
answer: B
explanation:
  why_correct: The flaw is a missing object-level authorisation check, which shows only when one user asks for another
    user's data. Tests that sign in as two users and swap their object IDs across every endpoint exercise exactly that
    check, and they can run automatically on each release.
  why_not:
    A: Scanners find many injection and configuration flaws, but they do not know which objects belong to which user, so
      they rarely detect this kind of authorisation gap.
    C: Static rules can spot handlers with no authorisation call, but a handler that checks the user is signed in, without
      checking that the object is theirs, passes the rule.
    D: Manual testing can find the flaw, but running it only before major releases leaves most releases untested.
