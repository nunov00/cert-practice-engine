id: cissp-d6-6.5-0017
subdomain: '6.5'
difficulty: hard
stem: Testing change approval, an auditor sampled 25 production changes. Twenty-four were approved before they went live;
  the 25th, a database fix, was approved two days afterwards. The change manager says it was an emergency change, and the
  policy lets a senior manager approve those within three working days after implementation. What should the auditor do FIRST?
options:
  A: Record it as an exception, and extend the sample to judge how often approval comes late
  B: Report it as an exception, with the change manager's explanation as management's response
  C: Check that it was logged as an emergency at the time and approved as the policy requires
  D: Test a separate sample of emergency changes against the policy's emergency procedure
answer: C
explanation:
  why_correct: Whether the item is an exception depends on which control applies to it. If records made at the time show it
    was raised as an emergency and a senior manager approved it within three working days, it complied with policy; if it
    was relabelled afterwards, it is an exception, and a serious one. Settling that from the change system's own records,
    rather than the manager's word, comes before deciding how to treat the result.
  why_not:
    A: Extending the sample is the usual response to a confirmed exception, but this item may not be one, and more normal
      changes would say nothing about it.
    B: Recording management's explanation as its response treats the item as a confirmed exception without testing the explanation,
      which may show that the change complied.
    D: Emergency changes are a separate population worth testing in their own right, but that is a later step; the auditor
      first has to resolve the sampled item to conclude on the sample.
