subdomain: '6.2'
difficulty: hard
stem: A testing firm is running an unannounced red-team test for a freight company. Only the company's CISO and her deputy,
  named in the rules of engagement as contacts, know about it. On a file server, a tester finds a web shell that the team
  did not plant, with timestamps from weeks before the test began. What should the test lead do FIRST?
options:
  A: Keep testing other targets, and flag the find as critical in the day's status report
  B: Report the find straight to the company's SOC so that it can open an incident
  C: Copy the web shell and the server's logs as evidence, then report the find
  D: Stop work on that server, and report the find to the named contacts at once
answer: D
explanation:
  why_correct: A web shell planted before the test is most likely a real intrusion, not a test finding, and the company
    needs to know now. The rules of engagement name the people with authority over the test, so the lead stops touching
    the server, which keeps the testers' activity out of any evidence, and tells the contacts at once. They decide how to
    bring in the SOC and responders and whether to pause or end the test, and they can tell responders which activity was
    the testers'.
  why_not:
    A: The daily status report is the normal channel for critical findings, but a live intruder is not a finding of the test,
      and hours of delay give the attacker time while testing nearby can disturb the traces responders will need.
    B: The SOC will have to act, but it does not know a test is under way, and going around the named contacts bypasses the
      people who can separate the testers' activity from the intruder's and decide what happens to the test.
    C: Preserving evidence matters, but collecting it is a job for the company's own responders under their procedures. A
      tester copying files and logs on a server with a live intruder works outside the agreed scope and delays the report.
