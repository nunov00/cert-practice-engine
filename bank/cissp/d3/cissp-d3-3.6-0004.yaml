id: cissp-d3-3.6-0004
subdomain: '3.6'
difficulty: hard
stem: An insurer's customers sign policy contracts electronically. For 30 years after signing, the insurer must be able to
  prove who signed each contract and that the signature was valid when it was made. Signing certificates last two years,
  and the algorithms in use today are expected to weaken well within 30 years. Which approach BEST meets the need?
options:
  A: Sign with 4096-bit RSA keys under certificates valid for 30 years
  B: Store each signer's certificate and its revocation status with the contract
  C: Re-sign the contract archive with the insurer's current key at regular intervals
  D: Add a trusted timestamp at signing and renew the archive's timestamps over time
answer: D
explanation:
  why_correct: A trusted timestamp proves the signature existed at a time when the certificate was valid and unrevoked. Renewing
    timestamps over the archive with current algorithms, before the old ones weaken, carries that proof forward, so the original
    signer's signature can still be relied on decades later.
  why_not:
    A: Longer keys delay the day the algorithm can be broken, but no key size is a safe bet for 30 years, and a certificate
      that long-lived is a long-lived target that would need revoking if its key were exposed.
    B: Keeping the certificate and its status is part of long-term validation, but without a trusted time there is no proof
      the signature was made before the certificate expired or was revoked, and nothing protects it once the algorithm weakens.
    C: Re-signing protects the archive's integrity with fresh algorithms, but the new signature is the insurer's, so it proves
      what the insurer holds, not who signed each contract.
