id: cissp-d3-3.1-0002
subdomain: '3.1'
difficulty: easy
stem: Staff reach an internal payroll app through the corporate VPN, which requires MFA. The app trusts any request from the
  VPN address range. An attacker stole an employee's live VPN session token through malware and reached the app. Which design
  change BEST addresses this?
options:
  A: Require phishing-resistant MFA at the VPN gateway
  B: Place a web application firewall in front of the app
  C: Authenticate and authorise each request at the app
  D: Shorten VPN sessions so tokens expire within an hour
answer: C
explanation:
  why_correct: The app grants trust by network location, so anyone holding a VPN session inherits it. Verifying identity and
    authorisation at the app for each request, in line with zero trust, means a stolen network session no longer gives access
    on its own.
  why_not:
    A: Stronger MFA helps against credential phishing, but the attacker took a session that had already passed MFA, so a stronger
      factor would not have stopped it.
    B: A WAF filters malicious request content. The attacker's requests were ordinary ones made with a trusted session.
    D: Shorter sessions narrow the window, yet an hour is enough for malware on the device to act, and the app would still
      trust the network.
