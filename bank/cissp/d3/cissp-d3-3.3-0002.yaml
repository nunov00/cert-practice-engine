id: cissp-d3-3.3-0002
subdomain: '3.3'
difficulty: medium
stem: Several departments share one analytics cluster, which the budget requires. Each department must not see the others'
  data, and IT staff who run the cluster must not be able to read any of it. Which control BEST meets both requirements?
options:
  A: Encryption with keys each department controls
  B: Role-based access per department on the cluster
  C: Logging of administrator access to the data
  D: A separate storage volume for each department
answer: A
explanation:
  why_correct: Per-department keys keep data unreadable to anyone without that department's key, including the cluster's administrators.
    That meets both needs on a shared cluster.
  why_not:
    B: Role-based access separates departments from each other, but cluster administrators can change or bypass the roles,
      so it fails the second requirement.
    C: Logging deters and records administrator access, but it is detective. Administrators could still read the data.
    D: Separate volumes help organise data, but administrators manage the volumes and can read them.
