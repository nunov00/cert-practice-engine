subdomain: '3.10'
difficulty: hard
stem: An insurer's claims app team works in two-week sprints, and a product owner measured on feature delivery ranks its
  backlog. The app's security requirements, such as logging each change to a claim and validating input on the server,
  were written as backlog stories of their own. A year on, most are unbuilt, while new claim features ship each sprint.
  Which change BEST gets these requirements built?
options:
  A: Reserve a fixed share of each sprint's capacity for the security stories in the backlog
  B: Have the security architect, not the product owner, rank the security stories in the backlog
  C: Add the requirements to the definition of done that each claim feature story must meet
  D: Block each release until the security stories ranked highest by risk are complete
answer: C
explanation:
  why_correct: Logging claim changes and validating input are not features to be built once. They are conditions that every
    feature handling claims or input must meet. As separate stories, they compete with features for priority, and each new
    feature adds more retrofit work. Putting them in the definition of done means no claim feature counts as finished
    without them, so new work is built securely and the backlog stops growing.
  why_not:
    A: A fixed capacity share is a sound way to make progress on technical debt, and it would build some security stories,
      but features would keep shipping without logging or validation, adding to the retrofit work faster than a share can
      clear it.
    B: Ranking by risk would raise the security stories, but the product owner still owns the sprint and is still measured
      on features, so they keep competing for the same capacity, and new features still arrive without the controls.
    D: A release gate makes the gap visible and forces some stories through, but it acts at the end of the cycle, delays
      releases, and still treats the requirements as separate work rather than part of each feature.
