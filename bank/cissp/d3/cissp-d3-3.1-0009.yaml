subdomain: '3.1'
difficulty: hard
stem: An online furniture retailer's checkout calls a fraud-scoring service before accepting each card payment. When the service
  is unreachable, checkout waits 30 seconds and then accepts the order unscored, and during a four-hour outage fraudsters
  placed hundreds of orders that were later shipped. Orders are packed and dispatched from the warehouse the next working
  day. How should checkout behave when the scoring service is unreachable?
options:
  A: Decline the payment, asking the customer to try again later
  B: Accept orders below a value limit unscored, declining the rest
  C: Score the order with a simpler local rule set and accept it on that result
  D: Accept the order, holding its dispatch until the service has scored it
answer: D
explanation:
  why_correct: Failing securely means the failure must not let an unchecked action complete, and here the harm happens at
    dispatch, not at payment. Because nothing leaves the warehouse until the next working day, accepting the order but holding
    dispatch until it has been scored keeps the full fraud check in place before any loss, while customers can still buy during
    an outage.
  why_not:
    A: Declining is the textbook fail-closed choice and would stop the fraud, but it turns away every genuine customer during
      an outage, when the next-day dispatch already gives time to score orders before anything ships.
    B: A value limit caps the loss on each order, but fraudsters can place many orders under the limit, as they did here,
      and those still ship unscored.
    C: A local fallback rule set keeps some checking in place, but it is weaker than the full model, and the orders it passes
      still ship without the full score that the next-day dispatch leaves time to obtain.
