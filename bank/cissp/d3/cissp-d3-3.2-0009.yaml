id: cissp-d3-3.2-0009
subdomain: '3.2'
difficulty: hard
stem: A defence ministry's personnel database labels each row under Bell-LaPadula and keys people by national identity number.
  Officers on covert postings have Secret rows. When an Unclassified HR clerk entered one officer's cover job at a supply depot,
  the database refused the identity number as already in use, and the clerk asked colleagues why. Which change BEST stops such
  entries from exposing covert postings?
options:
  A: A generic failure message for any refused entry, with no reason given
  B: An alert to security whenever an Unclassified entry collides with a Secret row
  C: Entry of cover jobs by cleared HR staff in place of Unclassified clerks
  D: An Unclassified row under the same identity number beside the Secret one
answer: D
explanation:
  why_correct: The refusal is an inference channel. An Unclassified user learns that a Secret row exists from the way the
    database reacts, even though she never reads it. Polyinstantiation lets the database hold an Unclassified row with the same
    key beside the Secret one, so Unclassified users see an ordinary record, the cover job, and meet no refusal, while Secret
    users see both rows.
  why_not:
    A: Hiding the reason still leaves the refusal. Entries for ordinary new staff succeed, so a failure on one identity number
      tells the clerk that something hidden sits under it.
    B: Alerting lets security manage the exposure afterwards, but the clerk has already learned that the officer has a hidden
      record, which is the leak to prevent.
    C: Routing cover jobs to cleared staff keeps the refusal away from clerks, but a row written at Secret stays invisible to
      the depot's Unclassified systems, and writing at Unclassified meets the same refusal, as does any later Unclassified update.
