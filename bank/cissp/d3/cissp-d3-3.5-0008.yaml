id: cissp-d3-3.5-0008
subdomain: '3.5'
difficulty: hard
stem: At a chemical plant, engineers change controller logic from one engineering workstation, about four times a year and
  always on site. The controllers accept new logic from any host on the control network that runs the vendor's software and
  knows their shared password. Testers who took over the engineering workstation through a phishing email loaded altered logic
  into a reactor controller. Which change BEST prevents this?
options:
  A: Controllers' mode switches kept in run, turned to program on site for each approved change
  B: Firewall rules letting only the engineering workstation send logic downloads to the controllers
  C: A unique, strong controller password for each engineer, replacing the shared password
  D: Passive monitoring that alerts the control room when any logic download is detected
answer: A
explanation:
  why_correct: The attack came from the one host that is meant to program the controllers, through the vendor's own software,
    so rules and passwords that this workstation holds or sees cannot tell a real change from a forged one. A physical mode
    switch left in run makes each controller refuse new logic from anywhere until someone at the cabinet turns the key. Because
    changes are rare and already made on site, the cost is small, and change control decides when a key is turned.
  why_not:
    B: Limiting logic downloads to the engineering workstation is sound segmentation, but the testers were on that workstation,
      so their download came from the permitted source.
    C: Individual passwords add accountability, but engineers type them into, and often save them in, the engineering software
      on the compromised workstation, where an attacker can capture or reuse them.
    D: Monitoring for logic downloads is valuable, and it is the main option where downloads must stay possible remotely,
      but it alerts only once altered logic has reached a reactor controller. Here the plant can stop the download itself.
