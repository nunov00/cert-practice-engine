id: cissp-d3-3.5-0002
subdomain: '3.5'
difficulty: hard
stem: A fintech's shared build platform runs each team's pipeline jobs in containers on common hosts. So that jobs can build
  images, each job container has the host's container engine socket mounted. Teams, including contractors, write their own
  pipeline definitions. Which change BEST reduces the risk to the build hosts?
options:
  A: Run each job container as a non-root user with a read-only root filesystem
  B: Apply a strict seccomp profile and drop Linux capabilities from job containers
  C: Build images with a daemonless builder inside per-job virtual machines
  D: Scan each job's base image for known vulnerabilities before the job starts
answer: C
explanation:
  why_correct: Access to the engine socket lets a job ask the host's container engine to start any container, including a
    privileged one with the host filesystem mounted, which amounts to root on the host. Since anyone who writes a pipeline
    can use it, the socket has to go. A daemonless builder inside a per-job virtual machine still builds images, and a hostile
    job can damage only its own throwaway machine.
  why_not:
    A: A non-root user and a read-only filesystem are good container hardening, but the request travels through the socket
      to an engine that runs as root on the host, so the job's own privileges do not limit what it can ask for.
    B: Seccomp and dropped capabilities restrict what the container's own processes can do to the kernel. Sending API calls
      over a mounted socket is ordinary file access, and the engine carries them out with its own privileges.
    D: Image scanning finds known flaws in base images, but the risk here comes from what a pipeline author tells the job to
      do, not from a vulnerable package in the image.
