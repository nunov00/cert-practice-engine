subdomain: '3.8'
difficulty: hard
stem: A colocation data centre is being refitted. Server deliveries arrive several times a week from different carriers,
  on pallets too large for the staff mantrap, so during each delivery its outer and inner doors are held open for up to
  an hour while couriers wheel the pallets to the halls. Site policy keeps cardboard and packing material out of the halls.
  Which design change BEST fits?
options:
  A: A larger mantrap sized for pallets, keeping its interlocked doors
  B: A loading dock with a staging room outside the secure zone for unpacking
  C: A guard posted at the held-open doors for the full length of each delivery
  D: A door-held alarm on the mantrap that alerts the security desk
answer: B
explanation:
  why_correct: A dock and staging room outside the secure zone separate shipping and receiving from the halls. Couriers
    hand over pallets without entering, packing is removed where it is allowed, and staff take the equipment in through
    the normal controlled entrance, so the mantrap is never held open.
  why_not:
    A: A pallet-sized mantrap keeps the interlock working, but couriers from many carriers would still pass into the
      secure zone with the pallets, and the packing would travel into the halls with them.
    C: A guard adds supervision during deliveries, but the doors are still open for up to an hour and couriers still walk
      into the halls.
    D: A door-held alarm makes the open doors visible, but deliveries need them open, so it would sound at each delivery
      without changing who enters.
