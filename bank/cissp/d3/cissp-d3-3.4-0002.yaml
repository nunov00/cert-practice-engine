id: cissp-d3-3.4-0002
subdomain: '3.4'
difficulty: medium
stem: A laptop fleet uses full-disk encryption whose key is sealed to the TPM's boot measurements and released at boot with
  no user input. Testers with a stolen laptop captured the key by probing the bus between the separate TPM chip and the processor
  during a normal boot. Which change BEST defends against this attack?
options:
  A: Turn on secure boot so that only signed boot loaders can start
  B: Require a pre-boot PIN in addition to the TPM before key release
  C: Seal the key to additional boot measurements in the TPM
  D: Turn on memory encryption to protect keys held in RAM
answer: B
explanation:
  why_correct: The attack works because the laptop boots its genuine software and the TPM releases the key on its own, where
    it can be read off the bus. Requiring a PIN means the TPM will not release the key to someone holding only the device,
    so a thief cannot trigger the release to sniff it.
  why_not:
    A: Secure boot blocks tampered boot loaders, but the testers used the genuine boot chain. The key is still released automatically
      and can still be read from the bus.
    C: Sealing to more measurements makes the TPM pickier about the boot state, yet a normal boot of the stolen laptop still
      matches, so the key is still released and exposed.
    D: Memory encryption protects keys held in RAM against cold-boot or DMA attacks, but here the key is read off the bus
      as the TPM sends it, before it reaches memory.
