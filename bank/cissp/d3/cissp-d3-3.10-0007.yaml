stem: A hospital is retiring the interface engine that passes messages between its clinical systems, now that a new engine
  is live. The configuration database lists 14 systems still connected to the old engine, but over the years departments have
  set up feeds through it themselves. Some feeds carry lab results to wards. Which approach to switching it off BEST fits?
options:
  A: Switch it off for one day as a test, and restore it if any department reports a problem
  B: Switch it off on the planned date, once each of the 14 listed systems has moved
  C: Watch its live traffic for some weeks, move each feed found, then switch it off
  D: Announce the date hospital-wide, asking each feed's owner to move it before then
answer: C
explanation:
  why_correct: Retiring a system safely starts with knowing what still depends on it, and here the records are known to be
    incomplete. Observing the engine's real traffic over a period long enough to include rare messages finds every feed in
    use, whatever the records say, so each can be moved before the engine stops and no lab result is silently lost.
  why_not:
    A: A short switch-off, or scream test, is a common way to flush out unknown users, but these feeds run between systems
      without anyone watching, so a lost lab result may not be noticed for hours, and patients could be harmed meanwhile.
    B: Moving every system on record is necessary, but the record is known to miss the feeds that departments set up
      themselves, and those would stop without warning on the date.
    D: An announcement reaches people, but feeds set up years ago may have no current owner, or owners who do not know their
      feed passes through this engine, so some would still be missed.
