id: cissp-d3-3.7-0001
subdomain: '3.7'
difficulty: medium
stem: Researchers recovered the secret key of a payment terminal by recording its power draw through the power cable over
  thousands of decryptions of inputs they chose. The terminals stay in shops within reach of the public. Which countermeasure
  BEST addresses this attack?
options:
  A: Lengthen the key from 128 to 256 bits
  B: Fit tamper switches that erase the keys if anyone opens the case
  C: Mask the key-dependent operations so power use does not track the key
  D: Limit how many decryptions the terminal allows per minute
answer: C
explanation:
  why_correct: 'Power analysis is a side-channel attack: it exploits the link between the key and the power the device uses,
    not the strength of the algorithm. Masking or blinding the computation breaks that link, so more measurements do not reveal
    the key.'
  why_not:
    A: A longer key resists brute force, but differential power analysis recovers the key in pieces, so a longer key barely
      slows it.
    B: Tamper switches protect against opening the case. Here the measurements come through the power cable, so the case never
      needs to be opened.
    D: Rate limiting slows the collection of measurements but does not remove the leak. A patient attacker with a terminal
      in reach can still gather enough.
