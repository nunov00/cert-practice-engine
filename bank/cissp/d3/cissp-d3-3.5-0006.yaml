id: cissp-d3-3.5-0006
subdomain: '3.5'
difficulty: hard
stem: An insurer's customer portal is a single-page app that keeps its OAuth access and refresh tokens in browser storage.
  Its pages load about 30 third-party marketing and analytics scripts, which the marketing team changes most weeks. Last
  month one supplier's script was compromised and sent visitors' tokens to an attacker. Which change BEST reduces this exposure?
options:
  A: A backend that holds the tokens, leaving the browser only an HttpOnly cookie
  B: A strict content security policy that lists each approved third-party script source
  C: Tokens held only in the app's JavaScript memory, not in browser storage
  D: Five-minute access tokens, with each refresh token rotated and usable only once
answer: A
explanation:
  why_correct: Any script running in the page can read whatever the page's own code can reach. A backend-for-frontend keeps
    the tokens on the server and gives the browser only an HttpOnly session cookie, which scripts cannot read, so a compromised
    third-party script has no tokens to send away. It could still act within a visitor's session while the page is open, so
    reducing and isolating the third-party scripts remains worthwhile.
  why_not:
    B: A strict policy blocks scripts from unlisted sources, but the compromised script came from an approved supplier, so
      it would still be on the list and still run.
    C: Keeping tokens out of browser storage stops simple reads of storage, but a script in the same page can wrap the app's
      functions or network calls and capture the tokens as they are used.
    D: Short-lived, rotating tokens shrink the window, but the script receives the refresh token too and can use it before
      the app does, so the attacker still gets a working session.
