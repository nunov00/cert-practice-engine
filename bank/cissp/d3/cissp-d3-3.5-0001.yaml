id: cissp-d3-3.5-0001
subdomain: '3.5'
difficulty: medium
stem: An HR analytics tool shows managers the average salary of any group of five or more staff. One manager ran the average
  for her team of six, then again with one colleague filtered out, and worked out that colleague's salary. Managers still
  need group averages for planning. Which control BEST addresses this?
options:
  A: Polyinstantiate salary records according to the viewer's clearance level
  B: Encrypt the salary column at database cell level
  C: Raise the minimum group size from five to ten staff
  D: Refuse queries that differ from a recent one by one or two staff
answer: D
explanation:
  why_correct: 'This is an inference attack by differencing: two permitted aggregates that differ by one person reveal that
    person''s value. Blocking queries whose result sets overlap a recent query except for one or two people stops the subtraction
    while ordinary group averages stay available.'
  why_not:
    A: Polyinstantiation hides the existence of higher-classified records by keeping several versions. It does not stop subtraction
      between two legitimate averages.
    B: Encryption protects stored values, but the tool decrypts them to compute averages for authorised managers, so the inference
      still works.
    C: A larger minimum group is a common first fix, but the same two-query subtraction works on a group of ten as well as
      on six.
