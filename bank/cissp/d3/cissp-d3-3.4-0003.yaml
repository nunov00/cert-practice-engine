id: cissp-d3-3.4-0003
subdomain: '3.4'
difficulty: medium
stem: A bank wants to run its fraud models in a public cloud on transaction data that a partner bank supplies. The partner
  requires that neither the cloud operator nor the bank's own administrators can read its data while it is being processed.
  The models must score several million transactions an hour. Which capability BEST meets this?
options:
  A: Hardware trusted execution enclaves, with attestation checked by the partner
  B: Encryption at rest and in transit, with keys that the partner holds and controls
  C: Fully homomorphic encryption, so that the models compute on encrypted data
  D: Dedicated hosts that run only the bank's virtual machines, with no other tenants
answer: A
explanation:
  why_correct: A hardware enclave keeps data encrypted in memory and isolated from the host operating system, the hypervisor
    and anyone administering the machine, including the bank's own administrators, provided the application is built so that
    only the attested code inside the enclave sees the data. Attestation lets the partner verify that code before releasing
    keys to it, and processing runs close to normal speed.
  why_not:
    B: Partner-held keys protect the data in storage and on the network, but the data must be decrypted in memory to be scored,
      where administrators of the platform could read it.
    C: Homomorphic encryption protects data in use without trusting the hardware, but for complex models it is still far slower
      than normal processing, which makes it impractical at several million transactions an hour without very large
      resources.
    D: Dedicated hosts remove other tenants, but the cloud operator still runs the hosts and the bank's administrators still
      control the machines, so either could read the data in memory.
