id: cissp-d3-3.7-0002
subdomain: '3.7'
difficulty: medium
stem: A system signs documents by signing a 64-bit hash of each one. Roughly how many candidate documents must an attacker
  generate to have a good chance of finding any two with the same hash?
options:
  A: About 2^16
  B: About 2^32
  C: About 2^63
  D: About 2^64
answer: B
explanation:
  why_correct: By the birthday paradox, a collision between any two of the attacker's own documents becomes likely after about
    the square root of the number of possible hashes, 2^(64/2) = 2^32. The attacker can then get one document signed and attach
    the signature to the other.
  why_not:
    A: 2^16 is the square root of 2^32, not of 2^64. It understates the work by a factor of 65,536.
    C: About 2^63, half the output space, is the usual estimate for matching one specific, given hash (a second preimage).
      The attacker here only needs any two documents to collide, which is far easier.
    D: 2^64 is the size of the output space, the order of effort to match one given hash, not to find any collision.
