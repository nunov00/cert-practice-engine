difficulty: medium
stem: A firm leases two floors of a multi-tenant tower. On each floor the lifts and stairs open onto a small lobby, and fire
  rules require stairwell doors to open from the stairs so people can re-enter any floor. The landlord's staff administer
  the building's badge system, including each tenant's settings. The firm wants control over who reaches its offices. Which
  design BEST fits?
options:
  A: Its own badge-controlled doors from each floor lobby into its office space
  B: Lift destination control that stops at its floors only for badges it approves
  C: Its own badge groups in the landlord's system, with rights over its floors
  D: Cameras on its floor lobbies watched by its own staff, with guards to respond
answer: A
explanation:
  why_correct: The firm's own boundary should sit where its space begins and under its own administration. Doors from each
    floor lobby into its offices, with free exit, leave the fire rule's re-entry route into the lobby intact while controlling
    every path into the offices, whether people arrive by lift or by stairs.
  why_not:
    B: Destination control is a common way to restrict floors in shared towers, but the stairwell doors must open from the
      stairs, so anyone can walk up to the firm's floor lobbies without using a lift.
    C: Delegated badge groups let a tenant manage its own people, but the landlord's staff administer every tenant's settings
      in that system, so they can still change who is allowed onto the firm's floors.
    D: Cameras with a response give visibility and a way to act, but they detect people after they arrive rather than controlling
      who can reach the offices.
