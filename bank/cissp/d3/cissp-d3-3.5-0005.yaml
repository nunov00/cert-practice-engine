difficulty: hard
stem: A payments firm runs its internet-facing web servers and its card-processing virtual machines on the same hypervisor
  cluster, separated by virtual firewalls. Twice this year, hypervisor escape flaws were published weeks before patches were
  available. Which change BEST reduces the risk to card data?
options:
  A: Apply hypervisor patches within 24 hours of their release
  B: Run internet-facing and card VMs on separate host clusters
  C: Add micro-segmentation rules between each pair of VMs
  D: Encrypt the card VMs' disks with keys held outside the cluster
answer: B
explanation:
  why_correct: Separate hardware means an escape from an internet-facing VM lands on hosts that hold no card data, so the
    gap before a patch matters far less.
  why_not:
    A: Fast patching helps, but these flaws were public for weeks before patches existed, so the exposure window remains.
    C: Micro-segmentation controls network paths between VMs, but a hypervisor escape bypasses the virtual network entirely.
    D: Disk encryption protects data at rest, but an attacker who controls the hypervisor can read a running VM's memory and
      mounted disks.
