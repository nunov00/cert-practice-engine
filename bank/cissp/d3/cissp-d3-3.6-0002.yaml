id: cissp-d3-3.6-0002
subdomain: '3.6'
difficulty: medium
stem: An application encrypts customer records with AES in CBC mode, with a random IV stored beside each record. An audit
  finds that a database administrator could alter a record's ciphertext, or swap two customers' encrypted records, without
  the application noticing. Which change BEST addresses both findings?
options:
  A: Store an unkeyed SHA-256 hash of each plaintext record with it
  B: Switch to AES-CTR with a unique nonce for each record
  C: Switch to AES-GCM, with the record ID as associated data
  D: Add an HMAC over each record's ciphertext, keyed separately
answer: C
explanation:
  why_correct: GCM authenticates the ciphertext with the secret key, so altered data fails to decrypt. Binding the record
    ID as associated data also makes a record fail to decrypt if it is moved to another customer's row, which stops the swap.
  why_not:
    A: An unkeyed hash can be recomputed by anyone who knows or guesses the plaintext, and a hash moves with its record when
      rows are swapped, so neither finding is fixed.
    B: CTR mode gives confidentiality only, and it is even easier to alter than CBC, since flipping a ciphertext bit flips
      the same plaintext bit.
    D: An HMAC stops alteration, but because it covers only the ciphertext, a swapped record carries a valid HMAC to its new
      row, so the swap goes undetected.
