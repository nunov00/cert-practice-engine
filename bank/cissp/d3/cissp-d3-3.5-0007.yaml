id: cissp-d3-3.5-0007
subdomain: '3.5'
difficulty: hard
stem: A wholesaler's desktop ordering app is used by 250 staff and by 60 resellers from their own offices. The app connects
  straight to the order database with one shared database account, whose password is stored encrypted in the app's settings.
  A tester working as a reseller recovered the password and read every reseller's orders and prices. Which change BEST closes
  this weakness?
options:
  A: An application tier that holds the database credentials and checks each user's rights on every request
  B: Stored procedures as the only access the shared account has, with its direct table rights removed
  C: The database password kept in each computer's operating system credential vault, not in the settings file
  D: A separate database account for each user, granted rights on only the tables that user needs
answer: A
explanation:
  why_correct: 'The weakness is architectural: the client holds the credentials and decides what each user may see, and
    a client runs on a machine the user controls. Moving database access into an application tier keeps the credentials on
    servers and lets that tier check, on every request, which reseller is asking and which orders and prices belong to it.
    The database then no longer needs to be reachable from resellers'' offices.'
  why_not:
    B: Stored procedures narrow what the account can do, but every caller still uses the same account, so the procedures cannot
      tell which reseller is asking and will return any reseller's orders to whoever holds the password.
    C: A credential vault keeps the password out of a plain settings file, but the app runs as the user and must read the password
      to connect, so a user who controls the machine can still recover it.
    D: Per-user accounts end the shared password, but table rights cannot separate one reseller's rows from another's in the
      same tables, and the database would still be exposed to connections from resellers' offices.
