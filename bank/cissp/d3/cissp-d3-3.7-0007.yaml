id: cissp-d3-3.7-0007
subdomain: '3.7'
difficulty: hard
stem: Testers phished one of an accounting firm's 400 workstations, took the stored hash of the built-in local administrator
  account and, without cracking it, used it to sign in as administrator to most of the other workstations within an hour.
  The password is 24 random characters, set once in the firm's standard workstation image. Which change BEST prevents this
  spread?
options:
  A: A new local administrator account in the image, with the built-in account disabled
  B: Rotation of the image's local administrator password each month by the deployment tool
  C: A different random local administrator password on each workstation, managed centrally
  D: Multi-factor authentication for each administrator sign-in to the firm's workstations
answer: C
explanation:
  why_correct: In a pass-the-hash attack the hash itself serves as the credential, so the attacker never needs the password.
    The spread worked because every workstation shares the same local administrator password, and so the same hash. A unique
    random password per workstation, managed and rotated centrally, means a hash taken from one machine opens only that machine.
  why_not:
    A: Disabling the built-in account removes the account attackers look for first, but the new account would still have
      one password, and so one hash, on every workstation built from the image, and the testers would replay that instead.
    B: Monthly rotation shortens how long a stolen hash stays valid, but the password stays the same on every workstation, and
      the testers spread within an hour, well inside any rotation period.
    D: Multi-factor prompts are usually added to interactive sign-in, but signing in over the network with a local account
      and its hash does not pass through them, so the shared hash still opens the other workstations.
