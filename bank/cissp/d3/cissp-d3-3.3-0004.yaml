id: cissp-d3-3.3-0004
subdomain: '3.3'
difficulty: medium
stem: A hospital applies its moderate control baseline to new wall displays in operating theatres, expected to stay in service
  for ten years. The baseline requires a session lock after 15 minutes of inactivity. The displays show patient imaging, take
  no input during surgery, hang in rooms with badge-controlled entry, and surgeons consult them hands-free through operations
  lasting hours. How should the team handle the session lock control?
options:
  A: Risk acceptance by the system owner, recorded in the risk register
  B: Tailoring of the control for these displays, with compensating controls documented
  C: A time-limited exception to the baseline, renewed each year by the risk committee
  D: Proximity readers that keep each display unlocked while a staff badge is in the room
answer: B
explanation:
  why_correct: Baselines are meant to be tailored to the system they are applied to. The lock's purpose, stopping someone
    using an unattended session, is already met by controlled room entry and displays that take no input, while the lock
    itself would interrupt surgery for the life of the system. Tailoring records that the control is adjusted for this system,
    with the compensating controls that meet its purpose, so the system is compliant as designed.
  why_not:
    A: Risk acceptance by the owner is a valid way to carry a residual risk, but it treats the system as falling short of a
      requirement, when the control's purpose is already met by other means and the baseline allows it to be adjusted.
    C: Exceptions suit a temporary gap that will be closed later, but this is a ten-year design need, so yearly renewals only
      record the same decision again.
    D: Proximity unlocking keeps the control in a technical form, but it adds readers to every theatre, and a badge under a
      gown or out of range would lock the display mid-operation, for little gain in a room that is already access-controlled.
