stem: A company is converting an office beside a busy road into a data centre. A threat assessment found that a vehicle could
  leave the road, cross the 40-metre lawn in front of the building and strike its glass front. Local planning rules allow
  nothing taller than one metre along the frontage. Which measure BEST addresses the threat?
options:
  A: Crash-rated bollards and a barrier arm at the vehicle entrance
  B: A crash-rated security fence along the whole road frontage
  C: Crash-rated planters and landscaped berms along the frontage
  D: Laminated, blast-resistant glazing across the building's front
answer: C
explanation:
  why_correct: The threat can come across any part of the lawn, so the barrier has to run along the whole frontage. Crash-rated
    planters and earth berms stop vehicles while staying low, which meets the planning limit and keeps the site looking ordinary.
  why_not:
    A: Entrance bollards and barriers are standard for controlling vehicle access, but a vehicle can avoid the entrance and
      cross the open lawn.
    B: A crash-rated fence along the frontage would stop vehicles, but it would be far taller than the one-metre limit the
      planning rules allow.
    D: Laminated glazing reduces flying glass from a blast, but it does not stop a vehicle that reaches the building from driving
      into it.
