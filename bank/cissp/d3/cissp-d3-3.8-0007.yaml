subdomain: '3.8'
difficulty: hard
stem: A bank must choose a site for a second data centre. Its storage replicates synchronously, which limits candidates to
  about 60 km of fibre from the primary. The primary stands on a river plain where floods have closed roads for days at a
  time, and the regional power grid has failed twice in ten years. Which candidate site BEST fits?
options:
  A: A site 5 km away, built above flood level, with generators and three days of fuel
  B: A site 45 km away on higher ground, supplied by a different regional grid
  C: A site 300 km away in another region, with a separate grid and no flood record
  D: A site 55 km away on higher ground, on the same regional grid, with generators
answer: B
explanation:
  why_correct: A second site should not share the hazards most likely to take out the first. A site on higher ground, fed
    from a different regional grid and within the replication limit, avoids both the flooding and the grid failures that
    threaten the primary, so one regional event is unlikely to stop both sites.
  why_not:
    A: Raising the building and adding generators hardens it, but it sits on the same plain. Floods that close roads for days
      would cut off staff and fuel deliveries to both sites at the same moment.
    C: A distant site in another region is the usual choice for avoiding regional disasters, but 300 km is far beyond the 60 km
      that synchronous replication allows, so it cannot serve the stated design.
    D: Higher ground avoids the floods, and generators cover outages, but a failure of the shared regional grid would put both
      sites on generators at once, which is the common dependency the second site is meant to remove.
