subdomain: '3.8'
difficulty: hard
stem: A news organisation is designing its new headquarters. Last year a letter containing white powder was opened at a
  newsroom desk; it proved harmless, but the floor was evacuated for six hours. Couriers now carry packages through the main
  lobby and lifts, and legal papers must reach journalists within an hour of arrival. Where should incoming mail BEST be
  received and opened?
options:
  A: A ground-floor room at the perimeter, with an outside door and its own air handling
  B: A sealed basement room with its own air handling, below the occupied floors
  C: A screening room off the main lobby, with an X-ray scanner and a dedicated extract fan
  D: An off-site screening service with its own sealed rooms, delivering in batches
answer: A
explanation:
  why_correct: A suspect item should be contained before it enters the building. A perimeter room that couriers reach from
    outside, served by its own air handling, means mail is opened where a released agent stays out of shared ventilation
    and away from occupied space, so an incident closes one room rather than a floor, and items can still reach journalists
    within the hour.
  why_not:
    B: A sealed basement room with separate air contains an agent well once mail is there, but packages would still be carried
      unscreened through the lobby and lifts to reach it, past staff and visitors.
    C: X-ray screening and local extraction help, but X-ray does not reliably reveal powders, and the room opens onto the busy
      lobby, so an opened item would still risk exposing the people there.
    D: Off-site screening keeps suspect items away from staff altogether and suits organisations under threat, but batched
      delivery cannot get legal papers to journalists within the hour.
