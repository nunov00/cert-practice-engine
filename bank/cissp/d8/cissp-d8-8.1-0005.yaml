id: cissp-d8-8.1-0005
subdomain: '8.1'
difficulty: hard
stem: Three times this year, after a team retired a web app and deleted its cloud resources, an attacker claimed the freed
  cloud hostname that the company's DNS record still pointed to, and served pages under the company's domain within hours.
  Teams retire about ten apps a month. Which change BEST addresses this in the development life cycle?
options:
  A: Scan the company's DNS zones each week for records that point to unclaimed resources
  B: Monitor certificate transparency logs for new certificates on the company's domains
  C: Make removing an app's DNS records a retirement step, done before its resources go
  D: Keep a retired app's cloud resources reserved for 90 days before deleting them
answer: C
explanation:
  why_correct: The takeovers come from the retirement phase of the life cycle, where the DNS record outlives the resource
    it points to. Making DNS removal a step of decommissioning, ordered before the resources are deleted, means no record
    is left dangling for anyone to claim, for every app a team retires.
  why_not:
    A: A dangling-record scan is a useful safety net, but the attackers claimed the names within hours, and a weekly scan
      finds them days later.
    B: Certificate transparency monitoring can reveal a hijack, but only after the attacker has a certificate, and pages can
      be served without one.
    D: Holding the resources delays the gap, but when they are finally deleted the DNS record still points at a name anyone
      can claim.
