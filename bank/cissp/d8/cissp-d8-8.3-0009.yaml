id: cissp-d8-8.3-0009
subdomain: '8.3'
difficulty: medium
stem: A bank's API has an automated authorisation test suite that executes every line of its access control module. After
  a refactor, one endpoint's ownership check was inverted, yet the suite still passed, and a tester found the flaw weeks
  later. The CISO wants evidence of how well the suite would catch slips like this in future. Which assessment BEST provides
  it?
options:
  A: Measure branch coverage of the module, adding tests until each branch runs
  B: Plant faults in copies of the access checks and count those the suite catches
  C: Have a security engineer review each test case against the written access policy
  D: Commission a penetration test of the API after each significant refactor
answer: B
explanation:
  why_correct: The suite ran the faulty code and still passed, so the open question is whether its assertions would notice
    a broken check. Deliberately altering access checks in copies of the code, for example inverting or removing them,
    and counting how many of those changes make the suite fail measures that directly, and each change that survives
    points to a missing test.
  why_not:
    A: Branch coverage shows which paths the tests run, but the suite already ran the inverted check without failing.
      Running code is not the same as checking its result.
    C: A review can spot gaps in the cases, but it gives an opinion rather than a measure, and weak assertions in tests that
      look complete are easy to miss by reading.
    D: A penetration test finds flaws in the API as it stands, but it says nothing about whether the suite would catch the
      next slip before release.
