subdomain: '8.5'
difficulty: hard
stem: A payments API logs each failed request in full so support staff can debug it, and a filter masks card numbers. An audit
  found session tokens, API keys and bank details in the logs, which the company ships to an outside analytics provider. Many
  came from free-text fields where customers paste whatever they like. Which rule should the secure coding standard set?
options:
  A: Log only the fields approved for each event type, dropping the rest
  B: Mask values in fields that the API schema marks sensitive, as for cards
  C: Mask values matching known secret patterns, tuned from weekly log samples
  D: Log full requests only to an internal store with seven-day retention
answer: A
explanation:
  why_correct: Logging whole requests puts whatever a request carries into the logs, and no filter can recognise every secret
    a customer might paste into a free-text field. Writing only the fields approved for each event type keeps secrets out by
    design, while support still gets the identifiers, error codes and context it needs to debug.
  why_not:
    B: Schema-driven masking handles fields known to hold secrets, but a free-text field is not marked sensitive, so secrets
      pasted into it are logged in the clear.
    C: Pattern masking that is tuned over time catches more formats, but secrets pasted into free text take any form, and
      each new form leaks until the weekly sample finds it.
    D: An internal store with short retention keeps the data from the analytics provider and limits exposure, but session tokens,
      keys and bank details would still be written to logs that staff and systems can read.
