id: cissp-d8-8.4-0006
subdomain: '8.4'
difficulty: hard
stem: A company has bought an identity management product that creates and changes accounts across its directory. The
  vendor supports it only when its service account is a domain administrator, and the company will run it in a supported
  setup. The application team, whose administrators manage the business servers, expects to run the product's server.
  How should the company deploy it?
options:
  A: Domain administrator, on a hardened server run by the application team, with the password vaulted and rotated
  B: Domain administrator, on a hardened server run by the application team, reachable only from privileged access
    workstations
  C: Domain administrator, on a hardened server run by the team that runs the domain controllers
  D: Domain administrator, in its own network segment, with the application team running the server
answer: C
explanation:
  why_correct: A service with domain administrator rights makes its server as powerful as a domain controller, because
    whoever administers that server can use the rights. Hardening it and having it run only by the team, accounts and
    workstations that manage the domain controllers keeps the vendor's supported setup while stopping the application
    team's wider estate from becoming a path to the domain.
  why_not:
    A: Hardening and vaulting are sound, but the password vault does not stop the server's own administrators from using the
      running service's rights, and theirs are accounts used across ordinary business servers.
    B: "Restricting where the server can be reached from does not change who administers it: the application team's
      accounts, used across ordinary servers, would still control a server with domain rights."
    D: A separate segment limits network paths to the server, but the application team, whose accounts are used across
      business servers, would still administer a server that holds domain control.
