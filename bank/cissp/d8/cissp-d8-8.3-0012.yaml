id: cissp-d8-8.3-0012
subdomain: '8.3'
difficulty: hard
stem: A software vendor's competitor shipped a signed update carrying a backdoor that attackers had inserted on its build
  server; its source repository was clean, and every commit had been reviewed. The vendor's builds are deterministic, a
  property it adopted to speed up caching. Its board asks for evidence, on each release, that shipped binaries contain only
  reviewed code. Which assessment BEST provides it?
options:
  A: Rebuild each release on separate, clean infrastructure and compare the outputs
  B: Verify that each shipped binary carries a valid signature from the release key
  C: Check that each commit in the release has an approved review and a linked ticket
  D: Scan each shipped binary with several anti-malware engines before publishing it
answer: A
explanation:
  why_correct: The risk is code added between reviewed source and shipped binary. Because the builds are deterministic, the
    same reviewed source built on separate, independently controlled infrastructure should give identical output, so any
    difference shows that one build was tampered with. An attacker would have to compromise both build environments to
    pass the comparison.
  why_not:
    B: A valid signature shows the release came through the vendor's signing step, but the competitor's backdoor was built
      and signed by its own compromised pipeline, so it carried a valid signature too.
    C: Review records confirm that the source was reviewed, which the competitor's was, but they say nothing about code
      inserted afterwards during the build.
    D: Anti-malware engines catch known malicious code, but a backdoor written for one product and one target has no
      signature, and it looks like ordinary product code.
