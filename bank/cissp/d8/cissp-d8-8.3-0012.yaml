id: cissp-d8-8.3-0012
subdomain: '8.3'
difficulty: medium
stem: A software vendor's competitor shipped an update carrying a backdoor that attackers had inserted on its build
  server, while the code in its source repository was clean. The vendor's board asks for evidence, on each release, that
  shipped binaries contain only reviewed code. Which assessment BEST provides it?
options:
  A: Rebuild each release reproducibly on separate infrastructure and compare outputs
  B: Verify that each shipped binary carries a valid signature from the release key
  C: Check that each commit in the release has an approved review and a linked ticket
  D: Scan each shipped binary with several anti-malware engines before publishing it
answer: A
explanation:
  why_correct: The risk is code added between reviewed source and shipped binary. A reproducible build gives identical
    output from the same source, so building the reviewed source again on separate, independently controlled infrastructure
    and comparing it, with the signature set aside, with the shipped binary shows any difference that one build environment added. An attacker would have
    to compromise both environments to pass the comparison.
  why_not:
    B: A valid signature shows the release came through the vendor's own signing step, but code inserted on the build server
      is built and then signed by that same pipeline, so a tampered binary carries a valid signature too.
    C: Review records show that every change to the source was reviewed, which answers the board only if the binary matches
      the source, and code inserted during the build never appears in the repository for anyone to review.
    D: Anti-malware engines catch known malicious code, but a backdoor written for one product and one target has no
      signature, and it looks like ordinary product code.
