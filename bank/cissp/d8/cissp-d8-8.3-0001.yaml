subdomain: '8.3'
difficulty: hard
stem: A company's static analysis tool has reported no high-severity findings for six months. A penetration test then found
  SQL injection in a module built with a new web framework the team adopted this year. Which step BEST shows whether the tool
  can still be relied on?
options:
  A: Run the tool on new-framework code seeded with known flaws
  B: Add dynamic scanning of the module to the release pipeline
  C: Review the last six months of scan logs for errors
  D: Compare its results with a second static analysis tool
answer: A
explanation:
  why_correct: Code with known, planted flaws gives a ground truth. If the tool misses them in the new framework, its silence
    for six months means little there, and its rules or configuration need fixing.
  why_not:
    B: Dynamic scanning adds another layer of testing, which may help, but it does not measure whether the static tool works.
    C: Log errors show whether scans ran, not whether the tool understands the new framework's data flows. A scan can run
      cleanly and still miss flaws.
    D: A second tool shows where the two disagree, but without known flaws there is no way to tell which one is right, and
      both may miss the same issues.
