id: cissp-d8-8.1-0003
subdomain: '8.1'
difficulty: hard
stem: A retailer's 12 product teams deploy to production about 40 times a day. Policy requires its two-person application
  security team to review each release, so teams have begun to skip the review. Last month a broken access check in the checkout
  API went live unreviewed. Which change BEST builds security review into this delivery process?
options:
  A: A pipeline gate that blocks each deployment until a security reviewer approves it
  B: Security review for each change that touches code designated as sensitive
  C: Security review of a random sample of releases, sized to the team's capacity
  D: Automated SAST and DAST scans in the pipeline that block deployments on failure
answer: B
explanation:
  why_correct: Two specialists cannot review 40 releases a day, so their time has to go where a missed flaw costs most. Routing
    every change to sensitive code, such as checkout and access control, to them means the kind of change that slipped through
    last month is always reviewed, while routine changes flow.
  why_not:
    A: Enforcing the gate is the usual answer to a bypassed control, but two reviewers facing 40 releases a day become a queue
      that halts delivery or turns review into a rubber stamp.
    C: Sampling fits the review load to capacity and keeps teams honest, but it leaves the choice to chance, so a change to
      checkout logic is still more likely to go unreviewed than reviewed.
    D: Pipeline scanners scale with deployments and catch many common flaws, but a broken access check is business logic that
      generic scanners rarely recognise. Catching it automatically takes authorisation tests written for the application's
      own rules, which these scans are not.
