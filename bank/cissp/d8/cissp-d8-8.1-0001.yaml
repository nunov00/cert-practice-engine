stem: A product group works in two-week sprints, and each team has a security champion with a few hours a week for
  security. Champions are asked only to review finished code, so design flaws found late need rework across several
  sprints. Which change BEST integrates security into the SDLC?
options:
  A: Add a security sign-off gate before each production release
  B: Commission a penetration test at the end of each quarter
  C: Have champions review each design at sprint planning
  D: Add threat modelling and security criteria to backlog items
answer: D
explanation:
  why_correct: The flaws are design flaws found late. Threat modelling and security acceptance criteria in backlog
    items move security into planning and design for the whole team in each sprint, where fixing is cheapest.
  why_not:
    A: A release gate still finds problems at the end, after the design work is done.
    B: Quarterly testing finds issues even later and on a slower cycle than the sprints.
    C: Earlier champion reviews help, but a champion with a few hours a week cannot review each design; making it
      part of the team's backlog work scales better.
