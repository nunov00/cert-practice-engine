subdomain: '8.4'
difficulty: medium
stem: A hospital is buying infusion pumps whose control software runs on an embedded operating system, and it plans to use
  them for ten years. Pumps it bought earlier still work, but their vendor stopped issuing security fixes once the model was
  withdrawn from sale, four years after launch. Which purchase requirement BEST addresses this?
options:
  A: Security fixes for as long as the vendor sells the model, with a year's notice before they end
  B: Security fixes for the software and its components for at least ten years after delivery
  C: Escrow of the pump software's source code, released to the hospital if the fixes stop
  D: A software bill of materials with each release, listing its components and their versions
answer: B
explanation:
  why_correct: The hospital's risk is a device it still depends on that no longer receives fixes. Tying the vendor's security
    support, for the operating system and components as well as its own code, to the pumps' planned service life from delivery
    closes that gap, and the cost of that support can be weighed in the purchase.
  why_not:
    A: Notice before support ends helps planning, but tying fixes to the sales period repeats the earlier problem, since models
      are withdrawn from sale long before hospitals retire them.
    C: Escrow protects against a vendor failing, but a hospital cannot safely build, test and certify changes to medical device
      software, so released source code would not produce fixes.
    D: A bill of materials shows which components carry known flaws, which helps assess exposure, but it does not oblige anyone
      to fix them.
