stem: A design-collaboration service unpacks each customer's uploaded zip archives into that customer's project folder, keeping
  the folder structure, and customers' tools then open the files by those paths. A tester's archive entry named ../other-firm/plans.dwg
  overwrote a file in another customer's project. The team's fix, rejecting names that contain ../, was bypassed with an entry
  that was a symbolic link. Which rule should the secure coding standard set?
options:
  A: Reject archive entries whose names contain ../, absolute paths, drive letters or links
  B: Unpack archives under an account that cannot write outside the shared projects area
  C: Store each unpacked file under a generated name, recording its original path as data
  D: Resolve each entry's final path, following links, and reject any outside the target folder
answer: D
explanation:
  why_correct: The flaw is trusting a path supplied in the archive. Resolving where each entry would actually land, after
    joining it to the target folder and following any links, and refusing anything outside that folder, checks the result
    rather than the spelling of the name, so new tricks with encodings, separators or links fail the same way.
  why_not:
    A: A longer deny-list closes the tricks seen so far, but it still checks how names are spelled, and attackers keep finding
      spellings and entry types that the list misses, as the first fix showed.
    B: A restricted account is good defence in depth, but every customer's project sits inside the shared projects area, so
      it could still overwrite another customer's files.
    C: Generated names stop an entry choosing where it lands, but customers' tools open the files by their original paths,
      so the folder structure has to exist on disk.
