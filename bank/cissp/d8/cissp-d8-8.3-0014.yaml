id: cissp-d8-8.3-0014
subdomain: '8.3'
difficulty: medium
stem: A payments company's 18 product teams write a threat model for each new feature, and 97% of last year's features had
  one. Penetration tests and the bug bounty found 31 design-level flaws in those features after release. The CISO must tell
  the board whether threat modelling is catching design flaws before release. Which evidence BEST answers this?
options:
  A: Share of features released with an approved threat model, trended by quarter
  B: Architects' scores for a sample of threat models, rated against a quality rubric
  C: Whether each of the 31 flaws was named in its feature's model, and what became of it
  D: Number of threats and mitigations recorded per model, compared across teams
answer: C
explanation:
  why_correct: The board's question is about outcomes, and the 31 flaws found after release are the outcomes. Tracing each
    one back to its feature's model shows whether the practice missed the threat, named it but left it unmitigated, or
    planned a mitigation that was not built, and each answer points to a different fix. Coverage and document quality say
    nothing about which of those is happening.
  why_not:
    A: Coverage shows the practice is being followed, and it is already near complete, but a model can exist for every
      feature and still miss the threats that later became flaws.
    B: Rubric reviews are a sound way to raise the quality of models, but they judge how well a model is written, not
      whether it caught the flaws that testers and researchers later found.
    D: Counts of threats and mitigations measure activity, and teams can record many routine threats while missing the
      design flaws that matter.
