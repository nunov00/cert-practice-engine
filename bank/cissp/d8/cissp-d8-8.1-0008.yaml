id: cissp-d8-8.1-0008
subdomain: '8.1'
difficulty: hard
stem: A retailer's mobile app ships weekly, and each release passes functional tests, automated security scans and a
  quarterly penetration test. This year customers drained loyalty points by cancelling orders after points were credited,
  and stacked single-use discount codes across parallel sessions. Both features behaved as their user stories specified.
  Which change BEST addresses this in the SDLC?
options:
  A: Abuse cases written with each user story, and tests that check the feature resists them
  B: Security acceptance criteria from a standard requirements checklist added to each story
  C: A threat model of the app's architecture, revisited at each quarterly penetration test
  D: A penetration test of each weekly release, focused on the features that the release changes
answer: A
explanation:
  why_correct: Both losses came from features that did exactly what their stories asked, so the flaw lay in the
    requirements, which never said how those particular features could be misused. Writing abuse cases alongside each
    story, such as cancelling after a reward or reusing a code in parallel, puts the retailer's own limits into the
    requirement as each feature is designed, and gives testers something concrete to verify every week.
  why_not:
    B: A standard checklist brings security into requirements, but its criteria are generic, such as authentication,
      input validation and session handling, and cannot state this retailer's own rules for when points are reversed or
      a code counts as used.
    C: Threat modelling is the right kind of early activity, but a quarterly review of the architecture looks at
      components and trust boundaries, and it lags behind loyalty and discount features that change in each weekly
      release.
    D: Testers find business-logic flaws more often than tools do, but a test per weekly release is costly, and testers
      still judge against stories that never stated the limits the features needed.
