subdomain: '8.3'
difficulty: hard
stem: A software company is choosing between two static analysis tools after a month's trial. Most of its code uses an
  in-house web framework, and its version history holds the fixes for 40 flaws that penetration tests found over three
  years. Tool X reported twice as many findings as tool Y on the current code. Which evidence BEST shows which tool will
  miss fewer of the real flaws in this code?
options:
  A: Each tool's scan of the code before the 40 fixes, counting the flaws it finds
  B: Each tool's score on a public benchmark of seeded flaws in common frameworks
  C: Each tool's findings on current code, with a sample triaged for false positives
  D: Developers' ratings of each tool's findings after a month in the pipeline
answer: A
explanation:
  why_correct: The 40 fixed flaws are known, real flaws in this company's own framework. Scanning the code as it was
    before each fix shows how many of them each tool would have caught, a direct measure of detection on the code that
    matters, which no count of new findings can give.
  why_not:
    B: A public benchmark gives a fair, repeatable comparison, but it tests common frameworks, and a tool's ability to
      follow data through an in-house framework is exactly where tools differ most.
    C: Triage shows how many findings are real, which matters for workload, but it says nothing about the real flaws each
      tool misses, so a precise tool can still look better than it is.
    D: Developer ratings capture usability and trust, which affect adoption, but they reflect how findings feel to work
      with rather than whether real flaws are found.
