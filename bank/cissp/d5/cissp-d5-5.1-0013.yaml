subdomain: '5.1'
difficulty: easy
stem: About 400 staff and contractors hold standing badge access to a company's data hall, though only about 20 enter it
  in a typical month, and mostly different people each month. Nearly all visits are planned work under approved change
  tickets. At the last quarterly access review, managers confirmed all 400 holders as still needed. Which change BEST
  reduces this exposure?
options:
  A: Access that lapses after six months unless the holder's manager renews it in the system
  B: Access granted for the window of each approved change ticket, ending when it closes
  C: Access for one day at a time, issued by the security desk to anyone on the approved list
  D: Removal of access from each holder who has not entered the data hall for 90 days
answer: B
explanation:
  why_correct: The exposure is hundreds of people able to enter at any time when only a few need to on a given day. Visits
    are planned under approved change tickets, so tying access to each ticket's window grants it only to the named people
    doing approved work, only while it runs, and removes it on its own afterwards. A small standing list for the on-call
    team can cover the rare unplanned visit.
  why_not:
    A: Expiry with renewal is a common way to stop access piling up, but it relies on the same managers who just confirmed
      all 400 holders, so most access would simply be renewed.
    C: Day passes shorten each grant, but the approved list is the 400 people managers confirmed, so any of them can still
      get in on any day, without the entry being tied to approved work.
    D: Removing unused access is a sound clean-up, but because different people visit each month, it would still leave
      dozens with standing access while cutting off people who will soon need it again.
