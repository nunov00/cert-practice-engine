subdomain: '5.3'
difficulty: medium
stem: A company's expense app signs staff in through a cloud identity platform. Developers registered it as multi-tenant to
  ease a planned partner rollout, and the app checks each token's expiry and audience. A tester signed in with an account
  from her own organisation's tenant on the same platform and filed expenses. Which check BEST closes this?
options:
  A: Accept only users whose email claim ends in the company's own domain
  B: Accept only tokens whose issuer is the company's or a listed partner's tenant
  C: Accept only tokens that carry a claim showing multi-factor sign-in
  D: Accept only tokens signed with the identity platform's published keys
answer: B
explanation:
  why_correct: With a multi-tenant registration the platform issues tokens for the app to users of any tenant, and those tokens
    carry the right audience. The issuer, or tenant, claim says which organisation vouched for the user, so validating it against
    the tenants configured as trusted, the company's own and approved partners', is what limits sign-in to the intended organisations.
  why_not:
    A: Checking the email domain looks like a natural filter, but the email claim is set by the user's own tenant, and on many platforms
      its administrators can set an address in the company's domain, so the claim does not prove membership.
    C: An MFA claim shows how the user signed in at her own tenant. The tester's organisation can satisfy it, and she would
      still be from the wrong organisation.
    D: Signature checks are essential, but on a multi-tenant platform of this kind every tenant's tokens are typically signed
      with the same published keys, so the tester's
      genuine token would pass.
