id: cissp-d5-5.4-0002
subdomain: '5.4'
difficulty: medium
stem: In a small purchasing team, members cover for absent colleagues, so each holds both the requester and approver roles.
  Policy says nobody may approve a purchase request they raised. Which control BEST enforces the policy?
options:
  A: Bar any user from holding both the requester and approver roles
  B: Block approval of a request by the user who raised it
  C: Review a monthly report of requests approved by their requester
  D: Require two approvers for each request above a set value
answer: B
explanation:
  why_correct: This is dynamic separation of duties. Users may hold both roles, but the system checks at the moment of approval
    that the approver is not the requester. That enforces the policy while keeping the cover the team relies on.
  why_not:
    A: Static separation of duties is the usual design, but it would stop members covering for each other, which the small
      team needs.
    C: A monthly report finds self-approvals after the money has been committed. It detects breaches rather than preventing
      them.
    D: Two approvers raise the bar for large requests, but one of them could still be the requester, and smaller requests
      are not covered at all.
