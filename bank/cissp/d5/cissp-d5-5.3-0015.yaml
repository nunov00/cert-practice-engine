id: cissp-d5-5.3-0015
subdomain: '5.3'
difficulty: hard
stem: A research data portal accepts SAML sign-ins from the identity providers of 300 member universities, all of them members
  of a national research federation. Each university rotates its signing certificate on its own schedule and emails the new
  one to the portal team. After three missed emails broke sign-in, support staff switched signature checking off for those
  universities until engineers loaded the new certificates. Which change BEST prevents this?
options:
  A: Refresh member certificates daily from the federation's signed metadata
  B: Require members to send new certificates 30 days before each rotation
  C: Block support staff from disabling signature checks, paging engineers instead
  D: Trust certificates for each member's domain issued by a public authority
answer: A
explanation:
  why_correct: Research federations publish their members' identity provider details, including signing certificates, as metadata
    signed by the federation operator. Loading it automatically each day means a rotation reaches the portal without anyone
    emailing or loading anything, and the federation's signature lets the portal trust what it loads, so sign-in keeps working
    and nobody needs to turn checks off.
  why_not:
    B: Advance notice is a sound term in a bilateral federation, but with 300 universities rotating on their own schedules
      the portal still depends on each email arriving and being loaded by hand, which is what failed.
    C: Stopping support staff from disabling checks removes the unsafe workaround, but sign-in still breaks at each missed
      rotation, now with an outage until an engineer responds.
    D: Signing certificates in SAML are usually self-signed and trusted through metadata rather than through a public authority,
      and trusting any certificate issued for a domain would let a new key be accepted without the university having registered
      it.
