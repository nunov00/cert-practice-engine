id: cissp-d5-5.2-0001
subdomain: '5.2'
difficulty: medium
stem: A bank's call-centre staff sign in with a password and a push approval on their personal phones. Attackers
  now send repeated push requests until someone approves one. The bank will buy no new hardware this year. Which
  change BEST addresses this?
options:
  A: Shorten the push approval timeout to 20 seconds
  B: Require number matching in each push prompt
  C: Issue FIDO2 security keys to call-centre staff
  D: Switch the second factor to SMS one-time codes
answer: B
explanation:
  why_correct: Number matching makes the user type a code shown on the sign-in screen, so a person who is not signing
    in cannot approve by tapping. It defeats push fatigue on the phones staff already have.
  why_not:
    A: A shorter timeout limits each request but attackers can simply send more. Staff can still approve with one
      tap.
    C: Hardware keys are phishing-resistant and would be strong, but buying them breaks the stated constraint of
      no new hardware this year.
    D: 'SMS codes stop push bombing but are weaker overall: they can be phished or intercepted through SIM swapping.'
