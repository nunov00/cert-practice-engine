id: cissp-d5-5.4-0013
subdomain: '5.4'
difficulty: hard
stem: An online retailer's 150 microservices run on a shared container platform, where instances move between hosts as
  it rescales, and any service can call any other. An attacker who exploited a flaw in the product-review service called
  the payments service's refund API directly. Refunds should come only from the order service and a nightly reconciliation
  job. Which control BEST fits?
options:
  A: Mutual TLS between services, each with its own certificate from the platform
  B: Network rules that let only the order and reconciliation hosts reach payments
  C: A refund API policy accepting only the order and reconciliation identities
  D: A gateway in front of payments that requires a valid customer token on refund calls
answer: C
explanation:
  why_correct: The gap is authorisation between services. Giving each workload its own identity and having the refund API
    decide, on each call, whether the calling identity is one allowed to request refunds, limits the API to the order
    service and the reconciliation job, whichever hosts they run on. A compromised review service can still connect, but
    its identity is refused.
  why_not:
    A: Mutual TLS gives each service a verified identity, which the policy needs, but on its own it only authenticates.
      The compromised review service has a valid certificate too, and nothing yet says it may not call refunds.
    B: Host-based network rules would work if services stayed put, but instances move between hosts as the platform rescales,
      so the hosts allowed today may run the review service tomorrow.
    D: Requiring a customer token fits calls made on a customer's behalf, but the nightly reconciliation job acts for no
      customer and has no such token, so legitimate refunds from it would fail.
