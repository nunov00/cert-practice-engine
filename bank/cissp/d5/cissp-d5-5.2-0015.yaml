difficulty: hard
stem: A university's 150 applications link each user's records to the email address the identity provider sends at sign-in,
  and they pass records to one another by that value. Staff who change their names are issued new addresses, and the applications
  then open fresh accounts. Visiting researchers and contractors, a third of users, have directory accounts but no HR or student
  record. Which identifier should the identity provider send instead?
options:
  A: The HR or student number, fixed for each person's time at the university
  B: An opaque pseudonym generated for each application, fixed for each user
  C: The sign-in name, renamed in each application through the account-change process
  D: An opaque directory identifier, the same in each application, fixed for each user
answer: D
explanation:
  why_correct: The applications need a value that exists for every account, does not change with a person's name, and is the
    same everywhere so that records passed between applications still match. An opaque identifier assigned by the directory
    meets all three, for staff, students, visitors and contractors alike.
  why_not:
    A: HR and student numbers are stable and familiar, but a third of users have neither, so the applications would have nothing
      to link their records to.
    B: Per-application pseudonyms are good practice when services must not be able to link users, but here the applications
      pass records to one another, and different values for the same person break those links.
    C: A rename process can work for a few systems, but the sign-in name still changes, and every one of 150 applications,
      and every record passed between them, must be updated in step for each rename.
