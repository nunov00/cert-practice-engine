stem: A university's 150 applications link each user's records to the email address the identity provider sends at sign-in.
  When staff change their names they are issued a new address, and the applications then create fresh accounts, cutting them
  off from their history. Visiting researchers and contractors, a third of users, have directory accounts but no HR or student
  record. Which identifier should the applications store for each user?
options:
  A: The email address, with each former address kept as an alias of the new one
  B: The HR or student number, released by the identity provider at each sign-in
  C: The sign-in name, changed through a rename process that updates each application
  D: An opaque directory identifier, fixed for the account's life and not reissued
answer: D
explanation:
  why_correct: An identifier that applications use to link records should be unique, stable and not reused. A directory-assigned
    opaque identifier exists for every account, including visitors and contractors, and does not change when a person's name
    does, so all 150 applications keep the link to each user's history without any rename work.
  why_not:
    A: Aliases let old mail arrive, but the identity provider still sends the new primary address at sign-in, so the applications
      see a new value and create a new account.
    B: HR and student numbers are stable for staff and students, but a third of users have neither, so the applications would
      have no identifier for them.
    C: The sign-in name is usually built from the person's name, so it changes in the same way, and a rename process must
      succeed in each of 150 applications every time.
