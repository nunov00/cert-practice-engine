id: cissp-d5-5.3-0004
subdomain: "5.3"
difficulty: medium
stem: A company's mobile app signs users in through OpenID Connect using the implicit flow, so tokens arrive in the
  redirect. Testers showed that a malicious app on the same phone registered the same custom URI scheme and captured
  users' tokens. Which change BEST fixes this?
options:
  A: Authorization code flow with PKCE
  B: Authorization code flow with a client secret stored in the app
  C: Implicit flow with a nonce checked in each ID token
  D: Authorization code flow with DPoP-bound access tokens
answer: A
explanation:
  why_correct: With the code flow, the redirect carries only a one-time code, and PKCE ties that code to a secret verifier
    created by the genuine app for each sign-in. A malicious app that intercepts the redirect cannot exchange the code
    without the verifier.
  why_not:
    B: A client secret authenticates a server-side client, but a secret shipped inside a mobile app can be extracted from
      the app package by anyone, so a malicious app's author can redeem an intercepted code with it.
    C: A nonce stops replay of an ID token into a different sign-in, but an app that intercepts the redirect still receives
      usable tokens.
    D: DPoP binds tokens to a key held by the client that redeems the code, which stops stolen tokens being replayed elsewhere.
      A malicious app that intercepts the code redeems it with its own key, so the tokens it gets are bound to that app.
