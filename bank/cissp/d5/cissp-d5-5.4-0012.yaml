difficulty: hard
stem: An advisory firm's 80 analysts are drawn from one pool onto deals, and each deal's lead adds them to its data room,
  often late at night before a bid. Policy bars anyone who has seen one bidder's files from seeing a rival bidder's files
  for the same target. Last month two leads added the same analyst to rival bidders' rooms, neither aware of the other. Which
  control BEST enforces the policy?
options:
  A: A compliance officer approves each addition to a data room against the deal register
  B: A role for each data room, granted from a catalogue compliance approves for each deal
  C: Data rooms that refuse anyone who has opened a rival bidder's room for the same target
  D: A daily report to compliance of analysts holding access to rival rooms for one target
answer: C
explanation:
  why_correct: The policy turns on what each analyst has already seen, which is a conflict-of-interest rule in the style of
    the Brewer-Nash model. Rooms that check the analyst's access history and refuse entry once a rival room has been opened
    enforce exactly that at the moment of access, at any hour, while leads can keep staffing deals from the shared pool.
  why_not:
    A: Manual approval can catch conflicts, but additions happen late at night before bids, so either the officer becomes
      a bottleneck at those hours or approvals are rushed; it also checks assignments, not what an analyst has actually opened.
    B: Roles per room organise who is granted access, but nothing in a role remembers that the analyst has already opened
      a rival's files, so two leads can still grant both.
    D: A daily report finds the conflict after the analyst may already have opened both rooms, which is the harm the policy
      is meant to prevent.
