id: cissp-d5-5.3-0012
subdomain: '5.3'
difficulty: medium
stem: A university lets students use three outside learning platforms through federation with its identity provider. Each
  platform must recognise a returning student so that saved work follows them from year to year. Two of the platforms belong
  to one parent company, which merges usage data across its products, and the university's privacy policy bars suppliers
  from profiling students across services. Which identifier should the identity provider release?
options:
  A: A persistent pseudonym generated once per student and released to each platform
  B: A persistent pseudonym generated for each supplier company the university contracts with
  C: A persistent pseudonym generated for each platform, then reissued at the start of each term
  D: A persistent pseudonym generated for each platform the university connects to
answer: D
explanation:
  why_correct: A pseudonym that stays the same lets each platform recognise a returning student, and generating a different
    one for each platform means the parent company receives two unrelated values for the same student, so it cannot join
    their activity across its two products. No name, email address or student number is released.
  why_not:
    A: One pseudonym hides the student's real identity, but every platform receives the same value, so the parent company
      and any platforms that share data can join a student's records across services.
    B: A pseudonym per supplier stops different suppliers from linking students, but the parent company owns two of the
      platforms and would receive the same value on both, which is exactly the merging the policy bars.
    C: Reissuing pseudonyms each term limits long-term tracking, but platforms would then see a stranger every term, so
      saved work would not follow students from year to year.
