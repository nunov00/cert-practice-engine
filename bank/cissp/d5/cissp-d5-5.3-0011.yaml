id: cissp-d5-5.3-0011
subdomain: '5.3'
difficulty: medium
stem: A retailer's staff portal accepts SAML responses from the corporate identity provider. Each response is signed, its
  assertion is encrypted and valid for five minutes, and staff in stores share PCs. In a test, a consultant copied a response
  that a store manager had just used to sign in, posted it to the portal a minute later from another machine, and was signed
  in as the manager. Which change BEST stops this?
options:
  A: Shorten each assertion's validity window from five minutes to one
  B: Require the portal to sign the requests it sends to the identity provider
  C: Record each accepted assertion ID and reject any that is presented again
  D: Have the identity provider force a fresh sign-in for each portal request
answer: C
explanation:
  why_correct: The consultant replayed a valid, signed assertion that had already been used. Tracking the IDs of assertions
    the portal has accepted, for at least their validity period, and refusing any repeat, makes each assertion single use,
    so a copy is worthless once the genuine sign-in has consumed it. Checking that each response answers a request the portal
    itself sent closes the same gap for unsolicited responses.
  why_not:
    A: A shorter window narrows the time for replay, which helps, but the consultant needed only a minute, and a window short
      enough to stop that would reject genuine sign-ins delayed by clock skew.
    B: Signed requests let the identity provider trust what the portal asks for, but the replay never goes back to the identity
      provider; it is the response that is reused at the portal.
    D: Forcing re-authentication makes the user prove themselves again at the identity provider, but the copied response
      already records a completed sign-in, so presenting it again needs no new authentication.
