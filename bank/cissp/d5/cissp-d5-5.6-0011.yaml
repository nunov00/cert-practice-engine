subdomain: '5.6'
difficulty: hard
stem: A retailer stores its 3 million customer passwords as salted SHA-256 hashes, which testers cracked at billions of
  guesses a second. The team will move to a memory-hard password hashing function. About 40 percent of accounts have not
  signed in for over a year but must be kept, and the business will not make customers reset their passwords. Which migration
  BEST fits?
options:
  A: Rehash each password with the new function when its owner next signs in
  B: Wrap each stored hash in the new function now, upgrading it at next sign-in
  C: Rehash at next sign-in, and lock inactive accounts until their owners reset
  D: Raise the SHA-256 iteration count now, rehashing each stored hash in place
answer: B
explanation:
  why_correct: Feeding each existing SHA-256 hash into the memory-hard function protects every stored password at once,
    including the many accounts that may not sign in for years, and needs no plaintext. At each sign-in the password
    can then be hashed directly with the new function and the wrapped record replaced.
  why_not:
    A: Rehashing at sign-in is the usual upgrade path, but it protects only active users; the 40 percent of dormant accounts
      would keep fast SHA-256 hashes indefinitely.
    C: Locking dormant accounts until a reset protects them, but it forces those customers to reset their passwords, which
      the business has ruled out.
    D: Iterating SHA-256 over the stored hashes can be done now, but it remains cheap to compute on GPUs, so it falls short
      of the memory-hard function the team has chosen to resist that cracking.
