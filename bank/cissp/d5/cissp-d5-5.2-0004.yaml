stem: A data centre's fingerprint readers run with a false acceptance rate of 0.5% and a false rejection rate of 4%. The vendor
  states that the crossover error rate is 1.5%. Security wants even fewer impostors accepted. Which change achieves this,
  and with what effect?
options:
  A: Raise sensitivity; both rates fall toward the crossover rate
  B: Move the threshold to the crossover point; both rates become 1.5%
  C: Lower sensitivity; false acceptances fall and false rejections rise
  D: Raise sensitivity; false acceptances fall and false rejections rise
answer: D
explanation:
  why_correct: Making the reader stricter rejects more borderline matches, so fewer impostors get in while more genuine staff
    are turned away. The two error rates move in opposite directions as the threshold changes.
  why_not:
    B: At the crossover point both rates equal 1.5%, which would triple false acceptances from today's 0.5%. The crossover
      rate compares systems; it is not the best setting for a high-security door.
    C: Lowering sensitivity accepts more borderline matches, which raises false acceptances, the opposite of the goal.
    A: Tuning the threshold trades one error for the other; it cannot lower both. Both fall only with a better sensor or algorithm.
