subdomain: '5.5'
difficulty: medium
stem: At a call-centre company, new hires get their access by copying the account of a colleague their manager names. An audit
  found new hires holding rights left over from the colleague's earlier projects, including refund approval. The 1,200 agents
  are hired into twelve job codes, and the rights each code needs change several times a year as products launch and retire.
  Which change BEST addresses this?
options:
  A: Copy each new hire from a curated template account kept for their job code
  B: Copy the named colleague, then strip any right not on the job code's list
  C: Grant each job code's rights through a role that all agents in the code hold
  D: Have managers check each new hire's rights against the job code after 30 days
answer: C
explanation:
  why_correct: The rights a job code needs keep changing. A role held by everyone in the code is the one place those rights
    are defined, so a change to the role reaches every current holder at once, and new hires receive only what the code needs
    today. Nothing is copied from anyone, so nothing is inherited.
  why_not:
    A: A curated template stops new hires inheriting a colleague's history, but the template only shapes accounts as they
      are created. Each time a code's rights change, agents copied earlier keep rights the code no longer needs, which rebuilds
      the same leftovers.
    B: Filtering the copy against the job code's list prevents excess at hire, but it too acts only at grant time. When the
      list changes, agents already in post keep the old rights until someone reworks each account.
    D: A check after 30 days finds excess rights, but only after the new hire has held them, refund approval included, for
      a month. It detects the problem rather than preventing it.
