subdomain: '5.5'
difficulty: easy
stem: At a call-centre company, new hires get their access by copying the account of a colleague named by their manager, who
  approves the request. An audit found new hires holding rights left over from the colleague's earlier projects, including
  refund approval. The 1,200 agents fall into twelve job codes, and staff within a code do nearly the same work. Which change
  BEST addresses this?
options:
  A: Have managers approve each copied right line by line before it is granted
  B: Review each new hire's access with their manager after the first 30 days
  C: Grant new hires a standard role set defined for each of the job codes
  D: Remove any right a user has not exercised in the previous 90 days
answer: C
explanation:
  why_correct: Copying a person copies that person's history. Because staff within a job code do nearly the same work, a role
    set defined for each code gives every new hire what the job needs and nothing inherited, and the excess never gets granted.
  why_not:
    A: Line-by-line approval improves on approving a whole copy, but managers would still be judging long lists of rights
      inherited from someone else, which is how the excess got through.
    B: An early review catches excess rights, but only after a month in which the new hire holds them, including refund approval.
      It cleans up the copy instead of stopping it.
    D: Removing unused rights is a good control against slow creep, but a copied right such as refund approval stays for up
      to 90 days, and a right used rarely but legitimately would be cut.
