id: cissp-d5-5.3-0002
subdomain: '5.3'
difficulty: hard
stem: A company lets a partner's engineers into its ticketing system through SAML federation with the partner's identity provider.
  Assertions are signed, and the app maps the partner's 'role' attribute straight to its own roles, including administrator.
  What is the BEST fix?
options:
  A: Assign admin rights in the company's own system
  B: Shorten assertion lifetimes to a few minutes
  C: Encrypt assertions in addition to signing them
  D: Require MFA for partner users at the partner's IdP
answer: A
explanation:
  why_correct: Federation should let the partner prove who its users are, not decide what they may do in the company's system.
    As built, any partner IdP administrator can make anyone an administrator here. Keeping high-privilege roles under the
    company's own authorisation closes that gap.
  why_not:
    B: Short lifetimes limit replay of captured assertions. A freshly issued assertion with an administrator role would still
      be honoured.
    C: Encryption keeps the assertion's contents private in transit. It does not change the rights the app grants from it.
    D: MFA makes partner sign-ins harder to steal, but the problem is what a valid assertion grants, not whether the sign-in
      is genuine.
