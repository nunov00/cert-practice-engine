subdomain: '5.1'
difficulty: easy
stem: A data centre controls entry with badge readers. Logs show staff often hold the door for colleagues, so the
  access records do not show who is inside. Which control BEST addresses this?
options:
  A: Add CCTV cameras covering each entrance
  B: Retrain staff on the tailgating rule
  C: Fit a mantrap that admits one person per badge
  D: Require a PIN in addition to the badge at each door
answer: C
explanation:
  why_correct: The problem is that more than one person can pass on a single badge. A mantrap or turnstile physically
    enforces one person per authentication, so the access records stay accurate.
  why_not:
    A: Cameras are detective. They record tailgating after it happens but do not prevent it or fix the access records.
    B: Training helps, but the behaviour is already common and courteous door-holding is hard to train away; it
      relies on people rather than enforcement.
    D: A PIN strengthens authentication of the badge holder but does nothing to stop a second person walking through
      behind them.
