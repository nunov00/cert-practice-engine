subdomain: '5.4'
difficulty: hard
stem: A bank's trading platform grants access through roles. Trading limits depend on the desk, the instrument and each trader's
  certification level, and the role list has grown to 1,400 roles, most held by one or two people. Which change BEST controls
  this growth while still enforcing the limits?
options:
  A: Write policies that evaluate desk, instrument and certification
  B: Build a role hierarchy so that senior roles inherit junior rights
  C: Let desk heads grant permissions to their traders directly
  D: Merge the roles into a few broad ones and review them each quarter
answer: A
explanation:
  why_correct: The roles multiply because every combination of desk, instrument and certification needs its own role. Attribute-based
    policies evaluate those attributes at request time, so one policy set covers every combination without a role for each.
  why_not:
    B: A hierarchy reduces duplicated rights between levels, but it does not remove the need for a role for each desk and
      instrument combination, so the explosion continues.
    C: Discretionary grants by desk heads move decisions away from central policy, making the limits harder to enforce and
      audit consistently.
    D: Broad roles cut the count but lose the fine-grained limits, so traders would get rights beyond their certification.
      Quarterly reviews would then find problems the design created.
