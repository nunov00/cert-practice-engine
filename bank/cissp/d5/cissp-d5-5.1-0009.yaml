stem: A bank hires an agency's analysts, who work on the agency's own laptops, to label documents in an internal web application.
  The agency will not let the bank install software on those laptops or manage them. The bank must keep copies of the documents
  off the laptops. Which access method BEST fits?
options:
  A: A virtual desktop reached through a browser, with file transfer and clipboard blocked
  B: The bank's VPN client, with a device health check of each laptop at connection
  C: Conditional access that admits only laptops passing the bank's managed-device check
  D: Direct access to the app over TLS, with MFA and the app's download buttons removed
answer: A
explanation:
  why_correct: A browser-based virtual desktop needs nothing installed, and the documents are shown as screen images while
    the data stays on the bank's systems. Blocking file transfer and the clipboard keeps copies from reaching the agency's
    laptops, without the bank having to manage them.
  why_not:
    B: A VPN with a health check is a common way to admit outside devices, but it needs the bank's client installed, and once
      connected the browser still saves documents to the laptop.
    C: Admitting only managed devices is the usual control for this risk, but the agency will not let the bank manage its laptops,
      so the analysts could not connect at all.
    D: Removing download buttons and adding MFA protects the sign-in, but the documents still reach the laptop's browser, which
      can save, print or cache them.
