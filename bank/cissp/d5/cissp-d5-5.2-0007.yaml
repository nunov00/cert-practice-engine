id: cissp-d5-5.2-0007
subdomain: '5.2'
difficulty: easy
stem: An outside agency is building a mobile app through which staff will reach the company's HR API from their own phones,
  which also carry personal apps they install themselves. The company's identity provider requires a passkey at sign-in, and
  the security team does not want the agency's code to see anything staff enter while signing in. Which sign-in design BEST
  fits?
options:
  A: Authorization code with PKCE, through the phone's system browser
  B: Authorization code with PKCE, in a web view embedded in the app
  C: Resource owner password grant, from the app's own sign-in screen
  D: Implicit grant, returning tokens to the app's registered redirect
answer: A
explanation:
  why_correct: Signing in through the system browser keeps the identity provider's page, and the passkey prompt, outside the
    agency's code. The code exchange with PKCE means that an authorization code caught by another app on the phone cannot be
    redeemed without the secret that only this app holds.
  why_not:
    B: A web view with PKCE uses the right flow, and many apps embed one for a smoother look, but the host app controls the
      web view and can read what is typed in it, and passkeys often do not work there.
    C: The password grant is simple for apps the company writes itself, but the agency's screen would collect the credentials
      directly, and it cannot carry a passkey sign-in.
    D: The implicit grant keeps credentials in the browser, but tokens come back in the redirect itself, so a personal app that
      claims the same redirect address can capture them.
