stem: At a software company, disabling leavers' accounts has twice stopped production jobs that ran under the leaver's personal
  credentials. In one case the leaver had inherited the jobs from a colleague years earlier and did not know they existed.
  Engineering managers now ask IT to keep each leaving engineer's account active for a month. Which change BEST addresses
  this?
options:
  A: Keep leaving engineers' accounts for 30 days with interactive sign-in blocked, then disable them
  B: Block production jobs from running under personal accounts, moving them to owned service accounts
  C: Have each leaving engineer list the jobs that use their credentials and move them before leaving
  D: Disable leavers' accounts on their last day, with an on-call engineer ready to restore failed jobs
answer: B
explanation:
  why_correct: The outages come from production work being tied to one person's identity, so the lifecycle of the job and
    the lifecycle of the person collide. Running jobs only under service accounts with named owners separates the two, so
    leavers can be disabled on time and the jobs keep running.
  why_not:
    A: Blocking interactive sign-in does not stop the credentials the jobs use, so a former employee's access stays usable
      for a month, and the jobs still fail on day 30.
    C: A leaver's own list only helps if they know their jobs, and here one leaver did not know the inherited jobs existed.
    D: Disabling on time is right, but restoring jobs after they fail accepts repeated production outages and leaves the cause
      in place.
