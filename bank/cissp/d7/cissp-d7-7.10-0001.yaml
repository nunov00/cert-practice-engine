difficulty: hard
stem: An online retailer's order database has a recovery point objective of 15 minutes and a recovery time objective of four
  hours. The main scenario in its recovery plan is ransomware encrypting storage across the primary site. Which strategy BEST
  meets these needs?
options:
  A: Synchronous replication to a hot site in another region
  B: Immutable 15-minute snapshots in an isolated account
  C: Nightly backups to offline tape held at a secure vault
  D: Continuous replication to a second array in the same data centre
answer: B
explanation:
  why_correct: Frequent snapshots meet the 15-minute RPO, and copies that cannot be changed and sit apart from production
    survive ransomware that reaches the primary site. Restoring from them fits within four hours.
  why_not:
    A: A hot site meets the RTO for site loss, but synchronous replication copies the encrypted data too, so the recovery
      copy is lost with the primary.
    C: Offline tape resists ransomware, but nightly copies can lose up to a day of orders and slow restores may miss the RTO.
    D: Same-site replication protects against a failed array, yet it copies encrypted data and shares the site's exposure.
