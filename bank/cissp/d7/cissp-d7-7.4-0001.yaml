id: cissp-d7-7.4-0001
subdomain: '7.4'
difficulty: hard
stem: A charity's IT team has three administrators, and each can create accounts and grant privileges. It cannot hire more
  staff to separate these duties, and privilege grants are rare and seldom urgent. Which control BEST reduces the risk that
  an administrator grants excessive rights unnoticed?
options:
  A: A second administrator approves each privilege grant
  B: Rotate the administrators' duties each quarter
  C: Require each administrator to take two weeks' leave in a row
  D: A manager outside IT reviews privilege-change logs monthly
answer: A
explanation:
  why_correct: 'With three people and rare, non-urgent grants, dual control is workable: no one person can grant rights alone,
    and misuse would need two administrators to collude. It prevents the problem instead of finding it later.'
  why_not:
    B: Job rotation can reveal irregularities when someone new takes over a duty, but here each administrator already holds
      the same rights, so rotation changes little.
    C: Mandatory leave can expose concealed activity, but it is detective, works only during the leave, and lets a bad grant
      stand until then.
    D: An outside log review is a sound compensating control where dual control is impossible, but it detects excessive grants
      weeks later rather than stopping them.
