id: cissp-d7-7.15-0001
subdomain: '7.15'
difficulty: easy
stem: An engineer will visit a country where border officials can legally require travellers to unlock their devices and may
  copy them. The engineer needs design files during the trip. Which approach BEST protects the files?
options:
  A: Full-disk encryption with a strong pre-boot PIN
  B: Remote wipe enabled before the engineer travels
  C: A clean loaner laptop that reaches files over VPN
  D: Keeping the laptop powered off when crossing the border
answer: C
explanation:
  why_correct: If officials can compel unlocking, anything stored on the device can be copied. A loaner with no files stored,
    reaching them over VPN only once in country, leaves nothing to take at the border, and the company can cut access if needed.
  why_not:
    A: Encryption protects a lost or stolen laptop, but the engineer can be legally required to give the PIN, so it does not
      protect against this threat.
    B: Remote wipe works only while the device is online and before it is copied. Officials can keep it offline.
    D: A powered-off laptop protects keys in memory, but the engineer can still be required to boot and unlock it.
