stem: A flood has taken out a distributor's primary data centre. Its virtual machines replicate every few minutes to a
  recovery site, and the DR plan lists them in order of business priority, with order processing first. The team has
  declared a disaster, and the recovery site's network is up. Which systems should the team start FIRST?
options:
  A: The order processing servers, which the plan ranks first for the business
  B: The backup servers, so that data missing from the replicas can be restored
  C: The directory and DNS servers, which other systems use to sign in and find hosts
  D: The security logging servers, so that later systems are monitored from the start
answer: C
explanation:
  why_correct: Business priority decides which services matter most, but technical dependencies decide start order.
    Order processing cannot authenticate its service accounts or find its database without directory and name services,
    so starting those first is the fastest way to get the top-priority system working.
  why_not:
    A: Order processing is the most important service, but started without directory and DNS it fails to sign in or reach
      its database, so the team loses time restarting it.
    B: Backup servers come first when systems must be rebuilt from backups, but the replicas are only minutes old, so
      restoring data is not the first need here.
    D: Logging from the start matters after a cyber attack, but this outage came from a flood, and logging servers need
      directory and DNS too.
