id: cissp-d7-7.1-0001
subdomain: '7.1'
difficulty: medium
stem: During an internal fraud investigation, an investigator must collect evidence from a suspect's laptop, which
  is powered on. Its full-disk encryption keys are escrowed centrally and have been verified. What should the investigator
  do FIRST?
options:
  A: Remove power to preserve the disk's current state
  B: Capture a memory image before shutting it down
  C: Image the encrypted drive while the system runs
  D: Retrieve the escrowed key and image the disk offline
answer: B
explanation:
  why_correct: 'Order of volatility: memory holds evidence such as running processes and network connections that
    is lost at shutdown. Because the disk key is escrowed, the disk can be imaged later, so memory comes first.'
  why_not:
    A: Pulling power destroys volatile memory, which cannot be recovered later.
    C: Live imaging is mainly needed when the disk key is not available. With the key escrowed, it adds risk without
      capturing the more volatile memory first.
    D: Offline imaging with the escrowed key is the right next step for the disk, but doing it first means shutting
      down and losing memory.
