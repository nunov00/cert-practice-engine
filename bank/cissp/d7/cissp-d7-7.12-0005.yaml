id: cissp-d7-7.12-0005
subdomain: '7.12'
difficulty: easy
stem: A payroll bureau runs a yearly parallel test of its pay platform at the recovery site, since clients will not accept
  any risk to live pay runs. Last year the recovery site processed the live pay data as planned but also sent its payment
  file to the banks, and 2,000 employees were paid twice. This year clients want this month's full pay run produced at the
  recovery site. How should the test BEST be designed?
options:
  A: A parallel test on the full live pay data, its payment file captured and reconciled
  B: A parallel test on 10% of employees, its payment file sent to the banks as usual
  C: A parallel test on the full live pay data, run after that day's bank cut-off
  D: A parallel test replaying last month's pay data, its file sent to a bank test service
answer: A
explanation:
  why_correct: A parallel test can show the full run at the recovery site without touching live pay, as long as the recovery
    site cannot act on the outside world. Capturing its payment file instead of sending it, then reconciling it with production's
    file, shows that the recovery site produced this month's full run correctly while nobody is paid twice.
  why_not:
    B: A sample still sends real payments, so a smaller group is paid twice, and it does not show the full run that clients
      asked for.
    C: Missing the cut-off only delays the file, since the banks would process it with the next day's submissions and employees
      would still be paid twice.
    D: Replaying last month's data to a bank test service avoids duplicate pay, but it does not show this month's run being
      produced, which is what clients asked to see.
