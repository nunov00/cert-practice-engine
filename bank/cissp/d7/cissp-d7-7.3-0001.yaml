difficulty: medium
stem: A cloud team builds servers from a hardened baseline image. Engineers fix issues by changing settings on live
  servers, logging a change ticket for each fix. Drift from the baseline keeps growing, and rebuilt servers lose
  the fixes. What should the team do?
options:
  A: Scan monthly and report drift to the server owners
  B: Restrict console admin rights to the team lead
  C: Make fixes in the baseline code and redeploy
  D: Have the change board review the tickets each week
answer: C
explanation:
  why_correct: Drift and lost fixes both come from changing servers outside the baseline. Making each approved change
    in the baseline (image or infrastructure code) and redeploying keeps servers and baseline identical and makes
    fixes survive rebuilds.
  why_not:
    A: Scanning measures drift but does not stop it or carry fixes into the baseline.
    B: Fewer admins reduces who can change servers, but the lead would still change live servers outside the baseline.
    D: The tickets are already logged. More review of them does not move the fixes into the baseline.
