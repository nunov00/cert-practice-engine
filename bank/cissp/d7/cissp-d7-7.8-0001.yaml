difficulty: hard
stem: 'A media company patches monthly, and the next cycle is ten days away. Two advisories arrive the same day: a critical-rated
  remote flaw in its VPN appliances, with a patch and no reported exploitation; and a high-rated flaw in its mail servers,
  with no patch yet, a vendor workaround, and confirmed attacks in the wild. What should the team do FIRST?'
options:
  A: Apply the vendor workaround on the mail servers
  B: Patch the VPN appliances outside the monthly cycle
  C: Isolate the mail servers until a patch is released
  D: Raise both fixes as changes for the next monthly cycle
answer: A
explanation:
  why_correct: Confirmed exploitation outweighs a higher severity rating. The mail flaw is under attack now and has a mitigation,
    so applying the workaround first removes the most likely harm; the VPN patch should follow out of cycle.
  why_not:
    B: The VPN flaw is serious and should be patched soon, but with no exploitation reported it ranks after a flaw that attackers
      are using now.
    C: Isolation stops the attacks but also stops company email for an unknown time, when a workaround reduces the risk without
      that outage.
    D: Waiting ten days for the cycle leaves an actively exploited flaw open; both issues justify action outside it.
