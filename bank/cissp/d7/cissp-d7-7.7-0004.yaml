id: cissp-d7-7.7-0004
subdomain: '7.7'
difficulty: hard
stem: A hospital's imaging archive servers have a published remote-code flaw in their image-transfer service. The vendor's
  fix needs medical device re-certification, expected in nine months, and until then the certification forbids installing
  software or changing settings on the servers. Scanners and about 1,500 clinical workstations send and fetch images
  through that service all day. Which measure BEST protects the servers until the fix?
options:
  A: An inline IPS in front of the servers, blocking traffic that matches the flaw's exploit
  B: Firewall rules letting only scanners and clinical workstations reach the service
  C: An IDS on a mirrored port that has the firewall block any source sending the exploit
  D: Network access control admitting only hospital-managed devices to the clinical network
answer: A
explanation:
  why_correct: An inline intrusion prevention system acts as a virtual patch, dropping traffic that matches the flaw's
    exploit before it reaches the servers, without touching the certified devices. It protects the service whichever of
    the many legitimate sources an attack comes from. It needs tuning and a tested bypass so a fault in the IPS does not
    stop clinical imaging.
  why_not:
    B: Restricting sources is good hygiene, but 1,500 workstations stay allowed, and any one of them compromised by
      phishing could still send the exploit.
    C: Having the IDS trigger a firewall block stops a source after it is seen, but the detected packets have already
      reached the server, and with a remote-code flaw the first attempt can be enough.
    D: Network access control keeps unknown devices off the network, but the likely route is a managed workstation that
      has been compromised, which it still admits.
