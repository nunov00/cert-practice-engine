difficulty: hard
stem: In a fire drill at a 900-person office, wardens took 45 minutes to confirm the building was clear. They worked from
  the access system's list of everyone who had badged in that day and chased each listed person missing from the muster
  point. Staff come in on varying days and often leave during the day. Which change BEST speeds up confirming the building
  is clear?
options:
  A: Badge readers on exits as well as entrances, so the access system shows who is inside
  B: A muster app in which staff check in at the assembly point, with wardens chasing the rest
  C: Floor wardens who sweep assigned areas, toilets included, and report each one clear
  D: A roll-caller for each team, who confirms by phone where each team member is
answer: C
explanation:
  why_correct: The question in an evacuation is whether anyone is still in the building, and a list of people only
    answers it once every listed person has been traced, including the many who left earlier or never came. Wardens
    who sweep defined areas and report each one clear confirm the building directly, so the chief warden knows within
    minutes, while lists help afterwards to follow up on named people.
  why_not:
    A: Exit readers would make the list more accurate on a normal day, but people evacuating crowd through fire exits that
      must open freely, so the list is least reliable exactly when it is needed.
    B: A muster app quickly counts who is out, but everyone on the list who has not checked in still has to be chased,
      and most of them left earlier or are elsewhere.
    D: Team roll-calls spread out the chasing, but they still trace people one by one and cannot say whether an unknown
      visitor or contractor is still inside.
