id: cissp-d7-7.2-0004
subdomain: '7.2'
difficulty: medium
stem: Attackers copied a refresh token issued by a SaaS document platform to its desktop sync app on a developer's personal,
  unmanaged laptop. From their own servers they used it against the platform's API to download contract files for a week.
  The SIEM receives the identity provider's sign-in logs, endpoint telemetry from company devices and web proxy logs. Which
  addition would MOST likely have detected this?
options:
  A: Impossible-travel alerts on the identity provider's sign-in events
  B: The platform's audit log of file and API access, with volume alerts
  C: TLS inspection at the web proxy, alerting on bulk file downloads
  D: Endpoint alerts when an unknown process reads the sync app's tokens
answer: B
explanation:
  why_correct: The whole attack happened between the attackers' servers and the platform. The token was redeemed at the
    platform, not the identity provider, and the traffic never crossed company networks or devices. Only the platform's own
    audit log records the API calls and downloads, and a week of bulk downloads by one account from new addresses stands out
    there.
  why_not:
    A: Impossible-travel rules catch stolen passwords used from far away, but refreshing a platform token creates no sign-in at
      the identity provider, so there was nothing for the rule to see.
    C: Inspecting proxy traffic can flag bulk downloads by staff, but the attackers connected from their own servers, so none
      of their traffic passed through the proxy.
    D: Watching token stores is a good way to catch theft on managed devices, but the token was taken from a personal laptop
      that sends no telemetry to the company.
