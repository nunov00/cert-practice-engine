stem: At a hosting company, 40% of last quarter's changes were raised as emergency changes, which skip the weekly change board
  and are reviewed afterwards. Most were certificate renewals and patch roll-outs that follow the same tested steps each time,
  and teams said waiting up to a week for the board was not workable. Which change BEST addresses this?
options:
  A: Require the CISO's approval before a change can be classed as an emergency
  B: Hold the change board daily so that routine work is approved within a day
  C: Pre-approve the repeatable renewals and roll-outs as standard changes
  D: Review each emergency change at the next board and report misuse to managers
answer: C
explanation:
  why_correct: The emergency route is being used for low-risk work that repeats the same tested steps. Assessing those change
    types once and pre-approving them as standard changes lets teams do them promptly under a known procedure, frees the board
    for changes that need judgment, and leaves the emergency route for real emergencies.
  why_not:
    A: A stricter gate on emergencies would cut the misuse, but the renewals and roll-outs would then wait up to a week for
      the board, the delay that drove teams to the emergency route.
    B: A daily board shortens the wait, but it spends board time approving identical, low-risk changes one by one, which adds
      little assurance for the effort.
    D: Changes are already reviewed after the fact. Reporting misuse addresses the symptom, while routine work still has no
      workable route other than the emergency one.
