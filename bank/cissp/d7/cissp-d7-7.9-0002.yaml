stem: At a hosting company, 40% of last quarter's changes were raised as emergencies, which skip the weekly change board and
  are reviewed afterwards. Most were certificate renewals and patch roll-outs that come up through the month, often at a
  day's notice. Each kind has been done hundreds of times, with no incident in two years. Which change BEST addresses this?
options:
  A: Let the change manager approve low-risk changes between board meetings
  B: Add a short daily board meeting to approve low-risk changes
  C: Pre-approve renewals and roll-outs as standard changes with set procedures
  D: Have teams forecast each month's renewals and roll-outs for the weekly board
answer: C
explanation:
  why_correct: These changes recur, come at short notice and have a long safe record. Assessing each kind once and pre-approving
    it as a standard change, done to a set procedure, lets teams act at a day's notice without a fresh approval, keeps the
    board in control of what qualifies, and leaves the emergency route for real emergencies.
  why_not:
    A: Delegated approval suits low-risk changes that vary from one to the next. Here the same kinds recur hundreds of times,
      so approving each one adds a queue behind one person without adding any assessment the record has not already given.
    B: A daily board shortens the wait, but it spends senior time approving the same kinds of change one at a time, and a
      day's notice can still miss the meeting.
    D: Forecasting suits planned work, but many renewals and roll-outs arise at a day's notice, so a monthly forecast would
      miss them and they would still go through as emergencies.
