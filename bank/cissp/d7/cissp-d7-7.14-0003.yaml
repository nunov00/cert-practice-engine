stem: A data hall's doors use magnetic locks, which release when power is lost so that staff can always get out in a fire.
  During a four-hour power cut last month, when the generator failed to start, the doors stayed unlocked. Fire rules require
  free exit at all times. Which change BEST fixes this?
options:
  A: Fail-secure electric strikes, with mechanical exit handles inside
  B: Battery backup for the magnetic locks, sized for an eight-hour cut
  C: A procedure to post a guard at the doors during any power cut
  D: Door alarms on a battery-backed panel that alert the security desk
answer: A
explanation:
  why_correct: Fail-secure strikes stay locked from outside without power, while mechanical handles let people out at any
    time, so the doors meet both security and fire rules without depending on power.
  why_not:
    B: Batteries extend the locked time, but a longer cut or a battery fault would release the doors again, so security still
      depends on power.
    C: A guard cannot be in place at once, especially at night, and the doors stay open until someone arrives.
    D: Alarms report that a door opened but keep no one out, and the desk may be stretched during a site-wide outage.
