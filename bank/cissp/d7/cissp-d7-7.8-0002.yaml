subdomain: '7.8'
difficulty: hard
stem: A company patches 8,000 laptops across 12 hardware models each month, and policy requires critical patches within 14
  days. Last month a routine operating system update left 300 laptops of one model unable to boot, and fixing them took a
  week. Management wants to avoid a repeat without missing the patch deadline. How should the patching process change?
options:
  A: Test each month's patches in a lab on the standard image before release
  B: Hold patches for 30 days so that problems found elsewhere can be avoided
  C: Remove the affected model from automatic patching and patch it by hand
  D: Release patches in rings, starting with a sample of each laptop model
answer: D
explanation:
  why_correct: The failure came from one update meeting one hardware model. Releasing first to a small group that includes
    each model shows such a clash on a few machines, where it can be stopped, and the remaining rings still finish within
    the 14-day deadline.
  why_not:
    A: Lab testing on the standard image catches problems with the build and its applications, but a clash with one model's
      hardware or firmware shows only on that model, which a lab image does not reproduce.
    B: Deferring patches lets other organisations find bad ones first, a common practice where deadlines allow, but 30 days
      breaks the 14-day rule for critical patches.
    C: Patching the failed model by hand guards against a repeat on that model, but the next bad update may hit another model,
      and manual patching slows that model's critical fixes.
