id: cissp-d7-7.8-0002
subdomain: '7.8'
difficulty: medium
stem: A company's 300 container images are built on a full general-purpose Linux base. Scans report about 4,000 known vulnerabilities
  in running containers, most in base-image packages such as shells and network tools that the applications do not call.
  The security team's concern is what an attacker who gains code execution in a container could use. Which change BEST addresses
  this?
options:
  A: Automated pull requests that move each image to the latest patched base tag
  B: Admission control that blocks deploying images with critical vulnerabilities
  C: Rebuild the images on minimal bases holding just the application's runtime
  D: Reachability analysis that ranks findings by whether the application loads them
answer: C
explanation:
  why_correct: An attacker inside a container uses whatever the image contains, called by the application or not. Minimal
    bases remove the shells, network tools and other packages the applications do not need, which takes away both the attacker's
    tools and the vulnerabilities in them.
  why_not:
    A: Automated base updates keep packages patched and cut the count for a while, but the shells and tools stay in every image
      for an attacker to use, and new flaws in them keep appearing.
    B: Admission control stops the worst images reaching production, but it acts only on critical findings and leaves the unused
      tools in every image that passes.
    D: Reachability analysis is a good way to rank fixes by what the application can trigger, but an attacker with code execution
      is not limited to what the application loads, so it would push down exactly the packages of concern.
