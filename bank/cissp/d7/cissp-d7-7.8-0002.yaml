id: cissp-d7-7.8-0002
subdomain: '7.8'
difficulty: hard
stem: A factory's line-control PCs run a desktop operating system, and the line vendor's support lapses if an OS patch is
  installed before the vendor certifies it, which takes about six weeks. A wormable flaw in the OS's remote desktop service
  is being exploited widely. Engineers maintain the PCs at their consoles, and the PCs receive each shift's orders from the
  plant's office systems. What should the team do while certification is pending?
options:
  A: Install the OS patch now and ask the vendor to restore support afterwards
  B: Wait for certification and watch the line network for exploit traffic
  C: Disconnect the line network from the office network until certification
  D: Block the remote desktop port to the PCs at the line network's firewall
answer: D
explanation:
  why_correct: The flaw is reachable only through the remote desktop service, which the PCs do not need. Blocking that port
    at the network removes the exposure without touching the certified PCs or stopping production, and the vendor-certified
    patch can follow in the normal way.
  why_not:
    A: Patching an exploited flaw quickly is usually right, but here it voids support for the line, and a safe compensating
      control is available until the certified patch arrives.
    B: Waiting for certification respects the support terms, but watching for exploit traffic only detects a worm once it is
      spreading, for six weeks of exposure.
    C: Isolation would block the worm, but the PCs need each shift's orders from the office systems, so cutting the link stops
      production when a narrower block would do.
