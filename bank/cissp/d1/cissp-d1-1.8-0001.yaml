id: cissp-d1-1.8-0001
subdomain: '1.8'
difficulty: easy
stem: Which control BEST prevents a single finance employee from both creating a new supplier and approving
  payments to that supplier?
options:
  A: Separation of duties
  B: Job rotation
  C: Least privilege
  D: Mandatory vacation
answer: A
explanation:
  why_correct: Splitting supplier creation and payment approval between different people means fraud requires
    collusion. This is exactly the purpose of separation of duties.
  why_not:
    B: Rotation helps uncover fraud over time, but the same person could still hold both duties while
      in the role.
    C: Least privilege limits each person to what their role needs. If one role is defined to include
      both duties, least privilege still grants both. Separation of duties splits the role itself.
    D: Enforced leave helps detect ongoing fraud. It does not stop one person from holding both permissions.
