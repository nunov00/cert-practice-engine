id: cissp-d1-1.5-0001
subdomain: '1.5'
difficulty: easy
stem: A company suspects an employee of running a personal business on company laptops, against the acceptable
  use policy. HR will decide whether to issue a written warning. Which type of investigation is this,
  and what standard of proof normally applies?
options:
  A: Criminal; beyond a reasonable doubt
  B: Regulatory; the standard set by the relevant regulator
  C: Administrative; the organisation's own internal standard
  D: Civil; preponderance of the evidence
answer: C
explanation:
  why_correct: An investigation into a breach of internal policy, run so that HR can decide on discipline,
    is an administrative investigation. The organisation applies its own standard, which is usually lower
    than legal standards, though the process should still be fair and documented.
  why_not:
    A: Breaking an acceptable use policy is not in itself a crime, and a written warning is not a prosecution.
      The criminal standard of beyond a reasonable doubt does not apply.
    B: Regulatory investigations are run by or for a regulator under its rules. This is the company enforcing
      its own policy.
    D: A civil investigation supports a lawsuit between parties and uses the preponderance of the evidence.
      An HR decision on a warning needs no court action.
