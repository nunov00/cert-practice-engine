id: cissp-d1-1.2-0002
subdomain: '1.2'
difficulty: hard
stem: A procurement platform must allow the company to prove to an outside arbitrator, if a dispute arises,
  that a particular supplier submitted a particular bid and that the bid has not changed since. Which
  control BEST meets this need?
options:
  A: Have the platform sign each bid with the company's private key on receipt
  B: Register each bid's hash with an independent timestamping service
  C: Require mutual TLS with a client certificate for each supplier upload
  D: Have each supplier digitally sign its bid before uploading it
answer: D
explanation:
  why_correct: Only the supplier's own signature ties the bid to that supplier, and any later change breaks
    it. The arbitrator can verify it with the supplier's public key without trusting the company, which
    is a party to the dispute. It gives both origin and integrity evidence.
  why_not:
    A: A company signature proves what the company received and holds, but the company is a party to the
      dispute. It does not prove the supplier wrote the bid, and the company could sign an altered bid.
    B: An independent timestamp proves the bid existed in that form at that time, which covers integrity.
      It does not prove which supplier submitted it.
    C: Mutual TLS authenticates the supplier during the upload and protects the data in transit. Once
      the session ends it leaves no evidence about the bid that an arbitrator could check.
