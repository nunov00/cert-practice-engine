id: cissp-d1-1.11-0008
subdomain: '1.11'
difficulty: hard
stem: A retailer sends one 250-question security questionnaire to each of its 800 suppliers yearly, and the review team
  is many months behind. Attackers recently got in through the remote access account of a small contractor that updates
  the content on in-store advertising screens, whose questionnaire was still waiting in the queue. Which change BEST
  improves the supplier assessment programme?
options:
  A: Tier suppliers by annual contract value, with full reviews for the top tier
  B: Tier suppliers by the sensitivity of the data they hold, scaling reviews to tier
  C: Tier suppliers by their connections into company systems, scaling reviews to tier
  D: Tier suppliers by how critical their service is to stores, scaling reviews to tier
answer: C
explanation:
  why_correct: One deep review for every supplier spreads a small team too thin, so the programme needs risk-based tiers,
    and the tier has to reflect the way this breach happened. A supplier's remote access or other connection into company
    systems is a path an attacker can use to reach everything behind it, whatever the supplier is paid, holds or provides.
    Tiering by connections puts small contractors with network access, like the screen contractor, into the deep and early
    reviews.
  why_not:
    A: Tiering by spend is common and easy to run, but a small screen-content contract would still land in a low tier, so
      the kind of supplier that caused this breach would again wait behind large ones.
    B: Tiering by the data a supplier holds is risk-based and suits processors of customer or staff data, but the screen
      contractor holds little or no sensitive data, so it would stay low while its account opens a path into the network.
    D: Tiering by how critical a service is protects against supplier failure, but advertising screens matter little to
      store operations, so the contractor would stay in a low tier although its access put the whole network at risk.
