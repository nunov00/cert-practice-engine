subdomain: '1.5'
difficulty: medium
stem: A former employee sues a company for wrongful dismissal. Counsel expects requests for the employee's and managers' email
  during discovery. The email system purges messages automatically after 180 days. What should the company do FIRST?
options:
  A: Issue a legal hold that suspends purging for the people and mailboxes linked to the claim
  B: Make forensic images of the linked mailboxes and record a hash of each image
  C: Wait for the formal discovery request so the scope of preservation is clear
  D: Turn off automatic purging across the whole email system until the case ends
answer: A
explanation:
  why_correct: Once litigation is reasonably anticipated, the company must preserve relevant information. A targeted legal
    hold stops the purge from destroying relevant email now, which is the urgent risk, while keeping preservation proportionate.
  why_not:
    B: Forensic collection may come later, but it is a heavier step than needed first. The immediate need is to stop the routine
      purge on the relevant accounts.
    C: The duty to preserve starts when litigation is anticipated, not when a request arrives. Waiting lets the purge destroy
      relevant email, which can be treated as spoliation.
    D: Suspending purging for everyone preserves the right email but keeps far more data than the claim needs, adding cost
      and exposure. A hold scoped to the claim meets the duty.
