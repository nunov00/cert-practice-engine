id: cissp-d1-1.9-0009
subdomain: '1.9'
difficulty: hard
stem: A fintech's board sets capital for credit, market and operational risk from the yearly loss each could exceed only
  once in twenty years. It now wants a cyber risk figure in the same terms for a new instant-payments service, which the
  firm has run for only a few months without a loss. Which approach BEST provides this figure?
options:
  A: Annualised loss expectancy, with frequency and impact as ranges from calibrated estimators
  B: Loss ranges from calibrated estimators, simulated into a distribution of yearly loss
  C: A severe loss scenario, costed by calibrated estimators and taken as the one-in-twenty year
  D: A distribution of yearly loss fitted to industry breach studies, scaled to the firm's revenue
answer: B
explanation:
  why_correct: The board needs a loss level that is exceeded only once in twenty years, which is a point in the tail of a
    distribution, not an average or a chosen scenario. With no loss history, estimators trained to give honest ranges for
    how often each kind of event occurs at this service and how much it costs, simulated over many years, produce that
    distribution, so the cyber figure can be read off at the same one-in-twenty level and compared with the other risks.
  why_not:
    A: Taking frequency and impact as calibrated ranges improves the inputs, but ALE combines them into one expected yearly
      loss. An expected value says nothing about how bad a one-in-twenty year could be, so the figure would not match the
      board's measure.
    C: Severe scenarios are a recognised input to operational risk capital, and estimators can cost one well, but nobody has
      estimated how often a year that bad occurs. Calling it one-in-twenty is an assertion, so the figure has no stated
      probability behind it.
    D: Fitting a distribution gives a tail to read from, but breach studies record the costs of disclosed breaches across
      many sectors, not the fraud, outage and payment losses this new service is exposed to, and revenue scaling does not
      make them fit.
