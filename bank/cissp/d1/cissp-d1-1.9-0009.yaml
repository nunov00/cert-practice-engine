stem: A fintech's board sets capital for credit, market and operational risk from the yearly loss each could exceed only
  once in twenty years. It now wants a cyber risk figure in the same terms for a new instant-payments service, which the
  firm has run for only a few months without a loss. Which approach BEST provides this figure?
options:
  A: Annualised loss expectancy from the team's best single estimates of frequency and impact
  B: Loss ranges from calibrated estimators, simulated into a distribution of yearly loss
  C: A likelihood and impact heat map, with each rating linked to a band of money values
  D: Average losses from published industry breach studies, scaled to the firm's revenue
answer: B
explanation:
  why_correct: The board needs a loss level that is exceeded only once in twenty years, which is a point in the tail of a
    distribution, not an average. With no loss history, estimators trained to give honest ranges for how often an event
    occurs and how much it costs, simulated over many years, produce that distribution, so the cyber figure can be read
    off at the same one-in-twenty level and compared with the other risks.
  why_not:
    A: ALE is the classic quantitative measure and expresses risk in money, but it gives one expected yearly loss. An average
      says nothing about how bad a one-in-twenty year could be, and single-point estimates hide the uncertainty that matters
      most here.
    C: Heat maps are a quick and common way to rank risks, and money bands make them look comparable, but ordinal ratings
      cannot be combined into a loss that is exceeded with a stated probability, so the figure would not match the board's
      measure.
    D: Industry studies are a useful external input when the firm has no history, but they report average breach costs across
      many kinds of firms and incidents, so scaling them gives another average rather than the tail loss for this service.
