id: cissp-d1-1.11-0001
subdomain: '1.11'
difficulty: hard
stem: A company uses a SaaS payroll provider whose platform runs in a data centre operated by a separate
  subcontractor. The company has a contract only with the provider. It has reviewed the provider's independent
  assurance report (SOC 2 Type II), which uses the carve-out method for the subcontractor. What is the
  BEST way for the company to gain assurance over the subcontractor's controls?
options:
  A: Obtain the subcontractor's own assurance report through the provider and review it
  B: Review the subservice controls that the provider's report assumes the subcontractor runs
  C: Request a right to audit the subcontractor's data centre directly as a fourth party
  D: Require the provider by contract to flow equivalent controls down to the subcontractor
answer: A
explanation:
  why_correct: A carve-out report excludes the subcontractor's controls from testing, so the provider's
    report gives no evidence about them. The subcontractor's own independent report, obtained through
    the provider, is tested evidence over the carved-out controls. The company can then check that it
    covers the right period, services and locations.
  why_not:
    B: The report lists what the subcontractor is expected to do, but under a carve-out those controls
      were not tested. Reading the assumptions tells the company what to check, not whether the controls
      work.
    C: With no contract with the subcontractor, the company has no right to audit it, and a site audit
      is costly. An existing independent report usually gives the assurance more efficiently.
    D: Flow-down clauses are good practice and give recourse, but they are a requirement, not evidence.
      They do not show that the subcontractor's controls operate today.
