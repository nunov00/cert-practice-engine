subdomain: '1.7'
difficulty: medium
stem: A business impact analysis, signed off by the business last month, sets a maximum tolerable downtime
  of 8 hours for order processing. The proposed recovery solution restores systems within 6 hours. Staff
  then need about 4 more hours to reconcile and verify transactions before orders can resume. What should
  the continuity manager conclude?
options:
  A: The solution is adequate if the business re-approves a 10-hour limit
  B: The solution is adequate, as systems are restored inside 8 hours
  C: The solution is inadequate, as orders resume about 2 hours too late
  D: The solution is inadequate until the recovery point objective is confirmed
answer: C
explanation:
  why_correct: The business is back only once systems are restored and the data is verified. Six hours
    of recovery plus four hours of work recovery is 10 hours, two more than the 8-hour MTD. The design
    must change.
  why_not:
    A: The MTD comes from business impact and was signed off last month. Asking the business to raise
      it to fit a design reverses the analysis.
    B: This counts only the recovery time. Restored systems that cannot yet process orders do not end
      the outage, so the work recovery time must be added.
    D: The RPO limits data loss, and nothing suggests data loss is the problem. The solution already fails
      on total recovery time, whatever the RPO.
