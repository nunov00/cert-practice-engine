id: cissp-d1-1.10-0001
subdomain: '1.10'
difficulty: medium
stem: During STRIDE threat modelling of a payments app, the team notes that a customer could later deny
  having approved a transfer, and the system has no reliable way to show otherwise. Which category is
  this, and which control MOST directly addresses it?
options:
  A: Spoofing; multi-factor authentication enforced at every customer login
  B: Repudiation; tamper-evident audit records tied to each authenticated approval
  C: Elevation of privilege; role-based access limited to least-privilege roles
  D: Tampering; server-side validation and integrity checks on transfer requests
answer: B
explanation:
  why_correct: Repudiation threats are about users denying actions. Strong authentication combined with
    protected, attributable logs or signed transactions gives evidence that settles the dispute.
  why_not:
    A: Stronger login helps establish identity, but without attributable records of the approval the customer
      can still deny it.
    C: Nothing in the scenario involves gaining unauthorised privileges.
    D: Validation and integrity checks stop altered requests. They do not create evidence of who approved
      a transfer.
