stem: A payments company has built a fraud-scoring method whose detection rate would fall if fraudsters learned how it
  weighs their behaviour. The method runs only on the company's own servers, and rivals have been trying to hire the data
  scientists who built it. Which way of protecting the method BEST fits?
options:
  A: File patents on the method in each market where the company operates
  B: Treat the method as a trade secret, with need-to-know access and staff NDAs
  C: Register copyright in the method's source code and its design documents
  D: Publish the method as a defensive disclosure so no rival can patent it
answer: B
explanation:
  why_correct: Trade secret protection lasts as long as the information stays secret and the owner takes reasonable steps
    to keep it so. The method's value depends on fraudsters not knowing it, it never leaves the company's servers, so it
    cannot be reverse engineered from a product, and NDAs with access limits give legal remedies if departing staff take
    it to a rival.
  why_not:
    A: A patent gives strong exclusive rights, even against rivals who devise the method themselves, but it requires
      publishing the method in detail, which would teach fraudsters how to evade the scoring.
    C: Copyright protects the code and documents as written, not the method itself, so scientists hired by a rival could
      rebuild the same scoring in new code without infringing it.
    D: Defensive disclosure keeps others from patenting an idea, but it makes the method public, which is the outcome the
      company most needs to avoid.
