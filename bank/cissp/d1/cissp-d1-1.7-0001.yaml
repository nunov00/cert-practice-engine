difficulty: easy
stem: During a business impact analysis, the payments team says it can be without the payments service
  for up to four hours. It also says the business could tolerate losing no more than 15 minutes of transaction
  data after a disruption. Which metric does the 15-minute figure set?
options:
  A: Work recovery time (WRT)
  B: Maximum tolerable downtime (MTD)
  C: Recovery point objective (RPO)
  D: Recovery time objective (RTO)
answer: C
explanation:
  why_correct: The RPO is the maximum acceptable amount of data loss, measured in time. It drives how
    often data is backed up or replicated. The four-hour figure relates to downtime, not data loss.
  why_not:
    A: WRT is the time needed after systems are restored to verify data and resume normal work. It measures
      time, not how much data may be lost.
    B: The MTD is the total outage the business can survive. It describes time without service, not lost
      data.
    D: The RTO is how long restoring the service may take, not how much data may be lost.
