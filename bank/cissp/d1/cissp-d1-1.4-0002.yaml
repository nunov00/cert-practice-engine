id: cissp-d1-1.4-0002
subdomain: '1.4'
difficulty: medium
stem: A developer copies a date-formatting function from an open-source library under a strong copyleft
  licence into the company's proprietary product, which is sold and distributed to customers. The company
  already includes third-party copyright notices in every release. What is the PRIMARY legal risk?
options:
  A: Having to release the product's source code under the library's licence
  B: Having to reproduce the library's copyright and licence notices in the product
  C: Carrying defect liability for the function, which the licence disclaims
  D: Breaching export rules by redistributing the library's code abroad
answer: A
explanation:
  why_correct: Strong copyleft licences generally require distributed works that include the code to be
    licensed on the same terms. The product is distributed, so the main exposure is forced release of
    proprietary source code or a licence breach if the company refuses.
  why_not:
    B: Notice requirements are real licence obligations, but they are easy to meet once the copied code
      is found. They do not threaten the product's proprietary status.
    C: The licence does disclaim warranties, so the company carries the risk of defects in the function.
      That is an ordinary product risk, far smaller than losing control of the source code.
    D: Export controls depend on what the code does, such as cryptography. A date-formatting function
      is unlikely to be controlled, and the licence does not change that.
