difficulty: medium
stem: After a year of annual compliance videos, the click rate in phishing simulations has stayed at about
  20%. Which change is MOST likely to improve results?
options:
  A: Require employees who click a simulated phish to repeat the annual video module
  B: Use short, frequent, role-relevant training with instant feedback on simulation failures
  C: Add an external-sender warning banner to email and retire the awareness videos
  D: Replace the annual video with a longer, more detailed annual classroom course
answer: B
explanation:
  why_correct: Behaviour changes through regular reinforcement, relevance to the job, and feedback at
    the moment of the mistake. Tracking the trend shows whether the programme works.
  why_not:
    A: Repeating a format that has already failed is remedial at best and is unlikely to change behaviour.
    C: A banner is a useful technical aid, but retiring training removes reinforcement. It is not an improvement
      to the awareness programme.
    D: This changes the format but keeps the once-a-year rhythm that has already failed to change behaviour.
