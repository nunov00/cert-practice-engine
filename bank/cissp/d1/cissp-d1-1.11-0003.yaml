id: cissp-d1-1.11-0003
subdomain: '1.11'
difficulty: medium
stem: A company's products bundle an open-source compression library. At another open-source project, a long-trusted co-maintainer
  recently hid a new backdoor in the downloadable release packages, which he signed as usual; the code in the project's public
  repository did not contain it. Which supplier control BEST protects the company against the same tactic?
options:
  A: Build the library in-house from the tagged commit instead of using release packages
  B: Verify each release package's signature against the maintainers' published keys
  C: Scan each new version with software composition analysis before adopting it
  D: Record the library and its exact version in an SBOM for each product release
answer: A
explanation:
  why_correct: The tactic relies on a gap between the code people can review and the package people install. Building from
    the tagged commit in the company's own pipeline means the company ships only code that is visible in the repository,
    so changes slipped into release packages never reach its products.
  why_not:
    B: Signature checks prove a package came from a maintainer's key and was not altered afterwards. Here the maintainer signed
      the backdoored package himself, so it would verify.
    C: Composition analysis matches components against known vulnerabilities. A new backdoor has no advisory yet, so the scan
      would pass it.
    D: An SBOM shows quickly which products contain an affected version once a backdoor is public, which speeds the response,
      but it does nothing to keep the backdoor out.
