id: cissp-d1-1.4-0001
subdomain: '1.4'
difficulty: hard
stem: A European subsidiary plans to move customer personal data to a cloud provider in a country that
  has no adequacy decision under the GDPR. What should the privacy lead ensure BEFORE the transfer takes
  place?
options:
  A: Customers are notified of the transfer in an updated privacy notice after migration
  B: A valid transfer mechanism, such as standard contractual clauses, is in place
  C: All personal data is encrypted at rest with keys managed by the provider
  D: The provider holds a current ISO/IEC 27001 certificate covering the service
answer: B
explanation:
  why_correct: Transfers to countries without adequacy need an approved safeguard. Standard contractual
    clauses are the usual route, supported by an assessment of the destination's laws and any extra measures
    it calls for. They must be in place before data moves.
  why_not:
    A: Transparency duties apply, but telling customers afterwards does not make an unlawful transfer
      lawful.
    C: Encryption may be a supplementary measure, and with provider-held keys it is a weak one. On its
      own it does not give the transfer a legal basis.
    D: Certification is evidence of security management, not a lawful transfer mechanism.
