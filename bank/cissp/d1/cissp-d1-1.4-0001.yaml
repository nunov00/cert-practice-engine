id: cissp-d1-1.4-0001
subdomain: '1.4'
difficulty: medium
stem: A European subsidiary plans to move customer personal data to a cloud provider in a country with
  no GDPR adequacy decision. The legal team has already documented an assessment of the destination's
  laws and found the risk manageable. The processing itself is routine. What should the privacy lead make
  sure is in place BEFORE the transfer?
options:
  A: A completed data protection impact assessment for the migration
  B: Standard contractual clauses agreed with the provider for the transfer
  C: Explicit consent from each customer to the move of their data abroad
  D: A documented transfer impact assessment of the destination's laws
answer: B
explanation:
  why_correct: Without an adequacy decision, a systematic transfer needs an appropriate safeguard under
    GDPR Article 46, such as standard contractual clauses or binding corporate rules. For a transfer to
    an outside cloud provider, standard contractual clauses are the usual tool, and they must be signed
    before data moves. The assessment of the destination's laws that supports them is already done.
  why_not:
    A: A DPIA is needed when processing is likely to be high risk, and the stem says this processing is
      routine. Even where one is needed, it assesses the processing. It is not a transfer mechanism.
    C: Explicit consent is a derogation under Article 49, not an appropriate safeguard under Article 46.
      Regulators read derogations narrowly and expect them to be used for occasional transfers, not systematic
      ones. Consent is also hard to obtain validly from every customer and can be withdrawn, so it does
      not suit an ongoing move to a cloud provider.
    D: A transfer impact assessment is required alongside the clauses, but the legal team has already
      completed it. The missing element is the transfer mechanism itself.
