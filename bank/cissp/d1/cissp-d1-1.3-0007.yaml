id: cissp-d1-1.3-0007
subdomain: '1.3'
difficulty: hard
stem: A hospital group has signed a deal to buy a chain of clinics, completing in eight weeks, after which the two networks
  will be joined. Diligence found that the chain's own IT staff investigated an intrusion two years ago and concluded that
  no patient data was taken. Under the signed deal, the group may now examine the chain's systems. What should the CISO
  recommend before completion?
options:
  A: An independent compromise assessment of the chain's network and endpoints
  B: A specific indemnity for losses from the old intrusion, with part of the price in escrow
  C: A review of the chain's incident report and logs, with the IT staff who wrote it
  D: An outside-in review of the chain's exposed services and leaked credentials
answer: A
explanation:
  why_correct: The only evidence that the intruder left, and took nothing, comes from the chain's own staff, and once the
    networks are joined any foothold that remains becomes a path into the whole group. With access now allowed and eight
    weeks before completion, an independent compromise assessment can establish whether an attacker is still present and
    what was reached, so the group can fix it, adjust the deal or delay the connection before taking on the risk.
  why_not:
    B: An indemnity backed by escrow is a sound way to cover losses that diligence cannot rule out, but money does not undo
      a breach of patient data or the regulatory and reputational harm, and it does nothing about an attacker who may still
      be inside when the networks are joined.
    C: Reading the original report with its authors explains what they did, but it re-examines the same evidence through the
      same people, so it cannot independently confirm their conclusion.
    D: An outside-in review shows what the chain exposes to the internet and whether credentials have leaked, which is useful
      when access is refused, but it cannot see whether an attacker is already inside the network.
