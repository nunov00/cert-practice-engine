id: cissp-d1-1.8-0002
subdomain: '1.8'
difficulty: medium
stem: A systems administrator with wide privileged access will be dismissed at a meeting tomorrow at 10:00
  and is expected to react badly. Tonight they are on call for a planned maintenance window. Security
  will escort them out after the meeting. When should their access be removed?
options:
  A: As the security escort leads them out of the building
  B: Late this evening, once the maintenance window has closed
  C: Straight after HR confirms the dismissal has been delivered
  D: During the dismissal meeting, as they are being told
answer: D
explanation:
  why_correct: Revoking access while the dismissal is being delivered leaves no window between the administrator
    learning the news and losing access. It also lets tonight's maintenance go ahead as planned, so nothing
    tips the administrator off early.
  why_not:
    A: The administrator already knows of the dismissal by then. The meeting itself gives time to act
      from a phone or a remote session.
    B: Revoking access before notice is sometimes used, but overnight the administrator may try to log
      in, notice the loss and react before the managed meeting. It also leaves no access for any problem
      after the maintenance.
    C: Even a short gap after notification gives a privileged insider time to act. Revocation should coincide
      with the notification itself.
