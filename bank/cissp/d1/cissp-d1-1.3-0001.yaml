id: cissp-d1-1.3-0001
subdomain: '1.3'
difficulty: hard
stem: A newly appointed CISO finds that the board approved a security charter last year that names the
  CISO accountable for the programme. Business units hold their own budgets, fund security projects case
  by case, and often stall them as IT's concern. What should the CISO do FIRST to put security on a sustainable
  footing?
options:
  A: Set up a steering committee of business heads to rank and fund security work
  B: Ask the board to reaffirm the security charter and the CISO's mandate
  C: Prepare a costed multi-year security roadmap for the next budget cycle
  D: Run an awareness campaign for managers on security as a business concern
answer: A
explanation:
  why_correct: The mandate already exists, so the gap is the lack of a forum where business units share
    decisions on security. A steering committee of business heads turns case-by-case funding into agreed
    priorities that the people holding the budgets own. That makes later projects sustainable.
  why_not:
    B: Executive backing is the usual first step, but the board has already given it. Reaffirming the
      charter does not change how business units decide or fund the work.
    C: A roadmap is needed, but one prepared by the CISO alone stays an IT plan. It works best after business
      heads have agreed the priorities it should fund.
    D: Awareness can shift attitudes, but it creates no decision forum or funding model. Managers who
      agree in principle will still fund projects case by case.
