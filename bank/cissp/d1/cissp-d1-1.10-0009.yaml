id: cissp-d1-1.10-0009
subdomain: '1.10'
difficulty: medium
stem: A water utility is threat modelling smart meters it will fit in 300,000 homes. Each meter stores its readings and sends
  them by radio, encrypted under a network key that all meters share and that sits in each meter's flash memory. The billing
  system flags meters whose readings depart sharply from their history. Which threat should the model rank HIGHEST?
options:
  A: A householder reading the network key from a meter to forge other meters' messages
  B: A householder altering the readings stored in their own meter to lower their bill
  C: A neighbour within radio range jamming meters so that their readings fail to arrive
  D: An installer leaving a meter's maintenance port enabled after fitting it in a home
answer: A
explanation:
  why_correct: Every householder has unlimited, unobserved physical access to a meter, so anything stored in it should be
    assumed readable. Because one key protects the whole fleet, extracting it from a single meter lets an attacker read or
    forge messages for all 300,000, a break-once, run-everywhere threat. Its scale and the ease of physical access put it
    first, and the model then points to per-meter keys as the mitigation.
  why_not:
    B: Tampering with one's own meter is the most obvious motive, but it affects one bill, and sharp changes are flagged by
      billing. Gradual tampering is a real but bounded risk.
    C: Jamming is easy within radio range, but it only delays readings from a few meters, which can be estimated or read later,
      and it exposes nothing.
    D: An open maintenance port weakens one meter, but householders already have physical access to it, and the harm stays
      local unless the port exposes something shared, such as the network key.
