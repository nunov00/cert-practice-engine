id: cissp-d1-1.1-0001
subdomain: '1.1'
difficulty: hard
stem: A contractor holding a security certification is migrating a hospital's patient records system.
  The contract names the hospital's CISO as the contractor's point of contact. The ward operations manager
  asks the contractor to quietly switch off audit logging for a week so the migration runs faster. Hospital
  policy requires logging at all times. What should the contractor do FIRST?
options:
  A: Keep logging on and explain the logging policy to the manager
  B: Ask the manager to submit a policy exception request to the CISO
  C: Decline, and tell the CISO about the request directly
  D: Report the request through the hospital's confidential ethics line
answer: C
explanation:
  why_correct: The contractor's duty of diligent service is to the hospital, not to one manager. The manager
    asked for a mandatory control to be switched off quietly, so the accountable person needs to hear
    about it from the contractor. The contract already names the CISO as the contact, so declining and
    telling the CISO directly is the proper, prompt channel.
  why_not:
    A: Keeping logging on protects the control, but the attempt to bypass it stays hidden. The people
      accountable for the policy cannot judge the risk or the manager's conduct if they never learn of
      it.
    B: Routing a real need through the exception process is normally sound. Here the manager wanted the
      change kept quiet, so leaving it to the manager to raise means the CISO may never hear of it.
    D: An ethics line suits cases where the normal channel cannot be used safely. The contract gives a
      direct, accountable contact, and an anonymous report is slower and loses the contractor's first-hand
      account.
