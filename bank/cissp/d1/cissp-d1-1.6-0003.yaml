subdomain: '1.6'
difficulty: hard
stem: A global company's password standard requires rotation every 90 days. The security team wants to drop rotation, in
  line with current guidance, and rely on MFA and breached-password checks instead. One country's banking regulator requires
  the company's bank subsidiary there to rotate passwords periodically, under a rule the regulator has no plans to change.
  How should the company handle this in its standards?
options:
  A: Keep 90-day rotation in the global standard so the rule stays uniform
  B: Drop rotation globally and issue a local supplement for the bank subsidiary
  C: Drop rotation globally and grant the bank subsidiary a yearly exception
  D: Move rotation into a guideline that each subsidiary applies as it sees fit
answer: B
explanation:
  why_correct: The regulator's rule is a lasting legal requirement for one entity, not a temporary gap. A local supplement
    to the standard, approved through the same governance, keeps the global baseline in line with current practice and makes
    the stricter rule mandatory and auditable where the law requires it.
  why_not:
    A: A single rule is simpler to run, but it would hold every other unit to a practice the company has decided is weaker,
      to satisfy one regulator in one country.
    C: Exceptions suit a unit that cannot yet meet the standard and has a plan to close the gap. Here the subsidiary must follow
      a different rule for the foreseeable future, so a yearly exception records a legal obligation as an accepted risk and
      can lapse at renewal.
    D: Guidelines are discretionary. Rotation is a legal obligation for the bank subsidiary, so it has to be a mandatory requirement
      there, not a recommendation.
