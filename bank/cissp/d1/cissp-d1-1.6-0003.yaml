id: cissp-d1-1.6-0003
subdomain: '1.6'
difficulty: hard
stem: A global company's password standard requires rotation every 90 days. The security team wants to drop rotation, in
  line with current guidance, and rely on MFA and breached-password checks instead. In one of its 30 countries, a standing
  banking rule requires the local bank subsidiary to rotate passwords on payment-system accounts at least every 180 days.
  How should the company's standards handle this?
options:
  A: Set rotation at 180 days in the global standard so one rule covers each unit
  B: Drop rotation globally and add a local supplement for the bank subsidiary
  C: Drop rotation globally and grant the bank subsidiary a yearly exception
  D: Drop rotation globally and rely on the policy's clause to obey local law
answer: B
explanation:
  why_correct: The banking rule is a lasting, specific legal requirement for one entity. A local supplement to the standard,
    approved through the same governance, keeps the global baseline in line with current practice and states the interval
    and the accounts in scope, so the subsidiary's systems can be configured and audited against it.
  why_not:
    A: A 180-day rule would satisfy the regulator with one standard for the whole group, but it would hold the other 29 countries
      to a practice the company has decided is weaker, to meet one country's rule.
    C: Exceptions suit a unit that cannot yet meet the standard and has a plan to close the gap. Here the subsidiary must follow
      a stricter rule for as long as the banking rule stands, so a yearly exception records a legal duty as an accepted risk
      and can lapse at renewal.
    D: A general duty to obey local law belongs in the policy, but it leaves administrators to find and read the banking rule
      themselves. The interval and the accounts it covers are specific enough to be set out as a requirement that systems
      and audits can be checked against.
