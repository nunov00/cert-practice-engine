id: cissp-d2-2.2-0006
subdomain: '2.2'
difficulty: hard
stem: A company's central backup service protects every server, including the HR system, which holds Restricted salary and
  disciplinary records. Backup operators, cleared for Internal data, can restore any server's backups to any server, and one
  restored the HR database to a test server to check a failing job. HR's IT team has two staff. Which handling requirement
  BEST addresses this?
options:
  A: Encrypt HR backups under a key that only the backup service can use
  B: Restores of HR backups only by Restricted-cleared staff, with HR's approval
  C: Log each restore job, with monthly review of the log by security
  D: A separate backup system for HR, run only by HR's own IT team
answer: B
explanation:
  why_correct: Backups carry the classification of their source, so restoring HR backups is handling Restricted data. Limiting
    restores to Restricted-cleared staff, with the data owner's approval, applies the same rule as the live system.
  why_not:
    A: Encryption protects backup media, but the operator restored through the backup service itself, which can decrypt the
      data, so it was exposed anyway.
    C: Logging and review find misuse after the fact, and a restored copy may have spread before anyone reads the log.
    D: A separate system splits backup operations and leaves recovery of a key system to two people, when a handling rule
      on the existing service closes the exposure.
