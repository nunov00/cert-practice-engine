subdomain: '2.1'
difficulty: easy
stem: A drug maker's IT team classified its 2,000 collaboration sites with a scanner that rates content by the personal and
  financial data it finds. Sites holding interim clinical trial results, which contain only summary figures, were rated Internal,
  though early disclosure could invalidate a trial. Project teams open new sites most days, and each trial's results stay
  sensitive until a publication date that differs by trial. Which change BEST fixes the classification?
options:
  A: The data governance committee sets the level of each site the scan links to a trial
  B: The head of research sets one level for trial sites, which the committee reviews yearly
  C: Each site's business owner sets and maintains its level, with the scan's rating as input
  D: Each trial's sponsor sets the level of the trial's sites when the trial is registered
answer: C
explanation:
  why_correct: The sensitivity of interim results comes from business context, what the figures are and when they may be released,
    not from any data type a scanner can recognise. The business owner of each site knows that context, is there when the
    site is opened, and can lower the level when the trial's results are published; the scan remains a useful starting point.
  why_not:
    A: A committee gives consistent decisions, but it depends on the scan to tell it which sites hold trial data, which is
      exactly what the scan cannot see in summary figures, and sites open most days.
    B: One level for trial sites ignores that each trial's results stop being sensitive on a different date, so sites stay
      over-classified or are lowered too early, and a yearly review cannot follow the dates.
    D: The sponsor is an accountable owner, but a decision made at registration reaches only the sites known then, not the
      ones project teams open later, and it does not change at publication.
