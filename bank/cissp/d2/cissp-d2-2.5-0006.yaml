id: cissp-d2-2.5-0006
subdomain: '2.5'
difficulty: hard
stem: An investment firm's 300 advisers discuss client orders with colleagues and clients on its chat platform, in deal
  channels and in direct messages, and firm policy limits their use of it to business. Regulation requires advisers'
  business communications to be kept for five years. The firm's 2,000 other staff use the same platform, and its privacy
  policy keeps chat for 90 days unless a rule requires longer. Which retention setting BEST meets both requirements?
options:
  A: Five years for conversations that include an adviser, and 90 days for the rest
  B: Five years for the platform's whole chat history, with archive access limited to compliance
  C: Five years for the deal channels, and 90 days for other channels and direct messages
  D: Five years for messages advisers flag as orders, and 90 days for the rest
answer: A
explanation:
  why_correct: The rule covers advisers' business communications wherever they happen, so retention has to follow the
    people it covers, not a channel or a label. Because advisers may use the platform only for business, keeping any
    conversation an adviser takes part in for five years captures orders given in direct messages as well as in
    channels, while the other 2,000 staff's chat still expires after 90 days as the privacy policy requires.
  why_not:
    B: Keeping everything for five years is simple and meets the rule, and restricted access limits misuse, but it keeps the
      chat of 2,000 staff no rule covers for years longer than the privacy policy allows.
    C: Channel-based retention is easy to run and keeps the deal channels, but advisers also discuss orders in direct
      messages, and those would be deleted after 90 days.
    D: Flagging keeps retention narrow, but the rule covers business communications, not only orders, and it depends on each
      adviser flagging each message correctly, which a regulator will not accept as a complete record.
