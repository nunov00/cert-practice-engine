stem: A hospital rates data by the impact of its disclosure. Researchers build a dataset of visit dates, postcodes
  and diagnosis codes with names removed. Each field on its own is rated Internal. How should the dataset be classified?
options:
  A: Internal, the highest rating of any single field in it
  B: Restricted, the impact if the combined records leaked
  C: Internal, with access limited to the named research team
  D: Confidential, until an anonymisation test has been completed
answer: B
explanation:
  why_correct: Classification follows the impact of disclosing the asset as it is. Dates, postcodes and diagnoses
    together can re-identify patients, so the combined dataset carries the impact of a health record leak, which
    is far higher than any field alone (aggregation).
  why_not:
    A: Taking the highest single-field rating ignores aggregation. The combination creates a disclosure impact that
      no field has on its own.
    C: Limiting access is a handling control. It does not change the classification, and the label would still understate
      the impact for anyone who handles the data later.
    D: A test could later support a lower rating, but setting an interim label below the combined impact leaves
      the data under-protected while the test is pending.
