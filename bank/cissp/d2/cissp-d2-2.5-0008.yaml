id: cissp-d2-2.5-0008
subdomain: '2.5'
difficulty: medium
stem: A staffing agency keeps rejected applicants' CVs and interview notes with no end date, hoping to place them in other
  roles. No law sets a retention period, but rejected applicants may bring discrimination claims for up to a year, and the
  agency has defended several such claims using interview notes. Applicants are told their data is used only for the role
  they applied for. Which retention rule BEST fits?
options:
  A: Delete each applicant's records once they are rejected, as the role's purpose has ended
  B: Keep each applicant's records for the one-year claim period, then delete them
  C: Keep each applicant's records for two years, the window in which placements often arise
  D: Keep each CV for the one-year claim period, deleting interview notes on rejection
answer: B
explanation:
  why_correct: Where no law sets a period, retention follows the purposes the organisation can justify. Once an applicant
    is rejected, the remaining legitimate need is to defend a possible claim, which can arrive for up to a year and is answered
    with the interview notes. Keeping the whole record for that period, then deleting it, meets that need and stops the indefinite
    retention.
  why_not:
    A: Deleting on rejection honours the original purpose most strictly, but it destroys the records the agency needs to answer
      a discrimination claim, which it has had to do several times.
    C: Placing applicants in later roles is a real business aim, but applicants were told their data would be used only for
      the role they applied for, so keeping it for that new purpose would need their agreement first.
    D: Keeping the CV while dropping notes looks like minimisation, but the notes are the evidence the agency has used to defend
      claims, so deleting them first defeats the purpose that justifies keeping anything.
