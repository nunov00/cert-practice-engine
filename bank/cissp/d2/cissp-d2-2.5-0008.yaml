difficulty: hard
stem: A supermarket chain keeps store CCTV footage for 14 days, as its privacy notice states. Customers' injury claims
  usually arrive one to three months after the event, when the footage is gone. Nearly all claims concern falls that staff
  recorded in the store's accident book on the day. Which retention change BEST fits?
options:
  A: Keep the footage for 90 days, the time within which claims usually arrive
  B: Keep 14 days, saving clips of incidents logged in the accident book
  C: Keep 90 days only for cameras over the aisles and entrances where falls occur
  D: Keep the footage for 90 days, encrypted and viewable only by the claims team
answer: B
explanation:
  why_correct: Retention should keep what a purpose needs and no more. The footage that matters is of incidents the stores
    already record on the day, so saving those clips when the incident is logged, and keeping them until any claim is settled,
    preserves the evidence while every other shopper's footage still goes after 14 days, as the privacy notice promises.
  why_not:
    A: Ninety days would cover the claims, but it keeps every shopper's movements six times longer to serve a small number
      of recorded incidents, which is hard to justify under the privacy notice and data protection law.
    C: Limiting longer retention to the cameras where falls happen narrows it, but those cameras cover most of the shop floor,
      so most shoppers' footage is still kept for 90 days for the sake of a few incidents.
    D: Encryption and restricted viewing reduce the risk of misuse, but they do not change how long every shopper's footage
      is kept, which is the part that exceeds the purpose.
