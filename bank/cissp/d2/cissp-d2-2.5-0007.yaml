subdomain: '2.5'
difficulty: easy
stem: A telecom's source systems delete customer records on schedules set per record type, from six months for call details
  to seven years for billing. Analysts copy records into a data lake to build churn models that need customer-level history,
  and nothing in the lake is deleted, so call details persist there for years. Which change BEST brings the lake into line
  with the schedule?
options:
  A: Tag lake data with its record types, deleting each record when its source schedule ends
  B: Delete each lake dataset two years after it is created, unless its owner renews it
  C: Have each dataset's owner set its retention period when publishing it to the lake
  D: Aggregate customer-level records in the lake into monthly statistics after six months
answer: A
explanation:
  why_correct: A retention schedule applies to the information wherever copies of it sit. Carrying the record type into the
    lake and applying the same per-type periods means call details leave the lake when they leave the source, while billing
    history stays as long as the schedule allows, so the models keep the history they may lawfully use.
  why_not:
    B: One lake-wide period keeps call details far longer than six months and cuts billing data the schedule allows for seven
      years; renewal by owners keeps it to their judgement, not the schedule.
    C: Owners would pick periods dataset by dataset, which need not match the per-type schedule, so copies of call details
      would stay or go at each owner's discretion.
    D: Aggregating after six months removes the customer-level history the churn models need, including billing history that
      may lawfully be kept for years.
