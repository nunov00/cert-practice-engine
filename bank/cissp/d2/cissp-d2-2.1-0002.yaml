stem: A defence supplier labels each of its part drawings Internal. An engineer proposes a single catalogue listing every
  part with its drawing, its sub-supplier and its delivery schedule for a classified programme. Each item in it is already
  labelled Internal. What should decide the catalogue's classification?
options:
  A: The highest label carried by any single item it contains
  B: The label of the system where the catalogue will be stored
  C: The label that matches the catalogue's intended readers
  D: The harm that disclosure of the combined set could cause
answer: D
explanation:
  why_correct: Combining many low-sensitivity items can reveal something none of them reveals alone, such as a programme's
    suppliers and schedule. Classification follows the impact of disclosing the asset as it is, so the data owner should assess
    the aggregated catalogue, which may warrant a higher level.
  why_not:
    A: Taking the highest label of the parts is the usual rule for mixed content, but here every part is Internal, so the
      rule would miss the extra sensitivity created by aggregation.
    B: The storage system must be suitable for the data, but its label follows from the data's classification, not the other
      way round.
    C: The audience decides who may be given access once the level is set; it does not determine how sensitive the content
      is.
