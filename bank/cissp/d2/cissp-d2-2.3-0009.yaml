id: cissp-d2-2.3-0009
subdomain: '2.3'
difficulty: medium
stem: A hospital's asset inventory records each device's model, location, purchase date and owning department. After an attack
  through an unsupported imaging workstation, a review found 300 devices past vendor support. Vendors end support anywhere
  from 4 to 15 years after sale, and each of 40 departments budgets for its own replacements, which for medical systems take
  up to two years. Which change BEST prevents this from recurring?
options:
  A: Replacement of each device at a fixed age set for its class in the inventory
  B: A rolling three-year replacement plan in each department, built from purchase dates
  C: Vendor support notices routed to medical engineering, which tracks them centrally
  D: Vendor end-of-support dates in each asset record, alerting its department ahead
answer: D
explanation:
  why_correct: Lifecycle management needs to know when each asset stops being supportable, early enough for whoever pays to
    replace it. Recording each vendor's end-of-support date against the asset and alerting the owning department ahead of
    it gives the budget holder the lead time a medical system's replacement needs, whatever the vendor's timetable.
  why_not:
    A: A fixed age is a common planning proxy, but with support ending 4 to 15 years after sale, devices of one class fall
      out of support before their age limit or are replaced while still supported.
    B: A rolling plan looks ahead, but purchase dates say nothing about when a given vendor ends support, so the plan misses
      devices whose support ends early.
    C: Central tracking collects the notices, but the 40 departments hold the budgets; unless each date is tied to the asset
      and reaches its department, the money is not planned in time.
