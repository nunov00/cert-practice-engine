subdomain: '2.3'
difficulty: hard
stem: Senior engineers at a construction firm travel several times a year to a country where, on earlier trips, border
  officers took staff laptops out of sight for about an hour before handing them back. During each visit the engineers
  need email, their calendars and a few project documents. Which way of providing their laptops BEST fits?
options:
  A: Their usual laptops with full-disk encryption, powered off before each border crossing
  B: Loaner laptops with only the trip's data, firmware and disk reimaged before reuse
  C: Their usual laptops, cleared of local files, reaching mail and documents only by VPN
  D: Loaner laptops with only the trip's data, malware-scanned before they rejoin the pool
answer: B
explanation:
  why_correct: A laptop that has been out of its owner's sight in someone else's hands may have been copied or altered in
    ways that cannot be ruled out afterwards. Loaner laptops carrying only what the trip needs limit what can be read or
    demanded at the border, and reflashing the firmware and reimaging the disk before reuse puts each device back into a
    known state, so software or firmware changes made during that hour do not follow it into normal work.
  why_not:
    A: Full-disk encryption with the laptop powered off is strong protection for a lost or stolen device, but officers can
      demand the password, and an hour out of sight is enough to fit a hardware or firmware implant that encryption does not
      stop, on a laptop that then comes home to the corporate network.
    C: Keeping no local files and working through a VPN limits what can be read at the border, but the engineer's everyday
      laptop, with its saved credentials and trust in the network, is the device that was out of sight and is then used as
      normal on return.
    D: Loaners with only the trip's data limit what is exposed at the border, but a malware scan looks for known malicious
      files in the operating system. A firmware implant or a purpose-made change fitted during that hour would pass the
      scan and stay on the device when it is lent out again.
