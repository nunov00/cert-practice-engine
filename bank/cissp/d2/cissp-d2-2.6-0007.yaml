id: cissp-d2-2.6-0007
subdomain: '2.6'
difficulty: hard
stem: A government agency applies one moderate control baseline to all its systems. Its new open-data portal publishes
  only figures already released to the public, but altered figures could move markets and mislead policy makers. The project
  team says encryption at rest and logging of each read of the data add cost for no benefit. How should the agency apply
  the baseline to the portal?
options:
  A: Apply the moderate baseline, scoping out encryption at rest and read logging with reasons
  B: Apply the low baseline, the level that public information normally calls for
  C: Apply the moderate baseline, with a risk owner's time-limited exception for those two controls
  D: Apply the low baseline, tailored up with the moderate baseline's integrity controls
answer: A
explanation:
  why_correct: A system's baseline follows its highest impact. The data is public, so confidentiality impact is low, but
    tampering with these figures has at least a moderate integrity impact, so the moderate baseline applies. Scoping then
    removes controls whose purpose does not exist for this system, here two that only protect confidentiality, with the
    reason documented, while every integrity and availability control stays.
  why_not:
    B: Public data does suggest a low baseline at first sight, but the baseline follows the highest of the three impacts,
      and the low baseline would drop integrity controls the portal needs.
    C: An exception is for a control that applies but cannot be met yet, and it is usually time-limited and reviewed. These
      controls protect nothing on public data, so recording them as an accepted shortfall misstates the risk and leaves an
      exception to renew for the life of the system.
    D: Tailoring up from the low baseline recognises the integrity need, but the starting point is set by the highest impact,
      and picking integrity controls by hand from a lower baseline can miss supporting controls, such as configuration and
      change management, that the moderate baseline includes for that reason.
