stem: A fitness app must, by law, refuse accounts to children under 16, and the law accepts the date of birth that a user
  enters. The product team plans to collect each user's date of birth at sign-up and keep it in the profile. No other feature
  of the app uses age. Which approach BEST fits the data lifecycle?
options:
  A: Store the date of birth encrypted, with the key held apart from the profiles
  B: Send users to an ID-document age-check service and keep only its pass result
  C: Check the entered date at sign-up, then keep a flag that the user is 16 or over
  D: Collect only the birth year, and refuse sign-up when it is too recent
answer: C
explanation:
  why_correct: The date of birth serves one purpose, the check at sign-up, and the law accepts the date the user enters. Using
    that date for the check and keeping just the result meets the legal duty while the app collects nothing extra and holds
    no birth dates to protect, lose or answer for later.
  why_not:
    A: Encryption protects the stored dates, but the app would keep personal data that no feature needs once the check is
      done, which minimisation rules out.
    B: An age-check service also leaves no birth date in the app, and it suits laws that demand verified age. Here the law accepts
      the user's own entry, so sending ID documents to a new third party collects far more personal data than the purpose
      needs.
    D: A birth year is less data, but it cannot show whether a user born in the borderline year has turned 16 yet, so the legal
      check cannot be done reliably.
