subdomain: '2.4'
difficulty: hard
stem: A fitness app must, by law, refuse accounts to children under 16. The product team plans to collect each user's date
  of birth at sign-up and keep it in the profile. No other feature of the app uses age. Which approach BEST fits the data
  lifecycle?
options:
  A: Store the date of birth encrypted, with the key held apart from the profiles
  B: Collect only the birth year, and refuse sign-up when it is too recent
  C: Check the full date at sign-up, then keep a flag that the user is 16 or over
  D: Store a salted hash of the date of birth in place of the date itself
answer: C
explanation:
  why_correct: The only purpose for the date of birth is the check at sign-up. Using the full date for that check and then
    keeping just its result meets the legal duty while the app holds no birth dates to protect, lose or answer for later.
  why_not:
    A: Encryption protects the stored dates, but the app keeps personal data that no feature needs, which minimisation rules
      out when the purpose is already met.
    B: A birth year is less data, but it cannot show whether a user born in the borderline year has turned 16 yet, so the legal
      check cannot be done reliably.
    D: Hashing looks like it removes the date, but there are only a few tens of thousands of plausible birth dates, so each
      hash can be reversed by trying them all, and the stored value still serves no purpose.
