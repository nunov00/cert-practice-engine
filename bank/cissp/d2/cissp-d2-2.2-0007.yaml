subdomain: '2.2'
difficulty: medium
stem: A company shares draft bid terms with five outside advisory firms, whose partners print and annotate them for client
  meetings. Last month one draft appeared in the press, and each firm denies being the source. Every engagement letter already
  contains confidentiality terms. Which handling requirement BEST reduces the risk of further leaks?
options:
  A: Add penalties for disclosure to the confidentiality terms in each firm's letter
  B: Share drafts only through a data room with downloading and printing turned off
  C: Send drafts only as encrypted files, with each firm's password sent separately
  D: Share drafts only through a data room that stamps each page with the viewer's name
answer: D
explanation:
  why_correct: Every firm received an identical copy, so a leaked page cannot be traced, and the confidentiality terms
    already in place cannot be enforced against anyone. Stamping each page with the viewer's name, on screen and in print,
    keeps the drafts usable for printed meetings while making every copy traceable to one person. That deters leaking
    and, if a leak recurs, shows where it came from.
  why_not:
    A: Penalties raise the cost of leaking, but they can be applied only when the source is known, and the confidentiality
      terms already there failed for exactly that reason.
    B: Blocking downloads and printing is a common data-room control, but the partners need printed copies for client meetings,
      and screen photos would still leave untraceable copies.
    C: Encryption limits who can open the files in transit and at rest, but once opened every firm holds the same clean
      document, so a leaked copy still cannot be tied to its source.
