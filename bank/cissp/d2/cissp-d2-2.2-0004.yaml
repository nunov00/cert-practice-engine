difficulty: medium
stem: Executives of an engineering firm are travelling to a trade fair in a country whose border officers have powers to
  inspect and image travellers' devices and to require their passwords. They need to work on Restricted bid documents during the week. Which handling
  requirement BEST protects those documents on the trip?
options:
  A: Carry the documents on laptops with full-disk encryption and a strong pre-boot PIN
  B: Issue loaner laptops holding only the documents each executive needs for the trip
  C: Carry the documents on encrypted USB drives kept separate from the laptops
  D: Issue loaner laptops with no documents, reaching them through a virtual desktop
answer: D
explanation:
  why_correct: The threat is an official with legal power to inspect and copy the device, which usually includes requiring
    the traveller to unlock it, so encryption on the device does not keep the documents out of reach. A clean loaner laptop
    that holds nothing, reaching the documents through a virtual desktop once past the border, leaves nothing on the device
    to inspect or image, and the loaner is wiped or retired on return.
  why_not:
    A: Full-disk encryption protects a lost or stolen laptop, but inspection powers usually include requiring the traveller
      to unlock the device, and refusing can mean seizure, so the documents are exposed either way.
    B: Loaner laptops limit what is exposed and keep the executives' everyday laptops off the trip, but the documents copied
      onto them can still be inspected and imaged at the border.
    C: Separate encrypted drives are still devices carried across the border, open to the same inspection and the same demand
      for a password as the laptops.
