id: cissp-d2-2.5-0011
subdomain: '2.5'
difficulty: medium
stem: A commodities broker archives trade records for ten years on write-once storage that prevents any change before each
  record's period ends. The records are encrypted under a key that the key-management policy rotates yearly, and each retired
  key is destroyed two years after rotation to limit exposure. None has been destroyed yet. Which change BEST keeps the archive
  usable for its full retention period?
options:
  A: Re-encrypt the archived records under the current key at each yearly rotation, then destroy the old key
  B: Keep each retired key, for decryption only and under dual control, until its records expire
  C: Stop rotating the archive's key, and use one key for the archive's whole ten-year life
  D: Escrow each retired key with a third party, and destroy the broker's own copy after two years
answer: B
explanation:
  why_correct: Encrypted records are retained only if their keys are kept as long as they are. Keeping each retired key in
    a decryption-only state, under dual control, until the last record it protects passes its end date keeps every record
    readable, while rotation still limits how much new data any one key protects. Each key is then destroyed when its records
    expire.
  why_not:
    A: Re-encrypting on rotation is a common way to retire old keys, but the write-once storage cannot rewrite records before
      their periods end, so the archive cannot be re-encrypted.
    C: One key for ten years keeps everything readable, but it gives up the rotation the policy requires, so a single compromise
      would expose a decade of trades.
    D: Escrow keeps the keys available, but it places them with an outside party for up to ten years, adding exposure and
      a dependency for every retrieval, and the broker loses direct control of the keys to its own records.
