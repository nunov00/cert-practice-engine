difficulty: medium
stem: Design engineers at a manufacturer work from home on managed laptops that connect straight to the internet, with no
  VPN. One engineer uploaded protected drawings to a personal cloud storage account. The firm wants to stop such uploads while
  engineers can still open the drawings. Which control BEST does this?
options:
  A: Network DLP at the corporate internet gateway
  B: Endpoint DLP agents blocking uploads of tagged files
  C: A CASB connected by API to the sanctioned cloud storage
  D: Rights management so only staff can open the drawings
answer: B
explanation:
  why_correct: The upload leaves from a laptop that never passes through corporate infrastructure, to a service the firm does
    not manage. A DLP agent on the endpoint sees the file being sent wherever the laptop is, and can block tagged drawings
    while leaving engineers free to open them.
  why_not:
    A: A gateway DLP sensor only sees traffic that passes through the corporate network. These laptops go straight to the
      internet.
    C: An API-connected CASB governs the firm's own sanctioned cloud tenant. It has no view of a personal account on another
      service.
    D: Rights management keeps outsiders from opening the files, but it does not stop the upload, which is what the firm wants
      to prevent.
