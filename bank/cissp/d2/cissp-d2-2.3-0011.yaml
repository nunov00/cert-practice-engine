subdomain: '2.3'
difficulty: hard
stem: During a ransomware incident, a distributor's responders needed the owner's approval to take its warehouse system
  offline. The asset inventory named a manager who had left eight months earlier, and three department heads each said
  the system was not theirs. Audits find a third of named owners have left, though the firm's senior posts have not changed
  in years. Which change BEST addresses this?
options:
  A: Reassign each leaver's systems to their line manager when HR records the departure
  B: Record each system's owner as a senior post, such as Head of Warehousing
  C: Have IT confirm each system's named owner in a quarterly review of the inventory
  D: Make the IT operations lead the owner of any system whose named owner has left
answer: B
explanation:
  why_correct: Ownership goes stale because the inventory names people, and people leave far more often than the posts they
    hold change. Recording a stable senior post as owner keeps each system with an accountable business role through staff
    turnover, and whoever holds that post is the owner on the day of an incident, with no update needed.
  why_not:
    A: A leaver trigger closes the gap faster than audits do, but the line manager inherits systems by accident of reporting
      lines, not because they are accountable for the business use, and repeated moves blur ownership further.
    C: A quarterly review catches departures within months, but the inventory can still be up to a quarter out of date when
      an incident needs a decision, and IT can confirm a name without making it the right owner.
    D: The IT operations lead runs the systems as custodian, but cannot decide on the business impact of taking a warehouse
      system offline, which is the decision the responders needed.
