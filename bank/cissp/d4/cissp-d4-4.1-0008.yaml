id: cissp-d4-4.1-0008
subdomain: "4.1"
difficulty: easy
stem: Two offices will be linked over the internet by their gateways. The link must encrypt traffic, hide each office's
  internal addresses from anyone on the path, and work through a carrier-grade NAT in front of one office. Which IPsec
  configuration fits?
options:
  A: AH in tunnel mode, with NAT traversal
  B: ESP in transport mode, with NAT traversal
  C: ESP in tunnel mode, with NAT traversal
  D: AH in transport mode, with NAT traversal
answer: C
explanation:
  why_correct: ESP provides encryption, and tunnel mode wraps the whole original packet, internal addresses included,
    inside a new packet between the gateways. NAT traversal carries ESP inside UDP so it passes the carrier-grade NAT.
  why_not:
    A: AH authenticates packets but does not encrypt them, and its integrity check covers address fields that NAT rewrites,
      so it fails through NAT.
    B: Transport mode protects the payload between two hosts and leaves the original IP header, with internal addresses,
      visible on the path. It does not suit a gateway-to-gateway link.
    D: AH gives no encryption, leaves the original header in place in transport mode, and breaks when NAT changes the
      addresses it protects.
