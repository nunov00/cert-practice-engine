id: cissp-d4-4.3-0031
subdomain: '4.3'
difficulty: medium
stem: An online pharmacy redirects HTTP to HTTPS and sends an HSTS header with a one-year lifetime and
  includeSubDomains on every response, and all its subdomains serve HTTPS. Testers on hotel and library Wi-Fi intercepted customers who typed the bare domain into shared public
  computers, kept them on plain HTTP and captured their passwords. Which change BEST stops this?
options:
  A: Close the site's plain HTTP port, so that no unencrypted request gets an answer
  B: Sign the domain's DNS zone with DNSSEC, so that its lookups cannot be forged
  C: Mark session cookies Secure and HttpOnly, so that they are not sent over HTTP
  D: Add the domain and its subdomains to the browsers' built-in HSTS preload list
answer: D
explanation:
  why_correct: An HSTS header protects only a browser that has already received it and still holds it. A browser without that
    record, such as one on a shared computer that has never visited the site or whose data is cleared between sessions, sends
    its first request over plain HTTP, where the tester answers it before any redirect. Browsers
    ship the preload list built in, so they use HTTPS for a listed domain from the very first request. The site already meets
    the other conditions, with HTTPS on every subdomain, includeSubDomains and a lifetime of a year or more, so it qualifies
    once the header adds the preload directive.
  why_not:
    A: The tester intercepts the plain HTTP request on the network and answers it themselves, so it never reaches the server,
      and closing the port changes nothing for the victim's browser.
    B: DNSSEC protects DNS answers, but a tester in the path can answer the plain HTTP request for the real address, and
      DNSSEC does not protect the connection itself or make the browser use HTTPS.
    C: Secure cookies keep session cookies off plain HTTP, but the tester captured passwords that customers typed into the page
      the tester served them, so the cookies were never needed.
