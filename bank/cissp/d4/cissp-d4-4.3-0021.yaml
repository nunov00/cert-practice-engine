subdomain: '4.3'
difficulty: medium
stem: Twice this year, attackers broke into a law firm's internet-facing VPN appliance through flaws that had no patch yet,
  without using any credentials. About 600 lawyers use it from managed laptops to reach a dozen internal applications. Which
  change BEST reduces this exposure?
options:
  A: Phishing-resistant MFA, required on each sign-in to the VPN portal
  B: An inline IPS placed in front of the VPN appliance, blocking known exploit traffic
  C: A zero trust access broker that internal connectors dial out to, with nothing inbound
  D: Emergency patching of the VPN appliance within a day of each vendor advisory
answer: C
explanation:
  why_correct: The attacks needed only a reachable listening service, so neither credentials nor patch speed protected it.
    With a zero trust access broker, connectors inside the firm open outbound connections to the broker, and nothing in the firm's network
    accepts connections from the internet, so there is no firm-owned appliance for an unauthenticated attacker to reach. Lawyers
    are authenticated at the broker before any path to an application exists. The internet-facing part becomes the broker
    provider's service, which the firm should assess as a supplier.
  why_not:
    A: MFA stops attackers who hold stolen passwords, but these flaws were used before sign-in, without credentials, so MFA
      was never reached.
    B: An IPS can block exploits it has signatures for, but these flaws had no patch yet, so signatures for them were unlikely
      to exist when the attacks came.
    D: Faster patching closes the gap after an advisory, but both attacks used flaws before any patch existed, which is exactly
      the window it does not cover.
