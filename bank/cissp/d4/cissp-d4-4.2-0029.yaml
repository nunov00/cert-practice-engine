subdomain: '4.2'
difficulty: medium
stem: A brokerage's compliance team must be able to tie each outbound web request to a named employee. Staff browse from managed
  desktops and from 40 shared terminal servers, each hosting dozens of user sessions behind one IP address. The internet firewall
  logs each connection by source address. Which component BEST provides this attribution?
options:
  A: Firewall user mapping, learned from domain controller sign-in events
  B: Firewall logs correlated with DHCP lease records for each address
  C: Flow records from the core switches, kept for the retention period
  D: An explicit web proxy that requires each user to authenticate
answer: D
explanation:
  why_correct: On a terminal server, dozens of people share one address, so anything that maps addresses to users can name
    at most one of them. An explicit proxy that requires each user to authenticate records the user name with each request,
    whichever machine or session it came from, giving compliance the per-person record it needs.
  why_not:
    A: Sign-in mapping works for desktops, where one person holds an address, but on a terminal server it records only the
      latest user to sign in and attributes each session's traffic to that person.
    B: Lease records tie an address to a machine at a given time, which identifies desktop users, but a terminal server's
      one address belongs to dozens of users at once.
    C: Flow records show which addresses talked to which destinations and when, but they carry no user identity and share
      the same terminal server problem.
