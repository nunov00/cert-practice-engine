difficulty: medium
stem: Thirty offices are fully meshed with site-to-site IPsec tunnels, all authenticated with one pre-shared key. When a firewall
  was stolen from one office during a refit, engineers had to re-key every site over a weekend. Which change BEST prevents
  a repeat as the network grows?
options:
  A: A unique pre-shared key for each tunnel
  B: Certificates from an internal CA, with revocation
  C: A unique pre-shared key for each site, used on all its tunnels
  D: One shared key, rotated monthly by an automated script
answer: B
explanation:
  why_correct: Each site gets its own identity, and a lost firewall is cut off by revoking its certificate, with no change
    at other sites. Adding a site needs one new certificate, not new secrets on every peer, so it scales.
  why_not:
    A: Per-tunnel keys isolate a loss, but a mesh of thirty sites needs 435 keys, each set on two peers by hand, and the number
      grows quickly with each site.
    C: A site key has to be known by every peer that talks to that site, so a stolen firewall holds the keys of all its peers,
      and they would all need re-keying.
    D: Rotation limits how long a leaked key stays useful, but while it is valid a stolen firewall still exposes every tunnel,
      so an emergency re-key of all sites is still needed.
