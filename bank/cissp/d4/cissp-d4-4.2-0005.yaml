id: cissp-d4-4.2-0005
subdomain: '4.2'
difficulty: easy
stem: A company runs its perimeter firewalls as an active-passive pair. In a planned failover test the standby unit took over
  within a second, yet users' VPN sessions and long-running database connections dropped and had to reconnect. Which change
  BEST prevents this in a real failover?
options:
  A: Shorten the heartbeat interval between the two firewalls
  B: Synchronise connection and VPN session state between the pair
  C: Run the pair as active-active, sharing the traffic load
  D: Give the pair a shared virtual IP address and virtual MAC address
answer: B
explanation:
  why_correct: The standby took over quickly but knew nothing of the existing sessions, so it dropped their traffic as unknown.
    Stateful synchronisation copies the connection table and VPN security associations to the standby, so sessions continue
    after failover.
  why_not:
    A: A shorter heartbeat speeds up failure detection, but failover already took under a second. The sessions dropped because
      the standby lacked their state.
    C: Active-active spreads the load, but without state synchronisation the sessions on a failed unit are still lost when
      the other unit picks them up.
    D: A shared virtual address lets clients reach whichever unit is active without relearning addresses. Traffic did reach
      the new unit, which rejected it because it held no session state.
