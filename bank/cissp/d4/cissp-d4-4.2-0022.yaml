id: cissp-d4-4.2-0022
subdomain: '4.2'
difficulty: hard
stem: Company laptops expose file-sharing and remote-management ports, which the help desk uses to fix them on the office
  network. In a test on a hotel network, another guest's machine reached a laptop through those ports. The always-on VPN can
  connect only after the hotel's sign-in page is completed in a browser. Which control BEST closes this exposure?
options:
  A: Host firewall rules that open those ports only on the corporate network
  B: Disable the file-sharing and remote-management services on laptops
  C: Allow no traffic except to the VPN gateway until the VPN connects
  D: Unique local administrator passwords on each laptop, rotated automatically
answer: A
explanation:
  why_correct: Network-aware host firewall rules keep the ports open on the corporate network, where the help desk needs them,
    and closed on any other network, including the time before the VPN connects.
  why_not:
    B: Disabling the services would stop the help desk from fixing laptops the way it does now.
    C: Blocking traffic until the VPN connects would also block the hotel's sign-in page, so laptops could not get online
      at all.
    D: Unique passwords limit spread from one compromised laptop, but the ports stay exposed to flaws and attacks that need
      no password.
