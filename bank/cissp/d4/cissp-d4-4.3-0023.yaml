id: cissp-d4-4.3-0023
subdomain: '4.3'
difficulty: medium
stem: A retailer's 300 stores send firewall and point-of-sale logs to a central SIEM as UDP syslog, carried over each store's
  IPsec tunnel. An investigation found gaps on busy evenings, and entries that a compromised till had forged in the store
  firewall's name. The logs must be complete and trustworthy enough to serve as evidence. Which change BEST fits?
options:
  A: Syslog sent over mutually authenticated TLS from each device
  B: Syslog messages signed by each device with its own private key
  C: Syslog carried in a separate IPsec tunnel given traffic priority
  D: Syslog sent over TCP, so that lost messages are retransmitted
answer: A
explanation:
  why_correct: 'The logs fail in two ways: UDP drops messages on busy links, and nothing proves which device sent an entry.
    Syslog over mutually authenticated TLS runs on TCP, so lost packets are resent, and the SIEM accepts each connection only
    from the device holding that certificate''s key and attributes its entries to that certificate''s identity, so a till
    cannot write in the firewall''s name. One change meets both
    needs.'
  why_not:
    B: Per-device signatures let the SIEM reject the till's forged entries, but the signed messages still travel as UDP, so
      the gaps on busy evenings remain.
    C: A prioritised tunnel may reduce the evening losses, but the till sits inside the store, and its forged messages enter
      the tunnel like the firewall's own.
    D: TCP resends lost packets and closes the gaps, but it does not authenticate the sender, so the till can still connect
      and write entries in the firewall's name.
