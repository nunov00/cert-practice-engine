id: cissp-d4-4.3-0023
subdomain: '4.3'
difficulty: hard
stem: A retailer's 300 stores send firewall and point-of-sale logs to a central SIEM as UDP syslog, carried over each store's
  IPsec tunnel. An investigation found gaps on busy evenings, and entries that a compromised till had forged under the store
  firewall's address. The logs must be complete and trustworthy enough to serve as evidence. Which change BEST fits?
options:
  A: Syslog over TLS, with a certificate for each sending device and local queuing
  B: Hashing and signing of log batches at the SIEM as soon as they arrive
  C: A separate IPsec tunnel for log traffic, given priority over other traffic
  D: SIEM filters accepting each store's firewall logs only from its address
answer: A
explanation:
  why_correct: UDP syslog has no delivery guarantee and no sender authentication, so busy links drop messages and any host
    can claim to be the firewall. Syslog over TLS runs on TCP, so lost packets are resent, and devices queue messages locally
    while the link is congested. A certificate for each device means the SIEM accepts entries only from the device that holds
    that key, so a till cannot write in the firewall's name.
  why_not:
    B: Signing at the SIEM proves logs have not changed since arrival, but the gaps and the forged entries arise before arrival,
      so they are sealed into the record as they are.
    C: A prioritised tunnel may reduce the evening losses, but the till sits inside the store, and its forged UDP messages
      enter the tunnel like the firewall's own.
    D: Filtering by source address seems to tie logs to the firewall, but UDP source addresses are easy to forge, which is
      what the till did.
