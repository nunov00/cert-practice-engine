difficulty: medium
stem: A hospital put its infusion pumps on their own VLAN, and port security lets only hospital-issued pumps connect.
  The pumps need to reach only a dosage server, yet routing lets them reach the whole clinical network. Which change
  BEST reduces the risk?
options:
  A: Require 802.1X authentication on the pump VLAN
  B: Allow pump traffic only to the dosage server via ACL
  C: Encrypt pump traffic to the dosage server with IPsec
  D: Place an IDS sensor on the pump VLAN's uplink
answer: B
explanation:
  why_correct: The weakness is that a compromised pump can reach far more than it needs. An access control list
    limiting the VLAN to the dosage server enforces least privilege at the network layer and shrinks the reachable
    attack surface.
  why_not:
    A: 802.1X controls which devices join, and port security already restricts that. It does not limit where a joined
      pump can go.
    C: Encryption protects the pump-to-server traffic but leaves the rest of the clinical network reachable from
      the VLAN.
    D: An IDS can detect misuse but does not stop a pump from reaching other systems. Restricting the path is the
      stronger fix.
