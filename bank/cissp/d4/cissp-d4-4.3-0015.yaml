id: cissp-d4-4.3-0015
subdomain: '4.3'
difficulty: hard
stem: A bank's web proxy now decrypts and inspects outbound TLS. Since then, a mobile-banking test app that pins its server's
  certificate fails, and a payment partner's API, which requires the bank's client certificate, rejects the bank's connections.
  Both destinations are fixed, known services. Which change BEST restores them while keeping control over the traffic?
options:
  A: Add the proxy's signing certificate to the trust stores of both applications
  B: Exempt the two destinations from decryption, filtering them by name and address
  C: Route the two applications around the proxy, directly to the internet
  D: Load the bank's client certificate onto the proxy to present to the partner
answer: B
explanation:
  why_correct: Certificate pinning and mutual TLS are designed to detect interception, so decryption breaks them by design.
    Exempting these known destinations from decryption keeps their traffic passing through the proxy, where its destination
    and volume are still controlled and logged, while the sessions stay end to end.
  why_not:
    A: Trusting the proxy's CA fixes ordinary applications, but a pinned app accepts only its expected certificate or key,
      and it does nothing for the partner, which still sees no client certificate from the bank.
    C: A direct route restores both, but the traffic then leaves without the proxy's filtering and logging, giving up the
      control the bank wants to keep.
    D: A proxy can present a client certificate for some services, but this puts a payment credential on a shared inspection
      device and does nothing for the pinned app.
