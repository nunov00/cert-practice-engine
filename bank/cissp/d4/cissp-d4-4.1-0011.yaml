difficulty: hard
stem: A hotel's guest Wi-Fi runs on its own VLAN, behind a firewall that separates it from the hotel's systems. A guest
  reported that another guest's laptop, joined to the same access point, scanned and attacked theirs over the Wi-Fi.
  Which control BEST prevents guest-to-guest attacks?
options:
  A: Opportunistic Wireless Encryption on the guest network
  B: Client isolation on the access points for the guest network
  C: Private VLAN settings on the switch ports serving the access points
  D: A captive portal where each guest accepts the terms of use
answer: B
explanation:
  why_correct: Traffic between two guests on the same access point is bridged by the access point itself. Client isolation
    tells the access point to drop frames between wireless clients, so guests can reach the internet but not each other.
  why_not:
    A: Opportunistic Wireless Encryption encrypts each guest's link to the access point, which stops passive sniffing, but
      the access point still forwards traffic from one guest to another.
    C: Private VLANs isolate switch ports, but two guests on the same access point share one port, and their traffic is
      bridged inside the access point without crossing the switch.
    D: Accepting terms of use sets rules and may deter misuse, but it does not stop one laptop sending traffic to another.
