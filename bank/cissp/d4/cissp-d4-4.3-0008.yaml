id: cissp-d4-4.3-0008
subdomain: "4.3"
difficulty: easy
stem: A payments partner's servers call a company's API with a static API key that does not expire. The key leaked in
  the partner's public code repository and was misused for a week before anyone noticed. The partner's servers run in a
  cloud whose outbound addresses change often. Which change BEST reduces the risk of a repeat?
options:
  A: Rotate the API key each month and keep it in a secrets vault
  B: Accept API calls only from the partner's published address ranges
  C: Issue short-lived tokens bound to the partner's TLS client certificate
  D: Issue 15-minute OAuth tokens for a client secret kept in the partner's vault
answer: C
explanation:
  why_correct: A credential that is stolen is useful until it expires. Tokens issued through mutual TLS and bound to the
    partner's certificate, with the API checking that binding on each call, last minutes and can be used or renewed only
    with the certificate's private key, which is not in the code, so a leaked token is soon useless.
  why_not:
    A: Monthly rotation shortens how long a leaked key works, but a key leaked early in the month is still usable for weeks.
    B: Address allowlisting fails here, because the partner's cloud addresses change often and the allowed ranges would be
      broad or stale.
    D: Short-lived tokens limit how long one stolen token works, but the client secret is itself a static credential that
      can leak from code or configuration just as the key did, and whoever holds it can keep requesting fresh tokens.
