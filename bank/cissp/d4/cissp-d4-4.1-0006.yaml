id: cissp-d4-4.1-0006
subdomain: '4.1'
difficulty: medium
stem: In a data centre built on software-defined networking, an attacker used a compromised monitoring server to call the
  controller's northbound API. The attacker installed flow rules that copied database traffic to a host under their control.
  Which control BEST prevents a repeat?
options:
  A: Protect the controller-to-switch channel with mutual TLS certificates
  B: Run the controller as a three-node cluster across racks
  C: Require per-application credentials and roles on the northbound API
  D: Alert when new flow rules send traffic to unexpected hosts
answer: C
explanation:
  why_correct: The attacker misused the controller's own management interface, which accepted rule changes from a host that
    had no need to make them. Authenticating each calling application and limiting what its role may change stops a monitoring
    server from installing forwarding rules.
  why_not:
    A: Mutual TLS protects the southbound channel against forged or intercepted switch instructions. Here the controller itself
      pushed the rules, so they travelled over the protected channel as legitimate.
    B: Clustering keeps the control plane running if a controller fails. Every node would still accept the same unauthorised
      API calls.
    D: Alerting on unusual flows may catch the copying quickly, but it is detective. The rules are installed and traffic is
      copied before anyone responds.
