id: cissp-d4-4.1-0013
subdomain: '4.1'
difficulty: hard
stem: A software company runs an API in its cloud network, and about 300 business customers call it from their own cloud networks.
  Customers want the traffic kept off the internet. Their security teams will not accept any routing that lets hosts in the
  provider's network open connections into their networks. Which design BEST meets this?
options:
  A: Network peering between the provider's network and each customer's network
  B: A transit hub that the customer networks attach to, with route filtering
  C: A private service endpoint that each customer creates in its own network
  D: Site-to-site IPsec tunnels from each customer network to the provider
answer: C
explanation:
  why_correct: A private endpoint places an address for the provider's API inside the customer's own network. Connections can
    only start from the customer side and reach only that one service, the traffic stays on the cloud's private backbone, and
    no route to the customer's network exists in the provider's network.
  why_not:
    A: Peering keeps traffic off the internet and is a common way to link two networks, but it routes in both directions, so
      the provider's hosts gain a path into each customer's network that only filtering rules hold back.
    B: A transit hub scales better than hundreds of peerings, but each attached network is routed through the hub, so paths
      into customer networks exist and depend on the filtering being right.
    D: IPsec tunnels encrypt the traffic and are widely used for partner links, but each tunnel is a two-way routed path, so
      hosts on the provider's side can open connections into the customer network.
