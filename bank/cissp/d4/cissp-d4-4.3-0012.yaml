id: cissp-d4-4.3-0012
subdomain: '4.3'
difficulty: medium
stem: A payments platform runs 60 microservices on one container cluster, written by eight teams in five languages. A new
  rule requires encryption of traffic between services and a record of which service called which. The platform team must
  meet it within a quarter without changes to the services' code. Which approach BEST fits?
options:
  A: IPsec tunnels between the cluster's nodes, run by the platform team
  B: Service mesh sidecars using mutual TLS with a certificate per service
  C: TLS in each service's code, with certificates from an internal CA
  D: Network policies that permit only the approved service-to-service flows
answer: B
explanation:
  why_correct: Mesh sidecars sit beside each service and handle the connection for it, so traffic is encrypted without code
    changes. Because each service has its own certificate, every connection is authenticated and logged with the identity of
    the calling and called service.
  why_not:
    A: Node-to-node IPsec encrypts traffic between machines without code changes, but its identity is the node, not the service,
      so it cannot show which service called which, and traffic between services on the same node is not covered.
    C: TLS built into each service meets both needs and is common in smaller estates, but it requires code changes in five
      languages across eight teams, which the rule's deadline excludes.
    D: Network policies restrict which services may talk, which is good practice, but they do not encrypt the traffic or record
      the calls.
