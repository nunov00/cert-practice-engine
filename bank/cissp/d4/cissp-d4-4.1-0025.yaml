subdomain: '4.1'
difficulty: hard
stem: A retailer's data-centre routers learn its cloud subnets over BGP sessions that run through two IPsec tunnels to the
  cloud provider's gateway, which several of its cloud accounts share. An engineer with admin rights in a development account
  mistakenly announced a more specific route inside the payroll servers' data-centre subnet, and for hours payroll traffic
  from the stores went into the cloud. Which change BEST prevents a repeat?
options:
  A: TCP-AO authentication on the BGP sessions with each cloud gateway
  B: Separate tunnels and BGP sessions for the development account
  C: Inbound route filters admitting only the cloud's assigned prefixes
  D: Alerts to the network team when routers learn new routes from the cloud
answer: C
explanation:
  why_correct: The bad route arrived over a genuine session from the company's own cloud, so nothing about the session was
    wrong; the routers simply believed whatever prefix it carried. Inbound filters that accept from the cloud sessions only
    the address ranges assigned to the cloud refuse a route inside a data-centre subnet, whoever announces it and whichever
    account it comes from.
  why_not:
    A: Session authentication stops an outsider forging or hijacking a BGP session, but this route came from the legitimate
      peer, so it was authenticated like any other.
    B: Separating the development account's sessions keeps its traffic apart and is sound design, but its own session would
      still be legitimate and unfiltered, so the same announcement would be accepted over it.
    D: Route alerts shorten the time to notice a bad announcement, but they act after the routers have accepted it and traffic
      has already moved.
