subdomain: '4.3'
difficulty: hard
stem: A company's boardroom video systems have public addresses and answer incoming calls automatically, so remote directors
  can join a meeting without anyone in the room working the touch panel. A researcher called one directly from the internet
  during a board meeting and listened unnoticed for twenty minutes. Which change BEST closes this exposure?
options:
  A: Inbound calls only through the company's video gateway, which admits callers to scheduled meetings
  B: Encryption required on each call the room systems accept, with unencrypted callers refused
  C: Room systems on their own VLAN, behind a firewall that passes only standard video-calling protocols
  D: Auto-answer turned off, so that someone in the room accepts each incoming call on the panel
answer: A
explanation:
  why_correct: The weakness is that anyone on the internet can place a call straight to the room systems and be answered.
    Registering them behind the company's video gateway, with no direct inbound path, means a caller reaches a room only by
    joining a meeting that the company scheduled, with its meeting ID and any PIN or lobby, so directors still join without
    anyone touching the panel.
  why_not:
    B: Encryption stops others listening in on a call, but the researcher was a party to the call, so an encrypted call from
      him is answered just the same.
    C: A separate VLAN and firewall keep other traffic away from the room systems, but they still pass video calls from anyone
      on the internet, which is how this call arrived.
    D: Turning off auto-answer stops unexpected calls connecting by themselves, but it means someone in the room must accept
      each call, which defeats how remote directors are meant to join.
