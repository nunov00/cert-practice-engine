id: cissp-d4-4.2-0010
subdomain: "4.2"
difficulty: medium
stem: A water plant must send readings from its control network historian to the corporate network every minute. Its
  safety case requires that no data or commands can ever travel from the corporate side into the control network, even
  if a corporate administrator's account is compromised. Which design BEST meets this?
options:
  A: A firewall rule set that allows only outbound connections from the historian
  B: A unidirectional gateway that physically sends data in one direction only
  C: A DMZ holding a replica historian that both networks connect to
  D: A site-to-site VPN that carries only historian traffic to corporate
answer: B
explanation:
  why_correct: The requirement is that nothing can flow into the control network whatever an administrator does. A
    unidirectional gateway enforces that in hardware, since there is no return path for data or commands, so no
    configuration change on the corporate side can open one.
  why_not:
    A: An outbound-only rule set allows return traffic on each connection and depends on configuration that a compromised
      administrator could change, so it cannot guarantee one-way flow.
    C: A DMZ replica is a sound design that limits direct connections, but both networks still exchange traffic with the
      DMZ, so a path into the control network can exist.
    D: A VPN encrypts and limits the traffic, but it is a two-way channel that an attacker on the corporate side could use
      to send data back.
