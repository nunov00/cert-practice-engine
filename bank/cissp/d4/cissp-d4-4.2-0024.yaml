subdomain: '4.2'
difficulty: medium
stem: Field engineers read company email and service manuals on their own phones, often at plant sites with no mobile
  signal. A works agreement bars the company from enrolling the phones in device management or seeing personal content,
  and company data must be removable from a phone when its owner leaves. Which endpoint control BEST fits?
options:
  A: App protection policies on the company's mail and document apps, with selective wipe
  B: Conditional access admitting only phones that pass app attestation, revoking sign-in tokens on exit
  C: A work profile on each phone, created and managed through the company's MDM
  D: Access only through a virtual desktop app, with no company data stored on the phone
answer: A
explanation:
  why_correct: App protection policies apply to the company's own apps rather than to the device. They can encrypt company
    data inside those apps, stop it being copied into personal apps and wipe it selectively when an engineer leaves, while
    the phone itself stays unenrolled and personal content stays out of the company's view. The data is held on the phone,
    so engineers can still read manuals where there is no signal.
  why_not:
    B: Conditional access with attestation needs no enrolment and revoking tokens blocks new access, but mail and manuals
      already cached on the phone stay there, so company data is not removed when the engineer leaves.
    C: A work profile keeps personal and company data apart and is a common answer for personal phones, but it is created
      by enrolling the phone in device management, which the agreement does not allow.
    D: A virtual desktop keeps company data off the phone and needs no device management, but it works only with a network
      connection, and the engineers often work where there is none.
