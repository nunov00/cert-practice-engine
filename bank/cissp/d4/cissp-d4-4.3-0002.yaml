id: cissp-d4-4.3-0002
subdomain: '4.3'
difficulty: hard
stem: A factory's control system vendor needs remote support access a few times a month. Today a site-to-site VPN from the
  vendor's office network stays up permanently. Attackers recently reached another of the vendor's customers through such
  a tunnel. Which change BEST reduces the risk?
options:
  A: Limit the tunnel with firewall rules to the control servers only
  B: Grant approved, recorded sessions through a jump host
  C: Monitor the tunnel's traffic with an industrial protocol IDS
  D: Give vendor technicians individual client VPN accounts with MFA
answer: B
explanation:
  why_correct: The risk is a standing path from a network the factory cannot control. Brokered, on-demand sessions through
    a jump host remove the permanent link, tie each session to a named person and an approval, and record what is done.
  why_not:
    A: Narrowing the rules shrinks what can be reached, yet the control servers are the very targets, and the link stays open
      to the vendor's whole network at all times.
    C: Monitoring may spot an attack in progress, but it is detective. It leaves the permanent link in place.
    D: Individual accounts with MFA add accountability, but access would still be available at any time without approval,
      which the few monthly visits do not need.
