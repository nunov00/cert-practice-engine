stem: An engineering firm is bringing in 150 contractors for a year, working from home on their own laptops. They need a desktop
  CAD application that opens models from an internal file server, and the client's contract requires that model files never
  leave the firm's systems. Which remote access design BEST fits?
options:
  A: A network VPN that firewall rules limit to the CAD file server
  B: An identity-aware proxy that publishes the file server's web portal
  C: A VPN that admits only laptops passing a disk-encryption posture check
  D: Hosted virtual desktops running CAD, with drive and clipboard sharing off
answer: D
explanation:
  why_correct: With virtual desktops, the CAD application runs on the firm's own servers and the contractor's laptop receives
    only screen images, so model files are opened and saved inside the firm's systems. Turning off drive and clipboard redirection
    stops users moving files out through the session, which the personal laptops themselves cannot be trusted to prevent.
  why_not:
    A: Limiting the VPN to the file server narrows what contractors can reach, but the CAD application runs on the laptop,
      so each model it opens is copied to a personal device.
    B: An identity-aware proxy avoids network-level access and suits web applications, but the CAD application is a desktop
      program, so models would be downloaded to the laptop to be opened.
    C: A posture check means files land on encrypted disks, but they still land on contractors' own laptops, outside the firm's
      systems, which the contract forbids.
