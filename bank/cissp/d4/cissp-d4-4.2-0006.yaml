id: cissp-d4-4.2-0006
subdomain: '4.2'
difficulty: medium
stem: A company's switches are managed over the same VLAN that carries user traffic. A penetration tester on a user port took
  over a switch through a flaw in its web management interface, and the vendor's patch is now installed. Which change BEST
  reduces the risk of a similar compromise in future?
options:
  A: Disable the web interface and manage the switches over SSH only
  B: Apply port security that limits each user port to one MAC address
  C: Put management interfaces on a separate network reachable only from admin jump hosts
  D: Subscribe to vendor advisories and patch switch firmware within a set deadline
answer: C
explanation:
  why_correct: The underlying exposure is that management services can be reached from any user port. Moving them to an isolated
    management network, reached through controlled jump hosts, removes that path for every current and future management flaw.
  why_not:
    A: Turning off the web interface removes one service, but SSH and any other management service stay reachable from user
      ports, so the next flaw in them is exposed the same way.
    B: Port security limits which devices can use a port, but the tester's own device on a permitted port can still reach
      the management interfaces.
    D: Faster patching shortens the window for known flaws, which matters, but the tester's point is about flaws before a
      patch exists. Reachability is the problem.
