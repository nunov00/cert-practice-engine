id: cissp-d4-4.3-0025
subdomain: '4.3'
difficulty: medium
stem: Staff at an insurer reach internal applications through a VPN that requires a password and a push approval on their
  phones. Attackers emailed staff a link to a page that relayed the real VPN sign-in in real time, including the push prompt,
  and used each resulting session within a minute of the approval. Several staff approved the prompt they had triggered themselves.
  Which change BEST prevents this?
options:
  A: Number matching on the push MFA prompts for VPN sign-in
  B: Conditional access requiring sign-in from each user's usual country
  C: VPN sessions limited to one hour before re-authentication is needed
  D: FIDO2 security keys for VPN sign-in, in place of push MFA
answer: D
explanation:
  why_correct: The staff were signing in for real, so any factor they can complete on a relayed page is passed on with it.
    A FIDO2 key signs a challenge bound to the web origin it is talking to, so on the attackers' relay page it produces nothing
    the real portal will accept, and the relay gets no session.
  why_not:
    A: Number matching stops users approving prompts they did not start, but these staff started the sign-in themselves, and
      the relay page shows them the number to enter.
    B: Country rules block sign-ins from unusual places, but a relay can run from hosts in the users' own country, and it
      hands over a session the user has just authenticated.
    C: Shorter sessions limit how long a stolen session lasts, but the attackers used each session within a minute, well inside
      any practical lifetime.
