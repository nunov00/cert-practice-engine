id: cissp-d4-4.1-0002
subdomain: '4.1'
difficulty: medium
stem: A company's offices run IPv4 only, but laptops keep IPv6 enabled because an IPv6 rollout begins next year. A tester
  on a user port sent router advertisements, became the laptops' IPv6 gateway, and intercepted their traffic. Which control
  BEST prevents this?
options:
  A: Enable DHCP snooping on the access switches
  B: Enable dynamic ARP inspection on the access switches
  C: Filter IPv6 traffic at the internet firewall
  D: Enable RA Guard on the access switches
answer: D
explanation:
  why_correct: The attack uses rogue IPv6 router advertisements on the local segment. RA Guard lets switches drop router advertisements
    from user ports, so laptops accept a gateway only from real routers, and it keeps working once IPv6 is rolled out.
  why_not:
    A: DHCP snooping blocks rogue IPv4 DHCP servers. IPv6 hosts here configure themselves from router advertisements, which
      it does not inspect.
    B: Dynamic ARP inspection stops IPv4 ARP spoofing. IPv6 uses neighbour discovery and router advertisements instead of
      ARP.
    C: Firewall filtering at the internet edge does not touch traffic between hosts on the same local segment, where this
      attack takes place.
