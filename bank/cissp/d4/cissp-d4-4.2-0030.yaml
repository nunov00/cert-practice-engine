id: cissp-d4-4.2-0030
subdomain: '4.2'
difficulty: hard
stem: A chemical plant's control network carries the same few hundred conversations between operator stations, controllers
  and one engineering workstation, day after day. A review found that an intruder on that workstation could use the vendor's
  own engineering software to change controller logic. Plant rules forbid adding any inline device that could interrupt control
  traffic. Which control BEST detects such an attack?
options:
  A: A passive IDS loaded with published industrial attack signatures
  B: Passive monitoring that learns normal traffic and alerts on new logic downloads
  C: An industrial firewall that passes logic writes only from the engineering workstation
  D: An endpoint detection agent on the engineering workstation, reporting to the SOC
answer: B
explanation:
  why_correct: In a network this repetitive, almost anything new stands out. Passive monitoring that learns the plant's normal
    conversations, and alerts on logic downloads or commands it has not seen before, catches the attack even though it uses
    the vendor's genuine software, and it watches a copy of the traffic, so it cannot interrupt control.
  why_not:
    A: A signature IDS is passive and catches known attack tools, but an intruder using the vendor's own engineering software
      sends genuine commands that match no attack signature.
    C: An industrial firewall can limit logic writes by source, but this intruder would be on the workstation that is allowed
      to write, and the firewall sits inline, which plant rules forbid.
    D: An endpoint agent watches the workstation for malicious programs, but the vendor's engineering software is approved
      and expected there, so using it to change logic looks like normal work.
