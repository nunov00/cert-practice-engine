id: cissp-d4-4.1-0030
subdomain: '4.1'
difficulty: medium
stem: A gas utility's 1,200 pressure-station RTUs reach its SCADA servers through a carrier's private mobile network, which
  carries traffic only from the utility's SIMs. A tester opened the cabinet at an unstaffed station, moved its SIM into his
  own modem and reached the SCADA servers. Which design change BEST prevents this?
options:
  A: Carrier binding of each SIM to its modem's IMEI, refusing the SIM in any other device
  B: A carrier check of a username and password, set in each RTU's modem, at each connection
  C: IPsec from each RTU, authenticated with a key held in the RTU's secure chip
  D: IPsec from each RTU's modem, with a pre-shared key set in its configuration
answer: C
explanation:
  why_correct: The private network trusts the SIM and whatever it is in, so whoever holds the SIM is treated as the station.
    Mutually authenticated IPsec from each RTU, with a key that cannot be read out of the RTU's secure chip, makes the SCADA
    side accept only traffic from the genuine device, so a SIM in another modem, or the genuine modem without its RTU,
    reaches nothing.
  why_not:
    A: IMEI binding stops a SIM working in a casual stranger's phone, but the IMEI is reported by the modem itself. A tester
      with the cabinet open can copy the genuine modem's IMEI onto his own, as many modems allow, or simply connect his
      laptop to the genuine modem.
    B: Per-modem credentials add a second check, but they are stored in the modem's configuration in the same open cabinet,
      where the tester can read them, or he can use the genuine modem that already holds them.
    D: IPsec would stop a SIM moved into a modem without the key, but a pre-shared key set in the modem's configuration sits
      in the same open cabinet, where the tester can read it or simply use the genuine modem, which brings up the tunnel
      for him.
